term: intrinsic motivation
id: intrinsic-motivation
pos: n.
also:
  - intrinsic reward
  - curiosity
  - curiosity-driven exploration
  - exploration bonus
  - count-based exploration
  - intrinsically motivated reinforcement learning
domain: rl
domains:
  - mind
level: specialist
plain: >-
  Giving an AI agent an inner drive — such as curiosity about surprising things — so it keeps
  exploring and learning even when the task itself offers no reward yet.
senses:
  - definition: >-
      In [[reinforcement-learning|reinforcement learning]], the use of reward signals generated by
      the agent itself rather than by the task — for novelty, surprise, learning progress,
      competence or control over the environment — to drive exploration and skill acquisition,
      especially when external rewards are [[sparse-reward|sparse]] or absent. Common forms include
      count-based bonuses for visiting rarely seen states (extended to large spaces with
      pseudo-counts), prediction-error curiosity that pays where a learned dynamics model is wrong
      (the Intrinsic Curiosity Module; Random Network Distillation), information gain about a
      [[world-model|world model]], and empowerment. Intrinsic rewards are usually added to the
      extrinsic reward with a weight. A known failure is the 'noisy TV' problem: an agent paid for
      unpredictability can be captivated by pure randomness, so better methods reward learnable
      novelty. Random Network Distillation (2018) was reported by its authors as the first method to
      exceed average human performance on the hard-exploration Atari game Montezuma's Revenge
      without demonstrations or access to the game's internal state.
    example: >-
      With a curiosity bonus the agent explored the whole maze before it ever found the exit reward.
origin: >-
  The psychological concept — activity pursued for its own sake — was developed by Robert White
  (1959) and by Edward Deci and Richard Ryan from the 1970s. Jürgen Schmidhuber built curiosity
  rewards into learning agents in 1991, and Satinder Singh, Andrew Barto and Nuttapong Chentanez's
  'Intrinsically Motivated Reinforcement Learning' (NIPS 2004) named the RL research program.
year: 1991
note: >-
  Psychology contrasts intrinsic with extrinsic motivation (acting for external rewards). RL borrows
  the distinction loosely: an 'intrinsic' reward is still a formula chosen by a designer.
