term: hyperscaler
id: hyperscaler
pos: n.
also:
  - hyperscale cloud provider
  - hyperscalers
domain: hw
domains:
  - society
level: core
plain: >-
  One of the few giant technology companies — such as Amazon, Microsoft, Google and Meta — that run
  vast networks of data centers and spend most of the money that builds AI computing.
senses:
  - definition: >-
      A company that operates computing infrastructure at 'hyperscale' — fleets of very large data
      centers designed to add servers, storage and networking smoothly as demand grows — usually as
      a public cloud provider. In AI discussions the word mainly denotes Amazon Web Services,
      Microsoft Azure and Google Cloud, often with Meta and sometimes Oracle, whose combined capital
      spending on [[ai-data-center|AI data centers]], chips and power became a central indicator of
      the AI boom in 2024–2026. Hyperscalers design their own accelerators (such as Google's
      [[tpu|TPUs]] and Amazon's Trainium), supply computing to AI laboratories in exchange for
      investment stakes, and increasingly contract extra capacity from [[neocloud|neoclouds]].
    example: Chip stocks rallied after all four hyperscalers raised their capex guidance.
origin: >-
  From 'hyperscale', used in the data-center industry for architectures that scale out across very
  large numbers of servers; 'hyperscaler' for the largest cloud operators was established by the
  2010s and became everyday financial vocabulary during the AI investment surge of the 2020s.
