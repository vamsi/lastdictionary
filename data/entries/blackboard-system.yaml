      Erman, L. D., Hayes-Roth, F., Lesser, V. R. & Reddy, D. R. (1980). The Hearsay-II
      Speech-Understanding System: Integrating Knowledge to Resolve Uncertainty. ACM Computing
      Surveys 12(2), 213–253.
  - text: Nii, H. P. (1986). Blackboard Systems. AI Magazine 7(2), 38–53 and 7(3), 82–106.
