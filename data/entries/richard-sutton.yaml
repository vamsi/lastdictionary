level: core
dates: b. 1957 or 1958
plain: >-
  A Canadian computer scientist who, with Andrew Barto, laid the groundwork for teaching machines by
  trial, error and reward, and whose essay 'The Bitter Lesson' argues that methods that scale with
  computing power always win.
senses:
  - definition: >-
      American-born Canadian computer scientist who, with his doctoral adviser and longtime
      collaborator [[andrew-barto|Andrew Barto]], built much of the theory and many of the core
      algorithms of modern [[reinforcement-learning|reinforcement learning]]. In his doctoral work
      with Barto at the University of Massachusetts Amherst and in a 1988 paper he developed
      [[temporal-difference-learning|temporal difference learning]], in which predictions are
      updated toward later predictions, and with Barto he introduced [[actor-critic|actor–critic]]
      methods (1983). Later contributions include the Dyna architecture combining learning and
      planning (1990), the options framework for [[hierarchical-reinforcement-learning|hierarchical
      reinforcement learning]] (1999) and the [[policy-gradient|policy gradient]] theorem (with
      David McAllester, Satinder Singh and Yishay Mansour, 2000). Their textbook 'Reinforcement
      Learning: An Introduction' (1998; 2nd ed. 2018) defined the field. A professor at the
      University of Alberta since 2003, he has also worked at DeepMind and at Keen Technologies. His
      essay '[[the-bitter-lesson|The Bitter Lesson]]' (2019) argued that general methods that
      exploit growing computation beat built-in human knowledge. He shared the 2024
      [[turing-award|Turing Award]] with Barto.
