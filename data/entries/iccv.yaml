plain: >-
  A major international computer vision conference, held in odd-numbered years, where much of the
  research on how machines interpret images and video is first presented.
senses:
  - definition: >-
      The IEEE/CVF International Conference on Computer Vision, which meets in odd-numbered years
      and, with [[cvpr|CVPR]], publishes the most selective and most cited work in
      [[computer-vision|computer vision]]; its best-paper award, the Marr Prize, is named after the
      vision scientist David Marr. Notable ICCV papers include Mask R-CNN (2017), which extended
      [[object-detection|object detection]] to outlining individual objects, CycleGAN (2017) for
      unpaired image-to-image translation, the Swin Transformer (2021), the
      [[segment-anything-model|Segment Anything Model]] (2023) and ControlNet (2023), a method for
      conditioning [[diffusion-model|diffusion models]] on sketches, poses or edges. The European
      Conference on Computer Vision (ECCV), first held in 1990, meets in even-numbered years, so one
      of the two takes place alongside CVPR each year.
origin: >-
  First held in 1987 in London under the sponsorship of the IEEE Computer Society; the Computer
  Vision Foundation later became co-sponsor.
year: 1987
