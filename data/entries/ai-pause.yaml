labels:
  - contested
level: core
plain: >-
  A proposed halt, temporary or indefinite, on building AI systems more powerful than today's, to
  give safety research and regulation time to catch up.
senses:
  - definition: >-
      A proposed halt, temporary or open-ended, voluntary or legally enforced, on training or
      deploying AI systems beyond a given capability or compute level, intended to give alignment
      research, evaluation and governance time to catch up. Proposals differ widely. The March 2023
      open letter [[pause-giant-ai-experiments|Pause Giant AI Experiments]] sought a halt of at
      least six months in training anything more capable than [[gpt-4|GPT-4]]; Eliezer Yudkowsky
      argued in Time the same month for an indefinite international moratorium, enforced if
      necessary against rogue data centers; the activist group PauseAI campaigns for an
      international treaty; conditional proposals would pause only when dangerous capabilities are
      detected, as in [[if-then-commitment|if-then commitments]]; and the October 2025
      [[statement-on-superintelligence|Statement on Superintelligence]] asked for a ban on
      developing superintelligence until scientists broadly agree it can be made safe and the public
      strongly backs it. Objections include enforceability, the advantage a pause could hand to
      non-participating countries, and [[compute-overhang|compute overhang]]: a sudden jump in
      capability when a pause ends.
    example: >-
      A conditional pause only bites if the evaluations can actually detect the capability in time.
origin: >-
  Calls to slow AI development are decades old, but the term became current with the Future of Life
  Institute's open letter of 22 March 2023, signed by tens of thousands of people including Yoshua
  Bengio, Stuart Russell and Elon Musk. PauseAI was founded in May 2023 by Joep Meindertsma.
year: 2023
