term: Mechanical Turk
id: mechanical-turk
pos: prop. n.
also:
  - the Turk
  - Automaton Chess Player
domain: hist
domains:
  - culture
  - society
labels:
  - historical
level: specialist
plain: >-
  A famous fake chess-playing machine from 1770: a robed figure that seemed to play chess by itself
  but hid a human player inside. Its name now stands for 'AI' that is really people working behind
  the scenes.
senses:
  - context: History
    definition: >-
      An apparent chess-playing automaton built by Wolfgang von Kempelen for the Habsburg court in
      Vienna and unveiled in 1770: a life-size figure in Ottoman costume, seated behind a cabinet,
      that took on human challengers and seemed to play strong chess. The games were really run by a
      skilled player hidden in the cabinet, who tracked the pieces through magnets beneath the board
      and worked the figure's arm with levers, while the exhibitor's show of clockwork drew
      attention away from him. Toured on and off through Europe and the Americas for over eighty
      years, it is said to have faced Benjamin Franklin and Napoleon Bonaparte, and it fed early
      arguments over whether a machine could reason; Edgar Allan Poe's 1836 essay 'Maelzel's
      Chess-Player' argued that it had to be a hoax. A fire in Philadelphia destroyed it in 1854.
  - context: Figurative
    definition: >-
      By extension, a system presented as automated or AI-driven whose work is secretly or largely
      done by people; when done openly in research, the technique is called Wizard-of-Oz
      prototyping. Amazon named its 2005 crowdsourcing marketplace, [[amazon-mechanical-turk|Amazon
      Mechanical Turk]], after the automaton, describing the human workers it supplies as
      'artificial artificial intelligence'.
    example: >-
      The AI receptionist turned out to be a mechanical turk: a call center reading from a script.
    labels:
      - figurative
origin: >-
  Kempelen built it in 1769–1770 to impress Empress Maria Theresa; after his death it was bought and
  exhibited by Johann Nepomuk Maelzel. 'Turk' reflects the figure's costume, a product of
  eighteenth-century European fascination with the Ottoman world.
year: 1770
note: >-
  The story prefigures modern debates about hidden human labor behind AI, such as data annotation
  and remote operation of robots marketed as autonomous; see also [[ai-washing|AI washing]].
