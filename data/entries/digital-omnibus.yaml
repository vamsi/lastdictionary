plain: >-
  A European Union package, proposed in 2025, that simplified and delayed parts of its digital rules
  — above all pushing back the strictest requirements of the EU AI Act by more than a year.
senses:
  - definition: >-
      The European Commission's package of 19 November 2025 for simplifying EU digital law, made up
      of two proposals: a 'Digital Omnibus on AI' amending the [[eu-ai-act|EU AI Act]], and a
      broader Digital Omnibus amending the [[general-data-protection-regulation|General Data
      Protection Regulation]], the ePrivacy rules, the Data Act and cybersecurity incident
      reporting. The AI part became Regulation (EU) 2026/1744 of 8 July 2026, in force from 27 July
      2026. It postpones obligations for [[high-risk-ai-system|high-risk systems]] to 2 December
      2027 (Annex III uses) and 2 August 2028 (products under Annex I); turns the AI-literacy duty
      into a duty to support literacy; lets providers and deployers process sensitive personal data
      to detect and correct bias; extends relief for small firms to small mid-cap companies; makes
      the [[ai-office|AI Office]] the exclusive supervisor of AI systems built on a provider's own
      [[general-purpose-ai-model|general-purpose AI model]] and of AI in very large online
      platforms; moves the deadline for national [[ai-regulatory-sandbox|sandboxes]] to 2 August
      2027; and adds two [[prohibited-ai-practices|prohibited AI practices]], applying from 2
      December 2026, covering non-consensual intimate imagery and child sexual abuse material.
    example: >-
      After the Digital Omnibus, our Annex III compliance deadline moved to December 2027.
origin: >-
  Part of the Commission's 2025 simplification agenda, which followed Mario Draghi's September 2024
  report on European competitiveness and its criticism of the regulatory burden on firms. The AI
  omnibus passed unusually fast — the Parliament voted on 16 June 2026 and the Council on 29 June —
  so that the delay took effect before the original 2 August 2026 deadline for high-risk
  obligations.
year: 2025
note: >-
  Supporters call it overdue repair, since [[harmonised-standards|harmonised standards]] and
  guidance were not ready in time; critics call it deregulation under industry and US pressure. As
  of mid-October 2026 the separate data omnibus — which would, among other things, recognize AI
  development as a legitimate interest under the GDPR — had not yet reached trilogue negotiations.
  'Omnibus' is EU jargon for one act amending several laws.
