plain: >-
  OpenAI's flagship AI model from August 2025, which decides by itself whether to answer quickly or
  think longer. It replaced earlier models in ChatGPT and was followed by frequent upgrades.
senses:
  - definition: >-
      A [[large-language-model|large language model]] system released by [[openai|OpenAI]] on 7
      August 2025 that merged its GPT line with its o-series [[reasoning-model|reasoning models]].
      Inside ChatGPT, an automatic router decides for each message whether a quick model will do or
      whether to pass it to a slower 'thinking' model, weighing whether the user has asked for
      careful reasoning, how hard the request looks and what sort of conversation it is; API
      customers instead pick a size (GPT-5, mini or nano) and set the reasoning effort themselves.
      OpenAI reported large gains in coding, mathematics and health questions and reductions in
      [[hallucination|hallucination]] and [[sycophancy|sycophancy]], and made GPT-5 the default for
      all ChatGPT users. The simultaneous removal of [[gpt-4o|GPT-4o]] provoked a user backlash, and
      OpenAI restored it for paying subscribers within days. Point releases followed at a fast pace
      — GPT-5.1 in November 2025, GPT-5.2 in December 2025 and later versions including GPT-5.5 by
      mid-2026 — before OpenAI released GPT-6 in early September 2026.
    example: >-
      The router answered my quick question instantly, but GPT-5 thought for a minute about the
      proof.
origin: >-
  Long anticipated after [[gpt-4|GPT-4]] (2023); Sam Altman had described it as the release that
  would unify the GPT and o-series lines. Announced in a livestream on 7 August 2025, two days after
  OpenAI released its first open-weight models since GPT-2, the gpt-oss family.
year: 2025
note: >-
  Reactions were mixed: benchmark gains were real, but many users had expected a larger leap, and
  the launch fed debate over whether progress was slowing; others pointed to its gains in agentic
  coding and in efficient use of reasoning.
