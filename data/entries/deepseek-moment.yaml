term: DeepSeek moment
id: deepseek-moment
pos: n.
also:
  - DeepSeek shock
  - AI's Sputnik moment
domain: hist
domains:
  - society
  - gov
labels:
  - informal
level: core
plain: >-
  The shock of January 2025, when a little-known Chinese company released a free AI model nearly as
  good as the best American ones at a fraction of the reported cost, briefly wiping hundreds of
  billions off chip stocks.
senses:
  - context: History
    definition: >-
      The market and political reaction in late January 2025 to [[deepseek-r1|DeepSeek-R1]], an
      [[open-weight-model|open-weight]] [[reasoning-model|reasoning model]] from the Chinese company
      [[deepseek|DeepSeek]] that approached the performance of [[openai-o1|OpenAI o1]] on
      mathematics and coding benchmarks. Together with DeepSeek's statement that the final training
      run of its V3 base model had cost only about US$5.6 million in rented GPU time, the release
      challenged assumptions that frontier AI required ever-larger budgets and that US
      [[export-controls-on-ai-chips|export controls on AI chips]] had left Chinese laboratories far
      behind. On 27 January 2025, as DeepSeek's chatbot topped Apple's US App Store, Nvidia's share
      price fell about 17 percent, erasing roughly US$590 billion in market value, then the largest
      one-day loss of market value for any company in US stock-market history.
  - context: Figurative
    definition: >-
      By extension, any sudden demonstration that a cheaper or unexpected competitor — often an
      open-weight or Chinese model — can match the leaders, forcing a reassessment of competitive
      positions, prices or policy.
    example: >-
      Analysts asked whether the new open robotics model would be the field's DeepSeek moment.
origin: >-
  The investor Marc Andreessen called R1 'AI's Sputnik moment' on 26 January 2025, and 'DeepSeek
  moment' became the usual label in news and policy writing within days.
year: 2025
note: >-
  The US$5.6 million figure covered only the final V3 training run, not research, earlier
  experiments or hardware, and comparisons with US laboratories' total spending were widely
  criticized as misleading. Nvidia's shares recovered within months.
