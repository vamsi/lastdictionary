term: AI timelines
id: ai-timelines
pos: n.
also:
  - AGI timelines
  - timelines
  - short timelines
  - long timelines
domain: asi
domains:
  - eval
  - society
level: core
plain: >-
  Forecasts of when AI will reach major milestones, such as matching humans at most work. People
  with short timelines expect this within years; others expect decades, or never.
senses:
  - definition: >-
      Forecasts of when AI systems will reach specified capability milestones, most often
      [[artificial-general-intelligence|AGI]], [[transformative-ai|transformative AI]],
      [[high-level-machine-intelligence|high-level machine intelligence]] or the full automation of
      AI research. Methods include expert surveys, which show wide dispersion and strong sensitivity
      to question wording; aggregated forecasts on prediction platforms such as Metaculus;
      extrapolation of trends in training [[compute|compute]], algorithmic efficiency and benchmark
      results, notably the length of tasks that AI agents complete autonomously
      ([[metr-time-horizon|METR time horizon]]); and compute-anchored models such as
      [[biological-anchors|biological anchors]]. Short timelines usually means AGI expected within
      about five to ten years. Between 2020 and 2025, median forecasts from most of these sources
      moved markedly earlier, and several frontier-lab leaders publicly predicted systems matching
      top human experts by 2026–2030; other researchers expect bottlenecks in data, reliability and
      learning from real-world experience to push such milestones decades out. Timelines set the
      urgency of policy but are logically independent of [[takeoff|takeoff]] speed.
    example: Her timelines got shorter after agents started finishing day-long tasks.
origin: >-
  Predictions of human-level AI are as old as the field, such as Herbert Simon's 1965 forecast that
  machines would do any human work within twenty years. As a plural noun for AGI forecasts,
  'timelines' became standard in effective-altruist and AI-safety circles in the 2010s, through AI
  Impacts, Open Philanthropy and LessWrong.
