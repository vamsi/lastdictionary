# yaml-language-server: $schema=../schema/entry.schema.json

term: artificial intelligence
id: artificial-intelligence
pos: n.
also:
  - AI
  - A.I.
domain: core
domains:
  - hist
  - gov
  - mind
level: essential
plain: >-
  Computer systems that do things we would normally credit to a thinking mind, such as holding a
  conversation, reading an X-ray or planning a route, and the field of research that builds them.
senses:
  - context: Field
    definition: >-
      The branch of computer science, overlapping with cognitive science, statistics and
      engineering, devoted to machines that perceive, communicate in language, reason, plan, learn
      and act purposefully, and to the theory of how such abilities can be computed. Textbook
      definitions differ in emphasis (thinking or acting, humanlike or rational); the influential
      framing of Stuart Russell and Peter Norvig treats AI as the study of
      [[intelligent-agent|agents]] that act to achieve the best expected outcome. The field's
      methods have swung between [[symbolic-ai|symbolic AI]] (hand-written rules and logic) and
      statistical learning. Since the 2010s it has been dominated by [[machine-learning|machine
      learning]], especially [[deep-learning|deep learning]] and, from about 2020,
      [[large-language-model|large language models]]. Major subfields include
      [[computer-vision|computer vision]], [[natural-language-processing|natural language
      processing]], [[robotics|robotics]], [[automated-planning|planning]],
      [[knowledge-representation|knowledge representation]] and
      [[reinforcement-learning|reinforcement learning]].
    example: >-
      She moved from physics into artificial intelligence to work on protein-structure prediction.
  - context: Systems
    definition: >-
      A machine or program exhibiting such abilities, or such abilities collectively; also a count
      noun ('an AI', 'AIs') for an individual system, assistant or agent. In everyday and commercial
      speech the word now usually means [[generative-ai|generative AI]] products built on
      [[large-language-model|large language models]], but it is applied loosely to any software that
      uses [[machine-learning|machine learning]], or even plain automation, a looseness criticized
      as [[ai-washing|AI washing]].
    example: The company says an AI now handles first-line customer queries.
  - context: Law
    definition: >-
      In statutes and standards, AI is usually defined as a kind of system rather than a discipline.
      In United States federal law (15 U.S.C. § 9401(3)) it is a machine-based system that, pursuing
      objectives set by humans, can 'make predictions, recommendations or decisions influencing real
      or virtual environments'. The [[eu-ai-act|EU AI Act]] and the OECD instead define an
      [[ai-system|AI system]], whose distinguishing trait is inference: it derives from its inputs
      how to produce outputs, rather than only executing rules written entirely by people.
    labels:
      - legal
origin: >-
  Coined by John McCarthy in 'A Proposal for the Dartmouth Summer Research Project on Artificial
  Intelligence' (31 August 1955), written with Marvin Minsky, Nathaniel Rochester and Claude
  Shannon; the [[dartmouth-workshop|Dartmouth workshop]] of summer 1956 launched the field under
  that name. McCarthy later recalled choosing the term partly to set the new field apart from
  [[cybernetics|cybernetics]] and automata theory. Alan Turing's earlier writing (1948–1950) spoke
  of intelligent machinery and thinking machines.
year: 1955
note: >-
  Definitions are notoriously unstable: once a task is solved it often stops being called AI (the
  [[ai-effect|AI effect]]). Not to be confused with [[artificial-general-intelligence|artificial
  general intelligence]], a system matching or exceeding humans across most cognitive tasks; whether
  any current system qualifies is disputed. Since [[executive-order-14434|Executive Order 14434]]
  (29 September 2026), US federal agencies are directed to use 'Super Intelligence' (SI) in place of
  'artificial intelligence' in their non-statutory communications; the statutory definition is
  unchanged.
