term: CoRL
id: corl
pos: prop. n.
also:
  - Conference on Robot Learning
pronunciation: KOR-ul
domain: orgs
domains:
  - robot
level: specialist
plain: >-
  A yearly academic conference, started in 2017, for research where robotics meets machine learning.
senses:
  - definition: >-
      The Conference on Robot Learning, a yearly peer-reviewed meeting for work that uses
      [[machine-learning|machine learning]] to make robots perceive and act, covering
      [[robot-learning|robot learning]], [[imitation-learning|imitation learning]],
      [[reinforcement-learning|reinforcement learning]] for control, perception for manipulation and
      locomotion, [[sim-to-real-transfer|sim-to-real transfer]] and, increasingly,
      [[robot-foundation-model|robot foundation models]] and
      [[vision-language-action-model|vision-language-action models]]. It was created because
      robot-learning papers fit poorly both in traditional robotics conferences such as
      [[icra|ICRA]], which emphasize systems, and in machine learning conferences, which emphasize
      benchmarks. Its papers are published in the Proceedings of Machine Learning Research, and it
      has grown rapidly with the rise of learning-based robotics.
origin: >-
  First held in November 2017 in Mountain View, California, hosted by Google and organized by
  robot-learning researchers from Google, the University of California, Berkeley, and other
  institutions.
year: 2017
see_also:
  - robot learning
  - ICRA
  - vision-language-action model
  - imitation learning
  - sim-to-real transfer
as_of: 2026-10
