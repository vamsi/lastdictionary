# yaml-language-server: $schema=../schema/entry.schema.json

term: trajectory
id: trajectory
pos: n.
also:
  - τ
  - state–action trajectory
domain: rl
domains:
  - robot
  - train
level: core
plain: >-
  The record of what happened as an AI agent acted: the sequence of situations it was in, the
  actions it took and the rewards it received.
senses:
  - context: Reinforcement learning
    definition: >-
      A sequence of [[state|states]], [[action|actions]] and [[reward|rewards]], τ = (s₀, a₀, r₁,
      s₁, a₁, r₂, …), generated by running a [[policy|policy]] in an [[environment|environment]]:
      either a complete [[episode|episode]] or a segment of one. Trajectories are the raw data of
      reinforcement learning: [[policy-gradient|policy gradient]] methods weight the
      log-probabilities of each trajectory's actions by its [[return|return]], off-policy methods
      store its transitions in a [[experience-replay|replay buffer]], and
      [[imitation-learning|imitation learning]] trains on expert trajectories. In language-model
      training a trajectory comprises the prompt, the generated reasoning and answer, any
      [[tool-call|tool calls]] and their results, and the final reward; agent trajectories are also
      read by engineers to diagnose failures.
    example: >-
      We sampled 64 trajectories per prompt and kept only those that ended with a passing test.
  - context: Robotics and control
    definition: >-
      A path through state space as a function of time — the positions, velocities and often forces
      a robot or vehicle should follow — computed by a planner or by
      [[trajectory-optimization|trajectory optimization]] and tracked by a feedback controller.
origin: >-
  From the Latin trajectus, 'thrown across'; long used in mechanics for the path of a projectile and
  in control theory for a system's path through state space. RL adopted the word for sampled
  interaction sequences, and the symbol τ became common in policy-gradient papers of the 2010s.
see_also:
  - episode
  - rollout
  - return
  - experience replay
  - policy gradient
  - trajectory optimization
