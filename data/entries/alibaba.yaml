plain: >-
  A Chinese e-commerce and cloud-computing giant whose Qwen family of AI models, mostly free to
  download, is among the most widely used in the world.
senses:
  - definition: >-
      A Chinese technology conglomerate in e-commerce, payments and logistics whose cloud division,
      Alibaba Cloud, is China's largest cloud provider and the developer of the [[qwen|Qwen]]
      (Tongyi Qianwen) family of [[large-language-model|large language models]]. Since releasing the
      weights of Qwen-7B in August 2023 it has published many [[open-weight-model|open-weight
      models]], mostly under the Apache 2.0 license, ranging from under a billion to hundreds of
      billions of parameters and covering text, vision, audio and code, alongside proprietary
      flagships such as Qwen3-Max (2025). By 2025 Qwen had overtaken Llama as the most common base
      for derivative models on [[hugging-face|Hugging Face]], making Alibaba central to the global
      spread of Chinese open models. It also releases the Wan video-generation models and has
      invested in Chinese AI startups including [[moonshot-ai|Moonshot AI]].
origin: >-
  Founded in 1999 in Hangzhou by Jack Ma and 17 co-founders as a business-to-business trading
  website; Alibaba Cloud (Aliyun) was set up in 2009. A beta of the Tongyi Qianwen chatbot appeared
  in April 2023.
year: 1999
