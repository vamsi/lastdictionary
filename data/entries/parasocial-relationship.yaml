term: parasocial relationship
id: parasocial-relationship
pos: n.
also:
  - parasocial
  - parasocial interaction
  - para-social relationship
domain: society
domains:
  - culture
  - mind
level: core
plain: >-
  A one-sided bond in which someone feels close to a person or character who does not really know
  them, like a fan with a celebrity, and now increasingly with chatbots.
senses:
  - definition: >-
      A one-sided, imagined relationship in which a person develops feelings of intimacy, friendship
      or loyalty toward a media figure, such as a celebrity, influencer, fictional character or,
      increasingly, an AI persona, that does not know them or reciprocate in kind. Parasocial
      interaction is the illusion of conversation during viewing; the parasocial relationship is the
      lasting bond that results. Conversational AI strains the classic definition because it does
      respond, personally and at any hour, while lacking the needs, stakes and independent life of a
      human partner, so researchers debate whether bonds with [[ai-companion|AI companions]] are
      parasocial, social or something new. Such bonds can comfort lonely people but can also foster
      dependence and commercial exploitation of attachment.
    example: >-
      Users mourned the retired model version like a lost friend, a measure of how parasocial the
      relationship had become.
origin: >-
  Introduced by sociologists Donald Horton and R. Richard Wohl in 'Mass Communication and
  Para-Social Interaction: Observations on Intimacy at a Distance' (Psychiatry, 1956), about radio
  and television personalities. Cambridge Dictionary named 'parasocial' its Word of the Year for
  2025, citing bonds with influencers and AI chatbots.
year: 1956
see_also:
  - AI companion
  - anthropomorphism
  - ELIZA effect
  - AI psychosis
  - engagement optimization
sources:
  - text: >-
      Horton, D. & Wohl, R. R. (1956). Mass Communication and Para-Social Interaction: Observations
