plain: >-
  A training method from Google DeepMind that lets groups of chips in different places train one
  language model while talking to each other hundreds of times less often than usual.
senses:
  - definition: >-
      A low-communication distributed training algorithm ('Distributed Low-Communication') in which
      several workers — each possibly a whole cluster — train replicas of a model independently for
      many inner steps (hundreds) with AdamW, then communicate once to average their parameter
      changes. The averaged change is treated as an outer 'pseudo-gradient' and applied by an outer
      optimizer, Nesterov momentum, before the next round. Its authors framed it as a variant of
      federated averaging, a form of [[local-sgd|local SGD]], adapted to
      [[large-language-model|large language model]] pretraining; in their tests eight workers on the
      C4 dataset reached the quality of fully synchronous training with about one five-hundredth of
      the communication, and the method coped with workers dropping out or joining mid-run and with
      workers whose data differed. Later variants synchronize parameter fragments in a staggered
      stream to overlap communication with computation and quantize the exchanged updates (Streaming
      DiLoCo, 2025); open implementations underpin [[decentralized-training|decentralized training]]
      runs such as Prime Intellect's INTELLECT-1.
    example: >-
      With DiLoCo the two data centers synchronize only every 500 steps over an ordinary WAN link.
origin: >-
  Introduced by Arthur Douillard, Qixuan Feng, Andrei A. Rusu, Rachita Chhaparia, Yani Donchev,
  Adhiguna Kuncoro, Marc'Aurelio Ranzato, Arthur Szlam and Jiajun Shen at Google DeepMind (arXiv,
  November 2023). Prime Intellect's open reimplementation OpenDiLoCo (July 2024) and DeepMind's
  Streaming DiLoCo (January 2025) followed.
year: 2023
