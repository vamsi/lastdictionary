plain: >-
  A British-born American computer scientist who pioneered teaching machines to recognize patterns;
  his 1959 'Pandemonium' model did it through layers of simple, competing detectors.
senses:
  - definition: >-
      British-born American computer scientist and a founder of machine perception, the study of how
      computers can recognize patterns in sensory input. A student of [[norbert-wiener|Norbert
      Wiener]] at MIT and later a researcher at MIT's Lincoln Laboratory, Bolt Beranek and Newman,
      and GTE Laboratories, he took part in the 1956 [[dartmouth-workshop|Dartmouth workshop]]. His
      paper 'Pandemonium: A Paradigm for Learning' (1959) described recognition by layers of
      'demons': feature demons respond to parts of the input, cognitive demons call out in
      proportion to the evidence for the pattern each represents, and a decision demon picks the
      loudest, with the weightings adjusted by experience. The architecture anticipated hierarchical
      [[feature-extraction|feature extraction]] and parallel models of perception, and his work with
      Ulric Neisser on letter recognition (1960) influenced cognitive psychology. His demons also
      prefigured the software [[agent|agent]], a theme of his later writing on adaptive, learning
      software.
