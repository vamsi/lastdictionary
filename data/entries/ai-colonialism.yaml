term: AI colonialism
id: ai-colonialism
pos: n.
also:
  - data colonialism
  - digital colonialism
  - algorithmic colonialism
  - decolonial AI
domain: society
domains:
  - gov
  - data
labels:
  - contested
level: core
plain: >-
  The criticism that the AI industry repeats patterns of colonial empires, taking data, labor, land
  and resources from poorer places and peoples while profits and control stay with a few rich
  companies and countries.
senses:
  - definition: >-
      A critical framework describing the AI industry as reproducing colonial relations of
      extraction and dependency. Its claims include that data, including cultural works, languages
      and personal information, are taken from communities without meaningful consent or
      compensation; that low-paid workers, often in the Global South, perform labeling and
      moderation ([[ghost-work|ghost work]]); that minerals, land, water and energy for chips and
      data centers come from places that see little of the benefit; and that systems designed in a
      few countries impose their languages, values and categories elsewhere while capturing markets
      and infrastructure. Proposed responses include data sovereignty and community data governance,
      fair labor standards, locally built and controlled models, and decolonial approaches to
      design. Critics of the framing argue that it stretches the historical concept of colonialism
      and understates local agency and benefits.
    example: >-
      The council refused the dataset deal as AI colonialism: their language recordings for a model
      they would have to rent back.
origin: >-
  Builds on 'data colonialism', theorized by Nick Couldry and Ulises Mejias (2019), and on
  'Decolonial AI' by Shakir Mohamed, Marie-Therese Png and William Isaac (2020). Karen Hao's 'AI
  Colonialism' series in MIT Technology Review (April 2022) popularized the phrase, and her book
  Empire of AI (2025) extended the argument to frontier AI companies.
see_also:
  - ghost work
  - digital divide
  - concentration of power
  - sovereign AI
  - AI for good
  - surveillance capitalism
sources:
  - text: >-
      Couldry, N. & Mejias, U. A. (2019). The Costs of Connection: How Data Is Colonizing Human Life
      and Appropriating It for Capitalism. Stanford University Press.
  - text: >-
      Mohamed, S., Png, M.-T. & Isaac, W. (2020). Decolonial AI: Decolonial Theory as Sociotechnical
      Foresight in Artificial Intelligence. Philosophy & Technology 33, 659–684.
  - text: >-
      Hao, K. (2025). Empire of AI: Dreams and Nightmares in Sam Altman's OpenAI. Penguin Press.
