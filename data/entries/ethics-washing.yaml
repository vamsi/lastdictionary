# yaml-language-server: $schema=../schema/entry.schema.json

term: ethics washing
id: ethics-washing
pos: n.
also:
  - ethics shopping
  - ethics theater
domain: society
domains:
  - gov
level: core
plain: >-
  Using talk of ethics, such as principles, advisory boards or pledges, to look responsible and head
  off regulation, without actually changing what a company does.
senses:
  - definition: >-
      The use of ethical language, principles, advisory boards, pledges and partnerships to create
      an appearance of responsibility that substitutes for, rather than produces, changes in
      behavior or binding accountability. Indicators include voluntary principles without
      enforcement mechanisms or metrics, ethics boards without power or independence, selective
      transparency, and lobbying against regulation on the grounds that self-governance suffices. A
      related practice, ethics shopping, involves picking from the many available frameworks the one
      that demands least. The critique does not reject ethics work as such; it holds that ethics
      must be backed by law, independent oversight and a real possibility of declining to build or
      ship a product.
    example: >-
      Announcing an ethics council the week the bill was debated looked like ethics washing to most
      of the committee.
origin: >-
  Modeled on 'whitewashing' and 'greenwashing'. Ben Wagner's 'Ethics as an Escape from Regulation:
  From Ethics-Washing to Ethics-Shopping?' (2018) set out the concept; philosopher Thomas Metzinger,
  a member of the EU's High-Level Expert Group on AI, applied it to the group's 2019 guidelines.
  Google's AI ethics advisory council, dissolved about a week after its 2019 launch, became a
  much-cited example.
year: 2018
see_also:
  - AI washing
  - AI ethics
  - responsible AI
  - AI governance
  - AI for good
  - algorithmic accountability
contrast:
  - AI regulation
sources:
  - text: >-
      Wagner, B. (2018). Ethics as an Escape from Regulation: From Ethics-Washing to
      Ethics-Shopping? In E. Bayamlıoğlu et al. (eds.), Being Profiled: Cogitas Ergo Sum. Amsterdam
      University Press.
  - text: >-
      Floridi, L. (2019). Translating Principles into Practices of Digital Ethics: Five Risks of
      Being Unethical. Philosophy & Technology 32, 185–193.
