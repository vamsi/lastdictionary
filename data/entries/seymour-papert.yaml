level: specialist
dates: 1928–2016
plain: >-
  A South African-born mathematician who co-wrote 'Perceptrons', a critique of early neural
  networks, with Marvin Minsky, and invented the children's programming language Logo.
senses:
  - definition: >-
      MIT mathematician and educator, born in South Africa, whose work spanned machine perception
      and how children learn. After working with the psychologist Jean Piaget in Geneva (1958–1963),
      he joined MIT, where he co-directed the Artificial Intelligence Laboratory with
      [[marvin-minsky|Marvin Minsky]]. His 1966 memo 'The Summer Vision Project', which set students
      to build substantial parts of a visual recognition system in a single summer, later became a
      byword for underestimating perception (see [[moravec-s-paradox|Moravec's paradox]]). With
      Minsky he wrote '[[perceptrons-book|Perceptrons]]' (1969), whose proofs that limited
      [[perceptron|perceptrons]] cannot compute properties such as parity or connectedness
      contributed to a decline in neural-network research. With Wally Feurzeig and Cynthia Solomon
      he created the Logo programming language (1967), and his book 'Mindstorms' (1980) launched
      constructionism, the view that children learn best by building things, including programs. He
      was a founding faculty member of the MIT Media Lab (1985).
