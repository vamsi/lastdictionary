term: Bletchley Declaration
id: bletchley-declaration
pos: prop. n.
also:
  - Bletchley Park Declaration
domain: gov
domains:
  - safety
  - hist
level: core
plain: >-
  A short statement signed by 28 countries and the European Union at the first global AI safety
  summit, held in England in 2023, agreeing that the most advanced AI could cause serious harm.
senses:
  - definition: >-
      The political declaration agreed on 1 November 2023 at the first [[ai-safety-summit|AI Safety
      Summit]], held at Bletchley Park in the United Kingdom, by 28 countries — among them the
      United States, China, India, Brazil, Saudi Arabia and the United Kingdom — and the European
      Union. It welcomes the opportunities of AI while warning of 'serious, even catastrophic, harm'
      from the most capable [[frontier-ai|frontier AI]] models, whether through misuse or loss of
      control, especially in cybersecurity, biotechnology and disinformation. Its agenda had two
      strands: a shared, science-based understanding of the risks of frontier AI, and national
      policies built on that understanding, backed by more openness from developers, agreed ways of
      evaluating models, safety-testing tools and expertise inside governments. It is not legally
      binding.
    example: >-
      The Bletchley Declaration was the first time the United States and China signed a joint text
      on frontier AI risk.
origin: >-
  Negotiated by the UK government under Prime Minister Rishi Sunak for the summit of 1–2 November
  2023. Its call for an internationally inclusive network of scientific research led to the
  [[international-ai-safety-report|International AI Safety Report]], chaired by Yoshua Bengio, and
  the summit series continued in Seoul (2024), Paris (2025) and New Delhi (2026).
year: 2023
note: >-
  Later summit statements were broader in theme and less focused on catastrophic risk. The United
  States and United Kingdom declined to sign the Paris summit statement of February 2025, although
  the United States and China both signed the New Delhi declaration of February 2026.
