plain: >-
  A London company that paid for and released Stable Diffusion, a free image-generating AI anyone
  could download, and later models for video, audio and 3D.
senses:
  - definition: >-
      A British generative-AI company that paid for the training and public release of
      [[stable-diffusion|Stable Diffusion]] (August 2022), whose downloadable weights brought
      high-quality text-to-image generation to ordinary computers and spawned a large ecosystem of
      fine-tuned variants and tools. The model was developed with the CompVis group at Ludwig
      Maximilian University of Munich and the company Runway, building on their
      [[latent-diffusion-model|latent diffusion model]] research, and trained on data from
      [[laion|LAION]]. Stability later released SDXL, Stable Diffusion 3 and 3.5, and models for
      video, audio and 3D, typically under licenses that restrict large commercial users. Its use of
      web images made it a defendant in landmark copyright suits: in November 2025 the High Court of
      England and Wales largely ruled for it against Getty Images, finding that the trained model
      was not an infringing copy of the photographs, while related US cases continued.
origin: >-
  Founded in London in 2019 by Emad Mostaque, a former hedge-fund manager, with Cyrus Hodes.
  Mostaque resigned as chief executive in March 2024 amid financial difficulties and staff
  departures; Prem Akkaraju became chief executive in June 2024, with Sean Parker as executive
  chair.
year: 2019
