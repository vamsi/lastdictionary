plain: >-
  Google's video-generating AI, which since 2025 creates short clips complete with matching sound
  and dialogue from a written prompt.
senses:
  - definition: >-
      A series of [[text-to-video-model|text-to-video]] and image-to-video models from Google
      DeepMind. Veo was announced at Google I/O in May 2024, with Google claiming 1080p clips longer
      than a minute; Veo 2 (December 2024) added up to 4K resolution and more realistic physics. Veo
      3, released at Google I/O on 20 May 2025, generated synchronized audio — dialogue, sound
      effects and ambient sound — together with the video, helping to make AI clips with talking
      characters a viral genre. Veo 3.1 followed in October 2025. Veo powers Google's Flow
      filmmaking tool, which assembles clips of about eight seconds each into longer scenes with
      consistent characters, and it is offered through the Gemini app, YouTube Shorts and Google
      Cloud. Google describes Veo as a latent [[diffusion-model|diffusion model]] and marks its
      output with [[synthid|SynthID]] watermarks. In May 2026 Google added Gemini Omni, a
      conversational video generation and editing model; Veo continued alongside it, though as of
      October 2026 the Gemini API was retiring its Veo models in favor of Gemini Omni Flash.
    example: Veo 3 gave the street interview real crowd noise, and the lip-sync held up.
origin: >-
  Developed by Google DeepMind and announced at Google I/O on 14 May 2024, succeeding Google
  Research video models such as Imagen Video and Phenaki (2022) and Lumiere (2024).
year: 2024
