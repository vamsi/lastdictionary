term: Genesis Mission
id: genesis-mission
pos: prop. n.
domain: gov
domains:
  - society
labels:
  - emerging
level: specialist
plain: >-
  A US government program launched in 2025 to speed up science with AI, using the national
  laboratories' supercomputers and data to build AI tools for research.
senses:
  - definition: >-
      A US federal initiative, led by the Department of Energy, to accelerate scientific research
      with artificial intelligence by building a centralized AI platform — described by its sponsors
      as a national 'AI scientist' platform — on the computing resources and scientific datasets of
      the national laboratories. Its infrastructure draws on new AI supercomputers at Argonne and
      Oak Ridge National Laboratories, announced in 2025 with industry partners including Nvidia,
      Oracle, AMD and Hewlett Packard Enterprise. Critics questioned the speed with which research
      funding was redirected and the role given to industry partners.
    example: >-
      The lab's materials team rebuilt its pipeline so its data could feed the Genesis Mission
      platform.
origin: >-
  Launched by an executive order, 'Launching the Genesis Mission', signed by President Donald Trump
  on 24 November 2025, which likened its urgency and ambition to the Manhattan Project. The
  Department of Energy implements it; Michael Kratsios, director of the White House Office of
  Science and Technology Policy, provides overall leadership.
year: 2025
