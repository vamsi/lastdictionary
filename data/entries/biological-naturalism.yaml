term: biological naturalism
id: biological-naturalism
pos: n.
also:
  - biological naturalist
domain: mind
labels:
  - contested
level: specialist
plain: >-
  John Searle's view that consciousness is a real biological product of brains, as digestion is of
  stomachs, so running a computer program would not by itself create a mind.
senses:
  - definition: >-
      The position, defended by John Searle, that consciousness is an ordinary biological
      phenomenon: particular neurobiological processes produce it, and it exists as a property of
      the brain at a higher level of organization, much as liquidity is a property of water
      molecules taken together. It rejects both dualism and the identification of mind with
      computation: since programs are defined purely by formal symbol manipulation, implementing one
      is never by itself sufficient for a mind, though an artificial system that duplicated the
      brain's relevant causal powers could be conscious. Later biologically grounded views, such as
      the neuroscientist Anil Seth's, argue that consciousness may depend on features of living
      systems — metabolism, self-maintenance, predictive regulation of the body — that digital
      computers lack, which would make [[machine-consciousness|machine consciousness]] unlikely in
      current AI.
origin: >-
  John Searle's own label for his account of the [[mind-body-problem|mind–body problem]], whose core
  claim, that brains cause minds by their specific causal powers, he stated with the
  [[chinese-room|Chinese room]] argument in 1980. He developed it in Intentionality (1983) and
  Minds, Brains and Science (1984) and set it out at length in The Rediscovery of the Mind (1992);
  when the label itself first appeared is not established.
year: 1980
note: >-
  Not the claim that only carbon-based life can be conscious: Searle allows artificial consciousness
  in principle, provided the brain's causal powers are duplicated rather than merely simulated, as a
  simulated storm leaves no one wet.
see_also:
