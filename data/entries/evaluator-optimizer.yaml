term: evaluator–optimizer
id: evaluator-optimizer
pos: n.
also:
  - evaluator–optimizer loop
  - generator–critic loop
  - critic loop
domain: agents
domains:
  - eval
level: specialist
plain: >-
  A pairing in which one AI produces a draft and another AI grades it and suggests fixes, repeating
  the cycle until the work is good enough.
senses:
  - definition: >-
      A workflow pattern, named in Anthropic's 2024 guide to building agents, that pairs a generator
      (the optimizer) with a critic (the evaluator): one model call drafts an output, a second
      scores it against stated criteria and sends back comments, and the draft is revised until the
      critic is satisfied or an iteration cap is hit. The critic may be a different model, the same
      model under a reviewing prompt, a rubric-based [[llm-as-a-judge|LLM judge]], or a programmatic
      check such as a compiler or test suite; programmatic checks make the loop most dependable. It
      suits work whose quality can be judged clearly and where each revision measurably helps — code
      that must pass tests, nuanced translation, research needing several rounds of searching — and
      fails when the critic shares the generator's blind spots or rewards cosmetic changes. It is
      the workflow counterpart of agentic 'reflection'.
    example: >-
      We wrapped the translator in an evaluator–optimizer loop; three rounds of critique fixed most
      of the register errors.
origin: >-
  Named as one of five workflow patterns in 'Building effective agents' by Erik Schluntz and Barry
  Zhang (Anthropic, December 2024). It generalizes generate-and-critique methods such as Self-Refine
  (Aman Madaan et al., March 2023) and [[reflexion|Reflexion]] (2023), and the much older
  generate-and-test strategy of classical AI.
year: 2024
