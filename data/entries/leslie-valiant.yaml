dates: b. 1949
plain: >-
  A British computer scientist who in 1984 gave the first rigorous definition of what it means for a
  computer to learn from examples, founding the theory of machine learning.
senses:
  - definition: >-
      Hungarian-born British computer scientist at Harvard University since 1982 and the founder of
      computational learning theory. His paper 'A Theory of the Learnable' (1984) introduced
      [[pac-learning|probably approximately correct (PAC) learning]], which defines learning as
      producing, with high probability and from a feasible number of examples and amount of
      computation, a hypothesis that is approximately correct on new data drawn from the same
      distribution; this made learnability a question of computational complexity and, together with
      [[vc-dimension|VC dimension]] theory, underpins the analysis of
      [[generalization|generalization]]. He also made foundational contributions to complexity
      theory, including the class #P and the hardness of computing the permanent (1979), and
      proposed the bulk synchronous parallel model of computation. His books 'Probably Approximately
      Correct' (2013) and 'The Importance of Being Educable' (2024) extend the framework to
      evolution and human cognition. [[turing-award|Turing Award]] 2010; Nevanlinna Prize 1986.
