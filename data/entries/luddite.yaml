term: Luddite
id: luddite
pos: n.
also:
  - Luddism
  - neo-Luddite
  - neo-Luddism
  - Luddite fallacy
domain: society
domains:
  - hist
  - culture
level: core
plain: >-
  Originally one of the English textile workers who smashed machines in protest in the 1810s; now
  anyone who opposes new technology, often used as an insult against AI skeptics.
senses:
  - context: History
    definition: >-
      A participant in the protests of 1811–1816 in which English textile workers, mainly in
      Nottinghamshire, Yorkshire and Lancashire, smashed machinery such as stocking frames, shearing
      frames and power looms to resist wage cuts, unemployment and the degradation of their trades
      by factory owners. They took their name from a mythical leader, Ned (also General or King)
      Ludd. The British government deployed troops and made machine-breaking a capital crime in
      1812. Historians stress that the Luddites targeted the way machines were used against workers
      rather than technology as such.
    labels:
      - historical
  - context: General
    definition: >-
      By extension, a person who opposes or distrusts new technology, often used dismissively of AI
      critics. Some critics have reclaimed the label as neo-Luddism, arguing, like the original
      movement, that the real issue is who controls technology and who benefits. The 'Luddite
      fallacy' is economists' name for the belief that labor-saving technology must cause lasting
      mass unemployment.
    example: >-
      Calling every critic of the data-center build-out a Luddite is easier than answering their
      questions about water.
origin: >-
  From Ned Ludd, according to legend a Leicestershire youth who broke stocking frames around 1779;
  'Luddite' was in use by 1811 for the machine-breakers. The figurative sense is a 20th-century
  development; Brian Merchant's Blood in the Machine (2023) revived interest in the Luddites in AI
  debates.
year: 1811
see_also:
