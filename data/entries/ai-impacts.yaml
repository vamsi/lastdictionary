term: AI Impacts
id: ai-impacts
pos: prop. n.
domain: orgs
domains:
  - asi
level: specialist
plain: >-
  A small research project that studies how and when human-level artificial intelligence might
  arrive, best known for large surveys asking AI researchers to predict their field's future.
senses:
  - definition: >-
      A small research effort that compiles evidence and arguments about when human-level AI might
      arrive and what would follow. Its Expert Surveys on Progress in AI (2016, 2022 and 2023),
      among the largest of their kind, asked authors of papers at leading machine learning
      conferences when [[high-level-machine-intelligence|high-level machine intelligence]] and the
      full automation of labor would arrive and how likely extremely bad outcomes were. The 2023
      survey of about 2,800 researchers gave an aggregate 50 percent chance of high-level machine
      intelligence by 2047, thirteen years earlier than the 2022 estimate, and a median 5 percent
      probability of outcomes as bad as human extinction. Its case studies of historical
      discontinuities in technological progress informed the debate over [[takeoff|takeoff]] speeds.
      The surveys are widely cited in [[ai-timelines|AI timelines]] debates and criticized for their
      sensitivity to question wording.
origin: >-
  Begun in 2014 by Katja Grace, its lead researcher, and Paul Christiano, and long hosted by the
  [[machine-intelligence-research-institute|Machine Intelligence Research Institute]] in Berkeley,
  California.
year: 2014
