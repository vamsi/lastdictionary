plain: >-
  A Soviet Ukrainian scientist who from 1965 built some of the first deep, many-layered learning
  networks, growing them layer by layer from data, decades before modern deep learning.
senses:
  - definition: >-
      Soviet Ukrainian mathematician and engineer at the Institute of Cybernetics in Kyiv who, with
      Valentin Lapa, built and trained some of the earliest deep, multilayer learning networks. From
      the mid-1960s he developed what became the group method of data handling (GMDH), which grows a
      network layer by layer: each unit computes a small polynomial of two inputs from the layer
      below, units are fitted to training data by regression, and only those that perform best on
      separate held-out data survive to feed the next layer, so that depth and structure are learned
      from data; a 1971 paper described a network of eight layers. GMDH was widely used in the
      Soviet Union for modeling and forecasting. [[jurgen-schmidhuber|Jürgen Schmidhuber]] and
      others cite Ivakhnenko as the originator of [[deep-learning|deep learning]] in the sense of
      trainable many-layered networks, decades before [[backpropagation|backpropagation]] made deep
      networks practical; his selection of units on held-out data anticipated the
      [[validation-set|validation set]].
