plain: >-
  An American AI-safety researcher who created widely used AI tests such as MMLU and Humanity's Last
  Exam, and who runs the Center for AI Safety.
senses:
  - definition: >-
      American machine-learning researcher known for widely used benchmarks and for AI-safety
      advocacy; he co-founded the [[center-for-ai-safety|Center for AI Safety]] (CAIS) in 2022 and
      directs it. As a student, with Kevin Gimpel, he introduced the [[gelu|GELU]] activation
      (2016), later standard in [[transformer|transformers]], and a widely used baseline for
      detecting [[out-of-distribution|out-of-distribution]] inputs. During his doctorate at the
      University of California, Berkeley, he led the creation of benchmarks that became fixtures of
      model evaluation, including [[mmlu|MMLU]] (2020) and [[math|MATH]] (2021), and later, with
      [[scale-ai|Scale AI]], [[humanity-s-last-exam|Humanity's Last Exam]] (2025). Through CAIS he
      organized the 2023 [[statement-on-ai-risk|Statement on AI Risk]], and its advocacy arm
      co-sponsored California's [[sb-1047|SB 1047]]. With Eric Schmidt and Alexandr Wang he wrote
      'Superintelligence Strategy' (2025), which proposed the deterrence regime of
      [[mutual-assured-ai-malfunction|Mutual Assured AI Malfunction]]. He has also advised
      [[xai|xAI]] and Scale AI on safety.
