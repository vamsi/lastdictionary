term: human-centered AI
id: human-centered-ai
pos: n.
also:
  - HCAI
  - human-centred AI
  - human-centered artificial intelligence
  - human-centric AI
domain: society
domains:
  - eng
level: core
plain: >-
  An approach to AI that puts people's needs, abilities and control at the center: systems designed
  to help humans do things better rather than to replace or overrule them.
senses:
  - definition: >-
      An approach to AI research, design and policy that judges systems by their benefit to the
      people who use or are affected by them, and that favors [[augmentation|augmentation]] of human
      abilities, meaningful human control and attention to social context over autonomy for its own
      sake. In Ben Shneiderman's influential version, high automation and high human control are
      complementary rather than opposed, and are achieved with design principles from human–computer
      interaction such as predictable behavior, visible system state, undo and audit trails. The
      label also names a research agenda joining AI with the social sciences and humanities, and
      appears in policy texts: the [[eu-ai-act|EU AI Act]] states that its purpose includes
      promoting 'human-centric' and trustworthy AI.
    example: >-
      The human-centered AI review asked nurses, not just administrators, what the scheduling tool
      should optimize.
origin: >-
  Rooted in human–computer interaction and the [[intelligence-augmentation|intelligence
  augmentation]] tradition. Fei-Fei Li's 2018 New York Times essay calling for human-centered AI and
  the founding of Stanford's Institute for Human-Centered Artificial Intelligence (2019) popularized
  the phrase; Ben Shneiderman set out a design framework in papers from 2020 and the book
  Human-Centered AI (2022).
see_also:
  - intelligence augmentation
  - augmentation
  - value-sensitive design
  - human-in-the-loop
  - responsible AI
