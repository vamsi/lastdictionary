level: core
plain: >-
  The Taiwanese company that manufactures most of the world's advanced computer chips, including
  nearly all of the specialized chips used to train and run AI.
senses:
  - definition: >-
      A Taiwanese [[semiconductor-foundry|semiconductor foundry]] — a contract manufacturer that
      fabricates chips designed by other companies — and the world's largest, with a dominant share
      of production at the most advanced [[process-node|process nodes]]. Nearly all leading AI
      accelerators, including Nvidia's GPUs, AMD's Instinct chips and Google's [[tpu|TPUs]], are
      made in its fabs, and its CoWoS [[advanced-packaging|advanced packaging]], which places
      processor dies beside stacks of [[high-bandwidth-memory|high-bandwidth memory]] on a silicon
      interposer, has been a principal bottleneck on AI chip supply since 2023. The concentration of
      leading-edge chipmaking in Taiwan makes the company central to debates over supply-chain
      resilience, [[export-controls-on-ai-chips|export controls on AI chips]] and security in the
      Taiwan Strait; it has built fabs in Arizona, Japan and Germany, partly with support under the
      US [[chips-and-science-act|CHIPS and Science Act]].
    example: The accelerator is sold out until TSMC adds more packaging capacity.
origin: >-
  Founded in 1987 in Hsinchu Science Park, Taiwan, by Morris Chang, a former Texas Instruments
  executive, with backing from the Taiwanese government and Philips. It pioneered the 'pure-play'
  foundry model that lets 'fabless' firms such as Nvidia design chips without owning factories. C.
  C. Wei has been its chair and chief executive since 2024.
year: 1987
