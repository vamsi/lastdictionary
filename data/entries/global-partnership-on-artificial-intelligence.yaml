term: Global Partnership on Artificial Intelligence
id: global-partnership-on-artificial-intelligence
pos: prop. n.
also:
  - GPAI
  - Global Partnership on AI
domain: gov
domains:
  - orgs
level: specialist
plain: >-
  An international group of countries, launched in 2020 and now run together with the OECD, that
  brings governments and experts together to put trustworthy AI into practice.
senses:
  - definition: >-
      A multistakeholder initiative of governments, launched in June 2020, that aims to bridge AI
      theory and practice by supporting research and applied projects on responsible AI, data
      governance, the future of work, and innovation and commercialization, grounded in the
      [[oecd-ai-principles|OECD AI Principles]]. Its expert community has worked through centers of
      expertise in Montreal, Paris and Tokyo. Since July 2024 it has operated as an integrated
      partnership with the OECD's AI policy work, under the GPAI name, with membership open to
      countries that adhere to the OECD Recommendation on AI; a ministerial council sets its
      priorities.
    example: >-
      The data-governance project was run under the Global Partnership on Artificial Intelligence.
origin: >-
  Proposed by Canada and France in 2018, initially as an 'international panel on AI' loosely modeled
  on the climate panel IPCC, and launched on 15 June 2020 by 15 founding members, among them the EU,
  the United States, India and Japan, with a secretariat at the OECD.
year: 2020
note: >-
  Shares the acronym GPAI with the EU's [[general-purpose-ai-model|general-purpose AI]]; context
  usually makes the meaning clear. Observers have questioned its influence relative to the G7 and
  the summit series.
see_also:
  - OECD AI Principles
  - G7 Hiroshima AI Process
  - AI governance
  - Global Dialogue on AI Governance
as_of: 2026-10
