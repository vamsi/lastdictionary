level: core
dates: b. 1976
plain: >-
  A Chinese-American computer scientist whose ImageNet project, millions of hand-labeled photos,
  gave deep learning the proving ground that launched its boom; she now champions 'human-centered'
  AI.
senses:
  - definition: >-
      Chinese-born American computer scientist at Stanford University. As a young professor at
      Princeton and then Stanford she led the creation of [[imagenet|ImageNet]] (2009), millions of
      images labeled into thousands of categories through [[crowdsourcing|crowdsourcing]], at a time
      when most researchers prized algorithms over data; the ImageNet Large Scale Visual Recognition
      Challenge (2010–2017) became the benchmark on which [[alexnet|AlexNet]] demonstrated
      [[deep-learning|deep learning]] in 2012. She directed the Stanford AI Lab (2013–2018), was
      chief scientist for AI at Google Cloud (2017–2018), co-founded the nonprofit AI4ALL to broaden
      participation in AI, and in 2019 co-founded Stanford's Institute for Human-Centered Artificial
      Intelligence (HAI). In 2024 she co-founded World Labs, a company building [[world-model|world
      models]] with 'spatial intelligence' that generate and reason about 3D environments. Her
      memoir is 'The Worlds I See' (2023). Queen Elizabeth Prize for Engineering 2025.
