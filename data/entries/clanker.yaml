term: clanker
id: clanker
pos: n.
also:
  - clankers
domain: culture
domains:
  - society
  - robot
labels:
  - slang
  - contested
level: specialist
plain: >-
  A slang insult for robots and AI systems, borrowed from Star Wars, that went viral in 2025 as a
  way of expressing annoyance at, or rejection of, AI.
senses:
  - definition: >-
      A derogatory term for a robot, AI system or chatbot, and by extension for AI-generated content
      or its enthusiasts. Its 2025 popularity combined backlash against [[ai-slop|AI slop]],
      automated customer service and feared job losses with playful in-group humor: it was used to
      dismiss bot replies in comment sections and in comic skits imagining future prejudice between
      humans and robots. The word itself was debated. Some linguists described it as modeled on
      slurs for human groups and objected to memes that borrowed the imagery of historical racism;
      others argued it is an insult rather than a slur, since machines are not a marginalized group.
    example: >-
      The reply thread was half bots, and the other half was people calling them clankers.
origin: >-
  An isolated 1958 use by the science-fiction writer William Tenn, for the robots of films such as
  Metropolis, predates the modern word, which comes from Star Wars: first used for battle droids in
  the video game Republic Commando (2005), it was popularized by clone troopers in the animated
  series The Clone Wars (from 2008). It went viral as an anti-AI insult on social media in mid-2025;
  in June 2025 US Senator Ruben Gallego used it to promote a bill letting callers reach a human
  instead of an automated customer-service agent.
year: 2005
note: >-
  Older science-fiction insults for artificial beings include 'skinjob' (Blade Runner, 1982) and
  'toaster' (the 2000s Battlestar Galactica series). Compare the Dune-derived
  [[butlerian-jihad|Butlerian Jihad]] for organized anti-AI sentiment.
