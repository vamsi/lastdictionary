plain: >-
  A label, promoted heavily by IBM in the 2010s, for computer systems that learn, reason and
  interact with people in humanlike ways. It was largely a marketing term and has given way to 'AI'.
senses:
  - definition: >-
      A term, used mainly in the 2010s, for computing systems meant to help people with complex,
      ambiguous problems by bringing together [[natural-language-processing|natural language
      processing]], [[machine-learning|machine learning]], automated reasoning and human–computer
      interaction. Its leading proponent was IBM, which after [[ibm-watson|IBM Watson]]'s 2011
      Jeopardy! victory presented cognitive computing as a new era succeeding tabulating machines
      and programmable computers, and reorganized much of its business around the label. An earlier,
      narrower use named brain-inspired hardware research such as the DARPA SyNAPSE program (from
      2008), which produced IBM's TrueNorth [[neuromorphic-computing|neuromorphic]] chip. The term
      never had a precise technical meaning; critics saw it as a rebranding of AI for corporate
      customers, and it faded in the late 2010s as 'AI' itself became commercially attractive again.
    example: >-
      The 2015 sales deck promised cognitive computing; today the same slide would just say AI.
origin: >-
  Used for brain-inspired computing in the 2000s, notably by Dharmendra Modha's group at IBM
  Research–Almaden, and popularized as an IBM marketing theme from about 2011, as in John E. Kelly
  III and Steve Hamm's book Smart Machines: IBM's Watson and the Era of Cognitive Computing (2013).
year: 2011
