# yaml-language-server: $schema=../schema/entry.schema.json

term: phenomenal consciousness
id: phenomenal-consciousness
pos: n.
also:
  - P-consciousness
  - phenomenality
  - phenomenal character
  - experiential consciousness
domain: mind
level: core
plain: >-
  The felt, experiential side of the mind — what it is like to taste coffee or to feel sad — as
  opposed to simply processing or reporting information.
senses:
  - definition: >-
      Consciousness as experience itself, as distinct from the processing that may accompany it. In
      the sense Thomas Nagel made standard, a mental state has it when being in that state feels
      like something to its subject; how it feels is the state's phenomenal character, often
      described in terms of [[qualia|qualia]]. Ned Block distinguished it from
      [[access-consciousness|access consciousness]], information globally available for reasoning,
      report and action, and argued that the two can come apart and that cognitive science often
      explains the second while claiming to explain the first. Phenomenal consciousness is what the
      [[hard-problem-of-consciousness|hard problem of consciousness]] concerns and what debates over
      [[machine-consciousness|machine consciousness]] and [[sentience|sentience]] ultimately turn
      on, since a system could have rich access to information without any experience.
      [[illusionism|Illusionists]] deny that it exists in the sense philosophers intend.
    example: >-
      Showing that the model broadcasts information globally would establish access, not phenomenal
      consciousness.
origin: >-
  The 'what it is like' criterion comes from Thomas Nagel (1974). Ned Block made 'phenomenal
  consciousness' (P-consciousness) a standard term by contrasting it with access consciousness, most
  influentially in 'On a Confusion about a Function of Consciousness' (Behavioral and Brain
  Sciences, 1995).
year: 1995
see_also:
  - access consciousness
  - qualia
  - hard problem of consciousness
  - consciousness
  - illusionism
  - philosophical zombie
contrast:
  - access consciousness
sources:
  - text: >-
      Block, N. (1995). On a Confusion about a Function of Consciousness. Behavioral and Brain
      Sciences 18(2), 227–247.
  - text: >-
      Nagel, T. (1974). What Is It Like to Be a Bat? The Philosophical Review 83(4), 435–450.
