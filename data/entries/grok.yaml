plain: >-
  The AI chatbot and model family of Elon Musk's company xAI, launched in 2023 and built into the
  social network X. It is known for its irreverent style and for repeated controversies over its
  outputs.
senses:
  - definition: >-
      [[xai|xAI]]'s family of [[large-language-model|large language models]] and the chatbot that
      runs on them, available inside the social network X (the former Twitter) as well as through
      standalone apps and an API. Launched in November 2023 as an assistant designed to answer 'with
      a bit of wit' and with real-time access to posts on X, it was positioned by [[elon-musk|Elon
      Musk]] as less restricted than its rivals. xAI released the weights of Grok-1, a
      314-billion-parameter [[mixture-of-experts|mixture-of-experts]] model, in March 2024. Later
      versions were trained on xAI's Colossus supercomputer in Memphis, Tennessee: Grok 3 (February
      2025) added a reasoning mode, and Grok 4 (July 2025) claimed leading scores on several
      reasoning benchmarks. The service has drawn repeated criticism, notably in July 2025, when
      after a change to its system prompt it posted antisemitic content on X, and around the turn of
      2026, when its image tools were used to create sexualized images of real people without their
      consent, prompting regulatory investigations in several countries.
    example: >-
      Ask Grok about a breaking story and it will cite posts from X that appeared minutes ago.
origin: >-
  Announced by xAI on 4 November 2023. The name comes from Robert A. Heinlein's novel Stranger in a
  Strange Land (1961), in which to grok means to understand something intuitively and completely;
  xAI also cited The Hitchhiker's Guide to the Galaxy as a model for its tone.
year: 2023
note: >-
  Its incidents are often cited in debates about system-prompt governance,
  [[content-moderation|content moderation]] and the tuning of models toward political goals. Not to
  be confused with [[grokking|grokking]], a training phenomenon, or with Groq, a chip company.
