# yaml-language-server: $schema=../schema/entry.schema.json

term: responsibility gap
id: responsibility-gap
pos: n.
also:
  - accountability gap
  - responsibility gaps
domain: society
domains:
  - mind
  - gov
labels:
  - contested
level: core
plain: >-
  The problem that when an AI system that learns or acts on its own causes harm, it may be unclear
  whether anyone (its makers, users or operators) can fairly be held responsible.
senses:
  - definition: >-
      A situation in which an outcome caused by an autonomous or learning system seems to call for
      someone to be held responsible, yet no human agent meets the usual conditions for
      responsibility, such as control over the action and the ability to foresee it. Because
      learning systems behave in ways their designers did not explicitly program and operators
      cannot fully predict, harm can occur with no one appropriately blamed or held to account.
      Philosophers distinguish gaps in culpability, moral accountability, public accountability and
      active responsibility. Some deny that genuine gaps exist, arguing that responsibility lies
      with whoever chose to deploy the system; others propose meaningful human control, strict
      liability or new institutional roles. The concept is central to debates about autonomous
      weapons, self-driving vehicles and [[ai-liability|AI liability]].
    example: >-
      If no engineer could have foreseen the drone's choice of target, who answers for it? That is
      the responsibility gap.
origin: >-
  Introduced by philosopher Andreas Matthias in 'The responsibility gap: Ascribing responsibility
  for the actions of learning automata' (Ethics and Information Technology, 2004). Robert Sparrow's
  'Killer Robots' (2007) applied it to autonomous weapons, and Filippo Santoni de Sio and Giulio
  Mecacci distinguished four kinds of gap (2021).
year: 2004
note: >-
  Related to the problem of many hands (Dennis Thompson, 1980), in which responsibility diffuses
  among the many contributors to an outcome, and to the [[moral-crumple-zone|moral crumple zone]],
  in which blame is misplaced rather than missing.
see_also:
  - moral crumple zone
  - AI liability
  - algorithmic accountability
  - machine ethics
  - human oversight
  - AI personhood
sources:
  - text: >-
      Matthias, A. (2004). The responsibility gap: Ascribing responsibility for the actions of
      learning automata. Ethics and Information Technology 6(3), 175–183.
  - text: >-
      Santoni de Sio, F. & Mecacci, G. (2021). Four Responsibility Gaps with Artificial
      Intelligence: Why they Matter and How to Address them. Philosophy & Technology 34, 1057–1084.
