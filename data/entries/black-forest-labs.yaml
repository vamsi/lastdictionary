plain: >-
  A German AI company founded in 2024 by original creators of Stable Diffusion, which makes the FLUX
  image-generation models.
senses:
  - definition: >-
      A German generative-AI company that develops the FLUX family of
      [[text-to-image-model|text-to-image]] and image-editing models. FLUX.1 (August 2024), a
      12-billion-parameter [[diffusion-model|diffusion]] transformer trained with
      [[flow-matching|flow matching]], was released in three variants — a fast model under the
      Apache 2.0 license, an open-weight model for non-commercial use and a proprietary model served
      through an API — and quickly became a leading open image model; FLUX.1 Kontext (2025) added
      instruction-based image editing, and FLUX.2 followed in November 2025. Its models have powered
      image generation in xAI's Grok (2024), Mistral's Le Chat, Adobe Photoshop and Meta's Vibes
      app.
origin: >-
  Founded in 2024 in Freiburg im Breisgau, Germany, by Robin Rombach, Andreas Blattmann and Patrick
  Esser, lead authors of the latent diffusion research behind Stable Diffusion, after they left
  [[stability-ai|Stability AI]].
year: 2024
