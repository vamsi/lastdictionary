plain: >-
  A US company that collected billions of photos from the internet without permission to build a
  face-search tool for police, the best-known example of controversial facial recognition.
senses:
  - definition: >-
      A US [[facial-recognition|facial recognition]] company whose search engine matches an uploaded
      photo of a face against a database built by [[web-scraping|scraping]] publicly accessible
      images from social media and other websites without the consent of the people pictured; the
      company has described the database as holding tens of billions of images. Its main customers
      are law-enforcement agencies. Its practices became a landmark case for biometric privacy:
      data-protection regulators in several European countries, Canada and Australia found it in
      breach of the law, with fines including €20 million each from the Italian, Greek and French
      authorities (2022) and €30.5 million from the Dutch authority (2024), and a 2022 US settlement
      under Illinois' Biometric Information Privacy Act barred it from selling database access to
      most private companies nationwide. The [[eu-ai-act|EU AI Act]] now prohibits untargeted
      scraping of facial images to build or expand such databases.
    example: >-
      Our procurement rules now ask whether a vendor's face gallery was built the Clearview AI way,
      by scraping.
origin: >-
  Hoan Ton-That and Richard Schwartz started the company in 2017; it attracted little notice until
  Kashmir Hill's New York Times investigation 'The Secretive Company That Might End Privacy as We
  Know It' (January 2020).
year: 2017
