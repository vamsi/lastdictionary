plain: >-
  A Chinese entrepreneur who founded DeepSeek, whose low-cost, openly released AI models shocked
  global markets in January 2025.
senses:
  - definition: >-
      Chinese engineer and entrepreneur, founder and chief executive of [[deepseek|DeepSeek]]. After
      studying electronic and information engineering at Zhejiang University, he co-founded the
      quantitative hedge fund High-Flyer in the mid-2010s, which used machine learning for trading
      and assembled large [[gpu|GPU]] clusters, reportedly including about 10,000 Nvidia A100 chips
      bought before US [[export-controls-on-ai-chips|export controls on AI chips]] tightened. In
      2023 he founded DeepSeek in Hangzhou, funded by High-Flyer, as a research-focused laboratory
      pursuing [[artificial-general-intelligence|artificial general intelligence]] and releasing
      [[open-weight-model|open-weight models]]. DeepSeek-V3 (December 2024), a
      [[mixture-of-experts|mixture of experts]] model reportedly trained for a fraction of rivals'
      costs, and the reasoning model [[deepseek-r1|DeepSeek-R1]] (January 2025) rivaled leading US
      systems and wiped hundreds of billions of dollars off Nvidia's market value in the episode
      called the [[deepseek-moment|DeepSeek moment]]. He was corresponding author of the R1 paper
      published in Nature in September 2025. He rarely gives interviews.
