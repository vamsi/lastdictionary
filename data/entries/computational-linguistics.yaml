term: computational linguistics
id: computational-linguistics
pos: n.
also:
  - CL
domain: llm
domains:
  - hist
  - core
level: core
plain: >-
  The science of human language studied with computers: using computational models to understand how
  language works, and building the language technology that grows out of that understanding.
senses:
  - definition: >-
      The scientific study of language by means of computation: writing explicit, testable computer
      models of how sound systems, word structure, syntax, meaning and discourse work, and creating
      the algorithms and resources such models need, such as grammars, [[corpus|corpora]], treebanks
      and lexicons. In practice and in its publication venues it overlaps almost entirely with
      [[natural-language-processing|natural language processing]]; where a distinction is drawn,
      computational linguistics leans toward scientific questions about language and linguistic
      theory, while NLP leans toward engineering systems that perform useful tasks. Its main
      society, the Association for Computational Linguistics (ACL), runs the field's leading
      conferences and its journal, Computational Linguistics.
    example: >-
      Her computational linguistics thesis used language models to test theories of how children
      learn verb agreement.
origin: >-
  The name is credited to David Hays, a machine-translation researcher at the RAND Corporation from
  1955 to 1968, for the field growing out of machine translation; the year he first used it is not
  recorded. It was in use by 1962, when the Association for Machine Translation and Computational
  Linguistics was founded; the society became the Association for Computational Linguistics in 1968.
year: 1962
