plain: >-
  Europe's best-known builder of large AI language models, a Paris start-up dating from 2023 whose
  chatbot is called Le Chat. Many of its models are free for anyone to download and run.
senses:
  - definition: >-
      A French AI company that develops [[large-language-model|large language models]] and the Le
      Chat assistant, and the most prominent European developer of frontier-scale models. It became
      known for compact, efficient models released as open weights under the permissive Apache 2.0
      license — Mistral 7B (September 2023) and Mixtral 8x7B (December 2023), a sparse
      [[mixture-of-experts|mixture of experts]] model that popularized the architecture among open
      models — alongside proprietary models for business customers, the Magistral
      [[reasoning-model|reasoning models]] (2025) and the Mistral 3 family (December 2025). In 2023
      it argued, alongside the French government, for lighter treatment of foundation models in the
      [[eu-ai-act|EU AI Act]]. It presents itself as a supplier of European [[sovereign-ai|sovereign
      AI]] and is building its own data centers. The Dutch lithography company [[asml|ASML]] became
      its largest shareholder in September 2025.
origin: >-
  Founded in Paris in April 2023 by Arthur Mensch, formerly of Google DeepMind and a co-author of
  the Chinchilla paper, and Guillaume Lample and Timothée Lacroix, formerly of Meta's FAIR lab and
  co-authors of the original LLaMA paper.
year: 2023
