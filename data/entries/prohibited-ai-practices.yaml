level: core
plain: >-
  Uses of AI that the EU bans outright as too harmful — such as manipulating people, social scoring,
  and most live facial recognition by police in public places.
senses:
  - definition: >-
      Uses of AI that the [[eu-ai-act|EU AI Act]] bans outright as an unacceptable risk, since 2
      February 2025. Four concern how people are influenced or judged: subliminal, deliberately
      manipulative or deceptive techniques, and the exploitation of weaknesses tied to age,
      disability or social or economic circumstances, where significant harm results or is likely;
      [[social-scoring|social scoring]]; and forecasting that someone will commit a crime from
      profiling or personality traits alone. Four concern biometrics: building face-recognition
      databases from images scraped indiscriminately off the internet or CCTV; inferring emotions at
      work or in education ([[emotion-recognition-system|emotion recognition]]), except for medical
      or safety reasons; [[biometric-categorisation|biometric categorisation]] to infer race,
      political opinions, trade-union membership, religious or philosophical beliefs, sex life or
      sexual orientation; and real-time [[remote-biometric-identification|remote biometric
      identification]] in publicly accessible spaces for law enforcement, allowed only with prior
      authorization for narrowly defined searches, imminent threats and serious crimes. The 2026
      [[digital-omnibus|Digital Omnibus]] added bans, from 2 December 2026, on AI that generates
      non-consensual intimate imagery of identifiable people or child sexual abuse material.
    example: >-
      Emotion recognition to monitor call-center staff is a prohibited AI practice in the EU.
origin: >-
  Article 5 of the Commission's April 2021 proposal listed four practices — subliminal manipulation,
  exploitation of vulnerabilities, social scoring by public authorities and real-time remote
  biometric identification; negotiations added predictive policing, facial-image scraping, workplace
  emotion recognition and sensitive biometric categorisation. The Commission issued interpretive
  guidelines in February 2025.
year: 2021
note: >-
  Breaches carry the Act's highest fines: up to €35 million or 7% of worldwide annual turnover,
  whichever is higher. Civil-society groups consider several exceptions, especially for law
  enforcement, too wide.
