dates: 1916–2009
plain: >-
  A British statistician who broke codes with Alan Turing and in 1965 argued that a machine smarter
  than us could design still smarter machines, setting off an 'intelligence explosion'.
senses:
  - definition: >-
      British-born statistician, a prolific Bayesian, whose career began in wartime codebreaking: as
      a young cryptanalyst under [[alan-turing|Alan Turing]] at Bletchley Park he attacked the
      German Enigma cipher, and he later worked on the Lorenz teleprinter cipher. Building on an
      idea of Turing's from that work, he published Good–Turing frequency estimation (1953), a way
      to estimate the probability of events never yet observed that was later widely used to smooth
      [[n-gram-model|n-gram]] [[language-model|language models]]. After posts at Manchester, the
      British signals agency GCHQ and Oxford, he moved to Virginia Tech in 1967. His essay
      'Speculations Concerning the First Ultraintelligent Machine' (1965) defined an
      [[ultraintelligent-machine|ultraintelligent machine]] as one that surpasses all human
      intellectual activities and argued that, since designing machines is one of them, it could
      design better machines, producing an [[intelligence-explosion|intelligence explosion]]; hence
      'the first ultraintelligent machine is the last invention that man need ever make'. He advised
      Stanley Kubrick on '2001: A Space Odyssey'.
