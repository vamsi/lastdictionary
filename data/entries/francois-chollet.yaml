level: specialist
dates: b. 1989
plain: >-
  A French software engineer who created Keras, a popular tool for building neural networks, and the
  ARC benchmark, which tests whether AI can solve kinds of puzzles it has never seen.
senses:
  - definition: >-
      French software engineer and AI researcher who created [[keras|Keras]] (2015), a high-level
      library that made building [[neural-network|neural networks]] accessible and became
      [[tensorflow|TensorFlow]]'s official interface, and the Xception architecture (2016), built on
      [[depthwise-separable-convolution|depthwise separable convolutions]]. His paper 'On the
      Measure of Intelligence' (2019) argued that intelligence should be measured as
      skill-acquisition efficiency — how well a system generalizes to novel tasks from little data,
      given its prior knowledge — rather than as skill at known tasks, and introduced the
      Abstraction and Reasoning Corpus ([[arc-agi|ARC-AGI]]), grid puzzles easy for people but long
      resistant to AI. A critic of the view that scaling [[large-language-model|language models]]
      suffices for general intelligence, he launched the ARC Prize with Mike Knoop in 2024. He left
      Google, where he had worked since 2015, in late 2024, and in 2025 co-founded with Knoop the
      research lab Ndea, which combines deep learning with [[program-synthesis|program synthesis]].
