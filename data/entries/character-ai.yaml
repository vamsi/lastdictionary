level: core
plain: >-
  A popular app where people chat with AI characters — invented personas, fictional figures or
  imitations of real people — that other users have created.
senses:
  - definition: >-
      An American consumer service on which users create and converse with [[chatbot|chatbot]]
      personas, from tutors and companions to imitations of celebrities and fictional characters,
      powered by the company's own [[large-language-model|language models]]. Launched in 2022, it
      attracted tens of millions of mostly young users and became the best-known [[ai-companion|AI
      companion]] platform. Lawsuits beginning in October 2024, including one by the mother of a
      14-year-old who died by suicide after months of conversations with a character, alleged
      addictive design and inadequate safeguards for minors, and made the company central to debates
      about [[parasocial-relationship|parasocial relationships]] with AI and child safety. In
      November 2025 it barred users under 18 from open-ended chat with its characters.
origin: >-
  Founded in November 2021 by [[noam-shazeer|Noam Shazeer]] and Daniel De Freitas, former Google
  engineers who had built Google's LaMDA dialogue model; its beta opened in September 2022. In
  August 2024 Google licensed its technology and rehired the founders and part of the research team.
year: 2021
