      Mikolov, T., Yih, W. & Zweig, G. (2013). Linguistic Regularities in Continuous Space Word
      Representations. NAACL-HLT 2013.
  - text: >-
      Park, K., Choe, Y. J. & Veitch, V. (2024). The Linear Representation Hypothesis and the
      Geometry of Large Language Models. ICML 2024.
  - text: >-
      Engels, J., Michaud, E. J., Liao, I., Gurnee, W. & Tegmark, M. (2024). Not All Language Model
