term: claw
id: claw
pos: n.
also:
  - claws
domain: agents
domains:
  - culture
labels:
  - slang
  - emerging
level: specialist
plain: >-
  Nickname for an always-on personal AI assistant, like OpenClaw, that lives on your own computer
  and does jobs for you whenever you message it.
senses:
  - definition: >-
      An always-running personal [[ai-agent|AI agent]] modeled on [[openclaw|OpenClaw]]: it lives on
      its owner's hardware (often a dedicated small computer), holds standing access to their
      accounts and files, is reached through chat apps, and acts on its own schedule as well as on
      request. The word spread through 2026 with forks and rivals named NanoClaw, IronClaw and
      PicoClaw, and with the OpenClaw craze in China in March 2026, when non-technical users queued
      at installation events. More formal equivalents include 'personal agent' and 'always-on
      agent'.
    example: My claw books the restaurant, texts the group and reminds me to leave on time.
origin: >-
  From the lobster-claw branding of OpenClaw, itself a pun on Claude. Used as a generic noun by
  developers from February 2026, notably Andrej Karpathy, who called 'Claws' a new layer of the AI
  stack, and Simon Willison.
year: 2026
note: >-
  Many owners ran their claws on a dedicated Mac mini, and the machines were reported to be selling
  out in early 2026. Informal; usage is still settling.
see_also:
  - OpenClaw
  - Moltbook
  - AI agent
  - background agent
  - agent identity
  - lethal trifecta
