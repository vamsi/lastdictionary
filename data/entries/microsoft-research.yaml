plain: >-
  Microsoft's research division, with laboratories on several continents, whose scientists have
  produced influential work on speech, vision and language AI.
senses:
  - definition: >-
      The research organization of Microsoft, with laboratories in Redmond, Cambridge (UK), Beijing,
      New York, Montreal, Bangalore and elsewhere. Its contributions to AI include [[resnet|residual
      networks]], developed at Microsoft Research Asia, which won the 2015 ImageNet competition and
      made very deep networks trainable; a conversational speech recognizer reported in 2016 to
      match professional transcribers on the Switchboard benchmark; the DeepSpeed library for
      large-scale training; and the Phi series of [[small-language-model|small language models]]
      trained largely on curated and synthetic text. Its researchers' early study of GPT-4,
      [[sparks-of-agi|Sparks of AGI]] (2023), was widely read and widely disputed. Microsoft
      Research is distinct from the Microsoft AI consumer division created in 2024 and from
      Microsoft's commercial partnership with [[openai|OpenAI]], begun in 2019.
origin: >-
  Founded in 1991 after Nathan Myhrvold, then a senior Microsoft technology executive, persuaded
  Bill Gates to create a basic-research laboratory; Richard (Rick) Rashid left Carnegie Mellon
  University to be its first director. Microsoft Research Cambridge opened in 1997 and Microsoft
  Research China, later renamed Microsoft Research Asia, in Beijing in 1998.
year: 1991
