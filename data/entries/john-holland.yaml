plain: >-
  An American scientist who invented genetic algorithms, which solve problems by breeding and
  mutating populations of candidate answers, and helped found the science of complex systems.
senses:
  - definition: >-
      American computer scientist and psychologist at the University of Michigan, the founder of
      [[genetic-algorithm|genetic algorithms]]. After working on the logical design of IBM's first
      commercial computer, he earned one of the earliest US doctorates in computer science
      (Michigan, 1959). In the 1960s he and his students developed methods that evolve populations
      of candidate solutions, encoded as strings, through selection, crossover and mutation, and his
      'Adaptation in Natural and Artificial Systems' (1975) gave them a theory, including the schema
      theorem, and analyzed adaptation as a balance between
      [[exploration-exploitation-trade-off|exploration and exploitation]]. He also invented learning
      classifier systems, rule-based agents whose bucket-brigade algorithm passes credit back along
      chains of rules, a precursor of [[temporal-difference-learning|temporal difference learning]]
      for the [[credit-assignment-problem|credit assignment problem]]. A founding figure of
      complexity science at the Santa Fe Institute, he wrote 'Hidden Order' (1995) and 'Emergence'
      (1998). He received a MacArthur Fellowship (1992).
