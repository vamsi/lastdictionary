domain: orgs
domains:
  - llm
level: specialist
plain: >-
  A leading yearly conference on getting computers to handle human language, founded in the 1990s
  for data-driven methods and now dominated by work on large language models.
senses:
  - definition: >-
      The Conference on Empirical Methods in Natural Language Processing, run by a special-interest
      group of the [[association-for-computational-linguistics|Association for Computational
      Linguistics]] and ranked with that society's own annual meeting as a premier venue for
      [[natural-language-processing|natural language processing]]. It began as a forum for the
      statistical, corpus-based methods that displaced hand-written rules in the 1990s and now
      covers all of NLP, dominated since about 2020 by research on [[large-language-model|large
      language models]]. Landmark EMNLP papers include the GloVe [[word-embedding|word embeddings]]
      (2014), the encoder–decoder translation model that introduced the gated recurrent unit (2014)
      and Sentence-BERT (2019). Submissions are reviewed through ACL Rolling Review, and accepted
      work appears either in the main proceedings or in Findings volumes.
origin: >-
  Grew out of workshops on very large corpora held from 1993; the first EMNLP met in 1996 in
  Philadelphia, organized by SIGDAT, the ACL's special interest group on linguistic data and
  corpus-based approaches, which still oversees it.
year: 1996
