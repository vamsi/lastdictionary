level: core
plain: >-
  The US government's AI testing and standards center, part of the National Institute of Standards
  and Technology. It evaluates advanced AI models, American and foreign, for national-security risks
  and works with companies on voluntary testing.
senses:
  - definition: >-
      A center of the National Institute of Standards and Technology (NIST) that is the federal
      government's designated partner for AI companies on model testing and research, with a remit
      centered on national security. Its work turns on evaluations: voluntary testing under
      agreements with developers, unclassified assessments of capabilities with security
      implications (chiefly cyber, biological and chemical), and examinations of rival states'
      systems for backdoors and foreign influence, as in its published evaluations of Chinese
      [[open-weight-model|open-weight models]] from DeepSeek, Moonshot AI and Z.ai. Beyond testing,
      it drafts guidance on measuring and strengthening the security of AI systems and speaks for
      the United States in international standards work, where it is charged with resisting what the
      administration calls burdensome foreign regulation. It also runs an AI Agent Standards
      Initiative, and in June 2026 it reportedly tested the improved safeguards that preceded the
      Commerce Department's withdrawal of an [[export-control-directive|export control directive]]
      against two Anthropic models. After [[executive-order-14434|Executive Order 14434]] (September
      2026) told agencies to say 'Super Intelligence' instead of 'AI', the heading of NIST's web
      page for the center read 'Center for Advancing Innovation and Standards for Super Intelligence
      (CAISSI)', but as of October 2026 no formal renaming had been announced and NIST's own text
      still used CAISI.
    example: >-
      CAISI's evaluation compared the Chinese open-weight model with US frontier models on cyber
      tasks.
origin: >-
  Created as the US AI Safety Institute in November 2023 under [[executive-order-14110|Executive
  Order 14110]] and led initially by Elizabeth Kelly; Commerce Secretary Howard Lutnick announced
  its reorganization and renaming as CAISI on June 3, 2025, dropping 'safety' from its name.
  [[america-s-ai-action-plan|America's AI Action Plan]] (July 2025) assigned it further evaluation
  duties.
year: 2025
note: >-
  Its shift from safety toward security and competitiveness paralleled the UK institute's 2025
  renaming as the AI Security Institute. It was created by departmental decision rather than by
  statute; the Future of AI Innovation Act of 2024, which would have codified its predecessor, did
  not pass.
