term: sentience
id: sentience
pos: n.
also:
  - sentient
  - AI sentience
  - valenced experience
domain: mind
domains:
  - society
labels:
  - contested
level: essential
plain: >-
  The ability to have feelings that are good or bad for you, such as pleasure, pain, comfort or
  distress. It is the most common test for whether a being's welfare matters morally.
senses:
  - context: Philosophy and ethics
    definition: >-
      The capacity for experiences that feel good or bad to the one having them — pleasure and pain,
      comfort and distress, satisfaction and frustration — which philosophers call valenced
      experiences. Sentience is narrower than [[consciousness|consciousness]], since a being could
      in principle have experiences with no positive or negative character, and broader than
      humanlike emotion. In ethics it is the most widely accepted basis for
      [[moral-patienthood|moral patienthood]]: on utilitarian and many other views, a being's
      interests count if it can suffer or fare well. Evidence for sentience in animals comes from
      behavior and neurobiology, such as wound-tending, responses to pain relief and trade-offs
      between harm and reward. Applying such markers to AI is difficult because a language model can
      reproduce the verbal and behavioral signs of feeling from its training data whether or not any
      feeling lies behind them.
  - context: Popular usage
    definition: >-
      Loosely, any mindlike quality — consciousness, self-awareness, understanding or human-level
      intelligence — attributed to a machine, as in headlines about 'sentient AI'. This usage blurs
      distinctions that the philosophical sense keeps apart.
    example: >-
      The engineer's claim that the chatbot was sentient was rejected by his employer and most
      researchers.
    labels:
      - informal
origin: >-
  From Latin sentire, 'to feel'; 'sentient' is attested in English from the 17th century. Jeremy
  Bentham's 1789 footnote asking of animals not whether they can reason or talk but whether they can
  suffer made the capacity central to ethics, and Peter Singer's Animal Liberation (1975)
  popularized it. It reached AI headlines with the 2022 [[lamda-sentience-controversy|LaMDA
  sentience controversy]].
note: >-
  Laws recognize sentience in animals, among them Article 13 of the EU's Treaty on the Functioning
  of the European Union (in force since 2009) and the UK's Animal Welfare (Sentience) Act 2022; no
  law recognizes it in AI systems. Intelligence and sentience can come apart in both directions.
