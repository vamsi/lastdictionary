level: core
dates: 1894–1964
plain: >-
  An American mathematician who founded cybernetics, the study of feedback and control in animals
  and machines, and warned early that machines might pursue goals we did not truly intend.
senses:
  - definition: >-
      American mathematician at the Massachusetts Institute of Technology (MIT) who founded and
      named [[cybernetics|cybernetics]]. Wartime work on predicting the paths of aircraft for
      anti-aircraft fire led him to statistical prediction and filtering (the Wiener filter) and to
      feedback as a general principle of purposeful behavior, set out in 'Cybernetics: Or Control
      and Communication in the Animal and the Machine' (1948). 'The Human Use of Human Beings'
      (1950) examined the social consequences of [[automation|automation]], including
      [[technological-unemployment|technological unemployment]]. In a 1960 Science article he argued
      that before entrusting a task to a machine we cannot readily stop, we must be sure that 'the
      purpose put into the machine is the purpose which we really desire', a passage now often cited
      as an early statement of the [[alignment-problem|alignment problem]]. He received the US
      National Medal of Science and, posthumously, a National Book Award for 'God & Golem, Inc.'
      (1964).
