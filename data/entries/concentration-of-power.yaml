term: concentration of power
id: concentration-of-power
pos: n.
also:
  - power concentration
  - AI power concentration
  - market concentration in AI
  - AI-enabled power grab
domain: society
domains:
  - gov
  - asi
labels:
  - contested
level: core
plain: >-
  The worry that AI will put enormous economic, political or military power in the hands of a few
  companies, governments or individuals, beyond the reach of ordinary checks and balances.
senses:
  - definition: >-
      The accumulation of economic, political, informational or military power in a small number of
      actors as a result of AI development and deployment. Economically, frontier AI has high fixed
      costs and economies of scale in [[compute|compute]], data, talent and distribution, so model
      development and the cloud and chip supply chains are dominated by a handful of firms, raising
      competition concerns about vertical integration, exclusive partnerships and control of key
      inputs. Politically, AI can strengthen [[ai-surveillance|surveillance]], censorship and
      persuasion, and if AI substitutes for human workers and soldiers, rulers may depend less on
      the cooperation of citizens. Safety researchers add scenarios in which a company, faction or
      individual with privileged access to highly capable AI seizes illegitimate control. Proposed
      remedies include antitrust enforcement and access obligations, [[compute-governance|compute
      governance]], public AI infrastructure, transparency rules, wider distribution of model access
      and safeguards against insider misuse.
    example: >-
      Her objection to the merger was about concentration of power: one firm would own the chips,
      the cloud and the models.
origin: >-
  A long-standing theme of political economy and technology criticism, applied to AI by researchers
  such as the AI Now Institute and by competition authorities including the UK Competition and
  Markets Authority (foundation-model reviews, 2023–2024). Work such as Tom Davidson, Lukas
  Finnveden and Rose Hadshar's 'AI-Enabled Coups' (Forethought, 2025) extended it to illegitimate
  seizures of power ([[ai-enabled-coup|AI-enabled coups]]).
note: >-
  Concern is shared across political and intellectual camps, but remedies divide them: some favor
  [[open-weight-model|open-weight models]] and decentralization, while others argue that open
  release spreads dangerous capabilities and prefer regulating a few accountable developers. See
  also [[gradual-disempowerment|gradual disempowerment]] and the [[intelligence-curse|intelligence
  curse]].
