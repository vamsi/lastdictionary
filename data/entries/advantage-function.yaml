sources:
  - text: >-
      Baird, L. C. (1993). Advantage Updating. Technical report WL-TR-93-1146, Wright Laboratory,
      Wright-Patterson Air Force Base.
  - text: >-
      Wang, Z. et al. (2016). Dueling Network Architectures for Deep Reinforcement Learning. ICML
      2016.
