plain: >-
  The Taiwanese-American co-founder and chief executive of Nvidia, whose graphics chips became the
  main engine for training and running modern AI.
senses:
  - definition: >-
      Taiwanese-born American electrical engineer who co-founded [[nvidia|Nvidia]] in 1993, with
      Chris Malachowsky and Curtis Priem, and has led it as chief executive ever since. The company
      built graphics processors for video games, marketing the GeForce 256 (1999) as the first
      [[gpu|GPU]], and under Huang invested from 2006 in [[cuda|CUDA]], a platform for
      general-purpose computing on GPUs. After researchers used CUDA to train [[alexnet|AlexNet]]
      (2012), Nvidia's chips, software and networking became the standard infrastructure of
      [[deep-learning|deep learning]]; Huang personally delivered the first DGX-1 AI supercomputer
      to [[openai|OpenAI]] in 2016. Demand for data-center GPUs such as the [[h100|H100]] made
      Nvidia the world's most valuable company in 2024, and in October 2025 the first company valued
      at more than US$5 trillion. Its sales to China have been shaped by
      [[export-controls-on-ai-chips|export controls on AI chips]]. He shared the 2025 Queen
      Elizabeth Prize for Engineering with Nvidia's chief scientist, Bill Dally, and received the
      2026 IEEE Medal of Honor.
