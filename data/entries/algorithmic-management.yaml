term: algorithmic management
id: algorithmic-management
pos: n.
also:
  - management by algorithm
  - automated management
  - algorithmic boss
domain: society
domains:
  - gov
level: core
plain: >-
  When software, rather than a human manager, assigns work, sets pay, tracks performance and even
  disciplines or fires workers, as in ride-hailing, delivery and warehouse jobs.
senses:
  - definition: >-
      The use of software, data and increasingly AI to carry out managerial functions over workers:
      allocating tasks and shifts, setting prices and pay, monitoring activity and productivity,
      evaluating performance through metrics and customer ratings, and issuing nudges, warnings,
      deactivations or dismissals with little or no human involvement. Pioneered by gig platforms
      for ride-hailing and delivery, it has spread to warehouses, call centers, retail scheduling
      and office work. Research documents efficiency gains alongside opacity, intensified
      surveillance, speed-up, difficulty contesting decisions and the shifting of risk onto workers.
      The EU Platform Work Directive (Directive (EU) 2024/2831), which member states must transpose
      by 2 December 2026, requires platforms to be transparent about automated monitoring and
      decision-making systems, to ensure human oversight of them, and to give workers human review
      of significant decisions such as account suspension.
    example: >-
      Under algorithmic management, a driver's falling acceptance rate can end their account without
      any person reviewing it.
origin: >-
  Coined by Min Kyung Lee, Daniel Kusbit, Evan Metsky and Laura Dabbish in 'Working with Machines:
  The Impact of Algorithmic and Data-Driven Management on Human Workers' (CHI 2015), a study of Uber
  and Lyft drivers; Alex Rosenblat and Luke Stark's 2016 study of Uber drivers helped spread it.
year: 2015
see_also:
