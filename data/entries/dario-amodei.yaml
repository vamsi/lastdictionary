plain: >-
  An American AI researcher who co-founded Anthropic and is its chief executive, known for early
  work on scaling and AI safety and for forecasting very rapid AI progress.
senses:
  - definition: >-
      American AI researcher, co-founder and chief executive of [[anthropic|Anthropic]]. A
      Princeton-trained biophysicist, he worked at [[baidu|Baidu]] and [[google-brain|Google
      Brain]], where he was lead author of 'Concrete Problems in AI Safety' (2016). At
      [[openai|OpenAI]] (2016–2020), where he rose to vice president of research, he helped lead
      [[gpt-2|GPT-2]] and [[gpt-3|GPT-3]] and co-authored early work on [[scaling-laws|scaling
      laws]] and on learning from human preferences, the basis of
      [[reinforcement-learning-from-human-feedback|reinforcement learning from human feedback]]. In
      2021 he co-founded Anthropic with his sister Daniela Amodei and others. His essays 'Machines
      of Loving Grace' (2024), which pictured a '[[country-of-geniuses-in-a-datacenter|country of
      geniuses in a datacenter]]', and 'The Adolescence of Technology' (2026) weigh AI's promise and
      risks. In February 2026 he refused a US Department of Defense demand to drop Anthropic's
      limits on using its [[claude|Claude]] models for mass domestic surveillance or fully
      autonomous weapons, and the department designated the company a supply-chain risk; a federal
      judge temporarily blocked the government's measures in March 2026, but in September a federal
      appeals court in Washington, D.C., ruled that the designation could stand.
