level: specialist
plain: >-
  Research into whether quantum computers could learn from data faster or better than ordinary
  computers, and into using AI to study quantum systems. Practical advantages have not yet been
  shown.
senses:
  - definition: >-
      A research field at the intersection of quantum computing and [[machine-learning|machine
      learning]], with several strands: quantum algorithms intended to speed up learning on
      classical data (such as linear-algebra subroutines derived from the HHL algorithm);
      variational models, or 'quantum neural networks', in which parameterized quantum circuits are
      trained by a classical optimizer; learning from quantum data, such as states produced by
      quantum sensors or experiments, where provable advantages are clearest; and classical machine
      learning applied to quantum physics and hardware control. Several claimed exponential speedups
      have been weakened by 'dequantization' — classical algorithms with comparable performance
      under the same data-access assumptions — while variational models face barren plateaus
      (vanishing gradients) and noise on current hardware. As of 2026 no practically useful quantum
      advantage for mainstream machine learning has been demonstrated.
origin: >-
  Early proposals included quantum associative memories (late 1990s). The field took shape after
  Aram Harrow, Avinatan Hassidim and Seth Lloyd's quantum linear-systems algorithm (2008) and Lloyd,
  Masoud Mohseni and Patrick Rebentrost's 2013 paper; Jacob Biamonte and colleagues' Nature review
  (2017) consolidated the name. Ewin Tang's 2018 dequantization result tempered expectations.
year: 2013
note: >-
  Distinct from using AI to design, control or error-correct quantum computers, though both are
  sometimes grouped under the label. Marketing claims of 'quantum AI' deserve scrutiny.
