plain: >-
  An artificial intelligence institute at Stanford University that funds research, advises
  policymakers and publishes the AI Index, a widely cited yearly report on the state of AI.
senses:
  - definition: >-
      The Stanford Institute for Human-Centered Artificial Intelligence, an interdisciplinary center
      that funds and convenes work across the university on AI and its social effects and carries
      that work to policymakers. It publishes the annual AI Index, a widely cited compendium of data
      on AI research output, investment, compute, model performance, regulation and public opinion.
      Its Center for Research on Foundation Models introduced the term [[foundation-model|foundation
      model]] in a 2021 report, built the [[helm|HELM]] evaluation framework (2022) and created the
      Foundation Model Transparency Index (2023), which scores developers' disclosure practices. HAI
      runs policy programs for legislators and campaigned for a US
      [[national-ai-research-resource|National AI Research Resource]] to give academic researchers
      access to compute and data. Its 2019 launch drew criticism over the lack of diversity among
      its initially announced faculty.
    example: >-
      The AI Index chart on training costs ended up in half the slide decks at the summit.
origin: >-
  Launched in March 2019 with computer scientist [[fei-fei-li|Fei-Fei Li]] and philosopher and
  former Stanford provost John Etchemendy as founding co-directors. The AI Index began in 2017 as an
  offshoot of Stanford's One Hundred Year Study on Artificial Intelligence and later moved to HAI.
year: 2019
