level: core
plain: >-
  This book: a dictionary of intelligence, human and otherwise, which explains each word first in
  plain language, then precisely, and says when it was born.
senses:
  - context: This work
    definition: >-
      A dictionary of intelligence, human and otherwise, first issued in October 2026 with more than
      2,700 entries on artificial intelligence and the ideas around it, from [[bayes-theorem|Bayes'
      theorem]] and the [[perceptron|perceptron]] to [[harness|harnesses]],
      [[steering-vector|steering vectors]] and [[superintelligence|superintelligence]]. Each entry
      opens with a definition in plain words, then gives numbered technical senses, a dated origin,
      cross-references and sources; where a law or standard defines a term, the entry says which
      one. It is published at lastdictionary.com and as an open dataset, and was compiled with
      [[claude|Claude]].
    example: For the plain meaning of 'harness', The Last Dictionary is a good first stop.
  - context: The name
    definition: >-
      A deliberate pun on last in the sense of final. The model is Fermat's Last Theorem, so called
      because it was the last of Pierre de Fermat's unproved claims to be settled, three and a half
      centuries after he wrote it in a margin; the title borrows that air of a final word on the
      subject. The other readings come along too: the latest dictionary of a vocabulary still being
      coined, and one meant to last.
origin: >-
  Conceived in 2026 by Vamsi Kurama, whose father had introduced him to the IBM Dictionary of
  Computing, as that book's counterpart for the age of AI. Compiled with Claude, an AI model made by
  Anthropic, under the working title Dictionary of Superintelligence, and renamed before publication
  at lastdictionary.com.
year: 2026
note: >-
  Cite an entry as: The Last Dictionary, 1st ed. (October 2026), s.v. 'harness.' Despite the name,
  later editions are expected; a field this young keeps changing its words.
