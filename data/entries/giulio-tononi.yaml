term: Giulio Tononi
id: giulio-tononi
sort_as: Tononi Giulio
pos: prop. n.
domain: people
domains:
  - mind
level: specialist
dates: b. 1960
plain: >-
  An Italian-American neuroscientist who created integrated information theory, which measures
  consciousness by how unified a system's internal causes are, and which implies ordinary computers
  are not conscious.
senses:
  - definition: >-
      Italian-born American neuroscientist and psychiatrist at the University of Wisconsin–Madison,
      originator of [[integrated-information-theory|integrated information theory]] (IIT). After
      working with Gerald Edelman on the neural basis of consciousness, he proposed in 2004 that
      consciousness is integrated information: a system is conscious to the degree that its causal
      structure forms a unified whole that specifies more than its parts do, quantified by a measure
      called Φ (phi). Later versions, developed with Christof Koch, Larissa Albantakis and others
      (IIT 3.0, 2014; IIT 4.0, 2023), derive requirements on physical mechanisms from axioms about
      experience. For AI the theory has a distinctive consequence: what matters is the causal
      architecture of the hardware, not the computation performed, so conventional digital computers
      would have almost no consciousness however intelligently they behave. IIT is a leading but
      contested theory; in 2023 more than a hundred researchers signed a letter calling it
      pseudoscience, prompting sharp replies.
