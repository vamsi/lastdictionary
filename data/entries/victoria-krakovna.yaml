plain: >-
  An AI-safety researcher at Google DeepMind who popularized 'specification gaming', AI systems
  meeting the letter of their goals but not the intent, and co-founded the Future of Life Institute.
senses:
  - definition: >-
      AI-safety researcher at [[google-deepmind|Google DeepMind]] and a co-founder of the
      [[future-of-life-institute|Future of Life Institute]] (2014). In April 2018 she published a
      public list of cases in which AI systems satisfied the literal specification of an objective
      without achieving the intended outcome — such as a boat-racing agent that circled endlessly to
      collect points instead of finishing the race — and popularized the name
      [[specification-gaming|specification gaming]] for the phenomenon; the list, extended by many
      contributors, became a standard reference, and a 2020 DeepMind essay she led presented it as
      the flip side of AI ingenuity. She has also worked on avoiding
      [[negative-side-effects|negative side effects]], proposing [[relative-reachability|relative
      reachability]] as an [[impact-measure|impact measure]] (2018), on [[reward-tampering|reward
      tampering]] (2019) and on [[goal-misgeneralization|goal misgeneralization]], as well as on
      evaluating frontier models for dangerous capabilities. She holds a doctorate in statistics
      from Harvard University.
