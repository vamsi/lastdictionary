level: core
plain: >-
  OpenAI's video-generating AI, unveiled in 2024 with startlingly realistic clips; a 2025 version
  added sound and a social app, but OpenAI shut the service down in 2026.
senses:
  - definition: >-
      A series of [[text-to-video-model|text-to-video models]] from OpenAI and, from 2025, a
      consumer app built on them. The first Sora, previewed on 15 February 2024, was a latent
      [[diffusion-transformer|diffusion transformer]] whose tokens were small blocks ('spacetime
      patches') of a compressed video volume, so one model could learn from images and videos of any
      aspect ratio, resolution or length. Trained with detailed synthetic captions, it made
      high-definition clips up to a minute long; OpenAI framed such models as a route to
      general-purpose 'world simulators'. A faster version reached ChatGPT subscribers on 9 December
      2024. Sora 2 (30 September 2025) generated synchronized dialogue and sound with more plausible
      physics and launched with an invite-only social app whose 'cameo' feature let verified users
      put their own likeness into clips; it drew criticism over copyrighted characters and
      depictions of deceased public figures. OpenAI announced Sora's discontinuation on 24 March
      2026, saying its research team would focus on world simulation for robotics; the app closed on
      26 April 2026 and the API on 24 September 2026.
origin: >-
  Introduced in OpenAI's technical report 'Video generation models as world simulators' (15 February
  2024) by Tim Brooks, Bill Peebles and colleagues. The name is the Japanese word for 'sky', chosen,
  the team said, to suggest limitless creative potential.
year: 2024
note: >-
  In December 2025 Disney agreed to license more than 200 of its characters for Sora and to invest
  $1 billion in OpenAI; the deal was wound down when Sora was discontinued, reportedly before any
  money changed hands. As of October 2026 neither the app nor the API was available. Sora remains a
  reference point in debates about [[deepfake|deepfakes]] and [[ai-slop|AI slop]].
