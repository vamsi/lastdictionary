term: technological unemployment
id: technological-unemployment
pos: n.
also:
  - job displacement
  - AI job displacement
  - labor displacement
  - lump of labor fallacy
domain: society
domains:
  - hist
labels:
  - contested
level: core
plain: >-
  Joblessness caused by machines or software taking over work that people used to be paid for,
  faster than new kinds of work appear for them.
senses:
  - definition: >-
      Unemployment caused by technical change that reduces demand for human labor in particular
      tasks or occupations faster than the economy creates demand elsewhere. Economists, following
      Daron Acemoglu and Pascual Restrepo, set the displacement effect (machines taking over tasks)
      against offsetting forces: productivity effects (cheaper goods raising demand), reinstatement
      (new tasks in which people have an advantage) and shifts toward other sectors. Historically
      these offsets have kept long-run employment high, though transitions were often painful and
      displaced groups lost income. Whether AI breaks the pattern is disputed: some argue that
      systems able to perform most cognitive tasks, and later physical ones through robotics, could
      reduce labor demand permanently; others expect a familiar, if faster, reallocation. Studies of
      [[task-exposure|task exposure]] estimate which jobs are most affected, and policy debate
      covers retraining, wage insurance and [[universal-basic-income|universal basic income]].
    example: >-
      The study found little technological unemployment so far, but sharply lower hiring of junior
      staff in exposed occupations.
origin: >-
  Popularized by John Maynard Keynes in 'Economic Possibilities for our Grandchildren' (1930), which
  described it as a new disease readers would hear much more of; the worry goes back to David
  Ricardo's chapter 'On Machinery' (1821) and the [[luddite|Luddite]] protests. Carl Benedikt Frey
  and Michael Osborne's 2013 estimate that 47% of US jobs were at high risk of computerization
  revived the debate.
year: 1930
note: >-
  The lump-of-labor fallacy, the assumption that there is a fixed amount of work to go round, is the
  classic objection to simple job-loss arithmetic; it does not, however, show that displaced workers
  will find comparable jobs.
