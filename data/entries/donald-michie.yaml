level: specialist
dates: 1923–2007
plain: >-
  A British codebreaker turned AI pioneer who built a game-playing learning machine out of
  matchboxes and founded Edinburgh's influential machine-intelligence research group.
senses:
  - definition: >-
      British AI pioneer who founded machine-intelligence research at the University of Edinburgh. A
      wartime codebreaker at Bletchley Park, where he worked alongside [[alan-turing|Alan Turing]]
      and [[i-j-good|I. J. Good]], he trained as a geneticist after the war before returning to
      computing. His MENACE (1961), a noughts-and-crosses player built from 304 matchboxes holding
      colored beads, learned by adding or removing beads after wins and losses, an early
      demonstration of [[reinforcement-learning|reinforcement learning]]. In 1965 he founded
      Edinburgh's Experimental Programming Unit, which grew into a department of
      [[machine-intelligence|machine intelligence]] whose FREDDY robot assembled simple objects from
      parts; he introduced memo functions (memoization, 1968), devised the Graph Traverser search
      program with Jim Doran (1966) and launched the long-running Machine Intelligence workshops.
      Cuts after the [[lighthill-report|Lighthill report]] (1973), which he publicly debated,
      curtailed the work. He later promoted learning expert rules from examples, which led to
      [[behavioral-cloning|behavioral cloning]], and founded the Turing Institute in Glasgow (1984).
