  - personhood credentials
  - proof of personhood
domain: sec
domains:
  - society
  - gov
labels:
  - emerging
level: specialist
plain: >-
  A digital pass that lets you prove online that you are a real human, not an AI or a bot, without
  having to reveal who you are.
senses:
  - definition: >-
      A proposed form of digital ID that tells an online service only one thing, that a real human
      rather than an AI system or bot is behind an account, while privacy-preserving cryptography
      keeps the holder's identity hidden. Under the proposal, trusted issuers such as state agencies
      or other organizations would give out a limited number per person, and checks need not involve
      biometrics. The motivation is that AI can now pass for human online and can be deployed at
      scale for little cost, which defeats CAPTCHAs and similar defenses against fraud, spam and
      coordinated disinformation, whereas full identity verification would sacrifice too much
      privacy. Its authors and critics discuss risks of excluding people without credentials, of
      concentrating power in issuers, and of surveillance if the design is weakened.
    example: The forum lets anyone read, but posting now requires a personhood credential.
origin: >-
  Proposed by Steven Adler, Zoë Hitzig, Shrey Jain, Catherine Brewer and many co-authors from
  industry, academia and civil society in 'Personhood credentials: Artificial intelligence and the
  value of privacy-preserving tools to distinguish who is real online', posted to arXiv on 15 August
  2024.
year: 2024
