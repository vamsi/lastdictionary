term: Statement on Superintelligence
id: statement-on-superintelligence
pos: prop. n.
also:
  - superintelligence statement
domain: gov
domains:
  - asi
  - society
labels:
  - emerging
level: specialist
plain: >-
  A 2025 public statement, signed by scientists, celebrities and politicians, calling for a ban on
  building superintelligent AI until it is shown to be safe and the public supports it.
senses:
  - definition: >-
      A one-sentence public statement urging a ban on developing
      [[superintelligence|superintelligence]], to stay in force until scientists broadly agree that
      it can be built safely and kept under control and the public firmly backs going ahead. Unlike
      the 2023 [[pause-giant-ai-experiments|Pause Giant AI Experiments]] letter, it targets a
      capability level rather than calling for a time-limited pause, and unlike the
      [[statement-on-ai-risk|Statement on AI Risk]] it proposes a concrete policy. Its initial
      signatories spanned AI pioneers such as Geoffrey Hinton and Yoshua Bengio, business leaders,
      religious figures, entertainers and politicians from across the US political spectrum; as of
      October 2026 the statement's website listed more than 77,000 signatures.
    example: >-
      She signed the Statement on Superintelligence but still works on narrow medical AI.
origin: >-
  Organized by the [[future-of-life-institute|Future of Life Institute]] and released on 22 October
  2025, alongside US polling that the institute said showed majority support for withholding
  superintelligence until it is proven safe and controllable.
year: 2025
note: >-
  Debate has centered on whether a prohibition tied to a vaguely defined capability level could be
  specified, verified and enforced internationally.
