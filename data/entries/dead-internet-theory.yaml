labels:
  - contested
  - informal
level: core
plain: >-
  The idea, first a fringe conspiracy theory, that much of what we see online is now made by bots
  and AI rather than by real people.
senses:
  - definition: >-
      The claim that a large and growing share of online content and activity — posts, replies,
      reviews, images, followers — is produced by bots and [[generative-ai|generative AI]] rather
      than humans, so that much of the web amounts to machines addressing machines. In its original,
      conspiratorial form, it held that the internet had 'died' around 2016, its human activity
      swamped by automated content that governments used to steer public opinion. After ChatGPT's
      release in late 2022 a weaker, non-conspiratorial version entered mainstream discussion as
      [[ai-slop|AI slop]], automated engagement farming and AI-written spam multiplied; the security
      firm Imperva estimated that automated requests made up almost half of web traffic in 2023 and,
      for the first time, slightly more than half (51%) in 2024. Researchers caution that the share
      of AI-made content is hard to measure.
    example: >-
      Every reply under the post was a bot praising the bot that wrote it: dead internet theory in
      action.
origin: >-
  Traced to a post of 5 January 2021, 'Dead Internet Theory: Most Of The Internet Is Fake', by a
  user called IlluminatiPirate on the Agora Road's Macintosh Cafe forum, drawing on earlier
  imageboard threads; Kaitlyn Tiffany's article in The Atlantic of 31 August 2021 brought it wide
  attention. In September 2025 Sam Altman wrote that he had never taken the theory seriously until
  noticing how many accounts were run by language models.
year: 2021
