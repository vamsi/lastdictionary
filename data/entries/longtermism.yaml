term: longtermism
id: longtermism
pos: n.
also:
  - longtermist
  - strong longtermism
domain: asi
domains:
  - society
  - mind
labels:
  - contested
level: core
plain: >-
  The belief that we should care a great deal about how things go for humanity thousands or millions
  of years from now, since far more people may live then than have ever lived.
senses:
  - definition: >-
      The ethical position that shaping the far future well is one of the most important things
      people alive today can do. William MacAskill, a leading proponent, rests it on three claims:
      future people count morally, they could vastly outnumber everyone who has lived so far, and
      what we do now can change how their lives go. Strong longtermism holds that, in many
      decisions, effects on the far future are the most important consideration. Longtermists
      typically prioritize reducing [[existential-risk|existential risk]], including risks from
      misaligned AI, engineered pandemics and nuclear war, and avoiding bad [[value-lock-in|value
      lock-in]], arguing that preventing extinction preserves an astronomically large future. The
      view has shaped AI-safety funding and research through [[effective-altruism|effective
      altruism]]. Critics object to its reliance on expected-value reasoning about tiny
      probabilities of vast payoffs (see [[pascal-s-mugging|Pascal's mugging]]), to its potential to
      discount present suffering, and to its association with wealthy donors and AI companies; some
      fold it into the critical acronym [[tescreal|TESCREAL]].
    example: >-
      You don't need longtermism to care about AI risk if you think it could arrive within a decade.
origin: >-
  Coined around 2017 by the Oxford philosophers William MacAskill and Toby Ord; Hilary Greaves and
  MacAskill's paper 'The Case for Strong Longtermism' (2019, revised 2021) and MacAskill's What We
  Owe the Future (2022) gave its standard formulations. Nick Bostrom's 2003 paper 'Astronomical
  Waste' is a key precursor.
year: 2017
