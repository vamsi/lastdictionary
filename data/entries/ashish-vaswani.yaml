plain: >-
  An Indian-born computer scientist listed first on 'Attention Is All You Need', the 2017 paper that
  introduced the transformer, the design behind today's language models.
senses:
  - definition: >-
      Indian-born computer scientist, listed first among the eight Google authors of
      '[[attention-is-all-you-need|Attention Is All You Need]]' (2017), which introduced the
      [[transformer|transformer]]. The architecture replaced recurrence with
      [[self-attention|self-attention]], letting every position in a sequence attend directly to
      every other and allowing training to run in parallel across the sequence; it underlies
      [[bert|BERT]], [[gpt|GPT]] and nearly all later [[large-language-model|large language
      models]]. The paper states that its authors contributed equally and are listed in random
      order, and credits Vaswani, with Illia Polosukhin, with designing and implementing the first
      transformer models. He completed a PhD at the University of Southern California on neural
      language models for [[machine-translation|machine translation]] before joining
      [[google-brain|Google Brain]]. In 2022 he co-founded the startup Adept AI Labs and then, with
      fellow co-author Niki Parmar, Essential AI, which he led as chief executive; in June 2026
      Nvidia reportedly hired its team, including Vaswani.
