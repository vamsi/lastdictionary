# yaml-language-server: $schema=../schema/entry.schema.json

term: high-level machine intelligence
id: high-level-machine-intelligence
pos: n.
also:
  - HLMI
domain: asi
domains:
  - eval
  - society
level: specialist
plain: >-
  A yardstick used in surveys of AI researchers: the point at which machines on their own could
  outdo human workers at every task, in both quality and cost.
senses:
  - definition: >-
      A milestone defined for expert surveys so that respondents can forecast advanced AI without
      first agreeing on what intelligence is. In the surveys run by AI Impacts (2016, 2022 and
      2023), HLMI counts as reached when 'unaided machines can accomplish every task better and more
      cheaply than human workers', judged by feasibility rather than by whether law or custom
      permits deployment. A separate question asks when all occupations will be fully automatable
      (full automation of labor, FAOL). The results show strong framing effects: in the 2023 survey
      of 2,778 researchers who had published at leading AI venues, the aggregate forecast gave a 50%
      chance of HLMI by 2047, thirteen years earlier than in the 2022 survey, but a 50% chance of
      full automation of labor only by 2116, although HLMI would seem to imply that all occupations
      could be automated. An earlier survey by Vincent C. Müller and [[nick-bostrom|Nick Bostrom]]
      defined HLMI more loosely, as a machine able to do most human jobs at least as well as an
      ordinary practitioner of each.
    example: >-
      Respondents put HLMI decades earlier than full automation of labor, which should be nearly the
      same event.
origin: >-
  Used as the target milestone of Vincent C. Müller and Nick Bostrom's survey of AI experts,
  conducted in 2012–2013 and published in 2016; earlier uses not established. Katja Grace and
  colleagues at AI Impacts adopted a stricter version in a 2016 survey, published in 2018 as 'When
  Will AI Exceed Human Performance?', and repeated it in 2022 and 2023.
year: 2013
note: >-
  A forecasting construct rather than a research goal; rarely used outside survey literature.
  Compare [[transformative-ai|transformative AI]], defined by impact, and
  [[artificial-general-intelligence|artificial general intelligence]], defined by capability.
see_also:
  - AI timelines
  - human-level AI
  - artificial general intelligence
  - transformative AI
  - technological unemployment
  - automation
sources:
