domain: gen
domains:
  - infer
  - train
level: specialist
plain: >-
  Training a fast image generator to imitate a slow diffusion model, so that a picture that once
  took fifty steps can be made in one to four.
senses:
  - definition: >-
      A family of methods, a form of [[knowledge-distillation|knowledge distillation]], that
      compress a trained [[diffusion-model|diffusion model]] or [[flow-matching|flow matching]]
      model needing tens of sampling steps into a student that generates in one to a few network
      evaluations. Progressive distillation repeatedly trains a student to match two teacher steps
      with one, halving the step count each round. [[consistency-model|Consistency distillation]]
      trains a model to map any point on a teacher trajectory to its endpoint. Distribution-matching
      methods train a one-step generator so that its output distribution matches the teacher's,
      using the difference between two score estimates as a gradient (distribution matching
      distillation) or combining score distillation with a GAN-style discriminator (adversarial
      diffusion distillation, behind 'Turbo' models). [[classifier-free-guidance|Guidance]] can be
      distilled at the same time, removing its doubled cost. Distilled models make real-time and
      on-device generation practical but can lose diversity, fine control and
      [[negative-prompt|negative prompt]] support.
origin: >-
  Tim Salimans and Jonathan Ho's progressive distillation (posted February 2022; ICLR 2022) reached
  four-step sampling. Consistency models (2023), adversarial diffusion distillation by Axel Sauer
  and colleagues at Stability AI (November 2023) and distribution matching distillation by Tianwei
  Yin and colleagues (November 2023) pushed toward a single step.
year: 2022
