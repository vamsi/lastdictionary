term: Inflection AI
id: inflection-ai
pos: prop. n.
also:
  - Inflection
  - Pi
domain: orgs
domains:
  - llm
level: specialist
plain: >-
  An AI company founded in 2022 that made Pi, a friendly personal chatbot. In 2024 its leaders and
  most of its staff left to join Microsoft.
senses:
  - definition: >-
      An American AI company that developed Pi (2023), a conversational assistant designed to be
      supportive and emotionally attuned rather than task-focused, and its own Inflection
      [[large-language-model|language models]], trained on one of the largest GPU clusters of the
      time. In March 2024 Microsoft hired its co-founders Mustafa Suleyman and Karén Simonyan and
      most of its staff to form a new consumer AI division, paying Inflection to license its models.
      The deal became the template for the [[reverse-acquihire|reverse acquihire]] — hiring a
      startup's leaders and licensing its technology instead of buying the company — later echoed in
      Google's arrangement with [[character-ai|Character.AI]] and Amazon's with Adept, and it drew
      scrutiny from competition authorities in the United Kingdom and the United States. The
      remaining company turned to enterprise AI.
origin: >-
  Founded in 2022 in Palo Alto, California, by [[mustafa-suleyman|Mustafa Suleyman]], a co-founder
  of DeepMind, LinkedIn co-founder Reid Hoffman and former DeepMind researcher Karén Simonyan.
year: 2022
