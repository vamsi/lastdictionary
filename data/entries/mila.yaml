level: core
plain: >-
  Montreal's deep-learning hub, where professors and students from several Quebec universities work
  side by side. It grew from the lab Yoshua Bengio started in 1993 and is among the world's largest
  academic AI centers.
senses:
  - definition: >-
      A Montreal research institute run as a partnership of Quebec universities, chiefly the
      Université de Montréal and McGill University, whose deep-learning faculty and students it
      houses together; it ranks among the largest academic AI centers in the world. Yoshua Bengio's
      group, before and after it took the Mila name, produced foundational [[deep-learning|deep
      learning]] work: neural probabilistic [[language-model|language models]] (2003),
      [[generative-adversarial-network|generative adversarial networks]] (2014), the
      [[attention|attention]] mechanism for neural machine translation (2014–2015) and Theano
      (2007–2017), an early software framework for GPU-based deep learning. It is one of three
      national AI institutes under the Pan-Canadian Artificial Intelligence Strategy (2017), with
      the Vector Institute in Toronto and Amii in Edmonton, and has a substantial program on AI
      safety, ethics and policy.
origin: >-
  Grew from the LISA laboratory that [[yoshua-bengio|Yoshua Bengio]] founded at the Université de
  Montréal in 1993, later called the Montreal Institute for Learning Algorithms; in 2017 it became a
  partnership of Montreal universities, now known as Mila – Quebec AI Institute. In 2025 Hugo
  Larochelle, formerly head of Google Brain's Montreal team, succeeded Bengio as scientific
  director, with Bengio moving to an advisory role.
year: 1993
