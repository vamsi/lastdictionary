plain: >-
  A Soviet-born American mathematician who built the statistical theory of how machines learn from
  examples and co-invented support vector machines, a leading method before deep learning.
senses:
  - definition: >-
      Soviet-born American mathematician and a founder of statistical learning theory. At the
      Institute of Control Sciences in Moscow he and Alexey Chervonenkis developed
      Vapnik–Chervonenkis theory (1968–1974), which bounds how well a model fitted to training data
      will [[generalization|generalize]] in terms of its capacity, measured by the [[vc-dimension|VC
      dimension]], and the principle of structural risk minimization. After moving to AT&T Bell
      Laboratories around 1990 he co-developed the [[support-vector-machine|support vector
      machine]]: Bernhard Boser, Isabelle Guyon and Vapnik combined maximum-[[margin|margin]]
      classifiers with the [[kernel-trick|kernel trick]] (1992), and Corinna Cortes and Vapnik added
      the soft margin (1995). SVMs were among the most widely used learning methods from the late
      1990s until the rise of [[deep-learning|deep learning]]. He later worked at NEC Laboratories,
      Columbia University and Facebook AI Research. His books include 'The Nature of Statistical
      Learning Theory' (1995). Honors include the IEEE John von Neumann Medal (2017).
