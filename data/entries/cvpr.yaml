plain: >-
  The leading yearly conference on computer vision — teaching computers to understand images and
  video — and one of the most cited publication venues in any field of science.
senses:
  - definition: >-
      The IEEE/CVF Conference on Computer Vision and Pattern Recognition, a meeting usually held in
      June that is the largest and most influential in [[computer-vision|computer vision]]. Its
      prefix names its two sponsors, the IEEE Computer Society and the nonprofit Computer Vision
      Foundation, which makes the papers free to read online. Landmark papers presented there
      include the Viola–Jones face detector (2001), histograms of oriented gradients (2005), the
      [[imagenet|ImageNet]] dataset (2009), [[resnet|ResNet]] and [[yolo|YOLO]] (both 2016) and the
      [[latent-diffusion-model|latent diffusion model]] behind [[stable-diffusion|Stable Diffusion]]
      (2022). By Google Scholar's h5-index it has ranked among the most-cited publication venues in
      all of science since the late 2010s, a sign of how much modern AI draws on vision research.
      With the International and European Conferences on Computer Vision (ICCV and ECCV) it forms
      the field's top tier.
origin: >-
  First held in 1983 in Washington, D.C., under the IEEE Computer Society, continuing a line of
  pattern-recognition and image-processing meetings from the 1970s. The Computer Vision Foundation
  later became co-sponsor, giving the conference its 'IEEE/CVF' prefix.
year: 1983
