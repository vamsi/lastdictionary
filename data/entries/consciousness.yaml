# yaml-language-server: $schema=../schema/entry.schema.json

term: consciousness
id: consciousness
pos: n.
also:
  - conscious
  - conscious experience
  - subjective experience
domain: mind
domains:
  - society
  - safety
labels:
  - contested
level: essential
plain: >-
  Having experiences: there being something it feels like to be you, as when you see red or feel
  pain. Whether any AI is or could become conscious is an open and fiercely debated question.
senses:
  - context: Philosophy and cognitive science
    definition: >-
      The property of having subjective experience: a state is conscious if there is something it is
      like for its subject to be in it, in Thomas Nagel's formulation. Philosophers separate this
      [[phenomenal-consciousness|phenomenal consciousness]] from [[access-consciousness|access
      consciousness]] (information available for reasoning, report and control of action) and from
      wakefulness, attention and self-consciousness. Scientific theories such as
      [[global-workspace-theory|global workspace theory]],
      [[integrated-information-theory|integrated information theory]],
      [[higher-order-theories-of-consciousness|higher-order theories]],
      [[recurrent-processing-theory|recurrent processing theory]] and
      [[predictive-processing|predictive processing]] try to say which physical or functional
      processes give rise to it, and researchers search for its
      [[neural-correlates-of-consciousness|neural correlates]]. None of these theories commands
      consensus, and the [[hard-problem-of-consciousness|hard problem]] asks why any process should
      be accompanied by experience at all.
  - context: AI
    definition: >-
      The question whether artificial systems are or could become conscious, the subject of
      [[machine-consciousness|machine consciousness]]. Positions range from computational
      [[functionalism|functionalism]], on which running the right kind of computation would suffice,
      to [[biological-naturalism|biological naturalism]] and
      [[integrated-information-theory|integrated information theory]], on which conventional digital
      hardware would not. Because language models are trained on vast amounts of human writing about
      feelings, many researchers regard what they say about their own experience as weak evidence
      either way and look instead for [[indicator-properties-of-consciousness|indicator properties]]
      in a system's architecture and processing. The answer bears directly on
      [[moral-patienthood|moral patienthood]] and [[ai-welfare|AI welfare]].
    example: >-
      A model's fluent talk about its feelings tells us very little about whether it has
      consciousness.
origin: >-
  From Latin conscius, 'knowing with' others or oneself. The English noun dates from the 17th
  century; John Locke's Essay Concerning Human Understanding (1690) made it central to philosophy,
  defining it as the perception of what passes in one's own mind. Thomas Nagel's essay 'What Is It
  Like to Be a Bat?' (1974) made subjective experience, there being something it is like to be a
  creature, the field's standard criterion.
note: >-
  Everyday speech uses 'conscious' for being awake or for noticing something. In AI debates, claims
  about a model's self-awareness or [[situational-awareness|situational awareness]] concern what
  information it represents about itself, not necessarily experience. [[sentience|sentience]] is
  often used loosely as a synonym but properly means the capacity for experiences that feel good or
  bad.
