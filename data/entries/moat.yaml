term: moat
id: moat
pos: n.
also:
  - AI moat
  - no moat
  - economic moat
domain: culture
domains:
  - society
labels:
  - figurative
  - informal
level: core
plain: >-
  A lasting business advantage that keeps competitors out, like a castle's moat; in AI, the question
  of whether any company can stay ahead when rivals and free models catch up quickly.
senses:
  - definition: >-
      In business slang, whatever makes a company hard to dislodge: an advantage durable enough that
      rivals cannot easily copy it or lure away its customers. In AI the word frames a recurring
      debate over whether model developers can sustain an edge when capabilities diffuse quickly
      through publications, [[knowledge-distillation|distillation]], staff movement and
      [[open-weight-model|open-weight models]]. Candidate moats include proprietary data and
      user-feedback loops, distribution through existing products, access to [[compute|compute]] and
      capital, brand, and the engineering of products around models; skeptics argue that thin
      applications (see [[wrapper|wrapper]]), and even [[frontier-model|frontier models]]
      themselves, have little protection from fast followers. The term became a fixture of AI
      commentary after a leaked 2023 Google memo argued that neither Google nor OpenAI had one.
    example: >-
      Their moat isn't the model; it's the two hundred million people who already open the app every
      day.
origin: >-
  Warren Buffett had popularized the moat metaphor for durable business advantages ('economic moat')
  by the 1990s. The AI usage took off in May 2023 with 'We Have No Moat, And Neither Does OpenAI', a
  leaked internal memo later attributed to the Google engineer Luke Sernau and published by the
  newsletter SemiAnalysis, which argued that open-source models were rapidly closing the gap.
year: 2023
