# yaml-language-server: $schema=../schema/entry.schema.json

term: hard problem of consciousness
id: hard-problem-of-consciousness
pos: n.
also:
  - hard problem
  - explanatory gap
  - easy problems of consciousness
  - meta-problem of consciousness
domain: mind
labels:
  - contested
level: core
plain: >-
  The puzzle of why physical processes in a brain — or a computer — should feel like anything from
  the inside, rather than simply running without any inner experience.
senses:
  - definition: >-
      The problem of saying why physical processing should come with subjective experience at all —
      why there is [[phenomenal-consciousness|phenomenal consciousness]] rather than information
      processing with no inner feel — and how the one gives rise to the other. David Chalmers set it
      against what he called the 'easy problems': accounting for capacities such as attention,
      verbal report, the control of behavior, the integration of information and the discrimination
      of stimuli. Those are hard enough in practice, but each yields once a mechanism performing the
      function is found; experience, he argued, looks unexplained even after every function has been
      accounted for. Joseph Levine's 'explanatory gap' (1983) between physical and phenomenal
      descriptions is a close predecessor. Responses range from new fundamental laws and
      [[panpsychism|panpsychism]], through physicalist views that accept the gap as merely
      conceptual, to [[illusionism|illusionism]], which replaces the hard problem with the
      'meta-problem' of why we think there is one. The problem is why behavioral and functional
      evidence alone cannot settle questions of [[machine-consciousness|machine consciousness]].
origin: >-
  Named by David Chalmers in a talk at the first 'Toward a Science of Consciousness' conference in
  Tucson (April 1994) and in 'Facing Up to the Problem of Consciousness' (Journal of Consciousness
  Studies, 1995), then treated at book length in The Conscious Mind (1996). The underlying worry is
  older, from Gottfried Leibniz's mill thought experiment (1714) to Thomas Nagel (1974) and Levine
  (1983).
year: 1994
note: >-
  Some philosophers and scientists, including Daniel Dennett and Patricia Churchland, regard the
  hard/easy distinction as misleading. Chalmers's 'meta-problem' (2018), explaining why we judge
  there to be a hard problem, is a functional question that could in principle be studied in AI
  systems.
see_also:
  - phenomenal consciousness
  - philosophical zombie
  - knowledge argument
