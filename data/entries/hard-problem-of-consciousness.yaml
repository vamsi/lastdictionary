sources:
  - text: >-
      Chalmers, D. J. (1995). Facing Up to the Problem of Consciousness. Journal of Consciousness
      Studies 2(3), 200–219.
  - text: >-
      Levine, J. (1983). Materialism and Qualia: The Explanatory Gap. Pacific Philosophical
      Quarterly 64, 354–361.
