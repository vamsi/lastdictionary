domain: orgs
domains:
  - safety
  - gov
level: core
plain: >-
  A San Francisco nonprofit that studies how advanced AI could lead to disaster and how to prevent
  it. In 2023 it gathered signatures for a one-sentence warning that AI could threaten human
  extinction.
senses:
  - definition: >-
      A nonprofit devoted to research and advocacy aimed at preventing large-scale catastrophes from
      AI. It organized the May 2023 [[statement-on-ai-risk|Statement on AI Risk]], a single sentence
      placing the risk of extinction from AI alongside pandemics and nuclear war, signed by hundreds
      of researchers and executives. Its researchers created widely used benchmarks and safety
      datasets, including [[humanity-s-last-exam|Humanity's Last Exam]] (with [[scale-ai|Scale AI]],
      2025) and the [[wmdp|WMDP]] benchmark of hazardous knowledge (2024), and work on
      [[representation-engineering|representation engineering]], [[machine-unlearning|machine
      unlearning]] and robustness; its director had earlier led the creation of [[mmlu|MMLU]]. It
      provides a compute cluster to outside safety researchers, publishes a textbook and course on
      AI safety, and through its affiliated advocacy group, the CAIS Action Fund, co-sponsored
      California's [[sb-1047|SB 1047]].
origin: >-
  Founded in 2022 in San Francisco by Dan Hendrycks, its director, and Oliver Zhang. Hendrycks has
  also served as a safety adviser to xAI and Scale AI.
year: 2022
note: >-
  Not to be confused with government [[ai-safety-institute|AI safety institutes]], such as the UK's,
  or with the US [[center-for-ai-standards-and-innovation|Center for AI Standards and Innovation]].
