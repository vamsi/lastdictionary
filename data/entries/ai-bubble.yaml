term: AI bubble
id: ai-bubble
pos: n.
also:
  - AI investment bubble
  - AI stock bubble
  - AI boom
domain: society
domains:
  - hw
labels:
  - contested
level: essential
plain: >-
  The worry that investors are pouring far more money into AI companies, chips and data centers than
  AI will earn back soon, so that prices could crash as in the dot-com bust of 2000.
senses:
  - definition: >-
      A hypothesized speculative bubble in AI-related assets, in which the valuations of AI
      developers, chipmakers and cloud and data-center companies, and the capital spending they
      finance, exceed what realistic future revenues can justify. Those who see a bubble point to
      capital expenditure by the largest technology firms running at several hundred billion dollars
      a year; growing reliance on debt and private credit; [[circular-deal|circular deals]] in which
      suppliers invest in customers who then buy their products; heavy losses at leading model
      developers; a few firms accounting for most US stock-market gains; and modest measured
      productivity gains so far (see [[productivity-paradox|productivity paradox]]). Skeptics of the
      bubble thesis reply that, unlike in 2000, the leading firms have large profits and cash flows,
      demand for [[compute|compute]] exceeds supply, and usage and revenue are growing fast. Many
      argue both can be true: a financial bubble can burst while the technology, like the internet
      after 2000, proves transformative.
    example: >-
      Whether or not it is an AI bubble, the depreciation schedules on those GPUs look optimistic.
origin: >-
  Comparisons between the AI boom and the dot-com bubble became common from 2023 and intensified
  through 2025, with warnings from investors, central banks, the International Monetary Fund and
  some AI executives. A sharp sell-off in AI-related stocks on 23–26 June 2026, which began with
  chipmakers in South Korea and spread worldwide, and further swings in later months kept the debate
  alive; as of October 2026 it remained unresolved.
note: >-
  A bubble can be confirmed only after the fact. The word is used both for a precise financial claim
  (prices above fundamental value) and loosely for inflated expectations; see [[ai-hype|AI hype]].
