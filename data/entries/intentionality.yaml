# yaml-language-server: $schema=../schema/entry.schema.json

term: intentionality
id: intentionality
pos: n.
also:
  - aboutness
  - original intentionality
  - derived intentionality
  - intentional content
domain: mind
level: specialist
plain: >-
  The way thoughts, beliefs and desires are about things: a belief is about rain, a wish is for
  cake. Philosophers ask whether a machine's internal states can be about anything.
senses:
  - definition: >-
      The aboutness of the mind: the feature by which a mental state is directed at something beyond
      itself — an object, a property, a situation, even something nonexistent such as a unicorn —
      and which words, pictures and other representations have in a derived way. Beliefs, desires,
      intentions and perceptions have it; whether pains and moods do is debated. Franz Brentano
      proposed intentionality as the mark of the mental. John Searle distinguished intrinsic (often
      called original) intentionality, which minds have, from derived intentionality, which words
      and computer states have only because people interpret them, and argued that programs alone
      yield only the derived kind. Whether the representations inside
      [[large-language-model|language models]] have original intentionality — whether a model's
      'belief' is really about anything — is a live question in debates over
      [[machine-understanding|machine understanding]].
origin: >-
  From the medieval scholastic term intentio, revived by Franz Brentano in Psychology from an
  Empirical Standpoint (1874), who described mental acts as directed upon an object. John Searle's
  Intentionality (1983) and Daniel Dennett's work on the [[intentional-stance|intentional stance]]
  shaped its use in debates about AI.
year: 1874
note: >-
  Not the everyday sense of doing something intentionally, on purpose: in philosophy any state that
  is about something has intentionality, whether or not it involves an intention.
see_also:
  - intentional stance
  - symbol grounding problem
  - Chinese room
  - machine understanding
  - language of thought hypothesis
  - consciousness
sources:
  - text: >-
      Brentano, F. (1874). Psychologie vom empirischen Standpunkte (Psychology from an Empirical
      Standpoint). Duncker & Humblot.
  - text: >-
      Searle, J. R. (1983). Intentionality: An Essay in the Philosophy of Mind. Cambridge University
      Press.
