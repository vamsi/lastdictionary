  - people
labels:
  - informal
level: core
plain: >-
  A media nickname for three scientists — Geoffrey Hinton, Yoshua Bengio and Yann LeCun — whose
  decades of work on neural networks underpins modern AI. They shared computing's top prize in 2019.
senses:
  - definition: >-
      A journalistic epithet for [[geoffrey-hinton|Geoffrey Hinton]], [[yoshua-bengio|Yoshua
      Bengio]] and [[yann-lecun|Yann LeCun]], who kept research on [[neural-network|neural
      networks]] alive through the 1990s and early 2000s, when most of the field had turned to other
      methods, and whose work on [[backpropagation|backpropagation]],
      [[convolutional-neural-network|convolutional networks]], [[deep-belief-network|deep belief
      networks]], neural language models and attention laid the foundations of [[deep-learning|deep
      learning]]. The three shared the 2018 [[turing-award|Turing Award]], announced in March 2019.
      The label gained new prominence from 2023, when Hinton, who left Google that May, and Bengio
      warned publicly of catastrophic and [[existential-risk|existential risks]] from AI while LeCun
      dismissed such fears, so that the 'godfathers' came to personify opposing sides of the
      [[ai-safety|AI safety]] debate. In the singular, 'godfather of AI' most often means Hinton.
    example: Two of the three godfathers of AI now spend much of their time warning about it.
origin: >-
  Hinton was being called the 'godfather of deep learning' in the press by the mid-2010s; the plural
  became standard after the three shared the Turing Award in 2019. They had worked together since
  2004 in the Canadian Institute for Advanced Research's program on neural computation.
year: 2019
note: >-
  Critics say the label slights other pioneers — [[jurgen-schmidhuber|Jürgen Schmidhuber]] has
  publicly disputed the credit — and the many collaborators behind the work. [[fei-fei-li|Fei-Fei
  Li]] is sometimes called the 'godmother of AI' for [[imagenet|ImageNet]].
