level: core
plain: >-
  Forcing an AI model's output to follow a required format — such as valid code or a fill-in form —
  by blocking, at every step, any word that would break the rules.
senses:
  - definition: >-
      A [[decoding|decoding]] technique that restricts which [[token|tokens]] a
      [[language-model|language model]] may produce at each step so that the output is guaranteed to
      satisfy a formal constraint, typically by masking the [[logit|logits]] of disallowed tokens
      before sampling. Constraints may be lexical (required words or phrases, as in grid beam search
      for translation), a regular expression, a [[json-schema|JSON Schema]] or a context-free
      grammar. Efficient implementations compile the constraint into a finite-state machine or
      pushdown automaton and precompute, for each state, which vocabulary tokens are valid, taking
      care with tokens that span several grammar symbols. Constrained decoding underlies the strict
      modes of [[structured-outputs|structured outputs]] and [[json-mode|JSON mode]] in commercial
      APIs and the grammar features of open-source engines. It guarantees syntax, not correctness,
      and overly tight constraints can lower quality by pushing the model away from its preferred
      phrasing.
    example: >-
      With constrained decoding against the schema, every response parses — we deleted the retry
      logic.
origin: >-
  Lexically constrained decoding with grid beam search was introduced by Chris Hokamp and Qun Liu
  (April 2017; ACL 2017). Brandon T. Willard and Rémi Louf's finite-state formulation and Outlines
  library (July 2023), llama.cpp's GBNF grammars (2023) and OpenAI's strict structured outputs
  (August 2024) brought grammar-constrained generation into mainstream use.
year: 2017
