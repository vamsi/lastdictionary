level: core
plain: >-
  China's largest search-engine company and an early investor in deep learning, which makes the
  Ernie chatbot and models and runs driverless taxis.
senses:
  - definition: >-
      A Chinese internet company, operator of China's dominant search engine and one of the first
      large firms outside the United States to invest heavily in [[deep-learning|deep learning]]. It
      founded an Institute of Deep Learning in 2013 and in 2014 hired [[andrew-ng|Andrew Ng]] to
      lead Baidu Research in Beijing and Silicon Valley, which produced the Deep Speech recognizers
      and a 2017 study showing that error falls predictably as training data and model size grow, an
      early empirical statement of [[scaling-laws|scaling laws]]. Baidu open-sourced the
      PaddlePaddle deep-learning framework in 2016 and has developed the ERNIE family of
      [[large-language-model|language models]] since 2019; its Ernie Bot, unveiled in March 2023,
      was the first major Chinese response to [[chatgpt|ChatGPT]]. It also designs Kunlun AI chips
      and operates the Apollo Go [[robotaxi|robotaxi]] service.
origin: >-
  Founded in January 2000 in Beijing by Robin Li and Eric Xu; Li, its chief executive, had earlier
  developed a hyperlink-analysis method for ranking search results. Ernie Bot opened to the general
  public in August 2023 after regulatory approval.
year: 2000
