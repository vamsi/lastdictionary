  - confusion matrix
  - ROC curve
  - specificity
  - human-in-the-loop
contrast:
  - false positive
sources:
  - text: >-
      Neyman, J. & Pearson, E. S. (1933). On the Problem of the Most Efficient Tests of Statistical
      Hypotheses. Philosophical Transactions of the Royal Society A 231.
