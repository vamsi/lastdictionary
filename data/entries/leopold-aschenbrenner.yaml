plain: >-
  A German-born former OpenAI researcher whose 2024 essay series 'Situational Awareness' predicted
  human-level AI around 2027 and a government-led race to build superintelligence.
senses:
  - definition: >-
      German-born investor and former [[openai|OpenAI]] researcher, author of the essay series
      [[situational-awareness-essay|Situational Awareness: The Decade Ahead]] (June 2024). After
      graduating from Columbia University at 19 as valedictorian, he worked on economics research
      and for the FTX Future Fund before joining OpenAI's [[superalignment|superalignment]] team in
      2023; he was dismissed in April 2024 over what OpenAI called leaking, a characterization he
      disputed. The essays counted orders of magnitude of [[effective-compute|effective compute]]
      and of [[unhobbling|unhobbling]] gains to predict [[artificial-general-intelligence|artificial
      general intelligence]] around 2027, followed quickly by
      [[superintelligence|superintelligence]] through [[automated-ai-research|automated AI
      research]]; argued that a [[data-wall|data wall]] would not halt progress; called for
      national-security-grade protection of [[model-weight-security|model weights]] and algorithmic
      secrets; and predicted that the US government would launch a Manhattan Project-style effort,
      which he called the Project. He then founded an investment firm named Situational Awareness.
