# yaml-language-server: $schema=../schema/entry.schema.json

term: AI slop
id: ai-slop
pos: n.
also:
  - slop
  - AI-generated slop
  - slopification
domain: culture
domains:
  - gen
  - society
labels:
  - informal
level: essential
plain: >-
  Low-quality content churned out in bulk by AI — bland articles, fake-looking images, filler videos
  — posted to grab clicks or fill space, with little care for accuracy or value.
senses:
  - definition: >-
      Material generated with [[generative-ai|generative AI]] and pushed out in quantity with little
      human attention to whether it is true, useful or wanted: content-farm articles,
      search-optimized filler, surreal images and videos made to harvest social-media engagement,
      padded e-books, spam product listings and automated replies. Like 'spam' for unwanted email,
      the term names a relationship between content and audience rather than a technical category:
      the output is unrequested and wastes attention. Slop is blamed for degrading search results
      and feeds, misleading users, crowding out human creators and polluting future training data
      (see [[model-collapse|model collapse]]). The word has spread to work documents
      ([[workslop|workslop]]), code, scholarship and music.
    example: Half the results for that recipe were AI slop with invented cooking times.
origin: >-
  Applied to AI output from 2022, as image generators reached the public; early uses have been
  traced to in-group slang on 4chan, Hacker News and YouTube. In a blog post of 8 May 2024, Simon
  Willison, a British developer, promoted 'slop' as the word for unwanted AI-generated content;
  newspapers soon took it up, and Merriam-Webster and the American Dialect Society both chose 'slop'
  as their 2025 Word of the Year.
year: 2022
note: >-
  Viral examples include the 2024 wave of surreal Facebook images such as 'Shrimp Jesus' and
  AI-written event listings that drew crowds to nonexistent events. Distinguish slop, defined by low
  quality and indifference, from [[deepfake|deepfakes]], which are designed to deceive about
  specific people or events.
see_also:
  - workslop
  - model collapse
  - dead internet theory
  - synthetic media
  - LLM-isms
  - botshit
  - clanker
sources:
  - text: >-
      Willison, S. (2024). Slop is the new name for unwanted AI-generated content.
      simonwillison.net, 8 May 2024.
as_of: 2026-10
