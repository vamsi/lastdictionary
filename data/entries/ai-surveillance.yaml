# yaml-language-server: $schema=../schema/entry.schema.json

term: AI surveillance
id: ai-surveillance
pos: n.
also:
  - AI-enabled surveillance
  - algorithmic surveillance
  - smart surveillance
domain: society
domains:
  - gov
  - percep
level: core
plain: >-
  Using AI to watch, identify, track or profile people on a scale no team of humans could manage,
  for example by scanning camera feeds or analyzing phone and online data.
senses:
  - definition: >-
      The use of AI to automate the monitoring of people: [[facial-recognition|facial recognition]]
      and person re-identification across camera networks, automatic license-plate reading, voice
      and speaker identification, analysis of communications, location and online activity, and
      behavioral or risk profiling that flags individuals for attention. AI changes surveillance
      chiefly by removing the bottleneck of human attention: footage and records that once went
      unexamined can be searched, linked and analyzed continuously and cheaply. Uses range from
      targeted criminal investigation to city-wide 'safe city' systems, workplace and school
      monitoring, and the repression of minorities and dissidents. Responses include bans and
      moratoria on particular uses, the [[eu-ai-act|EU AI Act]]'s prohibitions and limits on
      [[remote-biometric-identification|remote biometric identification]],
      [[emotion-recognition-system|emotion recognition]] and [[social-scoring|social scoring]], and
      export controls on surveillance technology.
    example: >-
      With AI surveillance, a city's existing cameras can be searched for every appearance of one
      face in an afternoon.
origin: >-
  A descriptive compound in use since the 2010s, when deep learning made automated video and image
  analysis practical. Steven Feldstein's AI Global Surveillance Index (Carnegie Endowment for
  International Peace, 2019) found at least 75 of 176 countries using AI for surveillance, with
  Chinese and US firms the leading suppliers.
note: >-
  Related critiques include [[surveillance-capitalism|surveillance capitalism]], which concerns
  commercial data extraction, and the chilling effect: people curb lawful activity, such as protest,
  when they believe they are being watched.
see_also:
  - facial recognition
  - remote biometric identification
  - predictive policing
  - social scoring
  - surveillance capitalism
  - emotion recognition system
  - algorithmic management
sources:
