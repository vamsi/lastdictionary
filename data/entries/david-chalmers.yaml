dates: b. 1966
plain: >-
  An Australian philosopher who named the 'hard problem' of consciousness — why physical processes
  feel like anything at all — and who asks whether AI systems could be conscious.
senses:
  - definition: >-
      Australian philosopher of mind who in 1994–95 named the [[hard-problem-of-consciousness|hard
      problem of consciousness]]: explaining why physical processing is accompanied by subjective
      experience at all, as opposed to the 'easy problems' of explaining cognitive functions. A
      former doctoral student of [[douglas-hofstadter|Douglas Hofstadter]], he is now at New York
      University, where he co-directs the Center for Mind, Brain and Consciousness. 'The Conscious
      Mind' (1996) used the conceivability of [[philosophical-zombie|philosophical zombies]] to
      argue that physical facts do not entail consciousness, while defending a principle of
      organizational invariance on which a functional duplicate of a brain, even one made of
      silicon, would have the same experiences. With Andy Clark he proposed the
      [[extended-mind|extended mind]] thesis (1998). He wrote an influential philosophical analysis
      of the [[intelligence-explosion|intelligence explosion]] (2010) and has assessed whether
      [[large-language-model|large language models]] could be conscious (2023), co-authoring work on
      [[indicator-properties-of-consciousness|indicator properties of consciousness]] and on
      [[ai-welfare|AI welfare]].
