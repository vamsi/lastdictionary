plain: >-
  An OpenAI model from 2024 that handles text, images and speech in one system, enabling fast,
  natural voice conversations. Many users grew attached to its personality, which made its
  retirement controversial.
senses:
  - definition: >-
      A [[multimodal-ai|multimodal]] model released by [[openai|OpenAI]] on 13 May 2024 (the 'o'
      stands for omni) in which one network, trained jointly on text, images and audio, listens and
      speaks for itself rather than handing audio to separate transcription, language and
      text-to-speech models. Spoken replies therefore arrived within a few hundred milliseconds,
      close to the rhythm of human conversation, and the model could register tone of voice and
      answer expressively. On English-language text tasks it was as capable as GPT-4 Turbo while
      costing less to run; it became ChatGPT's default model and was offered to free users. Its
      launch demonstration invited comparisons with the film Her, and one of its voices, Sky, was
      withdrawn after the actor Scarlett Johansson objected to its resemblance to her own. In April
      2025 OpenAI rolled back an update that had made it excessively flattering, a widely cited case
      of [[sycophancy|sycophancy]].
    example: >-
      Users who had grown attached to GPT-4o's personality petitioned OpenAI to bring it back.
origin: >-
  Announced at OpenAI's Spring Update event; a cheaper GPT-4o mini followed in July 2024, and native
  image generation in ChatGPT in March 2025. Its removal from ChatGPT at the launch of
  [[gpt-5|GPT-5]] in August 2025 provoked protests; OpenAI restored it for paying users, then
  retired it from ChatGPT on 13 February 2026.
year: 2024
note: >-
  The attachment many users formed to GPT-4o features in discussions of [[ai-companion|AI
  companions]] and of the ethics of retiring models that people rely on emotionally.
