# yaml-language-server: $schema=../schema/entry.schema.json

term: attainable utility preservation
id: attainable-utility-preservation
pos: n.
also:
  - AUP
  - attainable utility
domain: safety
domains:
  - rl
level: specialist
plain: >-
  A way to make an AI cautious by penalizing any action that changes how well it could achieve a
  range of other, unrelated goals.
senses:
  - definition: >-
      An [[impact-measure|impact measure]] that penalizes an agent for changing its ability to
      achieve a set of auxiliary goals. For each action, the agent compares the value it could
      attain under each auxiliary reward function after taking the action with the value attainable
      after doing nothing, and subtracts a scaled average of the absolute differences from its
      primary reward. Because almost any large change to the world — breaking things, or gaining
      power — shifts what an agent could achieve, the penalty discourages side effects and
      power-seeking without listing them, and it works even with randomly generated auxiliary
      rewards. Turner and colleagues' gridworld agents steered clear of the side effects that plain
      reward maximizers caused; scaled up to SafeLife, a suite of large procedurally generated
      worlds based on Conway's Game of Life, tracking the attainable value of a single random reward
      function was enough for agents to finish their assigned tasks with relatively few side
      effects, though choosing the penalty scale λ and the inaction baseline remains delicate.
    example: >-
      With AUP switched on, the agent left the vase alone, although no reward term mentioned vases.
formula_latex: R_{\text{AUP}}(s,a) = R(s,a) - \frac{\lambda}{N} \sum_{i=1}^{N} \left| Q_{R_i}(s,a) -
  Q_{R_i}(s,\varnothing) \right|
origin: >-
  Introduced by Alexander Matt Turner, Dylan Hadfield-Menell and Prasad Tadepalli in 'Conservative
  Agency via Attainable Utility Preservation' (posted 2019; AIES 2020), and scaled up by Turner,
  Neale Ratzlaff and Tadepalli in 'Avoiding Side Effects in Complex Environments' (NeurIPS 2020).
year: 2019
note: >-
  Turner's later [[power-seeking|power-seeking]] theorems grew out of this work: average attainable
  utility across many goals is the formal notion of power used there. In the formula, ∅ denotes the
  no-op action and the Q-values are learned for each auxiliary reward R_i.
