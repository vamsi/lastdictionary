term: rubric reward
id: rubric-reward
pos: n.
also:
  - rubric-based reward
  - rubrics as rewards
  - RaR
  - checklist reward
  - rubric grading
domain: train
domains:
  - eval
  - llm
labels:
  - emerging
level: specialist
plain: >-
  A training score built from a checklist of specific things a good answer should do, with an AI
  grader ticking off each one — a way to reward quality where no single right answer exists.
senses:
  - definition: >-
      A reward signal for reinforcement-learning fine-tuning computed by grading a response against
      a rubric: a list of explicit, often prompt-specific criteria (for example, that an answer
      flags a drug interaction, avoids recommending a dosage or cites the governing statute), each
      with a weight and sometimes marked essential or penalizing. An [[llm-as-a-judge|LLM judge]]
      checks each criterion and the results are aggregated into a scalar, either as a weighted sum
      of per-item verdicts or as one holistic score guided by the rubric. Rubrics extend
      [[reinforcement-learning-with-verifiable-rewards|reinforcement learning with verifiable
      rewards]] to medicine, law, writing and research, where answers cannot be checked by rule,
      while being more transparent and harder to exploit than a single preference score from a
      [[reward-model|reward model]]. They may be written by experts, generated by models from
      reference answers, or both; their coverage and the judge's reliability bound what the policy
      can learn.
    example: >-
      Each medical prompt has a rubric of about twenty criteria, and the rubric reward is the
      weighted fraction met.
origin: >-
  Rubric-based grading of model outputs spread through evaluation benchmarks such as OpenAI's
  HealthBench (2025), which scores answers against physician-written criteria. Anisha Gunjal and
  colleagues at Scale AI (July 2025) proposed instance-specific rubrics as on-policy RL rewards,
  reporting relative gains of up to about 30 percent on HealthBench over Likert-scale judge rewards;
  Moonshot AI's Kimi K2 (2025) used a related self-critique rubric reward.
year: 2025
note: >-
  Not the same as [[process-reward-model|process rewards]], which grade reasoning steps; rubric
  items usually describe properties of the final answer. Vague or keyword-like criteria invite
  [[reward-hacking|reward hacking]].
