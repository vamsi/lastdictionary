term: Collingridge dilemma
id: collingridge-dilemma
pos: n.
also:
  - dilemma of control
domain: gov
domains:
  - society
level: specialist
plain: >-
  The trap that a new technology is easiest to control when little is known about its harms, but by
  the time the harms are clear it is too widespread to change easily.
senses:
  - definition: >-
      The double bind of steering a new technology, as David Collingridge framed it in 1980: while
      the technology is young and still malleable, too little is known about its effects to say how
      it should be shaped; once the effects are clear, it is entrenched in markets, infrastructure
      and habits, and reshaping it is slow and costly. In [[ai-governance|AI governance]] it is
      invoked both to argue for acting early on [[frontier-ai|frontier AI]] despite uncertainty and
      to justify adaptive tools — [[ai-regulatory-sandbox|regulatory sandboxes]], sunset clauses,
      delegated acts that update lists of high-risk uses, and revisable [[compute-threshold|compute
      thresholds]] — designed to keep rules correctable.
    example: >-
      Waiting for the evidence on AI companions risks the Collingridge dilemma: by then they will be
      everywhere.
origin: >-
  Formulated by the British technology scholar David Collingridge in The Social Control of
  Technology (1980), which argued that, since effects cannot be foreseen, technologies should be
  kept flexible and their adoption reversible.
year: 1980
note: >-
  Related to the 'pacing problem', the observation that technology changes faster than law can
  adapt. Both are cited on all sides: to argue for precaution and to argue against premature rules.
see_also:
  - AI governance
  - AI regulation
  - AI regulatory sandbox
  - risk-based approach
  - frontier AI
sources:
  - text: >-
      Collingridge, D. (1980). The Social Control of Technology. London: Frances Pinter.
