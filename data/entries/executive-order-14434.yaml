level: core
plain: >-
  A September 2026 order by US President Donald Trump telling federal agencies to say 'super
  intelligence' (SI) instead of 'artificial intelligence' (AI) in official documents and
  communications.
senses:
  - definition: >-
      A US presidential order, 'Inaugurating the Era of Super Intelligence', signed on September 29,
      2026, that changes the executive branch's vocabulary rather than its substantive rules. To the
      maximum extent permitted by law, agencies are to write 'Super Intelligence' and 'SI' where
      they would have written 'Artificial Intelligence' and 'AI' in their own non-statutory
      material, from letters and press releases to websites, reports and policy documents; earlier
      regulations, presidential actions, contracts, grants and other historical records need not be
      revised. The new terms are defined by reference to the statutory definition of
      [[artificial-intelligence|artificial intelligence]] in the National Artificial Intelligence
      Initiative Act (15 U.S.C. § 9401(3)), so the legal scope of federal AI policy is unchanged for
      now. The President's science adviser has 60 days to propose legislative language for a federal
      definition of the new terms, with any conforming amendments to statutes that say 'artificial
      intelligence'. The order's stated rationale is that frontier systems now amplify, rather than
      merely imitate or automate, human intelligence. It renames no office, though by October 2026
      the heading of NIST's web page for its AI evaluation center had been restyled 'Center for
      Advancing Innovation and Standards for Super Intelligence'.
    example: >-
      Since Executive Order 14434, the agency's press releases say SI where they used to say AI.
origin: >-
  Signed by President Donald Trump on September 29, 2026 and published in the Federal Register on
  October 2, 2026 (91 FR 63129). Its purpose section, which credits American innovation with pushing
  the technological frontier, carries the race-for-leadership framing of
  [[america-s-ai-action-plan|America's AI Action Plan]] (2025) into official terminology.
year: 2026
note: >-
  The federal usage departs from the established technical meaning of
  [[superintelligence|superintelligence]] — an intellect far exceeding the best human minds across
  virtually all domains — a bar that researchers do not generally regard any 2026 system as meeting.
  Statutes, courts, other governments and most researchers continue to say 'artificial
  intelligence'.
