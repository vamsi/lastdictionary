plain: >-
  A Chinese artificial intelligence company that grew out of Tsinghua University and makes the GLM
  family of language models. Outside China it uses the name Z.ai.
senses:
  - definition: >-
      A Chinese AI company, spun out of Tsinghua University's Knowledge Engineering Group, that
      develops the General Language Model (GLM) family of [[large-language-model|large language
      models]] and the ChatGLM and Z.ai assistants. Its GLM pretraining method (2021) unified
      bidirectional and autoregressive [[language-model|language modeling]] through blank infilling;
      the bilingual GLM-130B (2022) was among the first openly released models with over 100 billion
      parameters, and ChatGLM-6B (2023) was widely run on consumer hardware. Later
      [[open-weight-model|open-weight]] releases, such as GLM-4.5 (July 2025) and GLM-5 (February
      2026), targeted coding and agent tasks. In January 2025 the US Commerce Department added it to
      the Entity List, restricting American exports to it, and in January 2026 it became the first
      of China's large-model startups to list on the Hong Kong Stock Exchange.
origin: >-
  Founded in 2019 in Beijing to commercialize research led by Tsinghua professors Tang Jie and Li
  Juanzi; Zhang Peng is chief executive. It adopted the international brand Z.ai in July 2025 and
  the corporate name Knowledge Atlas Technology, under which its shares began trading in Hong Kong
  on 8 January 2026.
