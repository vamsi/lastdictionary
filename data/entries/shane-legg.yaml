level: core
dates: b. 1973 or 1974
plain: >-
  A New Zealand-born AI researcher who co-founded DeepMind and helped make 'artificial general
  intelligence' a mainstream term and goal.
senses:
  - definition: >-
      New Zealand-born computer scientist, co-founder and chief AGI scientist of
      [[google-deepmind|Google DeepMind]]. His doctoral thesis 'Machine Super Intelligence' (2008),
      supervised by Marcus Hutter at the Swiss AI lab IDSIA, built on [[aixi|AIXI]] and, with
      Hutter, proposed a formal measure of [[universal-intelligence|universal intelligence]]: an
      agent's expected performance across all computable environments, weighted toward simpler ones.
      In 2002 he suggested the phrase [[artificial-general-intelligence|artificial general
      intelligence]] to Ben Goertzel as a book title, helping establish the term. After postdoctoral
      work at the Gatsby Computational Neuroscience Unit in London, he co-founded
      [[deepmind|DeepMind]] in 2010 with [[demis-hassabis|Demis Hassabis]] and
      [[mustafa-suleyman|Mustafa Suleyman]], and he has led its work on AGI safety. Since the late
      2000s he has publicly estimated a 50 percent chance of human-level AGI by about 2028, and he
      co-authored Google DeepMind's [[levels-of-agi|levels of AGI]] framework (2023).
