term: Situational Awareness (essay)
id: situational-awareness-essay
pos: prop. n.
also:
  - "Situational Awareness: The Decade Ahead"
  - the Project
domain: asi
domains:
  - gov
  - society
level: specialist
plain: >-
  A long 2024 essay by a former OpenAI researcher arguing that AGI could arrive around 2027, that
  superintelligence could follow soon after, and that the US government should run a national AGI
  project.
senses:
  - definition: >-
      An essay series published in June 2024 arguing that [[artificial-general-intelligence|AGI]] by
      2027 is 'strikingly plausible' and that [[superintelligence|superintelligence]] could follow
      within about a year through automated AI research. Its forecast counts orders of magnitude
      ('OOMs') of [[effective-compute|effective compute]] from three sources: growth in physical
      training compute, gains in algorithmic efficiency, and 'unhobbling', the capability gained by
      turning chatbots into agents with tools, memory and long-horizon reasoning, which it projected
      would yield drop-in remote workers. It predicted training clusters costing around a trillion
      dollars by about 2030 and treated AGI as a matter of national security: laboratories must be
      secured against state espionage, especially by China, and around 2027–2028 the US government
      would, and should, take over frontier development in a Manhattan Project-style effort the
      author called the Project. Widely read in Washington and Silicon Valley, it was criticized for
      its straight-line extrapolations and its race framing.
    example: Half the arguments about AGI in 2024 were arguments with Situational Awareness.
origin: >-
  Written by Leopold Aschenbrenner, a former member of OpenAI's superalignment team, and published
  online in June 2024 as Situational Awareness: The Decade Ahead; he then founded an investment firm
  of the same name.
year: 2024
note: >-
  Not to be confused with [[situational-awareness|situational awareness]], a model's knowledge of
  its own nature and circumstances, which is a separate concept in AI safety.
