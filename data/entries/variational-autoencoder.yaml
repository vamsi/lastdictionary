term: variational autoencoder
id: variational-autoencoder
pos: n.
also:
  - VAE
  - β-VAE
  - beta-VAE
domain: gen
domains:
  - dl
  - math
level: core
plain: >-
  A neural network that learns to squeeze data into a compact, slightly fuzzy code and rebuild it,
  arranged so that decoding random codes produces new, plausible examples.
senses:
  - definition: >-
      A latent-variable [[generative-model|generative model]] trained by amortized variational
      inference. An encoder network maps an input x to the parameters of an approximate posterior
      q(z | x), usually a diagonal Gaussian over a low-dimensional latent vector z; a decoder
      network defines the likelihood p(x | z); and the prior p(z) is typically a standard normal.
      Both networks are trained jointly to maximize the [[evidence-lower-bound|evidence lower
      bound]] — a reconstruction term minus the [[kullback-leibler-divergence|Kullback–Leibler
      divergence]] from q(z | x) to the prior — with gradients passed through the sampling step by
      the [[reparameterization-trick|reparameterization trick]]. New data are generated by decoding
      samples from the prior. VAEs train stably and learn a smooth, structured [[latent-space|latent
      space]], but with simple Gaussian decoders their samples tend to be blurry. Their main role
      today is as the compression stage of [[latent-diffusion-model|latent diffusion]] and video
      models, where a VAE trained with added adversarial and [[perceptual-loss|perceptual losses]]
      maps pixels to a much smaller latent grid.
    example: >-
      The diffusion model never sees pixels; the VAE encodes each frame to a 4-channel latent first.
origin: >-
  Introduced independently by Diederik Kingma and Max Welling in 'Auto-Encoding Variational Bayes'
  (posted December 2013; ICLR 2014) and by Danilo Rezende, Shakir Mohamed and Daan Wierstra (posted
  January 2014; ICML 2014), building on the Helmholtz machine of the 1990s. Notable variants include
  the β-VAE (Irina Higgins and colleagues, 2017) for disentangled factors and the discrete
  [[vq-vae|VQ-VAE]] (2017).
year: 2013
note: >-
  Despite the name, a VAE is not just an [[autoencoder|autoencoder]] with added noise: its encoder
  outputs a distribution and its loss is a likelihood bound. A known failure, posterior collapse,
  occurs when a powerful decoder learns to ignore the latent code.
