dates: b. 1984
plain: >-
  A British entrepreneur who co-founded DeepMind and Inflection AI, leads Microsoft's effort to
  build its own advanced AI models, and has written about the difficulty of containing powerful AI.
senses:
  - definition: >-
      British entrepreneur, appointed chief executive of Microsoft AI in March 2024. After leaving
      the University of Oxford he co-founded a telephone helpline for young Muslims and worked in
      conflict resolution, then co-founded [[deepmind|DeepMind]] in 2010 with [[demis-hassabis|Demis
      Hassabis]] and [[shane-legg|Shane Legg]], leading its applied AI work, including DeepMind
      Health and data-center energy optimization. He moved to Google in 2019 as a vice president for
      AI product management and policy, and in 2022 co-founded [[inflection-ai|Inflection AI]] with
      Reid Hoffman and Karén Simonyan, maker of the chatbot Pi. Microsoft hired him and most of
      Inflection's staff in 2024 to lead its consumer AI products, including the Copilot assistant;
      in March 2026 Copilot passed to another executive so that he could concentrate on building
      Microsoft's own frontier models. His book 'The Coming Wave' (2023, with Michael Bhaskar)
      argues that containing AI and synthetic biology is the central challenge of the century. In
      2025 he warned against building [[seemingly-conscious-ai|seemingly conscious AI]] and launched
      a Microsoft team to pursue what he calls [[humanist-superintelligence|humanist
      superintelligence]].
