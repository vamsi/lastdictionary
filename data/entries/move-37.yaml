term: Move 37
id: move-37
pos: prop. n.
domain: hist
domains:
  - culture
  - rl
level: core
plain: >-
  A surprising move played by the AI program AlphaGo against champion Lee Sedol in 2016. Experts
  first thought it a mistake; it proved brilliant, and the phrase now stands for a creative, unhuman
  idea from AI.
senses:
  - context: History
    definition: >-
      The 37th move of the second game of the March 2016 match between [[alphago|AlphaGo]] and Lee
      Sedol, in which AlphaGo, playing black, placed a stone on the fifth line in a 'shoulder hit'
      that professional commentators at first took for an error, because convention favored the
      third or fourth line in that position. AlphaGo's own policy network had estimated that a human
      would choose the move with a probability of about one in ten thousand, yet it proved central
      to the program's victory. Lee took an unusually long time to reply. The move became the
      emblematic example of a machine finding a strategy outside human tradition rather than
      imitating it.
  - context: Figurative
    definition: >-
      By extension, any action by an AI system that experts find surprising, initially implausible
      and ultimately superior — taken as evidence of novel insight rather than recombination of
      training data. The phrase recurs in discussions of machine creativity, AI-driven scientific
      discovery and [[reinforcement-learning|reinforcement learning]] from [[self-play|self-play]],
      and as a benchmark for whether models can produce genuinely new ideas.
    example: >-
      We are still waiting for the Move 37 of mathematics — a proof idea no human would have tried.
    labels:
      - figurative
origin: >-
  The game was played in Seoul on 10 March 2016. The European champion Fan Hui, who had lost to
  AlphaGo months earlier, called the move beautiful and said no human would have played it; the 2017
  documentary AlphaGo carried the episode to wider audiences.
year: 2016
