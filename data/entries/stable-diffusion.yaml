plain: >-
  A widely used image-generating AI whose model files were released for anyone to download, so
  people could run it on their own computers and adapt it.
senses:
  - definition: >-
      A family of [[text-to-image-model|text-to-image models]] released by Stability AI with
      downloadable weights. The original 2022 models are [[latent-diffusion-model|latent diffusion
      models]]: a [[variational-autoencoder|VAE]] compresses 512 × 512 images to 64 × 64 × 4
      latents, an 860-million-parameter [[u-net|U-Net]] denoises them, and a frozen [[clip|CLIP]]
      ViT-L/14 text encoder (123 million parameters) supplies the prompt through
      [[cross-attention|cross-attention]]; training used subsets of [[laion-5b|LAION-5B]].
      Successors include Stable Diffusion 2 (November 2022), SDXL (July 2023; a
      3.5-billion-parameter base model with two text encoders), Stable Diffusion 3 (announced
      February 2024; a [[rectified-flow|rectified flow]] [[diffusion-transformer|diffusion
      transformer]] with the MMDiT architecture) and Stable Diffusion 3.5 (October 2024; Large at 8
      billion parameters and Medium at 2.5 billion), which as of October 2026 remained the latest
      release. Because the weights run on consumer GPUs, Stable Diffusion seeded a large open
      ecosystem — community web interfaces, [[low-rank-adaptation|LoRA]] fine-tunes,
      [[controlnet|ControlNet]], [[dreambooth|DreamBooth]] and [[textual-inversion|textual
      inversion]] — and popularized much of today's image-generation vocabulary.
    example: We fine-tuned Stable Diffusion on our product photos with a LoRA overnight.
origin: >-
  Developed by the CompVis group at LMU Munich and Runway, building on the latent diffusion paper of
  Robin Rombach and colleagues, with compute from Stability AI and training data from LAION. Version
  1 was released publicly on 22 August 2022 under the CreativeML OpenRAIL-M license; later models
  use Stability AI's own licenses, including its Community License.
year: 2022
note: >-
  Litigation over its training data includes Getty Images v. Stability AI, decided largely in
  Stability's favor by the High Court of England and Wales in November 2025, and the US artists'
  class action Andersen v. Stability AI. Downloadable weights under use restrictions make it an
  [[open-weight-model|open-weight model]] rather than [[open-source-ai|open-source AI]] in the
  strict sense.
