term: Content Credentials
id: content-credentials
pos: prop. n.
also:
  - content credential
  - CR icon
  - C2PA manifest
domain: sec
domains:
  - gen
  - society
  - gov
labels:
  - trademark
level: core
plain: >-
  A tamper-evident 'nutrition label' attached to a photo, video or document recording where it came
  from — which camera or AI tool made it and how it was edited — that anyone can inspect.
senses:
  - definition: >-
      The consumer-facing name for provenance metadata conforming to the [[c2pa|C2PA]] standard: a
      cryptographically signed manifest bound to a media file that records claims about its origin
      and history — capture device or generating AI tool, edits, and the ingredients combined into
      it — so that viewers and software can check who made those claims and whether the file has
      changed since they were signed. Credentials are shown through a small 'cr' icon or inspection
      tools and are attached by some cameras, phones, editing applications and generative-AI
      services, including labels stating that an image was AI-generated. Their main weakness is that
      metadata is easily lost through screenshots or platforms that strip it, and a file without
      credentials proves nothing; hence pairing them with [[ai-watermarking|watermarks]] embedded in
      the content itself, and with fingerprint lookups that can recover stripped credentials.
    example: >-
      Clicking the 'cr' icon showed the image was generated with an AI tool and later cropped in an
      editor.
origin: >-
  Adobe used the name from 2021 for provenance data produced through its Content Authenticity
  Initiative (founded 2019). In October 2023 the Coalition for Content Provenance and Authenticity
  introduced the 'cr' icon as a shared visible mark, and camera makers, phone makers and AI
  developers adopted Content Credentials in 2023–2026.
year: 2021
note: >-
  Content Credentials establish who claims what about a file, not whether its content is true; a
  signed photo can still be staged, and credentials can be honestly absent.
