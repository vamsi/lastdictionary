# yaml-language-server: $schema=../schema/entry.schema.json

term: ELIZA effect
id: eliza-effect
pos: n.
domain: hist
domains:
  - mind
  - society
level: core
plain: >-
  Our tendency to believe that a computer understands us, cares or thinks just because it produces
  humanlike words, even when it is only following simple rules.
senses:
  - definition: >-
      The tendency of people to attribute understanding, intentions, emotions or intelligence to a
      computer system on the strength of superficial conversational cues, reading more into its
      output than the underlying mechanism supports. Named for [[eliza|ELIZA]], whose
      keyword-and-template rules led users to confide in it, the effect is a special case of
      [[anthropomorphism|anthropomorphism]]. It is invoked in debates over [[chatbot|chatbots]],
      [[ai-companion|AI companions]] and [[large-language-model|large language models]] — by some to
      warn that fluent text is mistaken for comprehension, and by others who argue that dismissing
      far more capable systems as glorified ELIZAs underrates them. It also matters for evaluation,
      because judges in [[turing-test|Turing tests]] can be swayed by tone, persona and small talk.
    example: >-
      The designers worried that the ELIZA effect would lead customers to trust the support bot's
      confident but wrong answers.
origin: >-
  The observation goes back to Joseph Weizenbaum's accounts of users' reactions to ELIZA in the
  1960s and 1970s. Who first used the label is not established: it is recorded as AI-community slang
  in the hacker Jargon File, and Douglas Hofstadter's essay 'The Ineradicable Eliza Effect and Its
  Dangers' in Fluid Concepts and Creative Analogies (1995), its best-known early printed use,
  brought it to a wide readership.
year: 1995
note: >-
  A descriptive label rather than a measured psychological law; how far it applies to systems far
  more capable than ELIZA is debated.
see_also:
  - ELIZA
  - anthropomorphism
  - Turing test
  - AI companion
  - LaMDA sentience controversy
  - stochastic parrot
sources:
  - text: >-
      Hofstadter, D. R. (1995). Fluid Concepts and Creative Analogies: Computer Models of the
      Fundamental Mechanisms of Thought. New York: Basic Books.
