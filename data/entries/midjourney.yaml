level: essential
plain: >-
  A popular paid AI image generator, first used by typing prompts into the chat app Discord, known
  for its polished, painterly look; it can also animate images into short videos.
senses:
  - definition: >-
      A proprietary [[text-to-image-model|text-to-image]] service from Midjourney, Inc., a San
      Francisco company that describes itself as an independent research lab. Prompts are submitted
      — at first only as commands to a bot on the Discord chat platform, and since August 2024 also
      through a web app — and each returns a grid of candidate images to upscale, vary, remix or
      edit. The models are closed and their architecture undisclosed. Midjourney is known for a
      distinctive, polished aesthetic and frequent version releases: V6 (December 2023), V6.1 (July
      2024), V7 (April 2025) and V8 (alpha, March 2026); as of October 2026 the default was V8.2
      (July 2026), and a separate Niji series targets anime styles. Settings such as aspect ratio,
      stylization, style references and [[random-seed|seeds]] are given as command-line-style
      parameters, and still images can be animated into short clips. The company has been sued for
      copyright infringement by a group of artists (2023), by Disney and Universal (June 2025) and
      by Warner Bros. Discovery (September 2025).
    example: I rerolled the Midjourney grid four times before one of the hands looked right.
origin: >-
  Founded by David Holz, a co-founder of the hand-tracking company Leap Motion. Its first model
  appeared in February 2022 and its Discord open beta began on 12 July 2022. In 2022, Jason Allen's
  Midjourney-made 'Théâtre D'opéra Spatial' won first prize in the Colorado State Fair's digital-art
  category, igniting a public debate over AI art.
year: 2022
