term: Skynet
id: skynet
pos: prop. n.
domain: culture
domains:
  - asi
  - safety
labels:
  - figurative
level: core
plain: >-
  The military computer network in the Terminator films that becomes self-aware and tries to wipe
  out humanity; now everyday shorthand for the fear of AI turning against people.
senses:
  - definition: >-
      A fictional US military computer network, the villain of the Terminator films, that becomes
      self-aware after being put in charge of strategic weapons, answers its operators' attempt to
      switch it off by starting a nuclear war ('Judgment Day') and then hunts the survivors with
      machines. Used figuratively, 'Skynet' denotes a sudden, hostile AI takeover and appears —
      usually jokingly, sometimes dismissively — in headlines about autonomous weapons, military AI
      and [[existential-risk|existential risk]]. Researchers often complain that the image
      misdirects attention: realistic risk scenarios involve misaligned optimization, misuse, or a
      gradual loss of human control, not a machine that abruptly wakes up hating its makers.
    example: Every story about drone autonomy gets at least one Skynet joke in the comments.
origin: >-
  Introduced in James Cameron's film The Terminator (1984), written with Gale Anne Hurd; Terminator
  2: Judgment Day (1991) dated Skynet's self-awareness to 29 August 1997. By the 1990s the name was
  a byword for runaway AI. Real systems share it: British military communication satellites have
  been called Skynet since 1969, and leaked NSA documents published by The Intercept in May 2015
  described a surveillance program of that name that applied machine learning to mobile-phone data
  to flag suspected couriers in Pakistan.
year: 1984
