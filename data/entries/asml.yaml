plain: >-
  A Dutch maker of the giant machines that print circuit patterns onto chips. It alone can build the
  extreme-ultraviolet models on which today's most advanced chips, including AI chips, depend.
senses:
  - definition: >-
      The Dutch company that dominates photolithography, the chipmaking step in which light projects
      circuit patterns onto silicon wafers. Its extreme-ultraviolet (EUV) scanners, which work with
      13.5-nanometer light, have no competitor anywhere, and production at the most advanced
      [[process-node|process nodes]] depends on them. Each EUV machine costs well over $150 million
      and depends on a specialized supply chain, including Zeiss optics from Germany and light
      sources from ASML's San Diego subsidiary Cymer, which makes EUV one of the narrowest
      chokepoints in the production of AI accelerators. Since 2019 the Dutch government, under US
      pressure, has withheld EUV export licenses for China, and from 2023 it also restricted some
      advanced deep-ultraviolet systems, making ASML a key instrument of
      [[export-controls-on-ai-chips|export controls on AI chips]]. In 2025 it became the largest
      shareholder of [[mistral-ai|Mistral AI]].
origin: >-
  Founded in 1984 as ASM Lithography, a joint venture of Philips and ASM International, and
  headquartered in Veldhoven, the Netherlands. After decades of EUV development with partners, it
  shipped production EUV systems from 2017, which entered high-volume chipmaking in 2019. Christophe
  Fouquet became chief executive in 2024.
year: 1984
