plain: >-
  An online forum, founded in 2009, about thinking clearly and avoiding mental biases; it became a
  main gathering place for people worried about the dangers of advanced AI.
senses:
  - definition: >-
      An online forum and group blog devoted to human rationality, probability and decision theory
      and, increasingly, to [[ai-alignment|AI alignment]] and [[existential-risk|existential risk]]
      from AI. Built around Eliezer Yudkowsky's essays on reasoning and cognitive bias (later
      collected as 'the Sequences'), it became the hub of the [[rationalist-community|rationalist
      community]] and an incubator for AI-safety concepts and vocabulary, hosting early or
      influential discussions of [[instrumental-convergence|instrumental convergence]],
      [[mesa-optimization|mesa-optimization]], [[roko-s-basilisk|Roko's basilisk]] and the
      [[waluigi-effect|Waluigi effect]]. A sister site, the AI Alignment Forum (2018), carries more
      technical research and cross-posts to it. Critics describe the culture as insular and its
      speculation as weakly grounded; admirers credit it with taking AI risk seriously years before
      the subject reached the mainstream.
    example: >-
      The argument first appeared as a LessWrong post before it became a conference paper.
origin: >-
  Launched by Eliezer Yudkowsky in February 2009, growing out of Overcoming Bias, a group blog he
  had written since 2006 with the economist Robin Hanson. After declining in the mid-2010s, it was
  rebuilt as 'LessWrong 2.0' in 2017–2018 by a team led by Oliver Habryka, whose organization now
  operates as Lightcone Infrastructure.
year: 2009
