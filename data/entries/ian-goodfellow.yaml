dates: b. 1987
plain: >-
  An American computer scientist who invented generative adversarial networks, in which two neural
  networks compete to produce realistic fake images, and who pioneered research on fooling AI
  systems.
senses:
  - definition: >-
      American computer scientist who, as a doctoral student of [[yoshua-bengio|Yoshua Bengio]] and
      Aaron Courville at the Université de Montréal, invented
      [[generative-adversarial-network|generative adversarial networks]] (GANs, 2014): a generator
      learns to produce samples that a discriminator cannot distinguish from real data. GANs led
      image synthesis until [[diffusion-model|diffusion models]] overtook them and underlay early
      [[deepfake|deepfakes]]. He co-authored the paper that named [[adversarial-example|adversarial
      examples]] and demonstrated them in deep neural networks (Christian Szegedy et al., 2013) and
      introduced the [[fast-gradient-sign-method|fast gradient sign method]] (2014), which made
      [[adversarial-training|adversarial training]] practical and helped found the field of
      [[adversarial-machine-learning|adversarial machine learning]]. He co-wrote the textbook 'Deep
      Learning' (2016). He has worked at Google Brain, OpenAI, Apple, where he directed machine
      learning in its Special Projects Group (2019–2022), and Google DeepMind, which he joined in
      2022.
