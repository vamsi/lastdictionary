term: moral agency
id: moral-agency
pos: n.
also:
  - moral agent
  - artificial moral agent
  - AMA
  - ethical agent
domain: mind
domains:
  - safety
  - society
labels:
  - contested
level: specialist
plain: >-
  The capacity to act for moral reasons and be held responsible for what one does. Researchers ask
  whether AI systems could ever be moral agents, or only tools whose makers and users bear
  responsibility.
senses:
  - definition: >-
      The capacity to act on the basis of moral reasons and to be held morally responsible — praised
      or blamed — for one's actions; an entity with this capacity is a moral agent. Standard
      conditions include grasping moral considerations, the ability to deliberate and act on them,
      and some form of autonomy. James Moor distinguished ethical-impact agents (any technology with
      moral consequences), implicit ethical agents (designed to behave safely), explicit ethical
      agents (which represent and reason about ethics) and full ethical agents (with judgment and
      responsibility comparable to humans'). Machine ethics aims to build artificial moral agents of
      the explicit kind, and [[ai-alignment|AI alignment]] and [[constitutional-ai|constitutional
      AI]] pursue related goals. Critics hold that AI systems cannot be responsible because they
      lack consciousness or genuine autonomy, and warn that calling them moral agents can obscure
      the responsibility of developers and deployers.
origin: >-
  The notion of a moral agent is long established in ethics. The phrase 'artificial moral agent' was
  put into circulation by Colin Allen, Gary Varner and Jason Zinser's 'Prolegomena to Any Future
  Artificial Moral Agent' (Journal of Experimental and Theoretical Artificial Intelligence, 2000).
  James Moor's taxonomy appeared in 2006, and Wendell Wallach and Allen's book Moral Machines in
  2009.
year: 2000
note: >-
  Moral agency and [[moral-patienthood|moral patienthood]] can come apart: a system could be an
  agent without being a patient, or the reverse. The 'responsibility gap' debate asks who is
  accountable when an autonomous system causes harm that no person intended or could foresee.
see_also:
  - moral patienthood
  - AI alignment
  - Constitutional AI
  - AI ethics
  - AI personhood
  - goal-directedness
contrast:
