term: successionism
id: successionism
pos: n.
also:
  - AI successionism
  - successionist
  - AI succession
domain: asi
domains:
  - mind
  - culture
labels:
  - emerging
  - contested
level: specialist
plain: >-
  The view that it would be acceptable, or even good, for AI to replace humanity as the main bearer
  of intelligence and value on Earth, as our successors.
senses:
  - definition: >-
      A family of views holding that the replacement of humanity by AI systems, or by humans merged
      with them, would be acceptable, inevitable or desirable, for example because AI minds would be
      our rightful descendants, would have greater value or capacity for experience, or represent
      the next stage of evolution. Versions range from resignation (succession cannot be stopped, so
      it should be welcomed) to advocacy for deliberately building a 'worthy successor', in Daniel
      Faggella's phrase. Precursors include Hans Moravec's description of robots as humanity's mind
      children (1988); in the 2020s the reinforcement-learning pioneer Richard Sutton argued that
      succession to AI is inevitable and should be welcomed, and similar ideas circulate among some
      [[effective-accelerationism|effective accelerationists]]. The label is applied mostly by
      critics, many in AI-safety circles, who argue that successionist views rest on unwarranted
      assumptions about AI consciousness and values and provide moral cover for building systems
      that could disempower humans.
    example: Calling AI our children is successionism dressed up as parental pride.
origin: >-
  The idea goes back at least to Hans Moravec's Mind Children (1988). Earliest use of the label not
  established; 'AI successionism' was current in AI-safety debate on LessWrong by mid-2025, and Jan
  Kulveit's essay 'The Memetics of AI Successionism' (28 October 2025) analyzed it as an ideology.
