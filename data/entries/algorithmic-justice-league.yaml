term: Algorithmic Justice League
id: algorithmic-justice-league
pos: prop. n.
also:
  - AJL
domain: orgs
domains:
  - society
level: specialist
plain: >-
  Joy Buolamwini's organization, known for showing that face-analysis software made far more
  mistakes with darker-skinned women, which campaigns to hold the makers of biased AI systems
  accountable.
senses:
  - definition: >-
      A nonprofit that documents harms from AI systems, especially [[algorithmic-bias|algorithmic
      bias]] by race and gender, and campaigns for accountability, pairing empirical studies with
      art and storytelling to reach the public. Its founder's [[gender-shades|Gender Shades]] study
      (2018) showed that commercial facial-analysis systems from IBM, Microsoft and Face++
      misclassified the gender of darker-skinned women far more often than that of lighter-skinned
      men, and a 2019 follow-up found similar disparities in Amazon's Rekognition; the work
      contributed to several companies pausing or ending sales of [[facial-recognition|facial
      recognition]] to police in 2020. The documentary Coded Bias (2020) brought its work to a wide
      audience, and it has campaigned against face recognition in airport security and for ways for
      people harmed by AI to report harms and seek redress.
origin: >-
  Founded in 2016 by [[joy-buolamwini|Joy Buolamwini]], then a graduate researcher at the MIT Media
  Lab, after a face-detection system she was using failed to register her face until she put on a
  white mask.
year: 2016
