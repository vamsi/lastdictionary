term: Sparks of AGI
id: sparks-of-agi
pos: prop. n.
also:
  - Sparks of Artificial General Intelligence
  - Sparks paper
domain: hist
domains:
  - asi
  - llm
labels:
  - contested
level: specialist
plain: >-
  A 2023 Microsoft research paper arguing that an early version of GPT-4 showed the first glimmers
  of general, humanlike intelligence. Its claim provoked sharp debate about how to judge AI
  abilities.
senses:
  - definition: >-
      'Sparks of Artificial General Intelligence: Early experiments with GPT-4', a 155-page report
      by Microsoft Research scientists who had studied a pre-release version of [[gpt-4|GPT-4]] in
      late 2022. Using qualitative probes meant to avoid memorized material — drawing a unicorn by
      writing TikZ graphics code, proving the infinitude of primes as a poem, and novel coding,
      mathematics, theory-of-mind and planning tasks — the authors argued that its abilities were
      broad and general enough that it 'could reasonably be viewed as an early (yet still
      incomplete)' form of [[artificial-general-intelligence|artificial general intelligence]]. They
      also catalogued failures in planning, arithmetic and consistency. Critics objected that the
      claims were not peer reviewed, could not be reproduced on the unreleased model, rested on
      anecdotes rather than systematic evaluation, and came from a company with a commercial stake
      in the result.
    example: >-
      Half the field cited Sparks of AGI as a milestone; the other half cited it as a cautionary
      tale.
origin: >-
  Posted to arXiv on 22 March 2023, eight days after GPT-4's release, by Sébastien Bubeck, Varun
  Chandrasekaran, Ronen Eldan, Johannes Gehrke, Eric Horvitz, Ece Kamar, Peter Lee, Yin Tat Lee,
  Yuanzhi Li, Scott Lundberg, Harsha Nori, Hamid Palangi, Marco Tulio Ribeiro and Yi Zhang.
year: 2023
note: >-
  The paper's hedged AGI framing was widely reported as a claim that AGI had arrived, and 'sparks of
  AGI' became shorthand for the debate over whether large language models generalize or mainly
  interpolate their training data.
