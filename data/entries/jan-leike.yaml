  - train
level: specialist
plain: >-
  A German AI-alignment researcher who helped develop training from human feedback, co-led OpenAI's
  superalignment team, and now leads alignment research at Anthropic.
senses:
  - definition: >-
      German AI-alignment researcher who has led alignment teams at several [[frontier-lab|frontier
      labs]]. After a PhD on general reinforcement learning with [[marcus-hutter|Marcus Hutter]] at
      the Australian National University (2016), he joined DeepMind, where he co-authored the 2017
      paper on learning from human preferences that underlies
      [[reinforcement-learning-from-human-feedback|reinforcement learning from human feedback]],
      built the AI Safety Gridworlds test environments (2017) and proposed
      [[recursive-reward-modeling|recursive reward modeling]] (2018). At [[openai|OpenAI]] from 2021
      he led the alignment team whose methods produced the instruction-following InstructGPT models,
      and in July 2023 he and [[ilya-sutskever|Ilya Sutskever]] launched the
      [[superalignment|superalignment]] team, which studied
      [[weak-to-strong-generalization|weak-to-strong generalization]] and
      [[automated-interpretability|automated interpretability]]. He resigned in May 2024, writing
      that 'safety culture and processes have taken a backseat to shiny products', and joined
      [[anthropic|Anthropic]] to lead research on [[scalable-oversight|scalable oversight]],
      weak-to-strong generalization and automating alignment research. He popularized
      [[self-exfiltration|self-exfiltration]] as a key dangerous capability (2023).
