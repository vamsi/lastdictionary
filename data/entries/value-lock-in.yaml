# yaml-language-server: $schema=../schema/entry.schema.json

term: value lock-in
id: value-lock-in
pos: n.
also:
  - lock-in
  - values lock-in
  - AGI lock-in
domain: asi
domains:
  - society
  - gov
level: specialist
plain: >-
  The possibility that powerful AI could freeze one set of values or one power structure in place
  for an extremely long time, so that later generations could never change course.
senses:
  - definition: >-
      The persistence of a particular set of values, institutions or distribution of power for an
      extremely long period, potentially indefinitely, so that future agents cannot revise them.
      Advanced AI is thought to make lock-in newly feasible: unlike human institutions, AI systems
      can copy their goals exactly, need not die or be replaced by successors with different views,
      and could enforce rules perfectly, so a [[singleton|singleton]] or a dominant AI-backed regime
      might entrench whatever values it held when it formed. Lock-in is dangerous if those values
      are mistaken, since moral progress would stop; the concern motivates arguments for preserving
      pluralism, keeping options open and building AI that supports reflection rather than fixing
      answers early. Some authors also see an opportunity, since locking in good values could secure
      a long and flourishing future. Analysts disagree about how early in the AI transition lock-in
      becomes possible.
    example: >-
      Writing today's norms into a superintelligence's goals risks value lock-in of our current
      moral mistakes.
origin: >-
  Earliest use in this sense not established. Discussed in Nick Bostrom's work on singletons and in
  Superintelligence (2014); Will MacAskill's What We Owe the Future (2022) devoted a chapter to
  value lock-in, and Lukas Finnveden, Jess Riedel and Carl Shulman's report 'AGI and Lock-in' (2022)
  analyzed its mechanisms.
see_also:
  - singleton
  - longtermism
  - existential risk
  - coherent extrapolated volition
  - concentration of power
  - suffering risk
sources:
  - text: MacAskill, W. (2022). What We Owe the Future. Basic Books.
  - text: Finnveden, L., Riedel, J. & Shulman, C. (2022). AGI and Lock-in. Online report.
