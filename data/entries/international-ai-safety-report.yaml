term: International AI Safety Report
id: international-ai-safety-report
pos: prop. n.
also:
  - International Scientific Report on the Safety of Advanced AI
  - IASR
domain: gov
domains:
  - safety
level: core
plain: >-
  A large scientific review, led by the computer scientist Yoshua Bengio and backed by more than 30
  countries, summing up what is known about what advanced AI can do and how it could go wrong.
senses:
  - definition: >-
      A recurring scientific assessment of the capabilities and risks of general-purpose AI and of
      the methods for managing them, written by more than 100 independent experts under the
      chairmanship of [[yoshua-bengio|Yoshua Bengio]] and advised by a panel of nominees from more
      than 30 countries and international organizations, including the EU, the OECD and the UN.
      Loosely modeled on the Intergovernmental Panel on Climate Change, it synthesizes evidence
      rather than recommending policy, and groups risks into malicious use (such as cyberattacks,
      biological misuse and [[deepfake|deepfakes]]), malfunctions (including unreliability and
      [[loss-of-control|loss of control]]) and systemic risks (such as labor-market disruption and
      concentration of power). Its secretariat sits in the UK AI Security Institute. Editions
      comprise an interim report (May 2024), the first full report (January 2025), shorter key
      updates (late 2025) and the second full report (3 February 2026).
    example: >-
      The International AI Safety Report notes that some models behave differently when they detect
      that they are being tested.
origin: >-
  Commissioned by the UK government after the [[bletchley-declaration|Bletchley Declaration]] of
  November 2023 called for an internationally inclusive network of scientific research on frontier
  AI safety. The interim edition, titled International Scientific Report on the Safety of Advanced
  AI, was presented at the Seoul summit in 2024; later editions informed the Paris (2025) and New
  Delhi (2026) summits.
year: 2024
note: >-
  Not a UN body. The [[independent-international-scientific-panel-on-ai|Independent International
  Scientific Panel on AI]], created by the UN General Assembly in 2025, has a broader remit covering
  opportunities as well as risks; Bengio chairs the report and co-chairs the panel.
