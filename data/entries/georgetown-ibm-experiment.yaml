labels:
  - historical
level: specialist
plain: >-
  A 1954 public demonstration in New York in which an IBM computer translated about sixty Russian
  sentences into English. It raised hopes for automatic translation that took decades to fulfill.
senses:
  - definition: >-
      A joint demonstration by Georgetown University and IBM, held in New York on 7 January 1954,
      that gave the public its first sight of [[machine-translation|machine translation]]: an IBM
      701 rendered more than sixty Russian sentences, drawn mainly from chemistry, politics, law and
      military affairs, into English. Its entire linguistic equipment was a vocabulary of about 250
      words and six rules for choosing word senses and reordering words, and the sentences had been
      selected to suit it. Newspapers nonetheless reported a breakthrough, and the organizers
      forecast practical automatic translation within three to five years. The publicity helped
      release substantial US government funding during the Cold War, until the [[alpac-report|ALPAC
      report]] of 1966 concluded that the promise had not been kept.
    example: >-
      The Georgetown–IBM experiment is the textbook case of a demonstration that outran the
      technology.
origin: >-
  Led by Léon Dostert of Georgetown University and Cuthbert Hurd of IBM, with the linguist Paul
  Garvin designing the rules. It followed the first conference on machine translation, organized by
  Yehoshua Bar-Hillel at MIT in 1952.
year: 1954
