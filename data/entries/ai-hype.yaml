# yaml-language-server: $schema=../schema/entry.schema.json

term: AI hype
id: ai-hype
pos: n.
also:
  - AI boosterism
  - AI snake oil
  - criti-hype
domain: society
domains:
  - culture
labels:
  - contested
level: core
plain: >-
  Exaggerated claims about what AI can do or will soon do, made to attract money, attention or
  customers, which can mislead the public and policymakers.
senses:
  - definition: >-
      Exaggerated, unfounded or misleading claims about the capabilities, novelty, imminence or
      effects of AI, made by companies, investors, researchers, journalists or critics. Common forms
      include presenting narrow benchmark results as general competence, demos as finished products,
      anthropomorphic language about understanding or intention, dated promises of
      [[artificial-general-intelligence|artificial general intelligence]], and inflated figures for
      adoption or returns. Hype can raise capital and attention but distorts investment and policy,
      sets up disappointment and diverts scrutiny from present harms; 'criti-hype' is critique that
      accepts and amplifies inflated premises about capability. What counts as hype is itself
      contested: some claims dismissed as hype have come true quickly, and the charge is also used
      rhetorically to wave away legitimate concerns. Cycles of hype and disappointment preceded the
      [[ai-winter|AI winters]].
    example: Strip out the AI hype and the product is a decent classifier with a chat window.
origin: >-
  Hype, from early-20th-century American slang for deception or excessive promotion, has accompanied
  AI since the 1950s, and overpromising was blamed for the AI winters. 'AI hype' became a common
  phrase in the late 2010s; historian Lee Vinsel coined 'criti-hype' in 2021, and Arvind Narayanan
  and Sayash Kapoor's AI Snake Oil (2024) and Emily M. Bender and Alex Hanna's The AI Con (2025)
  systematized the critique.
note: >-
  [[ai-washing|AI washing]] is a specific form of hype in which products are falsely or loosely
  labeled as using AI.
see_also:
  - hype cycle
  - AI bubble
  - AI washing
  - AI winter
  - AI as normal technology
  - stochastic parrot
  - feel the AGI
sources:
  - text: >-
      Narayanan, A. & Kapoor, S. (2024). AI Snake Oil: What Artificial Intelligence Can Do, What It
      Can't, and How to Tell the Difference. Princeton University Press.
  - text: >-
      Bender, E. M. & Hanna, A. (2025). The AI Con: How to Fight Big Tech's Hype and Create the
      Future We Want. Harper.
