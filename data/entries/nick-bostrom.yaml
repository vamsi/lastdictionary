  - mind
level: core
dates: b. 1973
plain: >-
  A Swedish philosopher whose 2014 book 'Superintelligence' argued that AI smarter than humans could
  be catastrophic unless its goals are carefully controlled, and helped make AI risk a mainstream
  concern.
senses:
  - definition: >-
      Swedish-born philosopher at the University of Oxford, where he founded and directed the Future
      of Humanity Institute (2005–2024). He gave [[existential-risk|existential risk]] its modern
      definition (2002) and set out the simulation argument (2003). His book 'Superintelligence:
      Paths, Dangers, Strategies' (2014) argued that an AI exceeding human intellect could gain a
      [[decisive-strategic-advantage|decisive strategic advantage]] and that its goals need not be
      benign: by the [[orthogonality-thesis|orthogonality thesis]] almost any final goal is
      compatible with high intelligence, and by [[instrumental-convergence|instrumental
      convergence]] most goals favor self-preservation and resource acquisition. Ideas it
      popularized, some first set out in his earlier papers — the [[paperclip-maximizer|paperclip
      maximizer]], the [[treacherous-turn|treacherous turn]], the [[singleton|singleton]] — became
      standard vocabulary, and the book helped bring the [[alignment-problem|alignment problem]] to
      public and industry attention. Later work includes the
      [[vulnerable-world-hypothesis|vulnerable world hypothesis]] (2019) and 'Deep Utopia' (2024),
      on meaning in a world where AI has solved practical problems. The
      [[future-of-humanity-institute|Future of Humanity Institute]] closed in 2024 after prolonged
      administrative disputes with the university.
