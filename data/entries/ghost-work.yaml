# yaml-language-server: $schema=../schema/entry.schema.json

term: ghost work
id: ghost-work
pos: n.
also:
  - ghost workers
  - microwork
  - click work
  - data work
  - invisible labor (AI)
domain: society
domains:
  - data
level: core
plain: >-
  The hidden human labor behind AI: people, often poorly paid and far away, who label data, check
  outputs and handle cases the software cannot, while the product appears fully automatic.
senses:
  - definition: >-
      Task-based, often on-demand human labor hidden behind services presented as automated:
      [[data-labeling|labeling]] and [[annotation|annotating]] training data, moderating content,
      transcribing, rating chatbot answers for
      [[reinforcement-learning-from-human-feedback|reinforcement learning from human feedback]],
      writing demonstrations, and stepping in when software fails. It is typically sourced through
      [[crowdsourcing|crowdsourcing]] platforms or outsourcing firms, paid per task, and performed
      by contractors without the protections of employment, frequently in lower-income countries.
      Researchers document low and unpredictable pay, [[algorithmic-management|algorithmic
      management]], exposure to disturbing material and the erasure of workers' contributions from
      public accounts of AI. As frontier training shifted toward expert feedback, part of the work
      moved to better-paid specialists, but the pattern of invisibility persists.
    example: >-
      Behind the fully automated receipt scanner was ghost work: contractors correcting every third
      scan by hand.
origin: >-
  Coined by anthropologist Mary L. Gray and computer scientist Siddharth Suri in Ghost Work: How to
  Stop Silicon Valley from Building a New Global Underclass (2019), based on studies of Amazon
  Mechanical Turk and similar platforms. A 2023 TIME investigation into Kenyan workers paid less
  than $2 an hour, via the outsourcing firm Sama, to label toxic content for OpenAI made the issue
  widely known.
year: 2019
note: >-
  Related terms include microwork, click work, data work and heteromation (Hamid Ekbia and Bonnie
  Nardi, 2014): the shifting of essential tasks onto unpaid or low-paid human labor inside
  apparently automated systems.
see_also:
  - data labeling
  - crowdsourcing
  - annotation
  - content moderation
  - algorithmic management
  - AI colonialism
  - reinforcement learning from human feedback
sources:
  - text: >-
      Gray, M. L. & Suri, S. (2019). Ghost Work: How to Stop Silicon Valley from Building a New
      Global Underclass. Houghton Mifflin Harcourt.
  - text: >-
      Perrigo, B. (2023). Exclusive: OpenAI Used Kenyan Workers on Less Than $2 Per Hour to Make
      ChatGPT Less Toxic. TIME, 18 January 2023.
