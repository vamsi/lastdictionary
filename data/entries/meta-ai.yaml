plain: >-
  The artificial intelligence research group of Meta, the company behind Facebook and Instagram,
  known for the PyTorch software and the Llama models. It is also the name of Meta's chatbot.
senses:
  - definition: >-
      The AI organization of Meta Platforms, built around its Fundamental AI Research lab (FAIR),
      and by extension the company's AI assistant of the same name. FAIR became known for open
      research and software: it created [[pytorch|PyTorch]] (first released in 2017), now the
      dominant deep-learning framework, the fastText library, influential
      [[self-supervised-learning|self-supervised learning]] methods for vision such as
      [[dino|DINO]], and the [[segment-anything-model|Segment Anything Model]] (2023). Meta's
      [[llama|Llama]] models, first released in February 2023 with downloadable weights, made it the
      leading Western advocate of [[open-weight-model|open-weight]] release, although its Galactica
      science model was withdrawn three days after its 2022 debut and the April 2025 Llama 4 release
      drew criticism, including over a customized version submitted to the [[lmarena|LMArena]]
      leaderboard. The Meta AI assistant, launched in 2023, is built into Facebook, Instagram,
      WhatsApp and Meta's smart glasses. Since mid-2025 these teams have sat within
      [[meta-superintelligence-labs|Meta Superintelligence Labs]].
origin: >-
  Founded in December 2013 as Facebook AI Research (FAIR), with [[yann-lecun|Yann LeCun]] as its
  first director and labs in New York and Menlo Park, later Paris (2015) and Montreal. After
  Facebook renamed itself Meta in 2021, the organization became Meta AI and FAIR was renamed
  Fundamental AI Research. LeCun, long its chief AI scientist, left in late 2025 to found a startup.
year: 2013
note: >-
  'Meta AI' names both the research organization and the consumer assistant; 'FAIR' refers
  specifically to the fundamental-research lab.
