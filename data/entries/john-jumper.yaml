plain: >-
  An American scientist who led Google DeepMind's AlphaFold project, which predicts the 3D shapes of
  proteins, and shared the 2024 Nobel Prize in Chemistry.
senses:
  - definition: >-
      American chemist and computer scientist at [[google-deepmind|Google DeepMind]] who led the
      development of [[alphafold|AlphaFold]] 2. Trained in physics at Vanderbilt and Cambridge, he
      simulated protein dynamics at D. E. Shaw Research before completing a PhD in theoretical
      chemistry at the University of Chicago (2017). Joining DeepMind in 2017, he led the team whose
      AlphaFold 2 system, a deep network combining [[attention|attention]] over evolutionary and
      geometric information, predicted protein structures with accuracy approaching experiment in
      the CASP14 assessment (2020), a result widely described as solving the long-standing
      structure-prediction problem for single protein chains. DeepMind and the European
      Bioinformatics Institute later released predicted structures for over 200 million proteins. He
      shared half of the 2024 Nobel Prize in Chemistry with [[demis-hassabis|Demis Hassabis]] for
      protein structure prediction, the other half going to David Baker for computational protein
      design (see [[nobel-prizes-for-ai|Nobel Prizes for AI]]); earlier honors include the 2023
      Breakthrough Prize in Life Sciences.
