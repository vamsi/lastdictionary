plain: >-
  A famous American industrial research laboratory, long owned by the telephone company AT&T, where
  the transistor, information theory and key early machine-learning methods were invented.
senses:
  - definition: >-
      The research and development laboratory of the Bell telephone system, for decades the world's
      most productive industrial research lab, whose work shaped computing and AI. Claude Shannon's
      [[information-theory|information theory]] (1948), the transistor (1947), the Unix operating
      system and the C programming language all came from it. Its Holmdel laboratory became a center
      of machine learning from the late 1980s: Yann LeCun and colleagues developed
      [[convolutional-neural-network|convolutional neural networks]] for reading handwritten digits
      (from 1989), the line that led to [[lenet|LeNet]] and to systems that read bank checks, and
      Corinna Cortes and Vladimir Vapnik introduced the soft-margin [[support-vector-machine|support
      vector machine]] (1995). Bell Labs researchers also built early speech recognizers, beginning
      with the Audrey digit recognizer (1952). It is now part of Nokia.
origin: >-
  Founded in 1925 in New York City as Bell Telephone Laboratories, jointly owned by AT&T and Western
  Electric; its headquarters later moved to Murray Hill, New Jersey. After AT&T's restructuring it
  passed to Lucent Technologies in 1996, which became Alcatel-Lucent, and to Nokia in 2016.
year: 1925
