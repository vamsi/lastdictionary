term: UNESCO Recommendation on the Ethics of AI
id: unesco-recommendation-on-the-ethics-of-ai
pos: prop. n.
also:
  - Recommendation on the Ethics of Artificial Intelligence
  - UNESCO AI ethics recommendation
domain: gov
domains:
  - society
level: core
plain: >-
  A worldwide set of ethical principles for AI that all of UNESCO's member countries agreed in 2021,
  covering human rights, fairness, privacy, the environment, gender equality and education.
senses:
  - definition: >-
      A non-binding standard-setting instrument adopted by the General Conference of the United
      Nations Educational, Scientific and Cultural Organization (UNESCO) in November 2021 and
      described as the first global normative framework on AI ethics. It rests on four core values —
      human rights and human dignity; peaceful, just and interconnected societies; diversity and
      inclusiveness; and flourishing environments and ecosystems — and ten principles, among them
      proportionality and do no harm, safety and security, privacy, [[human-oversight|human
      oversight]] and determination, transparency and [[explainability|explainability]], fairness
      and non-discrimination, and sustainability. Eleven policy areas translate these into action on
      data, gender, education, culture, labor, health and the environment. Implementation tools
      include a Readiness Assessment Methodology for countries and an Ethical Impact Assessment for
      AI systems.
    example: >-
      The ministry used UNESCO's readiness assessment to benchmark its AI policy against the
      Recommendation on the Ethics of AI.
origin: >-
  Drafted from 2020 by an ad hoc expert group of 24 specialists, negotiated by member states, and
  adopted on 23 November 2021 at the 41st session of UNESCO's General Conference by its then 193
  member states.
year: 2021
note: >-
  As a recommendation it creates no binding obligations; member states are invited to report on
  implementation. Not to be confused with UNESCO's later guidance on generative AI in education and
  research (2023).
