term: productivity paradox
id: productivity-paradox
pos: n.
also:
  - Solow paradox
  - Solow's paradox
  - productivity J-curve
  - modern productivity paradox
domain: society
domains:
  - hist
level: core
plain: >-
  The puzzle that a powerful new technology, like computers in the 1980s or AI today, can be
  everywhere without showing up as faster growth in how much workers produce.
senses:
  - definition: >-
      The observation that rapid advances and heavy investment in a technology can coincide with
      slow measured growth in labor or total factor productivity. Proposed explanations include
      mismeasurement (benefits such as free digital services or better quality are poorly captured
      by output statistics); lags while firms build complementary intangible assets such as new
      processes, skills and organizational designs, producing a 'productivity J-curve' in which
      measured productivity first dips and then rises; redistribution of gains rather than their
      creation; and inflated expectations. For computers the paradox eased with the US productivity
      surge of the late 1990s. A similar gap between AI's apparent capabilities and aggregate
      statistics has been called the modern productivity paradox, and how long it lasts is central
      to debates about an [[ai-bubble|AI bubble]].
    example: >-
      Every firm says it uses AI, yet output per hour has barely moved: the productivity paradox
      again.
origin: >-
  Named after economist Robert Solow's quip in a 1987 New York Times book review: 'You can see the
  computer age everywhere but in the productivity statistics.' Erik Brynjolfsson's 'The Productivity
  Paradox of Information Technology' (1993) fixed the term; Brynjolfsson, Daniel Rock and Chad
  Syverson applied it to AI from 2017.
year: 1987
