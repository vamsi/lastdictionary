term: ICRA
id: icra
pos: prop. n.
also:
  - IEEE International Conference on Robotics and Automation
  - IROS
  - RSS
pronunciation: ICK-ruh
domain: orgs
domains:
  - robot
level: specialist
plain: >-
  The largest yearly robotics conference, run by the engineering society IEEE, covering everything
  from robot arms and drones to self-driving cars.
senses:
  - definition: >-
      The IEEE International Conference on Robotics and Automation, the main annual meeting of the
      IEEE Robotics and Automation Society and the largest gathering of robotics researchers, held
      each spring or early summer. It spans manipulation, locomotion, aerial and underwater robots,
      [[autonomous-vehicle|autonomous vehicles]], medical robotics, perception, planning and
      control, human–robot interaction and, increasingly, [[robot-learning|robot learning]]. With
      the IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS) and the
      smaller, more selective Robotics: Science and Systems (RSS), it is one of the field's main
      venues, and its exhibitions and robot competitions make it a showcase for industry.
origin: >-
  First held in 1984 in Atlanta, Georgia, as the IEEE International Conference on Robotics, adding
  'and Automation' to its name from 1985. It is run by the IEEE Robotics and Automation Society,
  established as a council in 1984 and a full society in 1987.
year: 1984
