term: Blueprint for an AI Bill of Rights
id: blueprint-for-an-ai-bill-of-rights
pos: prop. n.
also:
  - AI Bill of Rights
  - "Blueprint for an AI Bill of Rights: Making Automated Systems Work for the American People"
domain: gov
domains:
  - society
  - hist
labels:
  - historical
level: core
plain: >-
  A 2022 White House document listing five protections Americans should have when automated systems
  affect their lives — safety, fairness, privacy, explanation and a human alternative. It was
  guidance, not law.
senses:
  - definition: >-
      A non-binding framework published by the White House Office of Science and Technology Policy
      (OSTP) on October 4, 2022, setting out five principles for automated systems whose use could
      meaningfully affect people's civil rights, their chances in areas such as jobs, housing and
      credit, or their access to services such as health care and public benefits: safe and
      effective systems; protection from [[algorithmic-bias|algorithmic discrimination]]; data
      privacy; notice and explanation; and human alternatives, consideration and fallback. A
      technical companion, 'From Principles to Practice', described expected practices such as
      pre-deployment testing, [[disparate-impact|disparate impact]] assessment, plain-language
      notice and the option to reach a human. It created no legal obligations, but it informed later
      federal policy, including [[executive-order-14110|Executive Order 14110]] and 2024 Office of
      Management and Budget rules on agencies' use of AI, and many state bills on
      [[automated-decision-making|automated decision-making]]. It lost official standing with the
      change of administration in January 2025, when it was moved to the archived Biden White House
      website, and it plays no part in the Trump administration's AI policy.
    example: >-
      The vendor's notice-and-explanation practices were modeled on the Blueprint for an AI Bill of
      Rights.
origin: >-
  Announced in an October 2021 Wired op-ed by OSTP director Eric Lander and deputy director Alondra
  Nelson calling for a bill of rights for an AI-powered world, followed by a year of public
  listening sessions. Drafting was led by Nelson; the document was released on October 4, 2022.
year: 2022
note: >-
  Often contrasted with the voluntary, industry-oriented [[nist-ai-risk-management-framework|NIST AI
  Risk Management Framework]] (2023). Critics variously called it toothless or feared it
  foreshadowed heavy regulation.
