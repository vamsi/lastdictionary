plain: >-
  An American inventor of reading machines and speech technology who became the best-known prophet
  of the 'singularity', predicting human-level AI by 2029.
senses:
  - definition: >-
      American inventor and futurist who moved from building pattern-recognition machines to
      forecasting when machines would equal human intelligence. In 'The Age of Spiritual Machines'
      (1999), 'The Singularity Is Near' (2005) and 'The Singularity Is Nearer' (2024) he argued,
      from his [[law-of-accelerating-returns|law of accelerating returns]], that exponential growth
      in computing would bring human-level AI, a machine passing the [[turing-test|Turing test]], by
      2029 and a [[technological-singularity|technological singularity]] around 2045, with humans
      merging with their technology. The inventions came first: his Kurzweil Reading Machine (1976)
      paired [[optical-character-recognition|optical character recognition]] for ordinary typefaces
      with [[text-to-speech|text-to-speech]] so that blind users could hear print read aloud, and
      his companies went on to make early large-vocabulary [[speech-recognition|speech recognition]]
      products and electronic music synthesizers, work recognized with the US National Medal of
      Technology (1999) and the Lemelson–MIT Prize (2001). He co-founded Singularity University
      (2008) and joined Google in 2012 to work on natural-language understanding. His dated
      forecasts are among the most cited, and most disputed, in the field.
