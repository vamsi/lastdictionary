# yaml-language-server: $schema=../schema/entry.schema.json

term: attention schema theory
id: attention-schema-theory
pos: n.
also:
  - AST
  - attention schema
domain: mind
level: specialist
plain: >-
  A theory that the brain keeps a simplified sketch of its own attention, and that our feeling of
  having an inner awareness is simply how that sketch portrays attention.
senses:
  - definition: >-
      A theory of consciousness proposed by the neuroscientist Michael Graziano, on which the brain
      constructs a simplified model of its own attention — an attention schema — in order to monitor
      and control attention, much as it builds a body schema to control the limbs. Because the model
      is a sketch, it depicts attention not as a mechanistic competition among signals but as an
      inner, nonphysical awareness that takes hold of things; our conviction that we have subjective
      experience, and our reports of it, reflect the content of this model. The same machinery,
      applied to other people, supports [[theory-of-mind|theory of mind]]. AST is often classed with
      [[illusionism|illusionism]], and because it is mechanistic, Graziano argues that an AI system
      with an attention schema would be conscious in the same sense people are, and that building
      one could also improve its control of attention.
origin: >-
  Introduced by Michael Graziano with Sabine Kastner in 'Human Consciousness and Its Relationship to
  Social Neuroscience: A Novel Hypothesis' (Cognitive Neuroscience, 2011), and developed in
  Graziano's books Consciousness and the Social Brain (2013) and Rethinking Consciousness (2019).
year: 2011
see_also:
  - illusionism
  - theory of mind
  - higher-order theories of consciousness
  - indicator properties of consciousness
  - machine consciousness
  - attention
sources:
  - text: >-
      Graziano, M. S. A. & Kastner, S. (2011). Human Consciousness and Its Relationship to Social
      Neuroscience: A Novel Hypothesis. Cognitive Neuroscience 2(2), 98–113.
  - text: >-
      Graziano, M. S. A. (2013). Consciousness and the Social Brain. Oxford University Press.
