term: Statement on AI Risk
id: statement-on-ai-risk
pos: prop. n.
also:
  - CAIS statement
  - AI extinction statement
domain: hist
domains:
  - safety
  - asi
level: core
plain: >-
  A one-sentence public statement from May 2023, signed by hundreds of leading AI scientists and
  company heads, declaring that guarding against the chance of AI wiping out humanity should rank as
  a priority for the whole world.
senses:
  - definition: >-
      A single-sentence declaration released by the [[center-for-ai-safety|Center for AI Safety]] on
      30 May 2023 stating that 'mitigating the risk of extinction from AI should be a global
      priority', on a par with other dangers to society as a whole such as pandemics and nuclear
      war. Kept deliberately brief so that people who disagreed about specific risks or remedies
      could sign, it was endorsed at launch by hundreds of AI researchers and executives, including
      [[geoffrey-hinton|Geoffrey Hinton]], [[yoshua-bengio|Yoshua Bengio]], [[sam-altman|Sam
      Altman]] of [[openai|OpenAI]], [[demis-hassabis|Demis Hassabis]] of [[google-deepmind|Google
      DeepMind]] and [[dario-amodei|Dario Amodei]] of [[anthropic|Anthropic]]. Its significance lay
      less in its content than in its signatories: leaders of the companies building frontier
      systems publicly ranked their technology's dangers alongside those of nuclear weapons. Critics
      argued that it distracted from present harms, or that it served those companies by implying
      that only they could manage the danger.
    example: >-
      After the Statement on AI Risk, heads of government began using the word extinction in
      speeches about AI.
origin: >-
  Organized by the Center for AI Safety under its director, Dan Hendrycks, two months after the
  [[pause-giant-ai-experiments|Pause Giant AI Experiments]] letter. It was widely cited in the
  run-up to the first [[ai-safety-summit|AI Safety Summit]], held at Bletchley Park in November
  2023.
year: 2023
note: >-
  Not to be confused with the pause letter, which asked for a specific action; this statement made
  no policy demand.
