term: Pause Giant AI Experiments
id: pause-giant-ai-experiments
pos: prop. n.
also:
  - pause letter
  - FLI open letter
  - six-month pause letter
  - "Pause Giant AI Experiments: An Open Letter"
domain: hist
domains:
  - gov
  - safety
level: core
plain: >-
  A 2023 open letter, signed by tens of thousands of people including prominent technologists, that
  asked AI labs to halt the training of any AI more capable than GPT-4 for at least half a year.
senses:
  - definition: >-
      An open letter, published by the [[future-of-life-institute|Future of Life Institute]] on 22
      March 2023, that asked every AI laboratory to stop training anything more capable than
      [[gpt-4|GPT-4]] at once and for no less than six months, and urged governments to step in with
      a moratorium if the labs refused. Its argument was that competition was pushing laboratories
      to build ever larger systems faster than anyone, their makers included, could understand or
      keep in check. The authors wanted the time spent agreeing on common safety protocols, verified
      by outside experts, and on policy measures they listed, among them liability for harms,
      auditing, [[ai-watermarking|watermarking]] and provenance systems, and regulators devoted to
      AI. Early signatories included [[yoshua-bengio|Yoshua Bengio]], [[stuart-russell|Stuart
      Russell]], [[elon-musk|Elon Musk]], Steve Wozniak and Yuval Noah Harari; signatures eventually
      exceeded 30,000. No major laboratory paused, but the letter moved catastrophic AI risk into
      mainstream news and policy debate.
    example: >-
      The pause letter failed in its stated aim but succeeded in starting the argument.
origin: >-
  Drafted by the Future of Life Institute and released eight days after GPT-4's launch. Critics
  included researchers who said it exaggerated speculative risks while neglecting present harms, and
  others, such as [[eliezer-yudkowsky|Eliezer Yudkowsky]], who argued that it did not go nearly far
  enough.
year: 2023
note: >-
  Not to be confused with the [[statement-on-ai-risk|Statement on AI Risk]] (May 2023), a
  one-sentence statement about extinction risk. See also [[ai-pause|AI pause]].
