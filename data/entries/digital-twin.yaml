  - world foundation model
  - industrial robot
sources:
  - text: >-
      Grieves, M. & Vickers, J. (2017). Digital twin: Mitigating unpredictable, undesirable emergent
      behavior in complex systems. In Kahlen, F.-J., Flumerfelt, S. & Alves, A. (eds.),
      Transdisciplinary Perspectives on Complex Systems. Springer.
