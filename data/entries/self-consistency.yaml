      Wang, X., Wei, J., Schuurmans, D., Le, Q., Chi, E., Narang, S., Chowdhery, A. & Zhou, D.
      (2023). Self-Consistency Improves Chain of Thought Reasoning in Language Models. ICLR 2023.
    url: https://arxiv.org/abs/2203.11171v4
