term: Timnit Gebru
id: timnit-gebru
sort_as: Gebru Timnit
pos: prop. n.
pronunciation: TIM-nit GEB-roo
domain: people
domains:
  - society
  - data
  - percep
level: core
dates: b. 1982 or 1983
plain: >-
  An Ethiopian-born American computer scientist who exposed racial and gender bias in AI systems,
  co-wrote the 'stochastic parrots' paper, and founded an independent AI research institute.
senses:
  - definition: >-
      Ethiopian-born American computer scientist, founder and executive director of the
      [[distributed-ai-research-institute|Distributed AI Research Institute]] (DAIR, 2021). After a
      Stanford doctorate under [[fei-fei-li|Fei-Fei Li]] that used street-level images to estimate
      neighborhood demographics, she co-authored with [[joy-buolamwini|Joy Buolamwini]] the
      [[gender-shades|Gender Shades]] audit (2018), which found that commercial face-analysis
      systems misclassified darker-skinned women far more often than lighter-skinned men. She
      proposed [[datasheet-for-datasets|datasheets for datasets]] (2018) and, with Margaret Mitchell
      and others, [[model-card|model cards]] (2019) to document how data and models are made. She
      co-founded the organization Black in AI (2017) and co-led Google's Ethical AI team until
      December 2020, when she left after a dispute over the paper that coined
      '[[stochastic-parrot|stochastic parrots]]'; Google said she had resigned, while she said she
      was fired. With Émile P. Torres she later coined '[[tescreal|TESCREAL]]', a critical label for
      ideologies she associates with the race to build [[artificial-general-intelligence|artificial
      general intelligence]].
