term: embodied cognition
id: embodied-cognition
pos: n.
also:
  - embodiment
  - 4E cognition
  - enactivism
  - enactive cognition
  - situated cognition
  - embodied mind
domain: mind
domains:
  - robot
level: core
plain: >-
  The idea that thinking is not something the brain does on its own: the body, its senses and
  movements, and its surroundings play a real part in how we think and understand.
senses:
  - definition: >-
      A family of views in [[cognitive-science|cognitive science]] holding that cognition depends
      deeply on the body and its interaction with the environment, rather than being abstract
      computation over internal symbols that could run in any medium. Claims range from modest —
      sensorimotor experience shapes concepts, as reflected in bodily metaphors such as grasping an
      idea — to radical: enactivism holds that cognition consists in an organism's skilled activity
      in its world, and some versions reject internal representations altogether. Embodied cognition
      is grouped with embedded, enactive and [[extended-mind|extended]] cognition as '4E cognition'.
      For AI it supports arguments that intelligence and meaning require a body and sensorimotor
      [[grounding|grounding]] — a motivation for [[embodied-ai|embodied AI]] and robotics — and
      underlies doubts that text-trained models understand the world; critics reply that language
      itself encodes much embodied knowledge.
origin: >-
  Drawing on Maurice Merleau-Ponty's phenomenology and James J. Gibson's ecological psychology, the
  approach was shaped by George Lakoff and Mark Johnson's work on bodily metaphor (1980), Francisco
  Varela, Evan Thompson and Eleanor Rosch's The Embodied Mind (1991) and Rodney Brooks's
  behavior-based robotics (1991).
year: 1991
