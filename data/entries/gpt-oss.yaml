plain: >-
  Two free-to-download reasoning models released by OpenAI in August 2025 — its first downloadable
  language models since 2019 — that anyone may run, modify and use commercially on their own
  hardware.
senses:
  - definition: >-
      A pair of [[open-weight-model|open-weight]] [[reasoning-model|reasoning]] language models
      released by [[openai|OpenAI]] on 5 August 2025 under the Apache 2.0 license: gpt-oss-120b,
      with about 117 billion parameters of which 5.1 billion are active for each token, and
      gpt-oss-20b, with about 21 billion parameters and 3.6 billion active. Both are
      [[mixture-of-experts|mixture-of-experts]] [[transformer|transformers]] whose expert weights
      are stored in the 4-bit MXFP4 format (see [[fp4|FP4]]), so the larger fits on a single 80 GB
      GPU and the smaller runs within 16 GB of memory. They offer a 128,000-token context,
      adjustable reasoning effort, [[tool-use|tool use]] such as web browsing and code execution,
      and a chat template called the harmony format. OpenAI reported that the larger model came
      close to its o4-mini on reasoning benchmarks. Before release, OpenAI fine-tuned a version
      adversarially to estimate worst-case misuse and reported that it still did not reach the High
      capability threshold for biology or cybersecurity under its
      [[preparedness-framework|Preparedness Framework]]. Its raw [[chain-of-thought|chain of
      thought]] was kept free of direct training pressure so that it can be monitored.
    example: >-
      We run gpt-oss-20b on a laptop for offline coding help and send only the hard tasks to the
      120b model.
origin: >-
  Released by OpenAI on 5 August 2025, with weights on Hugging Face, as its first open-weight
  language models since [[gpt-2|GPT-2]] in 2019; earlier that year, after the release of
  [[deepseek-r1|DeepSeek-R1]], Sam Altman had said OpenAI had been on the wrong side of history on
  open weights. The name joins GPT to OSS, the usual abbreviation for open-source software. In
  October 2025 OpenAI added gpt-oss-safeguard, versions fine-tuned to classify content against a
  policy the developer writes.
year: 2025
note: >-
  Despite 'oss' in the name, OpenAI released weights, inference code and a tokenizer but not
  training data or training code, so the models are usually classed as
  [[open-weight-model|open-weight]] rather than fully [[open-source-ai|open-source AI]] under
  definitions such as the [[open-source-initiative|Open Source Initiative]]'s.
