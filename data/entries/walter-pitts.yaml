  - math
level: specialist
dates: 1923–1969
plain: >-
  A largely self-taught American logician who, at about 20 and without a degree, co-invented with
  Warren McCulloch a simple logical model of a brain cell, the starting point of neural networks.
senses:
  - definition: >-
      American logician who co-wrote with [[warren-mcculloch|Warren McCulloch]] the 1943 paper
      introducing the [[mcculloch-pitts-neuron|McCulloch–Pitts neuron]], a threshold logic unit that
      became the starting point for [[artificial-neuron|artificial neurons]] and
      [[neural-network|neural networks]]; he was 20 when it appeared and had no university degree,
      which he never obtained. He then joined [[norbert-wiener|Norbert Wiener]] at MIT and took part
      in the founding of [[cybernetics|cybernetics]]. With McCulloch he wrote 'How We Know
      Universals' (1947), an early neural model of recognizing patterns regardless of position or
      size, and with Jerome Lettvin, Humberto Maturana and McCulloch he co-wrote 'What the Frog's
      Eye Tells the Frog's Brain' (1959), which showed that the retina itself detects features such
      as small moving objects. He published little after the late 1950s.
see_also:
