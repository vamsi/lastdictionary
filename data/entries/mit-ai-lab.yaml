plain: >-
  The artificial intelligence laboratory at the Massachusetts Institute of Technology, founded in
  1959 and one of the birthplaces of AI and hacker culture; it is now part of MIT's computer science
  lab, CSAIL.
senses:
  - definition: >-
      The artificial intelligence laboratory of the Massachusetts Institute of Technology
      (1959–2003) and, since 2003, part of its successor, the Computer Science and Artificial
      Intelligence Laboratory (CSAIL). One of the founding centers of AI, it produced the
      [[lisp|Lisp]] language, Terry Winograd's [[shrdlu|SHRDLU]], Patrick Winston's programs that
      learned structural descriptions from examples, the [[lisp-machine|Lisp machine]], Marvin
      Minsky's theory of [[frame|frames]] for [[knowledge-representation|knowledge representation]],
      and Rodney Brooks's behavior-based robotics; Joseph Weizenbaum wrote [[eliza|ELIZA]] at the
      associated Project MAC. Its programmers originated much of hacker culture, and Richard
      Stallman launched the free-software movement there. CSAIL, one of the largest university
      computing laboratories, continues research across machine learning, robotics and the societal
      effects of AI.
origin: >-
  Begun in 1959 by John McCarthy and Marvin Minsky as the Artificial Intelligence Project; it joined
  Project MAC in 1963 and became the independent MIT AI Lab in 1970. It merged with the MIT
  Laboratory for Computer Science to form CSAIL in July 2003.
