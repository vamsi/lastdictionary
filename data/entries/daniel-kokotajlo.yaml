plain: >-
  An American AI forecaster and former OpenAI researcher who led 'AI 2027', a detailed scenario of a
  race to superintelligence, and campaigns for transparency at AI companies.
senses:
  - definition: >-
      American AI forecaster and governance researcher, founder of the [[ai-futures-project|AI
      Futures Project]]. A former philosophy graduate student who researched AI timelines at AI
      Impacts and the Center on Long-Term Risk, he wrote 'What 2026 Looks Like' (2021), a
      year-by-year forecast whose predictions about chatbots, reasoning and AI agents were later
      widely judged prescient. He joined [[openai|OpenAI]]'s governance team in 2022 and left in
      April 2024, declining to sign a non-disparagement agreement that put his vested equity at
      risk; the episode led OpenAI to release departing employees from such clauses, and he
      co-signed the 'Right to Warn' letter (June 2024) calling for [[ai-whistleblower-protections|AI
      whistleblower protections]]. His AI Futures Project published [[ai-2027|AI 2027]] (April
      2025), written with Scott Alexander, Thomas Larsen, Eli Lifland and Romeo Dean, a scenario in
      which [[automated-ai-research|automated AI research]] drives an
      [[intelligence-explosion|intelligence explosion]] amid a US–China race, with alternative
      endings.
