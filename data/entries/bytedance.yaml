plain: >-
  The Chinese company that owns TikTok, which also runs Doubao, China's most popular AI chatbot, and
  builds image and video generators.
senses:
  - definition: >-
      A Chinese internet company, best known for the short-video apps Douyin (in China) and TikTok
      (abroad), that has become one of China's largest AI developers and buyers of AI chips. Its
      [[recommender-system|recommendation algorithms]], which personalize short-video feeds from
      viewing behavior, were among the most successful consumer applications of machine learning.
      Its Doubao assistant, launched in August 2023 and priced aggressively, became China's
      most-used AI chatbot by late 2024; its Seed research team develops the underlying
      [[large-language-model|language models]] and [[reasoning-model|reasoning models]], the
      Seedream image generator, the Seedance [[text-to-video-model|video generator]] and UI-TARS, a
      [[gui-agent|GUI agent]], while its Volcano Engine cloud sells model access to businesses.
      Seedance 2.0 (2026) drew protests from Hollywood studios over clips imitating copyrighted
      characters and real actors.
origin: >-
  Founded in 2012 in Beijing by Zhang Yiming and Liang Rubo; its news app Toutiao, and later Douyin
  (2016) and TikTok (2017), were built around algorithmic recommendation. It organized its
  foundation-model research under the Seed name from about 2023.
year: 2012
