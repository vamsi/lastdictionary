term: prompt engineer
id: prompt-engineer
pos: n.
also:
  - prompt designer
  - AI whisperer
domain: culture
domains:
  - llm
  - society
level: core
plain: >-
  A person whose job is writing and testing the instructions given to AI models so they behave
  reliably; hyped in 2023 as a six-figure job anyone could learn, the role has since largely merged
  into ordinary engineering.
senses:
  - definition: >-
      A practitioner who specializes in [[prompt-engineering|prompt engineering]]: designing,
      testing and maintaining the instructions, examples and context given to
      [[large-language-model|large language models]] so that they perform tasks reliably. The work
      includes writing [[system-prompt|system prompts]], building evaluation sets to compare prompt
      variants, diagnosing failure modes and documenting model quirks. In 2023 the title became an
      emblem of the generative-AI boom, with well-publicized job postings offering salaries above
      US$300,000 and predictions that it would be the job of the decade; skeptics countered that
      better models would make prompting easy or automatic. By 2025 the skills had largely been
      absorbed into software, product and research roles, and attention had shifted to
      [[context-engineering|context engineering]] and agent design.
    example: >-
      We don't hire prompt engineers anymore; every engineer is expected to write and evaluate
      prompts.
origin: >-
  'Prompt engineering' was in use among GPT-3 users by 2021, and 'prompt engineer' appeared on
  AI-art and developer forums around 2021–2022. The title reached mainstream news in early 2023
  through reporting on high-paying roles, notably an Anthropic posting for a 'Prompt Engineer and
  Librarian' with a salary range reaching US$335,000.
note: >-
  Sometimes used mockingly for overstated expertise in phrasing requests to chatbots. The role's
  rise and fall is often cited as an example of how quickly AI job categories change.
