standards: >-
  EU AI Act (Reg. (EU) 2024/1689), Art. 3(41)–(43) and Recital 17; prohibition and safeguards Art.
  5(1)(h) and 5(2)–(7); high-risk Annex III point 1(a); post-remote use Art. 26(10)
