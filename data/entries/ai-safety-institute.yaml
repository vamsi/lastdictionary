term: AI Safety Institute
id: ai-safety-institute
pos: n.
also:
  - AISI
  - AI Security Institute
  - International Network of AI Safety Institutes
  - International Network for Advanced AI Measurement, Evaluation and Science
domain: gov
domains:
  - safety
  - eval
level: essential
plain: >-
  A government agency that tests the most advanced AI models for dangerous abilities and studies how
  to make them safe. Britain and the United States set up the first ones in 2023.
senses:
  - definition: >-
      A publicly funded technical body that tests advanced AI systems and develops the science of
      measuring their capabilities and risks. Typical work includes testing
      [[frontier-model|frontier models]] before and after release under voluntary agreements with
      developers; [[dangerous-capability-evaluation|dangerous-capability evaluations]] in areas such
      as cyberattack, chemical and biological weapons and autonomous behavior; research on
      safeguards and evaluation methods; and advice to governments. The UK and US institutes were
      announced in November 2023, and Japan, Singapore, South Korea, Canada, France and others
      followed; the EU takes part through its [[ai-office|AI Office]]. The institutes are not
      regulators and generally cannot block a release. Their international network, launched in
      November 2024, was renamed the International Network for Advanced AI Measurement, Evaluation
      and Science in December 2025; its members are Australia, Canada, the EU, France, Japan, Kenya,
      South Korea, Singapore, the United Kingdom and the United States.
    example: The model was tested by both the UK and US institutes before launch.
origin: >-
  The UK institute grew out of the government's Frontier AI Taskforce and was launched at the
  Bletchley summit in November 2023, alongside the US AI Safety Institute at NIST. In 2025 both were
  renamed with a shift of emphasis: the UK body became the AI Security Institute in February, and
  the US institute became the [[center-for-ai-standards-and-innovation|Center for AI Standards and
  Innovation]] in June.
year: 2023
note: >-
  The 2025 renamings shifted emphasis from broad 'safety' toward national security, standards and
  measurement science; critics read them as a retreat from wider societal harms, supporters as a
  sharper focus.
