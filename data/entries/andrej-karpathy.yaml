level: core
dates: b. 1986
plain: >-
  A Slovak-Canadian AI researcher and teacher who co-founded OpenAI, led Tesla's self-driving vision
  team, and coined popular phrases such as 'vibe coding'.
senses:
  - definition: >-
      Slovak-born Canadian computer scientist and educator. His Stanford doctorate under
      [[fei-fei-li|Fei-Fei Li]] (2015) linked images and language for [[image-captioning|image
      captioning]], and he co-created and taught Stanford's course CS231n on
      [[convolutional-neural-network|convolutional networks]] for vision. A founding member of
      [[openai|OpenAI]] (2015–2017), he then led the computer-vision team for Tesla's Autopilot
      driver-assistance system as its director of AI (2017–2022), returned briefly to OpenAI
      (2023–2024) and in 2024 founded Eureka Labs, an AI-education company. His widely followed
      video lectures and minimal code bases (micrograd, nanoGPT, llm.c) teach how
      [[large-language-model|language models]] are built. He has named several ideas in AI culture:
      [[software-2-0|Software 2.0]] (2017), the quip that
      [[english-is-the-hottest-new-programming-language|English is the hottest new programming
      language]] (2023), [[vibe-coding|vibe coding]] (2025), [[software-3-0|Software 3.0]] (2025)
      and [[jagged-intelligence|jagged intelligence]]. In May 2026 he joined the pretraining team at
      [[anthropic|Anthropic]], helping to start a group that uses its [[claude|Claude]] models to
      speed up pretraining research.
