term: NO FAKES Act
id: no-fakes-act
pos: prop. n.
also:
  - Nurture Originals, Foster Art, and Keep Entertainment Safe Act
  - NO FAKES Act of 2026
domain: gov
domains:
  - gen
  - society
level: core
plain: >-
  A proposed US law that would let people control AI-made copies of their voice and face, and would
  require websites to take down unauthorized fakes once notified.
senses:
  - definition: >-
      A proposed US federal statute (the Nurture Originals, Foster Art, and Keep Entertainment Safe
      Act) that would create a nationwide, property-like right in a person's voice and visual
      likeness against unauthorized [[digital-replica|digital replicas]] — highly realistic,
      computer-generated representations of an identifiable individual. In the 2024 and 2025 texts
      the right would last for life and, through renewals by heirs or other right holders, up to 70
      years after death; living people could license it but not sell it outright. Making or
      knowingly distributing an unauthorized replica would create civil liability, with exceptions
      for news, documentary, biography, commentary, criticism and parody. Online services that
      promptly remove material after a valid notice would receive a safe harbor, and rights holders
      could subpoena services to identify uploaders. Versions since 2025 also reach tools primarily
      designed to produce unauthorized replicas, such as some [[voice-cloning|voice cloning]]
      services. Supporters include record labels, studios, performers' unions and several technology
      companies; civil-liberties groups warn of overbroad takedowns and chilled speech.
    example: >-
      If the NO FAKES Act passes, the platform will need a notice-and-takedown process for cloned
      voices.
origin: >-
  Released as a discussion draft in October 2023 by US Senators Chris Coons, Marsha Blackburn, Amy
  Klobuchar and Thom Tillis, introduced in July 2024, and reintroduced in April 2025 with backing
  from YouTube and OpenAI as well as the music and film industries. A revised NO FAKES Act of 2026
  (S. 4591), introduced in May 2026, cleared the Senate Judiciary Committee unanimously on 18 June
  2026.
year: 2023
note: >-
  As of October 2026 the bill had not been enacted. It is broader than the [[take-it-down-act|TAKE
  IT DOWN Act]], which covers only intimate imagery, and would sit alongside state
  [[right-of-publicity|right of publicity]] laws such as Tennessee's ELVIS Act (2024).
