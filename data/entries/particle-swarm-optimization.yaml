term: particle swarm optimization
id: particle-swarm-optimization
pos: n.
also:
  - PSO
  - particle swarm
domain: sym
domains:
  - math
level: specialist
plain: >-
  An optimization method inspired by flocking birds: candidate solutions 'fly' through the space of
  possibilities, each pulled toward the best spot it has found and the best spot its neighbors have
  found.
senses:
  - definition: >-
      A population-based optimization method for continuous search spaces in which each particle has
      a position (a candidate solution) and a velocity. At each step a particle's velocity becomes a
      weighted sum of its previous velocity (inertia), a randomly scaled pull toward the best
      position it has personally found, and a randomly scaled pull toward the best position found by
      its neighborhood or the whole swarm; the particle then moves by that velocity. Parameters such
      as the inertia weight or a constriction coefficient balance exploration against convergence.
      Particle swarm optimization needs no gradients and is simple to implement and parallelize; it
      is used for engineering design, controller tuning, feature selection and hyperparameter
      search, though it can converge prematurely and lacks general convergence guarantees.
formula_latex: v_i \leftarrow w\,v_i + c_1 r_1 (p_i - x_i) + c_2 r_2 (g - x_i), \qquad x_i \leftarrow x_i + v_i
origin: >-
  Introduced by the social psychologist James Kennedy and the electrical engineer Russell Eberhart
  at the 1995 IEEE International Conference on Neural Networks, growing out of simulations of bird
  flocking and social behavior; Yuhui Shi and Eberhart added the inertia weight in 1998.
year: 1995
note: >-
  In the formula, x_i and v_i are particle i's position and velocity, p_i its personal best, g the
  neighborhood or global best, w the inertia weight, c_1 and c_2 acceleration constants and r_1, r_2
  fresh random numbers in [0, 1].
see_also:
  - swarm intelligence
  - ant colony optimization
  - evolutionary computation
  - metaheuristic
  - genetic algorithm
sources:
  - text: >-
      Kennedy, J. & Eberhart, R. (1995). Particle Swarm Optimization. Proceedings of the IEEE
      International Conference on Neural Networks, Perth, 1942–1948.
