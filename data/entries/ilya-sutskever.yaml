level: core
dates: b. 1986
plain: >-
  A Russian-born Israeli-Canadian computer scientist who co-built the AlexNet image recognizer,
  helped found OpenAI and lead its research until 2024, and now heads the startup Safe
  Superintelligence Inc.
senses:
  - definition: >-
      Russian-born Israeli-Canadian computer scientist. As a student of [[geoffrey-hinton|Geoffrey
      Hinton]] at the University of Toronto he co-created [[alexnet|AlexNet]] (2012), and at
      [[google-brain|Google Brain]] he co-introduced
      [[sequence-to-sequence-model|sequence-to-sequence learning]] (with Oriol Vinyals and Quoc Le,
      2014), a basis of neural [[machine-translation|machine translation]]. In 2015 he co-founded
      [[openai|OpenAI]] and became its chief scientist, a leading proponent of the bet that scaling
      up neural networks would keep improving them (see [[scaling-hypothesis|scaling hypothesis]])
      through the [[gpt|GPT]] series and [[chatgpt|ChatGPT]]. In 2023 he co-led OpenAI's
      [[superalignment|superalignment]] team with Jan Leike and, as a board member, joined the
      November vote to remove [[sam-altman|Sam Altman]] as chief executive
      ([[openai-leadership-crisis-2023|OpenAI leadership crisis (2023)]]), a decision he soon said
      he regretted. He left OpenAI in May 2024 and the next month co-founded
      [[safe-superintelligence-inc|Safe Superintelligence Inc.]] with Daniel Gross and Daniel Levy,
      with safe [[superintelligence|superintelligence]] as its only goal; he became its chief
      executive in July 2025.
