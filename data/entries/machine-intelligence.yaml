term: machine intelligence
id: machine-intelligence
pos: n.
also:
  - intelligent machinery
domain: core
domains:
  - hist
  - mind
level: core
plain: >-
  Intelligence shown by machines; another name for artificial intelligence, preferred by some
  because it does not suggest that such intelligence is fake.
senses:
  - definition: >-
      Intelligent behavior exhibited by machines, or the field that studies it; largely a synonym of
      [[artificial-intelligence|artificial intelligence]]. Some authors prefer it because
      'artificial' can suggest something counterfeit, and it was favored in Britain, notably at the
      University of Edinburgh, in the 1960s and 1970s. It survives in institutional names such as
      IEEE Transactions on Pattern Analysis and Machine Intelligence (from 1979) and the journal
      Nature Machine Intelligence (from 2019), and in forecasting, where expert surveys ask when
      [[high-level-machine-intelligence|high-level machine intelligence]] will arrive, meaning
      unaided machines that can do every task better and more cheaply than human workers.
    example: >-
      The essay argues that machine intelligence will not look like human intelligence even when it
      matches it.
origin: >-
  Alan Turing wrote of 'intelligent machinery' in a 1948 report and a 1951 lecture. Donald Michie
  made 'machine intelligence' the name of a research tradition at the University of Edinburgh,
  directing its Experimental Programming Unit from its founding in 1965 (later the Department of
  Machine Intelligence and Perception) and launching the Machine Intelligence workshop and book
  series in the mid-1960s.
note: >-
  Usage follows fashion: some companies and researchers adopt 'machine intelligence' to distance
  their work from AI hype or science-fiction connotations. It is not a separate technical concept.
