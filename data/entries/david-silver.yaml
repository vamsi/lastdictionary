dates: b. 1976
plain: >-
  A British computer scientist who led the reinforcement-learning research behind AlphaGo and
  AlphaZero, programs that taught themselves to play board games better than any human.
senses:
  - definition: >-
      British computer scientist at University College London and a leader of
      [[deep-reinforcement-learning|deep reinforcement learning]]. He co-founded the games company
      Elixir Studios with [[demis-hassabis|Demis Hassabis]], then earned a PhD at the University of
      Alberta (2009) under [[richard-sutton|Richard Sutton]] on reinforcement learning and
      [[monte-carlo-tree-search|Monte Carlo tree search]] in Go. Working with DeepMind from its
      founding in 2010, full-time from 2013, he led its reinforcement-learning research, including
      [[alphago|AlphaGo]], which combined policy and value networks with tree search to defeat Lee
      Sedol in 2016; [[alphago-zero|AlphaGo Zero]] and [[alphazero|AlphaZero]] (2017), which learned
      by [[self-play|self-play]] alone; and MuZero (2019), which also learned its own model of the
      game. With Sutton he argued in 2025 that AI must increasingly learn from its own experience of
      the world (see [[era-of-experience|era of experience]]). In January 2026 he left Google
      DeepMind to lead Ineffable Intelligence, his London startup pursuing superintelligence through
      reinforcement learning. ACM Prize in Computing 2019.
