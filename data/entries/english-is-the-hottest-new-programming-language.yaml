term: English is the hottest new programming language
id: english-is-the-hottest-new-programming-language
pos: phr.
also:
  - the hottest new programming language is English
domain: culture
domains:
  - llm
  - eng
labels:
  - informal
level: specialist
plain: >-
  A catchphrase meaning that people can now get computers to do things by describing what they want
  to an AI in ordinary language, instead of writing code.
senses:
  - definition: >-
      A slogan expressing the idea that natural-language instructions to a
      [[large-language-model|large language model]] have become a practical way to program
      computers, so that writing clear English — or any human language — is now itself a form of
      software development. It sums up the shift behind [[prompt-engineering|prompt engineering]],
      [[vibe-coding|vibe coding]] and [[software-3-0|Software 3.0]]. Skeptics answer that natural
      language is ambiguous, that model outputs vary from run to run, and that dependable systems
      still need precise specifications, tests and code review, so the slogan describes a new
      interface to computing rather than the end of programming.
    example: >-
      If English is the hottest new programming language, then most of our bugs are now ambiguities
      in the spec.
origin: >-
  Posted by Andrej Karpathy on Twitter in January 2023, about two months after ChatGPT's release, as
  'The hottest new programming language is English'. It was widely reposted and became a stock line
  in talks and articles about AI and the future of programming.
year: 2023
