term: agentic RAG
id: agentic-rag
pos: n.
also:
  - agentic retrieval
  - agentic retrieval-augmented generation
  - agentic search
domain: agents
domains:
  - eng
  - llm
labels:
  - emerging
level: core
plain: >-
  Retrieval in which the AI runs its own research: it decides what to search for, looks at the
  results, searches again if needed, and only then answers.
senses:
  - definition: >-
      A form of [[retrieval-augmented-generation|retrieval-augmented generation]] in which retrieval
      is directed by an [[ai-agent|agent]] rather than a fixed retrieve-then-generate pipeline. The
      model decides whether retrieval is needed, formulates and reformulates queries
      ([[query-rewriting|query rewriting]]), chooses among tools and sources (vector index, keyword
      search, web search, SQL, APIs), reads results, judges whether they suffice, follows leads
      across several hops, and stops when it can answer, often with [[citation|citations]].
      Implementations range from a single model in an [[agent-loop|agent loop]] with search tools,
      as in [[react|ReAct]], to routers and multi-agent set-ups with planners, retrievers and
      verifiers; models can also be trained with [[reinforcement-learning|reinforcement learning]]
      to search well. Agentic RAG handles multi-step and ambiguous questions better than one-shot
      retrieval, at the cost of more latency, more tokens and more opportunities for error;
      [[deep-research|deep research]] systems are a long-horizon version.
    example: >-
      Agentic RAG let the assistant notice that its first search missed the 2025 filings and run a
      narrower second query.
origin: >-
  Interleaving reasoning with retrieval was explored in 2022–2023 (Self-Ask, ReAct,
  Demonstrate-Search-Predict, Self-RAG), and Search-R1 (2025) trained models to search with
  reinforcement learning. The label 'agentic RAG' spread in 2024 through framework and
  vector-database tutorials; a January 2025 survey by Aditi Singh and colleagues helped settle its
  definition.
year: 2024
