term: ChatGPT moment
id: chatgpt-moment
pos: n.
also:
  - iPhone moment
  - Sputnik moment
  - the ChatGPT moment for robotics
domain: culture
domains:
  - society
  - hist
labels:
  - informal
level: core
plain: >-
  A phrase for the point when a technology suddenly becomes impressive and widely used, as ChatGPT
  did in late 2022; people ask when robotics, biology or other fields will get theirs.
senses:
  - definition: >-
      A sudden inflection point at which a technology moves from research curiosity to mass
      awareness and adoption, modeled on the public release of [[chatgpt|ChatGPT]] in November 2022,
      which reached an estimated 100 million users within about two months. The phrase is used
      predictively and promotionally — 'the ChatGPT moment for robotics', 'for biology', 'for video'
      — to claim that a field is about to undergo a similar discontinuity, and retrospectively to
      date such shifts. Related formulas include 'iPhone moment', applied to AI itself, and 'Sputnik
      moment', a strategic shock from a rival, applied in January 2025 to the release of DeepSeek-R1
      (see [[deepseek-moment|DeepSeek moment]]). Skeptics note that the phrase obscures the years of
      prior work behind any such moment.
    example: >-
      Everyone at the robotics conference was asking when the field gets its ChatGPT moment.
origin: >-
  Common in technology commentary from 2023. Nvidia's Jensen Huang declared in March 2023 that AI
  was having its 'iPhone moment' and said at CES in January 2025 that the ChatGPT moment for general
  robotics was just around the corner; Marc Andreessen called DeepSeek-R1 AI's Sputnik moment the
  same month.
year: 2023
note: >-
  The 100-million-user figure was an estimate based on web-traffic data reported by analysts at UBS
  in February 2023, not a company disclosure.
