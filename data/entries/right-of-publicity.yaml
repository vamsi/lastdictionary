term: right of publicity
id: right-of-publicity
pos: n.
also:
  - publicity rights
  - personality rights
  - name, image and likeness
  - NIL rights
  - likeness rights
domain: gov
domains:
  - gen
  - society
labels:
  - legal
level: core
plain: >-
  A person's legal power to decide whether businesses may use their name, face, voice or other
  recognizable traits to sell things, and to be paid when they do. AI's skill at copying voices and
  faces makes it more important.
senses:
  - definition: >-
      A legal right, found mainly in US state law, to stop others from trading on one's identity —
      putting one's voice, signature, photograph, name, likeness or other recognizable traits to
      work in advertising or merchandise without consent — and to recover damages when they do. Most
      states recognize it by statute or common law, and some protect it after death, in Indiana for
      100 years. Courts have applied it to imitations as well as copies, as when singers won damages
      over sound-alike voices in advertisements (Midler v. Ford, 1988; Waits v. Frito-Lay, 1992).
      Generative AI has made it central to disputes over [[voice-cloning|voice cloning]] and
      [[digital-replica|digital replicas]]: Tennessee's ELVIS Act (2024) explicitly protects voice
      and reaches tools built to imitate it, California and New York regulate replicas of
      performers, and the proposed federal [[no-fakes-act|NO FAKES Act]] would create a national
      right. Elsewhere, comparable protection comes from personality rights, privacy, passing-off
      and [[data-protection|data protection]] law.
    example: >-
      The voice actor's suit claims the cloned voice in the ad violates her right of publicity.
origin: >-
  Named by Judge Jerome Frank in Haelan Laboratories v. Topps Chewing Gum (US Court of Appeals for
  the Second Circuit, 1953), which recognized a transferable right in a baseball player's
  photograph, and elaborated by Melville Nimmer in a 1954 law-review article. The US Supreme Court
  has addressed it once, in Zacchini v. Scripps-Howard Broadcasting (1977).
year: 1953
note: >-
  Distinct from copyright, which protects works rather than people — a voice or a style cannot be
  copyrighted — and from defamation and privacy torts, which address falsity and intrusion rather
  than commercial appropriation.
see_also:
  - digital replica
  - NO FAKES Act
  - voice cloning
  - deepfake
  - privacy
sources:
