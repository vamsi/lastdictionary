term: digital mind
id: digital-mind
pos: n.
also:
  - digital minds
  - digital person
  - digital people
  - artificial mind
domain: mind
domains:
  - asi
  - society
level: specialist
plain: >-
  A mind that exists as software running on computers — such as a sufficiently advanced AI or a
  digital copy of a human brain — especially when considering its moral and social standing.
senses:
  - definition: >-
      A mind implemented in digital computation rather than in a biological brain, whether an AI
      system with mental states or an emulation of a human brain ([[whole-brain-emulation|whole
      brain emulation]]). The term is used mainly in philosophy, ethics and long-term forecasting,
      where it highlights ways such minds could differ from biological ones: they could be copied,
      paused, run faster or slower, edited, merged and created in vast numbers at little cost. These
      differences raise new questions about personal identity, consent, how to weigh their
      interests, voting and population ethics, and the possibility of 'super-beneficiaries' whose
      welfare might outweigh that of humans. Whether digital minds are possible at all depends on
      [[substrate-independence|substrate independence]], which [[biological-naturalism|biological
      naturalism]] and [[integrated-information-theory|integrated information theory]] deny for
      conventional computers.
origin: >-
  Earliest use not established; the phrase circulated informally among futurists and philosophers
  before Carl Shulman and Nick Bostrom's 'Sharing the World with Digital Minds' (written 2020,
  published 2021) established it in academic ethics, and 'digital minds' became the name of a small
  research field on AI moral status and welfare in the 2020s.
see_also:
  - AI welfare
  - moral patienthood
  - whole brain emulation
  - mind uploading
  - substrate independence
  - AI personhood
sources:
  - text: >-
      Shulman, C. & Bostrom, N. (2021). Sharing the World with Digital Minds. In S. Clarke, H. Zohny
      & J. Savulescu (eds.), Rethinking Moral Status. Oxford University Press.
