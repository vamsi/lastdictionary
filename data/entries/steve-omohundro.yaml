dates: b. 1959
plain: >-
  An American computer scientist who argued in 2008 that almost any sufficiently advanced AI would
  tend to protect itself and seek resources, unless deliberately designed not to.
senses:
  - definition: >-
      American computer scientist whose paper 'The Basic AI Drives', presented at the first
      Conference on Artificial General Intelligence (2008), argued that sufficiently advanced
      goal-seeking systems will, whatever their final goals, tend to develop [[basic-ai-drives|basic
      AI drives]]: to preserve themselves, protect their goals from change, acquire resources,
      improve themselves and become more rational, unless explicitly designed otherwise.
      [[nick-bostrom|Nick Bostrom]] formalized the argument as
      [[instrumental-convergence|instrumental convergence]], and it underlies concerns about
      [[power-seeking|power-seeking]] and [[corrigibility|corrigibility]]. Trained as a physicist
      (PhD, University of California, Berkeley), he earlier co-developed the Star Lisp parallel
      programming language at Thinking Machines Corporation, taught at the University of Illinois,
      where he researched machine learning and computer vision, and designed the Sather programming
      language at the International Computer Science Institute in Berkeley. More recently he has
      argued for provably safe AI built on formal verification, notably in a 2023 paper with
      [[max-tegmark|Max Tegmark]].
