plain: >-
  The leading yearly conference on data mining — finding useful patterns in large datasets — where
  many widely used machine learning tools were first presented.
senses:
  - definition: >-
      The ACM SIGKDD Conference on Knowledge Discovery and Data Mining, the premier venue for
      [[data-mining|data mining]] and applied data science, held each August. It emphasizes scalable
      algorithms and real-world applications — [[recommender-system|recommendation]], fraud
      detection, web and social-network analysis, advertising and health — and runs a research track
      alongside an applied data science track for industry papers. Influential KDD papers include
      the DBSCAN clustering algorithm (1996) and, in 2016, [[xgboost|XGBoost]], node2vec and the
      [[lime|LIME]] explanation method; its KDD Cup, held since 1997, was one of the first recurring
      machine learning competitions.
origin: >-
  Grew out of workshops on knowledge discovery in databases organized by Gregory Piatetsky-Shapiro
  from 1989; the first full conference met in Montreal in 1995, and the ACM Special Interest Group
  on Knowledge Discovery and Data Mining (SIGKDD), founded in 1998, took over its organization.
year: 1995
