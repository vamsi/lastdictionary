term: lethal autonomous weapons system
id: lethal-autonomous-weapons-system
pos: n.
also:
  - LAWS
  - killer robot
  - killer robots
  - autonomous weapon
  - autonomous weapons system
  - lethal autonomous robotics
  - meaningful human control
domain: gov
domains:
  - robot
  - society
  - safety
labels:
  - contested
level: essential
plain: >-
  A weapon that, after a person sets it going, picks out and attacks targets — including people — on
  its own, with no human deciding each strike. Critics call them killer robots.
senses:
  - definition: >-
      A weapon system that, once a person has set it going, can pick out targets and use lethal
      force against them without a human signing off on each attack. Definitions differ on where the
      line falls: the US Department of Defense draws it functionally, at choosing and engaging
      targets without further operator input, while the International Committee of the Red Cross
      emphasizes that such a weapon fires when what its sensors detect fits a generic target
      profile, so the person using it never picks the particular target or the exact moment and
      place of the strike. Some defensive systems, such as anti-missile guns, have long engaged
      incoming munitions autonomously; the concern is the spread of autonomy, enabled by
      [[computer-vision|computer vision]] and AI targeting, to drones, loitering munitions and other
      systems that may target people. Debate centers on meaningful human control — whether people
      keep enough understanding, judgment and timely ability to intervene for the principles of
      distinction, proportionality and precaution in [[international-humanitarian-law|international
      humanitarian law]] to be applied, and for someone to be held accountable. Most states now
      favor a two-tier approach: prohibit systems that cannot comply with that law and regulate the
      rest.
    example: >-
      A loitering munition that chooses its own targets in a city is exactly the kind of LAWS the
      delegation wants banned.
origin: >-
  'Killer robot' is older science-fiction usage. UN Special Rapporteur Christof Heyns's 2013 report
  spoke of 'lethal autonomous robotics', and 'lethal autonomous weapons systems' became the
  diplomatic term in November 2013, when parties to the Convention on Certain Conventional Weapons
  (CCW) agreed to hold expert meetings in Geneva from 2014. The UK NGO Article 36 is credited with
  introducing 'meaningful human control' in 2013, the year the Campaign to Stop Killer Robots
  launched.
year: 2013
note: >-
  As of October 2026, no treaty specifically governs autonomous weapons. A CCW Group of Governmental
  Experts, meeting since 2017 and deciding by consensus, concluded its work on 4 September 2026 by
  agreeing a set of elements for a possible instrument, amid growing calls to open negotiations; the
  Convention's Seventh Review Conference (16–20 November 2026) is to decide next steps.
