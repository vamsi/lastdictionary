plain: >-
  An American research organization, long funded mainly by the US government, where early AI
  programs were written and which now advises governments on AI and security.
senses:
  - definition: >-
      A nonprofit policy research organization, headquartered in Santa Monica, California, that
      studies defense, national security and public policy, mostly under government contracts. In
      the 1950s it was a cradle of computing and AI: Allen Newell, Herbert A. Simon and J. C. Shaw
      wrote the [[logic-theorist|Logic Theorist]] (1956) and developed the
      [[general-problem-solver|General Problem Solver]] in collaboration with RAND, while its
      researchers advanced game theory, linear programming and systems analysis. In 1965 it
      published Hubert Dreyfus's critique 'Alchemy and Artificial Intelligence', the starting point
      of his influential case against classical AI. Since 2023 its studies of AI and national
      security — including red-team tests of whether language models help plan biological attacks,
      guidance on securing model weights against theft, and analyses of compute and export controls
      — have informed US policy.
origin: >-
  Founded in 1946 as Project RAND (from 'research and development'), a US Army Air Forces program
  run by the Douglas Aircraft Company, and incorporated as the independent nonprofit RAND
  Corporation in 1948. Jason Matheny, founding director of Georgetown's
  [[center-for-security-and-emerging-technology|Center for Security and Emerging Technology]],
  became its chief executive in 2022.
year: 1948
