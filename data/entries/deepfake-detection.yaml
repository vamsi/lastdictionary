term: deepfake detection
id: deepfake-detection
pos: n.
also:
  - synthetic media detection
  - AI-generated image detection
  - audio deepfake detection
  - manipulated media detection
domain: sec
domains:
  - percep
  - society
level: core
plain: >-
  Using software, often itself AI, to tell whether a video, photo or voice recording has been faked
  or generated by AI rather than captured from reality.
senses:
  - definition: >-
      The task of determining whether images, video or audio have been synthesized or manipulated by
      AI — face swaps, lip-sync edits, fully generated scenes, cloned voices — usually with
      [[classifier|classifiers]] trained on real and fake examples. Detectors look for generation
      artifacts (frequency-domain traces, blending boundaries, inconsistent lighting or reflections,
      implausible physiological signals, vocoder artifacts in speech) or learn such cues end to end.
      Detection is an arms race: classifiers often fail on generators absent from their training
      data, degrade under compression and re-recording, and can be evaded adversarially, so
      benchmark accuracy overstates real-world reliability. Practice therefore combines detection
      with provenance — [[content-credentials|Content Credentials]] and
      [[ai-watermarking|watermarks]] that establish origin instead of inferring it — and with human
      verification. Mistakes cut both ways: a false 'fake' verdict lets genuine evidence be
      dismissed, feeding the [[liar-s-dividend|liar's dividend]].
    example: >-
      The bank's audio deepfake detection flagged the caller's voice as synthetic before the
      transfer went through.
origin: >-
  Research followed the appearance of 'deepfakes' on Reddit in late 2017; early detectors in 2018
  exploited cues such as unnatural blinking. Andreas Rössler and colleagues' FaceForensics++
  benchmark (2019) and the Deepfake Detection Challenge run by Facebook, AWS, Microsoft and the
  Partnership on AI (2019–2020), whose winner scored about 65% on unseen videos, showed how hard
  generalization is.
year: 2018
