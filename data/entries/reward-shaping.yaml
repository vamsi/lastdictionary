  - intrinsic motivation
  - curriculum learning
  - specification gaming
  - process reward model
contrast:
  - sparse reward
sources:
  - text: >-
      Ng, A. Y., Harada, D. & Russell, S. (1999). Policy invariance under reward transformations:
      Theory and application to reward shaping. Proceedings of ICML 1999.
  - text: >-
      Randløv, J. & Alstrøm, P. (1998). Learning to Drive a Bicycle using Reinforcement Learning and
      Shaping. Proceedings of ICML 1998.
