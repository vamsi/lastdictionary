term: existential risk
id: existential-risk
pos: n.
also:
  - x-risk
  - existential catastrophe
  - AI existential risk
  - AI x-risk
domain: asi
domains:
  - safety
  - society
  - gov
labels:
  - contested
level: essential
plain: >-
  A danger that could end humanity, or shut it out of a good future forever. Some experts count
  advanced AI among the largest such risks; others think this worry is overblown.
senses:
  - definition: >-
      A risk that threatens either the end of humanity or the irreversible loss of most of what its
      long-term future could have been, for example through an unrecoverable collapse of
      civilization or the permanent entrenchment of bad values or rulers ([[value-lock-in|value
      lock-in]]). [[nick-bostrom|Nick Bostrom]]'s standard 2002 definition covers outcomes that
      would 'permanently and drastically curtail' humanity's potential as well as extinction.
      Irreversibility distinguishes it from a [[global-catastrophic-risk|global catastrophic risk]],
      from which humanity might recover. The category spans natural risks (asteroid impact,
      supervolcanic eruption) and human-made ones (nuclear war, engineered pandemics, advanced AI).
      Toby Ord's The Precipice (2020) estimated total existential risk this century at about one in
      six and put unaligned AI, at about one in ten, as the largest single source. AI existential
      risk is usually argued from the prospect of [[superintelligence|superintelligence]] with goals
      at odds with human interests ([[ai-takeover|AI takeover]], [[loss-of-control|loss of
      control]]), but also from AI-enabled war, engineered pandemics, totalitarian lock-in and
      [[gradual-disempowerment|gradual disempowerment]]. The one-sentence 2023
      [[statement-on-ai-risk|Statement on AI Risk]] ranked extinction risk from AI with pandemics
      and nuclear war as a global priority. Critics argue that the case rests on speculative chains
      of reasoning, distracts from present harms such as bias and labor exploitation, or serves the
      interests of AI companies.
    example: >-
      The report separates existential risk from ordinary catastrophic risk by asking whether
      recovery is possible.
origin: >-
  Introduced by Nick Bostrom in 'Existential Risks: Analyzing Human Extinction Scenarios and Related
  Hazards' (Journal of Evolution and Technology, 2002), building on earlier work on human extinction
  by philosophers including Derek Parfit and John Leslie. The abbreviation x-risk spread in
  effective-altruist and rationalist circles; AI existential risk became a mainstream policy topic
  in 2023.
year: 2002
note: >-
  In policy writing 'existential risk' is sometimes used loosely for any very large harm; strictly,
  the loss must be permanent. Estimates of AI existential risk are often summarized as
  [[p-doom|p(doom)]].
