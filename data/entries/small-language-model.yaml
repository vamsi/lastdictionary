term: small language model
id: small-language-model
pos: n.
also:
  - SLM
  - small model
  - compact language model
domain: llm
domains:
  - infer
  - eng
level: core
plain: >-
  A language model built to be compact enough to run cheaply and quickly, even on a laptop or phone,
  trading some knowledge and skill for speed, privacy and lower cost.
senses:
  - definition: >-
      A [[language-model|language model]] with relatively few [[parameter|parameters]] — in common
      but informal usage, from a few hundred million up to roughly 10–15 billion — designed for low
      [[latency|latency]], low [[inference-cost|inference cost]] or [[on-device-ai|on-device]]
      deployment. Small models narrow the gap with larger ones through heavily curated or
      [[synthetic-data|synthetic data]], training on far more tokens than compute-optimal recipes
      prescribe ([[overtraining|overtraining]]), [[knowledge-distillation|knowledge distillation]]
      from larger teacher models, and [[quantization|quantization]]. They usually trail
      [[large-language-model|large models]] in world knowledge and complex multi-step reasoning, but
      are widely fine-tuned for narrow tasks, used as routers, classifiers and guard models, and
      deployed where data must stay local. In agent systems a small model often handles routine
      subtasks while a larger model plans.
    example: >-
      A 3-billion-parameter small language model handles intent detection on the phone, so no audio
      leaves the device.
origin: >-
  The contrast with large models appears in Timo Schick and Hinrich Schütze's 2020 paper 'It's Not
  Just Size That Matters: Small Language Models Are Also Few-Shot Learners'. The abbreviation SLM
  spread in 2023–2024 with Microsoft's Phi series: phi-1 (1.3 billion parameters, 2023) and Phi-3
  (2024), whose 3.8-billion-parameter 'mini' model was presented as small enough to run on a phone.
year: 2020
note: >-
  Size labels drift: GPT-2's 1.5 billion parameters counted as large in 2019, but models several
  times bigger are marketed as small today. 'Small' is relative to the frontier, not an absolute
  class.
