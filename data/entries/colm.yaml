term: COLM
id: colm
pos: prop. n.
also:
  - Conference on Language Modeling
domain: orgs
domains:
  - llm
level: specialist
plain: >-
  An academic conference, founded in 2024, devoted entirely to research on language models, the
  technology behind AI chatbots.
senses:
  - definition: >-
      The Conference on Language Modeling, an annual peer-reviewed conference devoted to the science
      and engineering of [[language-model|language models]]: pretraining data and methods,
      alignment, evaluation, interpretability, efficiency, safety and societal effects. It was
      created on the view that language modeling had become a field of its own that fit awkwardly
      between general [[machine-learning|machine learning]] venues such as [[neurips|NeurIPS]] and
      [[natural-language-processing|natural language processing]] venues such as those of the
      [[association-for-computational-linguistics|Association for Computational Linguistics]].
      Reviewing runs on [[openreview|OpenReview]]. Within two years it had become one of the main
      venues for [[large-language-model|large language model]] research.
origin: >-
  Founded by academic and industry researchers in language modeling; the first conference was held
  in October 2024 at the University of Pennsylvania in Philadelphia, and the second in Montreal in
  October 2025.
year: 2024
