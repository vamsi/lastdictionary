term: Frontier AI Safety Commitments
id: frontier-ai-safety-commitments
pos: prop. n.
also:
  - Seoul commitments
  - Seoul Frontier AI Safety Commitments
domain: gov
domains:
  - safety
level: core
plain: >-
  Promises made in 2024 by major AI companies to publish safety plans for their most advanced
  models, including the danger points at which they would stop if the risks could not be controlled.
senses:
  - definition: >-
      Voluntary commitments announced at the AI Seoul Summit on 21 May 2024 by 16 AI developers from
      North America, Europe, Asia and the Middle East — among them Amazon, Anthropic, Google, IBM,
      Meta, Microsoft, Mistral AI, Naver, OpenAI, Samsung Electronics, xAI and Zhipu AI — later
      joined by Magic, MiniMax, 01.AI and NVIDIA, for 20 in all. Each signatory accepted three kinds
      of obligation: to manage the risks of its [[frontier-model|frontier models]] throughout their
      development and use, defining in advance the level of severe risk it would refuse to tolerate
      without safeguards and, as a last resort, not building or releasing a model whose risks it
      could not bring below that level; to answer for this through internal governance; and to be
      open about its approach with governments and the public. Each company promised to publish a
      safety framework before the Paris AI Action Summit of February 2025, and most did, as a
      [[responsible-scaling-policy|responsible scaling policy]] or similar document built on
      [[capability-threshold|capability thresholds]] and [[if-then-commitment|if-then commitments]].
    example: >-
      Under the Frontier AI Safety Commitments, the lab published a framework naming its
      intolerable-risk thresholds.
origin: >-
  Brokered by the UK and South Korean governments as hosts of the Seoul summit, building on the
  voluntary commitments that US developers made to the White House in July 2023 and on early company
  safety policies such as Anthropic's responsible scaling policy (September 2023).
year: 2024
note: >-
  Non-binding and self-defined: each company sets its own thresholds and judges its own compliance,
  which critics say makes them hard to verify. California's [[sb-53|SB 53]] later made publishing
  such frameworks a legal duty for large frontier developers.
