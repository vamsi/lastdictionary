term: Magnifica Humanitas
id: magnifica-humanitas
pos: prop. n.
pronunciation: mahn-YEE-fee-kah oo-MAH-nee-tahs
domain: society
domains:
  - gov
  - mind
level: specialist
plain: >-
  Pope Leo XIV's 2026 letter to the Catholic Church and the world about artificial intelligence,
  arguing that AI must serve human dignity and the common good.
senses:
  - definition: >-
      A papal encyclical on human dignity in the age of artificial intelligence, the first
      encyclical issued by Pope Leo XIV. Drawing on Catholic social teaching, it holds that AI must
      serve human dignity and the common good; warns that the apparent objectivity of automated
      systems can conceal the assumptions of their designers and training data; criticizes simulated
      empathy and friendship that may mislead vulnerable users; and argues that
      [[automated-decision-making|automated decision-making]] about jobs, credit and public services
      lacks compassion and mercy. It calls for clearly assigned human responsibility for AI
      decisions, attention to AI's energy and water use, broad participation to counter
      [[concentration-of-power|concentration of power]], and treatment of data as a shared good
      rather than a commodity. It describes current AI systems as 'cultivated' rather than built,
      their inner workings largely unknown.
    example: >-
      The ethics board quoted Magnifica Humanitas on who must answer for an automated denial of
      credit.
origin: >-
  Published by the Vatican on 25 May 2026. Leo XIV chose his papal name in reference to Leo XIII,
  whose 1891 encyclical Rerum novarum addressed the industrial revolution; the new text presents AI
  as the comparable social question of its age. It followed the Vatican's January 2025 doctrinal
  note on AI, Antiqua et nova.
year: 2026
