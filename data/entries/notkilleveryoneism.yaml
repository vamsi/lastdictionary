level: specialist
plain: >-
  A deliberately clumsy joke-word for the goal of making sure advanced AI does not kill everyone,
  adopted because terms like 'AI safety' had come to cover much milder concerns.
senses:
  - definition: >-
      A tongue-in-cheek name for the project of preventing advanced AI from causing human extinction
      or a comparable catastrophe, adopted to separate that goal from broader senses of
      [[ai-safety|AI safety]] and [[ai-alignment|alignment]], which by the early 2020s were also
      used for content moderation, brand safety, bias reduction and making chatbots polite. Its
      users chose an ungainly, unmistakable word on the theory that respectable-sounding names get
      diluted as they spread. It circulates mainly on [[lesswrong|LessWrong]] and AI-risk social
      media, often ironically, and also names a popular meme account devoted to AI risk.
    example: I don't mean safety as in no swear words — I mean notkilleveryoneism.
origin: >-
  In use on Twitter and LessWrong by early 2023, often in the form 'AI notkilleveryoneism'; a
  LessWrong post of 28 April 2023 already debated whether the word 'sounds dumb'. Who coined it is
  not established; it is often associated with Eliezer Yudkowsky and his circle, who had long
  complained that the names of their field were being diluted. The meme account 'AI
  Notkilleveryoneism Memes' spread it further.
year: 2023
