      Gao, L., Schulman, J. & Hilton, J. (2022). Scaling Laws for Reward Model Overoptimization.
      ICML 2023. arXiv:2210.10760.
    url: https://arxiv.org/abs/2210.10760
  - text: >-
      Rafailov, R. et al. (2024). Scaling Laws for Reward Model Overoptimization in Direct Alignment
