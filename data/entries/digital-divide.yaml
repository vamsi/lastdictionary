# yaml-language-server: $schema=../schema/entry.schema.json

term: digital divide
id: digital-divide
pos: n.
also:
  - AI divide
  - compute divide
  - digital inequality
domain: society
domains:
  - gov
level: core
plain: >-
  The gap between people, places or countries that have good access to digital technology, and the
  skills to use it, and those that do not; AI may widen it.
senses:
  - definition: >-
      A systematic gap in who benefits from digital technology, measured between individuals, social
      groups, regions or whole countries. Researchers distinguish a first-level divide in access
      (devices, connectivity, cost), a second-level divide in skills and usage, and a third-level
      divide in the outcomes people gain. Applied to AI, the concept covers unequal access to
      capable models, [[ai-literacy|AI literacy]] and the infrastructure to use them; the
      under-representation of most languages and cultures in training data, so that systems serve
      their speakers worse; and a 'compute divide' in which the computing power needed for frontier
      research is concentrated in a few firms and countries, leaving most universities and much of
      the Global South behind.
    example: >-
      Most of the world's languages have almost no training data, a digital divide built into the
      models themselves.
origin: >-
  Popularized in the United States in the late 1990s: it appears in the titles of the National
  Telecommunications and Information Administration's 1998 and 1999 'Falling Through the Net'
  reports and in President Bill Clinton's 2000 State of the Union address. Coinage is variously
  credited to Lloyd Morrisett of the Markle Foundation and to NTIA head Larry Irving; the earliest
  use has not been established. Nur Ahmed and Muntasir Wahed used 'compute divide' in 2020 for the
  gap between elite and other universities in deep-learning research.
see_also:
  - AI literacy
  - concentration of power
  - AI colonialism
  - sovereign AI
  - AI for good
sources:
  - text: >-
      Ahmed, N. & Wahed, M. (2020). The De-democratization of AI: Deep Learning and the Compute
      Divide in Artificial Intelligence Research. arXiv preprint.
