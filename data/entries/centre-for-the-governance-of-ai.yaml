level: specialist
plain: >-
  A research organization, based in Britain, that studies how governments and companies should
  handle the dangers of advanced AI and the large economic and political changes it could cause.
senses:
  - definition: >-
      A research nonprofit, spun out of Oxford's [[future-of-humanity-institute|Future of Humanity
      Institute]] in 2021, that works on how governments, companies and international bodies should
      handle the risks of advanced AI and the economic and political changes it could bring, and
      that runs a large fellowship program for new researchers. Its staff and alumni developed or
      popularized ideas central to frontier-AI policy, including [[compute-governance|compute
      governance]], regulation of [[frontier-ai|frontier AI]] through safety standards and
      licensing, model evaluations for extreme risks, [[third-party-ai-evaluation|third-party
      auditing]] and the analysis of company [[responsible-scaling-policy|safety frameworks]], and
      its surveys of AI researchers and the public are widely cited. Its alumni hold senior roles at
      AI companies, government AI safety institutes and think tanks, making it a significant source
      of personnel for the field.
origin: >-
  Begun in 2016 at Yale University by political scientist Allan Dafoe as a research program on AI
  governance; it moved in 2018 to Oxford's [[future-of-humanity-institute|Future of Humanity
  Institute]] as the Governance of AI Program and became an independent nonprofit in 2021. Ben
  Garfinkel is its director.
year: 2016
