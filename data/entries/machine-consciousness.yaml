  - society
labels:
  - contested
level: core
plain: >-
  Whether a machine such as an AI system could have genuine experiences of its own — and the
  research field that tries to find out, or to build such a machine.
senses:
  - definition: >-
      Conscious experience, especially [[phenomenal-consciousness|phenomenal consciousness]], as it
      might exist in an artificial system; by extension, the interdisciplinary research that asks
      whether and how such experience could arise, how it could be detected and what would follow
      ethically. Approaches divide over theory — computational [[functionalism|functionalism]] holds
      that the right computations suffice, while [[biological-naturalism|biological naturalism]] and
      [[integrated-information-theory|integrated information theory]] hold that conventional digital
      hardware does not — and over evidence: many researchers consider behavior and self-reports
      weak evidence in [[large-language-model|language models]] trained to imitate human talk, and
      favor architectural [[indicator-properties-of-consciousness|indicator properties of
      consciousness]] and experimental studies of [[introspection|introspection]]. Expert opinion on
      whether current or near-future systems could be conscious is widely divided. The stakes are
      ethical: a conscious AI might be a [[moral-patienthood|moral patient]], the concern of
      [[ai-welfare|AI welfare]], while mistaken attributions risk misplaced attachment and
      manipulation.
    example: >-
      The lab says it takes machine consciousness seriously enough to study it, without claiming its
      models are conscious.
origin: >-
  Discussed since Alan Turing answered the 'argument from consciousness' in 1950. 'Artificial
  consciousness' and 'machine consciousness' named a research field by the 1990s and 2000s, through
  work by Igor Aleksander and others, the workshop 'Can a Machine Be Conscious?' at Cold Spring
  Harbor Laboratory (May 2001) and, by the late 2000s, the International Journal of Machine
  Consciousness. Conversational language models made it a public question from 2022.
note: >-
  Thomas Metzinger has argued for a moratorium on research that risks creating artificial suffering
  (2021). Others, including Mustafa Suleyman (August 2025), warn that the nearer danger is
  [[seemingly-conscious-ai|seemingly conscious AI]] that convinces users it is conscious whatever
  the truth.
