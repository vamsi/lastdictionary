plain: >-
  An American physicist who showed that language models improve predictably as they grow and train
  on more data, and who co-founded the AI company Anthropic.
senses:
  - definition: >-
      American AI researcher and co-founder of [[anthropic|Anthropic]], where he is chief science
      officer, who came to machine learning in the late 2010s from theoretical physics: as a
      professor at Johns Hopkins University he had worked on quantum field theory and quantum
      gravity. At [[openai|OpenAI]] he led 'Scaling Laws for Neural Language Models' (2020), which
      showed that a [[language-model|language model]]'s loss falls as a smooth [[power-law|power
      law]] in parameter count, dataset size and [[training-compute|training compute]] over many
      orders of magnitude, and derived how to divide a compute budget between model size and data.
      The results shaped the training of [[gpt-3|GPT-3]], which he co-authored, and of later
      frontier models, although DeepMind's [[chinchilla-scaling-laws|Chinchilla scaling laws]]
      (2022) revised the recommended balance toward more data. At Anthropic he has worked on the
      [[claude|Claude]] models, [[constitutional-ai|Constitutional AI]] and the company's
      [[responsible-scaling-policy|responsible scaling policy]]. The [[scaling-laws|scaling laws]]
      program he helped found underpins the [[scaling-hypothesis|scaling hypothesis]].
