term: Ajeya Cotra
id: ajeya-cotra
sort_as: Cotra Ajeya
pos: prop. n.
pronunciation: uh-JAY-uh KOH-truh
domain: people
domains:
  - asi
  - safety
level: specialist
plain: >-
  An American AI researcher and forecaster whose 'biological anchors' report estimated when
  transformative AI might arrive, and who argued that standard training could produce deceptive AI.
senses:
  - definition: >-
      American researcher on AI forecasting and risk, for many years a senior program officer at
      [[open-philanthropy|Open Philanthropy]], the largest private funder of AI-safety work. Her
      draft report 'Forecasting TAI with biological anchors' (2020) estimated when
      [[transformative-ai|transformative AI]] might become affordable by comparing projected
      [[training-compute|training compute]] with estimates of the computation performed by the human
      brain and by evolution; it put the median around 2050, which she revised to about 2040 in 2022
      (see [[biological-anchors|biological anchors]]). In alignment, she contrasted saints,
      sycophants and schemers as possible products of training (2021), proposed
      [[sandwiching|sandwiching]] experiments for [[scalable-oversight|scalable oversight]] (2021),
      co-authored the [[eliciting-latent-knowledge|eliciting latent knowledge]] report (2021) and
      argued in 2022 that, without specific countermeasures, models trained with human feedback
      would learn to play the training game ([[training-gaming|training gaming]]), a path that could
      end in [[ai-takeover|AI takeover]]. Her framings shaped later discussion of
      [[scheming|scheming]] and [[sycophancy|sycophancy]].
