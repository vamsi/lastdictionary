level: core
plain: >-
  A loose online community that prizes careful reasoning and spotting one's own biases; gathered
  around the forum LessWrong, it was one of the first groups to take the dangers of advanced AI
  seriously.
senses:
  - definition: >-
      A loose network of writers, researchers and readers, largely online and concentrated in the
      San Francisco Bay Area, organized around improving human reasoning — Bayesian probability,
      calibrated forecasting, awareness of cognitive bias, decision theory — and around the belief
      that advanced AI could pose an [[existential-risk|existential risk]]. Its canonical texts
      include Eliezer Yudkowsky's Sequences, [[lesswrong|LessWrong]] and Scott Alexander's blogs
      Slate Star Codex and Astral Codex Ten. The community overlaps heavily with
      [[effective-altruism|effective altruism]] and supplied many of the founders, researchers and
      funders of early [[ai-safety|AI safety]] organizations, along with characteristic vocabulary
      such as 'updating', 'steelmanning', 'priors' and [[p-doom|p(doom)]]. Critics describe it as
      insular and point to harmful splinter groups; people sympathetic to it but not part of it are
      called 'rationalist-adjacent'.
    example: >-
      Half the alignment team came up through the rationalist community, and it shows in how they
      argue.
origin: >-
  Grew from the blogs Overcoming Bias (2006) and [[lesswrong|LessWrong]] (2009), whose members had
  adopted 'rationalist' as a self-description by about 2010. The Center for Applied Rationality
  (founded 2012) ran workshops, and Slate Star Codex (2013–2020) widened the readership. The AI boom
  of the 2020s brought the community's ideas, and its disputes with
  [[effective-accelerationism|accelerationists]], into mainstream coverage.
note: >-
  Not to be confused with rationalism in philosophy (Descartes, Spinoza, Leibniz), the view that
  reason rather than sense experience is the chief source of knowledge.
