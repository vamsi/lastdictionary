term: Robin Hanson
id: robin-hanson
sort_as: Hanson Robin
pos: prop. n.
domain: people
domains:
  - asi
  - society
level: specialist
dates: b. 1959
plain: >-
  An American economist who debated Eliezer Yudkowsky about whether AI would take off suddenly or
  gradually, and who imagined an economy run by digital copies of human minds.
senses:
  - definition: >-
      American economist at George Mason University and a contrarian voice in debates about AI's
      future. Before graduate study in economics he worked on machine learning at Lockheed and at
      NASA's Ames Research Center (1984–1993). He pioneered prediction markets and proposed
      futarchy, government guided by betting markets (2000). On the blog Overcoming Bias, which he
      started in 2006 and initially shared with [[eliezer-yudkowsky|Eliezer Yudkowsky]], the two
      held the 2008 [[foom|FOOM]] debate: Yudkowsky argued that a single AI could rapidly improve
      itself to dominance, while Hanson expected a gradual, economy-wide transition among many
      competing systems (see [[slow-takeoff|slow takeoff]], [[multipolar-scenario|multipolar
      scenario]]). His book 'The Age of Em' (2016) analyzed a future economy run by
      [[whole-brain-emulation|brain emulations]], and his earlier modeling of history as a sequence
      of ever-faster growth modes anticipated work on [[explosive-growth|explosive growth]]. He also
      proposed the Great Filter (1996) as an explanation for the absence of visible alien
      civilizations.
see_also:
