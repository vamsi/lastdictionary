level: specialist
dates: 1915–1990
plain: >-
  An American psychologist who envisioned people and computers working in close partnership, and
  whose US government funding built early AI research and the precursor of the internet.
senses:
  - definition: >-
      American psychologist and computer scientist whose 1960 essay on human–computer partnership,
      and whose funding decisions at the Pentagon's research agency, set the course of interactive
      computing, early AI research and the network that became the internet. In 'Man-Computer
      Symbiosis' (1960) he argued that, for the decades before machines could think on their own,
      the most productive arrangement would be close, real-time cooperation in which people set
      goals and judge results while computers do routine work, an early statement of
      [[intelligence-augmentation|intelligence augmentation]]. As the first director of the
      Information Processing Techniques Office of the US Advanced Research Projects Agency (ARPA)
      from 1962, he funded time-sharing and large, open-ended research programs at MIT (Project MAC,
      which housed the AI group of [[marvin-minsky|Marvin Minsky]]), Stanford and the Carnegie
      Institute of Technology (later Carnegie Mellon) that sustained American AI research for a
      decade, and his memos on an 'intergalactic computer network' anticipated the ARPANET. He later
      directed Project MAC (1968–1970) and returned to ARPA in 1974–75.
