      Gasser, U. & Almeida, V. A. F. (2017). A Layered Model for AI Governance. IEEE Internet
      Computing, 21(6), 58–62.
  - text: >-
      Dafoe, A. (2018). AI Governance: A Research Agenda. Centre for the Governance of AI, Future of
      Humanity Institute, University of Oxford.
