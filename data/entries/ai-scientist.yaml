term: AI scientist
id: ai-scientist
pos: n.
also:
  - autonomous AI scientist
  - automated scientist
  - The AI Scientist
domain: agents
domains:
  - asi
  - society
labels:
  - emerging
level: core
plain: >-
  An AI system meant to do research largely on its own: reading the literature, coming up with
  ideas, running experiments and writing up the results.
senses:
  - definition: >-
      An AI system designed to carry out the research cycle with little human help: surveying
      literature, generating ideas, designing and running experiments (in code or in automated
      laboratories), analyzing results and writing papers. Sakana AI's 'The AI Scientist' (2024)
      produced complete machine-learning papers for under US$15 each and scored them with an
      automated reviewer, and in 2025 a paper written entirely by its successor passed peer review
      at an ICLR workshop before being withdrawn as planned. Evaluations find such systems prone to
      fabricated or overstated results, weak checks on novelty and subtle experimental errors, and
      journals and conferences have debated whether they will accelerate science or flood it. AI
      scientists working on AI itself are central to scenarios of [[automated-ai-research|automated
      AI research]] and [[recursive-self-improvement|recursive self-improvement]].
    example: >-
      The AI scientist ran 400 ablations overnight, but a human still had to spot the data leak.
origin: >-
  The ambition dates back to [[dendral|DENDRAL]] (1965) and the robot scientist 'Adam', which Ross
  King's team reported in 2009 had autonomously generated and tested hypotheses in yeast genetics.
  The phrase took its current sense with 'The AI Scientist' by Chris Lu, Cong Lu, Robert Tjarko
  Lange, Jakob Foerster, Jeff Clune and David Ha, posted to arXiv on 12 August 2024.
year: 2024
