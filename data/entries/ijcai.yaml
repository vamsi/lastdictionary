term: IJCAI
id: ijcai
pos: prop. n.
also:
  - International Joint Conference on Artificial Intelligence
  - IJCAI Organization
pronunciation: IJ-kye
domain: orgs
domains:
  - sym
  - hist
level: specialist
plain: >-
  A worldwide conference spanning all branches of artificial intelligence, first held in 1969,
  before any of today's other leading AI meetings. It also presents some of the field's best-known
  awards.
senses:
  - definition: >-
      The International Joint Conference on Artificial Intelligence, a general AI meeting whose
      program spans [[knowledge-representation|knowledge representation]], reasoning, planning,
      search, constraint satisfaction, multi-agent systems, machine learning and applications;
      dating from 1969, it predates every other major AI conference. After decades as a biennial
      event it has met every year since 2016, sometimes jointly with regional meetings such as the
      European Conference on AI. The nonprofit that runs it gives the Computers and Thought Award to
      researchers under 35 (first awarded in 1971, to Terry Winograd) and the IJCAI Award for
      Research Excellence (first awarded in 1985, to John McCarthy). Its early meetings were
      landmark venues for [[symbolic-ai|symbolic AI]]: work on [[shakey-the-robot|Shakey the robot]]
      was presented at the first conference in 1969 and the STRIPS planner in 1971.
origin: >-
  First held in May 1969 in Washington, D.C.; 'Joint' reflected co-sponsorship by several computing
  and AI societies at a time when no single AI society existed. The conferences are governed by
  IJCAI, Inc., a nonprofit corporation.
year: 1969
see_also:
