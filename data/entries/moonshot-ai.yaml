plain: >-
  A Beijing artificial intelligence company, founded in 2023, that makes the Kimi chatbot and very
  large models that anyone can download.
senses:
  - definition: >-
      The Beijing company behind the Kimi assistant and the Kimi [[large-language-model|language
      models]], counted in press coverage among the 'AI tigers', the handful of Chinese start-ups
      that rose to prominence as model developers after ChatGPT. Kimi launched in October 2023 with
      an unusually long [[context-window|context window]] — about 200,000 Chinese characters,
      extended to two million in 2024 — which made reading long documents its early selling point.
      Kimi K1.5 (January 2025) was a [[reasoning-model|reasoning model]] trained with
      [[reinforcement-learning|reinforcement learning]], and Kimi K2 (July 2025) was a
      [[mixture-of-experts|mixture of experts]] model with one trillion total and 32 billion active
      parameters, released as [[open-weight-model|open weights]] and noted for agentic
      [[tool-use|tool use]] and for stable training with a variant of the [[muon|Muon]] optimizer.
      Successors include K2 Thinking (November 2025), K2.5 (January 2026) and K3 (July 2026).
      Alibaba and Tencent are among its investors.
origin: >-
  Founded in March 2023 in Beijing by Yang Zhilin, a Tsinghua University and Carnegie Mellon
  graduate who co-authored the Transformer-XL and XLNet papers, with fellow Tsinghua alumni Zhou
  Xinyu and Wu Yuxin. Its Chinese name, Yuezhi Anmian, means 'the dark side of the moon'.
year: 2023
