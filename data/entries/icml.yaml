term: ICML
id: icml
pos: prop. n.
also:
  - International Conference on Machine Learning
domain: orgs
domains:
  - ml
level: core
plain: >-
  A leading machine learning conference, first held as a workshop in 1980, where researchers gather
  each summer to present new learning methods and theory.
senses:
  - definition: >-
      The International Conference on Machine Learning, a yearly summer meeting whose program spans
      learning theory, optimization, probabilistic methods, [[reinforcement-learning|reinforcement
      learning]], [[deep-learning|deep learning]] and applications. Papers are reviewed on
      [[openreview|OpenReview]] and published in the Proceedings of Machine Learning Research, and
      the conference is ranked with the younger [[neurips|NeurIPS]] and [[iclr|ICLR]] at the top of
      general [[machine-learning|machine learning]] venues. Influential ICML papers include
      [[batch-normalization|batch normalization]] and trust region policy optimization (both 2015)
      and [[clip|CLIP]] (2021). ICML 2023 adopted one of the first conference policies restricting
      text generated by [[large-language-model|language models]] in submitted papers, and it
      presents an annual Test of Time award.
    example: The paper was rejected from NeurIPS, revised and accepted at ICML.
origin: >-
  Began as a machine learning workshop at Carnegie Mellon University in Pittsburgh in 1980,
  organized by Ryszard Michalski, Jaime Carbonell and Tom Mitchell; after further workshops in the
  1980s it became an annual conference. It is governed by the International Machine Learning Society
  (IMLS).
year: 1980
note: >-
  Easily confused with [[iclr|ICLR]], a younger conference (2013) centered on deep learning.
