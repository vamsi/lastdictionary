term: Future of Life Institute
id: future-of-life-institute
pos: prop. n.
also:
  - FLI
domain: orgs
domains:
  - safety
  - gov
level: core
plain: >-
  An advocacy group that warns about the dangers of advanced AI and other powerful technologies,
  funds research and lobbies governments. It organized the 2023 open letter calling for a pause on
  giant AI experiments.
senses:
  - definition: >-
      A nonprofit that seeks to lower the chance that advanced AI, or another powerful technology,
      causes a global catastrophe. It convened the 2015 Puerto Rico conference, whose open letter on
      research priorities for beneficial AI drew thousands of signatures, made some of the first
      grants for AI safety research, and hosted the 2017 Beneficial AI conference that produced the
      [[asilomar-ai-principles|Asilomar AI Principles]]. It campaigns against lethal autonomous
      weapons, including through the 2017 film Slaughterbots; published the March 2023
      [[pause-giant-ai-experiments|Pause Giant AI Experiments]] letter; grades AI companies in an AI
      Safety Index; and in October 2025 issued the [[statement-on-superintelligence|Statement on
      Superintelligence]], calling for a prohibition on developing
      [[superintelligence|superintelligence]] until there is broad scientific consensus that it can
      be done safely and controllably, and strong public support. It lobbies in Brussels and
      Washington.
origin: >-
  Founded in March 2014 in the Boston area by physicist [[max-tegmark|Max Tegmark]], Skype
  co-founder Jaan Tallinn, cosmologist Anthony Aguirre, Viktoriya Krakovna and Meia Chita-Tegmark.
  Elon Musk gave $10 million for its 2015 research program, and a 2021 cryptocurrency donation from
  Vitalik Buterin greatly enlarged its endowment.
year: 2014
note: >-
  Not to be confused with the [[future-of-humanity-institute|Future of Humanity Institute]] at
  Oxford, which closed in 2024.
