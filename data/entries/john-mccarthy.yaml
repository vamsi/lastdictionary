dates: 1927–2011
plain: >-
  The American computer scientist who coined the term 'artificial intelligence', invented the Lisp
  programming language and championed formal logic as the route to machine common sense.
senses:
  - definition: >-
      American computer scientist who coined the term [[artificial-intelligence|artificial
      intelligence]] in the 1955 proposal, written with [[marvin-minsky|Marvin Minsky]], Nathaniel
      Rochester and [[claude-shannon|Claude Shannon]], for the 1956 [[dartmouth-workshop|Dartmouth
      workshop]]. In 1958 he created [[lisp|Lisp]], which introduced garbage collection and was the
      main language of AI research for three decades. He co-founded the MIT AI Project with Minsky,
      then moved to Stanford in 1962 and founded what became the Stanford Artificial Intelligence
      Laboratory (SAIL). His paper 'Programs with Common Sense' (1958) proposed an Advice Taker that
      reasons in formal logic, launching the logicist tradition in
      [[knowledge-representation|knowledge representation]]; he developed the situation calculus,
      identified the [[frame-problem|frame problem]] with Patrick Hayes (1969), and proposed
      circumscription for [[non-monotonic-reasoning|non-monotonic reasoning]] (1980). He was also an
      early advocate of computer time-sharing. [[turing-award|Turing Award]] 1971; Kyoto Prize 1988;
      US National Medal of Science 1990.
