# yaml-language-server: $schema=../schema/entry.schema.json

term: anthropomorphism
id: anthropomorphism
pos: n.
also:
  - anthropomorphize
  - anthropomorphise
  - anthropomorphization
  - anthropomorphic AI
  - anthropodenial
domain: mind
domains:
  - society
  - culture
level: essential
plain: >-
  Treating something that isn't human — a pet, a car, a chatbot — as if it had human thoughts,
  feelings or intentions. AI that talks fluently makes this temptation unusually strong.
senses:
  - definition: >-
      The perception, description or design of animals, objects, natural forces or machines as
      having humanlike minds, feelings, intentions or personalities. With AI it takes two forms:
      users perceiving minds in systems that converse fluently, remember them and speak in the first
      person, which the [[eliza-effect|ELIZA effect]] showed even simple programs can trigger; and
      designers building humanlike traits — names, voices, personas, expressions of feeling — into
      products such as [[chatbot|chatbots]] and [[ai-companion|AI companions]]. Psychologists
      explain it by people's readiness to apply social cognition and [[theory-of-mind|theory of
      mind]] to anything that behaves contingently, especially when lonely or seeking to make sense
      of a system. Researchers debate whether anthropomorphic language about AI is harmless
      shorthand, a useful [[intentional-stance|intentional stance]] or a source of overtrust,
      emotional dependence and manipulation, and whether flatly denying any mind can be the opposite
      error, which Frans de Waal called anthropodenial.
    example: >-
      Saying the model 'wants' to finish the task is convenient anthropomorphism, not a finding.
origin: >-
  From Greek anthropos, 'human', and morphe, 'form'. First recorded in English in 1753, for
  ascribing human form or qualities to God, a practice Xenophanes mocked around 500 BCE. Fritz
  Heider and Marianne Simmel's 1944 film of moving triangles and a circle showed how readily people
  see intentions in simple motion.
note: >-
  Murray Shanahan and others urge avoiding mentalistic verbs for language models; others argue that
  words like 'believes' can be given functional meanings. The word is pejorative only when the
  attribution is mistaken, and whether it is mistaken for current AI is part of the debate.
see_also:
  - ELIZA effect
  - intentional stance
  - AI companion
  - parasocial relationship
  - theory of mind
  - AI psychosis
  - hallucination
contrast:
  - intentional stance
sources:
  - text: >-
      Epley, N., Waytz, A. & Cacioppo, J. T. (2007). On Seeing Human: A Three-Factor Theory of
      Anthropomorphism. Psychological Review 114(4), 864–886.
  - text: >-
      Shanahan, M. (2024). Talking about Large Language Models. Communications of the ACM 67(2),
      68–79.
