plain: >-
  OpenAI's first reasoning model, from 2024. Before replying it writes out a long, hidden series of
  steps, trying ideas and checking them, which lifted its scores on hard math, science and coding
  problems far above earlier chatbots'.
senses:
  - definition: >-
      The first of [[openai|OpenAI]]'s o-series [[reasoning-model|reasoning models]], previewed on
      12 September 2024 as o1-preview and o1-mini and released in full on 5 December 2024.
      Large-scale [[reinforcement-learning|reinforcement learning]] taught it to work through an
      extended hidden [[chain-of-thought|chain of thought]] before giving an answer — trying
      approaches, checking its work and backtracking — and its accuracy on hard problems climbed as
      it was allowed more [[test-time-compute|test-time compute]] for thinking, opening a second
      axis for scaling besides training compute. In OpenAI's figures, o1 solved 83 percent of the
      2024 American Invitational Mathematics Examination problems when many samples were combined by
      majority vote, where [[gpt-4o|GPT-4o]] managed about 12 percent, and it outscored PhD-level
      experts on the GPQA science benchmark. OpenAI hid the raw reasoning and showed only summaries,
      citing competition and safety monitoring. Rival laboratories released their own reasoning
      models within months.
    example: >-
      We send only the hardest tickets to o1, because its thinking tokens make it slow and expensive.
origin: >-
  Announced in OpenAI's post 'Learning to Reason with LLMs'. During development the work was
  reported under the code name Strawberry, which press reports linked to an earlier OpenAI project
  known as [[q-term|Q*]] (late 2023). OpenAI restarted its numbering at 1 to signal a new kind of
  model.
year: 2024
note: >-
  Its successor, [[openai-o3|OpenAI o3]], was announced three months later, and the o-series was
  folded into [[gpt-5|GPT-5]] in August 2025. [[deepseek-r1|DeepSeek-R1]] (January 2025) showed that
  similar behavior could be trained and published openly.
