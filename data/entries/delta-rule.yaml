term: delta rule
id: delta-rule
pos: n.
also:
  - Widrow–Hoff rule
  - least mean squares rule
  - LMS algorithm
  - generalized delta rule
domain: ml
domains:
  - hist
  - dl
level: specialist
plain: >-
  A simple learning rule for one artificial neuron: adjust each connection in proportion to the
  error, the gap between the wanted and the actual output, times that connection's input.
senses:
  - definition: >-
      A learning rule that updates each weight of a linear unit in proportion to the error δ, the
      difference between the target and the unit's output, multiplied by the corresponding input and
      a [[learning-rate|learning rate]]. It is [[stochastic-gradient-descent|stochastic gradient
      descent]] on the squared error of a single linear unit, so with a small enough learning rate
      it converges toward the least-squares solution. Unlike the [[perceptron|perceptron]] rule,
      which uses the thresholded output and changes weights only after a misclassification, the
      delta rule uses the continuous output and keeps adjusting until the error is minimized. It
      trained [[adaline|ADALINE]] and, as the least-mean-squares (LMS) algorithm, became a workhorse
      of adaptive signal processing in echo cancellers and channel equalizers. Its extension to
      multilayer networks with differentiable activations, which passes δ terms backward through the
      layers, was called the generalized delta rule and is [[backpropagation|backpropagation]].
    example: >-
      Under the delta rule, the weight on an input that was strongly active during a large error
      moves the most.
formula_latex: \Delta w_i = \eta\,(t - y)\,x_i
origin: >-
  Introduced by Bernard Widrow and his student Marcian (Ted) Hoff at Stanford in 1960 as the
  least-mean-squares rule for training ADALINE. The name 'delta rule' became standard through the
  parallel distributed processing work of the 1980s, in which David Rumelhart, Geoffrey Hinton and
  Ronald Williams (1986) called backpropagation the 'generalized delta rule'; psychology's
  Rescorla–Wagner model of conditioning (1972) uses the same error-driven update.
year: 1960
note: >-
  Often conflated with the perceptron learning rule, which has the same form but uses the
  thresholded output and therefore behaves differently when the data are not linearly separable.
see_also:
  - ADALINE
