term: Jürgen Schmidhuber
id: jurgen-schmidhuber
sort_as: Schmidhuber Jürgen
pos: prop. n.
also:
  - Juergen Schmidhuber
pronunciation: YUR-gen SHMEED-hoo-ber
domain: people
domains:
  - dl
  - hist
level: core
dates: b. 1963
plain: >-
  A German computer scientist who co-invented the LSTM, a neural network with memory that powered
  much of speech recognition and translation in the 2010s, and who argues that early pioneers go
  under-credited.
senses:
  - definition: >-
      German computer scientist whose most influential contribution is [[long-short-term-memory|long
      short-term memory]] (LSTM, 1997), introduced with his student [[sepp-hochreiter|Sepp
      Hochreiter]], a design that overcame the [[vanishing-gradient-problem|vanishing gradient
      problem]] in [[recurrent-neural-network|recurrent networks]] and powered speech recognition
      and translation until the [[transformer|transformer]]. He became scientific director of the
      Swiss AI lab IDSIA in Lugano in 1995 and in 2021 also took charge of the AI Initiative at
      Saudi Arabia's King Abdullah University of Science and Technology (KAUST). His lab also
      developed connectionist temporal classification (CTC) for speech (2006), highway networks
      (2015), a precursor of [[residual-connection|residual connections]], and fast GPU-trained
      [[convolutional-neural-network|CNNs]] that won image-recognition contests in 2011. He proposed
      forms of [[meta-learning|meta-learning]] (1987), artificial curiosity (1990), the neural
      history compressor (1991) and the self-improving [[godel-machine|Gödel machine]] (2003). He
      argues that celebrated later work, including [[generative-adversarial-network|GANs]] and
      linear [[attention|attention]], rediscovered his group's ideas, and has disputed the credit
      given to the 2018 [[turing-award|Turing Award]] laureates.
