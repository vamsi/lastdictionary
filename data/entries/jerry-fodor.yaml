dates: 1935–2017
plain: >-
  An American philosopher who argued that thinking is computation in an inner 'language of thought',
  and that neural networks cannot explain the structured nature of thought.
senses:
  - definition: >-
      American philosopher and cognitive scientist at MIT and later Rutgers University, the most
      influential defender of the [[computational-theory-of-mind|computational theory of mind]] in
      its classical, symbolic form. In 'The Language of Thought' (1975) he argued that thinking is
      computation over mental representations with a language-like syntax and compositional meaning
      (the [[language-of-thought-hypothesis|language of thought hypothesis]]), and his 1974 essay on
      the special sciences made [[multiple-realizability|multiple realizability]] a pillar of
      [[functionalism|functionalism]]. 'The Modularity of Mind' (1983) distinguished fast,
      encapsulated input modules from central reasoning, which he argued is holistic and therefore
      beset by the [[frame-problem|frame problem]]. With Zenon Pylyshyn he argued in 1988 that
      [[connectionism|connectionist]] networks cannot explain the [[systematicity|systematicity]] of
      thought — anyone who can think that John loves Mary can think that Mary loves John — unless
      they implement a symbolic architecture; the argument remains central to debates over whether
      [[neural-network|neural networks]], including [[large-language-model|large language models]],
      generalize compositionally.
