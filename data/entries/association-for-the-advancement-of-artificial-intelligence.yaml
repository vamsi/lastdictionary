term: Association for the Advancement of Artificial Intelligence
id: association-for-the-advancement-of-artificial-intelligence
pos: prop. n.
also:
  - AAAI
  - American Association for Artificial Intelligence
  - AAAI Conference on Artificial Intelligence
pronunciation: TRIP-ul ay EYE (for AAAI)
domain: orgs
domains:
  - hist
level: specialist
plain: >-
  A major professional society for artificial intelligence researchers, founded in the United States
  in 1979, which runs a large yearly AI conference, publishes a magazine and honors leading
  scientists.
senses:
  - definition: >-
      A scientific and professional society for artificial intelligence, US-based but international
      in membership, that serves the field through conferences, publications, honors and studies of
      AI's direction. It organizes the annual AAAI Conference on Artificial Intelligence —
      historically strongest in [[symbolic-ai|symbolic]] reasoning, planning,
      [[knowledge-representation|knowledge representation]] and multi-agent systems, now covering
      all of AI — together with the Innovative Applications of AI conference and spring and fall
      symposia. It publishes AI Magazine, elects AAAI Fellows and co-sponsors, with the ACM, the
      conference on AI, Ethics, and Society. It has periodically convened studies of the field's
      direction, including a 2008–2009 presidential panel on long-term AI futures that met at
      Asilomar and a 2025 presidential panel report on the future of AI research.
origin: >-
  Founded in 1979 as the American Association for Artificial Intelligence, with Allen Newell as its
  first president; its first national conference was held at Stanford University in August 1980. It
  adopted its present name in 2007 to reflect a membership drawn from around the world.
year: 1979
