      Silver, D. et al. (2017). Mastering the game of Go without human knowledge. Nature 550,
      354–359.
  - text: >-
      Samuel, A. L. (1959). Some Studies in Machine Learning Using the Game of Checkers. IBM Journal
      of Research and Development 3(3), 210–229.
  - text: >-
      Heinrich, J., Lanctot, M. & Silver, D. (2015). Fictitious Self-Play in Extensive-Form Games.
