term: effective accelerationism
id: effective-accelerationism
pos: n.
also:
  - e/acc
  - eacc
  - accelerationist
domain: culture
domains:
  - society
  - asi
labels:
  - contested
level: core
plain: >-
  An online movement, known as e/acc, that wants AI and other technology developed as fast as
  possible, arguing that progress is good and that safety-driven regulation does more harm than
  good.
senses:
  - definition: >-
      A techno-optimist ideology, abbreviated e/acc, that advocates accelerating technological
      development — above all AI — with minimal regulatory restraint. Its founding texts framed
      growth in thermodynamic terms: civilization, like life, is a process that captures and
      dissipates free energy, so maximizing technological and economic expansion aligns with a
      tendency of the universe itself. In practice e/acc functions as a counter-movement to
      AI-safety advocacy and to [[effective-altruism|effective altruism]], whose name it parodies.
      Adherents oppose licensing regimes, compute thresholds and [[ai-pause|pauses]], favor
      [[open-source-ai|open-source]] development and market competition, and label opponents
      [[doomer|doomers]] or [[decel|decels]]. Critics see a meme-driven rationale for industry
      interests that is indifferent to concrete harms; supporters present it as optimism about
      abundance.
    example: >-
      Half the founders in the room had e/acc in their bios, and none of them wanted to talk about
      licensing.
origin: >-
  Emerged on Twitter in 2022 among pseudonymous accounts; the earliest known reference is a May 2022
  newsletter by four of them, including 'Beff Jezos' (identified by Forbes in December 2023 as the
  physicist Guillaume Verdon) and 'bayeslord', whose 'Notes on e/acc principles and tenets' (10 July
  2022) set out its creed. Its name combines effective altruism with Nick Land's philosophical
  accelerationism. Marc Andreessen's October 2023 'Techno-Optimist Manifesto', widely read as an
  e/acc text, broadened its reach.
year: 2022
note: >-
  Distinct from Nick Land's accelerationism, which concerned capitalism's dissolution of human
  institutions, and from [[differential-technological-development|d/acc]], Vitalik Buterin's
  'defensive accelerationism' (2023), which favors technologies that strengthen defense and
  decentralization.
