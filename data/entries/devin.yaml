term: Devin
id: devin
pos: prop. n.
also:
  - Devin AI
domain: agents
domains:
  - eng
  - hist
labels:
  - trademark
level: specialist
plain: >-
  A commercial AI 'software engineer' from the startup Cognition, unveiled in 2024, that takes on
  programming tasks in its own cloud workspace, complete with a web browser, a code editor and a
  command line.
senses:
  - definition: >-
      An autonomous [[coding-agent|coding agent]] product from the startup Cognition that works on
      software tasks inside an isolated cloud machine equipped with a browser, an editor and a
      terminal, planning and executing multi-step work, reporting progress through a chat interface
      and delivering changes as pull requests. Its launch announcement, which billed it as 'the
      first AI software engineer', reported resolving 13.86% of a random 25% subset of
      [[swe-bench|SWE-bench]] issues unassisted, against 1.96% for the previous best system, and
      helped make autonomous coding agents a mainstream idea. Critics argued that some
      demonstrations overstated its abilities, and Devin became a reference point in debates about
      AI replacing programmers.
    example: >-
      We trialed Devin on dependency upgrades, where its pull requests needed only light review.
origin: >-
  Announced by Cognition, led by chief executive Scott Wu, on 12 March 2024; it became generally
  available to paying teams in December 2024.
year: 2024
note: >-
  A product name, not a generic term, though it is sometimes used as shorthand for fully autonomous
  coding agents.
