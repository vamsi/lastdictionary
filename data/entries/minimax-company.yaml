plain: >-
  A Shanghai artificial intelligence company, founded in 2021, that makes AI companion apps, the
  Hailuo video generator and large language models, several released openly.
senses:
  - definition: >-
      A Shanghai company whose products range from [[large-language-model|large language models]]
      and speech, music and video generators to consumer chat apps, and which press coverage counts
      among China's 'AI tigers'. Its Talkie and Xingye character-chat apps made it a major
      [[ai-companion|AI companion]] provider, including outside China, and its Hailuo AI platform
      drew international users for [[text-to-video-model|video generation]]; in September 2025
      Disney, Universal and Warner Bros. Discovery sued it in the United States, alleging that
      Hailuo generated their copyrighted characters. Its MiniMax-01 models (January 2025) combined
      linear 'lightning' attention with standard [[attention|attention]] layers to handle very long
      contexts, and its later M-series models, several released as [[open-weight-model|open
      weights]], target reasoning, coding and agent tasks.
origin: >-
  Founded in December 2021 in Shanghai by former researchers from the computer-vision company
  SenseTime, with Yan Junjie as chief executive; Alibaba and Tencent are among its investors. Its
  shares began trading in Hong Kong on 9 January 2026, a day after those of [[zhipu-ai|Zhipu AI]].
year: 2021
note: >-
  Not to be confused with [[minimax|minimax]], the decision rule for two-player games.
