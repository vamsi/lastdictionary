level: specialist
plain: >-
  An Anthropic program, launched in 2026, that gave a hacking-capable AI model only to organizations
  defending important software instead of releasing it to everyone.
senses:
  - definition: >-
      An industry initiative led by [[anthropic|Anthropic]] that gives restricted access to Claude
      Mythos Preview — a model the company judged too capable at finding and exploiting software
      vulnerabilities for general release — to organizations that maintain critical software, so
      they can find and fix flaws before attackers do. Launch partners included Amazon Web Services,
      Apple, Broadcom, Cisco, CrowdStrike, Google, JPMorganChase, the Linux Foundation, Microsoft,
      Nvidia and Palo Alto Networks, and access was extended to more than 40 further organizations.
      Anthropic committed up to US$100 million in usage credits and US$4 million in donations to
      open-source security groups, and reported that the model had already turned up thousands of
      serious vulnerabilities, affecting every major operating system and web browser. It is a
      prominent example of defender-first [[staged-deployment|staged deployment]] of a model with
      dangerous capabilities.
    example: >-
      Our maintainers got Mythos access through Project Glasswing and patched three decades-old
      parser bugs.
origin: >-
  Announced by Anthropic on 7 April 2026 together with Claude Mythos Preview. Access to Anthropic's
  later models Claude Fable 5 and Claude Mythos 5 was suspended from 12 June 2026 under a US
  government [[export-control-directive|export control directive]] that was lifted at the end of
  that month.
year: 2026
note: >-
  Capability figures are Anthropic's own and were not independently verified at launch.
