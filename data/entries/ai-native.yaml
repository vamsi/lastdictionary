term: AI-native
id: ai-native
pos: adj.
also:
  - AI-first
domain: culture
domains:
  - eng
  - society
labels:
  - informal
level: core
plain: >-
  Describes a product, company or person built around AI from the start, rather than one that added
  AI features to older ways of working.
senses:
  - definition: >-
      Designed from the outset around AI capabilities rather than retrofitted with them. Of
      products, the term implies that core workflows assume a model in the loop — natural-language
      interfaces, generated rather than hand-built content, [[ai-agent|agents]] carrying out tasks —
      so that removing the AI would leave little; of companies, it implies small teams, pervasive
      internal use of AI tools and organization around automation; of people, by analogy with
      'digital native', it denotes those who learned their trade with AI assistants as a default.
      Like 'cloud-native' and 'mobile-first', it is partly descriptive and partly a marketing and
      investment label, used to distinguish new entrants from incumbents and from a mere
      [[wrapper|wrapper]] or bolt-on feature.
    example: An AI-native support team of four now handles what used to take forty.
origin: >-
  Modeled on 'digital native' (popularized by Marc Prensky in 2001) and 'cloud-native'. The phrase
  appeared in telecommunications and enterprise-software marketing by about 2020 — 'AI-native'
  network designs were proposed for 6G mobile systems — and became ubiquitous in startup and
  investor language after ChatGPT's release in 2022.
