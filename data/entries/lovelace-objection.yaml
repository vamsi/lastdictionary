term: Lovelace objection
id: lovelace-objection
pos: n.
also:
  - Lady Lovelace's objection
  - Lovelace test
domain: mind
domains:
  - hist
  - gen
level: specialist
plain: >-
  The argument, traced to Ada Lovelace in 1843, that computers cannot be truly creative because they
  can only do what they have been programmed to do.
senses:
  - definition: >-
      The objection to machine intelligence that a computer cannot originate anything — cannot
      create, surprise its makers or learn anything genuinely new — because it can only do what its
      programmers have instructed. Alan Turing named it after [[ada-lovelace|Ada Lovelace]] and
      replied that machines often surprise their makers and that a learning machine's behavior is
      not fixed in advance by its programmer. The objection survives in debates over whether
      [[generative-ai|generative models]] are creative or merely recombine their
      [[training-data|training data]], and it inspired the Lovelace test proposed by Selmer
      Bringsjord, Paul Bello and David Ferrucci (2001), which a system passes only if it produces an
      artifact that its designers cannot explain from their knowledge of the system.
origin: >-
  From Ada Lovelace's Note G (1843) to her translation of Luigi Menabrea's paper on Charles
  Babbage's Analytical Engine, which says the Engine 'has no pretensions whatever to originate
  anything'. Alan Turing named and answered 'Lady Lovelace's Objection' in
  [[computing-machinery-and-intelligence|Computing Machinery and Intelligence]] (1950).
year: 1950
see_also:
  - Ada Lovelace
  - Computing Machinery and Intelligence
  - Turing test
  - Lucas–Penrose argument
  - Polanyi's paradox
sources:
  - text: >-
      Lovelace, A. A. (1843). Notes by the Translator, appended to L. F. Menabrea, Sketch of the
      Analytical Engine Invented by Charles Babbage. Scientific Memoirs 3, 666–731.
  - text: >-
