# yaml-language-server: $schema=../schema/entry.schema.json

term: illusionism
id: illusionism
pos: n.
also:
  - illusionist
  - illusionism about consciousness
domain: mind
labels:
  - contested
level: specialist
plain: >-
  The view that the inner glow of experience that seems so hard to explain is a kind of trick the
  brain plays on itself: we are conscious, but not in the mysterious way it seems.
senses:
  - definition: >-
      The position that [[phenomenal-consciousness|phenomenal consciousness]], understood as a realm
      of private, ineffable qualitative properties, does not exist, and that the task of a theory of
      consciousness is to explain why it seems to exist: why brains represent their own states as
      having such properties, and why we find the [[hard-problem-of-consciousness|hard problem]]
      compelling. Illusionists do not deny that people have experiences in a functional sense or
      that pain matters; they deny that experience has the extra properties that would make it
      inexplicable. Proponents include Keith Frankish, Daniel Dennett and Nicholas Humphrey, and
      [[attention-schema-theory|attention schema theory]] is often classed with them. For AI,
      illusionism implies that a machine representing its own processing in the right introspective
      way would be conscious in the only sense there is, turning [[machine-consciousness|machine
      consciousness]] into an engineering question.
origin: >-
  Keith Frankish's 'Illusionism as a Theory of Consciousness' (Journal of Consciousness Studies,
  2016), the target paper of a special issue, established the label, continuing Daniel Dennett's
  earlier attacks on [[qualia|qualia]] in 'Quining Qualia' (1988) and Consciousness Explained
  (1991).
year: 2016
note: >-
  Not the claim that consciousness as a whole is an illusion, which illusionists usually reject as
  self-undermining: the illusion concerns the apparent character of experience, not its existence.
  Closely related to eliminative materialism.
see_also:
  - hard problem of consciousness
  - qualia
  - attention schema theory
  - phenomenal consciousness
  - introspection
  - functionalism
contrast:
  - panpsychism
sources:
  - text: >-
      Frankish, K. (2016). Illusionism as a Theory of Consciousness. Journal of Consciousness
      Studies 23(11–12), 11–39.
