plain: >-
  Mira Murati's AI company, which she started in San Francisco in 2025 after serving as OpenAI's
  technology chief. It makes tools for customizing AI models and releases some models openly.
senses:
  - definition: >-
      An American AI start-up that builds tools for adapting existing models to particular uses and,
      unlike most [[frontier-lab|frontier labs]], has promised to publish much of its research. Its
      first product, Tinker (October 2025), is a programming interface that lets researchers
      [[fine-tuning|fine-tune]] [[open-weight-model|open-weight models]], including with
      [[low-rank-adaptation|low-rank adaptation]], while the company runs the distributed training.
      Its Connectionism blog has published work on making language-model inference deterministic and
      on when LoRA matches full fine-tuning. In 2026 it released its first open-weight model,
      Inkling. The lab drew attention for raising one of the largest seed rounds on record and for
      losing several co-founders to Meta and OpenAI within its first year.
origin: >-
  Founded in February 2025 in San Francisco by Mira Murati, OpenAI's former chief technology
  officer, with a founding team that included John Schulman, Barret Zoph, Lilian Weng, Andrew
  Tulloch and Luke Metz. Tulloch left for Meta in late 2025, and Zoph and Metz returned to OpenAI in
  January 2026. It shares its name with Thinking Machines Corporation, a 1980s maker of parallel
  supercomputers.
