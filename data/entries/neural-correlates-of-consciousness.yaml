# yaml-language-server: $schema=../schema/entry.schema.json

term: neural correlates of consciousness
id: neural-correlates-of-consciousness
pos: n.
also:
  - NCC
  - neural correlate of consciousness
  - content-specific NCC
domain: mind
level: specialist
plain: >-
  The particular brain activity that reliably goes with a conscious experience — the minimum the
  brain must be doing for you to see, hear or feel something.
senses:
  - definition: >-
      Brain activity that systematically accompanies conscious experience; more strictly, following
      Christof Koch and others, the smallest set of neural events that would on its own be enough to
      produce a given experience (content-specific correlates) or to make the subject conscious at
      all (full or state correlates). Researchers seek them by contrasting conditions in which
      stimulation is held constant while experience differs — binocular rivalry, visual masking,
      blindsight, anesthesia, sleep — and asking which brain activity tracks the difference, while
      separating the correlates from mere prerequisites and consequences such as attention and
      report. Candidates include a posterior cortical 'hot zone' and fronto-parietal networks, a
      dispute central to testing [[integrated-information-theory|integrated information theory]]
      against [[global-workspace-theory|global workspace theory]]. Correlates do not by themselves
      explain why any activity is conscious, and they do not transfer directly to AI systems, which
      lack neurons — one reason for the turn to functional
      [[indicator-properties-of-consciousness|indicator properties of consciousness]].
origin: >-
  Francis Crick and Christof Koch launched the modern search in 'Towards a Neurobiological Theory of
  Consciousness' (Seminars in the Neurosciences, 1990). The phrase, whose earliest use is not
  established, and the abbreviation NCC became standard during the 1990s, and David Chalmers
  proposed a widely used definition in 'What Is a Neural Correlate of Consciousness?' (2000).
year: 1990
see_also:
  - consciousness
  - global workspace theory
  - integrated information theory
  - recurrent processing theory
  - indicator properties of consciousness
  - machine consciousness
sources:
  - text: >-
      Crick, F. & Koch, C. (1990). Towards a Neurobiological Theory of Consciousness. Seminars in
      the Neurosciences 2, 263–275.
  - text: >-
      Chalmers, D. J. (2000). What Is a Neural Correlate of Consciousness? In T. Metzinger (ed.),
      Neural Correlates of Consciousness: Empirical and Conceptual Questions. MIT Press.
