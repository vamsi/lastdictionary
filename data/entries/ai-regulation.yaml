term: AI regulation
id: ai-regulation
pos: n.
also:
  - regulation of AI
  - AI law
  - regulate AI
  - AI legislation
domain: gov
domains:
  - society
level: essential
plain: >-
  Laws and binding government rules about artificial intelligence: what AI may be used for, what
  checks its makers must run, and what penalties apply when they break the rules.
senses:
  - definition: >-
      Legally binding rules made by public authorities that govern the development, placing on the
      market or use of [[ai-system|AI systems]] and are backed by enforcement and sanctions. Regimes
      differ along several axes: horizontal laws spanning all sectors (the [[eu-ai-act|EU AI Act]],
      South Korea's AI Basic Act) versus sector-specific rules for medicine, credit or hiring;
      [[risk-based-approach|risk-based]] tiers keyed to uses versus thresholds keyed to models, such
      as [[compute-threshold|compute thresholds]] for [[frontier-ai|frontier AI]]; ex ante duties
      such as [[conformity-assessment|conformity assessment]] versus ex post
      [[ai-liability|liability]]; and disclosure duties versus outright bans
      ([[prohibited-ai-practices|prohibited AI practices]]). Much AI regulation is also existing law
      — data protection, consumer protection, anti-discrimination, copyright — applied to AI.
    example: >-
      AI regulation in the EU is horizontal, whereas the US relies mainly on sector regulators and
      state laws.
origin: >-
  Legal scholarship on how to regulate AI took off in the mid-2010s; Matthew Scherer's 'Regulating
  Artificial Intelligence Systems' (Harvard Journal of Law & Technology, 2016) was an influential
  early analysis. China adopted binding rules on recommendation algorithms (2022), deep synthesis
  (2023) and generative AI (2023); the first comprehensive horizontal statute was the EU AI Act,
  proposed in April 2021 and adopted in 2024.
note: >-
  Narrower than [[ai-governance|AI governance]], which also covers standards, voluntary commitments
  and corporate practice. 'Regulating AI' may target models, applications, uses or the organizations
  behind them; much of the policy debate is about which target is right.
