term: Turing trap
id: turing-trap
pos: n.
also:
  - the Turing Trap
domain: society
domains:
  - asi
level: specialist
plain: >-
  The risk that by building AI mainly to imitate and replace people, rather than to extend what
  people can do, society ends up with less widely shared prosperity and weaker bargaining power for
  workers.
senses:
  - definition: >-
      Erik Brynjolfsson's term for a situation in which technologists, business leaders and
      policymakers concentrate on AI that imitates and substitutes for human labor, taking the
      human-like performance of the [[turing-test|Turing test]] as the benchmark, rather than AI
      that complements people by enabling new capabilities. He argues that substitution tends to
      depress wages and shift economic and political power from workers to the owners of technology,
      while complementation creates new tasks and spreads gains more widely; and that tax policy
      (which taxes labor more heavily than capital), managerial incentives and research benchmarks
      all tilt the field toward substitution. The prescribed escape is to redirect incentives toward
      [[augmentation|augmentation]].
    example: >-
      Benchmarking agents only against human job performance risks walking straight into the Turing
      trap.
origin: >-
  Introduced by Erik Brynjolfsson in 'The Turing Trap: The Promise & Peril of Human-Like Artificial
  Intelligence', in the Spring 2022 AI-themed issue of Dædalus, the journal of the American Academy
  of Arts and Sciences.
year: 2022
note: >-
  Critics respond that substituting and complementing technologies are hard to tell apart in
  advance, and that human-like general capability may be exactly what makes AI broadly useful.
see_also:
  - augmentation
  - automation
  - intelligence augmentation
  - Turing test
  - technological unemployment
  - concentration of power
  - human-centered AI
contrast:
  - augmentation
sources:
  - text: >-
      Brynjolfsson, E. (2022). The Turing Trap: The Promise & Peril of Human-Like Artificial
      Intelligence. Dædalus 151(2), 272–287.
