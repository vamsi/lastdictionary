plain: >-
  A 2023 song that used AI to imitate the voices of Drake and The Weeknd without their involvement;
  it went viral before being pulled, becoming a landmark case for AI voice cloning in music.
senses:
  - definition: >-
      A song released in April 2023 by an anonymous producer using the name Ghostwriter977, sung by
      AI-cloned imitations (see [[voice-cloning|voice cloning]]) of the voices of Drake and The
      Weeknd, neither of whom took part. It drew millions of views on TikTok and hundreds of
      thousands of streams before the artists' label, Universal Music Group, had it removed from
      streaming platforms. The episode became the reference case for synthetic celebrity voices in
      music: it exposed gaps in copyright, which protects recordings and compositions but not a
      voice as such, strengthened industry demands for consent and licensing in AI training, and was
      cited in debates over likeness legislation such as Tennessee's ELVIS Act (2024) and US federal
      proposals against unauthorized digital replicas.
    example: >-
      Since Heart on My Sleeve, every label contract has a clause about AI voice models.
origin: >-
  Uploaded to streaming services on 4 April 2023 and spread through TikTok in mid-April; Universal
  Music Group issued takedown notices on 17 April 2023. Ghostwriter977, whose identity remains
  unknown, released another AI-voiced track in September 2023.
year: 2023
