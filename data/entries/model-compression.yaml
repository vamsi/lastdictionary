term: model compression
id: model-compression
pos: n.
also:
  - neural network compression
  - network compression
  - compressed model
domain: infer
domains:
  - dl
  - ml
level: core
plain: >-
  The family of techniques for making AI models smaller, faster or cheaper to run while keeping
  almost all of their accuracy.
senses:
  - definition: >-
      The family of techniques that reduce a trained model's memory footprint, computation, latency
      or energy use while preserving as much of its accuracy as possible. The main approaches are
      [[quantization|quantization]] (fewer bits per number), [[pruning|pruning]] and
      [[sparsity|sparsity]] (fewer nonzero parameters or structures),
      [[knowledge-distillation|knowledge distillation]] (training a smaller student to imitate a
      larger teacher), [[low-rank-approximation|low-rank factorization]] of weight matrices, and
      [[weight-sharing|weight sharing]] or codebook schemes; efficient architecture design, as in
      mobile networks built from [[depthwise-separable-convolution|depthwise separable
      convolutions]], is sometimes counted too. The methods compose: a model may be distilled, then
      pruned, then quantized. Compression is judged by the trade-off between size or speed and task
      quality, bearing in mind that headline metrics such as [[perplexity|perplexity]] can hide
      losses in rarer abilities. It is essential for [[on-device-ai|on-device AI]] and
      [[edge-ai|edge AI]] and a major lever on [[inference-cost|inference cost]].
    example: >-
      Model compression took the speech model from 1.2 GB to 90 MB so it could ship inside the app.
origin: >-
  Named in the title of a 2006 KDD paper by Cristian Buciluǎ, Rich Caruana and Alexandru
  Niculescu-Mizil, who compressed large ensembles into small neural networks trained on the
  ensembles' outputs, a precursor of knowledge distillation. Song Han, Huizi Mao and William Dally's
  'Deep Compression' (2015; ICLR 2016) combined pruning, trained quantization and Huffman coding to
  shrink AlexNet 35-fold and VGG-16 49-fold.
year: 2006
