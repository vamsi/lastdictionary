term: recurrent processing theory
id: recurrent-processing-theory
pos: n.
also:
  - RPT
  - local recurrence theory
domain: mind
domains:
  - percep
level: specialist
plain: >-
  A theory that we consciously see something only when signals in the brain's visual areas loop back
  on themselves, not when they merely sweep forward once.
senses:
  - definition: >-
      A theory of conscious perception, developed by Victor Lamme, on which a stimulus is
      consciously experienced when it triggers recurrent processing — feedback and lateral signaling
      within and between sensory areas — rather than only the initial feedforward sweep of activity
      up the visual hierarchy, which can drive fast but unconscious responses. Local recurrence in
      sensory cortex is held to suffice for phenomenal experience even without the widespread
      frontal activity needed for report, so the theory holds that
      [[phenomenal-consciousness|phenomenal consciousness]] can overflow
      [[access-consciousness|access consciousness]]. For AI the theory makes architecture decisive:
      a purely [[feedforward-neural-network|feedforward neural network]] would lack consciousness
      however capable it was, while recurrent processing of perceptual representations counts as an
      [[indicator-properties-of-consciousness|indicator]]. Whether a transformer's token-by-token
      generation amounts to recurrence in the relevant sense is disputed.
origin: >-
  Victor Lamme and Pieter Roelfsema distinguished feedforward and recurrent modes of visual
  processing in 2000; Lamme proposed recurrence as the basis of consciousness in 'Towards a True
  Neural Stance on Consciousness' (Trends in Cognitive Sciences, 2006) and later papers.
year: 2006
see_also:
  - global workspace theory
  - phenomenal consciousness
  - recurrent neural network
  - indicator properties of consciousness
  - neural correlates of consciousness
contrast:
  - global workspace theory
sources:
  - text: >-
      Lamme, V. A. F. & Roelfsema, P. R. (2000). The Distinct Modes of Vision Offered by Feedforward
      and Recurrent Processing. Trends in Neurosciences 23(11), 571–579.
  - text: >-
      Lamme, V. A. F. (2006). Towards a True Neural Stance on Consciousness. Trends in Cognitive
      Sciences 10(11), 494–501.
