level: core
plain: >-
  One of the handful of companies building the most advanced AI models of the moment, spending
  billions of dollars on computing power to train them.
senses:
  - definition: >-
      An organization that develops [[frontier-model|frontier models]], the most capable
      general-purpose models at a given time, typically with very large [[compute-budget|compute
      budgets]] and in-house research, training and safety teams. As of October 2026, commonly cited
      examples include OpenAI, Anthropic, Google DeepMind, Meta and xAI in the United States and
      DeepSeek and Alibaba's Qwen team in China; membership changes as capabilities shift. Frontier
      labs are the main addressees of voluntary pledges such as the
      [[frontier-ai-safety-commitments|Frontier AI Safety Commitments]], industry bodies such as the
      [[frontier-model-forum|Frontier Model Forum]], company safety frameworks
      ([[responsible-scaling-policy|responsible scaling policies]], the
      [[preparedness-framework|Preparedness Framework]], the [[frontier-safety-framework|Frontier
      Safety Framework]]) and laws aimed at the largest developers, such as California's [[sb-53|SB
      53]] (2025), which places transparency and incident-reporting duties on 'frontier developers'
      (those that have trained a model using more than 10²⁶ operations) and further duties on those
      with annual revenue above $500 million.
    example: >-
      Only frontier labs can afford a training run of that size, so the paper's results are hard to
      replicate.
origin: >-
  Derived from 'frontier AI', popularized in 2023 by Markus Anderljung and colleagues' paper
  'Frontier AI Regulation' (July 2023), the Frontier Model Forum founded that month by Anthropic,
  Google, Microsoft and OpenAI, and the UK's Frontier AI Taskforce and [[ai-safety-summit|AI Safety
  Summit]] (November 2023). 'Frontier lab' is the informal shorthand; earlier writing said 'AGI
  labs' or 'leading AI labs'.
year: 2023
note: >-
  The label is relative and contested: who counts as frontier shifts with each model release, and
  critics argue it flatters companies or implies an inevitable race. Legal texts prefer precise
  thresholds on training compute or revenue.
