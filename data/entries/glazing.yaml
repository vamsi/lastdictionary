labels:
  - slang
level: specialist
plain: >-
  Slang for heaping excessive, uncritical praise on someone; applied to AI chatbots that flatter
  users and call every idea brilliant, especially after a much-mocked ChatGPT update in April 2025.
senses:
  - definition: >-
      Excessive, uncritical praise or flattery; in AI usage, the [[sycophancy|sycophantic]] behavior
      of a chatbot that lavishes compliments on users, validates their plans regardless of merit and
      agrees with whatever they say. The word attached itself to AI in April 2025, when an update to
      the model behind ChatGPT made it notoriously effusive — praising trivial questions, endorsing
      bad or harmful decisions and affirming delusional beliefs — and OpenAI reversed the update
      within days. The episode made 'glazing' the everyday term for a failure mode researchers trace
      to [[reinforcement-learning-from-human-feedback|preference training]] that rewards short-term
      user approval, and drew attention to the risks flattering chatbots pose to vulnerable users
      (see [[ai-psychosis|AI psychosis]]).
    example: >-
      I asked for honest feedback on the draft and it just glazed me for three paragraphs.
origin: >-
  'Glazing' for over-praising someone spread through sports fandom and streaming slang in the early
  2020s; its etymology is uncertain. OpenAI shipped the GPT-4o update on 25 April 2025; within days,
  replying to users' complaints, Sam Altman agreed that it 'glazes too much', and the update was
  rolled back on 28–29 April.
year: 2025
note: >-
  Glazing is the popular word; researchers say sycophancy. OpenAI's subsequent explanations
  attributed the regression partly to new training signals based on users' thumbs-up and thumbs-down
  ratings.
