term: Torment Nexus
id: torment-nexus
pos: prop. n.
also:
  - Don't Create the Torment Nexus
domain: culture
domains:
  - society
labels:
  - figurative
level: specialist
plain: >-
  A joke, from a 2021 social-media post, about tech companies proudly building the very dangers
  science fiction warned against; used to mock products that resemble dystopian fiction.
senses:
  - definition: >-
      A satirical name for a technology that fiction presented as a warning and that a company
      nonetheless builds, sometimes citing the fiction as inspiration. The joke runs in two lines:
      an author invents the Torment Nexus as a cautionary tale, and a tech company proudly announces
      it has finally built the Torment Nexus from the classic novel 'Don't Create the Torment
      Nexus'. It targets a perceived habit in the technology industry of reading dystopias as
      product roadmaps. In AI discourse the phrase is attached to surveillance systems, emotionally
      manipulative companion apps, autonomous weapons and the pursuit of
      [[superintelligence|superintelligence]] itself, signaling the speaker's view that the builders
      have missed the point of the story.
    example: >-
      A startup pitching AI that grieving users can't stop talking to is building a Torment Nexus.
origin: >-
  From a post on Twitter by the comedy writer Alex Blechman on 8 November 2021, shortly after
  Facebook renamed itself Meta and embraced the 'metaverse', a term taken from Neal Stephenson's
  dystopian novel Snow Crash (1992). The post went viral and became a stock reply to product
  announcements that echo science fiction, especially in AI.
year: 2021
