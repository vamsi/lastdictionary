# yaml-language-server: $schema=../schema/entry.schema.json

term: network dissection
id: network-dissection
pos: n.
also:
  - GAN dissection
  - Broden
domain: interp
domains:
  - percep
  - dl
level: specialist
plain: >-
  A method for finding out what individual units inside an image-recognition network respond to,
  such as dogs, windows, grass or stripes, by comparing where each unit lights up with pictures
  labeled by people.
senses:
  - definition: >-
      A method for labeling and counting interpretable units in a
      [[convolutional-neural-network|convolutional neural network]] by matching each unit's
      activation maps against human-annotated segmentations of visual concepts. For every unit,
      activations over a large probe dataset are thresholded at a high quantile and upsampled to
      image resolution; the [[intersection-over-union|intersection over union]] between the
      resulting regions and each concept's masks is computed, and a unit whose best overlap passes a
      cutoff is labeled a detector for that concept. The original probe set, Broden, combined
      several datasets into about 1,200 concepts in six categories: objects, scenes, parts,
      materials, textures and colors. Dissection showed that object and part detectors emerge in
      higher layers without supervision for them, compared architectures and training regimes by
      their numbers of unique detectors, and found that randomly rotating a layer's basis reduces
      interpretability, suggesting individual units form a privileged basis. GAN dissection applied
      the idea to image generators, where switching detected units on or off adds or removes
      objects.
    example: >-
      Network dissection labeled unit 314 in the last convolutional layer as a door detector.
origin: >-
  Introduced by David Bau, Bolei Zhou, Aditya Khosla, Aude Oliva and Antonio Torralba at MIT in
  'Network Dissection: Quantifying Interpretability of Deep Visual Representations' (CVPR 2017),
  building on Zhou and colleagues' 2015 finding that object detectors emerge in networks trained
  only to classify scenes. Bau's GAN Dissection followed in 2019.
year: 2017
note: >-
  A unit labeled with one concept may also respond to others ([[polysemanticity|polysemanticity]]),
  and a fixed concept list cannot reveal features nobody annotated, a gap later addressed by
  natural-language neuron descriptions and [[automated-interpretability|automated
  interpretability]]. Compare [[testing-with-concept-activation-vectors|testing with concept
  activation vectors]], which probes directions rather than single units.
see_also:
  - feature visualization
  - multimodal neuron
  - testing with concept activation vectors
  - polysemanticity
  - automated interpretability
  - mechanistic interpretability
sources:
  - text: >-
      Bau, D., Zhou, B., Khosla, A., Oliva, A. & Torralba, A. (2017). Network Dissection:
      Quantifying Interpretability of Deep Visual Representations. Proc. CVPR 2017.
  - text: >-
      Bau, D. et al. (2019). GAN Dissection: Visualizing and Understanding Generative Adversarial
