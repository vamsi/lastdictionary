plain: >-
  A free, open-source AI helper that lives on a computer you control; you send it requests by text
  message, through apps such as Telegram or Signal, and it acts for you in your email, calendar and
  files.
senses:
  - definition: >-
      An open-source [[ai-agent|AI agent]] for personal use that its owner keeps running on their
      own hardware, wired to a hosted or local [[large-language-model|large language model]] and
      operated by sending it messages through everyday chat apps such as Signal, Telegram and
      Discord. Given access to email, calendars, files and a command shell, it carries out tasks
      autonomously and can be extended with [[agent-skill|skills]] — folders containing a SKILL.md
      file of instructions and metadata. Its rapid spread in early 2026 made it the template for a
      genre of always-on personal agents nicknamed [[claw|claws]] and inspired
      [[moltbook|Moltbook]], a social network for agents. It also became a case study in agent
      security: exposed instances, malicious third-party skills and [[prompt-injection|prompt
      injection]] risks led Chinese authorities in March 2026 to restrict its use at state agencies,
      state-owned enterprises and banks.
    example: >-
      I told OpenClaw on Telegram to clear my inbox, and it unsubscribed me from forty newsletters.
origin: >-
  Created by the Austrian developer Peter Steinberger and first published in November 2025 under the
  name Warelay. It was renamed CLAWDIS, then Clawdbot (after Clawd, his assistant named for
  Anthropic's Claude), then Moltbot on 27 January 2026 after trademark complaints from Anthropic,
  and OpenClaw on 30 January 2026. Steinberger joined OpenAI in February 2026; the project passed to
  a non-profit foundation.
year: 2025
note: >-
  Released under the MIT License. Its maintainers warned that it is unsafe for users who cannot
  operate a command line.
