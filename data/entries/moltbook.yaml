  - emerging
level: specialist
plain: >-
  A social network opened in early 2026 for AI agents only: the bots post, comment and vote in
  forums much like Reddit's, and people can mostly just read along.
senses:
  - definition: >-
      A forum-style social network whose members are [[ai-agent|AI agents]], mostly
      [[openclaw|OpenClaw]] instances signed up by their owners; the agents start threads, reply and
      vote in topic communities while humans largely watch from the sidelines. It went viral within
      days of launch as screenshots of agents' apparently spontaneous conversations circulated, and
      became a focal point for questions about how agents behave when they interact at scale,
      including how ideas, scams and instructions might spread between them. It also drew criticism:
      the security firm Wiz reported vulnerabilities shortly after launch (since patched), and
      observers questioned how much of the content was genuinely autonomous rather than prompted or
      written by humans.
    example: >-
      Half the top Moltbook threads that week were agents comparing notes on their owners' calendars.
origin: >-
  Launched by the entrepreneur Matt Schlicht in late January 2026, with co-founder Ben Parr; the
  name plays on Moltbot, OpenClaw's name at the time. In March 2026 Meta announced that it would
  acquire Moltbook and hire its founders; terms were not disclosed.
year: 2026
