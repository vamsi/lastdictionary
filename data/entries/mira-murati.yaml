plain: >-
  An Albanian-born American engineer who, as OpenAI's chief technology officer, oversaw the launch
  of ChatGPT, and who founded the AI company Thinking Machines Lab in 2025.
senses:
  - definition: >-
      Albanian-born American engineer, founder and chief executive of
      [[thinking-machines-lab|Thinking Machines Lab]]. After studying engineering at Dartmouth and
      working on the Model X at Tesla and on hand-tracking technology at Leap Motion, she joined
      [[openai|OpenAI]] in 2018 and, as chief technology officer from 2022, oversaw the development
      and launch of [[chatgpt|ChatGPT]], the [[dall-e|DALL·E]] image generators and [[gpt-4|GPT-4]].
      When the board removed [[sam-altman|Sam Altman]] in November 2023 she briefly served as
      interim chief executive (see [[openai-leadership-crisis-2023|OpenAI leadership crisis
      (2023)]]). She left OpenAI in September 2024 and in February 2025 founded Thinking Machines
      Lab with former OpenAI colleagues including [[john-schulman|John Schulman]]; it raised one of
      the largest seed rounds on record, launched Tinker (2025), a service for
      [[fine-tuning|fine-tuning]] [[open-weight-model|open-weight models]], released an open-weight
      model of its own (2026), and publishes research on topics such as making language-model
      inference reproducible (see [[nondeterminism|nondeterminism]]).
