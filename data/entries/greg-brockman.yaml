plain: >-
  An American engineer who helped start OpenAI in 2015 and became its president, after serving as
  the first technology chief of the payments company Stripe.
senses:
  - definition: >-
      American engineer and entrepreneur, a co-founder and the president of [[openai|OpenAI]]. He
      came to it from the payments company Stripe, which he had joined on leaving MIT in 2010 and
      served as its first chief technology officer; in 2015 he co-founded OpenAI with
      [[sam-altman|Sam Altman]], [[elon-musk|Elon Musk]], [[ilya-sutskever|Ilya Sutskever]] and
      others. There he was chief technology officer and later chairman and president, and he has
      been closely involved in its engineering, from the OpenAI Gym toolkit for
      [[reinforcement-learning|reinforcement learning]] (2016; see [[gymnasium|Gymnasium]]) and the
      Dota 2-playing OpenAI Five to the infrastructure behind [[gpt-4|GPT-4]] and
      [[chatgpt|ChatGPT]]. During the November 2023 board crisis he was removed as chairman and
      resigned, returning days later with Altman (see [[openai-leadership-crisis-2023|OpenAI
      leadership crisis (2023)]]). In 2025 he helped found and fund Leading the Future, a super PAC
      network backing a light-touch, federal approach to AI regulation.
