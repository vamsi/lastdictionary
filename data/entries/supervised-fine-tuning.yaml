# yaml-language-server: $schema=../schema/entry.schema.json

term: supervised fine-tuning
id: supervised-fine-tuning
pos: n.
also:
  - SFT
  - supervised finetuning
  - SFT stage
domain: train
domains:
  - llm
level: core
plain: >-
  Teaching a pretrained AI model by showing it many examples of good answers to requests, so it
  learns to imitate them — like learning a job by studying worked examples.
senses:
  - definition: >-
      [[fine-tuning|Fine-tuning]] a pretrained model with ordinary supervised learning on
      input–output pairs; for [[large-language-model|language models]], on demonstrations consisting
      of a prompt (often a multi-turn conversation in a [[chat-template|chat template]]) and a
      desired response written by people or generated by stronger models. The objective is the
      [[cross-entropy|cross-entropy]] loss of [[next-token-prediction|next-token prediction]],
      usually computed only on the response tokens, so SFT is a form of
      [[imitation-learning|imitation learning]] or [[behavioral-cloning|behavioral cloning]]. In the
      standard post-training pipeline it comes first: it teaches format, instruction following,
      persona and tool-call syntax, and supplies the starting policy (and usually the
      [[reference-model|reference model]]) for preference optimization or
      [[reinforcement-learning|reinforcement learning]]. Quality and diversity of demonstrations
      matter more than volume; a few thousand curated examples can set style, while reasoning SFT
      uses long [[chain-of-thought|chains of thought]], often distilled from a stronger model.
    example: >-
      We ran SFT on 50,000 distilled reasoning traces before starting RL, to give the policy a cold
      start.
origin: >-
  Supervised fine-tuning of pretrained networks long predates the abbreviation. 'SFT' as the name of
  the demonstration stage of the language-model alignment pipeline was popularized by OpenAI's
  InstructGPT paper (Long Ouyang and colleagues, 2022), which labeled its stages SFT, RM (reward
  model) and PPO; the label spread with ChatGPT-era open replications.
year: 2022
note: >-
  Strictly, any supervised fine-tuning counts, but in LLM writing 'SFT' means the demonstration
  stage. Some argue it mainly teaches style rather than knowledge (the
  [[superficial-alignment-hypothesis|superficial alignment hypothesis]]). Comparisons suggest SFT
  drifts further from the base model and forgets more than on-policy
  [[reinforcement-learning|reinforcement learning]], though it remains the cheapest way to install a
  behavior.
