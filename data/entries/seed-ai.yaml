term: seed AI
id: seed-ai
pos: n.
also:
  - seed artificial intelligence
domain: asi
domains:
  - safety
  - hist
labels:
  - historical
level: specialist
plain: >-
  An early AI built mainly to understand and upgrade itself, so that it could grow, like a seed,
  into a far more capable mind.
senses:
  - definition: >-
      A hypothetical AI built above all to improve itself; in Eliezer Yudkowsky's original
      definition, one 'designed for self-understanding, self-modification, and recursive
      self-improvement' (see [[recursive-self-improvement|recursive self-improvement]]). It might
      start out unimpressive, but by rewriting its own code and cognitive architecture it would
      climb to human level and beyond. The metaphor stresses that what matters is not the starting
      intelligence but the growth trajectory: the designers' main task would be to get the initial
      goal system right, because later versions would inherit and amplify it. This framing motivated
      early [[friendly-ai|friendly AI]] research and the view that alignment must be solved before
      such a system is started. Modern discussion has largely replaced it with
      [[automated-ai-research|automated AI research]], in which AI systems improve their successors
      through ordinary training pipelines rather than by editing their own code.
    example: >-
      The seed AI picture assumed hand-written code an AI could read and rewrite, not billions of
      learned weights.
origin: >-
  Introduced by Eliezer Yudkowsky, by 2001, in writings for the Singularity Institute for Artificial
  Intelligence (now [[machine-intelligence-research-institute|MIRI]]), notably 'General Intelligence
  and Seed AI' and 'Creating Friendly AI' (both 2001; the latter dated June 2001); an earlier first
  appearance is possible. Nick Bostrom adopted the term in Superintelligence (2014).
year: 2001
