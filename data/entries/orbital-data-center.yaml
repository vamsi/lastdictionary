level: specialist
plain: >-
  A proposed computer center circling the Earth, powered by almost constant sunlight, that would run
  AI without using land, water or power grids on the ground.
senses:
  - definition: >-
      A data center placed on satellites in Earth orbit, proposed as a way to meet the growing
      electricity demand of AI computing with near-continuous solar power while sidestepping
      terrestrial limits on land, grid connections and water. Designs envisage constellations of
      solar-powered satellites carrying AI accelerators and linked by free-space laser connections.
      Obstacles include radiation damage to chips, shedding heat in a vacuum where it can only be
      radiated away, launch costs, maintenance and latency. In November 2025 Google reported that
      its Trillium [[tpu|TPUs]] had withstood radiation doses well above those expected over a
      five-year mission, and planned to launch two prototype satellites with the operator Planet by
      early 2027; the start-up Starcloud had by then flown a data-center GPU in orbit.
    example: >-
      The pitch deck promised an orbital data center by 2030, with cooling still marked 'TBD'.
origin: >-
  Long a speculative idea, it became a serious industry topic in late 2025, when Google announced
  its Project Suncatcher research program (November 2025) and Starcloud launched a satellite
  carrying an Nvidia H100 GPU; executives including Elon Musk and Jeff Bezos promoted the concept.
year: 2025
