term: agent memory
id: agent-memory
pos: n.
also:
  - AI memory
  - LLM memory
  - memory (agents)
domain: agents
domains:
  - llm
level: essential
plain: >-
  The ways an AI assistant or agent keeps information — your preferences, past conversations,
  lessons from earlier tasks — and brings it back later, beyond what fits in a single conversation.
senses:
  - definition: >-
      The mechanisms by which an [[ai-agent|AI agent]] retains information and reuses it across
      steps, sessions and tasks. Because a [[large-language-model|large language model]] keeps no
      state between calls, memory must be supplied through its context or stored in its weights.
      Common taxonomies, borrowed from cognitive science, separate [[working-memory|working memory]]
      (what is in the current [[context-window|context window]]) from [[long-term-memory|long-term
      memory]] held externally in files, databases, [[vector-database|vector stores]] or
      [[knowledge-graph|knowledge graphs]], and divide the latter into [[episodic-memory|episodic]]
      (records of past events), semantic (facts) and procedural (skills and instructions) memory;
      knowledge in the weights is sometimes called parametric memory. A memory system must decide
      what to write (extraction, summarization, reflection), how to maintain it (consolidation,
      deduplication, resolving contradictions, forgetting) and what to read back (retrieval by
      relevance, recency or importance). Failure modes include stale or wrong memories,
      [[context-poisoning|context poisoning]], privacy leakage and reinforced
      [[sycophancy|sycophancy]].
    example: >-
      With agent memory switched on, the assistant remembered that I deploy on Fridays and stopped
      suggesting Friday releases.
origin: >-
  Memory was part of agent and [[cognitive-architecture|cognitive architectures]] long before LLMs
  (Soar, ACT-R). For LLM agents, Generative Agents (Joon Sung Park et al., April 2023) and
  [[memgpt|MemGPT]] (October 2023) set early patterns, and the CoALA framework (Theodore Sumers et
  al., 2023) popularized the working/episodic/semantic/procedural taxonomy. Memory features arrived
  in ChatGPT (tested from February 2024) and Claude (from September 2025, first on business plans).
year: 2023
note: >-
  Product 'memory' features usually mean stored facts or retrieval over past chats injected into the
  prompt, not learning in the weights. Memory raises governance questions of its own: what is stored
  about users, for how long, and whether they can see and delete it.
