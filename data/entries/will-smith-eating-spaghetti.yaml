level: specialist
plain: >-
  A grotesque 2023 AI-generated video of actor Will Smith eating spaghetti that became a meme and an
  informal yardstick: each new video model is judged by how well it redoes the scene.
senses:
  - definition: >-
      A short AI-generated clip, and the informal benchmark it became, showing a distorted likeness
      of the actor Will Smith devouring spaghetti. The original, made with an early open-source
      [[text-to-video-model|text-to-video model]], featured melting faces, warped hands and noodles
      that defied physics, epitomizing the uncanny state of video generation at the time. Because
      the prompt was so widely recognized, users re-ran it on each new video model as a visible
      measure of progress in realism, motion coherence and, later, synchronized sound, producing a
      side-by-side record of the technology's rapid improvement from 2023 onward. The clip is also a
      reference point in debates over likeness rights and celebrity [[deepfake|deepfakes]].
    example: >-
      The new model's Will Smith eating spaghetti is indistinguishable from footage, chewing sounds
      included.
origin: >-
  Posted in late March 2023 by the Reddit user chaindrop to the r/StableDiffusion forum, generated
  with the ModelScope text-to-video model; a repost on Twitter reached millions of views within
  days. In February 2024, after users challenged OpenAI to recreate it with its Sora model, Will
  Smith posted a parody video of himself eating spaghetti in an exaggeratedly 'AI' manner.
year: 2023
note: >-
  Comparable informal yardsticks include [[pelican-on-a-bicycle|pelican on a bicycle]] for language
  models and hand rendering for image models (see [[ai-hands|AI hands]]).
