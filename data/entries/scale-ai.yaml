  - eval
level: core
plain: >-
  A company that pays large numbers of people to label examples, write model answers and grade
  chatbot replies, producing the data AI developers train and test on. Meta bought nearly half of it
  in 2025.
senses:
  - definition: >-
      An American company that sells human-generated training data and model testing to AI
      developers, governments and businesses. It began with [[data-labeling|data labeling]] of
      camera and lidar recordings for [[autonomous-vehicle|self-driving cars]], then became a
      leading supplier of the human-written demonstrations and preference rankings used in
      [[supervised-fine-tuning|supervised fine-tuning]] and
      [[reinforcement-learning-from-human-feedback|reinforcement learning from human feedback]],
      drawing on large pools of contract workers through platforms such as Remotasks and Outlier;
      pay and working conditions on those platforms have been criticized and litigated. It also
      builds evaluations, co-creating [[humanity-s-last-exam|Humanity's Last Exam]] with the
      [[center-for-ai-safety|Center for AI Safety]], and develops AI systems for the US military. In
      June 2025 Meta bought a 49 percent non-voting stake and hired its founder; several AI
      developers, reportedly including Google and OpenAI, then wound down work with it, citing
      neutrality concerns.
origin: >-
  Founded in 2016 in San Francisco by Alexandr Wang and Lucy Guo through the Y Combinator startup
  accelerator; Wang left the Massachusetts Institute of Technology to start it. After Wang joined
  Meta in June 2025, Jason Droege became chief executive; Francis deSouza was named to the post in
  July 2026.
year: 2016
