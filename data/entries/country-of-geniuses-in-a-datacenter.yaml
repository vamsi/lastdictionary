  - powerful AI
domain: asi
domains:
  - society
labels:
  - emerging
level: core
plain: >-
  A phrase for future AI so capable that one data center could hold the equivalent of millions of
  Nobel-level experts, working faster than people on any problem.
senses:
  - definition: >-
      A metaphor for the capability level that Dario Amodei calls powerful AI: a data center running
      millions of copies of one model, each 'smarter than a Nobel Prize winner across most relevant
      fields', each able to take on tasks of hours to weeks without supervision using the tools a
      remote employee would, and each perhaps ten to a hundred times faster than a person. The image
      stresses parallelism and speed rather than a single superhuman mind, and frames the question
      as what a new nation of millions of top experts could accomplish. Amodei argued that such
      systems might compress decades of progress in biology and medicine into a few years, while
      acknowledging that physical experiments, regulation and human institutions would limit the
      speed-up. [[anthropic|Anthropic]] has since used the phrase in policy submissions forecasting
      such systems as early as late 2026 or 2027.
    example: >-
      If we get a country of geniuses in a datacenter, the bottleneck in drug discovery becomes
      clinical trials.
origin: >-
  Introduced by Dario Amodei, chief executive of Anthropic, in his October 2024 essay 'Machines of
  Loving Grace: How AI Could Transform the World for the Better', and repeated in his later writing,
  interviews and company policy documents.
year: 2024
