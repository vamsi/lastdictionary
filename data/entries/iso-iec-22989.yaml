term: ISO/IEC 22989
id: iso-iec-22989
pos: prop. n.
also:
  - ISO/IEC 22989:2022
  - AI concepts and terminology standard
domain: gov
domains:
  - core
level: specialist
plain: >-
  An international standard that fixes agreed meanings for basic AI words — such as AI system,
  machine learning and trustworthiness — so that other standards, contracts and laws can use the
  same vocabulary.
senses:
  - definition: >-
      The international standard 'Information technology — Artificial intelligence — Artificial
      intelligence concepts and terminology', published jointly by the International Organization
      for Standardization (ISO) and the International Electrotechnical Commission (IEC) through
      their AI subcommittee [[iso-iec-jtc-1-sc-42|ISO/IEC JTC 1/SC 42]]. It defines core terms such
      as [[ai-system|AI system]], AI agent, [[machine-learning|machine learning]],
      [[neural-network|neural network]], [[explainability|explainability]],
      [[robustness|robustness]] and controllability; describes the AI system life cycle and the main
      stakeholder roles (AI providers, producers, customers, partners and subjects); and outlines
      properties of trustworthiness. It contains no requirements and cannot be certified against; it
      is the shared vocabulary on which other SC 42 standards, including [[iso-iec-42001|ISO/IEC
      42001]], build.
    example: The contract defines 'AI system' by reference to ISO/IEC 22989.
origin: >-
  Developed by ISO/IEC JTC 1/SC 42, the joint AI subcommittee created in 2017, and published in July
  2022 as ISO/IEC 22989:2022, alongside ISO/IEC 23053:2022, which describes a framework for AI
  systems using machine learning.
year: 2022
