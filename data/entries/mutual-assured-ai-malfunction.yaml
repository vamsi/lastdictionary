term: Mutual Assured AI Malfunction
id: mutual-assured-ai-malfunction
pos: n.
also:
  - MAIM
domain: asi
domains:
  - gov
  - sec
labels:
  - emerging
  - contested
level: specialist
plain: >-
  A proposed deterrence strategy in which any country racing for overwhelming AI dominance would
  expect rivals to sabotage its AI projects, so none tries, much as with nuclear deterrence.
senses:
  - definition: >-
      A deterrence regime, offered by Dan Hendrycks, Eric Schmidt and Alexandr Wang (2025) both as a
      description of and a strategy for relations among AI powers: any state that tries to build its
      way to overwhelming dominance through [[superintelligence|superintelligence]] should expect
      rivals to wreck the project before it finishes. Because large AI projects depend on
      concentrated, vulnerable data centers, rivals could disable them through an escalation ladder
      running from espionage and covert sabotage (such as degrading training runs or tampering with
      model weights) through overt cyberattacks on power and cooling to kinetic strikes. If such
      threats are credible, no state can expect to win a race to
      [[decisive-strategic-advantage|decisive strategic advantage]], and a stable standoff results,
      by analogy with nuclear mutual assured destruction (MAD). The proposal pairs this deterrence
      with nonproliferation of dangerous capabilities to rogue actors and with national
      competitiveness. Critics question whether AI progress is observable enough to deter, whether
      red lines can be defined clearly, and whether threatening strikes on data centers raises the
      risk of escalation.
    example: >-
      Under MAIM, the threat of sabotage, not a treaty, keeps either side from sprinting to
      superintelligence.
origin: >-
  Introduced by Dan Hendrycks, Eric Schmidt and Alexandr Wang in Superintelligence Strategy (March
  2025), published in standard and expert versions, which presented MAIM as a counterpart to nuclear
  mutual assured destruction.
year: 2025
