# yaml-language-server: $schema=../schema/entry.schema.json

term: ALiBi
id: alibi
pos: abbr.
also:
  - Attention with Linear Biases
domain: llm
domains:
  - dl
level: specialist
plain: >-
  A simple way to give a transformer a sense of word order: attention between two words is penalized
  more the farther apart they are, which helps it handle texts longer than those it trained on.
senses:
  - definition: >-
      Short for Attention with Linear Biases: a [[positional-encoding|way of conveying word order]]
      without any position vectors, in which each [[attention-head|attention head]] lowers every
      query–key score in proportion to how far apart the two positions are, at a fixed head-specific
      rate drawn from a geometric sequence (for 8 heads: 1/2, 1/4, …, 1/256). Because nearer tokens
      are always favored, models trained on short sequences stay stable on longer ones: in the
      authors' experiments a 1.3-billion-parameter model trained on 1,024-token inputs, evaluated on
      2,048 tokens, equaled the [[perplexity|perplexity]] of a sinusoidal-position model trained at
      that length, while training 11% faster with 11% less memory. It was adopted by BLOOM and MPT,
      but [[rotary-positional-embedding|RoPE]] plus [[context-extension|context extension]] methods
      later prevailed, partly because ALiBi's strong locality can hamper use of distant context.
    example: >-
      Because the model uses ALiBi, we can run it at twice its training length without fine-tuning.
formula_latex: \operatorname{softmax}\!\left(q_i K^{\top} + m \cdot [-(i-1), \dots, -2, -1, 0]\right)
origin: >-
  Introduced by Ofir Press, Noah A. Smith and Mike Lewis of the University of Washington and
  Facebook AI Research in 'Train Short, Test Long: Attention with Linear Biases Enables Input Length
  Extrapolation' (arXiv, August 2021; ICLR 2022).
year: 2021
note: >-
  'Extrapolation' here means stable perplexity on longer inputs, not necessarily the ability to
  retrieve information from far back.
see_also:
  - positional encoding
  - rotary positional embedding
  - context extension
  - long context
  - attention mask
  - attention head
sources:
  - text: >-
      Press, O., Smith, N. A. & Lewis, M. (2021). Train Short, Test Long: Attention with Linear
      Biases Enables Input Length Extrapolation. arXiv:2108.12409; ICLR 2022.
    url: https://arxiv.org/abs/2108.12409
