term: artificial general intelligence
id: artificial-general-intelligence
pos: n.
also:
  - AGI
  - general AI
  - general artificial intelligence
domain: asi
domains:
  - core
  - society
labels:
  - contested
level: essential
plain: >-
  AI that could learn and do almost any mental task a capable adult can, rather than excelling at
  one narrow job. Experts disagree on the exact bar and on when, or whether, it will arrive.
senses:
  - definition: >-
      An AI system whose competence is broad rather than task-specific: able to learn and perform
      most cognitive tasks that humans can, carry skills over to unfamiliar problems, and do so at
      least at the level of a skilled adult. No agreed test exists, and definitions differ in what
      they measure. Capability definitions assess breadth and depth of performance, as in Google
      DeepMind's [[levels-of-agi|levels of AGI]] (2023) or a 2025 proposal by Dan Hendrycks and
      colleagues that scores systems against the Cattell–Horn–Carroll model of human cognitive
      abilities. Economic definitions use work: the [[openai|OpenAI]] Charter (2018) speaks of
      'highly autonomous systems that outperform humans at most economically valuable work'. Formal
      definitions measure goal achievement across environments ([[universal-intelligence|universal
      intelligence]]); others stress efficient acquisition of new skills (the premise of
      [[arc-agi|ARC-AGI]]) or the ability to automate AI research itself. Because today's
      [[large-language-model|language models]] are superhuman at some tasks and weak at others
      ([[jagged-intelligence|jagged intelligence]]), it is disputed whether they are early AGI, as
      the 2023 [[sparks-of-agi|Sparks of AGI]] paper suggested, or lack essentials such as
      [[continual-learning|continual learning]] and reliable long-horizon agency.
    example: Every lab says it is building AGI, but no two of them define it the same way.
origin: >-
  Earliest known use: Mark Gubrud's 1997 paper 'Nanotechnology and International Security', on the
  military implications of advanced technologies. Shane Legg proposed the term to Ben Goertzel in
  2002 as the title of a book (edited by Goertzel and Cassio Pennachin, published 2007) on returning
  to AI's original goal; an annual AGI conference followed from 2008. It went mainstream as
  [[openai|OpenAI]] and [[google-deepmind|Google DeepMind]] made it their declared goal.
year: 1997
note: >-
  Often interchangeable with [[human-level-ai|human-level AI]]; distinct from [[strong-ai|strong
  AI]], a philosophical thesis about genuine minds. Some researchers, including [[yann-lecun|Yann
  LeCun]], reject the term as ill-defined. Under Microsoft's October 2025 agreement with OpenAI, an
  OpenAI declaration of AGI was to be verified by an independent expert panel; an amendment of 27
  April 2026 made OpenAI's payments to Microsoft 'independent of OpenAI's technology progress',
  which commentators read as ending the AGI clause.
