term: philosophical zombie
id: philosophical-zombie
pos: n.
also:
  - p-zombie
  - zombie (philosophy)
  - zombie argument
  - conceivability argument
domain: mind
labels:
  - contested
level: core
plain: >-
  An imagined being that behaves exactly like a person — talking, laughing, even saying it feels
  pain — but has no inner experience at all. Philosophers use it to ask whether behavior proves a
  mind.
senses:
  - definition: >-
      A thought-experiment creature with no [[phenomenal-consciousness|phenomenal consciousness]]
      that is nonetheless a molecule-for-molecule copy of a conscious person. Because its physical
      makeup is identical, so is its behavior — it reports pains, describes sunsets, even debates
      the nature of experience — though nothing is felt. The zombie argument holds that such a being
      is conceivable, that what is conceivable in this sense is metaphysically possible, and hence
      that consciousness is not fixed by the physical facts, so physicalism is false. Critics reject
      one of the steps, holding that zombies only seem conceivable or that conceivability does not
      establish possibility; [[illusionism|illusionists]] and many functionalists deny that the
      scenario is coherent. In AI discussions the term is extended to a system that could display
      every outward sign of consciousness, including sincere-seeming testimony, with no experience
      behind it.
    example: >-
      Nothing in the transcript rules out that we are talking to a zombie that merely reports
      feelings.
origin: >-
  Robert Kirk first used 'zombie' in this sense in 'Zombies v. Materialists' (1974); Keith
  Campbell's 'imitation man' (1970) made a similar point, and related 'absent qualia' cases were
  discussed by Ned Block and others in the 1970s. David Chalmers's The Conscious Mind (1996) made
  the zombie argument central to debates about physicalism.
year: 1974
note: >-
  Unrelated to the undead of folklore and film except by name. A behavioral zombie in the AI sense
  need not be a physical duplicate of anyone, so its possibility is far less controversial than that
  of the philosopher's zombie, which is identical to us atom for atom.
see_also:
  - hard problem of consciousness
  - phenomenal consciousness
  - problem of other minds
  - functionalism
  - qualia
  - Chinese room
sources:
  - text: >-
      Kirk, R. (1974). Zombies v. Materialists. Proceedings of the Aristotelian Society,
      Supplementary Volume 48, 135–152.
  - text: >-
      Chalmers, D. J. (1996). The Conscious Mind: In Search of a Fundamental Theory. Oxford
      University Press.
