level: core
plain: >-
  A series of US government-sponsored races for driverless vehicles held in 2004, 2005 and 2007. No
  robot finished the first race; within three years, cars were navigating mock city traffic.
senses:
  - definition: >-
      A series of prize competitions for [[autonomous-vehicle|autonomous ground vehicles]] organized
      by the US Defense Advanced Research Projects Agency (DARPA). In the first, on 13 March 2004,
      over roughly 140 miles of the Mojave Desert, no vehicle finished; the best, Carnegie Mellon
      University's Sandstorm, covered about 7.3 miles. In the second, on 8 October 2005, five
      vehicles completed a 132-mile desert course, and Stanford University's Stanley, led by
      Sebastian Thrun, won the $2 million prize by combining [[lidar|lidar]], cameras and GPS with
      [[machine-learning|machine learning]] for judging drivable terrain. The 2007 Urban Challenge,
      on a mock town course at the former George Air Force Base in California, required obeying
      traffic rules among other vehicles; Carnegie Mellon's Boss won. Veterans of these teams went
      on to lead self-driving programs at Google (later Waymo), Uber and elsewhere.
    example: >-
      The DARPA Grand Challenge turned the self-driving car from a defense curiosity into an
      industry.
origin: >-
  Created by DARPA in response to a US congressional goal, set in 2000, that a third of operational
  ground combat vehicles be unmanned by 2015. Its prize format inspired later DARPA contests in
  robotics and cybersecurity.
year: 2004
