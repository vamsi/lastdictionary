term: cognitive science
id: cognitive-science
pos: n.
also:
  - cognitive sciences
  - cogsci
domain: mind
domains:
  - core
  - hist
level: core
plain: >-
  The scientific study of how minds work — how we reason, use language, remember and see — combining
  psychology, neuroscience, linguistics, philosophy, anthropology and artificial intelligence.
senses:
  - definition: >-
      The study of mind and intelligence pursued jointly by psychology, artificial intelligence,
      linguistics, neuroscience, philosophy and anthropology, the six fields of the hexagon that
      served as its traditional emblem. Its founding assumption was the
      [[computational-theory-of-mind|computational theory of mind]]: that perception, memory,
      language and reasoning can be understood as information processing over representations, so
      that computational models can serve as theories of cognition. Successive approaches include
      symbolic models, [[connectionism|connectionism]], dynamical and
      [[embodied-cognition|embodied]] approaches, Bayesian models and
      [[predictive-processing|predictive processing]]; methods include behavioral experiments,
      computational modeling and neuroimaging, often organized by [[marr-s-levels-of-analysis|Marr's
      levels of analysis]]. The field has a two-way relationship with AI: cognitive models inspired
      [[neural-network|neural networks]] and [[reinforcement-learning|reinforcement learning]], and
      [[large-language-model|language models]] are now used both as models of human cognition and as
      subjects of [[machine-psychology|machine psychology]].
origin: >-
  The term is usually credited to Christopher Longuet-Higgins, who used it in his 1973 commentary on
  the Lighthill report on AI. Many date the field's birth to an MIT symposium on 11 September 1956
  at which George Miller, Noam Chomsky, Allen Newell and Herbert Simon presented work; the journal
  Cognitive Science began in 1977 and the Cognitive Science Society in 1979.
year: 1973
