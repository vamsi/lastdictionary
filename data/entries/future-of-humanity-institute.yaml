plain: >-
  Nick Bostrom's research center at Oxford University (2005–2024), where philosophers and scientists
  studied threats that could permanently derail humanity's future, advanced artificial intelligence
  among them.
senses:
  - definition: >-
      Nick Bostrom's institute at the University of Oxford (2005–2024), which drew researchers from
      several disciplines and turned [[existential-risk|existential risk]] and the long-run future
      of humanity into subjects of academic research. Its researchers developed or popularized many
      ideas now central to [[ai-safety|AI safety]] debates, including the
      [[orthogonality-thesis|orthogonality thesis]], [[instrumental-convergence|instrumental
      convergence]], information hazards and the [[decisive-strategic-advantage|decisive strategic
      advantage]] of a first mover, brought together in Nick Bostrom's book Superintelligence
      (2014). FHI also produced a technical roadmap for [[whole-brain-emulation|whole brain
      emulation]] (2008) and Toby Ord's The Precipice (2020), hosted the program that became the
      [[centre-for-the-governance-of-ai|Centre for the Governance of AI]] (2018–2021), and trained
      many people who went on to work at AI laboratories, think tanks and governments. Its close
      ties to [[effective-altruism|effective altruism]] and [[longtermism|longtermism]] made it both
      influential and controversial.
origin: >-
  Founded in 2005 by philosopher Nick Bostrom within Oxford's Faculty of Philosophy and the James
  Martin 21st Century School (later the Oxford Martin School). After the Faculty of Philosophy froze
  its fundraising and hiring from 2020 and declined to renew staff contracts, the institute closed
  on 16 April 2024.
year: 2005
note: >-
  Not to be confused with the [[future-of-life-institute|Future of Life Institute]], a separate
  nonprofit with overlapping concerns.
