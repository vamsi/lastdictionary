# yaml-language-server: $schema=../schema/entry.schema.json

term: AI as normal technology
id: ai-as-normal-technology
pos: phr.
also:
  - normal technology
  - AI as a normal technology
domain: society
domains:
  - asi
  - gov
labels:
  - contested
  - emerging
level: core
plain: >-
  The view that AI, however important, will change society gradually, like electricity or the
  internet, through slow adoption by people and institutions, rather than as a sudden,
  uncontrollable superintelligence.
senses:
  - definition: >-
      A worldview and policy framework, set out by Arvind Narayanan and Sayash Kapoor, that treats
      AI as a transformative but normal [[general-purpose-technology|general-purpose technology]]
      whose economic and social effects unfold over decades, not as a new species or an imminent
      [[superintelligence|superintelligence]]. Its main claims are that the speed of impact is
      limited by diffusion and adoption, which depend on organizational change, regulation and
      safety requirements, not only by capability gains; that methods, applications and adoption
      must be distinguished; that humans will retain control through [[human-oversight|oversight]],
      auditing and institutions, with human work shifting toward specifying and supervising AI; and
      that policy should favor resilience, reducing uncertainty and addressing known harms over
      drastic nonproliferation measures premised on speculative catastrophe. It is offered as an
      alternative to both utopian and dystopian superintelligence narratives.
    example: >-
      Treating AI as normal technology, the agency focused on procurement rules and liability rather
      than compute caps.
origin: >-
  Introduced by Princeton computer scientists Arvind Narayanan and Sayash Kapoor in the essay 'AI as
  Normal Technology', published by the Knight First Amendment Institute at Columbia University in
  April 2025, following their book AI Snake Oil (2024).
year: 2025
note: >-
  Critics, especially those expecting an [[intelligence-explosion|intelligence explosion]] or
  scenarios such as [[ai-2027|AI 2027]], argue that it underestimates how quickly AI could automate
  AI research or acquire dangerous capabilities; the authors present it as both prediction and
  prescription, to be tested against events.
see_also:
