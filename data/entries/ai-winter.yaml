# yaml-language-server: $schema=../schema/entry.schema.json

term: AI winter
id: ai-winter
pos: n.
also:
  - AI winters
  - winter of AI
domain: hist
domains:
  - society
  - core
level: essential
plain: >-
  A slump in which disappointment over AI's unmet promises leads governments and companies to pull
  back money and attention. Historians count two big ones: one in the 1970s and one starting in the
  late 1980s.
senses:
  - definition: >-
      The bust phase of a boom-and-bust cycle in artificial intelligence: a span of years in which
      money, commercial backing and scientific standing drain away from the field because earlier
      expectations have gone unmet. Two such periods are usually recognized. The first, roughly
      1974–1980, came after critical official reviews — the [[alpac-report|ALPAC report]] (1966) on
      machine translation and Britain's [[lighthill-report|Lighthill report]] (1973) — together with
      US defense agencies' retreat from open-ended research grants and a slump in neural-network
      work often blamed on [[perceptrons-book|Perceptrons]]. The second, from about 1987 to the
      mid-1990s, began as the market for [[lisp-machine|Lisp machines]] collapsed and
      [[expert-system|expert systems]] proved hard to scale and costly to maintain, and it deepened
      as Japan's [[fifth-generation-computer-systems-project|Fifth Generation Computer Systems
      project]] and DARPA's [[strategic-computing-initiative|Strategic Computing Initiative]] wound
      down. During winters, researchers often relabeled their work as informatics, knowledge-based
      systems or [[machine-learning|machine learning]] to avoid the stigma of 'AI'.
    example: Skeptics ask whether today's investment boom will end in a third AI winter.
origin: >-
  Modeled on 'nuclear winter'. Its first known public use was as the theme of a 1984 panel debate at
  the annual meeting of the American Association for Artificial Intelligence (now the
  [[association-for-the-advancement-of-artificial-intelligence|Association for the Advancement of
  Artificial Intelligence]]). There Roger Schank and [[marvin-minsky|Marvin Minsky]], veterans of
  the 1970s cuts, cautioned that business excitement about expert systems had run ahead of results
  and predicted a crash.
year: 1984
note: >-
  The dates, and even the number, of winters are debated; research never stopped, and some
  historians describe several smaller downturns. Periods of rapid growth are sometimes called AI
  springs or summers. See also [[ai-bubble|AI bubble]] and [[hype-cycle|hype cycle]].
see_also:
