term: AI Pact
id: ai-pact
pos: prop. n.
also:
  - EU AI Pact
domain: gov
domains:
  - society
level: specialist
plain: >-
  A voluntary European Commission scheme in which companies pledge to start following the EU AI
  Act's main ideas early, before the rules legally apply to them.
senses:
  - definition: >-
      A voluntary initiative of the European Commission, run by the [[ai-office|AI Office]], that
      encourages organizations to prepare for the [[eu-ai-act|EU AI Act]] ahead of its application
      dates. It has two strands: a network for exchanging experience and good practice through
      workshops and webinars, and voluntary pledges. Core pledges commit signatories to adopt an AI
      governance strategy, to map AI systems likely to be [[high-risk-ai-system|high-risk]] in their
      organizations, and to promote AI literacy among staff; further optional pledges cover human
      oversight, risk mitigation and labeling of AI-generated content.
    example: >-
      Signing the AI Pact pledges pushed us to build an inventory of our AI systems a year early.
origin: >-
  Announced by the Commission in 2023, while the AI Act was still being negotiated; more than 100
  companies signed the first pledges in September 2024, while some large technology firms, including
  Meta, declined.
year: 2023
note: >-
  Pledges are not legally binding and are self-reported. Not to be confused with the
  [[general-purpose-ai-code-of-practice|General-Purpose AI Code of Practice]], which has a formal
  role under the Act.
see_also:
  - EU AI Act
  - AI Office
  - General-Purpose AI Code of Practice
  - AI governance
as_of: 2026-10
