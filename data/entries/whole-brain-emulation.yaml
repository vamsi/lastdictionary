term: whole brain emulation
id: whole-brain-emulation
pos: n.
also:
  - WBE
  - brain emulation
  - em
  - emulation
domain: asi
domains:
  - mind
  - percep
level: specialist
plain: >-
  Copying a particular person's brain into a computer in such detail, down to individual neurons and
  their connections, that the simulation would think and behave like that person.
senses:
  - definition: >-
      The hypothetical copying of one particular brain into software: its structure is recorded in
      enough detail that a computer model, run on adequate hardware, behaves as the original would
      and, on functionalist views, has its mind. Anders Sandberg and Nick Bostrom's 2008 roadmap,
      which set the agenda, split the project into three technical problems: imaging every neuron
      and synapse plus relevant molecular detail (usually imagined as serial-section electron
      microscopy of preserved tissue), turning the images into accurate models of each component,
      and simulating the result fast enough; it argued that emulation needs scale and engineering
      rather than a theory of intelligence. Progress has come from connectomics: complete wiring
      diagrams of the nematode C. elegans (1986), an adult fruit fly brain (2024) and a cubic
      millimeter of mouse cortex (2025), though as of 2026 connectome-based simulations reproduce
      only limited aspects of an animal's behavior. In AI-risk analysis, emulations are an
      alternative route to [[superintelligence|superintelligence]], arguably safer because they
      would inherit human values.
    example: >-
      Whole brain emulation looked like the likeliest path to AGI in 2008; deep learning overtook it.
origin: >-
  The idea of copying minds into machines is older (George M. Martin, 1971; Hans Moravec, 1979 and
  1988). Earliest use of the phrase not established; it was popularized, and the research agenda
  set, by Anders Sandberg and Nick Bostrom's Whole Brain Emulation: A Roadmap (Future of Humanity
  Institute, 2008), which followed a 2007 workshop. Robin Hanson's The Age of Em (2016) imagined an
  economy run by emulations, which he called ems.
year: 2008
