term: Global Digital Compact
id: global-digital-compact
pos: prop. n.
also:
  - GDC
  - Pact for the Future
  - Summit of the Future
domain: gov
domains:
  - society
level: core
plain: >-
  A 2024 agreement among United Nations member countries setting shared goals for the digital world
  — closing digital divides, protecting rights online, governing data and AI — and creating new UN
  bodies on AI.
senses:
  - definition: >-
      A non-binding framework for global digital cooperation adopted by the United Nations General
      Assembly on 22 September 2024 as an annex to the Pact for the Future, the outcome document of
      the Summit of the Future in New York. Its five objectives cover connectivity and other digital
      divides, a wider share in the digital economy, human rights and security online, responsible
      and interoperable data governance, and international governance of AI. On AI, member states
      committed to create an [[independent-international-scientific-panel-on-ai|Independent
      International Scientific Panel on AI]] and a [[global-dialogue-on-ai-governance|Global
      Dialogue on AI Governance]] within the UN — both established by the General Assembly in August
      2025 — and to explore ways of financing AI capacity-building in developing countries. Unlike
      the Assembly's first resolution on AI (March 2024), it committed all member states to new UN
      bodies on AI, though its commitments are political rather than legal.
    example: >-
      The ministry's AI strategy cites the Global Digital Compact's pledge to close the AI capacity
      gap.
origin: >-
  Proposed by UN Secretary-General António Guterres in his 2021 report Our Common Agenda and
  negotiated in 2023–2024 under co-facilitators from Sweden and Zambia, drawing on recommendations
  of the [[high-level-advisory-body-on-artificial-intelligence|High-level Advisory Body on
  Artificial Intelligence]]. It was adopted without a vote with the Pact for the Future, after the
  Assembly voted to take no action on a Russian amendment.
year: 2024
note: >-
  Like most General Assembly outcomes it is voluntary. Supporters value its universality; critics,
  including some civil-society groups, faulted its general language and the limited role it gives
  non-governmental stakeholders. A high-level review of its implementation is planned for the
  Assembly's 82nd session.
