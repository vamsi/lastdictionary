# yaml-language-server: $schema=../schema/entry.schema.json

term: data contamination
id: data-contamination
pos: n.
also:
  - benchmark contamination
  - test set contamination
  - train–test overlap
  - decontamination
  - contamination
domain: data
domains:
  - eval
  - llm
level: core
plain: >-
  When the test questions used to grade an AI system were already in its training data, so a high
  score may reflect memorized answers rather than real ability.
senses:
  - definition: >-
      The presence of evaluation material — [[benchmark|benchmark]] questions, answers or close
      paraphrases — in a model's training data, which inflates measured performance and undermines
      comparisons. With web-scale [[pretraining-data|pretraining data]] it is hard to avoid:
      benchmarks are posted, discussed and solved online, and test items can arrive through code
      repositories, forums or synthetic data generated by other models. Detection methods include
      n-gram overlap searches against the training corpus when it is available,
      [[membership-inference-attack|membership-inference]] signals such as unusually high likelihood
      on test items, prompting a model to complete benchmark items verbatim, and comparing scores on
      a benchmark with freshly written equivalents. When the GSM1k benchmark recreated grade-school
      math problems in the style of [[gsm8k|GSM8K]], some models scored up to 8% lower, and the gap
      correlated with how readily they reproduced GSM8K items. Mitigations include decontaminating
      training data, [[canary-string|canary strings]], private held-out test sets and
      [[contamination-resistant-benchmark|benchmarks]] refreshed after models' training cutoffs.
    example: >-
      We removed every training document sharing a 13-gram with the test set before reporting
      results.
origin: >-
  Overlap between training and test data is an old worry in machine learning, but the term took hold
  with web-scale language models: the GPT-2 report (2019) measured overlap with 8-gram Bloom
  filters, and the GPT-3 paper (2020) devoted a section to measuring and removing benchmark
  contamination using 13-gram overlap.
year: 2020
note: >-
  Distinct from [[data-leakage|data leakage]], where information about the target slips into a
  model's inputs during development, though the terms overlap. Contamination need not be deliberate,
  and a contaminated model may still generalize; the problem is that the score no longer shows how
  much.
see_also:
