term: AI Promotion Act
id: ai-promotion-act
pos: prop. n.
also:
  - Act on the Promotion of Research and Development and Utilization of Artificial
    Intelligence-Related Technologies
  - Japan AI Promotion Act
  - Japanese AI Act
domain: gov
domains:
  - society
labels:
  - legal
level: specialist
plain: >-
  Japan's 2025 national AI law, which sets up a government AI headquarters and strategy to encourage
  AI development and use, relying on cooperation and guidance rather than fines.
senses:
  - definition: >-
      Japan's first AI-specific statute, the Act on the Promotion of Research and Development and
      Utilization of Artificial Intelligence-Related Technologies, enacted in May 2025. A framework
      law rather than a regulatory code, it sets the goal of making Japan a country where AI is easy
      to develop and use while addressing risks such as misuse, disinformation and infringement of
      rights; establishes an AI Strategy Headquarters in the Cabinet, chaired by the Prime Minister
      and including all ministers; and requires an AI Basic Plan, the first of which the Cabinet
      approved on December 23, 2025. Businesses using or supplying AI must make reasonable efforts
      to cooperate with government policy; the government gathers and analyzes information on AI use
      and misuse at home and abroad, issues guidelines and may request cooperation from any entity,
      but the act imposes no monetary penalties. It relies on existing law, such as copyright,
      privacy and product-safety rules, and on non-binding guidance such as the 2024 AI Guidelines
      for Business — an approach often described as agile or soft-law governance.
    example: >-
      Under the AI Promotion Act, the government can issue guidance and request cooperation, but it
      cannot fine the company.
origin: >-
  Drafted after a 2024 government study group on AI institutions and passed by the Diet on May 28,
  2025; it took effect in stages from June 2025, and the AI Strategy Headquarters first met in
  September 2025.
year: 2025
note: >-
  Japan's light-touch model contrasts with the [[eu-ai-act|EU AI Act]] and South Korea's
  [[ai-basic-act|AI Basic Act]]; together with Japan's permissive copyright rule for data analysis
  (see [[text-and-data-mining-exception|text and data mining exception]]), it is cited as an effort
  to attract AI investment.
