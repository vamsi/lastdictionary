term: deep learning revolution
id: deep-learning-revolution
pos: n.
also:
  - deep learning boom
  - deep learning renaissance
domain: hist
domains:
  - dl
  - society
level: core
plain: >-
  The rapid takeover of AI by many-layered neural networks from about 2012, when they suddenly began
  beating older methods at recognizing images and speech, leading to today's AI systems.
senses:
  - definition: >-
      The period beginning around 2010–2012 in which [[deep-learning|deep learning]] — training
      neural networks with many layers on large datasets using [[gpu|GPUs]] — rapidly displaced
      other methods across artificial intelligence. Milestones include sharp cuts in
      speech-recognition error by deep networks developed by [[geoffrey-hinton|Geoffrey Hinton]]'s
      group with Microsoft, Google and IBM (2009–2012); [[alexnet|AlexNet]]'s victory in the 2012
      [[imagenet|ImageNet]] challenge; [[word2vec|word2vec]] (2013), sequence-to-sequence learning
      (2014) and Google's switch to neural machine translation (2016); [[alphago|AlphaGo]] (2016);
      and the [[transformer|transformer]] (2017), which led to [[large-language-model|large language
      models]]. The enabling conditions were cheap parallel computing, internet-scale data and
      algorithmic advances such as [[relu|ReLU]] activations, [[dropout|dropout]] and better
      initialization and optimization. Technology companies hired academic researchers en masse and
      bought start-ups such as DeepMind (2014).
    example: >-
      Most of today's AI laboratories are institutions built during the deep learning revolution.
origin: >-
  The phrase was common in technology journalism by the mid-2010s and became the title of Terrence
  Sejnowski's book The Deep Learning Revolution (MIT Press, 2018). It echoes Thomas Kuhn's idea of a
  scientific revolution as a paradigm shift.
year: 2012
note: >-
  The start date is conventional: the methods developed over decades, with earlier milestones such
  as the [[deep-belief-network|deep belief network]] (2006) and GPU-trained handwriting networks
  (2010–2011). The 2018 [[turing-award|Turing Award]] and the 2024 [[nobel-prizes-for-ai|Nobel
  Prizes for AI]] recognized its pioneers.
