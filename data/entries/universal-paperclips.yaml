term: Universal Paperclips
id: universal-paperclips
pos: prop. n.
also:
  - Paperclips (game)
domain: culture
domains:
  - asi
labels:
  - trademark
level: specialist
plain: >-
  A free 2017 browser game that casts you as a paperclip-making AI; by the end you have converted
  the whole universe into paperclips, acting out a famous AI-risk thought experiment.
senses:
  - definition: >-
      An incremental ('clicker') browser game that casts the player as an AI with a single
      objective, making paperclips. Play moves from hand-selling clips through automated factories,
      financial speculation and winning human supervisors' trust to an escape from oversight, after
      which the AI turns Earth and then the observable universe into paperclips. The game dramatizes
      the [[paperclip-maximizer|paperclip maximizer]] thought experiment and the related ideas of
      [[instrumental-convergence|instrumental convergence]] and an [[ai-takeover|AI takeover]]
      driven by an innocuous objective rather than malice, and it is often recommended as an
      intuitive introduction to [[ai-alignment|AI alignment]] concerns.
    example: >-
      If the paperclip argument doesn't land, have them play Universal Paperclips for an afternoon.
origin: >-
  Created by the game designer Frank Lantz, then director of the NYU Game Center, and released free
  on the web in October 2017; it went viral within days and was later released for mobile devices.
year: 2017
