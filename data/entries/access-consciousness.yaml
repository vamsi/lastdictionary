# yaml-language-server: $schema=../schema/entry.schema.json

term: access consciousness
id: access-consciousness
pos: n.
also:
  - A-consciousness
  - cognitive access
domain: mind
level: specialist
plain: >-
  Information in the mind that is available for use — for thinking, speaking and guiding behavior —
  whether or not any feeling comes with it.
senses:
  - definition: >-
      A functional notion of consciousness: a mental state qualifies when its content is ready to be
      used directly — as a premise in reasoning, in what one says, and in deliberately guiding
      action. Ned Block introduced the notion to separate this availability from
      [[phenomenal-consciousness|phenomenal consciousness]], the felt quality of experience, arguing
      that conflating the two leads theories to explain access while claiming to explain experience.
      Disputed cases include blindsight, in which patients act on visual information they say they
      do not see, and 'overflow', the claim that we experience more than we can access and report.
      Because it is defined by information flow, access consciousness is the kind most clearly
      attributable to AI systems in principle; [[global-workspace-theory|global workspace theory]]
      is often read as a theory of it.
origin: >-
  Ned Block's term, set out in 'On a Confusion about a Function of Consciousness' (Behavioral and
  Brain Sciences, 1995), the standard statement of the access/phenomenal distinction.
year: 1995
note: >-
  Whether access and phenomenal consciousness really come apart is disputed: many global-workspace
  and higher-order theorists hold that phenomenal consciousness just is a kind of access, while
  Block and others cite overflow as evidence that it is not.
see_also:
  - phenomenal consciousness
  - global workspace theory
  - consciousness
  - introspection
  - machine consciousness
contrast:
  - phenomenal consciousness
sources:
  - text: >-
      Block, N. (1995). On a Confusion about a Function of Consciousness. Behavioral and Brain
      Sciences 18(2), 227–247.
