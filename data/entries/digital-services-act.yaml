  - sec
labels:
  - legal
level: specialist
plain: >-
  The EU law that sets rules for online platforms and search engines — how they handle illegal
  content, explain their recommendation algorithms and manage the risks their services create for
  society.
senses:
  - definition: >-
      Regulation (EU) 2022/2065 on a single market for digital services, which sets layered
      obligations for online intermediaries, hosting services and platforms: notice-and-action
      procedures for illegal content, statements of reasons for [[content-moderation|content
      moderation]] decisions, complaint handling and transparency reporting. Platforms must explain
      the main parameters of their [[recommender-system|recommender systems]]. Very large online
      platforms and search engines — those with at least 45 million monthly active users in the EU —
      must also assess and mitigate systemic risks such as the spread of illegal content, threats to
      fundamental rights, electoral integrity and public health, and harms to minors, including
      risks from generative AI and [[deepfake|deepfakes]]; offer at least one recommender option not
      based on profiling; undergo independent audits; and give vetted researchers data access. The
      Commission supervises the largest services directly, with fines of up to 6% of worldwide
      annual turnover.
    example: >-
      The platform's risk assessment under the Digital Services Act had to cover AI-generated
      election content.
origin: >-
  Proposed by the European Commission in December 2020 together with the Digital Markets Act;
  adopted on 19 October 2022, applying to the largest platforms from August 2023 and to all
  intermediaries from 17 February 2024.
year: 2022
note: >-
  The [[eu-ai-act|EU AI Act]] treats AI integrated into very large platforms as covered largely by
  the DSA's risk management; the 2026 [[digital-omnibus|Digital Omnibus]] gave the [[ai-office|AI
  Office]] supervision of such AI systems.
