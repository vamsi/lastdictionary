term: pivotal act
id: pivotal-act
pos: n.
also:
  - pivotal event
  - pivotal outcome
  - pivotal process
domain: asi
domains:
  - safety
  - gov
labels:
  - contested
level: specialist
plain: >-
  A single decisive action, usually imagined as carried out with an early powerful AI, that would
  stop anyone else from building dangerous AI and so change the world's long-term course.
senses:
  - definition: >-
      An action, usually imagined as carried out with the first sufficiently capable aligned system,
      that permanently improves how the transition to advanced AI turns out, typically by preventing
      anyone from building unaligned AGI afterwards. The standard illustration, deliberately
      extreme, is using AI-designed nanotechnology to melt every GPU in the world. The concept
      assumes that a period in which many actors can build dangerous AI is unstable, so the first
      safe project must end it; proponents conclude that alignment need only be solved well enough
      to perform one narrow, decisive task. Critics, notably Andrew Critch, argue that planning
      unilateral pivotal acts is itself dangerous, erodes trust between laboratories and governments
      and resembles a plan to seize power, and propose pivotal processes, such as coordinated
      international regulation, instead.
    example: >-
      No lab will admit to planning a pivotal act, but the race logic quietly assumes one.
origin: >-
  Introduced by Eliezer Yudkowsky in articles on the Arbital wiki around 2015–2016, which defined
  pivotal events and acts; it became widely discussed after his 2022 essay 'AGI Ruin: A List of
  Lethalities' and Andrew Critch's reply the same year, 'Pivotal outcomes and pivotal processes'.
