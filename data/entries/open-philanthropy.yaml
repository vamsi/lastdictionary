plain: >-
  A large American charitable foundation, renamed Coefficient Giving in 2025, that has been the
  biggest private funder of research on the risks of advanced AI.
senses:
  - definition: >-
      A grant-maker backed mainly by Dustin Moskovitz and Cari Tuna, through their foundation Good
      Ventures, that chooses causes by expected impact in the [[effective-altruism|effective
      altruism]] tradition and has been the largest private funder of work on risks from advanced
      AI. Its grants helped build the fields of [[ai-safety|AI safety]] and AI governance,
      supporting the [[center-for-human-compatible-ai|Center for Human-Compatible AI]], the
      [[alignment-research-center|Alignment Research Center]], [[mila|Mila]] and Georgetown
      University's [[center-for-security-and-emerging-technology|Center for Security and Emerging
      Technology]]; in 2017 it granted $30 million to [[openai|OpenAI]] and took a seat on its
      board. Its staff produced influential analyses of [[transformative-ai|transformative AI]],
      including the [[biological-anchors|biological anchors]] forecast (2020) and a report on
      [[explosive-growth|explosive growth]] (2021). Critics argue that so much funding from one
      source has given it outsized influence over the field's agenda and personnel. It also funds
      global health, biosecurity and animal welfare.
origin: >-
  Grew out of a partnership begun in 2011–2012 between Good Ventures and the charity evaluator
  GiveWell, co-founded by Holden Karnofsky; it took the name Open Philanthropy Project in 2014 and
  became an independent organization in 2017, with Alexander Berger later chief executive. It was
  renamed Coefficient Giving in November 2025 as it expanded its work with other donors.
year: 2014
note: >-
  Called Open Philanthropy (often 'Open Phil') in nearly all writing before late 2025; Coefficient
  Giving is the current name.
