term: Brussels effect
id: brussels-effect
pos: n.
also:
  - de facto Brussels effect
  - de jure Brussels effect
domain: gov
domains:
  - society
level: core
plain: >-
  The way European Union rules end up shaping products and laws worldwide, because global companies
  often find it simpler to follow the strictest big market's rules everywhere.
senses:
  - definition: >-
      The tendency of European Union rules to become worldwide norms, adopted outside the EU through
      market pressure or deliberate copying. In its de facto form, multinational firms apply EU
      standards worldwide because the EU market is large and maintaining separate products is
      costly; in its de jure form, other governments copy EU law, often after their firms have
      already adapted. The effect is credited with the global reach of the
      [[general-data-protection-regulation|General Data Protection Regulation]] and was an explicit
      hope behind the [[eu-ai-act|EU AI Act]]. Its strength for AI is disputed: AI services are
      comparatively easy to vary by market, providers can delay or withhold features in Europe, and
      the United States and China promote rival models of governance.
    example: >-
      The AI Act's authors were counting on a Brussels effect, but several providers simply launched
      later in Europe.
origin: >-
  Coined by Anu Bradford of Columbia Law School in the article 'The Brussels Effect' (Northwestern
  University Law Review, 2012), by analogy with the 'California effect' described by the political
  scientist David Vogel; developed in her book The Brussels Effect: How the European Union Rules the
  World (2020). Charlotte Siegmann and Markus Anderljung applied it to AI in a 2022 report.
year: 2012
note: >-
  Not specific to AI. Some scholars predict only a weak 'Brussels side-effect' for the AI Act, and
  the 2025 [[digital-omnibus|Digital Omnibus]] simplification package was read by some as a sign of
  retreat.
see_also:
  - EU AI Act
  - AI regulation
  - General Data Protection Regulation
  - AI governance
  - Digital Omnibus
sources:
  - text: >-
      Bradford, A. (2012). The Brussels Effect. Northwestern University Law Review, 107(1), 1–68.
  - text: >-
      Bradford, A. (2020). The Brussels Effect: How the European Union Rules the World. Oxford
      University Press.
  - text: >-
      Siegmann, C. & Anderljung, M. (2022). The Brussels Effect and Artificial Intelligence: How EU
      regulation will impact the global AI market. Centre for the Governance of AI.
