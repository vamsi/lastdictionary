level: core
dates: 1942–2024
plain: >-
  An American philosopher who argued that minds are what brains do, that consciousness can in
  principle be explained scientifically, and that we understand machines by treating them as if they
  had beliefs and goals.
senses:
  - definition: >-
      American philosopher of mind at Tufts University, where he co-directed the Center for
      Cognitive Studies, and a leading defender of the view that minds are what brains, and
      potentially machines, do. His [[intentional-stance|intentional stance]] (1971; book 1987)
      holds that attributing beliefs and desires to a system, whether person, animal or program, is
      justified to the extent that doing so predicts its behavior. In 'Consciousness Explained'
      (1991) he replaced the 'Cartesian theater' with a multiple-drafts model of parallel processes,
      and in essays such as 'Quining Qualia' (1988) he argued that [[qualia|qualia]], as
      philosophers define them, do not exist, a forerunner of [[illusionism|illusionism]]. His robot
      thought experiment in 'Cognitive Wheels' (1984) became a standard illustration of the
      [[frame-problem|frame problem]]. He chaired the prize committee of the early
      [[loebner-prize|Loebner Prize]] contests and, near the end of his life, warned that AI systems
      passing as humans, which he called counterfeit people, threaten social trust.
