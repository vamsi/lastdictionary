dates: b. 1964
plain: >-
  A Canadian computer scientist who helped found deep learning, including ideas behind today's
  language models, and who has become a leading voice on the risks of advanced AI.
senses:
  - definition: >-
      Paris-born Canadian computer scientist, professor at the Université de Montréal since 1993 and
      founder of [[mila|Mila]], the Quebec AI institute, which he directed until 2025. His 1994
      analysis with Patrice Simard and Paolo Frasconi showed why gradients vanish in
      [[recurrent-neural-network|recurrent networks]] (see [[vanishing-gradient-problem|vanishing
      gradient problem]]); his neural probabilistic language model (2000–2003) learned
      [[word-embedding|word embeddings]] jointly with a neural [[language-model|language model]];
      and his group produced the [[attention|attention]] mechanism for translation (Dzmitry
      Bahdanau, Kyunghyun Cho and Bengio, 2014) and [[generative-adversarial-network|generative
      adversarial networks]] (with [[ian-goodfellow|Ian Goodfellow]], 2014). He co-wrote the
      textbook 'Deep Learning' (2016). Since 2023 he has concentrated on AI safety: he chairs the
      [[international-ai-safety-report|International AI Safety Report]] and in June 2025 launched
      LawZero, a nonprofit developing non-agentic 'Scientist AI' as a safeguard against harmful AI
      agents. [[turing-award|Turing Award]] 2018 (with [[geoffrey-hinton|Geoffrey Hinton]] and
      [[yann-lecun|Yann LeCun]]); Queen Elizabeth Prize for Engineering 2025.
