term: augmentation
id: augmentation
pos: n.
also:
  - AI augmentation
  - augment
  - automation–augmentation paradox
domain: society
domains:
  - core
level: core
plain: >-
  Using AI to help people do their work better or faster while they stay in charge, instead of
  having the AI do the job on its own.
senses:
  - context: Work and economics
    definition: >-
      The use of AI or other technology to complement rather than replace human labor: the system
      takes over parts of a task, supplies information or drafts, or extends what a person can do,
      while the person remains responsible for the work and its outcome. Economically, augmentation
      raises the productivity and often the value of human skills, whereas [[automation|automation]]
      substitutes for them; in practice the two coexist, since a tool that augments each worker can
      reduce how many workers are needed. Analyses of real assistant usage, such as the Anthropic
      Economic Index (from 2025), classify interactions as augmentative (iterating, learning,
      checking work) or automative (delegating a task outright) and track how the balance shifts as
      agents improve. Field studies often find the largest gains for less experienced workers.
    example: >-
      The rollout was framed as augmentation: agents keep the case, and the model drafts replies for
      them to edit.
origin: >-
  The contrast between augmenting and replacing people goes back to Douglas Engelbart's 'Augmenting
  Human Intellect' (1962) and the [[intelligence-augmentation|intelligence augmentation]] tradition.
  In management and labor economics, automation versus augmentation became a standard frame in the
  late 2010s, formalized in Sebastian Raisch and Sebastian Krakowski's 'automation–augmentation
  paradox' (2021).
note: >-
  Distinct from [[data-augmentation|data augmentation]] in machine learning, which creates modified
  training examples, and from biomedical human enhancement.
see_also:
