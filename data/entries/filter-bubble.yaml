# yaml-language-server: $schema=../schema/entry.schema.json

term: filter bubble
id: filter-bubble
pos: n.
also:
  - echo chamber
  - information cocoon
domain: society
domains:
  - ml
labels:
  - contested
level: core
plain: >-
  A situation in which you see mostly news and opinions you already agree with, because apps choose
  what to show you based on what you clicked before.
senses:
  - definition: >-
      The hypothesized narrowing of what a person encounters online when personalization algorithms,
      such as [[recommender-system|recommender systems]] and personalized search, choose content
      from their past behavior, so that they meet ever more belief-confirming material without
      knowing what has been left out. It is related to, but distinct from, an echo chamber, which
      arises from people's own choices of sources and communities. Empirical evidence is mixed:
      large studies generally find that algorithmic curation narrows exposure to opposing views less
      than users' own choices do, that most people's media diets are more varied than the metaphor
      suggests, and that strong effects appear mainly in small, highly engaged groups. The concern
      has extended to chatbots that personalize answers or flatter users' existing views
      ([[sycophancy|sycophancy]]).
    example: >-
      The study found less of a filter bubble than feared: the feed showed opposing views, which
      users mostly skipped.
origin: >-
  Coined by internet activist Eli Pariser in The Filter Bubble: What the Internet Is Hiding from You
  (2011) and a TED talk the same year, which pointed to personalized Google results and Facebook's
  news feed. Earlier versions of the worry include Nicholas Negroponte's 'Daily Me' (1995),
  developed by legal scholar Cass Sunstein.
year: 2011
note: >-
  Chinese discussion uses 'information cocoon', a phrase popularized through translations of
  Sunstein, for a similar concern.
see_also:
  - recommender system
  - engagement optimization
  - homogenization
  - misinformation
  - sycophancy
sources:
  - text: >-
      Pariser, E. (2011). The Filter Bubble: What the Internet Is Hiding from You. Penguin Press.
  - text: >-
      Bakshy, E., Messing, S. & Adamic, L. A. (2015). Exposure to ideologically diverse news and
      opinion on Facebook. Science 348(6239), 1130–1132.
