term: behaviorism
id: behaviorism
pos: n.
also:
  - behaviourism
  - behaviorist
  - logical behaviorism
  - philosophical behaviorism
  - radical behaviorism
domain: mind
domains:
  - hist
level: specialist
plain: >-
  The view that the mind should be studied, or even defined, only through observable behavior rather
  than inner thoughts or feelings. It shapes debates about whether AI that acts intelligently really
  is intelligent.
senses:
  - context: Psychology
    definition: >-
      The program, dominant in American psychology from about 1913 to the 1950s, that restricted
      scientific psychology to observable behavior and its relations to stimuli and reinforcement,
      rejecting [[introspection|introspection]] and talk of inner mental states. John B. Watson
      founded it, and B. F. Skinner developed radical behaviorism around operant conditioning, whose
      ideas of reward and punishment fed into [[reinforcement-learning|reinforcement learning]]. The
      cognitive revolution of the 1950s and 1960s, out of which [[cognitive-science|cognitive
      science]] grew, displaced it by showing the need to posit internal representations and
      processes.
  - context: Philosophy
    definition: >-
      Logical or analytical behaviorism: the thesis that statements about mental states mean, or can
      be translated into, statements about actual and possible behavior, so that to be in pain is to
      be disposed to wince, cry out and seek relief. Associated with Gilbert Ryle and Carl Hempel,
      it was largely abandoned in favor of [[functionalism|functionalism]], because mental states
      seem to cause behavior and to depend on one another. Its spirit survives in debates over
      whether behavioral tests such as the [[turing-test|Turing test]] can establish intelligence,
      which arguments such as [[blockhead|Blockhead]] and the [[chinese-room|Chinese room]] dispute.
    example: >-
      Judging the model only by its answers is a kind of behaviorism, and Blockhead shows why that
      may not be enough.
origin: >-
  Named by John B. Watson in 'Psychology as the Behaviorist Views It' (Psychological Review, 1913).
  Gilbert Ryle's The Concept of Mind (1949) is the classic of philosophical behaviorism, and Noam
  Chomsky's 1959 review of B. F. Skinner's Verbal Behavior helped end its dominance in the study of
  language.
year: 1913
