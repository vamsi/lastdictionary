term: code execution
id: code-execution
pos: n.
also:
  - code interpreter
  - code execution tool
  - code as action
  - CodeAct
  - executable code actions
domain: agents
domains:
  - llm
  - sec
level: core
plain: >-
  Letting an AI write a small program and actually run it — to do math, analyze a spreadsheet or
  test its own code — then use the real output instead of guessing.
senses:
  - definition: >-
      The capability, offered to a model as a [[tool|tool]], to run code it has written — typically
      Python or shell commands — and receive the output, errors and any files produced. It gives
      [[large-language-model|language models]] exact computation, data analysis and charting, file
      conversion and the ability to test software, and lets [[coding-agent|coding agents]] run
      builds and test suites. Code can also serve as an agent's entire action format: in the CodeAct
      approach (Xingyao Wang et al., 2024) the model emits executable Python instead of JSON
      [[tool-call|tool calls]], composing many operations, loops and conditionals in one step, which
      the authors found raised success rates by up to 20 percentage points. Because model-written
      code may be wrong or steered by [[prompt-injection|prompt injection]], execution normally
      happens in a [[sandbox|sandbox]] — a container, micro-VM or WebAssembly runtime with limited
      file-system, network and time access.
    example: >-
      Turn on code execution so the model computes the totals rather than estimating them.
origin: >-
  Program-aided language models (PAL; Luyu Gao et al., 2022) and Program of Thoughts (Wenhu Chen et
  al., 2022) had models write code for an interpreter to run. OpenAI's Code Interpreter for ChatGPT
  (2023, later renamed Advanced Data Analysis) brought the idea to the public, and model providers
  later offered server-side code-execution tools in their APIs.
year: 2022
note: >-
  Distinct from [[code-generation|code generation]], which only writes code; execution closes the
  loop by running it and feeding back the results.
