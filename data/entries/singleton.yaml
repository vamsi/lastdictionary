term: singleton
id: singleton
pos: n.
domain: asi
domains:
  - gov
  - society
level: specialist
plain: >-
  A possible future world run by a single decision-maker at the top, such as one government, one
  alliance or one AI, with no rival able to challenge it.
senses:
  - definition: >-
      A world in which one authority has the final say: in [[nick-bostrom|Nick Bostrom]]'s
      definition, 'a single decision-making agency at the highest level', able to defeat any
      challenge to its position and to control the main features of its domain. The authority might
      be a world government, a dominant alliance, a universally enforced code or a
      [[superintelligence|superintelligence]] holding a [[decisive-strategic-advantage|decisive
      strategic advantage]]; it need not be malign, and internally it could be quite decentralized.
      Bostrom argued that a singleton could solve global coordination problems, such as arms races
      or the depletion of shared resources, that a world of competing powers cannot, but that it
      also risks permanent tyranny or [[value-lock-in|value lock-in]] with no external check. The
      singleton–multipolar distinction is a basic axis in analyses of how the transition to advanced
      AI might end.
    example: Both the utopian and the dystopian scenarios in the paper end in a singleton.
origin: >-
  Introduced by Nick Bostrom in 'What is a Singleton?' (Linguistic and Philosophical Investigations,
  2006) and used extensively in Superintelligence (2014).
year: 2006
note: >-
  Unrelated to the singleton design pattern in software (a class with exactly one instance) and to
  the one-element set of mathematics.
see_also:
  - multipolar scenario
  - decisive strategic advantage
  - value lock-in
  - AI takeover
  - concentration of power
  - Nick Bostrom
contrast:
  - multipolar scenario
sources:
  - text: >-
      Bostrom, N. (2006). What is a Singleton? Linguistic and Philosophical Investigations 5(2):
      48–54.
