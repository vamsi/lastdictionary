level: specialist
plain: >-
  An American management professor at Wharton whose experiments and popular writing on how people
  use AI at work introduced ideas such as the 'jagged frontier'.
senses:
  - definition: >-
      American professor of management at the Wharton School of the University of Pennsylvania who
      studies entrepreneurship, innovation and the effects of AI on work. With Fabrizio Dell'Acqua
      and colleagues he ran a 2023 field experiment with Boston Consulting Group consultants using
      [[gpt-4|GPT-4]], which found large gains in speed and quality on tasks inside AI's capability
      frontier but more errors on a task outside it — a pattern they named the
      [[jagged-frontier|jagged frontier]] — and distinguished users who divide work with AI
      ([[centaur|centaurs]]) from those who interweave it (cyborgs). His widely read newsletter One
      Useful Thing and his book 'Co-Intelligence: Living and Working with AI' (2024), which
      popularized [[co-intelligence|co-intelligence]], encourage people to learn AI's strengths and
      weaknesses by using it directly. He co-directs Wharton's generative-AI research lab.
see_also:
