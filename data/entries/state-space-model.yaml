plain: >-
  A type of sequence model that reads text like a running tally, updating a fixed-size internal
  summary at each step, so its memory and cost do not balloon as texts get longer.
senses:
  - context: Deep learning
    definition: >-
      A sequence-modeling layer derived from linear state-space systems in control theory, in which
      a hidden state evolves under a linear rule driven by the input and is read out linearly,
      discretized for sequences of tokens. Because early designs are linear and time-invariant, the
      output over a whole sequence can be computed in parallel as one long convolution during
      training and step by step as a recurrence with constant memory during generation. S4 (2021)
      made this practical with a structured parameterization of the state matrix rooted in HiPPO, a
      theory of compressing a signal's history online, and excelled on long-range benchmarks.
      Language modeling required input-dependent ('selective') parameters, introduced in
      [[mamba|Mamba]] (2023), which narrowed the gap to [[transformer|transformers]]. SSMs remain
      weaker at exact copying and recall from long context, since their fixed state must compress
      the past, which motivates [[hybrid-architecture|hybrids]] with attention.
    example: >-
      The SSM layers keep a 16-dimensional state per channel, so generation memory is constant.
  - context: Statistics and control
    definition: >-
      A model of a dynamic system as an unobserved state that evolves over time, together with noisy
      observations of that state, as in the Kalman filter; standard in time-series analysis,
      econometrics and control engineering. The deep-learning sense borrows its linear form.
formula_latex: h_t = \bar{A}\, h_{t-1} + \bar{B}\, x_t, \qquad y_t = C\, h_t
origin: >-
  State-space methods entered control engineering with Rudolf Kálmán around 1960. At Stanford,
  Albert Gu and colleagues introduced HiPPO (2020) and S4 (Albert Gu, Karan Goel and Christopher Ré,
  October 2021), establishing deep SSMs; Mamba (Albert Gu and Tri Dao, December 2023) adapted them
  to language.
year: 2021
