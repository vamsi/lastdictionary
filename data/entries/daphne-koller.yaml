dates: b. 1968
plain: >-
  An Israeli-American computer scientist who wrote the standard text on probabilistic reasoning in
  AI, co-founded the online-course company Coursera, and founded a machine-learning drug-discovery
  company.
senses:
  - definition: >-
      Israeli-American computer scientist, a leading figure in probabilistic machine learning and
      founder of the drug-discovery company insitro. As a professor at Stanford University from 1995
      she worked on representing and reasoning with uncertainty, developing probabilistic relational
      models and writing, with Nir Friedman, 'Probabilistic Graphical Models: Principles and
      Techniques' (2009), the field's standard text (see
      [[probabilistic-graphical-model|probabilistic graphical model]], [[bayesian-network|Bayesian
      network]]). She applied these methods to biology and genomics and received a MacArthur
      Fellowship (2004) and the inaugural ACM-Infosys Foundation Award, now the ACM Prize in
      Computing. Her online version of the Stanford graphical-models course helped launch Coursera,
      which she co-founded with [[andrew-ng|Andrew Ng]] in 2012. After serving as chief computing
      officer of Alphabet's aging-research company Calico, she founded insitro (2018), which
      combines machine learning with large-scale biological experiments to find drug targets.
