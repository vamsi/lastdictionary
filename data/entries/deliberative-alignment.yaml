# yaml-language-server: $schema=../schema/entry.schema.json

term: deliberative alignment
id: deliberative-alignment
pos: n.
domain: safety
domains:
  - train
  - llm
labels:
  - emerging
level: specialist
plain: >-
  A training method in which an AI is taught the actual text of its safety rules and learns to think
  through which rules apply before it answers a sensitive request.
senses:
  - definition: >-
      A post-training method, developed at OpenAI, in which a [[reasoning-model|reasoning model]]
      learns the actual wording of its safety policies and is trained to bring the relevant passages
      to mind, and work out how they apply, in its [[chain-of-thought|chain of thought]] before it
      answers. Training data are generated by the model itself: given a prompt with the relevant
      specification in context, it produces reasoning that cites the specification and a compliant
      answer; the specification is then removed, and the model is fine-tuned to reproduce the
      reasoning and answer without it. A reinforcement-learning stage follows, in which a judge
      model with access to the specification grades responses. People write the specifications but
      none of the reasoning examples. Its developers reported that o1 trained this way resisted
      [[jailbreak|jailbreaks]] markedly better than GPT-4o while refusing benign requests less often
      ([[over-refusal|over-refusal]]), and that it coped better with unfamiliar inputs such as
      encoded or non-English prompts; they attribute this to the model learning the policy's reasons
      rather than only input–output patterns from labeled examples.
    example: >-
      Thanks to deliberative alignment, the model's reasoning quoted the relevant section of the
      spec before it declined.
origin: >-
  Introduced by Melody Guan, Manas Joglekar, Eric Wallace and colleagues at OpenAI in 'Deliberative
  Alignment: Reasoning Enables Safer Language Models' (December 2024), which described how the
  company's o-series reasoning models were aligned.
year: 2024
note: >-
  Related to [[constitutional-ai|Constitutional AI]], which also trains from written principles, but
  there the principles guide AI feedback during training and are not recalled by the deployed model
  when it answers.
see_also:
  - model specification
  - Constitutional AI
  - reasoning model
  - safe completion
  - refusal
  - chain of thought
contrast:
  - Constitutional AI
sources:
  - text: >-
      Guan, M. Y., Joglekar, M., Wallace, E. et al. (2024). Deliberative Alignment: Reasoning
      Enables Safer Language Models. arXiv:2412.16339.
    url: https://arxiv.org/abs/2412.16339
