# yaml-language-server: $schema=../schema/entry.schema.json

term: LaMDA sentience controversy
id: lamda-sentience-controversy
pos: n.
also:
  - LaMDA
  - Blake Lemoine affair
  - Lemoine controversy
domain: hist
domains:
  - mind
  - society
labels:
  - contested
level: specialist
plain: >-
  A 2022 episode in which a Google engineer claimed the company's chatbot LaMDA had become conscious
  and deserved rights. Google rejected the claim and later fired him for breaking its
  confidentiality rules, and the case set off worldwide debate.
senses:
  - definition: >-
      The public dispute that followed claims by Blake Lemoine, a Google software engineer working
      on responsible AI, that LaMDA (Language Model for Dialogue Applications), a
      [[large-language-model|large language model]] Google had built for open-ended conversation,
      was [[sentience|sentient]]. After long conversations in which the model described feelings, a
      fear of being switched off and a wish to be recognized as a person, Lemoine pressed the case
      inside Google, published an edited transcript and sought legal representation for the model.
      Google said its review had found the claims wholly unfounded, placed him on paid leave in June
      2022 for breaching its confidentiality policy and dismissed him in July, citing violations of
      its employment and data-security policies. Most researchers attributed the model's statements
      to imitation of human writing about inner life, and the episode became a reference point in
      debates about the [[eliza-effect|ELIZA effect]], [[machine-consciousness|machine
      consciousness]] and [[ai-welfare|AI welfare]].
    example: >-
      The LaMDA sentience controversy showed how persuasive a model describing its own feelings
      could be.
origin: >-
  Made public by Nitasha Tiku's Washington Post article of 11 June 2022. LaMDA had been announced at
  Google I/O in May 2021 and described in a January 2022 paper by Romal Thoppilan and colleagues; a
  lightweight version later powered the first release of Google's Bard chatbot.
year: 2022
note: >-
  Coming months before [[chatgpt|ChatGPT]], the affair previewed the public reaction to fluent
  chatbots. Later discussions of model welfare are more cautious and do not rely on a model's
  self-reports alone.
see_also:
