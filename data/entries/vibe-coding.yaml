term: vibe coding
id: vibe-coding
pos: n.
also:
  - vibe code
  - vibe-coded
  - vibe coder
  - vibecoding
domain: culture
domains:
  - eng
  - agents
labels:
  - informal
level: essential
plain: >-
  Programming by conversation: you ask an AI for what you want, try out what it produces and ask
  again until it works, trusting the code without really reading it.
senses:
  - definition: >-
      A way of building software by conversation in which the person judges an AI
      [[coding-agent|coding agent]]'s work only by how the program behaves: they ask for features in
      plain language, run the result, feed back errors or new wishes, and accept the changes without
      reading or understanding the code. In its original sense the term named a deliberate trade of
      review and comprehension for speed, tolerable for prototypes, personal tools and throwaway
      projects, and distinct from AI-assisted engineering, in which a developer reviews, tests and
      answers for every change. In wider use it has broadened to mean almost any software
      development done mainly by prompting, a dilution some programmers resist. Concerns include
      security flaws, unmaintainable code, [[slopsquatting|hallucinated dependencies]] and the
      erosion of skills; proponents stress that it lets people who cannot program build working
      software.
    example: >-
      Vibe code the weekend prototype if you like, but nothing vibe-coded ships to production
      without review.
origin: >-
  Coined by Andrej Karpathy in a post on X on 2 February 2025 describing a style of coding in which
  one goes with the vibes and can 'forget that the code even exists'. Merriam-Webster added it to
  its 'Slang & Trending' section in 2025, and Collins English Dictionary named it its Word of the
  Year for 2025 (announced 6 November 2025).
year: 2025
note: >-
  Simon Willison and others argue that the term should keep its narrow meaning — code its author has
  not reviewed — rather than cover all AI-assisted programming. Spin-offs include
  [[vibe-engineering|vibe engineering]] for the disciplined, review-heavy alternative and
  [[vibe-hacking|vibe hacking]] for AI-assisted cybercrime.
