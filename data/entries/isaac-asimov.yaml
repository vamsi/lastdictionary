level: core
dates: 1920–1992
plain: >-
  A Russian-born American science-fiction writer and biochemist who invented the Three Laws of
  Robotics and is credited with the first use of the word 'robotics'.
senses:
  - definition: >-
      Russian-born American science-fiction writer whose robot stories introduced the
      [[three-laws-of-robotics|Three Laws of Robotics]]; a biochemist by training who held a
      professorship at Boston University, he had some 500 books to his name as author or editor.
      First stated in full in 'Runaround' (1942), gathered with other stories in 'I, Robot' (1950)
      and developed in later novels, the laws forbid a robot to harm humans, require it to obey them
      and allow it to protect itself, in that order of priority; he later added a 'Zeroth Law'
      putting humanity as a whole first. Many of the stories turn on robots following their laws to
      unexpected and unwanted conclusions, an early fictional treatment of problems AI researchers
      now discuss as [[specification-gaming|specification gaming]] and [[value-alignment|value
      alignment]]. The Oxford English Dictionary credits him with the first use of the word
      [[robotics|robotics]], in the story 'Liar!' (1941), and his 'positronic brain' became a
      science-fiction staple.
