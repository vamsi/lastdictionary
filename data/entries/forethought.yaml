plain: >-
  A small Oxford research nonprofit that asks what problems, besides keeping AI safe, the rapid
  arrival of superintelligent AI would create, from power grabs to the rights of digital minds.
senses:
  - definition: >-
      A research nonprofit concerned with the problems, apart from technical alignment, that the
      arrival of [[superintelligence|superintelligence]] would pose, and with how societies might
      prepare for them. Its 2025 papers include 'Preparing for the Intelligence Explosion' (William
      MacAskill and Fin Moorhouse), which argues that AI-driven research could compress a century of
      technological change into a few years and confront humanity with many 'grand challenges' at
      once; 'AI-Enabled Coups' (Tom Davidson, Lukas Finnveden and Rose Hadshar), on how a small
      group could use advanced AI to seize power; analyses of whether automating AI research would
      set off a software-driven [[intelligence-explosion|intelligence explosion]]; and MacAskill's
      'Better Futures' essays on aiming for flourishing rather than mere survival. It also works on
      [[ai-welfare|rights for digital minds]], AI for better collective reasoning, and how AI
      systems should behave.
origin: >-
  Established in Oxford as Forethought Research, a nonprofit company directed by Max Dalton, with
  MacAskill and Davidson as senior research fellows; it published its first major papers in March
  2025. It is associated with the [[effective-altruism|effective altruism]] and
  [[longtermism|longtermism]] research community.
