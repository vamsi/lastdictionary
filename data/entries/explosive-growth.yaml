term: explosive growth
id: explosive-growth
pos: n.
also:
  - explosive economic growth
  - AI-driven explosive growth
domain: asi
domains:
  - society
labels:
  - contested
level: specialist
plain: >-
  A hypothetical jump in the world economy's growth rate to 30% a year or more, about ten times
  today's pace, which some economists think AI that replaces human workers could cause.
senses:
  - definition: >-
      A sustained acceleration of gross world product growth far above the modern norm of about 3% a
      year, conventionally to more than 30% a year, so that the world economy would double every two
      to three years or faster. The case that AI could cause it comes from growth theory: if AI can
      substitute for human labor in most tasks, including research, output can be reinvested in more
      AI and robots without the bottleneck of population growth, recreating the feedback loop that,
      on some readings of economic history, produced accelerating growth before the demographic
      transition. Skeptics point to tasks that resist automation and come to dominate costs (Baumol
      effects), limits from physical capital and energy, regulation, and slow diffusion of
      technology, and note that measured productivity gains from AI so far are modest. The concept
      serves as an operational definition of [[transformative-ai|transformative AI]] and as a marker
      in debates about [[slow-takeoff|slow takeoff]].
    example: >-
      A 30% growth rate sounds absurd until you remember that 3% would have sounded absurd in 1700.
origin: >-
  Analyzed in Tom Davidson's 2021 Open Philanthropy report 'Could Advanced AI Drive Explosive
  Economic Growth?', which used the 30% threshold and built on David Roodman's 2020 model of
  long-run hyperbolic growth; developed further by economists including Philip Trammell and Anton
  Korinek, and by Ege Erdil and Tamay Besiroglu of Epoch AI (2023).
year: 2021
