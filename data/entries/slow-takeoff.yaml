term: slow takeoff
id: slow-takeoff
pos: n.
also:
  - soft takeoff
  - continuous takeoff
  - gradual takeoff
domain: asi
domains:
  - safety
  - society
level: core
plain: >-
  A scenario in which AI becomes superhuman step by step, over years or decades, as it spreads
  through the economy, giving society time to spot problems and respond.
senses:
  - definition: >-
      A [[takeoff|takeoff]] in which the move from roughly human-level AI to
      [[superintelligence|superintelligence]] unfolds over years or longer, with capabilities
      improving continuously and many actors deploying increasingly capable systems along the way.
      Paul Christiano's widely used operationalization is economic: world output will double over
      some complete four-year period before it ever doubles within a single year. Proponents,
      including Christiano and the economist Robin Hanson, argue that competitive pressure means
      less capable but still useful systems will be built and deployed before transformative ones,
      so a sudden jump is unlikely. A slow takeoff in this sense can still be very fast by
      historical standards, and it carries its own risks, such as [[gradual-disempowerment|gradual
      disempowerment]] and racing among many developers, even as it allows learning from
      intermediate failures.
    example: >-
      Even a slow takeoff, in Christiano's sense, means world output doubling within a few years.
origin: >-
  Early singularity writing contrasted a 'hard takeoff' with a 'slow' or 'soft' one; Eliezer
  Yudkowsky's Creating Friendly AI (2001) says 'slow takeoff'. Paul Christiano's February 2018 blog
  post 'Takeoff speeds' and AI Impacts' studies of historical discontinuities in technological
  progress recast the debate around continuity; 'slow' and 'continuous' takeoff are now the usual
  terms.
see_also:
