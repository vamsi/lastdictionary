# yaml-language-server: $schema=../schema/entry.schema.json

term: windfall clause
id: windfall-clause
pos: n.
domain: gov
domains:
  - society
  - asi
level: specialist
plain: >-
  A proposed promise by AI companies to give away a large share of any enormous profits they make if
  their AI transforms the economy, so that the gains are widely shared.
senses:
  - definition: >-
      A proposed voluntary but legally binding commitment by an AI developer to donate to the public
      benefit a share of any profits exceeding an extremely high threshold, expressed as a fraction
      of gross world product, with the donated share rising in tiers as profits grow. It targets the
      possibility that [[transformative-ai|transformative AI]] could give a single firm
      unprecedented wealth and power, aiming to spread the gains while costing little in
      expectation, since payment is due only in an unlikely windfall scenario. Its proponents
      examine enforceability under US corporate law and directors' fiduciary duties, how to choose
      beneficiaries, and how to distribute funds. The idea resembles [[openai|OpenAI]]'s 2019
      capped-profit structure, in which investor returns above a fixed multiple were to flow to the
      nonprofit parent (replaced in its 2025 recapitalization), and features in debates on sharing
      the benefits of AI and on [[universal-basic-income|universal basic income]].
    example: >-
      Under a windfall clause, the lab would owe a rising share of any profits above a set fraction
      of world output.
origin: >-
  Proposed by Cullen O'Keefe, Peter Cihon, Ben Garfinkel, Carrick Flynn, Jade Leung and Allan Dafoe
  of the Centre for the Governance of AI, then at Oxford's Future of Humanity Institute, in a report
  and in a paper presented at the AAAI/ACM Conference on AI, Ethics, and Society in February 2020.
year: 2020
note: >-
  Critics doubt that such a pledge would be honored or enforceable in the very scenario it targets,
  when the firm might hold great economic and political power.
see_also:
  - transformative AI
  - OpenAI
  - AI governance
  - universal basic income
  - technological unemployment
  - Future of Humanity Institute
sources:
  - text: >-
      O'Keefe, C., Cihon, P., Garfinkel, B., Flynn, C., Leung, J. & Dafoe, A. (2020). The Windfall
      Clause: Distributing the Benefits of AI for the Common Good. Proceedings of AIES 2020.
