plain: >-
  An American philosopher who devised the Chinese room argument, which holds that a computer running
  a program can manipulate symbols without understanding anything.
senses:
  - definition: >-
      American philosopher whose [[chinese-room|Chinese room]] thought experiment, set out in
      'Minds, Brains, and Programs' (1980), is the classic argument that a computer cannot
      understand anything merely by running the right program. A person who answers questions in
      Chinese by following a rule book, without knowing Chinese, stands in for the computer: the
      replies may be flawless, yet the symbols mean nothing to the one manipulating them, because
      syntax alone does not produce meaning. The same paper drew the distinction between
      [[strong-ai|strong AI]], the claim that a suitably programmed computer literally has a mind,
      and weak AI, its use as a tool for studying the mind. Searle taught at the University of
      California, Berkeley, from 1959 and was already known for his theory of speech acts. His
      positive view, [[biological-naturalism|biological naturalism]], holds that consciousness and
      [[intentionality|intentionality]] are biological phenomena caused by specific brain processes.
      The argument remains among the most debated in philosophy of mind and resurfaced in arguments
      over [[machine-understanding|machine understanding]] in [[large-language-model|large language
      models]].
