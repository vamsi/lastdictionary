term: Koray Kavukcuoglu
id: koray-kavukcuoglu
sort_as: Kavukcuoglu Koray
pos: prop. n.
pronunciation: koh-RYE kah-VOOK-choh-loo
domain: people
domains:
  - dl
  - rl
  - orgs
level: specialist
plain: >-
  A Turkish-born computer scientist who co-authored many of DeepMind's landmark papers and in 2026
  took charge of Google DeepMind as its senior vice president.
senses:
  - definition: >-
      Turkish-born computer scientist who in August 2026 became senior vice president of
      [[google-deepmind|Google DeepMind]], reporting to Google's chief executive Sundar Pichai and
      overseeing Gemini model development, frontier research and the Gemini app and developer teams.
      During a doctorate with [[yann-lecun|Yann LeCun]] at New York University on learning visual
      features with sparse coding and convolutional networks, he co-developed the Torch7
      machine-learning library (2011), a forerunner of [[pytorch|PyTorch]]. Joining DeepMind in its
      early years, he led its deep-learning research and co-authored many of the lab's landmark
      papers, including the [[deep-q-network|deep Q-network]] (2013–2015), spatial transformer
      networks (2015), the PixelRNN and PixelCNN models that established
      [[autoregressive-image-generation|autoregressive image generation]] (2016),
      [[wavenet|WaveNet]] (2016), [[a3c|A3C]] (2016) and the [[vq-vae|VQ-VAE]] (2017). As vice
      president of research and later chief technology officer of Google DeepMind he oversaw much of
      its work on [[gemini|Gemini]]; in 2025 Google named him its chief AI architect, and in 2026 he
      took over day-to-day leadership of the lab when [[demis-hassabis|Demis Hassabis]] became its
      chair and Alphabet's chief scientist.
