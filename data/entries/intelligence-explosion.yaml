# yaml-language-server: $schema=../schema/entry.schema.json

term: intelligence explosion
id: intelligence-explosion
pos: n.
also:
  - software intelligence explosion
domain: asi
domains:
  - safety
labels:
  - contested
level: core
plain: >-
  The idea that once AI gets good enough at improving AI, each smarter version could build a smarter
  one faster still, so abilities would snowball far beyond human level in a short time.
senses:
  - definition: >-
      A hypothesized runaway increase in machine intelligence driven by a feedback loop in which AI
      systems improve the systems that succeed them. If AI can do AI research at least as well as
      human researchers, each gain in capability speeds up the next, and progress could accelerate
      until it meets physical or economic limits, possibly within months. A 2025 analysis by Tom
      Davidson, Rose Hadshar and William MacAskill of the research group Forethought distinguishes
      three types by what must be automated: a software intelligence explosion, in which AI improves
      algorithms and training methods on existing chips; an AI-technology intelligence explosion, in
      which AI also improves chip technology; and a full-stack intelligence explosion, in which AI
      and robots also expand chip production. Whether any loop explodes or fizzles depends on
      whether research returns diminish faster than capability grows, a quantitative question about
      algorithmic progress, [[scaling-laws|scaling laws]] and [[compute|compute]] bottlenecks on
      which forecasters still disagree.
    example: >-
      If returns to software research hold up, automating our researchers could set off an
      intelligence explosion within a year.
origin: >-
  Coined by I. J. Good in 1965, who argued that an ultraintelligent machine could design better
  machines, so there would 'unquestionably be an intelligence explosion'. Eliezer Yudkowsky and the
  Singularity Institute (now MIRI) revived the phrase in the 2000s, David Chalmers analyzed it
  philosophically in 2010, and from 2021 economists and forecasters such as Tom Davidson began
  modeling it quantitatively.
year: 1965
note: >-
  Often equated with the [[technological-singularity|technological singularity]], but the explosion
  is a mechanism and the singularity a claimed consequence. Skeptics argue that research is
  bottlenecked by experiments, compute and physical capital rather than by thinking speed, so
  automating researchers would speed progress far less than the feedback picture implies.
see_also:
