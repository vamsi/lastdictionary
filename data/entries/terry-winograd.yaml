plain: >-
  An American computer scientist who built SHRDLU, a celebrated early program that conversed in
  English about a world of blocks, and later became a critic of symbolic AI.
senses:
  - definition: >-
      American computer scientist, professor emeritus at Stanford University. His MIT doctoral
      program [[shrdlu|SHRDLU]] (1968–70) conversed in English about a simulated world of blocks,
      parsing commands, answering questions and carrying out actions, and was the most celebrated
      natural-language system of its day ('Understanding Natural Language', 1972). An example
      sentence from that work, in which deciding what 'they' refers to requires knowledge of the
      world, inspired the [[winograd-schema-challenge|Winograd schema challenge]] (2011), a test of
      [[commonsense-reasoning|commonsense reasoning]]. At Stanford from 1973 he became a critic of
      [[symbolic-ai|symbolic AI]]: 'Understanding Computers and Cognition' (1986, with Fernando
      Flores) drew on Heidegger to argue that computers cannot understand language as people do, and
      he redirected his work toward human–computer interaction and design. He was a founding member
      of Computer Professionals for Social Responsibility and advised the doctoral work of Larry
      Page, with whom he co-authored the 1999 report describing PageRank.
