# yaml-language-server: $schema=../schema/entry.schema.json

term: moral crumple zone
id: moral-crumple-zone
pos: n.
also:
  - moral crumple zones
domain: society
domains:
  - safety
  - gov
labels:
  - figurative
level: specialist
plain: >-
  When a largely automated system goes wrong and the human who was supposed to supervise it gets
  blamed, even though they had little real say; named after the car part that soaks up a crash.
senses:
  - definition: >-
      The position a human operator can be left in when a partly automated system fails: blamed,
      morally and legally, for an outcome the automation largely determined and the person had
      little power to prevent. The image inverts the car part it borrows from: a crumple zone
      deforms to shield the people inside, whereas here a person takes the blame and the system and
      its makers come away unscathed. Cases include pilots blamed after confusing autopilot handoffs
      and safety drivers blamed in self-driving car crashes. The concept warns that
      [[human-in-the-loop|human-in-the-loop]] designs can create a nominal overseer who lacks the
      time, information or authority to intervene, and it argues for allocating responsibility
      according to actual control and for designing oversight that is meaningful rather than
      symbolic.
    example: >-
      Putting a reviewer on every AI decision without time to check them just builds a moral crumple
      zone.
origin: >-
  Coined by anthropologist Madeleine Clare Elish in a paper first presented at the We Robot
  conference in 2016 and published as 'Moral Crumple Zones: Cautionary Tales in Human-Robot
  Interaction' (Engaging Science, Technology, and Society, 2019), drawing on cases such as the 2009
  loss of Air France Flight 447.
year: 2016
see_also:
  - responsibility gap
  - automation bias
  - human oversight
  - human-in-the-loop
  - AI liability
  - deskilling
sources:
  - text: >-
      Elish, M. C. (2019). Moral Crumple Zones: Cautionary Tales in Human-Robot Interaction.
      Engaging Science, Technology, and Society 5, 40–60.
