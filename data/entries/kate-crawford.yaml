plain: >-
  An Australian scholar who studies the social, political and environmental costs of AI, co-founded
  the AI Now Institute, and wrote 'Atlas of AI'.
senses:
  - definition: >-
      Australian scholar who examines the social, political and material costs of AI; she is a
      research professor at the University of Southern California and a senior principal researcher
      at Microsoft Research. In 2017 she co-founded, with Meredith Whittaker, the
      [[ai-now-institute|AI Now Institute]] at New York University, whose reports helped establish
      [[algorithmic-accountability|algorithmic accountability]] and
      [[algorithmic-impact-assessment|algorithmic impact assessments]] as policy tools. With the
      artist Trevor Paglen she examined the categories used to label people in training data
      ('Excavating AI', 2019), work whose viral ImageNet Roulette app preceded the removal of many
      person categories from [[imagenet|ImageNet]]; with Vladan Joler she mapped the labor, data and
      mineral extraction behind a voice assistant ('Anatomy of an AI System', 2018). Her book 'Atlas
      of AI' (2021) argues that AI is a material and political infrastructure that concentrates
      power, not a disembodied intelligence. She co-authored [[datasheet-for-datasets|datasheets for
      datasets]] (2018).
