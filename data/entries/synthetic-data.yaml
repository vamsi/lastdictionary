# yaml-language-server: $schema=../schema/entry.schema.json

term: synthetic data
id: synthetic-data
pos: n.
also:
  - synthetic dataset
  - generated data
  - AI-generated training data
domain: data
domains:
  - train
  - gen
level: essential
plain: >-
  Data created by computer programs or AI models rather than collected from the real world — such as
  practice math problems written by a model, or simulated street scenes for self-driving cars.
senses:
  - definition: >-
      Examples or records produced by software — a simulator, procedural rules, a statistical model
      or a generative AI system — to stand in for, or add to, data gathered from people, sensors or
      the world, most often to train or evaluate other models. Long-standing uses include simulated
      environments for robotics and driving (see [[sim-to-real-transfer|sim-to-real transfer]] and
      [[domain-randomization|domain randomization]]), rendered images with perfect labels, and
      privacy-preserving releases of statistical records that mimic real data without corresponding
      to real people. In language modeling it has become central: models generate
      instruction–response pairs ([[self-instruct|Self-Instruct]],
      [[knowledge-distillation|distillation]] from stronger models), rephrase web text into cleaner
      forms, write textbook-style material and coding exercises, and produce reasoning traces that
      are kept only if a verifier confirms the answer ([[rejection-sampling|rejection sampling]],
      [[reinforcement-learning-with-verifiable-rewards|reinforcement learning with verifiable
      rewards]]). Its advantages are scale, control, low cost and relief from some privacy and
      copyright problems; its risks include amplifying the generator's errors and biases, loss of
      diversity and, if used carelessly over repeated generations, [[model-collapse|model
      collapse]].
    example: >-
      Half of our math fine-tuning set is synthetic, generated by a larger model and checked by a
      solver.
origin: >-
  Donald Rubin proposed fully synthetic data in 1993 as a way to release census-style records
  without disclosing real respondents, and Roderick Little proposed partially synthetic data the
  same year; simulated training images go back to 1980s self-driving research. For language models
  the turn came with Self-Instruct (2022) and Microsoft's 'Textbooks Are All You Need' (2023).
year: 1993
note: >-
  'Synthetic' does not mean free of real data: generators are trained on real data and can reproduce
  it, including personal or copyrighted material. Whether synthetic data can substitute for fresh
  human data at the frontier is debated (see [[data-wall|data wall]]).
see_also:
  - model collapse
  - Self-Instruct
  - knowledge distillation
  - sim-to-real transfer
  - data wall
  - rejection sampling
contrast:
  - data augmentation
sources:
  - text: >-
      Rubin, D. B. (1993). Discussion: Statistical Disclosure Limitation. Journal of Official
      Statistics 9(2).
  - text: Gunasekar, S. et al. (2023). Textbooks Are All You Need. arXiv preprint.
