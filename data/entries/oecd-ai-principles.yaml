term: OECD AI Principles
id: oecd-ai-principles
pos: prop. n.
also:
  - OECD Recommendation on Artificial Intelligence
  - OECD Principles on Artificial Intelligence
domain: gov
domains:
  - society
level: core
plain: >-
  Guidelines for trustworthy AI that governments agreed through the OECD in 2019, the first such
  standard agreed between governments; many later laws and agreements borrowed from them.
senses:
  - definition: >-
      The principles set out in the Recommendation of the Council on Artificial Intelligence
      (OECD/LEGAL/0449) of the Organisation for Economic Co-operation and Development, which the
      OECD calls 'the first intergovernmental standard on AI'. Five values-based principles —
      inclusive growth, sustainable development and well-being; human rights and democratic values,
      including fairness and privacy; transparency and explainability; robustness, security and
      safety; and accountability — are paired with five recommendations to governments on research
      investment, enabling ecosystems, interoperable policy, human capacity and international
      cooperation. The Recommendation's definition of an [[ai-system|AI system]], revised in
      November 2023, was closely followed by the [[eu-ai-act|EU AI Act]] and the
      [[framework-convention-on-artificial-intelligence|Framework Convention on Artificial
      Intelligence]].
    example: The bill borrows its definition of an AI system from the OECD AI Principles.
origin: >-
  Drafted with input from an OECD expert group on AI (AIGO) and adopted by the OECD Council at
  ministerial level on 22 May 2019; in June 2019 the G20 based its non-binding AI Principles on
  them. Revised on 3 May 2024 to address generative AI, misinformation, safety and information
  integrity.
year: 2019
note: >-
  Non-binding 'soft law', although OECD Recommendations carry a political commitment. As of October
  2026 the Recommendation had 47 adherents: all OECD members and a number of non-members. The
  OECD.AI Policy Observatory tracks implementation, and the OECD AI Incidents Monitor logs
  [[ai-incident|AI incidents]].
