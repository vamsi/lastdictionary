term: instruction dataset
id: instruction-dataset
pos: n.
also:
  - instruction data
  - instruction-tuning dataset
  - SFT data
  - instruction-following data
domain: data
domains:
  - train
  - llm
level: core
plain: >-
  A collection of example requests paired with good answers, used to teach a pretrained language
  model to follow instructions and act as a helpful assistant.
senses:
  - definition: >-
      A dataset of instructions, optionally with inputs, paired with target responses — or of full
      multi-turn conversations — used for [[instruction-tuning|instruction tuning]] and
      [[supervised-fine-tuning|supervised fine-tuning]] of a [[base-model|base model]]. Sources
      include existing NLP tasks rewritten as natural-language instructions through templates (FLAN;
      Super-NaturalInstructions, with more than 1,600 tasks), demonstrations written by paid
      annotators or volunteers (the data behind InstructGPT, Databricks' Dolly 15k, OpenAssistant
      Conversations), and responses generated by stronger models ([[self-instruct|Self-Instruct]],
      Stanford's Alpaca and many distilled sets). Quality and diversity matter more than size: about
      a thousand carefully chosen examples can produce a capable assistant, while noisy or
      homogeneous data teaches bad habits. Modern pipelines filter generated data with
      [[reward-model|reward models]] or verifiers, mix in safety and refusal examples, and format
      examples with a [[chat-template|chat template]].
    example: >-
      We cut the instruction dataset to 20,000 high-quality examples and the model got better.
origin: >-
  Took shape in 2021–2022 with Swaroop Mishra and colleagues' Natural Instructions (2021), Google's
  FLAN (Jason Wei and colleagues, 2021), BigScience's T0 and its P3 collection (2021) and OpenAI's
  InstructGPT (2022). The 2023 wave of open chat models, beginning with Alpaca, made model-generated
  instruction data the norm.
year: 2021
note: >-
  Distinct from [[preference-data|preference data]], which records judgments between alternative
  responses for [[reinforcement-learning-from-human-feedback|reinforcement learning from human
  feedback]] or [[direct-preference-optimization|direct preference optimization]]. Data generated
  with commercial models may carry terms of service restricting its use to train competing models.
