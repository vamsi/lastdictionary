term: Dreyfus's critique of AI
id: dreyfus-s-critique-of-ai
pos: n.
also:
  - Dreyfus critique
  - What Computers Can't Do
  - Alchemy and Artificial Intelligence
domain: mind
domains:
  - hist
  - sym
level: specialist
plain: >-
  The philosopher Hubert Dreyfus's argument, from the 1960s on, that rule-based AI could never match
  human intelligence, because much human skill rests on bodily know-how and intuition rather than
  explicit rules.
senses:
  - definition: >-
      The critique of [[symbolic-ai|symbolic AI]] developed by the philosopher
      [[hubert-dreyfus|Hubert Dreyfus]], drawing on Martin Heidegger, Maurice Merleau-Ponty and
      Ludwig Wittgenstein. Dreyfus argued that the field rested on four mistaken assumptions —
      biological (that the brain works by discrete, switch-like operations), psychological (that the
      mind follows formal rules over bits of information), epistemological (that everything known
      can be made explicit and formal) and ontological (that the world divides into independent,
      context-free facts) — whereas human expertise depends on embodied, situated skills, a
      background of tacit understanding and an intuitive grasp of what is relevant. He predicted the
      stalls of [[good-old-fashioned-ai|good old-fashioned AI]] and [[expert-system|expert
      systems]], and anticipated themes of [[embodied-cognition|embodied cognition]], the
      [[frame-problem|frame problem]] and [[polanyi-s-paradox|Polanyi's paradox]]. He was more
      sympathetic to neural networks, though he doubted they could generalize as humans do without a
      humanlike body and form of life.
origin: >-
  First set out in Hubert Dreyfus's RAND Corporation paper 'Alchemy and Artificial Intelligence'
  (1965), then in What Computers Can't Do (1972), its revision What Computers Still Can't Do (1992)
  and, with his brother Stuart Dreyfus, Mind over Machine (1986). AI researchers' early reactions
  were hostile; many later conceded parts of the critique.
year: 1965
