plain: >-
  A Spanish computer scientist who co-created key neural methods for translation and image
  captioning, led DeepMind's StarCraft-playing AlphaStar, co-led Google's Gemini models, and in 2026
  co-founded the startup Discovery Loop.
senses:
  - definition: >-
      Spanish computer scientist who was a vice president of research at [[google-deepmind|Google
      DeepMind]] and a technical co-lead of its [[gemini|Gemini]] models until August 2026, when he
      left Google to co-found Discovery Loop, a company aiming to automate scientific discovery,
      with [[jeff-dean|Jeff Dean]], Sanjay Ghemawat and Quoc Le. After a PhD at the University of
      California, Berkeley (2013), he joined [[google-brain|Google Brain]], where he co-introduced
      [[sequence-to-sequence-model|sequence-to-sequence learning]] (2014, with [[ilya-sutskever|Ilya
      Sutskever]] and Quoc Le), the Show and Tell [[image-captioning|image captioning]] model
      (2015), pointer networks (2015) and, with [[geoffrey-hinton|Geoffrey Hinton]] and Dean,
      [[knowledge-distillation|knowledge distillation]]. At DeepMind from 2016 he co-authored
      matching networks for [[few-shot-learning|few-shot learning]] (2016), [[wavenet|WaveNet]] and
      the [[vq-vae|VQ-VAE]], and led [[alphastar|AlphaStar]], which in 2019 reached Grandmaster
      level in the real-time strategy game StarCraft II, ranking above 99.8 percent of officially
      ranked human players, a milestone for [[deep-reinforcement-learning|deep reinforcement
      learning]] combining [[imitation-learning|imitation learning]] with multi-agent
      [[self-play|self-play]].
