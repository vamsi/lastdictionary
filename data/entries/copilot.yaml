term: copilot
id: copilot
pos: n.
also:
  - AI copilot
  - co-pilot
domain: culture
domains:
  - eng
  - society
level: essential
plain: >-
  An AI assistant built into software that works alongside a person — suggesting code, drafting text
  or answering questions — while the person stays in charge, like a co-pilot beside the captain.
senses:
  - definition: >-
      An AI assistant embedded in an application or workflow that offers suggestions, drafts and
      answers in context while the human user remains responsible for decisions and final output;
      the dominant product metaphor of the first wave of [[generative-ai|generative AI]] tools. The
      assistant is typically a [[large-language-model|large language model]] given the user's
      current document, code or data as context, and interaction ranges from inline completion to
      chat. The framing deliberately signals [[human-in-the-loop|human-in-the-loop]] control and
      augmentation rather than replacement, and is contrasted with [[ai-agent|agents]], which carry
      out multi-step tasks autonomously. The word is both generic and a brand — GitHub popularized
      it and Microsoft extended 'Copilot' across its products — so usage can be ambiguous.
    example: >-
      We started with a copilot that suggests replies; an agent that sends them is next quarter's
      project.
origin: >-
  From aviation, where the co-pilot assists the pilot in command. GitHub's announcement of
  [[github-copilot|GitHub Copilot]], a code-completion tool built on OpenAI's Codex model, in June
  2021 established the AI sense; Microsoft adopted Copilot as an umbrella brand from 2023, and
  lowercase 'copilot' spread across the software industry as a generic term.
year: 2021
note: >-
  Write the generic sense lowercase; Copilot with a capital is Microsoft's (and GitHub's) product
  name. Compare [[co-intelligence|co-intelligence]] and [[centaur|centaur]] for related framings of
  human–AI collaboration.
see_also:
