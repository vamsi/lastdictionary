# yaml-language-server: $schema=../schema/entry.schema.json

term: problem of other minds
id: problem-of-other-minds
pos: n.
also:
  - other minds problem
  - argument from analogy
domain: mind
domains:
  - society
level: core
plain: >-
  The puzzle of how we can know that anyone besides ourselves has thoughts and feelings, since we
  only ever see their behavior. AI turns this old puzzle into a practical one.
senses:
  - definition: >-
      The epistemological problem of justifying the belief that beings other than oneself have
      minds, given that one has direct access only to one's own experiences and can observe only
      others' bodies and behavior. Classic responses include the argument from analogy (others
      resemble me and behave as I do when I am in pain, so they probably feel pain too), inference
      to the best explanation, and views on which minds are directly perceived in expressive
      behavior. AI strains each answer: language models produce humanlike testimony and conduct
      through very different mechanisms, weakening the analogy, while their internals can be
      inspected in ways other people's cannot. The [[turing-test|Turing test]] was Alan Turing's
      pragmatic answer, and the [[philosophical-zombie|philosophical zombie]] dramatizes the
      problem.
    example: >-
      With chatbots, the problem of other minds stopped being a seminar puzzle and became a design
      question.
origin: >-
  The argument from analogy was set out by John Stuart Mill in An Examination of Sir William
  Hamilton's Philosophy (1865). The problem became a standard topic of 20th-century analytic
  philosophy, discussed by J. L. Austin in 'Other Minds' (1946) and by Ludwig Wittgenstein; Alan
  Turing's 1950 paper addressed it directly.
note: >-
  Distinct from [[theory-of-mind|theory of mind]], the psychological capacity to attribute mental
  states to others; the problem of other minds asks whether such attributions are justified at all.
see_also:
  - Turing test
  - philosophical zombie
  - anthropomorphism
  - consciousness
  - machine consciousness
  - intentional stance
contrast:
  - theory of mind
sources:
  - text: >-
      Mill, J. S. (1865). An Examination of Sir William Hamilton's Philosophy. Longmans.
  - text: >-
      Austin, J. L. (1946). Other Minds. Proceedings of the Aristotelian Society, Supplementary
      Volume 20, 148–187.
