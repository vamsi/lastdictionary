term: TESCREAL
id: tescreal
pos: abbr.
also:
  - TESCREAList
  - TESCREALism
  - TESCREAL bundle
domain: asi
domains:
  - society
  - culture
labels:
  - contested
level: specialist
plain: >-
  A critical label for a cluster of related belief systems, including transhumanism, effective
  altruism and longtermism, that its coiners say drive the push to build AGI and share roots with
  eugenics.
senses:
  - definition: >-
      An acronym for transhumanism, extropianism, singularitarianism, (modern) cosmism, rationalism,
      effective altruism and [[longtermism|longtermism]], used by its originators to describe what
      they see as a single bundle of overlapping ideologies motivating much of the drive to build
      [[artificial-general-intelligence|artificial general intelligence]]. They argue that the
      bundle descends from twentieth-century Anglo-American eugenics, shares a utopian vision of
      technologically enhanced posthumans colonizing space, and serves to justify concentrating
      resources in AI companies while discounting present-day harms. The term spread quickly in
      AI-ethics and critical commentary. Critics, including philosophers and members of the named
      communities, call it polemical, argue that it lumps together distinct and often conflicting
      movements (self-described cosmists are rare, and many rationalists and effective altruists
      oppose racing to AGI), and say that it works as guilt by association.
    example: >-
      She dismissed the lab's mission statement as TESCREAL ideology in corporate language.
origin: >-
  Coined by Timnit Gebru and Émile P. Torres in 2023, first in a draft paper and in Torres's essays,
  and set out in their article 'The TESCREAL bundle: Eugenics and the promise of utopia through
  artificial general intelligence' (First Monday, April 2024).
year: 2023
