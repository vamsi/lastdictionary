term: Machines of Loving Grace
id: machines-of-loving-grace
pos: prop. n.
also:
  - "Machines of Loving Grace: How AI Could Transform the World for the Better"
  - compressed 21st century
domain: asi
domains:
  - culture
  - society
level: specialist
plain: >-
  A 2024 essay by Dario Amodei, head of the AI company Anthropic, imagining how very capable AI
  could pack decades of progress against disease, poverty and bad government into a few years — if
  its risks are managed.
senses:
  - definition: >-
      An essay by [[dario-amodei|Dario Amodei]], chief executive of [[anthropic|Anthropic]],
      published in October 2024, setting out what 'powerful AI' might achieve in the five to ten
      years after it arrives if its risks are handled well. Avoiding the term
      [[artificial-general-intelligence|AGI]], Amodei defines powerful AI by capability: a system of
      Nobel-prize caliber in most fields that can work on its own at tasks lasting days or weeks and
      can run as millions of fast copies — a '[[country-of-geniuses-in-a-datacenter|country of
      geniuses in a datacenter]]'. He argues that progress would then be limited less by
      intelligence than by complementary factors, framed as the 'marginal returns to intelligence':
      the speed of the physical world, scarce data, intrinsic complexity, human institutions and
      physical law. The essay surveys five areas: biology and health, where it predicts a
      'compressed 21st century' of 50–100 years of progress in 5–10; neuroscience and mental health;
      economic development and poverty; peace and governance, proposing an 'entente' of democracies
      that secures an AI lead; and work and meaning.
    example: >-
      Critics of Machines of Loving Grace accept most of its biology wish list but doubt the
      five-to-ten-year timeline.
origin: >-
  Published on Amodei's personal website in October 2024; he presented it as a deliberate
  counterweight to his company's public emphasis on risk. The title comes from Richard Brautigan's
  1967 poem 'All Watched Over by Machines of Loving Grace', which imagines harmony between people,
  nature and computers.
year: 2024
note: >-
  Reactions divided along familiar lines: supporters welcomed a concrete positive vision from a
  safety-focused laboratory, while critics questioned the timelines, especially for biology, the
  proposal that democracies seek AI superiority, and the commercial interest of a company chief
  forecasting transformative AI.
