# yaml-language-server: $schema=../schema/entry.schema.json

term: mind–body problem
id: mind-body-problem
pos: n.
also:
  - dualism
  - physicalism
  - Cartesian dualism
  - materialism (philosophy of mind)
domain: mind
level: core
plain: >-
  The age-old question of how the mind — thoughts, feelings, experiences — relates to the physical
  body and brain. Is the mind simply what the brain does, or something more?
senses:
  - definition: >-
      The problem of how mental phenomena such as thought, sensation and
      [[consciousness|consciousness]] relate to physical phenomena such as brains and bodies. The
      main families of answer are dualism, on which mind and matter are distinct kinds of substance
      (René Descartes) or have distinct kinds of properties; physicalism or materialism, on which
      mental facts are nothing over and above physical ones, in versions including the mind–brain
      identity theory, [[functionalism|functionalism]] and eliminativism; idealism, on which matter
      depends on mind; and neutral or Russellian monism, which posits something underlying both.
      Computing reshaped the debate: the analogy of mind to software running on neural hardware
      suggested that a mind is an abstract organization realizable in many materials, which is why
      the possibility of minds in AI systems is often treated as a test case for functionalist
      physicalism.
origin: >-
  Given its modern form by René Descartes's Meditations (1641) and pressed by Princess Elisabeth of
  Bohemia, who asked him in 1643 how an immaterial soul could move a body. The phrase 'mind–body
  problem' became current in 20th-century philosophy.
year: 1641
note: >-
  Arthur Schopenhauer's phrase 'world knot' is often applied to it. The
  [[hard-problem-of-consciousness|hard problem of consciousness]] is a sharpened modern version that
  targets experience rather than thought or intentional action, which many philosophers believe
  computational theories handle well.
see_also:
  - functionalism
  - hard problem of consciousness
  - computational theory of mind
  - biological naturalism
  - panpsychism
  - multiple realizability
sources:
  - text: >-
      Descartes, R. (1641). Meditationes de prima philosophia (Meditations on First Philosophy).
