level: core
dates: b. 1936
plain: >-
  An Israeli-American computer scientist who gave AI the mathematics for reasoning under uncertainty
  and, later, for telling cause and effect apart from mere correlation.
senses:
  - definition: >-
      Israeli-American computer scientist, also known for philosophical work on causation, who has
      been at the University of California, Los Angeles (UCLA) since 1970. In the 1980s he developed
      [[bayesian-network|Bayesian networks]], a term he introduced in 1985, and belief propagation,
      a message-passing method for computing probabilities in them; his book 'Probabilistic
      Reasoning in Intelligent Systems' (1988) helped move AI from rule-based to probabilistic
      reasoning under uncertainty. His second program turned to cause and effect: in 'Causality'
      (2000) and related work, structural causal models, causal diagrams and the
      [[do-calculus|do-calculus]] give [[causal-inference|causal inference]] a mathematics that
      separates seeing from doing and supports reasoning about interventions and
      [[counterfactual|counterfactuals]]. With Dana Mackenzie he popularized these ideas in 'The
      Book of Why' (2018), arguing that machine learning that only fits data remains on the lowest
      rung of a 'ladder of causation'. [[turing-award|Turing Award]] 2011.
