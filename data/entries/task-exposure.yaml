  - general-purpose technology
  - GDPval
sources:
  - text: >-
      Eloundou, T., Manning, S., Mishkin, P. & Rock, D. (2024). GPTs are GPTs: Labor market impact
      potential of LLMs. Science 384(6702), 1306–1308.
  - text: >-
      Felten, E., Raj, M. & Seamans, R. (2021). Occupational, industry, and geographic exposure to
      artificial intelligence: A novel dataset and its potential uses. Strategic Management Journal
      42(12), 2195–2217.
