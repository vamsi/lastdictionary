plain: >-
  A family of Google image-recognition networks, the first called GoogLeNet, whose building blocks
  examine each patch of an image at several scales at once while keeping computation low.
senses:
  - definition: >-
      A family of [[convolutional-neural-network|convolutional networks]] built from Inception
      modules: blocks that apply 1 × 1, 3 × 3 and 5 × 5 [[convolution|convolutions]] and a
      max-[[pooling|pooling]] branch in parallel to the same input and concatenate the results, so
      each layer captures patterns at several scales. Cheap 1 × 1 convolutions first shrink the
      number of channels entering the costly larger filters, which, as its designers put it, let the
      network grow deeper and wider within a fixed computational budget. The first version,
      GoogLeNet, was 22 layers deep, used auxiliary classifiers on intermediate layers to aid
      training and global average pooling instead of large [[fully-connected-layer|fully connected
      layers]], and had about 12 times fewer parameters than [[alexnet|AlexNet]]. Later versions
      added [[batch-normalization|batch normalization]] and factorized convolutions (Inception-v2
      and v3, 2015); Inception-v4 (2016) refined the modules, and its sibling Inception-ResNet added
      [[residual-connection|residual connections]]. Features from Inception-v3 underlie the
      [[frechet-inception-distance|Fréchet inception distance]] used to evaluate image generators.
    example: >-
      FID is computed on Inception-v3 pool features, so it inherits that network's biases.
origin: >-
  Introduced by Christian Szegedy and eight co-authors, most of them at Google, in 'Going Deeper
  with Convolutions' (arXiv, September 2014; CVPR 2015). GoogLeNet, named in homage to LeNet, won
  the ILSVRC 2014 classification task with about 6.7% top-5 error. The name Inception nods to the
  internet meme 'we need to go deeper', from the film Inception, which the paper cites.
year: 2014
