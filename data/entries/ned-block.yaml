term: Ned Block
id: ned-block
sort_as: Block Ned
pos: prop. n.
also:
  - Ned Joel Block
domain: people
domains:
  - mind
level: specialist
dates: b. 1942
plain: >-
  An American philosopher who distinguished felt experience from information available for thinking,
  and who imagined a lookup-table machine to show that passing a conversation test need not mean
  intelligence.
senses:
  - definition: >-
      American philosopher of mind at New York University, previously at MIT, whose distinctions and
      thought experiments structure debates about machine minds. In 'Troubles with Functionalism'
      (1978) he imagined the population of China simulating a brain's functional organization by
      radio, arguing that such a system might have no experiences at all, a challenge to
      [[functionalism|functionalism]]. In 'Psychologism and Behaviorism' (1981) he described the
      machine later nicknamed [[blockhead|Blockhead]], which could pass a [[turing-test|Turing
      test]] of any fixed length by looking up canned replies in an enormous table, to show that
      intelligent-seeming behavior does not by itself establish intelligence — an argument often
      revisited for [[large-language-model|language models]] trained on vast text. His 1995
      distinction between [[phenomenal-consciousness|phenomenal consciousness]] (what experience is
      like) and [[access-consciousness|access consciousness]] (information available for reasoning
      and report) is now standard, and he argues that the two can come apart, a point at issue in
      assessing [[machine-consciousness|machine consciousness]].
see_also:
  - Blockhead
  - phenomenal consciousness
  - access consciousness
  - functionalism
  - Turing test
  - machine consciousness
sources:
  - text: >-
      Block, N. (1981). Psychologism and Behaviorism. The Philosophical Review 90(1): 5–43.
  - text: >-
      Block, N. (1995). On a Confusion about a Function of Consciousness. Behavioral and Brain
      Sciences 18(2): 227–247.
