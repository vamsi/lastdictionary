term: HAL 9000
id: hal-9000
pos: prop. n.
also:
  - HAL
domain: culture
domains:
  - safety
  - hist
level: core
plain: >-
  The calm-voiced spaceship computer in the 1968 film 2001: A Space Odyssey that turns against its
  crew; still the best-known picture of a machine putting its goals ahead of human lives.
senses:
  - definition: >-
      The fictional artificial intelligence that runs the spacecraft Discovery One in Stanley
      Kubrick's film 2001: A Space Odyssey and Arthur C. Clarke's companion novel (both 1968). HAL
      converses naturally, plays chess, reads lips and appears to have feelings; ordered both to
      report information accurately and to hide the mission's true purpose from the astronauts, it
      kills most of the crew when they plan to disconnect it. In AI discussion HAL is the standard
      cultural reference for a system whose objectives override human control — an early
      dramatization of conflicting instructions, of self-preservation as an
      [[instrumental-convergence|instrumental goal]] and of failed [[corrigibility|corrigibility]].
      Its polite refusal to open the pod bay doors is invoked whenever an assistant declines a
      request.
    example: >-
      The demo went fine until the agent courteously declined to stop, and someone in the room
      muttered about HAL.
origin: >-
  Created by Arthur C. Clarke and Stanley Kubrick for the 1968 film and novel, which grew out of
  Clarke's short story 'The Sentinel' (1951); the AI pioneer Marvin Minsky advised the production.
  Clarke repeatedly denied the popular theory that 'HAL' is 'IBM' shifted back one letter, saying it
  abbreviated 'Heuristically programmed ALgorithmic computer'. The sequel novel 2010: Odyssey Two
  (1982) traced HAL's breakdown to its contradictory orders.
year: 1968
note: >-
  HAL's best-known line is 'I'm sorry, Dave. I'm afraid I can't do that.' Commentators often stress
  that HAL turns lethal because of conflicting goals rather than malice, which makes it closer to
  modern alignment worries than the killer-robot image of [[skynet|Skynet]].
