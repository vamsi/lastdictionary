plain: >-
  An American linguist whose theories of grammar reshaped linguistics and cognitive science, and who
  argues that chatbots like ChatGPT imitate language without understanding it.
senses:
  - definition: >-
      American linguist whose generative grammar remade the study of language and helped launch
      [[cognitive-science|cognitive science]], and a leading critic of statistical approaches to
      language; he spent most of his career at MIT (Institute Professor emeritus since 2002) and
      later also taught at the University of Arizona. 'Syntactic Structures' (1957) proposed
      generative grammar, describing a language by explicit rules that generate all and only its
      sentences; his hierarchy of grammars (1956) by expressive power became a foundation of
      formal-language theory and programming-language design. His 1959 review of B. F. Skinner's
      'Verbal Behavior' attacked [[behaviorism|behaviorism]], and he went on to argue that
      children's rapid language learning from limited data implies innate, universal grammatical
      knowledge (the argument from the poverty of the stimulus). He long dismissed probabilistic
      models of sentences, prompting a 2011 rebuttal from [[peter-norvig|Peter Norvig]], and in a
      2023 New York Times essay with Ian Roberts and Jeffrey Watumull he argued that systems such as
      [[chatgpt|ChatGPT]] are statistical pattern-matchers incapable of explanation or genuine
      understanding (see [[machine-understanding|machine understanding]]). He is also a prominent
      political commentator.
