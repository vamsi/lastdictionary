plain: >-
  A British AI researcher who leads mechanistic interpretability at Google DeepMind and built
  TransformerLens, a widely used tool for looking inside language models.
senses:
  - definition: >-
      British [[mechanistic-interpretability|mechanistic interpretability]] researcher who leads the
      mechanistic interpretability team at [[google-deepmind|Google DeepMind]]. After working on
      Anthropic's early transformer-circuits papers (2021–2022), including the study of
      [[induction-head|induction heads]], he created [[transformerlens|TransformerLens]] (2022), an
      open-source library for inspecting and intervening on the internals of
      [[transformer|transformer]] language models that became a standard research tool. His
      reverse-engineering of a small transformer that had [[grokking|grokked]] modular addition
      showed that it had learned an algorithm based on trigonometric identities and supplied
      progress measures that track the hidden change (2023). He popularized
      [[activation-patching|activation patching]], proposed [[attribution-patching|attribution
      patching]] (2023), and wrote widely used tutorials and lists of open problems that, with his
      mentoring, drew many newcomers into the field. At Google DeepMind he was senior author of
      [[gemma-scope|Gemma Scope]] (2024), open [[sparse-autoencoder|sparse autoencoders]] for Gemma
      2 models; in 2025 his team reported disappointing results for sparse autoencoders on practical
      tasks and shifted toward more pragmatic methods.
