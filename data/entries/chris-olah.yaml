plain: >-
  A Canadian researcher who pioneered ways of looking inside neural networks to see what they have
  learned, and a co-founder of the AI company Anthropic.
senses:
  - definition: >-
      Canadian researcher, the figure most associated with
      [[mechanistic-interpretability|mechanistic interpretability]] (a term credited to him), who
      co-founded [[anthropic|Anthropic]] in 2021 and leads its interpretability research. Without a
      university degree, he joined [[google-brain|Google Brain]], initially as an intern,
      co-authored the 2015 'Inceptionism' post that introduced DeepDream, and developed
      [[feature-visualization|feature visualization]] and attribution methods; his explanatory
      essays and the online journal [[distill|Distill]] (2017), which he co-founded with Shan
      Carter, set new standards for visual explanation. At [[openai|OpenAI]] (2018–2020) he led work
      treating networks as [[feature-interpretability|features]] connected by [[circuit|circuits]]
      and proposed the [[universality-hypothesis|universality hypothesis]]. At Anthropic his team
      has published, largely in the [[transformer-circuits-thread|Transformer Circuits Thread]], on
      transformer circuits and [[induction-head|induction heads]], [[superposition|superposition]]
      (2022), [[sparse-autoencoder|sparse-autoencoder]] dictionaries that extract interpretable
      features, first from a one-layer model (2023) and then by the million from a [[claude|Claude]]
      model (2024), and [[attribution-graph|attribution graphs]] for [[circuit-tracing|circuit
      tracing]] (2025).
