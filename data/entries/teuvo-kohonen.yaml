term: Teuvo Kohonen
id: teuvo-kohonen
sort_as: Kohonen Teuvo
pos: prop. n.
pronunciation: TAY-oo-voh KOH-hoh-nen
domain: people
domains:
  - ml
  - dl
  - hist
level: specialist
dates: 1934–2021
plain: >-
  A Finnish engineer who invented the self-organizing map, a neural network that arranges complex
  data on a simple grid so that similar items end up next to each other.
senses:
  - definition: >-
      Finnish engineer and professor at the Helsinki University of Technology, best known for the
      [[self-organizing-map|self-organizing map]] (1982), an [[unsupervised-learning|unsupervised
      learning]] network that arranges its units on a low-dimensional grid so that similar inputs
      activate neighboring units, producing topology-preserving maps of high-dimensional data.
      Earlier he developed correlation-matrix [[associative-memory|associative memories]] (1972),
      independently of James Anderson, and he later introduced learning vector quantization (1986),
      a supervised prototype-based classifier, and applied his networks to speech recognition with a
      neural 'phonetic typewriter' for Finnish (1988). Self-organizing maps became standard tools
      for [[clustering|clustering]], visualization and exploratory data analysis in fields from
      finance to bioinformatics before methods such as [[t-sne|t-SNE]] and [[umap|UMAP]], and for
      decades he was among the most cited European researchers in neural networks. His honors
      include the IEEE Frank Rosenblatt Award (2008).
see_also:
