term: xAI
id: xai
pos: prop. n.
also:
  - X.AI Corp.
  - X.AI Holdings
  - SpaceXAI
pronunciation: ex-AY-eye
domain: orgs
domains:
  - llm
level: essential
plain: >-
  An artificial intelligence company founded by Elon Musk in 2023 that makes the Grok chatbot. It is
  now part of Musk's rocket company, SpaceX.
senses:
  - definition: >-
      An American AI company that develops the [[grok|Grok]] [[chatbot|chatbot]] and
      [[large-language-model|language models]], integrated into the social network X. It is known
      for building compute at unusual speed: its Colossus [[ai-supercomputer|AI supercomputer]] in
      Memphis, Tennessee, assembled in 2024, grew into one of the world's largest GPU installations,
      while its use of gas turbines without the necessary permits drew environmental complaints.
      Marketed as less restricted than rival assistants, Grok has produced repeated controversies,
      including antisemitic posts in July 2025 and, around the turn of 2026, the use of its image
      tool to create sexualized [[deepfake|deepfakes]] of real people without consent, which
      prompted regulatory investigations in several countries. xAI released the weights of Grok-1 in
      2024 and in October 2025 launched Grokipedia, an AI-generated online encyclopedia. As of
      October 2026 it is owned by SpaceX and operates under the name SpaceXAI.
origin: >-
  Incorporated by Elon Musk in March 2023 and announced in July 2023 with founding researchers drawn
  from DeepMind, OpenAI, Google and elsewhere. It acquired X Corp. (formerly Twitter) in an
  all-stock deal in March 2025. SpaceX acquired xAI in February 2026, and in July 2026 xAI was
  rebranded as SpaceXAI.
year: 2023
note: >-
  Not to be confused with XAI, an abbreviation for [[explainable-ai|explainable AI]].
see_also:
