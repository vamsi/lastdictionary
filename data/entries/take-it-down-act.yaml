term: TAKE IT DOWN Act
id: take-it-down-act
pos: prop. n.
also:
  - Tools to Address Known Exploitation by Immobilizing Technological Deepfakes on Websites and
    Networks Act
domain: gov
domains:
  - society
  - sec
labels:
  - legal
level: core
plain: >-
  A 2025 US federal law that forces websites to remove intimate images of a person posted without
  consent, including AI-made fakes, within 48 hours of the victim's request, and makes posting them
  a crime.
senses:
  - definition: >-
      A US federal statute, signed on May 19, 2025, on non-consensual intimate imagery (NCII),
      including 'digital forgeries': synthetic or doctored intimate images of a real, identifiable
      person that would look genuine to a reasonable viewer, whether produced with AI or other
      software. It makes it a federal crime knowingly to publish such imagery, real or synthetic, of
      adults without consent in specified harmful circumstances, or of minors, and to threaten to do
      so. Covered online platforms that host user content had one year, until May 19, 2026, to
      establish a notice-and-removal process that takes down reported imagery, and known identical
      copies, within 48 hours of a valid request; the Federal Trade Commission enforces this duty as
      an unfair or deceptive practice. Free-expression and digital-rights groups warned that the
      takedown system lacks safeguards against false or abusive requests and could pressure
      encrypted services.
    example: The platform built a 48-hour removal queue to comply with the TAKE IT DOWN Act.
origin: >-
  Introduced by Senators Ted Cruz and Amy Klobuchar in 2024 and reintroduced in January 2025; it
  passed the Senate by unanimous consent in February 2025 and the House 409–2 in April 2025, with
  public support from First Lady Melania Trump, and was signed by President Donald Trump on May 19,
  2025.
year: 2025
note: >-
  The acronym is a backronym. The law addresses intimate imagery only; broader [[deepfake|deepfake]]
  and [[digital-replica|digital replica]] harms are left to state law and pending federal bills.
see_also:
  - deepfake
