term: Texas Responsible Artificial Intelligence Governance Act
id: texas-responsible-artificial-intelligence-governance-act
pos: prop. n.
also:
  - TRAIGA
  - Texas HB 149
  - Texas AI Act
domain: gov
domains:
  - society
labels:
  - legal
level: specialist
plain: >-
  A Texas law, in force since 2026, that bans a short list of harmful uses of AI — such as pushing
  people toward self-harm or making sexual deepfakes of children — and sets rules for government use
  of AI.
senses:
  - definition: >-
      Texas House Bill 149 (2025), effective January 1, 2026, a comparatively narrow state AI
      statute. For all developers and deployers it prohibits building or using an AI system with the
      intent to incite self-harm, harm to others or crime; to infringe constitutional rights; to
      unlawfully discriminate against a protected class (disparate impact alone does not show
      intent); or to produce child sexual abuse material or sexual [[deepfake|deepfakes]] of minors.
      Government agencies must disclose to consumers that they are interacting with AI and may not
      use AI for [[social-scoring|social scoring]] or, without consent, for biometric
      identification. The act creates a 36-month [[ai-regulatory-sandbox|regulatory sandbox]] and a
      Texas Artificial Intelligence Council. Enforcement belongs exclusively to the Attorney General
      after a 60-day cure period, with civil penalties of up to $200,000 per uncurable violation
      plus daily penalties for continuing ones; there is no private right of action.
    example: >-
      TRAIGA turns on intent, so the plaintiff's statistics alone could not establish a violation.
origin: >-
  Introduced by Representative Giovanni Capriglione, whose December 2024 draft (HB 1709) followed
  the risk-based model of the [[colorado-ai-act|Colorado AI Act]] and the [[eu-ai-act|EU AI Act]];
  after industry opposition it was narrowed into HB 149, which Governor Greg Abbott signed on June
  22, 2025.
year: 2025
note: >-
  Its intent-based prohibitions contrast with the original Colorado law's duty of care against
  discriminatory effects, and it is often cited as a lighter-touch template for other states.
