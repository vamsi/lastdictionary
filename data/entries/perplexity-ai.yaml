term: Perplexity AI
id: perplexity-ai
pos: prop. n.
also:
  - Comet
domain: orgs
domains:
  - llm
  - agents
level: core
plain: >-
  An American company whose AI search engine answers questions in full sentences with links to its
  sources; news publishers have sued it for using their articles.
senses:
  - definition: >-
      An American company whose 'answer engine' combines web search with
      [[large-language-model|language models]], returning written answers with citations instead of
      a list of links — an early mass-market application of
      [[retrieval-augmented-generation|retrieval-augmented generation]] to search. It uses models
      from several developers alongside its own, and in 2025 launched Comet, a web browser with a
      built-in [[ai-agent|agent]] that can browse and act on the user's behalf. Its use of
      publishers' content has made it a defendant in copyright suits by Dow Jones and the New York
      Post (2024) and by Japanese newspapers (2025), and in August 2025 Cloudflare accused it of
      disguising its web crawlers to evade blocks, which it denied. It has offered publishers a
      revenue-sharing program since 2024.
origin: >-
  Founded in August 2022 in San Francisco by Aravind Srinivas, a former OpenAI research scientist
  and its chief executive, with Denis Yarats, Johnny Ho and Andy Konwinski; its search product
  launched in December 2022.
year: 2022
note: >-
  Not to be confused with [[perplexity|perplexity]], the language-modeling metric whose name it
  shares.
