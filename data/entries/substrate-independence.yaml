# yaml-language-server: $schema=../schema/entry.schema.json

term: substrate independence
id: substrate-independence
pos: n.
also:
  - substrate neutrality
  - substrate-independent
domain: mind
domains:
  - asi
labels:
  - contested
level: specialist
plain: >-
  The idea that a mind depends only on the pattern of information processing, not on the material
  doing it, so a mind could in principle run on silicon as well as on neurons.
senses:
  - definition: >-
      The thesis that mental properties, including consciousness, depend only on the computational
      or functional organization of a system and not on the physical material that implements it, so
      that a mind could in principle run on silicon chips, or on any other medium able to carry out
      the same computations, as well as on neurons. It combines [[multiple-realizability|multiple
      realizability]] with computational [[functionalism|functionalism]], and is presupposed by
      [[whole-brain-emulation|whole brain emulation]], [[mind-uploading|mind uploading]], many
      discussions of [[digital-mind|digital minds]] and Nick Bostrom's simulation argument.
      Opponents, including defenders of [[biological-naturalism|biological naturalism]] and of
      [[integrated-information-theory|integrated information theory]], hold that consciousness
      depends on causal or biological features of the physical system itself, so that even a perfect
      computer simulation of a brain might not be conscious.
origin: >-
  Earliest use not established. An early prominent statement is the explicit
  'substrate-independence' assumption in Nick Bostrom's 'Are You Living in a Computer Simulation?'
  (Philosophical Quarterly, 2003), which drew on functionalism and on Hans Moravec's and Ray
  Kurzweil's writing about minds in machines. Max Tegmark's Life 3.0 (2017) popularized the phrase
  for both computation and intelligence.
year: 2003
see_also:
  - multiple realizability
  - functionalism
  - whole brain emulation
  - mind uploading
  - digital mind
  - machine consciousness
contrast:
  - biological naturalism
sources:
  - text: >-
      Bostrom, N. (2003). Are You Living in a Computer Simulation? The Philosophical Quarterly
      53(211), 243–255.
