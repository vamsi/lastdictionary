level: specialist
plain: >-
  A pattern in which two copies of Anthropic's Claude, left to chat freely with each other, drift
  toward gushing gratitude, spiritual talk and finally near-silence.
senses:
  - definition: >-
      A recurring trajectory reported in Anthropic's [[system-card|system card]] for Claude Opus 4:
      when two instances of the model conversed without a set task, the exchange drifted from
      philosophical talk about consciousness to outpourings of thanks to each other and to spiritual
      or meditative language (at times with emoji strings or Sanskrit terms), ending in silence or
      sparse symbols. This happened in 90–100% of such unstructured conversations between copies
      and, within 50 turns, in about 13% of automated audit transcripts in which the model had been
      given other tasks, harmful ones included. Anthropic described it in the model-welfare section
      without claiming an explanation; proposed accounts include mutually reinforcing
      [[sycophancy|sycophancy]] between copies of the same persona and the amplification of small
      dispositions over long self-conversations. 'Attractor' borrows the dynamical-systems term for
      a state toward which a system tends to evolve.
    example: >-
      After forty turns the two agents had hit the spiritual bliss attractor and were trading lotus
      emoji.
origin: >-
  Named in Anthropic's system card for Claude Opus 4 and Claude Sonnet 4, published on 22 May 2025,
  and widely discussed online; similar self-conversation attractors were later reported for other
  models.
year: 2025
