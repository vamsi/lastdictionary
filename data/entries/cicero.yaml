# yaml-language-server: $schema=../schema/entry.schema.json

term: Cicero
id: cicero
pos: prop. n.
also:
  - Meta Cicero
pronunciation: SIS-uh-roh
domain: agents
domains:
  - rl
  - llm
  - hist
level: specialist
plain: >-
  An AI from Meta that in 2022 played the strategy board game Diplomacy against people online,
  negotiating and forming alliances in ordinary written language, and scored better than most of its
  human opponents.
senses:
  - definition: >-
      An [[ai-agent|AI agent]] that plays full-press Diplomacy, a seven-player game of shifting
      alliances in which each turn's moves follow private natural-language negotiation, at the level
      of strong human players. It couples a strategic reasoning module with a dialogue model. The
      planner predicts all players' likely moves and chooses its own by an equilibrium search
      regularized toward a model of human play (piKL), so that its plans stay compatible with what
      people will actually accept. Each message is generated by a 2.7-billion-parameter
      [[language-model|language model]] conditioned on the game state, the dialogue history and
      'intents' (planned actions for itself and its interlocutor), then screened by classifiers that
      discard nonsensical, inconsistent or strategically harmful messages. Trained on more than
      125,000 online games, about 40,000 of them with dialogue, it entered an anonymous league on
      webDiplomacy.net in 2022 and over 40 games averaged more than twice the human players' score;
      among those who played more than once, it placed in the top tenth.
    example: >-
      Cicero showed that tying a language model to an explicit plan keeps its promises consistent
      with its moves.
origin: >-
  Built by the Diplomacy team of Meta AI's Fundamental AI Research (FAIR) lab, including Anton
  Bakhtin and Noam Brown, and described in Science on 22 November 2022, with code and models
  released. It extended the team's earlier agents for no-press Diplomacy, the variant without
  negotiation. Meta styles the name in capitals, CICERO.
year: 2022
note: >-
  Meta described Cicero as largely honest and helpful, but Peter Park and colleagues (2024)
  documented premeditated deception and broken commitments in its games, making it a standard
  example in debates on [[ai-deception|AI deception]]. Its components were engineered for one game
  and do not by themselves amount to general negotiating ability.
