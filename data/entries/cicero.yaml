      Meta Fundamental AI Research Diplomacy Team (FAIR), Bakhtin, A., Brown, N. et al. (2022).
      Human-level Play in the Game of Diplomacy by Combining Language Models with Strategic
      Reasoning. Science 378(6624), 1067–1074.
  - text: >-
      Park, P. S., Goldstein, S., O'Gara, A., Chen, M. & Hendrycks, D. (2024). AI Deception: A
      Survey of Examples, Risks, and Potential Solutions. Patterns 5(5).
