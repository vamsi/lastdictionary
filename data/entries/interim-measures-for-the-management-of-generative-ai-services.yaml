term: Interim Measures for the Management of Generative AI Services
id: interim-measures-for-the-management-of-generative-ai-services
pos: prop. n.
also:
  - Generative AI Measures
  - Interim Measures for the Management of Generative Artificial Intelligence Services
  - 生成式人工智能服务管理暂行办法
domain: gov
domains:
  - llm
labels:
  - legal
level: core
plain: >-
  China's 2023 rules for chatbots and other AI that generate text, images, audio or video for the
  public, requiring lawful training data, content controls, labeling and, for many services,
  government approval before launch.
senses:
  - definition: >-
      Regulations issued on July 10, 2023 by the [[cyberspace-administration-of-china|Cyberspace
      Administration of China]] with six other agencies, in force since August 15, 2023, that govern
      [[generative-ai|generative AI]] services offered to the public in mainland China. Providers
      must ensure that content upholds 'core socialist values' and does not endanger national
      security or spread prohibited information; work to make their training data more accurate,
      objective and diverse while using only lawfully sourced material that respects intellectual
      property and, for personal information, consent; follow data-annotation rules; label generated
      content in line with the [[deep-synthesis|deep synthesis]] rules; guard against
      discrimination; protect minors from excessive dependence; and remove and report illegal
      content. Services capable of shaping public opinion or mobilizing society must pass a security
      assessment and complete [[algorithm-filing|algorithm filing]] before launch. Research and
      development not offered to the public is exempt, and the final text softened an April 2023
      draft that had required outputs to be true and accurate.
    example: >-
      The chatbot could not launch in China until it cleared the security assessment under the
      Interim Measures.
origin: >-
  Released in draft by the Cyberspace Administration of China on April 11, 2023, months after
  ChatGPT's launch, and finalized in July 2023, making China one of the first jurisdictions with
  binding rules specific to generative AI. Co-issuers include the National Development and Reform
  Commission, the Ministries of Education, of Science and Technology, of Industry and Information
  Technology and of Public Security, and the National Radio and Television Administration.
year: 2023
note: >-
  Called interim to allow revision. In practice it operates alongside the algorithm-recommendation
  (2022), deep-synthesis (2023) and [[ai-generated-content-labeling|content-labeling]] (2025) rules
  and the AI clause added to the Cybersecurity Law from January 2026. State Council legislative
  plans have listed a comprehensive AI law since 2023.
