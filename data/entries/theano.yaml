level: specialist
plain: >-
  One of the first popular free software tools for deep learning, built at a Montreal university
  lab; development ended in 2017, but it shaped the toolkits that replaced it.
senses:
  - definition: >-
      An open-source Python library from the Montreal Institute for Learning Algorithms
      ([[mila|MILA]]) that turned array formulas written in Python into optimized machine code.
      Users built symbolic expression graphs; Theano simplified them algebraically, derived
      gradients by symbolic [[automatic-differentiation|automatic differentiation]], and compiled
      the graph into fast C or CUDA code for CPUs or GPUs. This combination of static
      [[computational-graph|computational graphs]], automatic gradients and transparent GPU
      execution made it one of the first practical deep-learning tools and the backend of early
      high-level libraries such as Lasagne, Blocks and [[keras|Keras]], and its design influenced
      [[tensorflow|TensorFlow]]. Long compilation times and the arrival of industry-backed
      frameworks led MILA to end major development in 2017; community forks continued as Aesara and
      then PyTensor, used by the PyMC probabilistic-programming library.
    example: >-
      The 2014 code still imports Theano, so expect slow graph compilation before the first batch
      runs.
origin: >-
  Begun around 2007 at the Université de Montréal's LISA laboratory (later MILA) under
  [[yoshua-bengio|Yoshua Bengio]], with James Bergstra, Olivier Breuleux, Frédéric Bastien and
  Pascal Lamblin among early developers, and presented at the SciPy conference in 2010. It is named
  after Theano, a Greek mathematician of the Pythagorean school. Development ended with version 1.0
  in November 2017.
year: 2007
