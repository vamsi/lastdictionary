  - asi
labels:
  - emerging
level: core
plain: >-
  Limits on AI that would be forbidden worldwide no matter what — for example AI that copies itself
  without permission or controls nuclear weapons — which campaigners want governments to agree on.
senses:
  - definition: >-
      Proposed internationally agreed prohibitions on AI uses or behaviors judged too dangerous to
      permit under any circumstances, defined clearly enough to be verified and enforced. Proposals
      distinguish two families. Limits on uses would forbid, for example, AI that impersonates
      humans, AI-enabled mass surveillance, weapons that select and kill targets without meaningful
      human control, and handing AI the authority to launch nuclear weapons. Limits on behaviors
      would forbid systems that copy or upgrade themselves without authorization, engage in
      [[power-seeking|power-seeking]], mislead their own developers or give substantial help toward
      building weapons of mass destruction. The [[prohibited-ai-practices|prohibited AI practices]]
      of the [[eu-ai-act|EU AI Act]] work as domestic red lines on uses, and companies'
      [[capability-threshold|capability thresholds]] are a voluntary analogue for behaviors.
    example: >-
      The scientists urged governments to agree on AI red lines before systems could replicate
      themselves.
origin: >-
  The International Dialogues on AI Safety, which brought together Western and Chinese scientists,
  proposed behavioral red lines in their Beijing statement of March 2024. The Global Call for AI Red
  Lines, led by the French Center for AI Safety (CeSIA) and The Future Society and launched at the
  UN General Assembly in September 2025, asked governments to agree on enforceable red lines by the
  end of 2026; by 2026 it listed more than 300 prominent signatories and 90 organizations.
year: 2024
note: >-
  Supporters cite precedents such as the bans on biological weapons and blinding lasers. Skeptics
  doubt that behaviors such as deception can be defined or verified precisely, or that major powers
  will accept binding limits. As of October 2026 the campaign reported talks with diplomats from
  more than 20 countries but no formal endorsement by any government.
