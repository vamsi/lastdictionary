plain: >-
  An American computer scientist who built much of Google's computing infrastructure, co-founded the
  Google Brain deep-learning team and was Google's chief scientist before leaving in 2026 to
  co-found a startup.
senses:
  - definition: >-
      American computer scientist who shaped both Google's computing infrastructure and its AI
      research. Joining Google in 1999, he co-designed with Sanjay Ghemawat much of its large-scale
      infrastructure, including MapReduce (2004), Bigtable and Spanner. In 2011 he co-founded
      [[google-brain|Google Brain]] with [[andrew-ng|Andrew Ng]] and Greg Corrado; its DistBelief
      system trained neural networks across thousands of machines (2012), and its successor
      [[tensorflow|TensorFlow]] (2015) became a leading [[deep-learning|deep learning]] framework.
      He backed the development of Google's [[tpu|tensor processing units]], led Google's AI
      research divisions from 2018, and when Brain merged with DeepMind in 2023 became Google's
      chief scientist and a technical co-lead of [[gemini|Gemini]]. He co-authored
      [[word2vec|word2vec]] and, with [[geoffrey-hinton|Geoffrey Hinton]] and [[oriol-vinyals|Oriol
      Vinyals]], [[knowledge-distillation|knowledge distillation]]. In August 2026 he left Google to
      co-found Discovery Loop, a public-benefit company aiming to automate scientific discovery,
      with Ghemawat, Vinyals and Quoc Le. With Ghemawat he received the 2012 ACM-Infosys Foundation
      Award (now the ACM Prize in Computing) and the IEEE John von Neumann Medal (2021).
