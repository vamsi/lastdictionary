level: essential
dates: 1912–1954
plain: >-
  A British mathematician who worked out what computers can do in principle, helped break German
  codes in the Second World War, and proposed the best-known test of machine intelligence.
senses:
  - definition: >-
      British mathematician and logician, a founder of computer science and AI. His 1936 paper 'On
      Computable Numbers' defined the Turing machine, an abstract model of computation, and showed
      that some problems cannot be settled by any algorithm. In the Second World War he led work at
      Bletchley Park on breaking the German Enigma cipher. His post-war jobs, designing the
      Automatic Computing Engine at the National Physical Laboratory and, from 1948, working on the
      Manchester computers, ran alongside his writing on machine intelligence: the 1948 report
      'Intelligent Machinery' sketched trainable networks of simple units, and
      [[computing-machinery-and-intelligence|his 1950 paper in Mind]] proposed the imitation game,
      now called the [[turing-test|Turing test]], answered objections such as the
      [[lovelace-objection|Lovelace objection]], and suggested building a learning 'child machine'.
      Convicted in 1952 under the British law that then criminalized sex between men, he died of
      cyanide poisoning in 1954; a posthumous royal pardon followed in 2013. Computing's highest
      honor, the [[turing-award|Turing Award]], bears his name.
