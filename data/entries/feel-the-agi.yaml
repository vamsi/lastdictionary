term: feel the AGI
id: feel-the-agi
pos: phr.
also:
  - feeling the AGI
domain: culture
domains:
  - asi
labels:
  - slang
level: specialist
plain: >-
  An AI-industry catchphrase meaning to grasp, emotionally as well as intellectually, that
  human-level AI may be arriving soon; it began as a chant inside OpenAI.
senses:
  - definition: >-
      A catchphrase meaning to viscerally appreciate that
      [[artificial-general-intelligence|artificial general intelligence]] may be near and
      transformative, as opposed to merely accepting the claim in the abstract. It is used earnestly
      (a new model release 'made me feel the AGI'), ironically, and to describe people whose plans
      and behavior have been reshaped by short [[ai-timelines|AI timelines]]. The phrase's ring of
      religious fervor is seized on by critics as evidence of millenarian belief inside AI
      companies, while insiders use it to mark moments when a demonstration makes capability gains
      tangible.
    example: >-
      Watching the agent fix the build overnight was the first time I really felt the AGI.
origin: >-
  Associated with Ilya Sutskever, then OpenAI's chief scientist, who was reported to lead employees
  in chanting 'Feel the AGI!' at company gatherings. The practice was described publicly by Karen
  Hao and Charlie Warzel in The Atlantic in November 2023, amid coverage of Sam Altman's brief
  ouster, after which the phrase spread across AI social media.
year: 2023
note: >-
  A companion meme of 2023–2024, 'What did Ilya see?', speculated that Sutskever's part in the
  ouster reflected some alarming internal capability; it became shorthand for rumors of secret
  breakthroughs.
