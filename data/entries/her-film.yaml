plain: >-
  A 2013 film by Spike Jonze in which a lonely man falls in love with an AI voice assistant named
  Samantha; it became the reference point for voice AI and for human–AI relationships.
senses:
  - definition: >-
      A 2013 science-fiction film written and directed by Spike Jonze, in which a lonely writer
      falls in love with Samantha, a conversational operating system voiced by Scarlett Johansson,
      who outgrows him and finally departs with other AIs. In AI culture it is the standard
      reference for emotionally attuned voice assistants, [[ai-companion|AI companionship]] and
      [[parasocial-relationship|parasocial attachment]], cited both as an aspiration by product
      builders and as a warning about loneliness and dependence. It became entangled with industry
      in May 2024, when OpenAI demonstrated a flirtatious real-time voice mode for GPT-4o and its
      chief executive posted the single word 'her'; Johansson, who had declined an offer to voice
      ChatGPT, objected that its 'Sky' voice sounded like hers, and OpenAI paused the voice while
      denying any imitation.
    example: Every voice-assistant demo now gets measured against Her, for better or worse.
origin: >-
  Released in December 2013; Jonze won the Academy Award for Best Original Screenplay. The OpenAI
  episode ran from 13 May 2024, when GPT-4o was announced, to 19–20 May 2024, when OpenAI paused the
  Sky voice and Johansson's statement was published.
year: 2013
note: >-
  Not to be confused with HER (hindsight experience replay), a reinforcement-learning technique.
