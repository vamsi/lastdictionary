term: intelligence augmentation
id: intelligence-augmentation
pos: n.
also:
  - IA
  - intelligence amplification
  - augmented intelligence
  - cognitive augmentation
domain: society
domains:
  - hist
  - core
level: core
plain: >-
  Using computers to make people smarter and more capable rather than building machines that think
  on their own: AI as a tool for human minds.
senses:
  - definition: >-
      A research tradition and design goal that uses computing to extend human intellectual
      capabilities, such as memory, perception, reasoning, communication and collaboration, rather
      than to replicate or replace human intelligence in autonomous machines. Historically it was a
      rival program to artificial intelligence ('IA versus AI'), and interactive computing, the
      mouse, hypertext and the personal computer came largely from the IA side. With
      [[large-language-model|large language models]] the distinction has blurred, since the same
      system can act as an autonomous [[ai-agent|agent]] or as a thinking aid, and IA is now invoked
      mainly as a preference for keeping humans in control, alongside
      [[human-centered-ai|human-centered AI]] and the [[centaur|centaur]] model. Some fields,
      notably medicine, use 'augmented intelligence' as a deliberate substitute for 'artificial
      intelligence'.
    example: >-
      He treats the assistant as intelligence augmentation: it widens what one engineer can keep in
      mind at once.
origin: >-
  W. Ross Ashby wrote of amplifying intelligence in An Introduction to Cybernetics (1956); J. C. R.
  Licklider's 'Man-Computer Symbiosis' (1960) and Douglas Engelbart's report 'Augmenting Human
  Intellect: A Conceptual Framework' (1962) set out the program. The AI-versus-IA rivalry is
  chronicled in John Markoff's Machines of Loving Grace (2015).
year: 1962
