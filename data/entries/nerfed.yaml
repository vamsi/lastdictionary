  - eval
labels:
  - slang
level: specialist
plain: >-
  Gaming slang for something made weaker by an update; applied to AI models that users believe got
  worse after a provider changed them, often without saying so.
senses:
  - definition: >-
      Of an AI model or product: weakened by its provider, especially through an unannounced update
      — shorter or lazier answers, tighter usage limits, a smaller or more heavily
      [[quantization|quantized]] model behind the same name, or reduced reasoning effort. Suspected
      'stealth nerfs' are a recurring theme in AI communities because hosted models can change
      without notice and output quality varies from session to session. Providers sometimes
      acknowledge regressions — OpenAI did so when users complained in late 2023 that GPT-4 had
      become 'lazy' — but many claims reflect randomness, harder tasks or rising expectations. The
      difficulty of settling such disputes has encouraged independent tracking of model performance
      over time, pinned version identifiers and public changelogs.
    example: >-
      Same prompts, same repo, half the quality — I think they nerfed it to save compute.
origin: >-
  From gaming slang of the 1990s, after the soft-foam Nerf toys: a weapon or character 'nerfed' by a
  patch was made less effective, a usage widely traced to the online game Ultima Online (1997).
  Applied to AI models from 2023, as ChatGPT users compared answers before and after updates.
year: 2023
note: >-
  Not to be confused with NeRF, the [[neural-radiance-field|neural radiance field]] method for 3D
  scene reconstruction.
