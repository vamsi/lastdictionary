domain: llm
domains:
  - percep
  - gen
level: core
plain: >-
  An AI language model that can also take in — and sometimes produce — pictures, sound or video, so
  you can show it a photo or speak to it, not just type.
senses:
  - definition: >-
      A [[large-language-model|large language model]] extended to accept, and in some cases
      generate, non-text modalities such as images, video, audio and documents. Most systems attach
      a separate encoder for each non-text modality (for example a [[vision-transformer|vision
      transformer]] for images) plus a small learned connector that maps its outputs into the
      language model's embedding space, and are then trained on paired and interleaved data;
      'native' multimodal models instead tokenize all modalities and pretrain on them jointly from
      the start, and some decode image or audio tokens to produce media. MLLMs read charts,
      screenshots and handwriting, answer questions about images ([[visual-question-answering|visual
      question answering]]), converse in speech and underpin [[computer-use|computer use]] agents.
      Typical weaknesses include counting, fine spatial reasoning and describing objects that are
      not there.
    example: >-
      We switched to a multimodal LLM so the agent can read the screenshots instead of parsing the
      HTML.
origin: >-
  DeepMind's Flamingo (April 2022) showed few-shot learning over interleaved images and text, and
  Shaohan Huang and colleagues at Microsoft described Kosmos-1 (February 2023) as a 'Multimodal
  Large Language Model (MLLM)'. GPT-4 (March 2023), LLaVA (April 2023), Google's natively multimodal
  Gemini (December 2023) and OpenAI's GPT-4o (May 2024) made multimodality standard.
year: 2023
note: >-
  Most frontier models are now multimodal, so 'LLM' often implicitly includes MLLMs. For models
  focused on images and text, [[vision-language-model|vision-language model]] is the usual term.
