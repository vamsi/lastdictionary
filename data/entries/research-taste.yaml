# yaml-language-server: $schema=../schema/entry.schema.json

term: research taste
id: research-taste
pos: n.
also:
  - experimental research taste
domain: asi
domains:
  - eval
  - society
labels:
  - emerging
level: specialist
plain: >-
  The knack good researchers have for choosing worthwhile problems, designing the right experiments
  and drawing the right conclusions — a skill seen as key to whether AI can do research on its own.
senses:
  - definition: >-
      The judgment that lets a researcher pick promising problems, design informative experiments
      and interpret results correctly, as distinct from the skill of implementing them. Forecasts of
      [[automated-ai-research|automated AI research]] treat it as a key input: scenario models such
      as [[ai-2027|AI 2027]] scale the speed of AI-driven research by the quality of its taste, so
      that taste rather than coding ability may set the pace of
      [[recursive-self-improvement|recursive self-improvement]]. Because it shows up only in the
      long-run quality of research choices, it is much harder to measure than coding skill.
    example: >-
      The agents can run any experiment we want; what they still lack is research taste about which
      ones matter.
origin: >-
  Long-standing jargon in research culture, of uncertain first use; it became an explicit variable
  in forecasts of automated AI research such as AI 2027 (April 2025).
see_also:
  - automated AI research
  - recursive self-improvement
  - AI scientist
  - superhuman coder
  - AI 2027
  - intelligence explosion
sources:
  - text: >-
      Kokotajlo, D., Alexander, S., Larsen, T., Lifland, E. & Dean, R. (2025). AI 2027. AI Futures
      Project, April 2025.
as_of: 2026-10
