plain: >-
  The scientific society at the center of research on language technology, from translation software
  to chatbots. It runs the field's leading conferences and a free online archive of their papers.
senses:
  - definition: >-
      The main learned society of [[natural-language-processing|natural language processing]] and
      computational linguistics. Its flagship yearly conference shares the society's abbreviation,
      ACL; one of its special-interest groups runs EMNLP, others run workshops, and its regional
      chapters hold NAACL (the Americas), EACL (Europe) and AACL (Asia-Pacific). Its journals are
      Computational Linguistics and Transactions of the ACL, and its Findings volumes publish sound
      papers not accepted to a main conference. Its ACL Anthology, a free archive of papers from its
      own and related venues going back decades, is a basic research resource, and since 2021 ACL
      Rolling Review has centralized peer review across its conferences. Papers such as
      [[bleu|BLEU]] (2002) and [[bert|BERT]] (2019, at NAACL) appeared at its venues; since about
      2020 [[large-language-model|language models]] have dominated its program.
    example: We submitted to ACL Rolling Review and committed the paper to EMNLP.
origin: >-
  Founded in 1962 as the Association for Machine Translation and Computational Linguistics,
  reflecting the field's roots in Cold War [[machine-translation|machine translation]] research; it
  adopted its present name in 1968. Its journal, begun in 1974 as the American Journal of
  Computational Linguistics, became Computational Linguistics in 1984.
year: 1962
