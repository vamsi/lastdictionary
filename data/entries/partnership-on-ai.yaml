term: Partnership on AI
id: partnership-on-ai
pos: prop. n.
also:
  - PAI
  - Partnership on Artificial Intelligence to Benefit People and Society
domain: orgs
domains:
  - society
  - gov
level: specialist
plain: >-
  A forum, set up by big technology companies in 2016 and later joined by universities, charities
  and news organizations, that drafts voluntary guidelines for building and using AI responsibly.
senses:
  - definition: >-
      A San Francisco nonprofit, launched in 2016 by leading technology companies, in which
      corporate members work alongside universities, advocacy groups and news organizations to draft
      voluntary practices for [[responsible-ai|responsible AI]]. Its work includes the AI Incident
      Database (begun under its auspices in 2020 and later independent), the ABOUT ML documentation
      project, a framework of responsible practices for [[synthetic-media|synthetic media]] (2023)
      adopted by companies and newsrooms, guidance for the safe deployment of
      [[foundation-model|foundation models]] (2023), and research on AI's effects on workers and on
      publication norms for high-risk research. Critics have questioned how much influence
      non-industry partners have and whether voluntary guidance constrains member companies; several
      civil-society members, including the digital-rights group Access Now, left in 2020.
origin: >-
  Announced in September 2016 by Amazon, DeepMind, Facebook, Google, IBM and Microsoft; Apple joined
  in January 2017, followed by academic and civil-society members, and it operates as an independent
  nonprofit.
year: 2016
