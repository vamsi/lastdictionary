plain: >-
  A 2023 AI-generated photo of Pope Francis in a stylish white puffer coat that fooled many viewers,
  becoming a landmark example of how convincing fake images had become.
senses:
  - definition: >-
      Popular name for a photorealistic AI-generated image, made with [[midjourney|Midjourney]],
      showing Pope Francis in a long, white, designer-style puffer coat, which circulated in March
      2023 and was taken as genuine by large numbers of viewers, including celebrities. Its harmless
      subject made it a clean demonstration that [[text-to-image-model|image generators]] had
      crossed a threshold of realism: the telltale flaws — a malformed hand, a blurred crucifix
      chain, a distorted coffee cup — were visible only on close inspection. Arriving days after
      fake images of Donald Trump being arrested, it became a standard reference in discussions of
      [[synthetic-media|synthetic media]], [[deepfake|deepfakes]], provenance labeling and media
      literacy, and is often described as an early mass-scale AI image hoax.
    example: >-
      Since the Balenciaga Pope, our photo desk checks provenance before anything viral runs.
origin: >-
  Created by Pablo Xavier, a 31-year-old construction worker from Chicago, and posted online on 24
  March 2023; it spread rapidly on Twitter and Reddit before being debunked. The nickname alludes to
  the luxury fashion house Balenciaga, whose style the coat evoked; the brand had no involvement.
year: 2023
