domain: gov
domains:
  - society
labels:
  - legal
level: specialist
plain: >-
  Software that scores, ranks or screens job candidates or employees. New York City requires
  employers using such tools to have them checked for bias every year and to tell applicants.
senses:
  - definition: >-
      In New York City law, software that applies AI, [[machine-learning|machine learning]],
      statistical modeling or data analytics to reduce information about a job candidate or employee
      to a simple score, classification or recommendation, and that substantially assists or
      replaces human discretion in hiring or promotion. Under Local Law 144 of 2021, enforced from
      July 5, 2023, an employer or employment agency may use such a tool only if it has undergone an
      independent bias audit within the past year, a summary of results (selection rates and impact
      ratios by sex and race or ethnicity) is published, and candidates are notified at least ten
      business days before use; penalties run from $500 to $1,500 per violation. Researchers and a
      December 2025 state audit found low compliance and weak enforcement, partly because employers
      decide for themselves whether a tool 'substantially' assists decisions. Comparable duties
      appear in Illinois employment law and the [[colorado-ai-act|Colorado AI Act]].
    example: >-
      Before rolling out the résumé screener, the employer commissioned the annual bias audit the
      city requires for an automated employment decision tool.
origin: >-
  Defined in New York City's Local Law 144, enacted in late 2021; after delays in writing
  implementing rules, the Department of Consumer and Worker Protection began enforcement on July 5,
  2023, making it the first US law to require bias audits of AI hiring tools.
year: 2021
note: >-
  The impact ratio compares each group's selection rate with that of the most-selected group,
  echoing the four-fifths rule of thumb used in US employment-discrimination analysis.
