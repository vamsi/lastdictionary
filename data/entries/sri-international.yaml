plain: >-
  A nonprofit research institute in California, once part of Stanford University, where the Shakey
  robot was built and the technology behind Apple's Siri assistant began.
senses:
  - definition: >-
      A contract research institute in Menlo Park, California, independent of Stanford University
      since 1970 and run as a nonprofit, whose Artificial Intelligence Center, founded in 1966, was
      among the pioneering AI laboratories. Its researchers built [[shakey-the-robot|Shakey the
      robot]] (1966–1972), the first mobile robot to reason about its own actions, devising along
      the way the [[a-search|A* search]] algorithm (1968) and the [[strips|STRIPS]] planner (1971);
      later work included the PROSPECTOR [[expert-system|expert system]] for mineral exploration,
      natural-language interfaces to databases and speech recognition. From 2003 to 2008 it led
      CALO, a DARPA-funded project on cognitive personal assistants, from which the startup Siri was
      spun out in 2007; Apple bought it in 2010 and launched Siri on the iPhone in 2011. Douglas
      Engelbart's laboratory at SRI also invented the computer mouse.
origin: >-
  Founded in 1946 by Stanford University's trustees as the Stanford Research Institute, a contract
  research center; it separated from the university in 1970 amid protests over military research and
  adopted the name SRI International in 1977. Charles Rosen founded its AI Center in 1966.
year: 1946
