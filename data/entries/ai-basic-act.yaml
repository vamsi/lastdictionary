domain: gov
labels:
  - legal
level: specialist
plain: >-
  South Korea's main AI law, in force since January 2026, which sets safety and transparency duties
  for AI used in sensitive areas and for AI-generated content.
senses:
  - context: South Korea
    definition: >-
      South Korea's comprehensive AI statute, combining support for the AI industry with obligations
      on businesses. Operators must tell users in advance when products use high-impact or
      generative AI and label AI-generated output, especially realistic synthetic media.
      'High-impact' AI — systems that can significantly affect life, safety or fundamental rights,
      such as those used in health care, hiring, lending or biometric analysis — carries duties of
      risk management, explanation, [[human-oversight|human oversight]], impact assessment and
      documentation. Foreign providers meeting thresholds set by decree must appoint a domestic
      representative, and the law reaches activities abroad that affect the Korean market. The
      Ministry of Science and ICT oversees it; fines are capped at 30 million won (about US$20,000),
      modest beside those of the [[eu-ai-act|EU AI Act]].
    example: >-
      Before launching in Seoul, the chatbot added an AI-generated label to satisfy the AI Basic Act.
origin: >-
  Passed by the National Assembly on 26 December 2024, promulgated on 21 January 2025 and in force
  from 22 January 2026, making South Korea the first Asian country — and, by most counts, the second
  jurisdiction after the European Union — with a comprehensive AI law.
year: 2025
