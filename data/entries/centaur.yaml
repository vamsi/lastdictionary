term: centaur
id: centaur
pos: n.
also:
  - centaur chess
  - advanced chess
  - centaur model
  - cyborg (work style)
domain: society
domains:
  - culture
  - hist
labels:
  - figurative
level: core
plain: >-
  A human and an AI working as a team, each doing what it does best, like a chess player who
  consults a computer before every move. The name comes from the mythical half-human, half-horse
  creature.
senses:
  - context: Human–AI collaboration
    definition: >-
      A human–machine team in which a person and an AI system combine their strengths, the person
      typically supplying goals, judgment, context and accountability, and the machine supplying
      calculation, recall or generation. The image comes from chess, where in 2000s freestyle
      tournaments amateurs consulting several engines could beat grandmasters and strong engines
      alike, suggesting that a good collaboration process mattered more than either partner's raw
      strength. In studies of knowledge work, centaurs divide tasks cleanly between human and AI,
      whereas cyborgs interleave their work with the AI's at a fine grain. Whether centaurs keep an
      edge as AI improves is debated; in chess, the human partner's contribution shrank as engines
      strengthened.
    example: >-
      She works as a centaur: the model does the literature sweep, and she decides what the evidence
      means.
  - context: Chess
    definition: >-
      A player, or team, competing with the help of chess software in advanced or centaur chess, a
      format in which consulting engines during the game is permitted. Freestyle events let teams
      combine several people and several engines, and the format was used to study how human
      judgment and machine calculation combine.
origin: >-
  Garry Kasparov organized the first advanced-chess match, in which each player used a computer, in
  León, Spain, in 1998, and championed the centaur idea; a 2005 online freestyle tournament won by
  two amateurs running several engines became its emblem. Fabrizio Dell'Acqua, Ethan Mollick and
  colleagues contrasted centaurs and cyborgs in their 2023 study of consultants.
year: 1998
