  - hw
labels:
  - contested
level: specialist
plain: >-
  Ray Kurzweil's claim that technology improves at an ever-faster rate, because each advance helps
  build the next, so progress speeds up exponentially rather than steadily.
senses:
  - definition: >-
      Ray Kurzweil's thesis that progress feeds on itself: because each generation of technology
      helps build the next and the gains are reinvested, the pace of change in evolving systems,
      technology included, rises exponentially rather than holding steady. He argues that the
      price-performance of computing has followed a smooth exponential curve through five successive
      paradigms (electromechanical calculators, relays, vacuum tubes, discrete transistors and
      integrated circuits), with [[moore-s-law|Moore's law]] only the fifth, and that new paradigms
      take over as old ones saturate. From this he projected that computers would pass a valid
      [[turing-test|Turing test]] by 2029 and that a [[technological-singularity|technological
      singularity]] would arrive around 2045. Supporters cite the long-run growth of computation
      and, since about 2010, of AI training compute; critics object that an exponential trend in one
      metric does not imply exponential growth in capability or in technology generally, that the
      data are selected to fit the curve, and that most trends eventually saturate.
    example: >-
      Kurzweil reads the scaling of training compute as one more instance of the law of accelerating
      returns.
origin: >-
  Introduced by Ray Kurzweil in The Age of Spiritual Machines (1999) and set out in his essay 'The
  Law of Accelerating Returns' (2001); elaborated in The Singularity Is Near (2005) and The
  Singularity Is Nearer (2024).
year: 1999
