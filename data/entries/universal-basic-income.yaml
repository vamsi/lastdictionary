term: universal basic income
id: universal-basic-income
pos: n.
also:
  - UBI
  - basic income
  - citizen's income
  - unconditional basic income
domain: society
domains:
  - gov
labels:
  - contested
level: core
plain: >-
  A regular cash payment from the government to every adult, with no conditions attached, sometimes
  proposed as a way to share wealth if AI takes over much paid work.
senses:
  - definition: >-
      An income guarantee under which the state pays every individual, rather than every household,
      a regular cash sum, whether they are rich or poor, working or not, and asks nothing in return.
      In AI debates it is proposed as a response to [[technological-unemployment|technological
      unemployment]] and to the concentration of income from automation among the owners of capital
      and compute, sometimes funded by taxes on AI firms or a share of their profits. Critics
      question its cost at meaningful levels, its effects on work incentives and prices, and whether
      cash can replace the status, structure and bargaining power that employment provides. Pilots
      have been limited in scale or duration: Finland's 2017–2018 experiment found better wellbeing
      but little effect on employment, a three-year US study reported in 2024 found that recipients
      of $1,000 a month worked 1–2 hours a week less, and a 12-year study in Kenya is under way;
      none tests a permanent, truly universal scheme.
    example: >-
      If models do most cognitive work, she argued, universal basic income stops being utopian and
      becomes infrastructure.
origin: >-
  Precursors include Thomas Paine's proposal of a universal endowment in Agrarian Justice (1797) and
  mid-20th-century negative-income-tax plans associated with Milton Friedman. The modern idea was
  organized from 1986 by the Basic Income European Network (now the Basic Income Earth Network);
  technology-industry interest surged after 2016 amid fears of AI-driven automation.
see_also:
  - technological unemployment
  - automation
  - concentration of power
  - intelligence curse
  - explosive growth
sources:
