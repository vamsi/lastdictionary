  - hist
level: specialist
dates: 1928–2016
plain: >-
  A British-born painter who wrote AARON, a program that made its own drawings and paintings from
  the early 1970s, making him a pioneer of art produced by AI.
senses:
  - definition: >-
      British-born artist who created AARON, a long-running art-making program and a landmark of
      [[ai-art|AI art]]. An established abstract painter who represented Britain at the 1966 Venice
      Biennale, he moved to the University of California, San Diego, in 1968, learned to program,
      and began AARON in the early 1970s, partly as a guest scholar at the Stanford Artificial
      Intelligence Laboratory. Unlike later [[generative-model|generative models]] trained on
      images, AARON was a [[rule-based-system|rule-based system]] encoding Cohen's own knowledge of
      drawing: it produced original line drawings, at first abstract and from the 1980s depicting
      plants and people, and from 1995 colored its own images, executed by a small drawing robot
      ('turtle'), plotters and later a custom painting machine. Cohen developed it for over four
      decades and showed its work at major museums, including the San Francisco Museum of Modern Art
      (1979) and the Tate Gallery (1983). His essays on whether AARON was creative anticipated later
      debates over machine authorship in [[generative-art|generative art]].
