# yaml-language-server: $schema=../schema/entry.schema.json

term: post hoc explanation
id: post-hoc-explanation
pos: n.
also:
  - post hoc interpretability
  - post hoc explainability
domain: interp
domains:
  - ml
level: core
plain: >-
  An explanation produced after a model has been built, by a separate tool that examines the
  finished model, rather than one that comes from a model designed to be understandable.
senses:
  - definition: >-
      An explanation of a trained model's behavior generated by a method applied after training,
      without constraining how the model was built. Post hoc methods may treat the model as a
      [[black-box|black box]] that can only be queried ([[lime|LIME]], [[shap|SHAP]],
      [[counterfactual-explanation|counterfactuals]], [[partial-dependence-plot|partial
      dependence]]) or exploit its internals ([[saliency-map|gradient saliency]],
      [[integrated-gradients|integrated gradients]], [[grad-cam|Grad-CAM]],
      [[testing-with-concept-activation-vectors|concept activation vectors]], [[probing|probing]]).
      They can be applied to existing models too complex to understand directly, but they
      approximate rather than reveal the model's computation: different methods often disagree about
      the same prediction, explanations can shift under tiny input changes, and a model can be
      deliberately built to hide discriminatory behavior from perturbation-based explainers. Their
      reliability is therefore checked with [[faithfulness|faithfulness]] tests, such as deleting
      the features an explanation ranks highest and measuring how much the output changes.
    example: >-
      The model was a gradient-boosted ensemble, so we relied on post hoc explanations from SHAP.
origin: >-
  Zachary C. Lipton's 'The Mythos of Model Interpretability' (2016) contrasted post hoc
  interpretability with transparency; the post hoc versus intrinsic (or ante hoc) distinction became
  standard in surveys by 2018–2019 and was sharpened by Cynthia Rudin's 2019 critique of explaining
  black boxes in high-stakes settings.
year: 2016
note: >-
  Latin post hoc, 'after this'. Rudin argued that post hoc explanations can mislead and that
  interpretable models often perform as well on structured data; defenders reply that many
  high-performing models, including all large language models, admit no simpler substitute.
see_also:
  - interpretable model
  - explainable AI
  - feature attribution
  - surrogate model
  - faithfulness
  - local explanation
contrast:
  - interpretable model
sources:
  - text: >-
      Lipton, Z. C. (2018). The Mythos of Model Interpretability. ACM Queue 16(3). (Workshop version
      2016.)
  - text: >-
      Rudin, C. (2019). Stop explaining black box machine learning models for high stakes decisions
      and use interpretable models instead. Nature Machine Intelligence 1, 206–215.
