  - percep
  - hist
level: essential
dates: b. 1960
plain: >-
  A French-American computer scientist who pioneered the neural networks that recognize images, led
  Meta's AI research for over a decade, and argues that chatbots alone will not reach human-level
  AI.
senses:
  - definition: >-
      French-American computer scientist, professor at New York University since 2003. His 1987
      Paris doctorate proposed an early form of [[backpropagation|backpropagation]], and at AT&T
      Bell Laboratories he used it to train [[convolutional-neural-network|convolutional neural
      networks]] to read handwriting; the resulting [[lenet|LeNet]] systems read a large share of US
      bank checks by the late 1990s, and he co-created the [[mnist|MNIST]] dataset. He was founding
      director of Facebook AI Research (FAIR) from 2013 and later Meta's chief AI scientist,
      championing [[open-weight-model|open-weight]] releases. A prominent skeptic of
      [[existential-risk|existential risk]] arguments and of [[large-language-model|large language
      models]] as a path to human-level AI, he advocates [[world-model|world models]] trained with
      joint-embedding predictive architectures (JEPA). Leaving Meta at the end of 2025, he
      co-founded and chairs Advanced Machine Intelligence (AMI) Labs, a world-model startup that
      raised over US$1 billion in 2026. He shared the 2018 [[turing-award|Turing Award]] with
      [[geoffrey-hinton|Geoffrey Hinton]] and [[yoshua-bengio|Yoshua Bengio]].
