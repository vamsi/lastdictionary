term: Thomas Nagel
id: thomas-nagel
sort_as: Nagel Thomas
pos: prop. n.
domain: people
domains:
  - mind
level: specialist
dates: b. 1937
plain: >-
  An American philosopher whose 1974 essay 'What Is It Like to Be a Bat?' defined consciousness as
  there being something it is like to be a creature, a test now applied to machines.
senses:
  - definition: >-
      American philosopher, born in Belgrade, University Professor emeritus at New York University.
      His essay 'What Is It Like to Be a Bat?' (1974) argued that an organism is conscious exactly
      when there is 'something that it is like to be that organism', and that this subjective
      character escapes any objective, physical description: no amount of knowledge about
      echolocation tells us what it is like for a bat. The formula became the standard way of
      picking out [[phenomenal-consciousness|phenomenal consciousness]], and the argument
      anticipated the [[hard-problem-of-consciousness|hard problem of consciousness]] and the
      [[knowledge-argument|knowledge argument]]. In AI debates it frames the question of whether
      there is anything it is like to be a machine, and why behavioral evidence may not settle it
      (see [[machine-consciousness|machine consciousness]], [[problem-of-other-minds|problem of
      other minds]]). His later books, from 'The View from Nowhere' (1986) to 'Mind and Cosmos'
      (2012), question whether materialist science can fully account for minds.
see_also:
