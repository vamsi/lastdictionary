plain: >-
  A family of AI assistants and language models made by the company Anthropic since 2023, widely
  used for writing, analysis and computer programming.
senses:
  - definition: >-
      [[anthropic|Anthropic]]'s family of [[large-language-model|large language models]], first
      released in March 2023, together with the AI assistant that runs on them. Claude models are
      trained with [[reinforcement-learning-from-human-feedback|reinforcement learning from human
      feedback]] and Anthropic's [[constitutional-ai|constitutional AI]] method, in which a written
      set of principles guides AI-generated feedback, and are released under the company's
      [[responsible-scaling-policy|Responsible Scaling Policy]] with published [[system-card|system
      cards]]. Since the Claude 3 generation (March 2024), models have been offered in tiers: Haiku
      (small and fast), Sonnet (balanced) and Opus (most capable). In 2026 Anthropic added a higher
      Mythos tier. Claude Mythos Preview was offered only to selected organizations under Project
      Glasswing; Claude Mythos 5.1 and Claude Fable 5.1 share one underlying model, Fable adding
      safety measures for biology, cybersecurity and AI research and development. Milestones include
      'computer use' (October 2024), in which the model operates a desktop through screenshots and
      mouse and keyboard actions, hybrid reasoning with visible [[extended-thinking|extended
      thinking]] (Claude 3.7 Sonnet, February 2025) and agentic coding through [[claude-code|Claude
      Code]]. As of October 2026 Anthropic's most recent public models were Claude Fable 5.1, Claude
      Opus 5.5, Claude Sonnet 5.5 and Claude Haiku 5.5.
    example: >-
      We route quick classification to Claude Haiku and hand the large refactoring to Claude Opus.
origin: >-
  Released by Anthropic, founded in 2021 by former [[openai|OpenAI]] staff led by
  [[dario-amodei|Dario Amodei]] and Daniela Amodei, after testing with partners in early 2023.
  Claude 2 followed in July 2023, Claude 3 in March 2024 and Claude 4 in May 2025; Claude Fable 5
  and Claude Mythos 5 were first released on 9 June 2026, and the Claude 5.5 models followed from
  September 2026. The name is widely reported to honor [[claude-shannon|Claude Shannon]].
year: 2023
note: >-
  Model names combine tier and version number (Claude Opus 4.5, Claude Sonnet 5.5). Access to Claude
  Fable 5 and Claude Mythos 5 was suspended on 12 June 2026 to comply with a US government
  export-control directive, and restored on 1 July 2026 after the controls were lifted on 30 June.
