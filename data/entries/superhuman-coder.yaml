level: specialist
plain: >-
  A milestone used by AI forecasters: an AI that can do the coding work of a company's best
  programmer, far faster and in many copies at once.
senses:
  - definition: >-
      A capability milestone defined in the [[ai-2027|AI 2027]] forecasts: an AI that matches the
      best human programmer at the coding work of AI research while running faster and more cheaply,
      so that a lab can field it at enormous scale. Operationally, the forecasters set the bar where
      a leading company, spending 5% of its compute, could run agents numbering thirty times its
      human research engineers, each thirty times quicker than its best engineer. Coding was chosen
      because it is a large, measurable share of AI research, so a superhuman coder would sharply
      accelerate [[automated-ai-research|automated AI research]]; it is the first in the forecast's
      sequence of milestones, followed by superhuman and then superintelligent AI researchers and
      [[artificial-superintelligence|artificial superintelligence]]. In the April 2025 forecast the
      two lead forecasters' model-based medians for its arrival were 2027–2028 and their
      all-things-considered medians 2028 and 2030 (outside forecasters from FutureSearch gave 2033);
      Lifland lengthened his estimates in May 2025, and the project's December 2025 model put full
      coding automation about three to five years later than its predecessor.
    example: >-
      On their December 2025 model, full coding automation slipped from 2027 to around 2030 or later.
origin: >-
  Defined in the forecasts accompanying [[ai-2027|AI 2027]], published by the AI Futures Project in
  April 2025, notably the timelines forecast by Eli Lifland, Nikola Jurkovic and FutureSearch.
year: 2025
