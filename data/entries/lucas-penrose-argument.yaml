term: Lucas–Penrose argument
id: lucas-penrose-argument
pos: n.
also:
  - Penrose–Lucas argument
  - Gödelian argument
  - mathematical objection
domain: mind
domains:
  - math
labels:
  - contested
level: specialist
plain: >-
  An argument that human minds cannot be computers because, using a famous result in logic, people
  can see that certain statements are true that no fixed computer program could prove.
senses:
  - definition: >-
      An argument from Kurt Gödel's incompleteness theorems that the human mind is not equivalent to
      any machine. For any consistent formal system strong enough for arithmetic — and so for any
      computer program regarded as a theorem-proving system — there is a true sentence, its Gödel
      sentence, that the system cannot prove; a human mathematician, the argument runs, can see that
      the sentence is true, so the mathematician is not that system and, since the system was
      arbitrary, not any machine. Roger Penrose added that human understanding must therefore
      exploit non-computable physical processes. Most logicians and philosophers reject the
      argument, chiefly because humans cannot in general know that their own reasoning is
      consistent, and because it credits people with an infallible mathematical insight they lack.
origin: >-
  Alan Turing considered and rejected 'the mathematical objection' in 1950. J. R. Lucas stated the
  argument in 'Minds, Machines and Gödel' (Philosophy, 1961), and Roger Penrose revived and extended
  it in The Emperor's New Mind (1989) and Shadows of the Mind (1994).
year: 1961
note: >-
  Gödel himself drew only a disjunctive conclusion (1951): either the mind surpasses every machine
  or there are absolutely unsolvable mathematical problems. Penrose's proposed physical mechanism,
  developed with Stuart Hameroff as 'orchestrated objective reduction', is a separate and equally
  contested hypothesis.
see_also:
  - Lovelace objection
  - computational theory of mind
  - strong AI
  - machine consciousness
  - Computing Machinery and Intelligence
sources:
  - text: Lucas, J. R. (1961). Minds, Machines and Gödel. Philosophy 36(137), 112–127.
  - text: Penrose, R. (1989). The Emperor's New Mind. Oxford University Press.
