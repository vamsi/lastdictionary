level: core
plain: >-
  The push in the United States for a single national AI law that would override the states' own AI
  laws, and the fight over whether that is wise or even lawful.
senses:
  - definition: >-
      In US law, the displacement of state AI regulation by federal law, and the political campaign
      to achieve it. Under the Constitution's Supremacy Clause, a federal statute can preempt state
      law expressly, by occupying a field or through conflict; an executive order cannot do so by
      itself, though agencies acting under statutory authority sometimes can. Supporters, including
      the Trump administration and much of the AI industry, argue that divergent state laws such as
      the [[colorado-ai-act|Colorado AI Act]], [[sb-53|SB 53]] and the [[raise-act|RAISE Act]]
      create a costly patchwork and hamper competition with China. Opponents, including state
      officials of both parties, civil-society groups and some developers, argue that states are
      filling a vacuum left by Congress and that preemption without federal standards amounts to
      deregulation. Proposals range from a blanket bar on enforcing state AI laws to time-limited
      preemption of rules on frontier-model development, with carve-outs for child safety and laws
      of general applicability.
    example: >-
      Any preemption deal will turn on whether state child-safety and deepfake laws are carved out.
origin: >-
  Became a live federal issue in May 2025, when the House put a ten-year moratorium on enforcing
  state AI laws into its budget reconciliation bill; the Senate stripped it 99–1 on July 1, 2025.
  President Donald Trump's Executive Order 14365 of December 11, 2025, 'Ensuring a National Policy
  Framework for Artificial Intelligence', created a Justice Department AI Litigation Task Force
  (January 2026), sought to tie federal broadband funds to states' AI laws and requested a
  preemptive federal bill.
year: 2025
note: >-
  As of late September 2026 Congress had passed no preemption statute; proposals included the Great
  American AI Act, a House draft released in June 2026 that would set a national framework including
  rules for frontier models. The Justice Department filed a companion complaint in xAI's April 2026
  challenge to Colorado's law.
