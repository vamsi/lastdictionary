plain: >-
  A British-born American computer scientist whose online courses have taught machine learning to
  millions; he also co-founded Google's deep learning team, Google Brain, and the online-course
  company Coursera.
senses:
  - definition: >-
      British-born American computer scientist, adjunct professor at Stanford University, where he
      has taught since 2002. His research includes helicopter flight learned from human
      demonstrations (with Pieter Abbeel), [[latent-dirichlet-allocation|latent Dirichlet
      allocation]] (with David Blei and Michael Jordan, 2003) and early use of [[gpu|GPUs]] to train
      large neural networks (2009). In 2011 he co-founded [[google-brain|Google Brain]] with Jeff
      Dean and Greg Corrado; its 2012 experiment, in which a network trained on unlabeled YouTube
      frames learned to detect cats, publicized large-scale [[deep-learning|deep learning]]. His
      2011 online Stanford machine-learning course enrolled over 100,000 students and led him to
      co-found Coursera (2012) with Daphne Koller. He was chief scientist at [[baidu|Baidu]]
      (2014–2017), then founded DeepLearning.AI, Landing AI and the venture studio AI Fund. He
      popularized the slogan 'AI is the new electricity' and advocates
      [[data-centric-ai|data-centric AI]].
