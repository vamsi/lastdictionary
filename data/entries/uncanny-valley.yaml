  - text: >-
      Mori, M. (2012). The uncanny valley (K. F. MacDorman & N. Kageki, trans.). IEEE Robotics &
      Automation Magazine 19(2), 98–100; republished online by IEEE Spectrum, 12 June 2012.
    url: https://spectrum.ieee.org/the-uncanny-valley
