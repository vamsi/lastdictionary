# yaml-language-server: $schema=../schema/entry.schema.json

term: uncanny valley
id: uncanny-valley
pos: n.
also:
  - uncanny valley effect
  - bukimi no tani
domain: robot
domains:
  - society
  - gen
  - mind
labels:
  - contested
level: core
plain: >-
  The eerie feeling people get from robots, dolls or computer-made faces that look almost, but not
  quite, human: liking grows with human likeness, then suddenly plunges.
senses:
  - definition: >-
      The hypothesized dip in people's affinity for an artificial figure — robot, prosthesis, doll,
      animated or AI-generated character — as it approaches but falls short of human likeness:
      affinity rises with human likeness, plunges into eeriness or revulsion when a figure is nearly
      human but subtly wrong, and recovers only at full human likeness. Masahiro Mori sketched it as
      a curve with a corpse and a zombie at the bottom, and argued that movement deepens the valley:
      a realistic prosthetic hand that moves stiffly is more unsettling than a still one. Proposed
      explanations include perceptual mismatch between realistic and unrealistic cues, uncertainty
      about category (human or machine), reminders of death and evolved disease avoidance. Empirical
      support is mixed: many studies find a dip for some stimuli, but its shape, causes and
      persistence with familiarity are disputed. The idea shapes robot design, animation and video
      games and, increasingly, reactions to AI-generated video, avatars and voices; many
      [[humanoid-robot|humanoid robot]] makers choose stylized faces partly to avoid it.
    example: The demo avatar was technically impressive but sat right in the uncanny valley.
origin: >-
  Proposed by the roboticist Masahiro Mori of the Tokyo Institute of Technology in the 1970 essay
  'Bukimi no tani' in the Japanese journal Energy. The English phrase appears in Jasia Reichardt's
  Robots: Fact, Fiction, and Prediction (1978); translations by Karl MacDorman with Takashi Minato
  (2005) and with Norri Kageki (2012, authorized by Mori) and press coverage of computer-animated
  films from 2001 popularized it.
year: 1970
note: >-
  Mori's curve was a thought experiment, not a fitted dataset. His Japanese term for the vertical
  axis, rendered 'familiarity' in early translations and 'affinity' in the authorized one, has no
  exact English equivalent, which complicates comparisons across studies.
see_also:
  - humanoid robot
  - anthropomorphism
  - human–robot interaction
  - deepfake
  - AI companion
sources:
