term: deep synthesis
id: deep-synthesis
pos: n.
also:
  - deep synthesis technology
  - 深度合成
domain: gov
domains:
  - gen
labels:
  - legal
level: specialist
plain: >-
  The Chinese legal term for AI that creates or alters text, images, voices, video or virtual scenes
  — the technology behind deepfakes — and for the rules that govern it.
senses:
  - definition: >-
      In Chinese regulation, the use of generative algorithms, from [[deep-learning|deep learning]]
      to virtual-reality techniques, to create or alter content of any kind (writing, voices and
      other sound, pictures, video, virtual scenes), as in face swapping, voice cloning, automated
      writing and 3D reconstruction. The Provisions on the Administration of Deep Synthesis Internet
      Information Services, in force since January 10, 2023, require providers to verify users' real
      identities; obtain consent before editing a person's face or voice; review inputs and outputs;
      prominently label content that could confuse or mislead the public, such as synthetic faces
      and voices, chatbot dialogue and immersive scenes; prohibit the removal or concealment of
      labels; keep logs; complete [[algorithm-filing|algorithm filing]]; and assess the security of
      tools that edit biometric features. Using deep synthesis to produce or spread fake news is
      forbidden. The term covers what English speakers call [[deepfake|deepfakes]] and
      [[synthetic-media|synthetic media]] while avoiding the pejorative 'fake'.
    example: >-
      Because the app swaps faces, it counts as a deep synthesis service and must label its output.
origin: >-
  Used in Chinese industry and policy writing by the early 2020s as a neutral alternative to
  'deepfake'; codified in rules issued on November 25, 2022 by the Cyberspace Administration of
  China, the Ministry of Industry and Information Technology and the Ministry of Public Security.
year: 2022
note: >-
  Its labeling duties were elaborated by China's 2025 [[ai-generated-content-labeling|AI-generated
  content labeling]] measures and mandatory national standard.
