  - gain ratio
domain: ml
domains:
  - sym
  - hist
level: specialist
plain: >-
  A widely used 1990s program that learns decision trees and rule sets from data; unlike its
  predecessor, it trims away unhelpful branches, copes with gaps in the data and can split on
  measured numbers.
senses:
  - definition: >-
      A [[decision-tree|decision tree]] learning system, successor to [[id3|ID3]], that extends
      entropy-based induction to practical data. It chooses splits by gain ratio —
      [[information-gain|information gain]] divided by the entropy of the split itself, which
      counters ID3's bias toward many-valued attributes — cuts numeric attributes at learned
      thresholds, and sends an example with a missing value down every branch with fractional
      weights. After growing the tree it prunes it with a pessimistic, confidence-based estimate of
      error computed on the training data, so no held-out set is needed, and it can convert trees
      into ordered rule sets. Its commercial successor C5.0 (See5 on Windows) added
      [[boosting|boosting]], misclassification costs and faster, smaller trees; the Weka toolkit's
      free Java version goes by the name J48.
    example: >-
      As a quick interpretable baseline, we ran J48, Weka's version of C4.5, with default pruning.
origin: >-
  Developed by J. Ross Quinlan and described in his book 'C4.5: Programs for Machine Learning'
  (Morgan Kaufmann, 1993). Among algorithms nominated and voted on at the 2006 IEEE International
  Conference on Data Mining, it was listed first in the resulting paper 'Top 10 Algorithms in Data
  Mining' (2008).
year: 1993
