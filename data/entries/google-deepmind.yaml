level: essential
plain: >-
  Google's main artificial intelligence laboratory, formed in 2023 by joining DeepMind and Google
  Brain. It builds the Gemini models and scientific AI systems such as AlphaFold.
senses:
  - definition: >-
      The AI research and development unit of Alphabet, Google's parent company, responsible for the
      [[gemini|Gemini]] family of [[multimodal-ai|multimodal]] models behind Google's assistant and
      search features, as well as image, video, music and robotics models, trained largely on
      Google's own [[tpu|TPUs]]. It continues the scientific program of its predecessor
      [[deepmind|DeepMind]]: AlphaFold 3 (2024) extended [[alphafold|AlphaFold]] to other
      biomolecules; [[alphaproof|AlphaProof]] and [[alphageometry|AlphaGeometry]] reached
      silver-medal standard on International Mathematical Olympiad problems in 2024, and an advanced
      Gemini model reached gold standard in 2025; [[alphaevolve|AlphaEvolve]] (2025) used language
      models to discover improved algorithms; and the Genie models generate interactive environments
      that serve as [[world-model|world models]]. It publishes a
      [[frontier-safety-framework|Frontier Safety Framework]] for evaluating dangerous capabilities.
      As of October 2026 Demis Hassabis is its chair, having handed day-to-day leadership to Koray
      Kavukcuoglu in August 2026 on becoming Alphabet's chief scientist.
    example: Google DeepMind shipped the new Gemini model to the search team first.
origin: >-
  Formed in April 2023, when Alphabet merged [[deepmind|DeepMind]] with Google Research's
  [[google-brain|Google Brain]] team to concentrate its AI work after ChatGPT intensified
  competition; Demis Hassabis became chief executive. On 5 August 2026 Alphabet announced that he
  would become chair of Google DeepMind and Alphabet's chief scientist, with Koray Kavukcuoglu
  overseeing its operations.
year: 2023
note: >-
  The press often shortens the name to 'DeepMind'; see [[deepmind|DeepMind]] for the laboratory's
  history before 2023.
