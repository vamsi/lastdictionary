plain: >-
  An American computer scientist who wrote a classic machine-learning textbook with the field's most
  quoted definition of learning, and founded the first university department devoted to machine
  learning.
senses:
  - definition: >-
      American computer scientist at Carnegie Mellon University, where he founded and chaired the
      world's first academic department of machine learning (2006). His doctoral work at Stanford
      introduced version spaces (1977), a way of representing all hypotheses consistent with a set
      of training examples, and his textbook 'Machine Learning' (1997) gave the field's most quoted
      formal definition, built on three letters: a program learns if gaining experience E makes it
      better at some class of tasks T, as judged by a performance measure P. He led the Never-Ending
      Language Learner (NELL, from 2010), which read the web continuously to grow a
      [[knowledge-base|knowledge base]], an early experiment in [[continual-learning|continual
      learning]]; showed with colleagues that brain activity evoked by concrete nouns could be
      predicted from word statistics (2008); and with [[erik-brynjolfsson|Erik Brynjolfsson]]
      assessed which occupational tasks [[machine-learning|machine learning]] could perform (see
      [[task-exposure|task exposure]]). He is a member of the US National Academy of Engineering.
