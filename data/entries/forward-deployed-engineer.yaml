term: forward deployed engineer
id: forward-deployed-engineer
pos: n.
also:
  - FDE
  - forward deployed engineering
domain: eng
domains:
  - society
labels:
  - emerging
level: specialist
plain: >-
  An engineer from an AI or software company who works directly inside a customer's organization,
  building and tailoring the company's systems to that customer's real problems.
senses:
  - definition: >-
      A software engineer employed by a technology vendor who works embedded with a customer, often
      on site, to adapt and deploy the vendor's platform for that customer's workflows and data,
      combining engineering with consulting and product feedback. In the AI industry, forward
      deployed engineers connect [[model-api|models]] and [[ai-agent|agents]] to customers' systems,
      build [[retrieval-augmented-generation|retrieval]] over their data, write evaluations for
      their use cases, and carry lessons back to the vendor's product and research teams. The model
      trades the scalability of self-serve software for faster adoption and close knowledge of
      customer needs, and it responds to the gap between impressive AI demonstrations and dependable
      production use in large organizations.
    example: >-
      The lab sent two forward deployed engineers to help the insurer turn its claims pilot into a
      production system.
origin: >-
  Originated at the data-analytics company Palantir, which from the late 2000s deployed engineers to
  government and corporate clients. AI laboratories and startups adopted the title widely in
  2024–2025, when job postings for forward deployed engineers rose sharply.
see_also:
