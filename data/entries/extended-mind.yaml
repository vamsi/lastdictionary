term: extended mind
id: extended-mind
pos: n.
also:
  - extended mind thesis
  - extended cognition
  - Otto's notebook
  - active externalism
domain: mind
domains:
  - society
labels:
  - contested
level: specialist
plain: >-
  The idea that the mind can reach beyond the head into tools we rely on — a notebook, a phone,
  perhaps an AI assistant — when they play the same role that memory or reasoning would.
senses:
  - definition: >-
      The thesis that cognitive processes, and even standing beliefs, can be partly constituted by
      resources outside the brain and body when those resources are coupled with the agent in the
      right way. Andy Clark and David Chalmers's example is Otto, a man with memory impairment who
      consults a notebook to find a museum's address: because the notebook plays the role that
      biological memory plays for Inga, who simply remembers, they argue that its entries count as
      Otto's beliefs. Proposed conditions include that the resource be reliably available, routinely
      consulted and automatically trusted. Critics object that the thesis confuses causal
      contribution with constitution and would inflate the mind without limit. With smartphones,
      search engines and AI assistants that remember, draft and reason for their users, it figures
      in debates over cognitive offloading, dependence and whether AI augments or replaces human
      thinking.
origin: >-
  Proposed by Andy Clark and David Chalmers in 'The Extended Mind' (Analysis, 1998), building on
  ideas of distributed and situated cognition from Edwin Hutchins and others; Clark developed it in
  Supersizing the Mind (2008).
year: 1998
