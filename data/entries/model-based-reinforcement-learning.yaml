      Approximating Dynamic Programming. Proceedings of ICML 1990.
  - text: >-
      Moerland, T. M., Broekens, J., Plaat, A. & Jonker, C. M. (2023). Model-based Reinforcement
      Learning: A Survey. Foundations and Trends in Machine Learning 16(1), 1–118.
