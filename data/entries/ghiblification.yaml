plain: >-
  The March 2025 craze for turning photos into pictures in the style of Japan's Studio Ghibli using
  ChatGPT's new image tool, and the debate it sparked over AI copying artists' styles.
senses:
  - definition: >-
      The conversion of photographs and memes into images imitating the hand-drawn look of Studio
      Ghibli, the Japanese animation studio co-founded by Hayao Miyazaki, using
      [[generative-ai|generative AI]]; specifically, the viral trend that followed OpenAI's launch
      of native image generation in ChatGPT's GPT-4o model in March 2025. Millions of users
      'Ghiblified' family photos, pets, historical scenes and memes, producing demand that strained
      OpenAI's servers. The trend crystallized debates over style imitation: artistic style is not
      protected by copyright in most jurisdictions, but critics argued that reproducing a living
      studio's signature look without consent or payment exploits its artists' labor, and asked what
      the [[training-data|training data]] contained; defenders called it homage and democratized
      creativity. Official and political accounts also adopted the style, drawing further criticism.
    example: My feed is nothing but Ghiblified wedding photos this week.
origin: >-
  OpenAI released GPT-4o image generation on 25 March 2025; Ghibli-style images flooded social media
  within a day, Sam Altman adopted one as his profile picture, and he soon wrote that the company's
  GPUs were melting under demand. A 2016 documentary clip in which Miyazaki called an AI animation
  demonstration 'an insult to life itself' recirculated widely as a rebuke.
year: 2025
note: >-
  Miyazaki's 2016 remark responded to a grotesque motion-generation demo, not to image generation in
  general, though it is now widely quoted in that sense.
