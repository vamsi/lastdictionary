term: Blockhead
id: blockhead
pos: n.
also:
  - Blockhead argument
  - psychologism
  - lookup-table argument
domain: mind
domains:
  - eval
level: specialist
plain: >-
  An imagined machine that passes any conversation test by looking up prewritten replies in an
  unimaginably huge table. Most people judge it unintelligent, which suggests that behavior alone
  does not prove intelligence.
senses:
  - definition: >-
      A hypothetical system, described by Ned Block, that gives sensible replies in any conversation
      of bounded length by looking them up in a gigantic table listing a reasonable continuation for
      every possible conversation history. Such a machine would pass the [[turing-test|Turing
      test]], yet intuitively it is not intelligent, since all the intelligence lies with the
      programmers who wrote the table. Block concluded that intelligence depends on how behavior is
      produced, not only on what behavior is produced — a position he called psychologism, opposed
      to behaviorism. The argument recurs in debates over [[large-language-model|large language
      models]]: skeptics liken them to compressed lookup tables built from training text, while
      others reply that a model's parameters are vastly too few to store Blockhead's table, so it
      must generalize rather than retrieve.
origin: >-
  Ned Block, 'Psychologism and Behaviorism' (Philosophical Review, 1981); later writers nicknamed
  the machine 'Blockhead'. Claude Shannon and John McCarthy had made a similar point about
  table-lookup machines and Turing-style tests in their preface to Automata Studies (1956).
year: 1981
see_also:
  - Turing test
  - Chinese room
  - machine understanding
  - memorization
  - problem of other minds
contrast:
  - Turing test
sources:
  - text: >-
      Block, N. (1981). Psychologism and Behaviorism. The Philosophical Review 90(1), 5–43.
