  - false positive
  - ROC curve
  - confusion matrix
  - precision
  - AUC
contrast:
  - precision
sources:
  - text: >-
      Yerushalmy, J. (1947). Statistical Problems in Assessing Methods of Medical Diagnosis, with
      Special Reference to X-Ray Techniques. Public Health Reports 62(40).
