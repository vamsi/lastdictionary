# yaml-language-server: $schema=../schema/entry.schema.json

term: higher-order theories of consciousness
id: higher-order-theories-of-consciousness
pos: n.
also:
  - higher-order theory
  - HOT
  - higher-order thought theory
  - higher-order perception theory
  - perceptual reality monitoring
domain: mind
level: specialist
plain: >-
  Theories holding that a mental state is conscious when the mind, in effect, notices it — when some
  further thought or perception represents you as being in that state.
senses:
  - definition: >-
      A family of theories on which a mental state is conscious when it is suitably represented by
      another mental state, so that the subject is in some way aware of being in it; states not so
      represented, such as subliminal perceptions, remain unconscious. Higher-order thought
      theories, notably David Rosenthal's, require a thought to the effect that one is in the state;
      higher-order perception or 'inner sense' theories (David Armstrong, William Lycan) posit a
      quasi-perceptual monitoring faculty; and computational variants such as Hakwan Lau's
      perceptual reality monitoring identify consciousness with a metacognitive mechanism that tells
      reliable perceptual signals from noise or imagination. These theories tie consciousness to
      [[metacognition|metacognition]] and to the prefrontal cortex, and they supply several
      [[indicator-properties-of-consciousness|indicator properties of consciousness]] used to assess
      AI systems.
origin: >-
  Rooted in John Locke's 'internal sense'; given modern form by David Armstrong (1968) and by David
  Rosenthal, whose 'Two Concepts of Consciousness' (Philosophical Studies, 1986) set out the
  higher-order thought theory. Hakwan Lau, Richard Brown and Joseph LeDoux developed empirical and
  computational versions in the 2010s.
year: 1986
note: >-
  Common objections are that higher-order theories make consciousness too sophisticated for infants
  and many animals, and that a higher-order state might misrepresent a first-order state that does
  not exist.
see_also:
  - metacognition
  - introspection
  - global workspace theory
  - consciousness
  - indicator properties of consciousness
sources:
  - text: >-
      Rosenthal, D. M. (1986). Two Concepts of Consciousness. Philosophical Studies 49(3), 329–359.
  - text: >-
      Brown, R., Lau, H. & LeDoux, J. E. (2019). Understanding the Higher-Order Approach to
      Consciousness. Trends in Cognitive Sciences 23(9), 754–768.
