level: core
dates: b. 1956
plain: >-
  An American computer scientist who co-wrote the standard AI textbook, led research at Google, and
  helped show that simple methods trained on huge amounts of data often beat clever hand-built ones.
senses:
  - definition: >-
      American computer scientist known both as an author and teacher of AI and as an engineering
      leader at Google. 'Artificial Intelligence: A Modern Approach' (1995; 4th ed. 2020), which he
      wrote with [[stuart-russell|Stuart Russell]], became the standard AI textbook, and his
      'Paradigms of Artificial Intelligence Programming' (1992) taught classic AI through
      [[lisp|Lisp]]. After heading the computational sciences division at NASA's Ames Research
      Center, he joined Google in 2001, directing search quality and then research, and he is also a
      Distinguished Education Fellow at Stanford's Institute for Human-Centered AI. A proponent of
      data-driven methods, he co-wrote 'The Unreasonable Effectiveness of Data' (2009), defended
      statistical [[language-model|language models]] against Noam Chomsky's criticism (2011), and
      with Blaise Agüera y Arcas argued in 2023 that frontier [[large-language-model|language
      models]] already show [[artificial-general-intelligence|artificial general intelligence]] in
      an early form. In 2011 he and Sebastian Thrun taught an online AI course to some 160,000
      students, one of the first massive open online courses.
