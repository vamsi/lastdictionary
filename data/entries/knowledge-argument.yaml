term: knowledge argument
id: knowledge-argument
pos: n.
also:
  - Mary's room
  - Mary the color scientist
  - Mary the super-scientist
domain: mind
labels:
  - contested
level: specialist
plain: >-
  A thought experiment about Mary, a scientist who knows every physical fact about color but has
  lived all her life in a black-and-white room. When she first sees red, does she learn something
  new?
senses:
  - definition: >-
      An argument against physicalism built on a thought experiment: Mary, a brilliant
      neuroscientist confined to a black-and-white room, learns every physical fact about color
      vision; on first seeing a ripe tomato she seems to learn something new, namely what seeing red
      is like. If so, complete physical knowledge leaves something out, and there are nonphysical
      facts about experience such as [[qualia|qualia]]. Replies include the ability hypothesis (Mary
      gains know-how, such as abilities to imagine and recognize red, not new facts), the
      acquaintance hypothesis, and the phenomenal-concept strategy (she learns an old fact under a
      new concept). AI writers invoke Mary when asking whether a system trained only on
      descriptions, such as a text-only [[large-language-model|language model]], can know what
      perceptual words mean.
origin: >-
  Presented by Frank Jackson in 'Epiphenomenal Qualia' (Philosophical Quarterly, 1982) and 'What
  Mary Didn't Know' (Journal of Philosophy, 1986); Jackson later abandoned the argument and accepted
  physicalism. C. D. Broad's 1925 example of a 'mathematical archangel' unable to deduce the smell
  of ammonia anticipated it.
year: 1982
see_also:
  - qualia
  - phenomenal consciousness
  - hard problem of consciousness
  - symbol grounding problem
  - philosophical zombie
  - octopus test
sources:
  - text: >-
      Jackson, F. (1982). Epiphenomenal Qualia. The Philosophical Quarterly 32(127), 127–136.
  - text: >-
      Jackson, F. (1986). What Mary Didn't Know. The Journal of Philosophy 83(5), 291–295.
