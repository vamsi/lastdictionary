term: AI effect
id: ai-effect
pos: n.
also:
  - Tesler's theorem
  - AI paradox
domain: hist
domains:
  - society
  - mind
level: core
plain: >-
  The habit of deciding that once a computer can do something — play chess, recognize speech,
  translate — it no longer counts as real intelligence, so the label keeps moving on to tasks
  machines cannot manage yet.
senses:
  - definition: >-
      The tendency for a capability to stop being regarded as artificial intelligence once machines
      perform it reliably and its workings are understood, with observers redefining intelligence to
      exclude it. Chess playing, optical character recognition, route planning, spam filtering,
      speech recognition and machine translation each passed from AI research into ordinary software
      in this way. The effect makes the field's achievements seem perpetually unimpressive, can skew
      historical judgments of its progress, and complicates debates over definitions of
      [[artificial-general-intelligence|artificial general intelligence]], since the goalposts move
      as systems improve. Proposed explanations include the gap between how solutions actually work
      (search, statistics) and folk ideas of thinking, and a reluctance to grant machines
      distinctively human qualities.
    example: Nobody calls the autocorrect on their phone AI anymore — a textbook AI effect.
origin: >-
  Pamela McCorduck described the pattern in Machines Who Think (1979), observing that each success
  was greeted by critics saying it was not really thinking. The same year Douglas Hofstadter's
  Gödel, Escher, Bach quoted the computer scientist Larry Tesler as saying 'AI is whatever hasn't
  been done yet', naming it Tesler's Theorem; Tesler later said he had put it as intelligence being
  whatever machines have not yet done. The label 'AI effect' was in use by the 2000s.
year: 1979
note: >-
  Related to but distinct from [[moravec-s-paradox|Moravec's paradox]], which concerns which tasks
  are hard for machines. The opposite tendency, calling ordinary software AI, is [[ai-washing|AI
  washing]].
see_also:
