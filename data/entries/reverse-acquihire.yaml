term: reverse acquihire
id: reverse-acquihire
pos: n.
also:
  - reverse acqui-hire
  - license-and-hire deal
domain: society
domains:
  - gov
labels:
  - emerging
level: specialist
plain: >-
  A deal in which a big tech company hires a start-up's founders and top staff and pays to license
  its technology, without buying the company itself.
senses:
  - definition: >-
      A transaction in which a large company hires the founders and key staff of a start-up and pays
      a large, usually non-exclusive licensing fee for its technology without acquiring the company,
      which continues with its remaining employees while investors are repaid from the fee. The
      structure gives acquirers scarce AI talent quickly while avoiding the merger review and
      antitrust scrutiny a full acquisition would attract. Examples include Microsoft's deal with
      Inflection AI (March 2024, about US$650 million), Amazon's with Adept (June 2024) and
      Covariant (August 2024), Google's with Character.AI (August 2024, about US$2.7 billion) and
      Windsurf (July 2025, US$2.4 billion), and Meta's purchase of 49% of Scale AI for about
      US$14–15 billion while hiring its chief executive (June 2025). Critics say such deals hollow
      out start-ups and leave remaining staff stranded.
    example: >-
      It wasn't an acquisition, it was a reverse acquihire: Google got the founders, and the rest of
      us got the empty office.
origin: >-
  An inversion of 'acqui-hire' (2005), buying a company mainly for its staff. Used in technology and
  venture-capital commentary from 2024 and widespread by mid-2025, after Google's Windsurf deal.
year: 2024
note: >-
  Competition authorities have scrutinized the structure; the UK Competition and Markets Authority
  treated Microsoft's Inflection deal as a merger but cleared it in September 2024. Earliest use of
  the phrase not established.
see_also:
  - concentration of power
  - Scale AI
  - Meta Superintelligence Labs
  - moat
  - frontier lab
  - AI bubble
sources:
