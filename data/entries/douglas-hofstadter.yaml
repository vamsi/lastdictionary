plain: >-
  An American cognitive scientist whose prize-winning book 'Gödel, Escher, Bach' inspired a
  generation to study minds and AI, and who studies analogy as the heart of thinking.
senses:
  - definition: >-
      American cognitive scientist at Indiana University whose 'Gödel, Escher, Bach: An Eternal
      Golden Braid' (1979) explored how self-reference and 'strange loops' in formal systems might
      give rise to minds; the book won a Pulitzer Prize and drew a generation of readers to AI. His
      Fluid Analogies Research Group built programs such as Copycat (with Melanie Mitchell) that
      model perception and analogy-making as the core of cognition, described in 'Fluid Concepts and
      Creative Analogies' (1995), which popularized the label [[eliza-effect|ELIZA effect]]. Long
      skeptical of AI that produced fluent output without understanding, as in his 2018 critique of
      machine translation, he said in 2023 that progress in [[large-language-model|large language
      models]] had overturned his expectations and alarmed him. He supervised the doctorates of
      [[david-chalmers|David Chalmers]] and Melanie Mitchell, and coined Hofstadter's law: a task
      always takes longer than you expect, even when you allow for Hofstadter's law.
