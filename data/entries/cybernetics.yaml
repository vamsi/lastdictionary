term: cybernetics
id: cybernetics
pos: n.
also:
  - cybernetic
  - cyberneticist
domain: hist
domains:
  - core
  - robot
labels:
  - historical
level: core
plain: >-
  The study of how animals, machines and organizations steer themselves using feedback: sensing the
  result of an action and correcting course. It was both a parent and an early rival of AI.
senses:
  - definition: >-
      An interdisciplinary science that analyzes organisms and machines in common terms — feedback,
      information, regulation and self-organization — as systems that steer themselves toward goals.
      Its central claim was that purposeful behavior can be explained by negative feedback: a system
      measures the gap between its present state and its goal and acts to narrow it, as thermostats,
      anti-aircraft fire predictors and the body's homeostasis do. It brought together
      mathematicians, engineers, neurophysiologists, psychologists and anthropologists, notably at
      the Macy Conferences (1946–1953), and produced early adaptive machines such as W. Grey
      Walter's robot tortoises and W. Ross Ashby's homeostat. After the
      [[dartmouth-workshop|Dartmouth workshop]] of 1956, [[symbolic-ai|symbolic AI]] largely
      displaced cybernetics in American computer science, but its ideas persist in control theory,
      [[reinforcement-learning|reinforcement learning]], [[robotics|robotics]] and systems thinking.
    example: >-
      Before 'artificial intelligence' was coined, machines that adapted to their surroundings were
      studied under the banner of cybernetics.
origin: >-
  [[norbert-wiener|Norbert Wiener]] named the field in Cybernetics: Or Control and Communication in
  the Animal and the Machine (1948), from the Greek kybernētēs, 'steersman'. André-Marie Ampère had
  used cybernétique in 1834 for the art of government. The prefix cyber-, as in cyberspace and
  cybersecurity, descends from the word.
year: 1948
note: >-
  John McCarthy said he chose the name 'artificial intelligence' partly to avoid being drawn into
  cybernetics and Wiener's orbit.
