plain: >-
  An American computer scientist who co-created the A* search algorithm and the STRIPS planner for
  Shakey, the first robot to plan its own moves by reasoning, and wrote standard AI textbooks.
senses:
  - definition: >-
      American computer scientist at SRI International (then the Stanford Research Institute) and
      later Stanford University, a pioneer of search and robot planning. His 'Learning Machines'
      (1965) was an early text on trainable pattern classifiers. At SRI he co-led
      [[shakey-the-robot|Shakey the robot]] (1966–1972), the first mobile robot that planned its own
      moves by logical reasoning, for which he, Peter Hart and Bertram Raphael devised [[a-search|A*
      search]] (1968) and he and Richard Fikes created the [[strips|STRIPS]] planner (1971), whose
      description of actions by preconditions and effects remains the basis of
      [[automated-planning|automated planning]]. His textbooks 'Principles of Artificial
      Intelligence' (1980) and 'Artificial Intelligence: A New Synthesis' (1998) trained generations
      of students, and 'The Quest for Artificial Intelligence' (2009) is a standard history of the
      field. He chaired Stanford's computer science department (1985–1990) and was president of the
      American Association for Artificial Intelligence (1982–83).
