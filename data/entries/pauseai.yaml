term: PauseAI
id: pauseai
pos: prop. n.
also:
  - Pause AI
  - PauseAI US
  - PauseAI Global
domain: orgs
domains:
  - safety
  - gov
level: specialist
plain: >-
  A volunteer protest movement, begun in 2023, that pickets AI companies and lobbies governments for
  a worldwide treaty halting work on AI more advanced than today's best until it is proven safe.
senses:
  - definition: >-
      An international grassroots movement demanding a verifiable global treaty that would halt the
      training of AI systems beyond the current frontier until their safety can be demonstrated and
      the public has a democratic say over them. It organizes protests outside AI companies and
      government buildings, often coordinated across cities around events such as the international
      [[ai-safety-summit|AI safety summits]]; lobbies for an international treaty; and runs
      volunteer chapters in many countries, with a separately incorporated PauseAI US. It is the
      most visible street-level expression of the [[ai-pause|AI pause]] position and of public
      concern about [[existential-risk|existential risk]]; critics argue that a pause would be
      unenforceable or would hand the lead to less careful developers.
origin: >-
  Founded in May 2023 in the Netherlands by software entrepreneur Joep Meindertsma, two months after
  the Future of Life Institute's [[pause-giant-ai-experiments|Pause Giant AI Experiments]] letter;
  it held its first protests that year.
year: 2023
