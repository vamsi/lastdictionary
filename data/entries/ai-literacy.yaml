# yaml-language-server: $schema=../schema/entry.schema.json

term: AI literacy
id: ai-literacy
pos: n.
also:
  - artificial intelligence literacy
domain: society
domains:
  - gov
labels:
  - legal
level: core
plain: >-
  Knowing enough about AI to use it sensibly and judge it critically: what it can and cannot do, how
  it goes wrong, and how it affects people.
senses:
  - definition: >-
      The practical understanding that lets non-specialists use AI systems well, judge their outputs
      critically and decide when to rely on them, as distinct from the expertise needed to build
      them. Frameworks typically include knowing what AI is and how [[machine-learning|machine
      learning]] learns from data; recognizing AI in everyday products; understanding typical
      strengths and failures such as [[hallucination|hallucination]] and [[algorithmic-bias|bias]];
      using AI tools effectively and checking their output; and weighing ethical, privacy and social
      implications. In the [[eu-ai-act|EU AI Act]], AI literacy is a defined term. From 2 February
      2025, Article 4 required providers and deployers to take measures to ensure, to their best
      extent, a sufficient level of AI literacy among staff and others operating or using AI systems
      on their behalf; since an amendment took effect on 27 July 2026, they must instead take
      measures to support its development, taking account of those people's knowledge, experience,
      training and context of use, without having to guarantee any individual's level.
    example: >-
      Before the rollout, every caseworker took an AI literacy course on when to double-check the
      tool's summaries.
origin: >-
  Used occasionally in the 2010s by analogy with digital and media literacy; Duri Long and Brian
  Magerko's 'What is AI Literacy? Competencies and Design Considerations' (CHI 2020) gave a widely
  cited definition with 17 competencies. The term entered law through the EU AI Act (2024).
note: >-
  The Commission's November 2025 [[digital-omnibus|Digital Omnibus]] proposal would have removed the
  direct duty on providers and deployers, leaving the Commission and member states to encourage AI
  literacy. After the European Parliament objected, the amending Regulation (EU) 2026/1744 of 8 July
  2026 kept a reworded duty on providers and deployers and added support duties for the Commission
  and member states.
see_also:
  - digital divide
  - overreliance
  - AI transparency
  - EU AI Act
  - automation bias
sources:
  - text: >-
      Long, D. & Magerko, B. (2020). What is AI Literacy? Competencies and Design Considerations.
      Proc. CHI 2020.
  - text: >-
      Regulation (EU) 2026/1744 of the European Parliament and of the Council of 8 July 2026
      amending Regulation (EU) 2024/1689 (Digital Omnibus on AI). OJ L, 24 July 2026.
standards: >-
  EU AI Act (Reg. (EU) 2024/1689), Art. 3(56) (definition) and Art. 4, as amended by Reg. (EU)
  2026/1744
as_of: 2026-10
