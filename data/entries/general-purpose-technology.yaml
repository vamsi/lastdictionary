# yaml-language-server: $schema=../schema/entry.schema.json

term: general-purpose technology
id: general-purpose-technology
pos: n.
also:
  - GPT (economics)
domain: society
domains:
  - hist
level: core
plain: >-
  A technology, like electricity or the computer, that spreads through the whole economy, keeps
  improving and sparks many other inventions. Many economists think AI is one.
senses:
  - definition: >-
      In economics, a technology whose effects spread economy-wide because of three traits, as
      Timothy Bresnahan and Manuel Trajtenberg characterized them: many sectors use it as an input,
      it keeps improving, and it spawns complementary innovations among its adopters. Steam power,
      the electric dynamo, the internal combustion engine and the computer are the usual historical
      cases. Because adopters must reorganize processes, retrain workers and invent complementary
      products before gains arrive, general-purpose technologies typically raise measured
      productivity only after long lags, which can produce a [[productivity-paradox|productivity
      paradox]]. Many economists classify AI, and [[large-language-model|large language models]] in
      particular, as a general-purpose technology, implying broad but slow-arriving effects on
      growth, work and the distribution of income.
    example: >-
      If AI is a general-purpose technology, the big productivity gains will come only after firms
      redesign their workflows around it.
origin: >-
  Formalized by Timothy Bresnahan and Manuel Trajtenberg in 'General Purpose Technologies: Engines
  of Growth?' (NBER working paper 1992; Journal of Econometrics, 1995), drawing on Paul David's
  study of the slow productivity payoff of electrification (1990). Tyna Eloundou and colleagues'
  'GPTs are GPTs' (2023) applied the idea to language models.
year: 1992
note: >-
  Not to be confused with GPT, the Generative Pre-trained Transformer family of language models, or
  with a [[general-purpose-ai-model|general-purpose AI model]], a regulatory category in the EU AI
  Act.
see_also:
  - productivity paradox
  - task exposure
  - technological unemployment
  - AI as normal technology
  - explosive growth
  - Jevons paradox
contrast:
  - general-purpose AI model
sources:
  - text: >-
      Bresnahan, T. F. & Trajtenberg, M. (1995). General purpose technologies: Engines of growth?
      Journal of Econometrics 65(1), 83–108.
  - text: >-
      David, P. A. (1990). The Dynamo and the Computer: An Historical Perspective on the Modern
      Productivity Paradox. American Economic Review 80(2), 355–361.
