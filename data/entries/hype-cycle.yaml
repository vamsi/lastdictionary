term: hype cycle
id: hype-cycle
pos: n.
also:
  - Gartner hype cycle
  - peak of inflated expectations
  - trough of disillusionment
  - Amara's law
domain: society
domains:
  - culture
labels:
  - trademark
level: core
plain: >-
  A pattern in which excitement about a new technology rises to a peak, crashes into disappointment,
  then slowly recovers as the technology finds real uses.
senses:
  - definition: >-
      A curve describing how expectations for a new technology typically evolve, together with the
      research firm Gartner's method for placing technologies on it. After an Innovation Trigger,
      expectations climb to a Peak of Inflated Expectations, fall into a Trough of Disillusionment,
      then recover along a Slope of Enlightenment to a Plateau of Productivity. Gartner publishes
      annual hype cycles for emerging technologies and for AI, which are widely cited as shorthand
      for a technology's maturity: its 2025 hype cycle for AI showed generative AI entering the
      Trough of Disillusionment and AI agents at the Peak of Inflated Expectations. Critics note
      that many technologies do not follow the curve, that positions are analysts' judgments rather
      than measurements, and that the model's predictive record is weak. Loosely, the phrase names
      any boom-and-bust pattern of expectations, including those behind the [[ai-winter|AI
      winters]].
    example: >-
      Our board keeps asking where agents sit on the hype cycle, as if the curve could tell us what
      to build.
origin: >-
  Introduced by Gartner analyst Jackie Fenn in 1995 and elaborated in Fenn and Mark Raskino's
  Mastering the Hype Cycle (2008). A related adage, Amara's law, attributed to futurist Roy Amara,
  holds that people overestimate a technology's short-run effects and underestimate its long-run
  ones.
year: 1995
note: >-
  'Hype Cycle' is a Gartner trademark; capitalized, it refers to Gartner's published charts.
see_also:
  - AI hype
  - AI bubble
  - AI winter
  - AI washing
  - productivity paradox
sources:
  - text: >-
      Fenn, J. & Raskino, M. (2008). Mastering the Hype Cycle: How to Choose the Right Innovation at
      the Right Time. Harvard Business Press.
