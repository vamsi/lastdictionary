term: Frank Rosenblatt
id: frank-rosenblatt
sort_as: Rosenblatt Frank
pos: prop. n.
domain: people
domains:
  - hist
  - dl
level: core
dates: 1928–1971
plain: >-
  An American psychologist who invented the perceptron, the first neural network that learned from
  examples, and built a machine that learned to recognize simple images.
senses:
  - definition: >-
      American psychologist and neural-network pioneer at the Cornell Aeronautical Laboratory and
      Cornell University. In 1957–58 he introduced the [[perceptron|perceptron]], a network of
      threshold units whose connection weights are adjusted by an error-correction rule; he and
      others proved that the rule converges whenever the classes are [[linear-separability|linearly
      separable]]. A US Navy demonstration in July 1958, simulated on an IBM 704, drew extravagant
      press claims about thinking machines; the custom-built [[mark-i-perceptron|Mark I
      Perceptron]], which learned to classify images from a camera-like array of photocells,
      followed around 1960. His book 'Principles of Neurodynamics' (1962) analyzed many network
      designs, including multilayer ones and a scheme he called back-propagating error correction.
      The 1969 critique '[[perceptrons-book|Perceptrons]]' by [[marvin-minsky|Marvin Minsky]] and
      Seymour Papert contributed to a decline in such research, which
      [[connectionism|connectionism]] revived in the 1980s. He died in a boating accident in 1971.
