term: Global Dialogue on AI Governance
id: global-dialogue-on-ai-governance
pos: prop. n.
also:
  - UN Global Dialogue on AI Governance
domain: gov
domains:
  - society
labels:
  - emerging
level: specialist
plain: >-
  A yearly United Nations meeting, launched in 2025, where all countries — joined by companies,
  researchers and civil society — discuss how to cooperate on governing AI.
senses:
  - definition: >-
      A standing United Nations forum, open to all member states with participation by other
      stakeholders, for discussing international cooperation on AI governance: sharing experiences
      and good practice, promoting interoperability between national approaches, and considering
      issues such as safety, human rights, capacity-building and the digital divide. It meets
      annually and receives the annual report of the
      [[independent-international-scientific-panel-on-ai|Independent International Scientific Panel
      on AI]]. It was formally launched at a high-level meeting in New York on 25 September 2025;
      its first annual session took place in Geneva on 6–7 July 2026, and the second is planned for
      New York in 2027.
    example: >-
      The ministry's AI envoy will present our national strategy at the Global Dialogue on AI
      Governance.
origin: >-
  Proposed by the UN Secretary-General's High-level Advisory Body on AI (2024) and committed to in
  the Global Digital Compact, adopted at the Summit of the Future in September 2024; established,
  alongside the scientific panel, by General Assembly resolution 79/325 of 26 August 2025.
year: 2025
note: >-
  Not a negotiating body: it drafts no treaty or binding rules. It complements narrower venues such
  as the [[ai-safety-summit|AI Safety Summit]] series, the [[g7-hiroshima-ai-process|G7 Hiroshima AI
  Process]] and the OECD's [[global-partnership-on-artificial-intelligence|Global Partnership on
  Artificial Intelligence]].
