term: Independent International Scientific Panel on AI
id: independent-international-scientific-panel-on-ai
pos: prop. n.
also:
  - UN Scientific Panel on AI
  - UN AI scientific panel
  - Independent International Scientific Panel on Artificial Intelligence
domain: gov
domains:
  - safety
  - society
level: core
plain: >-
  A group of 40 independent experts set up by the United Nations in 2025 to give every country a
  shared, science-based picture of what AI can do, its risks and its benefits.
senses:
  - definition: >-
      A body of 40 experts, appointed as individuals rather than as national delegates, that the
      United Nations General Assembly created to give every member state a common, evidence-based
      account of what AI offers, what it threatens and how it is changing societies, outside the
      military sphere. It produces an annual report presented to the
      [[global-dialogue-on-ai-governance|Global Dialogue on AI Governance]], may issue thematic
      briefs and can update the General Assembly up to twice a year; it is explicitly not a
      regulatory or enforcement body. Members, drawn from all regions, were chosen from more than
      2,600 applicants and appointed by the General Assembly in February 2026; at its inaugural
      meeting on 3 March 2026 the panel elected [[yoshua-bengio|Yoshua Bengio]] and the Filipino
      journalist Maria Ressa as co-chairs. Its preliminary report appeared on 1 July 2026, and its
      first thematic brief, on AI agents, misalignment and the risk of losing human control, in
      September 2026.
    example: >-
      The UN scientific panel's preliminary report framed the debate at the first Global Dialogue in
      Geneva.
origin: >-
  Recommended by the UN Secretary-General's High-level Advisory Body on AI in its 2024 report
  Governing AI for Humanity and endorsed in the Global Digital Compact (September 2024); established
  together with the Global Dialogue by General Assembly resolution 79/325, adopted by consensus on
  26 August 2025. Often likened to the Intergovernmental Panel on Climate Change.
year: 2025
note: >-
  Distinct from the [[international-ai-safety-report|International AI Safety Report]], a summit-born
  process focused on risks from general-purpose AI. The UN Office for Digital and Emerging
  Technologies provides secretariat support.
