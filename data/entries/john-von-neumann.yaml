dates: 1903–1957
plain: >-
  A Hungarian-American mathematician who shaped the design of modern computers, co-founded game
  theory, and is the first person known to have spoken of a coming technological 'singularity'.
senses:
  - definition: >-
      Hungarian-born American mathematician, from 1933 a professor at the Institute for Advanced
      Study in Princeton, whose work spans quantum mechanics, game theory and computing. He proved
      the [[minimax|minimax]] theorem for two-player zero-sum games (1928) and, with Oskar
      Morgenstern, wrote 'Theory of Games and Economic Behavior' (1944). His 'First Draft of a
      Report on the EDVAC' (1945) described the stored-program design now called the von Neumann
      architecture, and at Los Alamos he developed the [[monte-carlo-method|Monte Carlo method]]
      with Stanislaw Ulam. Later work on self-reproducing cellular automata anticipated
      [[artificial-life|artificial life]], and his unfinished lectures 'The Computer and the Brain'
      (published 1958) compared digital and neural computation. Ulam recalled a conversation in
      which von Neumann spoke of accelerating technological progress approaching an essential
      'singularity' in human history, the earliest known use of the idea behind the
      [[technological-singularity|technological singularity]].
