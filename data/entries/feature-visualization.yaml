contrast:
  - saliency map
sources:
  - text: >-
      Erhan, D., Bengio, Y., Courville, A. & Vincent, P. (2009). Visualizing Higher-Layer Features
      of a Deep Network. Technical Report 1341, Université de Montréal.
  - text: Olah, C., Mordvintsev, A. & Schubert, L. (2017). Feature Visualization. Distill.
