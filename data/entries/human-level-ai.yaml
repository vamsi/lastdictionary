# yaml-language-server: $schema=../schema/entry.schema.json

term: human-level AI
id: human-level-ai
pos: n.
also:
  - HLAI
  - human-level artificial intelligence
  - human-level machine intelligence
domain: asi
domains:
  - core
  - hist
level: core
plain: >-
  AI that can match an ordinary adult across the whole range of thinking tasks, such as talking,
  learning, reasoning and planning. An older, more intuitive name for the goal now usually called
  general AI.
senses:
  - definition: >-
      An AI system whose overall cognitive abilities match those of a typical adult human across the
      range of intellectual tasks, rather than within one specialty. The phrase states the founding
      ambition of the field and was the usual name for its long-term goal before
      [[artificial-general-intelligence|artificial general intelligence]] became common; the two are
      now largely interchangeable. Nils Nilsson proposed judging it by employment: a human-level
      system should be able to do most of the jobs people are paid to do. Some researchers, notably
      [[yann-lecun|Yann LeCun]], prefer it to AGI on the grounds that human intelligence is itself
      specialized rather than general. A conceptual difficulty is that machine abilities do not rise
      evenly: a system that matched humans at its weakest skill would already far exceed them at
      many others, so human level marks a broad band rather than a point.
    example: >-
      Matching people at chess was never the goal; human-level AI means matching them at everything
      at once.
origin: >-
  The goal is as old as the 1955 [[dartmouth-workshop|Dartmouth proposal]]. The phrase was
  established in AI writing by the 1990s: John McCarthy's 1996 lecture 'From Here to Human-Level AI'
  (published 2007) treated it as the field's central aim, and Nils Nilsson's 2005 article
  'Human-Level Artificial Intelligence? Be Serious!' proposed the employment test.
see_also:
  - artificial general intelligence
  - high-level machine intelligence
