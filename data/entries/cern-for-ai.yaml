labels:
  - contested
level: specialist
plain: >-
  A proposed publicly funded, international AI laboratory modeled on CERN, the European
  particle-physics center, where countries would pool money, computers and scientists to do AI
  research together.
senses:
  - definition: >-
      A proposed intergovernmental, publicly funded institution for AI research and development,
      modeled on CERN, the European Organization for Nuclear Research, in which member states pool
      funding, computing infrastructure and researchers. Versions differ in purpose.
      Research-infrastructure proposals, common in Europe, seek to give universities and smaller
      states access to frontier-scale [[compute|compute]] and talent, reduce dependence on a few
      private and foreign companies, and pursue open science and [[open-weight-model|open models]].
      Safety-oriented proposals envision an international laboratory that would develop the most
      capable systems, or study their risks, under shared governance and strict security, sometimes
      combined with limits on private frontier development, as in the 2023 proposal for a
      Multinational AGI Consortium (MAGIC). Critics note that the analogy is imperfect: particle
      physics has little commercial or military value, whereas frontier AI is led by well-funded
      companies and is [[dual-use|dual-use]], raising hard questions about membership, control of
      model weights and concentration of power.
    example: >-
      The ministers endorsed a CERN for AI but could not agree whether it should build frontier
      models or only provide compute.
origin: >-
  Calls for a 'CERN for AI' appeared by 2017, when Gary Marcus urged an international AI mission
  modeled on CERN in a New York Times op-ed, and in 2018, when the European research network CLAIRE
  adopted the idea as its founding vision. Interest revived after 2023 with safety-focused proposals
  and European policy reports; in October 2025 the European Commission's strategy for AI in science
  announced RAISE (Resource for AI Science in Europe), a virtual institute pooling resources for
  AI-driven research.
year: 2017
note: >-
  Different from a 'Manhattan Project for AI', which usually denotes a national, security-driven
  crash program, and from public computing programs such as the EU's [[ai-factory|AI Factories]],
  which provide infrastructure without a joint research mandate.
