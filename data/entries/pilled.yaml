term: -pilled
id: pilled
pos: adj.
also:
  - AGI-pilled
  - scale-pilled
  - scaling-pilled
  - doom-pilled
  - redpilled
domain: culture
domains:
  - asi
labels:
  - slang
level: specialist
plain: >-
  A slang word ending meaning someone has been won over to a belief, often suddenly and completely;
  'AGI-pilled' means convinced that human-level AI is coming soon.
senses:
  - definition: >-
      A combining form meaning converted to, or newly convinced of, a view, usually implying a
      sudden revelation after which the person sees everything differently. In AI culture the
      commonest forms are 'scale-pilled' (convinced that scaling compute, data and parameters will
      keep producing capability gains; see [[scaling-hypothesis|scaling hypothesis]]), 'AGI-pilled'
      (convinced that [[artificial-general-intelligence|artificial general intelligence]] is near),
      'doom-pilled' (convinced that catastrophe is likely; see [[doomer|doomer]]) and labels for
      newer enthusiasms such as 'RL-pilled' or 'agent-pilled'. It serves both for self-description
      and for gentle mockery, and 'pill' alone can stand for the conviction itself ('the scaling
      pill').
    example: >-
      She was skeptical in 2022, but two years of results left her completely scale-pilled.
origin: >-
  From the red pill in the film The Matrix (1999), which reveals reality to whoever takes it.
  'Redpilled' was adopted by online men's-rights and far-right communities in the late 2000s and
  2010s; the suffix then generalized across internet culture to any conversion. 'Scale-pilled' was
  common among AI researchers by the early 2020s, after the success of GPT-3 (2020).
note: >-
  Because of its history, 'redpilled' retains political connotations; most AI uses of the suffix are
  neutral, though some readers still hear the echo.
see_also:
