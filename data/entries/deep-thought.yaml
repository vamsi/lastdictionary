term: Deep Thought
id: deep-thought
pos: prop. n.
also:
  - "42"
domain: culture
domains:
  - hist
level: specialist
plain: >-
  The giant computer in The Hitchhiker's Guide to the Galaxy that thinks for 7.5 million years and
  answers the meaning of life with '42'; also an early chess computer named after it.
senses:
  - context: Fiction
    definition: >-
      The supercomputer in Douglas Adams's The Hitchhiker's Guide to the Galaxy, built to compute
      the Answer to the Ultimate Question of Life, the Universe, and Everything; after seven and a
      half million years it replies '42', explaining that its builders never really knew what the
      question was. The scene is a staple joke in computing and AI about ill-posed objectives — an
      optimizer can answer exactly what was asked and still be useless, a theme formalized as
      [[specification-gaming|specification gaming]] — and about the gap between computation and
      meaning; '42' recurs as an Easter egg in software and research.
  - context: Computer chess
    definition: >-
      A chess computer developed at Carnegie Mellon University by Feng-hsiung Hsu, Murray Campbell
      and colleagues, named after the fictional machine. In 1988 it became the first machine to
      defeat a grandmaster in ordinary tournament play, and in 1989 it lost an exhibition match to
      world champion Garry Kasparov; its team moved to IBM, where the project became
      [[deep-blue|Deep Blue]].
origin: >-
  Douglas Adams introduced Deep Thought in the BBC radio series The Hitchhiker's Guide to the Galaxy
  (1978) and the novel that followed (1979). The Carnegie Mellon chess machine, successor to the
  ChipTest program begun in 1985, borrowed the name in 1988.
year: 1978
