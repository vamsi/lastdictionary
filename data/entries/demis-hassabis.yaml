dates: b. 1976
plain: >-
  A British AI researcher and former chess prodigy who co-founded DeepMind, led the teams behind
  AlphaGo and AlphaFold, and shared the 2024 Nobel Prize in Chemistry.
senses:
  - definition: >-
      British computer scientist and neuroscientist, co-founder of [[deepmind|DeepMind]], who in
      August 2026 was named chair of [[google-deepmind|Google DeepMind]] and chief scientist of its
      parent, Alphabet. A chess prodigy, he co-designed the video game Theme Park (1994) as a
      teenager, studied computer science at Cambridge, founded the games studio Elixir, and earned a
      PhD in cognitive neuroscience at University College London (2009) on memory and imagination.
      In 2010 he co-founded DeepMind with [[shane-legg|Shane Legg]] and [[mustafa-suleyman|Mustafa
      Suleyman]] to pursue [[artificial-general-intelligence|artificial general intelligence]];
      Google acquired it in 2014, and he led it, and from 2023 the merged Google DeepMind, as chief
      executive until 2026, when [[koray-kavukcuoglu|Koray Kavukcuoglu]] took over the running of
      the lab. Its [[deep-q-network|deep Q-network]], [[alphago|AlphaGo]], [[alphazero|AlphaZero]],
      [[alphafold|AlphaFold]] and [[gemini|Gemini]] made it a leading AI laboratory. He and
      [[john-jumper|John Jumper]] shared half of the 2024 Nobel Prize in Chemistry for protein
      structure prediction, the other half going to David Baker; he also founded the drug-discovery
      company Isomorphic Labs (2021) and was knighted in 2024.
