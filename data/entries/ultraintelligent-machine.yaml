term: ultraintelligent machine
id: ultraintelligent-machine
pos: n.
also:
  - ultra-intelligent machine
  - ultraintelligence
domain: asi
domains:
  - hist
labels:
  - historical
level: specialist
plain: >-
  I. J. Good's 1965 name for a machine smarter than any person at every kind of thinking, which
  could therefore build machines smarter than itself.
senses:
  - definition: >-
      A machine whose intellect outstrips the ablest person's at every kind of mental work: I. J.
      Good's 1965 term for what is now called [[superintelligence|superintelligence]]. Because
      designing machines is one such kind of work, Good reasoned, it could build a better successor,
      which could build a better one still, an [[intelligence-explosion|intelligence explosion]]
      that would put human intellect hopelessly out of reach. Hence his conclusion that the first
      such machine would be 'the last invention that man need ever make', with the caveat that this
      held only if it were tractable enough to explain how it could be kept under control, an early
      statement of what later became the [[control-problem|control problem]]. The term is now used
      mainly in discussing the history of these ideas.
    example: >-
      Good's ultraintelligent machine is the ancestor of every modern intelligence-explosion
      argument.
origin: >-
  Coined by the British statistician I. J. Good, who had worked with Alan Turing as a codebreaker at
  Bletchley Park, in 'Speculations Concerning the First Ultraintelligent Machine', published in
  Advances in Computers in 1965 and based on talks given in 1962–1963. It became canonical after
  Vernor Vinge and later AI-risk writers cited it.
year: 1965
see_also:
