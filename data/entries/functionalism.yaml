# yaml-language-server: $schema=../schema/entry.schema.json

term: functionalism
id: functionalism
pos: n.
also:
  - functionalist
  - machine functionalism
  - computational functionalism
domain: mind
domains:
  - core
level: core
plain: >-
  The view that minds are defined by how they work, not what they are made of: pain, for example, is
  whatever inner state plays pain's part, linking injury, other thoughts and behavior.
senses:
  - definition: >-
      The theory in philosophy of mind that mental states are individuated by their causal roles —
      the conditions that typically produce them, the effects they typically have and their
      interactions with other mental states — and not by the stuff that realizes them. To be in
      pain, on this view, is to be in a state with pain's profile of causes and effects, one brought
      on by bodily damage, issuing in distress and avoidance and meshing appropriately with beliefs
      and desires, whether that state occurs in a human brain, an octopus or a machine.
      Functionalism motivates [[multiple-realizability|multiple realizability]] and underlies the
      [[computational-theory-of-mind|computational theory of mind]]. Computational functionalism,
      the version holding that implementing the right computations suffices for consciousness, is
      the working hypothesis of influential assessments of [[machine-consciousness|machine
      consciousness]], such as the 2023 report on [[indicator-properties-of-consciousness|indicator
      properties of consciousness]]. Critics argue that function leaves something out, citing
      [[qualia|qualia]] and absent-qualia cases, the [[chinese-room|Chinese room]] and
      [[blockhead|Blockhead]].
    example: >-
      If computational functionalism is true, the question is not what the model is made of but
      which computations it performs.
origin: >-
  Hilary Putnam proposed machine-state functionalism in 'Minds and Machines' (1960) and
  'Psychological Predicates' (1967), comparing mental states to the states of a Turing machine.
  Jerry Fodor, David Armstrong and David Lewis developed other versions in the 1960s and 1970s, and
  functionalism became the dominant view in philosophy of mind and [[cognitive-science|cognitive
  science]].
year: 1967
note: >-
  Not to be confused with functionalism in sociology, linguistics or architecture. Functionalism is
  usually paired with physicalism but does not strictly entail it, since a functional role could in
  principle be filled by something nonphysical.
see_also:
  - multiple realizability
  - computational theory of mind
  - substrate independence
  - mind–body problem
  - machine consciousness
  - Chinese room
contrast:
  - biological naturalism
sources:
  - text: >-
      Putnam, H. (1967). Psychological Predicates. In W. H. Capitan & D. D. Merrill (eds.), Art,
      Mind, and Religion. University of Pittsburgh Press. Reprinted as 'The Nature of Mental
      States'.
