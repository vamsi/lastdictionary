level: core
plain: >-
  An effort begun by the G7 group of wealthy democracies in Japan in 2023 that sets voluntary rules
  for companies building the most advanced AI, which now report publicly on how they follow them.
senses:
  - definition: >-
      An initiative of the Group of Seven (G7) on governing advanced AI, especially generative AI
      and [[foundation-model|foundation models]]. Its core texts, released on 30 October 2023, are
      eleven International Guiding Principles for organizations developing advanced AI systems and a
      matching International Code of Conduct. Their commitments fall under four heads: managing risk
      before and after release, through testing such as [[red-teaming|red teaming]] and watching for
      misuse once a system is deployed; openness, through public reports on capabilities and limits,
      incident sharing and published [[ai-governance|AI governance]] policies; protection, through
      security controls, content provenance tools such as [[ai-watermarking|watermarking]] and
      safeguards for personal data and intellectual property; and steering research and standards
      toward safety, societal benefit and international interoperability. With an OECD-led project
      track and guidance for all AI actors, they form the Comprehensive Policy Framework endorsed by
      G7 leaders in December 2023. Since 2025, organizations have reported on their adherence
      through a voluntary framework hosted by the OECD.
    example: >-
      The lab's Hiroshima AI Process report describes its red-teaming and incident-sharing practices.
origin: >-
  Launched at the G7 summit in Hiroshima, Japan, in May 2023 under Japan's presidency, months after
  ChatGPT's release. A Friends Group of non-G7 supporters formed in 2024, and the OECD reporting
  framework launched in February 2025, with the first organizational reports published that April.
year: 2023
note: >-
  Voluntary and principle-based; often described as a bridge between the binding [[eu-ai-act|EU AI
  Act]] and the voluntary approaches of the United States, the United Kingdom and Japan. Several of
  its commitments reappear in the [[general-purpose-ai-code-of-practice|General-Purpose AI Code of
  Practice]].
