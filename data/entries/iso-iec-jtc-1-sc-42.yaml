level: specialist
plain: >-
  The international committee that writes the main worldwide technical standards on artificial
  intelligence, run jointly by the standards bodies ISO and IEC.
senses:
  - definition: >-
      Subcommittee 42 (Artificial intelligence) of Joint Technical Committee 1 (Information
      technology) of the International Organization for Standardization (ISO) and the International
      Electrotechnical Commission (IEC), the principal international body for AI standards. Its
      members are national standards bodies, and it develops horizontal standards — applicable
      across sectors — on concepts and terminology ([[iso-iec-22989|ISO/IEC 22989]]), frameworks for
      machine-learning systems (ISO/IEC 23053), management systems ([[iso-iec-42001|ISO/IEC
      42001]]), risk management ([[iso-iec-23894|ISO/IEC 23894]]), impact assessment (ISO/IEC
      42005), bias, robustness, data quality and the AI system life cycle, working through groups on
      foundational standards, data, trustworthiness, use cases and computational approaches.
    example: >-
      Our national delegation to SC 42 is pushing for a standard on evaluating generative models.
origin: >-
  Established in 2017 by ISO/IEC JTC 1, with the American National Standards Institute (ANSI) as
  secretariat and Wael William Diab as founding chair. Its standards are increasingly referenced by
  regulators, and the European committee CEN-CENELEC JTC 21 adopts or adapts many of them.
year: 2017
note: >-
  Its standards are voluntary; in the EU they give a presumption of conformity only if adopted as
  European [[harmonised-standards|harmonised standards]] and cited in the Official Journal.
