plain: >-
  An American psychologist who, with Geoffrey Hinton and Ronald Williams, showed in 1986 how to
  train multilayer neural networks, launching the modern revival of the field.
senses:
  - definition: >-
      American cognitive psychologist at the University of California, San Diego, and from 1987
      Stanford University. With James McClelland he led the PDP Research Group, whose two-volume
      '[[parallel-distributed-processing|Parallel Distributed Processing]]' (1986) made
      [[connectionism|connectionism]] a major program in cognitive science, modeling perception,
      memory and language with networks of simple units. With [[geoffrey-hinton|Geoffrey Hinton]]
      and Ronald Williams he published 'Learning representations by back-propagating errors'
      (Nature, 1986), which showed that [[backpropagation|backpropagation]] could train the
      [[hidden-layer|hidden layers]] of [[multilayer-perceptron|multilayer networks]] to discover
      useful internal representations; though the method had earlier origins, this paper made it the
      standard way to train [[neural-network|neural networks]]. Earlier he worked on schemas and
      story understanding and, with McClelland, on the interactive activation model of word
      recognition (1981). A MacArthur Fellow (1987), he is commemorated by the Rumelhart Prize in
      cognitive science.
