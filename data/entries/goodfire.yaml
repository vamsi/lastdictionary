domain: orgs
domains:
  - interp
level: specialist
plain: >-
  A San Francisco company, founded in 2024, that builds tools to look inside AI models, understand
  what they have learned and adjust how they behave.
senses:
  - definition: >-
      A San Francisco start-up whose products and research aim to let developers see which concepts
      a neural network represents internally and change those representations directly. Its Ember
      platform (2024) offered hosted access to [[sparse-autoencoder|sparse autoencoder]] features of
      open-weight language models, letting developers inspect them and [[feature-steering|steer
      behavior by amplifying or suppressing features]]; it has also released open sparse
      autoencoders for large models and applied [[mechanistic-interpretability|mechanistic
      interpretability]] to scientific models, for example with the Arc Institute on the Evo 2
      genomic model. It is among the best-known of a small group of startups seeking to
      commercialize interpretability.
origin: >-
  Founded in 2024 in San Francisco by Eric Ho, its chief executive, Dan Balsam and Tom McGrath, who
  had helped found Google DeepMind's interpretability team. Anthropic took part in its April 2025
  funding round, reportedly Anthropic's first investment in another company.
year: 2024
