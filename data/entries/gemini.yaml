plain: >-
  Google's family of AI models and its chatbot assistant, launched in December 2023. Gemini models
  handle text, images, audio and video and power many Google products.
senses:
  - definition: >-
      [[google-deepmind|Google DeepMind]]'s line of natively multimodal [[large-language-model|large
      language models]], together with the consumer assistant that runs on them. The first
      generation, unveiled on 6 December 2023 in three sizes (Nano, Pro and Ultra), learned from
      interleaved text, images, audio and video from the start, rather than having vision added to a
      text model afterward. Gemini 1.5 (February 2024) adopted a
      [[mixture-of-experts|mixture-of-experts]] design and a context window of one million tokens,
      later two million; Gemini 2.0 (December 2024) targeted agentic use; and Gemini 2.5 (March
      2025) made built-in [[reasoning-model|reasoning]] standard. Gemini 3 Pro followed in November
      2025 and Gemini 3 Flash in December 2025. Google's chatbot Bard, launched in March 2023, was
      renamed Gemini in February 2024, and Gemini models run in Search, Android, Workspace and
      Google Cloud. Smaller [[open-weight-model|open-weight]] relatives are released under the name
      Gemma.
    example: >-
      We moved the long-document pipeline to Gemini for its million-token context window.
origin: >-
  The first model family built after Google merged its Brain team with DeepMind in April 2023. The
  name, Latin for 'twins', was explained by Google's Jeff Dean as a nod to the two merged teams and
  to NASA's Project Gemini. In late September 2026 Google was reported to be planning to release
  Gemini 4 before the end of the year.
year: 2023
note: >-
  A Gemini Deep Think model reached gold-medal standard at the 2025 International Mathematical
  Olympiad (see [[alphaproof|AlphaProof]]). In February 2024 Google paused Gemini's image generation
  of people after historically inaccurate depictions drew criticism.
