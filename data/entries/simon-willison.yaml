  - culture
  - agents
level: specialist
plain: >-
  A British programmer and blogger, co-creator of the Django web framework, whose widely read
  writing on language models coined 'prompt injection' and the 'lethal trifecta'.
senses:
  - definition: >-
      British software developer and writer whose blog has become one of the most cited running
      commentaries on [[large-language-model|large language models]]. Co-creator of the Django web
      framework (2005) and creator of the open-source data tool Datasette and the LLM command-line
      utility, he coined [[prompt-injection|prompt injection]] in September 2022, by analogy with
      SQL injection, and the [[lethal-trifecta|lethal trifecta]] (June 2025): an agent that combines
      access to private data, exposure to untrusted content and the ability to communicate
      externally can be tricked into leaking the data. He popularized [[ai-slop|AI slop]] (2024) as
      a name for unwanted AI-generated content, devised the informal [[pelican-on-a-bicycle|pelican
      on a bicycle]] benchmark (2024), and proposed [[vibe-engineering|vibe engineering]] (2025) for
      disciplined professional work with [[coding-agent|coding agents]], in contrast to
      [[vibe-coding|vibe coding]]. His habit of documenting hands-on experiments with each major
      model release made the blog a reference for practitioners and journalists.
see_also:
