term: AI for good
id: ai-for-good
pos: n.
also:
  - AI for social good
  - AI4SG
  - AI4Good
  - AI for Good Global Summit
domain: society
domains:
  - gov
level: core
plain: >-
  Using AI to tackle social and environmental problems, such as disease, poverty, disasters or
  climate change, rather than only to make a profit.
senses:
  - definition: >-
      The application of AI to social, humanitarian and environmental goals, often framed by the
      United Nations Sustainable Development Goals: for example disease screening and drug
      discovery, crop and weather forecasting, disaster mapping from satellite imagery, wildlife
      conservation, accessibility tools and the targeting of public services. The label also names
      programs by companies, foundations and UN agencies that fund such projects or donate expertise
      and computing. Critics note that many projects never progress beyond pilots, that 'good' is
      often defined by funders rather than affected communities, that the framing can serve public
      relations ([[ethics-washing|ethics washing]]), and that technical fixes can displace political
      or structural ones. Practitioners stress partnership with domain experts and affected
      communities, maintenance after launch, and rigorous evidence of impact.
    example: >-
      The AI for good grant paid for the flood-mapping model but not for anyone to maintain it after
      the pilot.
origin: >-
  'AI for social good' circulated in academic workshops from the mid-2010s. The International
  Telecommunication Union launched the AI for Good Global Summit with the XPRIZE Foundation in
  Geneva in 2017, and corporate programs followed, including Microsoft's AI for Good and Google's AI
  for Social Good (both 2018). Luciano Floridi and colleagues proposed design factors for AI4SG in
  2020.
year: 2017
