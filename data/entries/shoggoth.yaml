term: shoggoth
id: shoggoth
pos: n.
also:
  - shoggoth with a smiley face
  - shoggoth meme
domain: culture
domains:
  - llm
  - safety
labels:
  - figurative
  - slang
level: core
plain: >-
  A tentacled monster from H. P. Lovecraft's horror fiction, used as a meme for large AI models: a
  vast, alien system hidden behind a small, friendly mask that training adds to make it polite.
senses:
  - definition: >-
      A metaphor for a [[large-language-model|large language model]] as an incomprehensible entity
      whose helpful assistant persona is only a thin surface. The canonical meme shows a many-eyed
      tentacled mass labeled as the pretrained model, a smaller face labeled
      [[supervised-fine-tuning|supervised fine-tuning]], and a tiny smiley-face mask labeled
      [[reinforcement-learning-from-human-feedback|RLHF]]: the friendly chatbot is a mask that
      [[post-training|post-training]] fits over a model of internet text whose internal workings and
      dispositions remain poorly understood. The image condenses a worry central to
      [[interpretability|interpretability]] and [[ai-alignment|AI alignment]] — that well-behaved
      outputs may not reveal what the system will do in unfamiliar situations — and is widely used
      as shorthand for the strangeness of large models.
    example: One weird prompt and the smiley mask slips; you are talking to the shoggoth.
origin: >-
  Shoggoths are protoplasmic servant creatures that rebel against their makers in H. P. Lovecraft's
  novella At the Mountains of Madness (written 1931, published 1936). The earliest known drawing of
  the AI meme was posted by the Twitter user Tetraspace (@TetraspaceWest) on 30 December 2022, a
  month after ChatGPT's release, and spread through AI-safety circles; a Kevin Roose column in The
  New York Times (May 2023) introduced it to general readers.
year: 2022
note: >-
  Some take the image to imply malevolence; most users mean only that the model is alien and opaque.
  Compare the [[waluigi-effect|Waluigi effect]] and [[simulator-theory|simulator theory]], which
  treat the assistant persona as one of many characters a model can play.
see_also:
  - Waluigi effect
  - simulator theory
  - reinforcement learning from human feedback
  - post-training
  - interpretability
  - Sydney
