plain: >-
  The American company that makes ChatGPT and the GPT models. It began in 2015 as a nonprofit
  research lab and is now a for-profit company overseen by a nonprofit foundation.
senses:
  - definition: >-
      A San Francisco developer of AI models and products, founded in 2015 as a nonprofit
      laboratory, whose mission statement commits it to ensuring "that
      [[artificial-general-intelligence|artificial general intelligence]] benefits all of humanity".
      Its researchers helped establish neural [[scaling-laws|scaling laws]] and the use of
      [[reinforcement-learning-from-human-feedback|reinforcement learning from human feedback]] to
      make models follow instructions, and it is best known for the [[gpt|GPT]] series of
      [[large-language-model|language models]] — notably [[gpt-2|GPT-2]] (2019), [[gpt-3|GPT-3]]
      (2020) and [[gpt-4|GPT-4]] (2023) — and for [[chatgpt|ChatGPT]], whose release in November
      2022 set off the boom in generative AI and made OpenAI the emblematic [[frontier-lab|frontier
      lab]]. Other systems include the [[dall-e|DALL·E]] image generators, the [[whisper|Whisper]]
      speech recognizer, the o-series of [[reasoning-model|reasoning models]] beginning with
      [[openai-o1|OpenAI o1]] (2024), the [[codex|Codex]] coding agent, [[gpt-5|GPT-5]] (2025) and
      gpt-oss (2025), its first open-weight language models since GPT-2. It evaluates catastrophic
      risks under its [[preparedness-framework|Preparedness Framework]] and is a partner in the
      [[stargate|Stargate]] data-center venture. As of October 2026 Sam Altman is chief executive,
      and the company faces numerous lawsuits, including over copyright and alleged harms to ChatGPT
      users.
    example: OpenAI's model release moved the whole leaderboard overnight.
origin: >-
  Founded in December 2015 in San Francisco as a nonprofit research laboratory by Sam Altman, Elon
  Musk, Ilya Sutskever, Greg Brockman and others. In 2019 it created a 'capped-profit' subsidiary
  and took a $1 billion investment from Microsoft. Its board briefly removed Altman as chief
  executive in November 2023. On 28 October 2025 it completed a restructuring: the for-profit arm
  became OpenAI Group PBC, a public benefit corporation whose board is appointed by the nonprofit,
  renamed the OpenAI Foundation.
year: 2015
note: >-
  Despite the name, its leading models have been closed since GPT-3. Elon Musk sued over its move
  away from nonprofit control; in May 2026 a federal jury found his claims time-barred, and he said
  he would appeal.
