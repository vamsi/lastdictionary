term: multipolar scenario
id: multipolar-scenario
pos: n.
also:
  - multipolar outcome
  - multipolar world
  - multipolarity
domain: asi
domains:
  - gov
  - society
level: specialist
plain: >-
  A possible future in which many powerful AIs, companies or countries coexist and compete, with
  none able to dominate the rest.
senses:
  - definition: >-
      An outcome of the transition to advanced AI in which power remains distributed among several
      or many agents, such as states, firms and AI systems of comparable capability, rather than
      concentrated in a [[singleton|singleton]]. Multipolarity avoids a single point of failure or
      tyranny, but analysts identify distinctive dangers: competitive pressure that rewards speed
      over safety ([[ai-arms-race|AI arms race]]), erosion of human influence as AI-run institutions
      outcompete human ones ([[gradual-disempowerment|gradual disempowerment]]), wages driven toward
      the cost of running AI copies, as in Robin Hanson's economics of brain emulations, and
      conflict among powerful actors. Andrew Critch and others stress multipolar failures arising
      from interactions among many individually aligned systems, which no single developer's
      alignment work can prevent.
    example: Even if every lab solves alignment, a multipolar scenario can still go badly.
origin: >-
  Analyzed by Nick Bostrom in Superintelligence (2014), chapter 11, 'Multipolar scenarios', drawing
  on Robin Hanson's work on emulation economies; extended by Andrew Critch and David Krueger's
  ARCHES report (2020) and Critch's 2021 essay 'What Multipolar Failure Looks Like'.
year: 2014
note: >-
  Related to Scott Alexander's 'multipolar trap', also called Moloch: competition that forces every
  actor to sacrifice shared values to keep up.
see_also:
  - singleton
  - AI arms race
  - gradual disempowerment
  - decisive strategic advantage
  - whole brain emulation
  - slow takeoff
contrast:
  - singleton
