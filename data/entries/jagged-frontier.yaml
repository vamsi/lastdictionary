# yaml-language-server: $schema=../schema/entry.schema.json

term: jagged frontier
id: jagged-frontier
pos: n.
also:
  - jagged technological frontier
domain: society
domains:
  - eval
  - llm
labels:
  - figurative
level: core
plain: >-
  The uneven edge of what AI can do: it may excel at some hard tasks yet fail at seemingly easier
  ones, so how hard a task looks is a poor guide to whether AI can handle it.
senses:
  - definition: >-
      The irregular boundary between tasks that current AI systems perform well and tasks they
      perform poorly, where difficulty for humans is an unreliable guide to which side of the
      boundary a task lies on. In the field experiment that introduced the term, 758 consultants at
      Boston Consulting Group worked on realistic tasks with or without GPT-4. On tasks inside the
      frontier, AI users completed about 12% more tasks, about 25% faster, with output rated more
      than 40% higher in quality; on a task designed to fall just outside it, consultants with AI
      gave correct answers 19 percentage points less often than those working without it, because
      they accepted plausible but wrong output. The concept underlies advice to map the frontier for
      one's own work by experiment and to keep human checks where it is uncertain.
    example: >-
      The model drafts the contract flawlessly but miscounts its clauses: the jagged frontier in a
      single document.
origin: >-
  Introduced in 'Navigating the Jagged Technological Frontier' (Harvard Business School working
  paper, September 2023) by Fabrizio Dell'Acqua, Edward McFowland III, Ethan Mollick and colleagues,
  and popularized through Mollick's newsletter and his book Co-Intelligence (2024).
year: 2023
note: >-
  Overlaps with [[jagged-intelligence|jagged intelligence]], which describes the uneven capability
  profile of models themselves; the frontier version stresses the worker's practical problem of
  knowing where reliance is safe. The frontier moves as models improve, so any task's position on it
  is dated.
see_also:
  - jagged intelligence
  - centaur
  - augmentation
  - overreliance
  - Moravec's paradox
  - co-intelligence
sources:
  - text: >-
      Dell'Acqua, F., McFowland, E., Mollick, E. R., Lifshitz-Assaf, H., Kellogg, K., Rajendran, S.,
      Krayer, L., Candelon, F. & Lakhani, K. R. (2023). Navigating the Jagged Technological
      Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity
      and Quality. Harvard Business School Working Paper 24-013.
