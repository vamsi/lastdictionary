term: AI-powered
id: ai-powered
pos: adj.
also:
  - AI-driven
  - AI-enabled
  - AI-based
  - AI-enhanced
  - powered by AI
domain: core
domains:
  - society
  - culture
labels:
  - informal
level: core
plain: >-
  Described as using artificial intelligence to work. The label appears on everything from search
  engines to toothbrushes and often says little about how much AI is really involved.
senses:
  - definition: >-
      Using [[artificial-intelligence|artificial intelligence]], today usually
      [[machine-learning|machine learning]] or [[generative-ai|generative AI]], as a significant
      component of a product, service or process. The adjective is mainly a marketing label with no
      technical or legal definition: it may describe a product built around a
      [[large-language-model|large language model]], a conventional application with one
      machine-learning feature, or software that uses no learning at all. Because inflated AI claims
      can mislead consumers and investors, regulators have pursued [[ai-washing|AI washing]]: in
      2024 the US Securities and Exchange Commission settled charges against two investment advisers
      over false AI claims, and the Federal Trade Commission announced a crackdown on deceptive AI
      marketing called Operation AI Comply.
    example: >-
      The brochure calls the thermostat AI-powered, but it just follows a fixed schedule.
origin: >-
  Formed on the model of compounds such as 'battery-powered' and 'computer-powered'. It spread
  through technology marketing in the 2010s alongside 'AI-driven' and 'AI-enabled', and became
  ubiquitous after 2023 as companies relaunched products around generative AI.
note: >-
  Readers should ask what the AI component actually does and how it was evaluated. For products
  built from the ground up around AI, [[ai-native|AI-native]] is the newer label.
see_also:
