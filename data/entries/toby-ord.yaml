dates: b. 1979
plain: >-
  An Australian philosopher at Oxford who helped found effective altruism and estimated, in his book
  'The Precipice', that unaligned AI is the largest threat to humanity's future this century.
senses:
  - definition: >-
      Australian philosopher at the University of Oxford, a leading scholar of
      [[existential-risk|existential risk]] and one of the founders of
      [[effective-altruism|effective altruism]]. Giving What We Can, which he co-founded with
      William MacAskill in 2009, asks its members to promise a fixed share of their earnings to
      highly cost-effective charities, and in 2017 he and William MacAskill coined
      [[longtermism|longtermism]]. His book 'The Precipice: Existential Risk and the Future of
      Humanity' (2020) offered rough probabilities for the century ahead: about one in six for
      existential catastrophe overall, with unaligned AI the largest single source at about one in
      ten, ahead of engineered pandemics. A senior research fellow at Oxford's
      [[future-of-humanity-institute|Future of Humanity Institute]] until its closure in 2024, he
      has advised the World Health Organization, the World Bank and the office of the UN
      Secretary-General, and has since written on how the scaling of AI computation, including
      [[test-time-compute|test-time compute]] and [[swarm-scaling|swarm scaling]], bears on AI
      governance.
