term: comprehensive AI services
id: comprehensive-ai-services
pos: n.
also:
  - CAIS
  - AI services model
domain: asi
domains:
  - safety
  - agents
level: specialist
plain: >-
  The idea that superintelligent-level AI could arrive as many specialized AI tools, each doing a
  bounded job, rather than as one all-powerful AI agent with goals of its own.
senses:
  - definition: >-
      A model of advanced AI in which general, even superintelligent, capability is delivered by
      many bounded AI services, each performing a specific task with limited resources in limited
      time, rather than by unified agents pursuing open-ended goals. Its author argued that AI
      development is already organized as research and engineering pipelines producing task-focused
      systems, that automating AI research would make new services available on demand, and that
      this could deliver the benefits usually attributed to [[artificial-general-intelligence|AGI]]
      without building a goal-directed agent whose motivations must be aligned. CAIS shifted part of
      AI-safety discussion from controlling one superintelligent agent toward governing a world of
      powerful tools. Critics replied that economic and military pressures favor integrating
      services into agents, that coordinated services can themselves amount to an agent, and that
      the model does not address misuse; the turn toward [[agentic-ai|agentic AI]] since 2024 is
      often cited in support of these objections.
    example: CAIS imagined superintelligence as a toolbox; the market built agents instead.
origin: >-
  Proposed by K. Eric Drexler, the nanotechnology pioneer, in the Future of Humanity Institute
  technical report Reframing Superintelligence: Comprehensive AI Services as General Intelligence
  (2019).
year: 2019
