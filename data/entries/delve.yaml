# yaml-language-server: $schema=../schema/entry.schema.json

term: delve
id: delve
pos: v.
also:
  - delves
  - delving
  - delve into
domain: culture
domains:
  - llm
level: core
plain: >-
  An ordinary English verb meaning to dig into a subject, which AI chatbots used so often in
  2023–2024 that it became a joke and a supposed telltale sign of machine-written text.
senses:
  - definition: >-
      To examine a subject in detail; in AI culture, the best-known lexical marker of text written
      by [[large-language-model|large language models]]. ChatGPT-era models overused 'delve' along
      with a cluster of similar words ('tapestry', 'testament', 'intricate', 'underscore',
      'showcase'), so its appearance in an email, essay or paper came to be read as evidence of
      machine authorship. Corpus studies measured an abrupt post-2022 rise in such words in
      scientific abstracts and used it to estimate how many papers had been processed by LLMs.
      Proposed explanations center on style preferences introduced in
      [[post-training|post-training]], including the dialects of human raters and feedback loops in
      [[reinforcement-learning-from-human-feedback|preference tuning]]. Newer models appear to use
      it less, and some human writers now avoid it for fear of seeming artificial.
    example: >-
      The cover letter promised to delve into the role's rich tapestry, so we assumed a chatbot
      wrote it.
origin: >-
  The verb descends from Old English delfan, 'to dig'. Its AI connotation spread in 2023–2024: in
  April 2024 the investor Paul Graham said he discounted a cold email for using it, prompting
  reports, notably in The Guardian, that the word is common in Nigerian English and speculation that
  annotators' usage shaped models. A 2024 study by Dmitry Kobak and colleagues found 'delves' among
  the words that surged in PubMed abstracts.
year: 2024
note: >-
  Single words are weak evidence of AI authorship: people use them too, and vocabulary-based
  suspicion — like automated [[ai-detector|AI detectors]] — falls hardest on non-native and
  non-American writers.
see_also:
  - LLM-isms
  - AI slop
