term: decisive strategic advantage
id: decisive-strategic-advantage
pos: n.
also:
  - DSA
domain: asi
domains:
  - gov
  - safety
level: specialist
plain: >-
  A lead in technology and power so large that whoever holds it, whether a country, a company or an
  AI, could impose its will on the whole world.
senses:
  - definition: >-
      A lead in capabilities so large that its holder could dominate the whole world if it chose; in
      [[nick-bostrom|Nick Bostrom]]'s definition, technological and other advantages 'sufficient to
      enable it to achieve complete world domination'. The concept links [[takeoff|takeoff]] speed
      to concentration of power: if a fast takeoff lets one project pull far ahead before
      competitors catch up, that project, or the AI it builds, could gain a decisive strategic
      advantage and use it to form a [[singleton|singleton]]. Bostrom argued that an AI might be
      better placed than a human organization to exploit such a lead, since it would not face
      internal coordination problems or leaks. Later writers note that a slow takeoff could still
      yield a decisive advantage if the leader's growth compounds, and the idea now informs debates
      over national AI strategy, racing and deterrence such as
      [[mutual-assured-ai-malfunction|Mutual Assured AI Malfunction]].
    example: >-
      The case for nonproliferation rests on no single actor gaining a decisive strategic advantage.
origin: >-
  Introduced by Nick Bostrom in Superintelligence (2014), chapter 5, which distinguishes a decisive
  from a merely significant strategic advantage.
year: 2014
see_also:
  - singleton
  - takeoff
  - fast takeoff
  - AI takeover
  - AI arms race
  - concentration of power
contrast:
  - multipolar scenario
