term: tokenmaxxing
id: tokenmaxxing
pos: n.
also:
  - tokenmaxxer
  - tokenmaxx
domain: culture
domains:
  - society
  - eng
labels:
  - slang
  - emerging
level: specialist
plain: >-
  Using as much AI as possible — huge prompts, long sessions, many agents at once — mainly to rank
  high on workplace measures of how much AI people use.
senses:
  - definition: >-
      The practice of maximizing one's consumption of AI [[token|tokens]] — through long prompts,
      extended coding sessions and many parallel agents — in order to rank highly on employer
      metrics of AI adoption, treating token spend as a proxy for productivity. It flourished in
      2026 as companies tied AI use to performance expectations: an internal leaderboard at Meta
      that ranked employees by token consumption drew wide coverage before it was taken down, and
      similar pressure to maximize usage was reported at other large firms, including Amazon.
      Critics compare it to judging programmers by lines of code, noting that it rewards busywork,
      inflates AI bills and invites careless code.
    example: >-
      He's not shipping more, he's tokenmaxxing: six agents refactoring the same folder all night.
origin: >-
  Formed with the slang suffix '-maxxing' (to maximize something obsessively, as in 'looksmaxxing').
  The word spread in April 2026 amid reports of AI-usage leaderboards at large technology companies;
  Gergely Orosz's Pragmatic Engineer newsletter called it a 'weird new trend' that month.
year: 2026
note: >-
  Parallel in form to [[benchmaxxing|benchmaxxing]], which games evaluations of models; tokenmaxxing
  games evaluations of people — a textbook case of [[goodhart-s-law|Goodhart's law]].
see_also:
  - benchmaxxing
  - Goodhart's law
  - workslop
  - AI hype
  - token
  - agentic coding
sources:
