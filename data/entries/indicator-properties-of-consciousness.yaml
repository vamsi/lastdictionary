term: indicator properties of consciousness
id: indicator-properties-of-consciousness
pos: n.
also:
  - consciousness indicators
  - indicator properties
  - theory-heavy approach
domain: mind
domains:
  - eval
  - safety
labels:
  - emerging
level: specialist
plain: >-
  A checklist of design features that leading scientific theories link to consciousness, used to
  judge how likely it is that a particular AI system could be conscious.
senses:
  - definition: >-
      Properties of a system's architecture or processing that scientific theories of consciousness
      associate with conscious experience, used to assess whether an AI system is a candidate for
      [[machine-consciousness|machine consciousness]] without relying on its own testimony. The
      influential 2023 report by Patrick Butlin, Robert Long and 17 co-authors, which adopts
      computational [[functionalism|functionalism]] as a working hypothesis, lists fourteen
      indicators: twelve derived from [[global-workspace-theory|global workspace theory]],
      [[recurrent-processing-theory|recurrent processing theory]],
      [[higher-order-theories-of-consciousness|higher-order theories]],
      [[predictive-processing|predictive processing]] and [[attention-schema-theory|attention schema
      theory]], and two concerning agency and embodiment. Examples include a limited-capacity
      workspace with global broadcast, and metacognitive monitoring that can tell reliable
      perceptual signals from noise. The more indicators a system has, the more credence its
      consciousness deserves. The authors judged that no AI system then existing was conscious, but
      saw no evident technical obstacle to building systems that have the indicators.
origin: >-
  Set out, with the 'theory-heavy' method it implements, in 'Consciousness in Artificial
  Intelligence: Insights from the Science of Consciousness' (arXiv, August 2023) by Patrick Butlin,
  Robert Long and colleagues including Yoshua Bengio, Jonathan Birch and Eric Schwitzgebel. Research
  on animal sentience had earlier used behavioral and neural markers in a similar way.
year: 2023
note: >-
  The method is only as reliable as the theories it draws on, none of which is established, and it
  presupposes computational functionalism, which [[biological-naturalism|biological naturalism]] and
  [[integrated-information-theory|integrated information theory]] reject. By design it sidesteps
  behavioral tests, which [[large-language-model|language models]] can pass by imitation.
