standards: >-
  EU AI Act (Reg. (EU) 2024/1689), Art. 51(2): a general-purpose AI model is presumed to have
  high-impact capabilities when the cumulative computation used for its training exceeds 10²⁵ FLOP.
as_of: 2026-10
