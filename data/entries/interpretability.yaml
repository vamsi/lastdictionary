contrast:
  - black box
sources:
  - text: >-
      Lipton, Z. C. (2016). The Mythos of Model Interpretability. ICML Workshop on Human
      Interpretability in Machine Learning; later in ACM Queue (2018).
  - text: >-
      Doshi-Velez, F. & Kim, B. (2017). Towards A Rigorous Science of Interpretable Machine
