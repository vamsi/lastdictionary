plain: >-
  An American physicist who showed in 1982 how a network of simple units can store and recall
  memories, and who shared the 2024 Nobel Prize in Physics for work that enabled machine learning.
senses:
  - definition: >-
      American physicist at Princeton University, earlier at the California Institute of Technology
      (Caltech). After work in solid-state physics and biophysics, including the theory of kinetic
      proofreading (1974), he introduced the [[hopfield-network|Hopfield network]] (1982): a
      recurrent network of binary units with symmetric connections whose dynamics always lower an
      energy function, so that stored patterns become stable states and a partial or noisy input
      settles into the nearest stored memory. By linking neural computation to the statistical
      physics of spin glasses, the work drew physicists into neural-network research and, with
      [[geoffrey-hinton|Geoffrey Hinton]]'s [[boltzmann-machine|Boltzmann machine]], prepared the
      ground for [[energy-based-model|energy-based models]]; with David Tank he applied such
      networks to optimization problems such as the traveling-salesman problem (1985). He helped
      found Caltech's Computation and Neural Systems program. He shared the 2024 Nobel Prize in
      Physics with Hinton, the committee crediting the pair with the discoveries on which today's
      neural-network learning was built (see [[nobel-prizes-for-ai|Nobel Prizes for AI]]).
