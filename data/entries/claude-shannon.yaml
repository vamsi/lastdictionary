dates: 1916–2001
plain: >-
  An American engineer and mathematician who invented information theory, the mathematics of bits
  and communication, and wrote one of the first plans for a chess-playing computer.
senses:
  - definition: >-
      American mathematician and engineer who created [[information-theory|information theory]] in
      'A Mathematical Theory of Communication' (1948), written at Bell Telephone Laboratories. That
      paper defined information [[entropy|entropy]] and channel capacity and popularized the bit;
      its random approximations of English, built letter by letter and word by word from observed
      frequencies, were early [[n-gram-model|n-gram models]], and in 1951 he estimated the entropy
      of English by having people guess the next letter of a text. Earlier, his 1937 MIT master's
      thesis had shown that Boolean algebra could describe and simplify relay switching circuits, a
      basis of digital design. His 1950 paper on programming a computer to play chess set out
      [[minimax|minimax]] search with an evaluation function, the template for game programs for
      decades, and his maze-learning mechanical mouse Theseus (1950) was an early learning machine.
      He co-organized the 1956 [[dartmouth-workshop|Dartmouth workshop]] and moved that year to MIT,
      where he later became a professor. Kyoto Prize 1985.
