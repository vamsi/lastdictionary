term: non-consensual intimate imagery
id: non-consensual-intimate-imagery
pos: n.
also:
  - NCII
  - non-consensual intimate image
  - intimate image abuse
  - image-based sexual abuse
  - revenge porn
  - non-consensual pornography
  - sexual deepfake
  - intimate deepfake
domain: society
domains:
  - gov
  - gen
  - sec
level: essential
plain: >-
  Sexual or nude images of a real person that are shared, or made, without their consent — including
  fakes created with AI that show someone undressed or in sexual scenes.
senses:
  - definition: >-
      Sexually explicit or nude images or videos of an identifiable person that are created, shared
      or threatened to be shared without that person's consent. The category covers private images
      leaked by former partners (popularly 'revenge porn'), covert recordings, hacked material and,
      increasingly, synthetic imagery: [[deepfake|deepfake]] videos, face swaps and the output of
      [[nudification-app|nudification apps]], which use image generators to depict a clothed person
      as naked. Victims are overwhelmingly women and girls, and harms include harassment, extortion
      ('sextortion'), damage to reputation and employment, and lasting psychological distress.
      Countermeasures include hash-matching services such as StopNCII.org, which let victims block
      known images across participating platforms without uploading them; refusal training and
      [[safety-classifier|safety classifiers]] in image models; removal of nudification apps from
      app stores and payment networks; and laws that criminalize creation or distribution and impose
      takedown duties on platforms. AI-generated child sexual abuse material is illegal in many
      jurisdictions and is addressed by separate laws.
    example: >-
      Our NCII policy removes intimate deepfakes on exactly the same terms as real photographs.
origin: >-
  'Revenge porn' spread in the late 2000s with websites publishing ex-partners' images. Advocates,
  including the Cyber Civil Rights Initiative (founded in the early 2010s), promoted 'non-consensual
  pornography' and then 'non-consensual intimate imagery' as more accurate, less victim-blaming
  terms; Clare McGlynn and Erika Rackley proposed 'image-based sexual abuse' in 2017. AI-generated
  forms spread from 2017 with deepfakes.
note: >-
  As of October 2026, laws include the US [[take-it-down-act|TAKE IT DOWN Act]] (2025), whose
  platform takedown duty applies from May 2026; offences in England and Wales for sharing (in force
  2024) and creating (in force February 2026) intimate deepfakes; Australia's 2024 deepfake sexual
  material law; South Korea's 2024 ban on possessing or viewing sexual deepfakes; and EU Directive
  2024/1385, which member states must transpose by June 2027.
