term: AI authorship
id: ai-authorship
pos: n.
also:
  - copyrightability of AI-generated works
  - AI inventorship
  - computer-generated work
  - human authorship requirement
domain: gov
domains:
  - gen
  - mind
labels:
  - legal
  - contested
level: core
plain: >-
  The question of whether a work or invention produced by AI can be protected by copyright or
  patent, and if so who counts as its author or inventor: the AI, the person using it, or no one.
senses:
  - definition: >-
      The legal question of whether outputs generated by AI can be protected by copyright, or
      AI-assisted inventions by patents, and who, if anyone, is the author or inventor. In the
      United States, copyright requires human authorship: the Copyright Office registers human
      contributions — selection, arrangement, modification and expressive inputs — but not material
      determined by an AI system, and concluded in 2025 that typing a prompt, by itself, generally
      leaves too much to the system to make the user an author. The courts agreed in Thaler v.
      Perlmutter, refusing registration of an image whose application named an AI system as author;
      the D.C. Circuit affirmed in March 2025 and the Supreme Court declined review in March 2026.
      Other systems differ: UK law has since 1988 protected 'computer-generated works', treating as
      author the person who made the necessary arrangements, and the Beijing Internet Court (Li v.
      Liu, 2023) protected an AI-generated image that reflected the user's creative choices. For
      patents, courts in the US, the UK (2023) and elsewhere rejected Stephen Thaler's applications
      naming his DABUS system as inventor, holding that an inventor must be a natural person.
    example: >-
      Because of the human-authorship rule, only the artist's edits and arrangement of the AI images
      were registered.
origin: >-
  The US Copyright Office flagged computer-produced works as early as its 1965 annual report; the
  issue revived from 2018 with Stephen Thaler's test applications naming his AI systems as author
  and inventor, and with the February 2023 'Zarya of the Dawn' decision denying protection to
  Midjourney-generated comic images.
note: >-
  Works mixing human and machine contributions are protected only in their human parts, so US
  applicants must disclose AI-generated material. Some argue that denying protection discourages
  investment; others that granting it would flood the public domain with machine output and reward
  volume over creativity.
