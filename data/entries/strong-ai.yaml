# yaml-language-server: $schema=../schema/entry.schema.json

term: strong AI
id: strong-ai
pos: n.
also:
  - strong artificial intelligence
domain: mind
domains:
  - asi
  - hist
level: core
plain: >-
  Originally, the claim that a computer running the right program would literally have a mind and
  understand, not just imitate understanding. Today it often simply means AI as capable as humans
  across the board.
senses:
  - context: Philosophy
    definition: >-
      The thesis, named and attacked by John Searle, that a computer running the right program would
      not be simulating a mind but would actually have one, with real understanding and other mental
      states — in Searle's words, 'the appropriately programmed computer really is a mind'. On this
      view the program itself, not merely a model built with it, would explain cognition. Searle
      contrasted it with weak AI, the view that computers are useful tools for modeling and studying
      the mind, which he accepted. His [[chinese-room|Chinese room]] argument was aimed at strong AI
      in this sense, which is a claim about understanding and mentality, not about how capable a
      system is.
    example: >-
      Searle's target was strong AI, not the claim that computers are useful models of thought.
  - context: Capabilities
    definition: >-
      AI with general intelligence matching or exceeding human intelligence across most domains, a
      common synonym for [[artificial-general-intelligence|artificial general intelligence]] and the
      opposite of [[narrow-ai|narrow AI]]. In this usage a system could count as strong AI even if
      it had no mind or understanding in Searle's sense.
origin: >-
  Introduced by John Searle, together with its contrast 'weak AI', in 'Minds, Brains, and Programs'
  (Behavioral and Brain Sciences, 1980). From the 1990s futurists such as Ray Kurzweil used 'strong
  AI' for human-level general intelligence, the meaning now usual in popular writing.
year: 1980
note: >-
  Because the senses are easily conflated, careful writers use 'artificial general intelligence' for
  the capability sense and keep 'strong AI' for Searle's thesis. Searle's 'weak AI' (computers as
  tools for studying minds) is likewise not the same as [[narrow-ai|narrow AI]], though the two are
  often merged.
see_also:
  - Chinese room
  - artificial general intelligence
  - narrow AI
  - biological naturalism
  - computational theory of mind
  - machine understanding
contrast:
  - narrow AI
sources:
  - text: >-
      Searle, J. R. (1980). Minds, Brains, and Programs. Behavioral and Brain Sciences 3(3), 417–457.
