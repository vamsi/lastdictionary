      Fei-Fei, L., Fergus, R. & Perona, P. (2006). One-Shot Learning of Object Categories. IEEE
      Transactions on Pattern Analysis and Machine Intelligence 28(4).
  - text: >-
      Snell, J., Swersky, K. & Zemel, R. (2017). Prototypical Networks for Few-shot Learning.
      Advances in Neural Information Processing Systems 30.
  - text: >-
      Brown, T. B. et al. (2020). Language Models are Few-Shot Learners. Advances in Neural
