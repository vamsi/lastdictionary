term: generative engine optimization
id: generative-engine-optimization
pos: n.
also:
  - GEO
  - answer engine optimization
  - AEO
  - LLM optimization
  - LLMO
  - AI SEO
domain: society
domains:
  - llm
  - data
labels:
  - emerging
level: core
plain: >-
  Shaping web content so that AI chatbots and AI search features are more likely to find it, quote
  it and recommend it — the AI-era version of search engine optimization.
senses:
  - definition: >-
      Work aimed at getting content picked up, cited and presented favorably when
      [[generative-ai|generative AI]] systems (AI-written search summaries, chat assistants that
      search the web, so-called answer engines) compose their replies, as opposed to simply earning
      a high-ranked link on a results page. Techniques include stating facts and statistics
      explicitly, adding citations and quotations from authorities, writing clear self-contained
      passages that [[retrieval-augmented-generation|retrieval systems]] can lift, keeping pages
      crawlable, and earning mentions in sources that models trust. The introducing paper reported
      visibility gains of up to 40% on its GEO-bench benchmark. As AI answers reduce clicks through
      to websites, marketers treat GEO as a successor or complement to search engine optimization,
      while search companies maintain that sound SEO practice still applies.
    example: >-
      Our GEO audit found the chatbots cited a competitor's FAQ because it stated prices in plain
      sentences.
origin: >-
  Introduced by Pranjal Aggarwal, Vishvak Murahari, Tanmay Rajpurohit, Ashwin Kalyan, Karthik
  Narasimhan and Ameet Deshpande in 'GEO: Generative Engine Optimization', posted to arXiv on 16
  November 2023. The term entered marketing vocabulary in 2024–2025 as AI search summaries spread;
  New York magazine declared in August 2025 that SEO was dead and GEO had arrived.
year: 2023
note: >-
  Manipulative versions shade into spam and [[llm-grooming|LLM grooming]]; where optimization ends
  and manipulation begins is contested. The many rival labels (AEO, LLMO, AI SEO) are largely
  interchangeable.
