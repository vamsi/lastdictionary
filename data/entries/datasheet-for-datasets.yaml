      Crawford, K. (2021). Datasheets for Datasets. Communications of the ACM 64(12).
      arXiv:1803.09010.
    url: https://arxiv.org/abs/1803.09010
  - text: >-
      Bender, E. M. & Friedman, B. (2018). Data Statements for Natural Language Processing: Toward
