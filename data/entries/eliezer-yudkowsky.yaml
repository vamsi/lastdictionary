term: Eliezer Yudkowsky
id: eliezer-yudkowsky
sort_as: Yudkowsky Eliezer
pos: prop. n.
pronunciation: el-ee-EZ-er yud-KOW-skee
domain: people
domains:
  - asi
  - safety
  - culture
level: core
dates: b. 1979
plain: >-
  An American writer and AI theorist who, from around 2000, argued that superhuman AI would likely
  destroy humanity unless its goals were made safe, and who founded an online community devoted to
  rational thinking.
senses:
  - definition: >-
      American AI theorist and writer, largely self-educated, and a central figure in making the
      risks of superhuman AI a research problem. In 2000 he co-founded the Singularity Institute for
      Artificial Intelligence, renamed the [[machine-intelligence-research-institute|Machine
      Intelligence Research Institute]] (MIRI) in 2013, first to build advanced AI, soon to make it
      safe. He introduced [[friendly-ai|friendly AI]] (2001) and
      [[coherent-extrapolated-volition|coherent extrapolated volition]] (2004), devised the
      [[ai-box-experiment|AI-box experiment]] (2002), and in a 2008 online debate with the economist
      Robin Hanson argued for a rapid, local [[intelligence-explosion|intelligence explosion]]
      ([[foom|FOOM]]). His essays on reasoning, the Sequences (2006–2009), published on Overcoming
      Bias and on [[lesswrong|LessWrong]], which he founded in 2009, seeded the
      [[rationalist-community|rationalist community]], as did his novel 'Harry Potter and the
      Methods of Rationality'. Increasingly pessimistic, he called in a 2023 TIME essay for an
      enforced international halt to large AI training runs, and with Nate Soares wrote 'If Anyone
      Builds It, Everyone Dies' (2025).
see_also:
