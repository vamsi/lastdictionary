sources:
  - text: >-
      Yudkowsky, E. (2008). Artificial Intelligence as a Positive and Negative Factor in Global
      Risk. In N. Bostrom & M. Ćirković (eds.), Global Catastrophic Risks. Oxford University Press.
  - text: >-
