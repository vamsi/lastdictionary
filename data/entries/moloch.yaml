term: Moloch
id: moloch
pos: prop. n.
also:
  - Meditations on Moloch
  - multipolar trap
  - Moloch trap
domain: culture
domains:
  - safety
  - gov
labels:
  - figurative
level: specialist
plain: >-
  A name, borrowed from an ancient god of sacrifice, for situations where competition forces
  everyone to act against their shared interests — as when AI companies feel pushed to race ahead
  despite the risks.
senses:
  - definition: >-
      A personification of coordination failure: the dynamics by which competition, arms races and
      misaligned incentives push individuals, firms or nations into outcomes none of them want,
      because anyone who holds back alone is outcompeted. In AI discussion Moloch names the race
      among companies and countries to deploy ever more capable systems while cutting corners on
      safety, evaluation and social costs, and frames governance proposals — international
      agreements, [[compute-governance|compute governance]], shared safety commitments — as efforts
      to defeat Moloch by coordinating restraint. It is the [[rationalist-community|rationalists']]
      vivid label for problems economists analyze as tragedies of the commons, prisoner's dilemmas
      and races to the bottom; 'multipolar trap', a phrase popularized in the same circles, names
      the same structure in plainer terms.
    example: Nobody at either lab wants to skip the safety evals; that's Moloch, not malice.
origin: >-
  Moloch is a Canaanite deity associated in the Hebrew Bible with child sacrifice; Allen Ginsberg's
  poem Howl (1956) made him a symbol of a devouring industrial system. Scott Alexander's essay
  'Meditations on Moloch' (Slate Star Codex, July 2014) recast him as the god of runaway
  competition, and the usage spread through rationalist and AI-safety writing.
year: 2014
note: >-
  Critics regard the mythic framing as fatalistic, since it can make contingent policy choices sound
  like laws of nature.
