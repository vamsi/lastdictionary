term: levels of AGI
id: levels-of-agi
pos: n.
also:
  - Levels of AGI framework
  - AGI levels
domain: asi
domains:
  - eval
level: specialist
plain: >-
  A scheme from Google DeepMind researchers for grading AI by how well it performs and how broad its
  skills are, from emerging to superhuman, much as self-driving cars are graded by levels.
senses:
  - definition: >-
      A framework for classifying AI systems by depth of performance and breadth of generality,
      proposed so that progress toward [[artificial-general-intelligence|AGI]] can be measured
      rather than argued about. Performance levels run from 0 (no AI) through 1 Emerging (about as
      good as, or a little better than, an unskilled person), 2 Competent (at least the 50th
      percentile of skilled adults), 3 Expert (90th percentile) and 4 Virtuoso (99th percentile) to
      5 Superhuman (better than all humans). Each level applies to narrow or general systems, so a
      chess engine is narrow superhuman while the chatbots of 2023 were classed as emerging AGI. A
      separate scale of autonomy, from AI as a tool through consultant, collaborator and expert to
      autonomous agent, distinguishes what a system can do from how it is deployed. The paper also
      proposes principles for defining AGI, such as focusing on capabilities rather than mechanisms
      and on potential rather than deployment. OpenAI was reported in 2024 to use its own five-stage
      scale: chatbots, reasoners, agents, innovators and organizations.
    example: >-
      On the levels of AGI scale, the model might be competent general but expert only in coding.
origin: >-
  Proposed by Meredith Ringel Morris, Jascha Sohl-Dickstein, Noah Fiedel, Shane Legg and four other
  Google DeepMind researchers in 'Levels of AGI: Operationalizing Progress on the Path to AGI'
  (arXiv, November 2023), published as an ICML 2024 position paper and modeled on the SAE
  [[levels-of-driving-automation|levels of driving automation]].
year: 2023
