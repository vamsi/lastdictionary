level: core
plain: >-
  The US military's research-funding agency, which paid for much of the early development of
  artificial intelligence and the internet and runs prize competitions such as driverless-car races.
senses:
  - definition: >-
      The Defense Advanced Research Projects Agency, the US Defense Department's funder of
      ambitious, high-risk research, which has no laboratories of its own: program managers on short
      appointments choose and steer projects carried out by universities and companies. Through its
      Information Processing Techniques Office, founded in 1962 under J. C. R. Licklider, it was the
      principal patron of early AI research at MIT, Stanford, Carnegie Mellon and SRI, supporting
      work such as [[shakey-the-robot|Shakey the robot]] and the 1970s speech-understanding program.
      Cuts in the 1970s and the winding-down of the [[strategic-computing-initiative|Strategic
      Computing Initiative]] (1983–1993) contributed to the [[ai-winter|AI winters]]. Later it ran
      the [[darpa-grand-challenge|DARPA Grand Challenge]] races for autonomous vehicles (2004–2007),
      the Cyber Grand Challenge (2016), an [[explainable-ai|explainable AI]] program (from 2017) and
      the AI Cyber Challenge (2023–2025), and its CALO personal-assistant project gave rise to
      Apple's Siri.
origin: >-
  Created in February 1958 as the Advanced Research Projects Agency (ARPA), in response to the
  Soviet launch of Sputnik; it was renamed DARPA in 1972, briefly reverting to ARPA in 1993–1996.
  Its ARPANET (1969) was the forerunner of the internet.
year: 1958
