dates: b. 1936
plain: >-
  An American computer scientist who pioneered expert systems, programs that capture specialists'
  knowledge as rules to solve problems in fields such as chemistry and medicine.
senses:
  - definition: >-
      American computer scientist at Stanford University, the leading early builder and champion of
      [[expert-system|expert systems]]. A student of [[herbert-a-simon|Herbert A. Simon]] at the
      Carnegie Institute of Technology, where he built the EPAM model of human verbal learning, he
      co-edited 'Computers and Thought' (1963), the first anthology of AI research. From 1965, with
      Joshua Lederberg, Bruce Buchanan and Carl Djerassi, he led [[dendral|DENDRAL]], which inferred
      molecular structures from mass-spectrometry data, and his Heuristic Programming Project went
      on to produce [[mycin|MYCIN]] and other systems. From this work he drew the 'knowledge
      principle' — that a program's power comes mainly from the specialized knowledge in its
      [[knowledge-base|knowledge base]] rather than from its inference methods — and promoted
      knowledge engineering as a discipline. He co-wrote 'The Fifth Generation' (1983) about Japan's
      [[fifth-generation-computer-systems-project|Fifth Generation Computer Systems project]] and
      was chief scientist of the US Air Force (1994–97). [[turing-award|Turing Award]] 1994, shared
      with [[raj-reddy|Raj Reddy]].
