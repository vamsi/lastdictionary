plain: >-
  A British-Canadian scientist whose decades of persistent work on brain-inspired neural networks
  laid the foundations of modern AI; often called a 'godfather of AI', he now warns publicly about
  its dangers.
senses:
  - definition: >-
      British-Canadian computer scientist and cognitive psychologist whose persistence with
      [[neural-network|neural networks]], through long periods when most of AI had set them aside,
      made him the emblematic figure of [[deep-learning|deep learning]]; his academic home has long
      been the University of Toronto. With Terry Sejnowski he devised the
      [[boltzmann-machine|Boltzmann machine]] (1983–85); with [[david-rumelhart|David Rumelhart]]
      and Ronald Williams he showed in 1986 that [[backpropagation|backpropagation]] learns useful
      internal representations; and his 2006 [[deep-belief-network|deep belief networks]] helped
      revive the training of deep networks. [[alexnet|AlexNet]] (2012), built in his group by
      [[alex-krizhevsky|Alex Krizhevsky]] and [[ilya-sutskever|Ilya Sutskever]], set off the
      [[deep-learning-revolution|deep learning revolution]]; he also co-introduced
      [[dropout|dropout]], [[knowledge-distillation|knowledge distillation]] and [[t-sne|t-SNE]].
      Google acquired the trio's startup DNNresearch in 2013 and employed him until May 2023, when
      he resigned so that he could warn openly about AI's dangers, from misuse to
      [[loss-of-control|loss of control]]. He shared the 2018 [[turing-award|Turing Award]] with
      [[yoshua-bengio|Yoshua Bengio]] and [[yann-lecun|Yann LeCun]], the trio often called the
      [[godfathers-of-ai|godfathers of AI]], and the 2024 Nobel Prize in Physics with
      [[john-hopfield|John Hopfield]].
