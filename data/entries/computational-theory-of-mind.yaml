# yaml-language-server: $schema=../schema/entry.schema.json

term: computational theory of mind
id: computational-theory-of-mind
pos: n.
also:
  - CTM
  - computationalism
  - classical computational theory of mind
domain: mind
domains:
  - core
  - sym
level: core
plain: >-
  The idea that thinking is a kind of computation: the mind processes information by following
  rules, much as a computer runs a program, and the brain is the machine doing it.
senses:
  - definition: >-
      The thesis that cognition is computation: mental processes are operations on internal
      representations, carried out by rules sensitive to the representations' structure, and the
      brain is a computing system. In its classical version, associated with Jerry Fodor and Zenon
      Pylyshyn, the representations are symbol structures in a
      [[language-of-thought-hypothesis|language of thought]] manipulated as in a digital computer;
      connectionist versions treat cognition as computation over distributed numerical
      representations in [[neural-network|neural networks]]. The thesis was a founding assumption of
      [[cognitive-science|cognitive science]] and of AI's ambition to model minds. Critics argue
      that computation is observer-relative (John Searle), that meaning cannot be captured by formal
      operations (the [[chinese-room|Chinese room]] and [[symbol-grounding-problem|symbol grounding
      problem]]), or that cognition is embodied and dynamical rather than computational
      ([[embodied-cognition|embodied cognition]]).
origin: >-
  Anticipated by Thomas Hobbes's claim that reasoning is reckoning (Leviathan, 1651) and by Warren
  McCulloch and Walter Pitts's network of logical neurons (1943). Hilary Putnam formulated it in
  papers of the 1960s, notably 1967, and Jerry Fodor systematized it in The Language of Thought
  (1975).
year: 1967
note: >-
  Computationalism about cognition (thinking, perceiving, deciding) is far more widely accepted than
  computationalism about consciousness, which is the stronger claim at issue in debates over
  [[machine-consciousness|machine consciousness]].
see_also:
  - functionalism
  - language of thought hypothesis
  - physical symbol system hypothesis
  - connectionism
  - cognitive science
  - Marr's levels of analysis
  - Chinese room
contrast:
  - embodied cognition
sources:
