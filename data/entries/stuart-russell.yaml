plain: >-
  A British computer scientist who co-wrote the standard AI textbook and argues that AI must be
  redesigned to stay uncertain about what humans want, so that it remains under human control.
senses:
  - definition: >-
      British computer scientist, professor at the University of California, Berkeley, since 1986.
      His textbook with [[peter-norvig|Peter Norvig]], 'Artificial Intelligence: A Modern Approach'
      (1995; 4th ed. 2020), organized the whole field around the idea of rational
      [[intelligent-agent|agents]] and became the standard text worldwide. His research spans
      bounded rationality, probabilistic programming and [[inverse-reinforcement-learning|inverse
      reinforcement learning]], which he proposed in 1998. Arguing that the standard model of AI —
      machines optimizing a fixed objective supplied by people — becomes dangerous as systems grow
      more capable, he founded the [[center-for-human-compatible-ai|Center for Human-Compatible AI]]
      (2016) and proposed that machines should instead be uncertain about human preferences and
      learn them from behavior, an approach formalized in
      [[cooperative-inverse-reinforcement-learning|cooperative inverse reinforcement learning]] and
      the [[off-switch-game|off-switch game]] and set out in 'Human Compatible' (2019). He campaigns
      against lethal autonomous weapons and gave the BBC Reith Lectures in 2021. IJCAI Computers and
      Thought Award 1995.
