level: specialist
plain: >-
  A small nonprofit research group that writes detailed forecasts and scenarios of how advanced AI
  could develop, best known for the 2025 scenario AI 2027.
senses:
  - definition: >-
      A nonprofit research organization that forecasts the development of advanced AI and its
      consequences through quantitative models, detailed scenarios and tabletop exercises. It is
      best known for [[ai-2027|AI 2027]] (April 2025), a month-by-month scenario in which
      [[automated-ai-research|automated AI research]] yields a [[superhuman-coder|superhuman coder]]
      and then an [[intelligence-explosion|intelligence explosion]] by 2027, ending in two
      alternative branches, a race and a slowdown; the scenario was read widely, including by
      government officials, and criticized as too fast and too specific. Its accompanying timelines
      and takeoff forecasts set out its assumptions explicitly, and it has since revised them as
      evidence has accumulated. Later work includes scenarios with policy recommendations for US
      decision-makers. The method continues its founder's 2021 forecast essay 'What 2026 Looks
      Like'.
origin: >-
  Founded in 2024 by Daniel Kokotajlo, who left OpenAI's governance team that year and drew
  attention for refusing to sign a non-disparagement agreement that put his vested equity at risk;
  researchers Eli Lifland and Thomas Larsen lead much of its work. It is a US nonprofit, legally
  incorporated as Artificial Intelligence Forecasting Inc.
year: 2024
