term: training data
id: training-data
pos: n.
also:
  - training data set
  - train data
domain: data
domains:
  - core
  - gov
labels:
  - legal
level: essential
plain: >-
  The examples an AI system learns from. Whatever patterns, skills, gaps and biases are in the
  training data tend to show up in the finished system.
senses:
  - definition: >-
      The examples a learning algorithm adjusts a [[model|model]]'s [[parameter|parameters]] to fit
      during [[training|training]] — as distinct from [[validation-set|validation data]], held back
      to compare settings and design choices, and [[test-set|test data]], held back for a final
      measurement. Depending on the learning setup, it may consist of input–output pairs with
      [[label|labels]] ([[supervised-learning|supervised learning]]); raw unlabeled material from
      which targets are derived automatically ([[self-supervised-learning|self-supervised
      learning]], as in the [[pretraining-data|pretraining data]] of [[large-language-model|language
      models]]); demonstrations; human judgments between alternatives ([[preference-data|preference
      data]]); or experience generated by interacting with an environment
      ([[reinforcement-learning|reinforcement learning]]). Training data largely determine what a
      model knows, which languages and populations it serves well, and which errors and biases it
      reproduces; models can also [[memorization|memorize]] and later leak parts of it. The EU AI
      Act defines training data as data used to train an AI system by fitting its learnable
      parameters (Art. 3(29)), and obliges providers of high-risk systems to use training,
      validation and test sets that are relevant and sufficiently representative and, as far as
      possible, complete and free of errors for the intended purpose (Art. 10(3)).
    example: >-
      The model knows nothing after early 2025 because that is where its training data ends.
origin: >-
  Talk of 'training' a machine on examples comes from pattern-recognition and perceptron research of
  the late 1950s and 1960s, which spoke of training sets and training samples. 'Training data'
  became the everyday term as machine learning spread, and entered European statute with the AI Act
  in 2024.
note: >-
  Often used interchangeably with [[training-set|training set]]; 'training set' stresses one split
  of a dataset, 'training data' the material itself. Many disputes over AI, copyright, privacy and
  consent are at bottom disputes about training data (see [[fair-use-and-ai-training|fair use and AI
  training]]).
