plain: >-
  The American co-founder and chief executive of Facebook's parent company Meta, who made it a major
  AI developer that released its Llama models for anyone to download.
senses:
  - definition: >-
      American entrepreneur, co-founder (2004) and chief executive of Facebook, renamed Meta
      Platforms in 2021, who made Meta a major, often contrarian force in AI. In 2013 he hired
      [[yann-lecun|Yann LeCun]] to found Facebook AI Research, which went on to create the
      [[pytorch|PyTorch]] framework. From 2023 Meta released its [[llama|Llama]]
      [[large-language-model|language models]] with downloadable weights, from Llama 2 (July 2023)
      under a license permitting most commercial use; in 2024 Zuckerberg argued in an open letter
      that [[open-weight-model|open-weight]] AI is safer and better for innovation than closed
      models. After the poorly received Llama 4 (April 2025), Meta bought 49 percent of
      [[scale-ai|Scale AI]], made its founder [[alexandr-wang|Alexandr Wang]] chief AI officer and
      created [[meta-superintelligence-labs|Meta Superintelligence Labs]] (June 2025), recruiting
      from rival labs with exceptionally large offers. His July 2025 letter on
      [[personal-superintelligence|personal superintelligence]] set out the lab's goal and signaled
      more caution about open-sourcing Meta's most capable models.
