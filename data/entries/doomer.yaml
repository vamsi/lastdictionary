term: doomer
id: doomer
pos: n.
also:
  - AI doomer
  - doomerism
  - doomers
domain: culture
domains:
  - asi
  - safety
labels:
  - informal
  - contested
level: essential
plain: >-
  Someone who believes advanced AI is likely to cause a catastrophe, possibly human extinction;
  often used as a put-down by people who think those fears are exaggerated.
senses:
  - definition: >-
      A person who assigns a high probability to catastrophic outcomes from advanced AI — typically
      human extinction or permanent loss of control to a misaligned
      [[superintelligence|superintelligence]] — and who usually advocates slowing or halting
      frontier development. Usage is unstable: some people so described accept the label, while many
      reject it as a caricature and prefer terms such as AI-risk advocate;
      [[effective-accelerationism|accelerationists]] apply it broadly to anyone favoring regulation.
      Positions differ enormously in degree, from people whose [[p-doom|p(doom)]] exceeds 90 percent
      to researchers who think catastrophe unlikely but worth insuring against, so careful writers
      state the claim rather than the label.
    example: >-
      He isn't a doomer; he puts the risk at ten percent, which he considers far too high to ignore.
origin: >-
  'Doomer' described pessimists resigned to collapse long before AI — peak-oil 'doomers' in the
  2000s, and the 2018 'Doomer' Wojak meme. It was applied to AI-risk pessimists by about 2022–2023,
  especially after Eliezer Yudkowsky's 'Death with Dignity' post (April 2022) and his March 2023
  TIME op-ed calling for an indefinite halt to large training runs.
note: >-
  Reid Hoffman and Greg Beato's 2025 book Superagency sorts attitudes into doomers, gloomers,
  zoomers and bloomers. Opposite camps include [[effective-accelerationism|e/acc]]; doomers' critics
  also use the dismissive [[decel|decel]].
