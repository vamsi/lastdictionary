# yaml-language-server: $schema=../schema/entry.schema.json

term: FOOM
id: foom
pos: n.
also:
  - AI-Foom
  - go foom
domain: asi
domains:
  - culture
labels:
  - slang
level: specialist
plain: >-
  Slang for a sudden, explosive jump in an AI's abilities, the AI going 'foom' and racing from about
  human level to vastly superhuman in a very short time.
senses:
  - definition: >-
      A very [[fast-takeoff|fast takeoff]], especially one driven by a single AI system's
      [[recursive-self-improvement|recursive self-improvement]] rather than by economy-wide
      progress; the word imitates the sound of something bursting into flame. It carries assumptions
      associated with Eliezer Yudkowsky's position: that one project could go from modest capability
      to [[decisive-strategic-advantage|decisive strategic advantage]] within days or weeks, mainly
      through software improvements and with little warning. Opponents, notably the economist Robin
      Hanson, argued that progress comes from many accumulated contributions spread across many
      actors, so no single system would outgrow the rest of the world. The word survives as
      shorthand on both sides, as in 'foom' and 'no-foom' worldviews, and is also used as a verb.
    example: His whole threat model assumes the first system to automate research will foom.
origin: >-
  Earliest written use not established. Popularized by the late-2008 exchange of blog posts between
  Robin Hanson and Eliezer Yudkowsky on Overcoming Bias, later collected by the Machine Intelligence
  Research Institute as The Hanson-Yudkowsky AI-Foom Debate (2013) together with the transcript of
  their 2011 in-person debate.
year: 2008
see_also:
  - fast takeoff
  - takeoff
  - intelligence explosion
  - recursive self-improvement
  - Eliezer Yudkowsky
  - LessWrong
contrast:
  - slow takeoff
sources:
  - text: >-
      Hanson, R. & Yudkowsky, E. (2013). The Hanson-Yudkowsky AI-Foom Debate. Machine Intelligence
      Research Institute.
    url: https://intelligence.org/ai-foom-debate/
