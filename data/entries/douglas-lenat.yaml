plain: >-
  An American computer scientist who spent four decades building Cyc, a giant hand-written database
  of everyday common sense meant to let computers reason like people.
senses:
  - definition: >-
      American computer scientist who devoted four decades to [[cyc|Cyc]], the largest effort to
      hand-encode common sense for computers. His Stanford doctoral program AM (Automated
      Mathematician, 1976) explored elementary mathematics guided by hundreds of
      [[heuristic|heuristics]], rediscovering concepts such as prime numbers, and its successor
      Eurisko (early 1980s) also learned new heuristics, famously designing the winning starship
      fleets in the Traveller science-fiction war-game tournament (1981 and 1982); he received the
      IJCAI Computers and Thought Award (1977). Concluding that such programs lacked everyday
      knowledge, he began Cyc in 1984 at the Microelectronics and Computer Technology Corporation
      and led it from 1994 at Cycorp: a [[knowledge-base|knowledge base]] of millions of
      hand-written assertions in a [[first-order-logic|logic-based]] language, with an
      [[inference-engine|inference engine]] for [[commonsense-reasoning|commonsense reasoning]].
      Seen by critics as a cautionary tale for [[symbolic-ai|symbolic AI]], Cyc was offered by
      Lenat, in a 2023 paper with [[gary-marcus|Gary Marcus]], as a source of the trustworthy
      reasoning that [[large-language-model|language models]] lack.
