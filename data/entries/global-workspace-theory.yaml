term: global workspace theory
id: global-workspace-theory
pos: n.
also:
  - GWT
  - global neuronal workspace
  - global neuronal workspace theory
  - GNW
  - GNWT
  - global workspace
domain: mind
domains:
  - dl
level: core
plain: >-
  A leading scientific theory holding that we become conscious of something when the brain
  broadcasts it widely — as if putting it on a stage where every part of the mind can use it.
senses:
  - definition: >-
      A theory on which a mental content becomes conscious when it enters a limited-capacity
      workspace whose contents are broadcast to many specialized, otherwise independent processors —
      for perception, memory, language, evaluation and motor control — making the information
      available for report, reasoning and flexible action. Bernard Baars's original version used the
      metaphor of a theater with a spotlight of attention. The global neuronal workspace version of
      Stanislas Dehaene, Jean-Pierre Changeux and colleagues locates the workspace in long-range
      networks linking prefrontal and parietal cortex, and predicts a sudden, self-sustaining
      'ignition' of activity when a stimulus becomes conscious. Because the theory is functional, it
      lends itself to AI: several [[indicator-properties-of-consciousness|indicator properties of
      consciousness]] derive from it, and architectures in which specialized modules share a
      workspace have been built, although whether [[transformer|transformer]] language models
      contain anything like a limited-capacity workspace is disputed.
    example: >-
      On global workspace theory, the question is whether any bottleneck in the model forces its
      modules to compete for a shared broadcast.
origin: >-
  Proposed by Bernard Baars in A Cognitive Theory of Consciousness (1988), drawing on the
  'blackboard' architectures of 1970s AI. The neuronal version was introduced by Stanislas Dehaene,
  Michel Kerszberg and Jean-Pierre Changeux (PNAS, 1998) and developed by Dehaene and Lionel
  Naccache (2001).
year: 1988
note: >-
  Critics such as Ned Block argue that the theory explains [[access-consciousness|access
  consciousness]] rather than phenomenal experience. An adversarial collaboration published in
  Nature in April 2025 tested the neuronal version against
  [[integrated-information-theory|integrated information theory]]; its results challenged key
  predictions of both theories.
