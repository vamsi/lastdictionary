term: Distributed AI Research Institute
id: distributed-ai-research-institute
pos: prop. n.
also:
  - DAIR
domain: orgs
domains:
  - society
level: specialist
plain: >-
  Timnit Gebru set up this institute in 2021, a year after her departure from Google, to research
  the damage AI can do, especially to marginalized communities, without relying on big-tech money.
senses:
  - definition: >-
      A research institute, funded by foundations rather than technology companies and organized
      around the communities it studies, that investigates the harms of AI systems and alternative
      ways of building them, especially as they affect marginalized groups and the Global South. Its
      'distributed' model employs researchers where they live instead of relocating them to
      technology hubs. Its work includes studies of the [[ghost-work|data workers]] who label data
      and moderate content for AI companies, of social-media harms during armed conflicts such as
      the Tigray war, and of satellite imagery tracing the legacy of spatial apartheid in South
      Africa. Gebru and the philosopher Émile P. Torres coined the acronym [[tescreal|TESCREAL]]
      (2023) for a bundle of ideologies, including transhumanism, [[effective-altruism|effective
      altruism]] and [[longtermism|longtermism]], that they argue drive the race to build
      [[artificial-general-intelligence|artificial general intelligence]].
origin: >-
  Founded on 2 December 2021 by [[timnit-gebru|Timnit Gebru]], a year after her contested departure
  from Google, where she had co-led the Ethical AI team; it was launched with foundation grants
  rather than corporate funding.
year: 2021
