level: specialist
plain: >-
  A nonprofit group under the Linux Foundation that looks after shared, open technical standards for
  AI agents, such as the Model Context Protocol, so that no single company controls them.
senses:
  - definition: >-
      A directed fund of the Linux Foundation that provides vendor-neutral governance, funding and
      community infrastructure for open-source projects and standards used to build [[ai-agent|AI
      agents]]. Its founding projects were the [[model-context-protocol|Model Context Protocol]]
      (contributed by Anthropic), goose (an open-source agent contributed by Block) and AGENTS.md
      (an [[agent-instruction-file|agent instruction file]] convention contributed by OpenAI); later
      projects include the [[agent2agent-protocol|Agent2Agent protocol]], which joined as a hosted
      project in August 2026. Founding platinum members were Amazon Web Services, Anthropic, Block,
      Bloomberg, Cloudflare, Google, Microsoft and OpenAI. The foundation hosts specification work
      and maintainer governance and runs events such as MCP Dev Summits and the AGNTCon + MCPCon
      conferences; its creation marked the consolidation of rival agent-interoperability efforts
      under a neutral home.
    example: >-
      Since MCP moved to the Agentic AI Foundation, specification changes go through its public
      working groups.
origin: >-
  Announced by the Linux Foundation in San Francisco on 9 December 2025, roughly a year after MCP's
  release, with Anthropic, Block and OpenAI contributing the three founding projects. As of October
  2026 its members page listed more than 250 organizations.
year: 2025
