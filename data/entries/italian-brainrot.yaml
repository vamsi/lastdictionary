plain: >-
  A 2025 internet craze of absurd AI-generated creatures with fake-Italian names — such as a shark
  wearing sneakers — narrated by AI voices and hugely popular with young children.
senses:
  - definition: >-
      A 2025 wave of internet memes made with [[generative-ai|generative AI]], starring absurd
      hybrid creatures, animals fused with food, objects or weapons, each with a mock-Italian name
      and introduced in nonsense rhymes by a synthetic, Italian-accented voice. Its best-known
      characters include a three-legged shark in sneakers (Tralalero Tralala), a crocodile fused
      with a bomber aircraft (Bombardiro Crocodilo), a ballerina with a cappuccino cup for a head
      (Ballerina Cappuccina) and a bat-wielding wooden log of Indonesian origin (Tung Tung Tung
      Sahur). The genre is a prominent case of [[ai-slop|AI slop]] turned into folk culture,
      especially among young children; critics raised concerns about blasphemous or violent
      narration and about the commercial exploitation of children's attention, while others defended
      it as harmless nonsense.
    example: My niece can name forty Italian brainrot characters and not one Pokémon.
origin: >-
  Emerged on TikTok in January 2025, when AI-generated videos of the shark character Tralalero
  Tralala went viral; dozens of characters followed within months and spread to other platforms,
  trading cards, toys, video games and even politicians' posts. 'Brain rot', for mind-numbing online
  content, was Oxford's 2024 Word of the Year.
year: 2025
