plain: >-
  An American linguist who argues that language models only mimic the form of language without
  understanding it, and who co-coined the phrase 'stochastic parrots'.
senses:
  - definition: >-
      American linguist, professor of linguistics at the University of Washington, where she directs
      its professional master's program in computational linguistics; she was president of the
      [[association-for-computational-linguistics|Association for Computational Linguistics]] in
      2024. Her early research was in grammar engineering, including the multilingual LinGO Grammar
      Matrix. Her insistence that researchers name the language they study became known as the
      Bender rule, and with Batya Friedman she proposed data statements (2018) for documenting
      [[natural-language-processing|natural language processing]] datasets. With Alexander Koller
      she argued in 'Climbing towards NLU' (2020), through the [[octopus-test|octopus test]], that
      systems trained only on linguistic form cannot learn meaning; with [[timnit-gebru|Timnit
      Gebru]], Angelina McMillan-Major and Margaret Mitchell she co-wrote the 2021 paper that coined
      '[[stochastic-parrot|stochastic parrot]]', warning of the environmental, social and epistemic
      costs of ever larger [[language-model|language models]]. With the sociologist Alex Hanna she
      hosts a podcast critiquing [[ai-hype|AI hype]] and co-wrote 'The AI Con' (2025).
