  - human evaluation
  - instruction following
  - chat model
sources:
  - text: >-
      Zheng, L., Chiang, W.-L., Sheng, Y. et al. (2023). Judging LLM-as-a-Judge with MT-Bench and
      Chatbot Arena. NeurIPS 2023 Datasets and Benchmarks Track.
    url: https://arxiv.org/abs/2306.05685
