term: AGI has been achieved internally
id: agi-has-been-achieved-internally
pos: phr.
also:
  - AGI achieved internally
domain: culture
domains:
  - asi
labels:
  - slang
level: specialist
plain: >-
  A meme claiming, half-jokingly, that an AI company has secretly built human-level AI and is
  keeping it hidden; used to tease rumors and hype from AI insiders.
senses:
  - definition: >-
      A catchphrase asserting, usually ironically, that a leading AI company has already built
      [[artificial-general-intelligence|artificial general intelligence]] in secret. It is used to
      mock or amplify cryptic posts by insiders and leakers, to joke about unexplained corporate
      events, and as shorthand for the culture of rumor and 'vagueposting' around frontier labs, in
      which anonymous accounts hint at unreleased capabilities. Its persistence reflects both
      genuine information gaps between labs and the public and the commercial value of suggestive
      hype; serious discussions of the question turn on what would count as AGI (see
      [[levels-of-agi|levels of AGI]]).
    example: >-
      Another cryptic post from a researcher, and the replies are all 'AGI has been achieved
      internally'.
origin: >-
  Popularized in September 2023 by the pseudonymous X account 'Jimmy Apples', known for leaks about
  OpenAI; later that month Sam Altman posted the phrase as a comment on Reddit's r/singularity forum
  before editing it to say he was joking. It resurfaced during the November 2023 OpenAI board
  crisis, alongside the meme 'What did Ilya see?'.
year: 2023
