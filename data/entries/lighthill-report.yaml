  - society
labels:
  - historical
level: specialist
plain: >-
  A 1973 review written for a British government research council that judged AI research to have
  fallen far short of its promises. It led to deep cuts in AI funding in the United Kingdom.
senses:
  - definition: >-
      'Artificial Intelligence: A General Survey', an assessment of AI research written by the
      applied mathematician Sir James Lighthill for the UK Science Research Council in 1972 and
      published in 1973. Lighthill divided the field into advanced automation (category A),
      computer-based studies of the central nervous system (category C), and a 'bridge' category B,
      essentially robot building and general-purpose AI, meant to connect them; he judged that
      category B had failed to deliver. His central argument was that methods that worked on toy
      problems would be swamped by combinatorial explosion on real ones. The report led the Council
      to withdraw support from most British AI research outside a few centers such as Edinburgh, and
      it is counted among the causes of the first [[ai-winter|AI winter]].
    example: >-
      Edinburgh's robotics researchers felt the effects of the Lighthill report for a decade.
origin: >-
  Commissioned by the Science Research Council in 1972 and published in 1973 in Artificial
  Intelligence: A Paper Symposium, together with dissenting responses. Later in 1973 Lighthill
  debated Donald Michie, [[john-mccarthy|John McCarthy]] and Richard Gregory at the Royal
  Institution in London, in a debate televised by the BBC.
year: 1973
note: >-
  Lighthill was a distinguished fluid dynamicist with no background in AI, a point his critics
  emphasized.
