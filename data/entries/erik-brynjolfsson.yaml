term: Erik Brynjolfsson
id: erik-brynjolfsson
sort_as: Brynjolfsson Erik
pos: prop. n.
pronunciation: BRIN-yolf-son
domain: people
domains:
  - society
level: specialist
plain: >-
  An American economist who studies how digital technology and AI change productivity and jobs, and
  who warns against AI built to replace people rather than to augment them.
senses:
  - definition: >-
      American economist, director of the Stanford Digital Economy Lab since 2020 and earlier a
      professor at the MIT Sloan School of Management. His 1993 review of the information-technology
      [[productivity-paradox|productivity paradox]] — computers' failure to show up in productivity
      statistics — helped popularize the term, and with Daniel Rock and Chad Syverson he later
      argued that general-purpose technologies such as AI produce a productivity J-curve, depressing
      measured productivity before raising it. 'Race Against the Machine' (2011) and 'The Second
      Machine Age' (2014), both with Andrew McAfee, brought debates about [[automation|automation]]
      and [[technological-unemployment|technological unemployment]] to wide audiences, and with Tom
      Mitchell and Daniel Rock he scored occupations' suitability for machine learning, an early
      measure of [[task-exposure|task exposure]]. A field study with Danielle Li and Lindsey Raymond
      (2023) found that an AI assistant raised customer-support agents' productivity by about 14
      percent, mostly among novices. His essay on the [[turing-trap|Turing trap]] (2022) argued that
      aiming AI at imitating rather than [[augmentation|augmenting]] people concentrates wealth and
      power.
see_also:
