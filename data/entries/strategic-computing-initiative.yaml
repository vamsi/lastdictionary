plain: >-
  A billion-dollar US defense research program, run from 1983 to 1993, that tried to build machine
  intelligence for military uses such as self-driving vehicles and assistants for fighter pilots.
senses:
  - definition: >-
      A program of the US Defense Advanced Research Projects Agency (DARPA) that spent roughly a
      billion dollars between 1983 and 1993 on advanced computer architectures and machine
      intelligence. It tied research on chips, parallel computing, [[computer-vision|computer
      vision]], speech, natural-language understanding and [[expert-system|expert systems]] to three
      demonstration goals: an autonomous land vehicle, a pilot's associate for fighter aircraft, and
      battle-management support for naval carrier groups. Partly a response to Japan's
      [[fifth-generation-computer-systems-project|Fifth Generation Computer Systems project]], it
      was scaled back from 1987, when new DARPA leadership doubted that expert systems would
      deliver, and it ended in 1993. It funded lasting work on parallel machines and on
      [[autonomous-vehicle|autonomous vehicles]], including Carnegie Mellon's Navlab, but its
      broader goals went unmet, contributing to the second [[ai-winter|AI winter]].
    example: >-
      The Strategic Computing Initiative's autonomous land vehicle crept along test roads outside
      Denver in the mid-1980s.
origin: >-
  Announced by DARPA in October 1983 in the plan Strategic Computing: New-Generation Computing
  Technology; Robert Kahn was its principal architect. Its history is told in Alex Roland and Philip
  Shiman's Strategic Computing (2002).
year: 1983
