term: arXiv
id: arxiv
pos: prop. n.
also:
  - arxiv.org
  - the arXiv
pronunciation: AR-kive (like 'archive')
domain: orgs
level: core
plain: >-
  A free website where scientists post research papers before, or instead of, formal publication.
  Most new AI research appears there first.
senses:
  - definition: >-
      A free online server, run by Cornell University, on which researchers in computer science,
      mathematics, physics, statistics and neighboring fields post their own papers. Volunteer
      moderators screen submissions for subject fit and basic scholarly standards, but there is no
      peer review; each paper receives a permanent identifier such as arXiv:1706.03762 and appears
      in the daily listing of its subject category, for AI chiefly cs.LG (machine learning), cs.CL
      (computation and language), cs.CV (computer vision), cs.AI and stat.ML. Because AI moves
      faster than journal and conference cycles, arXiv became the field's de facto first channel of
      publication, and many influential documents, including technical reports for major
      [[large-language-model|language models]], exist only there. An arXiv citation therefore
      guarantees no review. In October 2025 its computer-science section stopped accepting review
      articles and position papers that had not already passed peer review, citing a flood of
      low-quality submissions.
    example: It isn't peer reviewed yet — it's just on arXiv.
origin: >-
  Started in August 1991 by physicist Paul Ginsparg at Los Alamos National Laboratory as an email
  service for high-energy-physics preprints, later reached on the web as xxx.lanl.gov. A Computing
  Research Repository section opened in 1998; the service was renamed arXiv in 1999 and moved with
  Ginsparg to Cornell University in 2001.
year: 1991
