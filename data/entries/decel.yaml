term: decel
id: decel
pos: n.
also:
  - decels
  - decelerationist
  - deceleration
domain: culture
domains:
  - society
labels:
  - slang
  - contested
level: specialist
plain: >-
  A dismissive label, used mainly by AI accelerationists, for anyone who wants AI development slowed
  down, paused or heavily regulated.
senses:
  - definition: >-
      Short for decelerationist: a person who favors slowing technological progress, especially in
      AI, through regulation, pauses or social pressure. The word is almost always applied by others
      as a pejorative, chiefly by [[effective-accelerationism|e/acc]] adherents, who aim it at a
      broad range of targets — from [[doomer|doomers]] seeking an international ban on frontier
      training to ethicists, regulators and cautious companies. Few people call themselves decels,
      and positions grouped under the label differ widely in motive (catastrophic risk, labor
      protection, copyright, environmental cost) and in what they would slow. As with doomer,
      careful usage names the policy at stake rather than the camp.
    example: Asking for an incident-reporting rule got him called a decel within minutes.
origin: >-
  Formed as the opposite of 'accelerationist' and spread in 2022–2023 through e/acc accounts on
  Twitter (now X), where it became the movement's standard term for opponents.
see_also:
  - effective accelerationism
  - doomer
  - AI pause
  - Butlerian Jihad
  - differential technological development
contrast:
  - effective accelerationism
