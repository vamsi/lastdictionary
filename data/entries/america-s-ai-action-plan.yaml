term: America's AI Action Plan
id: america-s-ai-action-plan
pos: prop. n.
also:
  - "Winning the Race: America's AI Action Plan"
  - AI Action Plan
  - US AI Action Plan
domain: gov
domains:
  - society
level: essential
plain: >-
  The Trump administration's 2025 strategy for winning a global AI race: cutting regulation,
  building data centers and power plants quickly, and exporting American AI technology to allies.
senses:
  - definition: >-
      A US federal strategy, 'Winning the Race: America's AI Action Plan', released by the White
      House on July 23, 2025. Framing AI as a race with China, it grouped upward of 90 recommended
      federal actions under three headings. 'Accelerate AI Innovation' called for removing
      regulatory barriers, weighing states' AI rules when awarding federal funds, encouraging
      [[open-weight-model|open-source and open-weight models]], building an evaluation ecosystem
      around the [[center-for-ai-standards-and-innovation|Center for AI Standards and Innovation]],
      and buying only models judged free of ideological bias. 'Build American AI Infrastructure'
      sought faster permitting for [[ai-data-center|data centers]], power plants and chip fabs, grid
      upgrades and a skilled-trades workforce. 'Lead in International AI Diplomacy and Security'
      proposed exporting full-stack American AI packages to allies, tightening enforcement of
      [[export-controls-on-ai-chips|export controls on AI chips]] (including chip location
      verification), countering Chinese influence in standards bodies and evaluating frontier models
      for national-security risks. Three executive orders signed the same day addressed 'woke AI' in
      federal procurement, data-center permitting and the promotion of AI exports.
    example: >-
      The agency cited America's AI Action Plan to justify fast-tracking the data-center permit.
origin: >-
  Ordered by Executive Order 14179 (January 23, 2025), which directed a review of Biden-era AI
  actions, and drafted by the Office of Science and Technology Policy under Michael Kratsios with
  White House AI and crypto adviser David Sacks, after a request for information that drew more than
  10,000 public comments.
year: 2025
note: >-
  Supporters praised its focus on infrastructure and adoption; critics faulted its treatment of
  safety, its pressure on states and its procurement test for ideological neutrality. It replaced
  [[executive-order-14110|Executive Order 14110]] as the reference point for US federal AI policy.
