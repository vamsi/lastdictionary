term: Sebastian Thrun
id: sebastian-thrun
sort_as: Thrun Sebastian
pos: prop. n.
domain: people
domains:
  - robot
  - society
level: specialist
dates: b. 1967
plain: >-
  A German-American roboticist who led the Stanford team that won the 2005 desert race for
  self-driving cars, started Google's self-driving car project, and founded the online-learning
  company Udacity.
senses:
  - definition: >-
      German-American computer scientist and entrepreneur, a pioneer of probabilistic robotics and
      self-driving cars. At Carnegie Mellon and then Stanford University he developed methods that
      let robots localize themselves and build maps under uncertainty using
      [[particle-filter|particle filters]] and other Bayesian estimators (see
      [[simultaneous-localization-and-mapping|simultaneous localization and mapping]]), set out in
      the textbook 'Probabilistic Robotics' (2005, with Wolfram Burgard and Dieter Fox). He led the
      Stanford team whose car Stanley won the 2005 [[darpa-grand-challenge|DARPA Grand Challenge]]
      by driving 212 kilometers of desert without human help. At Google he founded the X research
      lab and led the self-driving car project begun in 2009, the forerunner of Waymo (see
      [[autonomous-vehicle|autonomous vehicle]]). In 2011 he and [[peter-norvig|Peter Norvig]]
      taught a free online AI course to some 160,000 students, which led him to found the education
      company Udacity; he later led the flying-car company Kitty Hawk.
