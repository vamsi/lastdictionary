term: Solomonoff induction
id: solomonoff-induction
pos: n.
also:
  - Solomonoff's theory of inductive inference
  - universal induction
  - algorithmic probability
  - universal prior
  - Solomonoff prior
  - universal distribution
domain: math
domains:
  - asi
  - mind
level: specialist
plain: >-
  A mathematical recipe for ideal prediction: consider every computer program that could have
  produced the data so far, trust shorter programs more, and predict what they would output next.
senses:
  - definition: >-
      A formal theory of prediction in which the [[prior|prior]] probability of each computable
      hypothesis is proportional to two raised to the minus the length of a program implementing it
      on a universal [[turing-machine|Turing machine]] (the 'universal prior', or algorithmic
      probability), and predictions follow by [[bayesian-inference|Bayesian]] updating over all such
      programs. It combines [[occam-s-razor|Occam's razor]], since shorter programs get more weight,
      with Epicurus's principle of keeping every hypothesis consistent with the data. Solomonoff
      proved that, for data generated by any computable probability distribution, its predictions
      converge rapidly to the true conditional probabilities, with total expected error bounded by
      the generator's [[kolmogorov-complexity|Kolmogorov complexity]]. The method is uncomputable —
      it would require running every program — but serves as a theoretical gold standard for
      induction, underpins Marcus Hutter's [[aixi|AIXI]] model of a universally intelligent agent,
      and is cited in arguments that [[large-language-model|language models]] trained on
      [[next-token-prediction|next-token prediction]] approximate a form of universal sequence
      prediction.
    example: >-
      Solomonoff induction is the ideal; a pretrained transformer is at best a fast, crude
      approximation of it.
formula_latex: M(x) = \sum_{p\,:\,U(p) = x*} 2^{-|p|}
origin: >-
  Developed by Ray Solomonoff, a participant in the 1956 Dartmouth workshop, in a 1960 technical
  report and in 'A Formal Theory of Inductive Inference' (Information and Control, 1964). His
  convergence theorem appeared in 1978, and Marcus Hutter's AIXI (2000) extended the framework from
  prediction to action.
year: 1960
