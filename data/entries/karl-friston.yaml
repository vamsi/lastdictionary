level: specialist
dates: b. 1959
plain: >-
  A British neuroscientist who proposed that brains, and perhaps all living systems, work by
  constantly predicting their surroundings and acting to reduce surprise, an idea some see as a
  blueprint for AI.
senses:
  - definition: >-
      British neuroscientist at University College London who proposed the
      [[free-energy-principle|free energy principle]] and the account of perception and action built
      on it, [[active-inference|active inference]]. He first made his name in brain imaging:
      statistical parametric mapping (SPM), which he developed from the early 1990s, became the
      standard method for analyzing functional brain scans, followed by voxel-based morphometry and
      dynamic causal modeling. From the mid-2000s he proposed that any self-organizing system that
      persists, a brain included, must minimize variational free energy, an information-theoretic
      bound on surprise; perception, learning and action then become forms of approximate
      [[bayesian-inference|Bayesian inference]], with action chosen to bring about predicted
      sensations. The framework underlies much [[predictive-processing|predictive processing]]
      research and has been offered as a blueprint for agents that learn [[world-model|world
      models]] and explore to reduce uncertainty, though critics question whether it is testable. In
      2022 he became chief scientist of the AI company VERSES; he is among the most highly cited
      neuroscientists.
