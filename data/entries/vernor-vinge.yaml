level: core
dates: 1944–2024
plain: >-
  An American science-fiction author and mathematics professor who popularized the 'technological
  singularity': a coming point when smarter-than-human minds change the world so fast that no one
  can foresee what follows.
senses:
  - definition: >-
      American science-fiction writer, and for many years a teacher of mathematics and computer
      science at San Diego State University, who gave the [[technological-singularity|technological
      singularity]] its modern meaning. Extending [[i-j-good|I. J. Good]]'s
      [[intelligence-explosion|intelligence explosion]], he wrote in a 1983 Omni magazine article,
      and argued at length in 'The Coming Technological Singularity', an essay presented at a NASA
      symposium in 1993, that once [[superintelligence|superhuman intelligence]] existed — whether
      reached through AI, computer networks, human–computer interfaces or biological enhancement —
      events would outrun human understanding, closing the era in which humans steer history and
      leaving the world beyond that point impossible to foresee; he put the date between 2005 and
      2030. His novella 'True Names' (1981) was an early depiction of cyberspace, and three of his
      novels won the Hugo Award, beginning with 'A Fire Upon the Deep' (1992). His essay shaped the
      views of later singularity writers, including [[ray-kurzweil|Ray Kurzweil]] and
      [[eliezer-yudkowsky|Eliezer Yudkowsky]].
