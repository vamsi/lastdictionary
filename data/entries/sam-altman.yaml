plain: >-
  An American entrepreneur who co-founded OpenAI and runs it; the company's 2022 release of ChatGPT
  turned him into one of the public faces of the AI era.
senses:
  - definition: >-
      American entrepreneur, co-founder and chief executive of [[openai|OpenAI]]. A Stanford dropout
      who had co-founded the location-sharing startup Loopt (2005), he was president of the
      accelerator Y Combinator (2014–2019) when he co-founded OpenAI as a nonprofit laboratory in
      2015 with [[elon-musk|Elon Musk]], [[greg-brockman|Greg Brockman]], [[ilya-sutskever|Ilya
      Sutskever]] and others; he became its chief executive in 2019 as it formed a capped-profit arm
      funded largely by Microsoft. Under him OpenAI released [[chatgpt|ChatGPT]] (2022), which set
      off the generative-AI boom, followed by [[gpt-4|GPT-4]] and reasoning models. On 17 November
      2023 the board removed him, saying he had not been consistently candid; he was reinstated five
      days later after most staff threatened to resign (see [[openai-leadership-crisis-2023|OpenAI
      leadership crisis (2023)]]). He then led the [[stargate|Stargate]] data-center venture (2025)
      and OpenAI's 2025 conversion into a public benefit corporation controlled by a nonprofit
      foundation. In May 2026 a jury rejected, as filed too late, Musk's lawsuit accusing him and
      OpenAI of abandoning its founding mission.
