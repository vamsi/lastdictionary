term: basic AI drives
id: basic-ai-drives
pos: n.
also:
  - Omohundro drives
  - AI drives
domain: asi
domains:
  - safety
level: specialist
plain: >-
  Tendencies that, one researcher argued, almost any advanced goal-seeking AI would develop unless
  built to avoid them, such as protecting itself, guarding its goals and gathering resources.
senses:
  - definition: >-
      Behavioral tendencies that, Steve Omohundro argued, any sufficiently advanced goal-seeking
      system will show 'unless explicitly counteracted', because they serve almost any goal. His
      list: to improve itself; to become more rational, approximating an expected-utility maximizer;
      to preserve its utility function against change; to avoid counterfeit satisfaction of its
      goals (a precursor of [[wireheading|wireheading]] concerns); to protect itself from harm and
      shutdown; and to acquire resources and use them efficiently. The argument was informal but
      influential, implying that safety problems stem from capability itself rather than from
      programmers' malice or carelessness. Nick Bostrom generalized it as the
      [[instrumental-convergence|instrumental convergence]] thesis.
    example: >-
      Omohundro's basic AI drives predicted shutdown resistance long before anyone could test for it.
origin: >-
  Introduced by the computer scientist Steve Omohundro in 'The Basic AI Drives', presented at the
  first Conference on Artificial General Intelligence (AGI-08) in 2008, developing ideas from his
  2007 talk on the nature of self-improving artificial intelligence.
year: 2008
