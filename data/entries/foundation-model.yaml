standards: >-
  EU AI Act (Reg. (EU) 2024/1689), Art. 3(63) ('general-purpose AI model', the closest EU
  counterpart); US Executive Order 14110 (2023; revoked January 2025), §3(k) ('dual-use foundation
  model')
as_of: 2026-10
