term: panpsychism
id: panpsychism
pos: n.
also:
  - panpsychist
  - panprotopsychism
  - cosmopsychism
  - Russellian monism
pronunciation: pan-SY-kiz-um
domain: mind
labels:
  - contested
level: specialist
plain: >-
  The idea that some simple form of experience is a basic feature of all matter, so that minds like
  ours are built out of tiny glimmers of mind found everywhere.
senses:
  - definition: >-
      The view that the most basic constituents of nature already have some mental aspect, usually a
      rudimentary form of experience, so that the consciousness of humans and animals is built up or
      derived from mind present throughout matter. Contemporary versions, motivated chiefly by the
      [[hard-problem-of-consciousness|hard problem of consciousness]], hold that physics describes
      only the structure and dispositions of matter and that experience may be its intrinsic nature
      (Russellian monism). The central difficulty is the combination problem: how micro-level
      experiences could combine into a unified subject like a person. Panpsychism does not by itself
      imply that computers are conscious, since a system as a whole may need the right kind of unity
      to be a subject; [[integrated-information-theory|integrated information theory]] is often
      called panpsychist-leaning because it attributes some consciousness to many simple physical
      systems.
origin: >-
  From Greek pan, 'all', and psyche, 'soul, mind'. The term is traced to the Renaissance philosopher
  Francesco Patrizi, whose Nova de universis philosophia (1591) includes a part titled 'Pampsychia';
  the idea is often traced to Thales, who held that all things are full of gods, and Spinoza and
  Leibniz held related views. Galen Strawson (2006), Philip Goff and others revived it in analytic
  philosophy.
year: 1591
see_also:
  - hard problem of consciousness
  - integrated information theory
  - consciousness
  - biological naturalism
  - mind–body problem
contrast:
  - illusionism
sources:
  - text: >-
      Strawson, G. (2006). Realistic Monism: Why Physicalism Entails Panpsychism. Journal of
      Consciousness Studies 13(10–11), 3–31.
  - text: >-
      Goff, P. (2019). Galileo's Error: Foundations for a New Science of Consciousness. Pantheon.
