level: essential
plain: >-
  A giant venture announced in 2025 by OpenAI, SoftBank and Oracle to build data centers in the
  United States for training and running AI, with a pledged $500 billion.
senses:
  - definition: >-
      A joint venture, unveiled at the White House on January 21, 2025, through which OpenAI,
      SoftBank, Oracle and the Emirati investment firm MGX pledged up to $500 billion over four
      years, $100 billion of it at once, for computing infrastructure to serve OpenAI. SoftBank
      handles the financing and OpenAI runs operations, and Arm, Microsoft, Nvidia and Oracle are
      its technology partners. The flagship campus in Abilene, Texas, developed by Crusoe and leased
      to Oracle, began operating in 2025; further US sites announced from September 2025 in Texas,
      New Mexico, Ohio, Michigan and Wisconsin brought planned capacity to more than 8 gigawatts by
      the end of that year. Under the 'OpenAI for Countries' banner the name was extended to
      projects abroad, beginning with a planned 1-gigawatt cluster in Abu Dhabi (Stargate UAE) and
      sites in Norway and the United Kingdom. Skeptics questioned the financing, which leans on
      debt, leasing and [[circular-deal|circular deals]] among chipmakers, cloud providers and AI
      labs, as well as power supply and local opposition to some sites.
    example: >-
      Most of Stargate's announced gigawatts were still construction sites when the new model
      shipped.
origin: >-
  The name was first reported in March 2024 for a planned Microsoft–OpenAI supercomputer; it was
  given to the new venture announced by President Donald Trump, Sam Altman, Masayoshi Son and Larry
  Ellison on January 21, 2025, the day after Trump's inauguration. It echoes the 1994
  science-fiction film and later television series.
year: 2025
note: >-
  Often used loosely for all of OpenAI's data-center capacity, including sites owned by partners
  rather than the joint venture. Announced gigawatts are planned capacity; the share actually
  operating has lagged well behind, with the 1.2-gigawatt Abilene campus still being built out in
  2026.
