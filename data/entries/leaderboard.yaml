  - benchmark saturation
  - benchmaxxing
  - Kaggle
  - Elo rating
sources:
  - text: Singh, S., Nan, Y. et al. (2025). The Leaderboard Illusion. arXiv:2504.20879.
    url: https://arxiv.org/abs/2504.20879
