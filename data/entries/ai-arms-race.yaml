term: AI arms race
id: ai-arms-race
pos: n.
also:
  - AI race
  - AGI race
  - race to AGI
  - race dynamics
domain: asi
domains:
  - gov
  - society
labels:
  - contested
level: essential
plain: >-
  A competition among countries or companies to build the most powerful AI first, in which fear of
  falling behind pushes everyone to move faster and cut corners on safety.
senses:
  - definition: >-
      Competition among states or companies to develop more capable AI faster than rivals,
      especially when the perceived stakes, such as military or economic dominance or a
      [[decisive-strategic-advantage|decisive strategic advantage]], create pressure to put speed
      ahead of safety. Game-theoretic models show how racing erodes precautions: each participant
      fears that slowing down only hands the lead to a less careful rival. The term covers two
      overlapping arenas: geopolitical competition, above all between the United States and China,
      involving [[export-controls-on-ai-chips|export controls on AI chips]], national compute
      programs and calls for a Manhattan Project for AGI; and commercial competition among
      [[frontier-lab|frontier laboratories]] over model releases, talent and investment. Proposed
      remedies include safety commitments binding all competitors, verification of compute use,
      international agreements and deterrence schemes such as [[mutual-assured-ai-malfunction|Mutual
      Assured AI Malfunction]]. Critics of the framing argue that it is partly self-fulfilling, that
      AI is not a single winner-take-all prize, and that race rhetoric is used to justify
      deregulation.
    example: >-
      Every lab says it would slow down if the others did; that is what makes it an arms race.
origin: >-
  Applied to AI by the 2010s, in debates over autonomous weapons and in Stuart Armstrong, Nick
  Bostrom and Carl Shulman's 2016 model 'Racing to the Precipice'. It went mainstream after Vladimir
  Putin said in 2017 that whoever leads in AI 'will become the ruler of the world'; in 2024 a US
  congressional commission recommended a Manhattan Project-like program to race to AGI.
see_also:
