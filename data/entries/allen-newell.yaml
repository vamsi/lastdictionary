  - sym
  - mind
level: core
dates: 1927–1992
plain: >-
  An American computer scientist who, with Herbert Simon, wrote early AI programs that solved
  problems the way people do, and who sought a single theory of how the mind works.
senses:
  - definition: >-
      American computer scientist who treated programs as theories of how people think, working
      first at the RAND Corporation and then, for most of his career, at Carnegie Mellon University.
      With [[herbert-a-simon|Herbert A. Simon]] and the programmer Cliff Shaw he created the
      Information Processing Language (IPL), the first list-processing language, and used it to
      write the [[logic-theorist|Logic Theorist]] (1956), often called the first AI program, and the
      [[general-problem-solver|General Problem Solver]] (1957). The book 'Human Problem Solving'
      (1972, with Simon) modeled thought with [[production-system|production systems]], and their
      joint Turing Award lecture (1976) stated the [[physical-symbol-system-hypothesis|physical
      symbol system hypothesis]]. From the early 1980s he developed the Soar
      [[cognitive-architecture|cognitive architecture]] with John Laird and Paul Rosenbloom, and in
      'Unified Theories of Cognition' (1990) he argued that psychology needed a single computational
      theory of the mind. He was the first president of the American Association for Artificial
      Intelligence, now the [[association-for-the-advancement-of-artificial-intelligence|Association
      for the Advancement of Artificial Intelligence]]. [[turing-award|Turing Award]] 1975 (with
      Simon); US National Medal of Science 1992.
