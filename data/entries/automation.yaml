term: automation
id: automation
pos: n.
also:
  - automate
  - automated
  - AI automation
  - task automation
domain: society
domains:
  - core
  - hist
level: essential
plain: >-
  Using machines or software to do work that people would otherwise do, from factory robots to
  programs that sort email or write reports.
senses:
  - context: Work and economics
    definition: >-
      The substitution of machines, software or AI systems for human labor in carrying out tasks, so
      that a task is done with less or no human involvement. Economists analyze automation task by
      task rather than job by job: a technology automates some tasks within an occupation and
      changes what the remaining human work consists of, and its effects on employment and wages
      depend on how much cheaper and better the work becomes, whether demand expands, and whether
      new tasks appear. AI extends automation from routine, rule-based tasks, the target of earlier
      computerization, to non-routine cognitive work such as writing, coding, analysis and customer
      service and, through [[ai-agent|agents]], to whole multi-step workflows. Its counterpart is
      [[augmentation|augmentation]], in which technology raises a person's productivity without
      replacing them.
    example: >-
      We automated invoice matching entirely but kept a person on the exceptions queue.
  - context: Engineering
    definition: >-
      More generally, the engineering of self-regulating machines and processes, in which feedback
      devices, from the centrifugal governor and the programmable logic controller to software and
      AI, take over the operating decisions a human attendant would otherwise make; the degree of
      automation is often graded on a scale from manual control to full autonomy.
origin: >-
  The word is usually credited to Delmar S. Harder, a Ford Motor Company executive, who is said to
  have used it around 1946–1947 for the automatic handling of parts between machines; it was rare
  before Ford set up an automation department in 1947, and John Diebold's book Automation (1952)
  generalized and popularized the term. The idea of self-operating machinery is far older.
year: 1947
note: >-
  Automation is often contrasted with augmentation, but the line blurs: the same tool can augment
  each worker while letting a firm employ fewer of them. Erik Brynjolfsson's [[turing-trap|Turing
  trap]] argument holds that current incentives favor automation.
see_also:
  - augmentation
