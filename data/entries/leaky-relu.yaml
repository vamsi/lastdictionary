term: leaky ReLU
id: leaky-relu
pos: n.
also:
  - LReLU
  - leaky rectified linear unit
  - parametric ReLU
  - PReLU
domain: dl
level: specialist
plain: >-
  A variant of the common ReLU rule that lets a small fraction of each negative value through
  instead of zeroing it, so neurons never go completely silent.
senses:
  - definition: >-
      A variant of [[relu|ReLU]] that gives negative inputs a small nonzero slope α: f(x) = x for x
      > 0 and αx otherwise, with α typically 0.01 and sometimes 0.1–0.3. Because the gradient is
      never exactly zero, units cannot become permanently inactive ([[dying-relu|dying ReLU]]). In
      the parametric ReLU (PReLU), α is learned during training, per layer or per channel. Leaky
      ReLU is common in [[generative-adversarial-network|GAN]] discriminators and some detection
      networks. Related fixes for the negative side include the exponential linear unit (ELU), which
      saturates smoothly towards −α and pushes mean activations towards zero, and its
      self-normalizing scaled version, SELU.
    example: >-
      The discriminator uses leaky ReLU with a slope of 0.2 so that gradients still reach the
      generator.
formula_latex: \operatorname{LeakyReLU}(x) = \begin{cases} x & x > 0 \\ \alpha x & x \le 0 \end{cases}
origin: >-
  Introduced by Andrew Maas, Awni Hannun and Andrew Ng in 'Rectifier Nonlinearities Improve Neural
  Network Acoustic Models', presented at an ICML 2013 workshop. Kaiming He and colleagues made the
  slope learnable (PReLU) in February 2015, reporting 4.94% top-5 ImageNet error, the first result
  below a reported human error of 5.1%. ELU followed from Djork-Arné Clevert and colleagues in
  November 2015.
year: 2013
see_also:
  - ReLU
  - dying ReLU
  - activation function
  - GELU
  - generative adversarial network
sources:
