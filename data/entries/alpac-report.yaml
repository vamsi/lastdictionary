level: specialist
plain: >-
  A 1966 US government report that concluded machine translation was slower, worse and costlier than
  human translators. It ended most American funding for the field for many years.
senses:
  - definition: >-
      'Language and Machines: Computers in Translation and Linguistics' (1966), the report of the
      Automatic Language Processing Advisory Committee, formed in 1964 under the US National Academy
      of Sciences at the request of government agencies that had funded
      [[machine-translation|machine translation]]. Comparing machine output from Russian with human
      translation, the committee found machine translation slower, less accurate and about twice as
      expensive, saw no near prospect of useful general-purpose systems, and judged the supply of
      human translators adequate. It recommended redirecting money to basic research in
      computational linguistics and to practical aids for human translators. US funding for machine
      translation collapsed, the center of the field moved to Europe, Canada and Japan, and the
      report is often cited as an early trigger of the first [[ai-winter|AI winter]].
    example: >-
      Statistical translation researchers of the 1990s liked to point out what the ALPAC report had
      got right and what it had got wrong.
origin: >-
  The committee, chaired by John R. Pierce of Bell Telephone Laboratories, reported in November
  1966, after a decade of optimism launched by the [[georgetown-ibm-experiment|Georgetown–IBM
  experiment]] of 1954, whose organizers had predicted practical machine translation within a few
  years.
year: 1966
