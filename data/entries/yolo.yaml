pronunciation: YOH-loh
domain: percep
domains:
  - infer
  - hist
level: core
plain: >-
  A family of fast object-detection models that look at an image once and immediately output boxes
  and labels for everything they recognize, quick enough for live video.
senses:
  - definition: >-
      A family of one-stage, real-time [[object-detection|object detectors]] descended from 'You
      Only Look Once'. Region-based detectors such as [[r-cnn|R-CNN]] classified some 2,000
      candidate regions and needed seconds per image; the original YOLO instead made every
      prediction in one forward pass of a single [[convolutional-neural-network|convolutional neural
      network]], reaching 45 frames per second at some cost in localization accuracy. It split the
      image into a 7 × 7 grid, and each cell output two [[bounding-box|bounding boxes]] with
      confidence scores and one set of class probabilities; the whole network was trained end to
      end. Successors added [[anchor-box|anchor boxes]] (YOLOv2) and multi-scale prediction
      (YOLOv3), then anchor-free heads, separate classification and regression branches and heavy
      [[data-augmentation|data augmentation]]; recent releases also handle
      [[instance-segmentation|instance segmentation]], [[pose-estimation|pose estimation]] and
      rotated boxes. YOLOv10 (2024) dropped [[non-maximum-suppression|non-maximum suppression]] to
      simplify deployment, and Ultralytics YOLO26 (released January 2026) offers an optional
      NMS-free prediction head. YOLO models are a default choice for detection on edge devices,
      drones, robots and video analytics.
    example: >-
      We fine-tuned a small YOLO model on 3,000 labeled shelf photos and it runs at 60 fps on the
      store's camera box.
origin: >-
  Introduced by Joseph Redmon, Santosh Divvala, Ross Girshick and Ali Farhadi (University of
  Washington, Allen Institute for AI, Facebook AI Research) in a June 2015 arXiv paper presented at
  CVPR 2016; the name puns on the slogan 'you only live once'. Redmon released YOLOv2 and YOLOv3,
  then left vision research in 2020 citing military and privacy uses; later versions came from other
  groups, notably the company Ultralytics.
year: 2015
note: >-
  Version numbers are not one lineage: YOLOv4, v6, v7, v9, v10 and v12 come from different academic
  and industrial teams, and 'YOLO' now names a design style as much as a model. As of October 2026,
  Ultralytics had unveiled YOLO27 (September 2026) but not yet released it. Not to be confused with
  a [[yolo-run|YOLO run]].
