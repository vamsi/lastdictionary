plain: >-
  The research division of the computer company IBM, behind landmark AI systems such as the chess
  champion Deep Blue and the quiz-show winner Watson.
senses:
  - definition: >-
      IBM's corporate research arm, run from its Thomas J. Watson Research Center north of New York
      City and from laboratories on several continents. IBM work runs through the history of AI:
      Arthur Samuel's self-improving checkers program, described in his 1959 paper that popularized
      the phrase 'machine learning'; Nathaniel Rochester's co-organization of the
      [[dartmouth-workshop|Dartmouth workshop]] (1956); the statistical approach to speech
      recognition and [[machine-translation|machine translation]] developed by Frederick Jelinek's
      group, whose 'IBM models' (early 1990s) founded statistical translation; [[deep-blue|Deep
      Blue]], which defeated world chess champion Garry Kasparov in 1997; and [[ibm-watson|IBM
      Watson]], which won the quiz show Jeopardy! in 2011 but struggled as a commercial health-care
      product. Its Granite family of language models for business use, introduced in 2023, has been
      released as [[open-weight-model|open weights]] since 2024.
origin: >-
  IBM's formal research division dates from 1945, when it opened the Watson Scientific Computing
  Laboratory at Columbia University; the Thomas J. Watson Research Center opened in 1961. IBM itself
  was formed in 1911 as the Computing-Tabulating-Recording Company and renamed International
  Business Machines in 1924.
year: 1945
