      Buçinca, Z., Malaya, M. B. & Gajos, K. Z. (2021). To Trust or to Think: Cognitive Forcing
      Functions Can Reduce Overreliance on AI in AI-assisted Decision-making. Proc. ACM on
      Human-Computer Interaction 5 (CSCW1).
  - text: >-
      Passi, S. & Vorvoreanu, M. (2022). Overreliance on AI: Literature Review. Microsoft Research.
