plain: >-
  A newer kind of cloud company that mainly rents out powerful AI chips, rather than the full range
  of computing services that giants like Amazon or Microsoft sell.
senses:
  - definition: >-
      A cloud provider specializing in renting [[gpu|GPU]] capacity for AI training and inference —
      typically bare-metal or lightly managed clusters of the latest accelerators joined by
      high-speed [[interconnect|interconnects]] — rather than the broad service catalogs of the
      established hyperscale clouds. Examples include CoreWeave, Nebius, Lambda and Nscale.
      Neoclouds grew rapidly from 2023 on long-term capacity contracts with AI laboratories and
      large technology companies, which use them to add compute quickly and keep financial risk off
      their own balance sheets. Many finance chip purchases with debt secured on the chips
      themselves — by late 2025 CoreWeave alone had arranged more than US$12 billion of such
      GPU-backed loans — raising concerns about concentration, rapid chip obsolescence and exposure
      if AI demand falters.
    example: >-
      We couldn't get H100s from our usual cloud, so we signed a one-year reservation with a
      neocloud.
origin: >-
  In use among industry analysts by 2024 — the research firm SemiAnalysis published an 'AI Neocloud
  Playbook and Anatomy' that October — and common in financial journalism from 2025, as CoreWeave
  went public in March 2025 and signed multibillion-dollar contracts with OpenAI and Meta.
year: 2024
