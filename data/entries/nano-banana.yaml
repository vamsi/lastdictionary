plain: >-
  The nickname, later Google's official branding, for its Gemini image models, a viral hit in 2025
  for editing photos from simple instructions while keeping people looking like themselves.
senses:
  - definition: >-
      The popular name for Google DeepMind's image generation and editing models built into its
      Gemini [[multimodal-large-language-model|multimodal models]]: Gemini 2.5 Flash Image (August
      2025), Gemini 3 Pro Image, branded Nano Banana Pro (November 2025), and Gemini 3.1 Flash
      Image, branded Nano Banana 2 (February 2026); as of October 2026 the newest was Nano Banana
      2.1. Unlike stand-alone [[text-to-image-model|text-to-image models]], they create and edit
      images within a conversation, drawing on the language model's world knowledge, and are noted
      for [[instruction-based-image-editing|instruction-based image editing]] that keeps a person's
      or object's identity consistent across edits, for blending several reference images and, in
      later versions, for legible text. Outputs carry [[synthid|SynthID]] watermarks. Within weeks
      of launch, Google reported more than 10 million new Gemini app users and over 200 million
      image edits, helped by a viral trend of turning selfies into photorealistic toy-figurine
      images. In August 2026 Google retired its [[imagen|Imagen]] models from the Gemini API in
      favor of these models.
    example: >-
      Nano Banana swapped the jacket and the background but kept her face exactly the same.
origin: >-
  'Nano Banana' was the codename under which the first model was tested anonymously on the LMArena
  leaderboard from 12 August 2025. Google confirmed its identity at public release on 26 August 2025
  and then adopted the nickname as branding; it reportedly derives from nicknames of Google DeepMind
  product manager Naina Raisinghani.
year: 2025
