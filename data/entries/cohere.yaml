plain: >-
  A Canadian AI company, founded in Toronto in 2019, that builds language models and search tools
  for businesses and governments rather than consumer chatbots.
senses:
  - definition: >-
      A Canadian AI company that develops [[large-language-model|large language models]] and related
      tools for business and government customers, emphasizing private deployment, data security and
      multilingual use rather than consumer chatbots. Its products include the Command generation
      models, Embed models that produce [[text-embedding|text embeddings]] and Rerank models for
      search and [[retrieval-augmented-generation|retrieval-augmented generation]], and the North
      workspace platform for [[ai-agent|agents]]. Its nonprofit research lab, Cohere Labs (founded
      as Cohere For AI in 2022), leads Aya, an open, volunteer-driven project building models and
      datasets for more than 100 languages. Cohere presents itself as a [[sovereign-ai|sovereign
      AI]] supplier for Canada and allied countries; in September 2026 it signed an agreement to
      merge with the German AI company Aleph Alpha.
origin: >-
  Founded in 2019 in Toronto by Aidan Gomez, a co-author of [[attention-is-all-you-need|Attention Is
  All You Need]], with Ivan Zhang and Nick Frosst; Gomez is chief executive. Joelle Pineau, formerly
  head of Meta's FAIR lab, joined as chief AI officer in 2025.
year: 2019
