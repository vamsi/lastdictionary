plain: >-
  A yearly academic conference on the fairness, accountability and transparency of computer systems,
  where much influential research on AI bias and ethics has been published.
senses:
  - definition: >-
      The ACM Conference on Fairness, Accountability, and Transparency, the main venue for research
      on how algorithmic systems affect people and institutions, whose authors mix computer science
      with law, philosophy and the social sciences. Its proceedings include [[gender-shades|Gender
      Shades]] (2018), [[model-card|model cards]] (2019) and 'On the Dangers of Stochastic Parrots'
      (2021), the paper behind the phrase [[stochastic-parrot|stochastic parrot]], whose internal
      review at Google preceded the departures of its co-authors Timnit Gebru and Margaret Mitchell
      from the company. Topics range from [[algorithmic-fairness|algorithmic fairness]] metrics and
      audits to labor, surveillance and the political economy of AI. A sister conference, AIES (AI,
      Ethics, and Society), is run by AAAI and the ACM.
origin: >-
  Grew out of the FAT/ML workshops held alongside machine learning conferences from 2014; the first
  stand-alone conference, FAT* 2018, met in New York, and it took the name ACM FAccT in 2020.
year: 2018
