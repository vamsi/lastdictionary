term: artificial superintelligence
id: artificial-superintelligence
pos: n.
also:
  - ASI
  - machine superintelligence
  - superintelligent AI
domain: asi
domains:
  - safety
  - society
level: core
plain: >-
  Superintelligence in machine form: AI that would outthink the best humans at nearly every
  intellectual task. Often shortened to ASI and pictured as the stage after human-level AI.
senses:
  - definition: >-
      A [[superintelligence|superintelligence]] realized in an artificial system, as distinct from
      enhanced humans or human organizations. The abbreviation ASI belongs to a three-step ladder of
      narrow AI (ANI), [[artificial-general-intelligence|artificial general intelligence]] (AGI) and
      ASI, in which ASI means AI that surpasses the best humans in essentially every cognitive
      domain, often by a wide margin. Many who use the ladder expect the AGI-to-ASI step to be
      short, because AGI could automate AI research and trigger an
      [[intelligence-explosion|intelligence explosion]]; others expect a long period of uneven,
      partly superhuman systems. Since 2024 the term has moved from futurist writing into corporate
      strategy, with several companies naming superintelligence as a product goal (Meta's
      [[personal-superintelligence|personal superintelligence]] and Microsoft's
      [[humanist-superintelligence|humanist superintelligence]], for example) and prominent
      investors forecasting ASI within a decade. No test for having reached ASI is agreed, and
      critics regard some of this usage as marketing.
    example: The founders say they will ship nothing until they have safe ASI.
origin: >-
  The abbreviation was in use by the early 2010s, for example in James Barrat's book Our Final
  Invention (2013), and spread through Tim Urban's 2015 Wait But Why essays, which popularized the
  ANI–AGI–ASI ladder. Corporate use grew after Ilya Sutskever, Daniel Gross and Daniel Levy founded
  Safe Superintelligence Inc. in June 2024, followed by Meta Superintelligence Labs in 2025.
note: >-
  In practice 'superintelligence' and 'ASI' are interchangeable; ASI is more common in business and
  policy writing, superintelligence in philosophy and safety research.
