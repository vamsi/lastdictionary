# yaml-language-server: $schema=../schema/entry.schema.json

term: techno-solutionism
id: techno-solutionism
pos: n.
also:
  - technological solutionism
  - solutionism
  - technosolutionism
  - tech solutionism
domain: society
domains:
  - culture
level: core
plain: >-
  The belief that technology, such as a clever app or algorithm, can fix complicated social problems
  on its own, overlooking their political, economic and human causes.
senses:
  - definition: >-
      The habit of treating tangled social, political or institutional problems as engineering
      puzzles that the right device, app or model can solve, and of reaching for technological fixes
      before other responses. Critics argue that it misdiagnoses problems whose causes lie in power,
      resources, values or conflicting interests; redefines goals to fit what can be measured or
      optimized; ignores side effects and the people a design leaves out; and can entrench the
      status quo while appearing to change it. In AI debates the charge is leveled at proposals to
      address poverty, education, health care, policing or misinformation mainly with predictive
      models or chatbots, and at some [[ai-for-good|AI for good]] projects. Defenders reply that the
      critique can harden into reflexive rejection of tools that do help, and that technical and
      political responses are complements rather than rivals.
    example: >-
      Buying a dropout-prediction model while cutting school counselors is techno-solutionism, not a
      strategy.
origin: >-
  'Solutionism' in this sense was popularized by writer Evgeny Morozov in To Save Everything, Click
  Here: The Folly of Technological Solutionism (2013), who borrowed the word from architecture and
  urban planning; the critique echoes older debates over the 'technological fix' associated with
  physicist Alvin Weinberg in the 1960s.
year: 2013
see_also:
  - AI for good
  - AI hype
  - ethics washing
  - value-sensitive design
  - Goodhart's law
sources:
  - text: >-
      Morozov, E. (2013). To Save Everything, Click Here: The Folly of Technological Solutionism.
      PublicAffairs.
