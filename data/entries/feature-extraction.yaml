      Donahue, J. et al. (2014). DeCAF: A Deep Convolutional Activation Feature for Generic Visual
      Recognition. ICML 2014.
  - text: >-
      Sharif Razavian, A., Azizpour, H., Sullivan, J. & Carlsson, S. (2014). CNN Features
      off-the-shelf: An Astounding Baseline for Recognition. CVPR Workshops 2014.
