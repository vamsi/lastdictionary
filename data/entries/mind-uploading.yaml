term: mind uploading
id: mind-uploading
pos: n.
also:
  - uploading
  - upload
  - mind transfer
  - brain uploading
  - digital immortality
domain: asi
domains:
  - mind
  - culture
labels:
  - contested
level: specialist
plain: >-
  The idea of moving a person's mind out of their biological brain and into a computer, so that they
  could go on living as software.
senses:
  - definition: >-
      The hypothetical transfer or copying of an individual's mind, including memories, personality
      and, on some views, consciousness, from a biological brain to a computational substrate,
      usually by [[whole-brain-emulation|whole brain emulation]]. Proposed methods differ:
      destructive scan-and-copy, in which a preserved brain is sectioned and imaged; and gradual
      replacement, as in Hans Moravec's scenario of a robot surgeon that scans the brain layer by
      layer, substituting a simulation for each part while the person stays conscious. Uploading
      raises philosophical questions that engineering cannot settle: whether a simulation would be
      conscious at all ([[substrate-independence|substrate independence]]), whether the upload would
      be the same person or a copy, especially if several copies run at once, and what rights such
      [[digital-mind|digital minds]] would have. It is a central aspiration of
      [[transhumanism|transhumanism]]; in AI-safety discussions uploads appear both as a possible
      route to superintelligence and as a way for humans to keep pace with AI.
    example: >-
      If the scan destroys the brain, is mind uploading survival or a very expensive way to die?
origin: >-
  Science fiction explored the idea from the mid-20th century. The biogerontologist George M. Martin
  proposed it in 1971 as an interim route to immortality; Hans Moravec described a surgical
  procedure in 1979 and again in Mind Children (1988), which called it transmigration. Earliest use
  of 'uploading' in this sense not established; the word was current among transhumanists by the
  early 1990s, and Joe Strout's Mind Uploading Home Page dates from 1993.
