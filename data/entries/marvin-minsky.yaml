plain: >-
  An American AI pioneer who helped launch the field and MIT's AI laboratory, co-wrote a famous
  critique of early neural networks, and pictured the mind as a society of many simple parts.
senses:
  - definition: >-
      American cognitive scientist and a founder of AI. In 1951, with Dean Edmonds, he built SNARC,
      one of the first learning machines made from simulated neurons, and his 1954 Princeton
      doctorate studied neural networks. He co-wrote the proposal for the 1956
      [[dartmouth-workshop|Dartmouth workshop]], co-founded the MIT AI Project with
      [[john-mccarthy|John McCarthy]] and led what became the MIT AI Laboratory. His survey 'Steps
      Toward Artificial Intelligence' (1961) set out the field's early agenda.
      '[[perceptrons-book|Perceptrons]]' (1969), written with Seymour Papert, proved limits of
      single-layer [[perceptron|perceptrons]] and is often blamed for diverting funding from
      neural-network research. He introduced [[frame|frames]] for
      [[knowledge-representation|knowledge representation]] (1974) and argued in 'The Society of
      Mind' (1986) that intelligence emerges from the interaction of many simple, mindless
      processes. [[turing-award|Turing Award]] 1969; Japan Prize 1990.
