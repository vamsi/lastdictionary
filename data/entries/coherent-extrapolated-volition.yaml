# yaml-language-server: $schema=../schema/entry.schema.json

term: coherent extrapolated volition
id: coherent-extrapolated-volition
pos: n.
also:
  - CEV
  - extrapolated volition
domain: asi
domains:
  - safety
  - mind
level: specialist
plain: >-
  A proposal that a superintelligent AI should serve not what people want today but what humanity
  would agree on wanting after far more knowledge and reflection.
senses:
  - definition: >-
      A proposed target for the values of a [[superintelligence|superintelligence]]: rather than
      obeying current human commands or a fixed moral code, the AI would act on what humanity's
      wishes would converge to under idealized reflection. In Eliezer Yudkowsky's formulation it
      would extrapolate what we would want 'if we knew more, thought faster, were more the people we
      wished we were', and act only where those extrapolated wishes cohere rather than conflict. CEV
      is the best-known example of what [[nick-bostrom|Nick Bostrom]] calls indirect normativity:
      specifying a process for discovering values instead of the values themselves, on the grounds
      that humans cannot write down a correct value system and that the AI's greater intelligence
      could be used to work it out. Objections include that the extrapolation is undefined in
      practice, that people's values may not converge, that deciding whose volition counts is itself
      political, and that the procedure could not be tested before use.
    example: >-
      CEV dodges the question of which values to program by delegating it to an idealized version of
      us.
origin: >-
  Introduced by Eliezer Yudkowsky in the 2004 Singularity Institute paper 'Coherent Extrapolated
  Volition', as a successor to his earlier [[friendly-ai|friendly AI]] proposals, and discussed by
  Nick Bostrom in Superintelligence (2014). Yudkowsky later described the document as outdated,
  though the idea remains a reference point.
year: 2004
see_also:
  - friendly AI
  - motivation selection
  - value alignment
  - value lock-in
  - Eliezer Yudkowsky
  - AI alignment
sources:
  - text: >-
      Yudkowsky, E. (2004). Coherent Extrapolated Volition. Singularity Institute for Artificial
      Intelligence.
