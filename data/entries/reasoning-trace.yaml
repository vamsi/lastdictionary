term: reasoning trace
id: reasoning-trace
pos: n.
also:
  - thinking trace
  - reasoning tokens
  - thinking tokens
  - thoughts
  - reasoning chain
domain: llm
domains:
  - safety
  - train
labels:
  - emerging
level: core
plain: >-
  The written-out 'thinking' an AI reasoning model produces before its final answer — notes to
  itself full of attempts, checks and corrections, which users may or may not get to see.
senses:
  - definition: >-
      The sequence of [[token|tokens]] a [[reasoning-model|reasoning model]] generates between
      receiving a prompt and starting its final answer, typically delimited by
      [[special-token|special tokens]] or returned as separate 'thinking' or 'reasoning' blocks.
      Traces contain problem decomposition, attempts, self-verification and backtracking, and may
      run to tens of thousands of tokens. Providers handle them differently: some return the full
      trace; others return a model-written summary, encrypted or redacted blocks that must be passed
      back unchanged in multi-turn or tool-using conversations, or only a token count for billing.
      Traces are used for [[knowledge-distillation|knowledge distillation]] into smaller models, for
      debugging and for [[chain-of-thought-monitoring|chain-of-thought monitoring]]; how faithfully
      they reflect the model's actual computation is an open research question.
    example: The reasoning trace showed it misread the units in step two and never went back.
origin: >-
  An early prominent use is the [[react|ReAct]] paper by Shunyu Yao and colleagues (October 2022),
  which interleaved reasoning traces with actions. The term became standard after OpenAI's o1
  (September 2024), which hid its raw traces from users, and [[deepseek-r1|DeepSeek-R1]] (January
  2025), which exposed them; the s1 project (2025) fine-tuned a model on just 1,000 questions paired
  with traces.
year: 2022
note: >-
  Often used interchangeably with [[chain-of-thought|chain of thought]]; some reserve 'reasoning
  trace' for the spontaneous output of trained reasoning models and 'chain of thought' for the
  prompted technique.
