# yaml-language-server: $schema=../schema/entry.schema.json

term: Moravec's paradox
id: moravec-s-paradox
pos: n.
also:
  - Moravec paradox
pronunciation: MOR-uh-vek
domain: robot
domains:
  - mind
  - core
  - hist
level: core
plain: >-
  The observation that what is hard for people, like chess or algebra, is often easy for computers,
  while what toddlers do effortlessly, such as seeing, walking and picking things up, is very hard
  for machines.
senses:
  - definition: >-
      The observation that abilities humans find intellectually demanding — logic, algebra, board
      games, written tests — have proved relatively easy to mechanize, while abilities humans
      exercise without thought — [[perception|perception]], walking, grasping, handling unfamiliar
      objects — have proved far harder to engineer and need much more computation. Hans Moravec's
      explanation was evolutionary: the machinery for perception and movement has been tuned over
      roughly a billion years and works below awareness, so its difficulty is invisible to us,
      whereas abstract reasoning is a young ability — by his estimate under 100,000 years old — that
      evolution has had little time to refine. The paradox is now routinely invoked to explain why
      [[large-language-model|language models]] pass professional examinations while general-purpose
      household [[robot|robots]] remain elusive, and why [[robot-learning|robot learning]] and
      [[physical-ai|physical AI]] lag behind text-based AI.
    example: >-
      Our agent can file the tax return but not fold the laundry: Moravec's paradox in one sentence.
origin: >-
  Articulated by Hans Moravec in Mind Children (1988), who wrote that computers could be made to
  play checkers or take intelligence tests at adult level far more easily than given a
  one-year-old's perception and mobility; Rodney Brooks, Marvin Minsky and others made similar
  points in the 1980s. Steven Pinker's The Language Instinct (1994) put it as 'the hard problems are
  easy and the easy problems are hard'.
year: 1988
note: >-
  Critics such as Arvind Narayanan, in the essay 'Fact checking Moravec's paradox' (January 2026),
  argue that it was never tested empirically, mostly reflects which problems AI researchers chose to
  work on, and has little power to predict which tasks AI will find easy or hard. Often cited
  alongside, but distinct from, [[polanyi-s-paradox|Polanyi's paradox]], which concerns tacit
  knowledge.
see_also:
  - robotics
  - embodied AI
  - physical AI
  - Polanyi's paradox
  - jagged frontier
  - manipulation
sources:
  - text: >-
      Moravec, H. (1988). Mind Children: The Future of Robot and Human Intelligence. Harvard
      University Press.
  - text: Pinker, S. (1994). The Language Instinct. William Morrow.
  - text: >-
