term: rapture of the nerds
id: rapture-of-the-nerds
pos: phr.
also:
  - Rapture for nerds
  - nerd rapture
domain: culture
domains:
  - asi
labels:
  - figurative
level: specialist
plain: >-
  A mocking nickname for the 'technological singularity', comparing the belief that superintelligent
  AI will transform the world to the religious idea of the Rapture.
senses:
  - definition: >-
      A derisive or wry nickname for the [[technological-singularity|technological singularity]],
      likening expectations of a sudden AI-driven transformation —
      [[superintelligence|superintelligence]], mind uploading, the end of scarcity and death — to
      the evangelical Christian belief in the Rapture, in which the faithful are taken up to heaven.
      The phrase compresses a long-running critique that singularitarian and some AGI discourse
      reproduces religious structures: an imminent transcendence, predicted dates, prophets, an
      elect who understand, and salvation or damnation. Skeptics use it as a put-down;
      science-fiction writers and some enthusiasts use it affectionately.
    example: >-
      To her the timelines debate is the rapture of the nerds with better spreadsheets.
origin: >-
  Usually traced to the Scottish science-fiction writer Ken MacLeod, whose novel The Cassini
  Division (1998) mocks the Singularity in these terms; MacLeod himself denies coining the phrase,
  and its first use is not established. It was widely quoted in discussions of Vernor Vinge's and
  Ray Kurzweil's singularity ideas and became the title of a 2012 novel by Cory Doctorow and Charles
  Stross.
year: 1998
note: >-
  Critics in the [[tescreal|TESCREAL]] debate make a related comparison more formally;
  singularitarians reply that their predictions rest on technological trends rather than revelation.
