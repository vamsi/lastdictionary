term: intelligence curse
id: intelligence-curse
pos: n.
also:
  - the intelligence curse
domain: asi
domains:
  - society
  - gov
labels:
  - emerging
level: specialist
plain: >-
  The worry that once AI can do most jobs, governments and companies will no longer need ordinary
  people and so will stop looking after them, like oil-rich states that neglect their citizens.
senses:
  - definition: >-
      A predicted dynamic in which AI able to replace most human labor removes the incentives that
      lead powerful actors, such as states and companies, to invest in and answer to ordinary
      people, so that most people lose economic leverage, political influence and eventually
      well-being. The name and argument draw on the resource curse: states that earn their income
      from oil or minerals rather than from taxing productive citizens tend to underinvest in them
      and to be less accountable to them. With AI as the main source of production, the authors
      argue, similar incentives could take hold everywhere, and the replacement of entry-level
      workers could also close the usual routes by which people build skills and capital. They
      propose to avert catastrophes that would justify centralization, to diffuse AI capabilities
      widely among individuals, and to democratize institutions so that they stay anchored to human
      needs.
    example: >-
      If tax revenue stops depending on workers, the intelligence curse says governments will stop
      depending on them too.
origin: >-
  Introduced in 2025 by Luke Drago and Rudolf Laine, whose essay series The Intelligence Curse
  (intelligence-curse.ai) set out the argument; it draws on Laine's late-2024 essay 'By default,
  capital will matter more than ever after AGI'. Exact first-use date not established.
year: 2025
see_also:
  - gradual disempowerment
  - technological unemployment
  - concentration of power
  - explosive growth
  - automation
  - successionism
sources:
  - text: Drago, L. & Laine, R. (2025). The Intelligence Curse. Essay series.
    url: https://intelligence-curse.ai
