term: digital replica
id: digital-replica
pos: n.
also:
  - AI likeness
  - voice replica
  - digital double
domain: gov
domains:
  - gen
  - society
labels:
  - legal
level: core
plain: >-
  A realistic computer-made copy of a real person's voice or appearance — such as an AI clone of a
  singer's voice or a digital stand-in for an actor — that can say or do things the person never
  did.
senses:
  - definition: >-
      Synthetic audio or imagery, generated or manipulated by computer, that a viewer or listener
      would take for a particular real person's voice or likeness, showing a performance or
      statement the person never gave; most are now made with [[voice-cloning|voice cloning]] or
      [[deepfake|deepfake]] techniques. The term is used in law and labor contracts to set consent
      and compensation rules. SAG-AFTRA's 2023 film and television agreement distinguishes
      'employment-based' replicas made during a production from 'independently created' ones,
      requiring informed consent and payment for each use. US states have extended rights of
      publicity: Tennessee's ELVIS Act (2024) explicitly protects voice and reaches tools whose
      primary purpose is producing unauthorized replicas, and California's 2024 laws void vague
      contract clauses authorizing replicas and protect deceased performers. In 2024 the US
      Copyright Office recommended a federal right, and the proposed NO FAKES Act would create one,
      with notice-and-takedown duties for online platforms.
    example: >-
      The contract allowed a digital replica only for the reshoot scenes, with fresh consent for
      anything else.
origin: >-
  Used as a legal term in New York's 2020 post-mortem right-of-publicity law, which regulated
  digital replicas of deceased performers; it became widely known through the 2023 SAG-AFTRA strike,
  in which control of digital replicas was a central issue.
year: 2020
note: >-
  Distinguish from a [[deepfake|deepfake]], which may depict anyone and is usually defined by
  deceptive intent or effect: a digital replica may be fully authorized, as when a performer
  licenses a voice. Sexual deepfakes are addressed separately by the [[take-it-down-act|TAKE IT DOWN
  Act]].
see_also:
  - deepfake
  - voice cloning
  - synthetic media
  - TAKE IT DOWN Act
  - AI authorship
  - AI copyright litigation
sources:
  - text: >-
      US Copyright Office (2024). Copyright and Artificial Intelligence, Part 1: Digital Replicas.
standards: >-
  N.Y. Civil Rights Law § 50-f (2020); Tennessee Ensuring Likeness, Voice and Image Security (ELVIS)
  Act (2024)
as_of: 2026-10
