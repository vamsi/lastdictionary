level: core
plain: >-
  Words, phrases and habits of style that AI chatbots overuse — certain fancy verbs, tidy lists of
  three, 'it's not just X, it's Y' — which make writing recognizable as machine-made.
senses:
  - definition: >-
      Characteristic stylistic tics of text generated by [[large-language-model|large language
      models]], whose recurrence makes the output recognizable. They include favored vocabulary
      ([[delve|delve]], 'tapestry', 'testament', 'nuanced', 'seamless'); stock openers and closers
      ('Great question!', 'I hope this helps'); reflexive hedges and disclaimers;
      [[sycophancy|sycophantic]] agreement (see [[you-re-absolutely-right|you're absolutely
      right]]); triads and parallel constructions; the 'it's not X — it's Y' contrast; heavy use of
      bullet points, bold text and headings; and, contentiously, the em dash. LLM-isms arise mainly
      in [[post-training|post-training]], where preference optimization rewards a polished,
      agreeable register and narrows stylistic variety; they shift between model generations as
      developers train out the most mocked ones. Readers treat them as informal evidence of AI
      authorship, an unreliable practice that also stigmatizes human writers with similar habits.
    example: >-
      I stripped the LLM-isms out of the draft — no more 'in today's fast-paced world'.
origin: >-
  Grew up informally on social media and forums in 2023 as readers learned to recognize ChatGPT's
  house style, alongside 'GPT-isms' and 'ChatGPT-isms'. Lists of telltale words and constructions
  circulated widely in 2024, and Wikipedia editors compiled a guide to signs of AI writing to help
  detect generated text. No single coiner is known.
year: 2023
note: >-
  The em-dash controversy shows the risk of over-reading tics: many professional writers have always
  used the dash heavily and resent its new association with machines.
