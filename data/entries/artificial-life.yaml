term: artificial life
id: artificial-life
pos: n.
also:
  - ALife
  - A-Life
  - soft ALife
  - hard ALife
  - wet ALife
domain: mind
domains:
  - sym
  - hist
level: specialist
plain: >-
  The study of life by building lifelike systems — in computer simulations, robots or chemistry — to
  learn how living things organize themselves, reproduce and evolve, and what other kinds of life
  could exist.
senses:
  - definition: >-
      The interdisciplinary field that investigates life by trying to build it, or things that
      behave like it — as computer simulations ('soft' ALife), as robots and other hardware ('hard')
      or in the chemistry laboratory ('wet') — rather than only by dissecting existing organisms,
      with the aim of understanding 'life as it could be' as well as life as we know it. Classic
      topics include self-replication, from John von Neumann's self-reproducing automata; cellular
      automata such as John Conway's Game of Life; artificial chemistries; digital evolution systems
      such as Tierra and Avida; flocking and [[swarm-intelligence|swarm behavior]]; and open-ended
      evolution, the search for systems that keep generating novelty. The field overlaps with
      [[evolutionary-computation|evolutionary computation]] and the study of
      [[emergence|emergence]], and connects to AI through [[embodied-cognition|embodied cognition]],
      self-organizing agents and, more recently, the use of foundation models to search for lifelike
      simulations. A standing debate is whether a computational process could literally be alive
      (strong ALife) or only model life.
origin: >-
  Named by the computer scientist Christopher Langton in 1986; the term appears in his paper
  'Studying Artificial Life with Cellular Automata' (Physica D, 1986). He organized the first
  artificial life workshop at Los Alamos National Laboratory in September 1987; its proceedings
  (1989) and the journal Artificial Life (from 1993) established the field, which built on John von
  Neumann's work on self-reproducing automata from the late 1940s.
year: 1986
see_also:
