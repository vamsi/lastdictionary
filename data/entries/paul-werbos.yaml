plain: >-
  An American scientist whose 1974 doctoral thesis set out backpropagation, the method of passing
  errors backward that now trains nearly all neural networks.
senses:
  - definition: >-
      American engineer and social scientist whose 1974 Harvard doctoral thesis, 'Beyond
      Regression', showed how to compute the gradients of a multi-stage model efficiently by working
      backward from its output — the procedure now called [[backpropagation|backpropagation]] — and
      proposed using it to fit models including neural networks. He applied it explicitly to
      [[multilayer-perceptron|multilayer neural networks]] in 1982, before its popularization by
      [[david-rumelhart|David Rumelhart]], [[geoffrey-hinton|Geoffrey Hinton]] and Ronald Williams
      in 1986, and popularized the name and method of [[backpropagation-through-time|backpropagation
      through time]] (1990) for recurrent systems. He also developed adaptive critic designs, which
      combine neural networks with approximate [[dynamic-programming|dynamic programming]] for
      control and are an early form of [[actor-critic|actor–critic]]
      [[reinforcement-learning|reinforcement learning]]. As a long-serving program director at the
      US National Science Foundation he funded research on neural networks and neuroengineering. He
      received the IEEE Neural Network Pioneer Award and served as president of the International
      Neural Network Society.
