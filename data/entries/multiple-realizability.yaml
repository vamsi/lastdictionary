term: multiple realizability
id: multiple-realizability
pos: n.
also:
  - multiple realization
  - multiply realizable
domain: mind
level: specialist
plain: >-
  The idea that the same mental state, such as pain, could be produced by very different physical
  systems — human brains, octopus brains or perhaps computers — just as one program can run on
  different machines.
senses:
  - definition: >-
      The thesis that one type of mental state, such as pain or the belief that it is raining, could
      occur in systems built in physically very different ways, so that it cannot be equated with
      any one type of physical state, such as a particular pattern of neural firing. Hilary Putnam
      used it against the mind–brain identity theory: if pain just is a specific human brain state,
      then mollusks such as the octopus, with very different nervous systems, could not feel pain,
      which seems implausible. Multiple realizability is the main argument for
      [[functionalism|functionalism]] and for the autonomy of psychology and other special sciences,
      and it underlies the assumption that minds could in principle be implemented in silicon.
      Critics argue that realizations differ more than functionalists admit, or that mental kinds
      may be tied to fine-grained biological features.
origin: >-
  Hilary Putnam's 'Psychological Predicates' (1967), arguing from the variety of nervous systems
  across species; Jerry Fodor's 'Special Sciences' (1974) extended the argument to the relation
  between psychology and physics.
year: 1967
see_also:
  - functionalism
  - substrate independence
  - mind–body problem
  - computational theory of mind
  - biological naturalism
contrast:
  - biological naturalism
sources:
  - text: >-
      Putnam, H. (1967). Psychological Predicates. In W. H. Capitan & D. D. Merrill (eds.), Art,
      Mind, and Religion. University of Pittsburgh Press.
  - text: >-
      Fodor, J. A. (1974). Special Sciences (or: The Disunity of Science as a Working Hypothesis).
      Synthese 28(2), 97–115.
