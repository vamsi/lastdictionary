labels:
  - legal
level: core
plain: >-
  A 2022 US law that put tens of billions of dollars into building computer-chip factories and chip
  research in the United States, to reduce dependence on chips made in Asia.
senses:
  - definition: >-
      A US statute, signed on August 9, 2022, that subsidizes domestic chipmaking and authorizes
      larger public science budgets. Its semiconductor core of about $52.7 billion comprises $39
      billion in incentives for new or expanded fabs, about $11 billion for research and development
      (among it a National Semiconductor Technology Center and an advanced packaging program) and
      smaller sums for workforce and supply-chain security; a separate 25% investment tax credit
      supports semiconductor manufacturing, and science authorizations bring the total to roughly
      $280 billion. Recipients accepted 'guardrails' restricting expansion of advanced chipmaking in
      China and other countries of concern for ten years. Large awards went to Intel, [[tsmc|TSMC]],
      Samsung and Micron for plants in Arizona, Texas, Ohio and New York, among others. The science
      provisions authorized higher budgets for the National Science Foundation, a new technology
      directorate and regional tech hubs. The Trump administration renegotiated some awards,
      converting part of Intel's grants into a federal equity stake of about 10% in August 2025, and
      a 2025 budget law raised the tax credit to 35%.
    example: >-
      The fab qualified for CHIPS and Science Act grants only after agreeing to the China guardrails.
origin: >-
  Grew out of the CHIPS for America Act (2020) and the Senate's Endless Frontier Act (2021, Chuck
  Schumer and Todd Young); passed by Congress in July 2022 and signed by President Joe Biden.
year: 2022
note: >-
  Not an AI law, but central to AI policy because nearly all leading-edge AI chips are fabricated in
  Taiwan. Often paired with [[export-controls-on-ai-chips|export controls on AI chips]] as the
  'promote' and 'protect' halves of US semiconductor strategy.
