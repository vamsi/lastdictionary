plain: >-
  An American computer scientist at Stanford whose center coined the term 'foundation model' and
  builds tools for evaluating and documenting large AI models.
senses:
  - definition: >-
      American computer scientist at Stanford University and director of its Center for Research on
      Foundation Models (CRFM), founded in 2021. After a PhD at the University of California,
      Berkeley, on learning semantic parsers, he became known for work on
      [[natural-language-understanding|natural language understanding]] and reliable machine
      learning, including the [[squad|SQuAD]] reading-comprehension benchmark (2016, with Pranav
      Rajpurkar and others) and the use of [[influence-function|influence functions]] to explain
      neural-network predictions (2017, with Pang Wei Koh). With Rishi Bommasani and more than 100
      co-authors he named and analyzed [[foundation-model|foundation models]] (2021), and CRFM went
      on to build the [[helm|HELM]] evaluation framework (2022), the low-cost instruction-following
      model Alpaca (2023) and the Foundation Model Transparency Index (2023). He co-founded the AI
      cloud company Together AI and advocates openness and transparency in model development.
