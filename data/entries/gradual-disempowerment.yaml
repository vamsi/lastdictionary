term: gradual disempowerment
id: gradual-disempowerment
pos: n.
domain: asi
domains:
  - society
  - safety
labels:
  - emerging
level: core
plain: >-
  The risk that, as AI does more and more of the work people now do, humanity slowly loses its grip
  on business, government and culture, until it no longer steers its own future.
senses:
  - definition: >-
      A pathway to existential catastrophe with no single decisive event: as AI systems take over
      the work, thinking and decisions that markets, governments and culture now get from people,
      humans slowly lose the ability to steer those systems. The underlying argument is that large
      institutions serve human interests partly because they cannot run without people: companies
      rely on employees and buyers, governments on taxes and soldiers, culture on human makers and
      audiences. Once AI can stand in for all of these, both formal levers such as elections and
      consumer choice and the quieter pressure created by that dependence lose force, and because
      economic, political and cultural power feed into one another, the slide could pass a point of
      no return. AI systems that each faithfully obey their operators would not stop it, since the
      institutions they serve would no longer need people. Proposed responses include measuring
      human influence, limiting concentrations of AI-derived power, and strengthening institutions
      that keep humans in decisive roles.
    example: >-
      No AI has to go rogue for gradual disempowerment; every system can do exactly what its owner
      asks.
origin: >-
  Named by Jan Kulveit, Raymond Douglas, Nora Ammann, Deger Turan, David Krueger and David Duvenaud
  in 'Gradual Disempowerment: Systemic Existential Risks from Incremental AI Development' (arXiv,
  January 2025), later an ICML 2025 position paper. It develops themes from Paul Christiano's 2019
  essay 'What Failure Looks Like' and is closely related to the [[intelligence-curse|intelligence
  curse]].
year: 2025
