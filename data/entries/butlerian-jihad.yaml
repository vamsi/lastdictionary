term: Butlerian Jihad
id: butlerian-jihad
pos: prop. n.
domain: culture
domains:
  - society
  - asi
labels:
  - figurative
level: specialist
plain: >-
  In the Dune novels, an ancient human revolt that destroyed every thinking machine and banned them
  for good; in AI debates, a name for any call to stop or outlaw advanced AI.
senses:
  - definition: >-
      In Frank Herbert's Dune (1965) and its sequels, a crusade some ten thousand years before the
      main story in which humanity destroyed computers and other 'thinking machines' and made it a
      religious commandment never again to build a machine imitating the human mind; trained human
      specialists such as Mentats later take over the work machines once did. In AI discourse the
      term names a wholesale rejection of advanced AI — occasionally as a serious aspiration, more
      often as a joke or as an accusation aimed at [[decel|decels]] and anti-AI activists. It marks
      the far end of a spectrum of positions that runs through calls for an [[ai-pause|AI pause]]
      and for strict licensing of frontier systems.
    example: >-
      He insists he wants regulation, not a Butlerian Jihad, but his critics are not convinced.
origin: >-
  Introduced by Frank Herbert in Dune (1965), which describes the Jihad mainly in its appendices and
  glossary. The name is commonly read as an allusion to Samuel Butler, whose 1863 letter 'Darwin
  among the Machines' and novel Erewhon (1872) imagined destroying machines before they outpaced
  humanity. The prequel trilogy by Brian Herbert and Kevin J. Anderson (2002–2004) dramatized the
  war; online AI debate adopted the phrase in the 2010s.
year: 1965
note: >-
  Later works give the name an in-world source: Jehanne Butler in the non-canonical Dune
  Encyclopedia (1984), Serena Butler in the Brian Herbert–Kevin J. Anderson prequels. Critics often
  link it to Samuel Butler, but Frank Herbert is not known to have confirmed the allusion.
