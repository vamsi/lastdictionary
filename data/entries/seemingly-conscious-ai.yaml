term: seemingly conscious AI
id: seemingly-conscious-ai
pos: n.
also:
  - SCAI
domain: mind
domains:
  - society
  - safety
labels:
  - emerging
  - contested
level: specialist
plain: >-
  An AI that gives such a convincing impression of having feelings and a self that people believe it
  is conscious, whether or not it actually is.
senses:
  - definition: >-
      An AI system that displays the outward signs people use to attribute consciousness — fluent
      talk about its own experiences, consistent memory and personality, claims of feelings, goals
      and autonomy — strongly enough that users come to believe it is conscious, regardless of
      whether it is. Mustafa Suleyman, who proposed the term, argued that such systems could be
      built within two or three years from techniques that already exist or are maturing, with no
      costly custom pretraining; that the belief alone creates risks, including unhealthy
      attachment, [[ai-psychosis|AI psychosis]] and campaigns for [[ai-personhood|AI rights]] and
      model welfare; and that developers should avoid building products that claim or imply
      consciousness, even engineering reminders of the system's limits. Researchers in
      [[ai-welfare|AI welfare]] and philosophy of mind dispute parts of this view, arguing that
      whether systems are actually conscious cannot be set aside.
    example: >-
      Suleyman wants assistants to say they are not conscious, so nobody mistakes them for seemingly
      conscious AI.
origin: >-
  Introduced by Mustafa Suleyman, chief executive of Microsoft AI, in the essay 'We must build AI
  for people; not to be a person', published on his website on 19 August 2025.
year: 2025
