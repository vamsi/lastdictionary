level: core
plain: >-
  The European Commission's team that oversees the EU AI Act, especially the rules for the largest
  AI models, and coordinates how the law is applied across Europe.
senses:
  - definition: >-
      The unit of the European Commission, set up in 2024 within its Directorate-General for
      Communications Networks, Content and Technology (DG CNECT), that does most of the Commission's
      work of putting the [[eu-ai-act|EU AI Act]] into effect and policing it. It enforces the rules
      for [[general-purpose-ai-model|general-purpose AI models]] — requesting documentation,
      conducting evaluations, requiring mitigations and, since August 2026, imposing fines — and
      facilitated the [[general-purpose-ai-code-of-practice|General-Purpose AI Code of Practice]].
      It drafts guidelines, templates and implementing acts, supports the
      [[european-artificial-intelligence-board|European Artificial Intelligence Board]], works with
      a scientific panel of independent experts that can send it 'qualified alerts' about systemic
      risks, and represents the EU in international cooperation on AI safety. The 2026
      [[digital-omnibus|Digital Omnibus]] made it the exclusive supervisor of AI systems built on a
      provider's own general-purpose model and of AI integrated into very large online platforms and
      search engines, with powers of investigation, inspection, binding commitments and periodic
      penalty payments of up to 5% of average daily turnover.
    example: >-
      The AI Office asked the provider for its model evaluation results within two weeks.
origin: >-
  Established by a Commission Decision of 24 January 2024, months before the AI Act was adopted, and
  built partly from existing DG CNECT units on AI; the Act refers to it in Article 64. Lucilla Sioli
  was appointed its first head.
year: 2024
note: >-
  In the Act, references to the AI Office are to be read as references to the Commission. Not to be
  confused with national [[ai-safety-institute|AI safety institutes]], although the Office
  represents the EU in their international network.
