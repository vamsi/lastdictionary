plain: >-
  An American cognitive scientist and leading critic of deep learning, who argues that today's AI
  cannot reason reliably and needs to be combined with symbolic methods.
senses:
  - definition: >-
      American cognitive scientist and a leading critic of [[deep-learning|deep learning]] as a
      route to general intelligence; he is an emeritus professor at New York University, where he
      taught psychology and neural science. Trained under Steven Pinker, he studied how children
      learn grammatical rules, and in 'The Algebraic Mind' (2001) argued that neural networks
      without explicit symbols cannot reliably generalize abstract rules beyond their training data.
      He applied the argument to modern systems in essays such as 'Deep Learning: A Critical
      Appraisal' (2018) and 'Deep Learning Is Hitting a Wall' (2022) and in 'Rebooting AI' (2019,
      with Ernest Davis), pointing to failures of reasoning, [[hallucination|hallucination]] and
      [[out-of-distribution|out-of-distribution]] generalization, and advocates hybrid
      [[neuro-symbolic-ai|neuro-symbolic AI]]. He founded the startup Geometric Intelligence,
      acquired by Uber in 2016, and co-founded Robust.AI with [[rodney-brooks|Rodney Brooks]]. In
      May 2023 he testified to a US Senate subcommittee alongside [[sam-altman|Sam Altman]], urging
      AI regulation, a case he developed in 'Taming Silicon Valley' (2024).
