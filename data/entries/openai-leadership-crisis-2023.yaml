plain: >-
  The five days in November 2023 when OpenAI's board fired chief executive Sam Altman, nearly all
  staff threatened to quit, and he returned with a new board.
senses:
  - definition: >-
      The removal of [[sam-altman|Sam Altman]] as chief executive of [[openai|OpenAI]] on 17
      November 2023 and his reinstatement days later. The board of OpenAI's nonprofit parent —
      [[ilya-sutskever|Ilya Sutskever]], Adam D'Angelo, Tasha McCauley and Helen Toner — announced
      that Altman had been 'not consistently candid in his communications with the board' and
      removed him; president Greg Brockman was removed as chair and resigned, and chief technology
      officer Mira Murati became interim chief executive, replaced within days by Emmett Shear.
      Microsoft, OpenAI's largest investor, offered Altman and Brockman roles leading a new research
      team, and more than 700 of roughly 770 employees signed a letter threatening to leave unless
      the board resigned; Sutskever publicly expressed regret. An agreement in principle announced
      late on 21 November (US time) returned Altman, with a new initial board of Bret Taylor, Larry
      Summers and D'Angelo. A review by the law firm WilmerHale, completed in March 2024, found a
      breakdown in trust but concluded that his conduct did not mandate removal, and Altman rejoined
      the board.
    example: >-
      After the 2023 leadership crisis, governance scholars asked whether a nonprofit board can
      really control a frontier lab.
origin: >-
  Named in news coverage from 17 November 2023, when OpenAI's blog announced a 'leadership
  transition'; it is also called the OpenAI board crisis, and Altman and staff later referred to it
  as 'the Blip'.
year: 2023
note: >-
  In May 2024 Toner said the board had lost trust because Altman withheld information and gave
  inaccurate accounts of safety processes, an account OpenAI's board chair, Bret Taylor, disputed.
  The episode fed debate over whether a nonprofit board can govern a commercial AI laboratory, a
  question revisited in OpenAI's 2025 restructuring. Sutskever left in 2024 to found
  [[safe-superintelligence-inc|Safe Superintelligence Inc.]]
