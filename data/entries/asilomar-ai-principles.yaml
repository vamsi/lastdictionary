plain: >-
  A list of 23 guidelines for safe and beneficial AI drawn up at a 2017 conference in California and
  signed by thousands of researchers and public figures.
senses:
  - definition: >-
      Twenty-three principles for the research, ethics and long-term governance of artificial
      intelligence, developed at the Beneficial AI 2017 conference organized by the
      [[future-of-life-institute|Future of Life Institute]] at the Asilomar Conference Grounds in
      Pacific Grove, California, in January 2017. Grouped under research issues, ethics and values,
      and longer-term issues, they call for research aimed at beneficial rather than undirected
      intelligence; safety, failure transparency and judicial transparency; value alignment and
      human control; avoidance of an arms race in lethal autonomous weapons; shared benefit and
      prosperity; and caution about recursive self-improvement, with
      [[superintelligence|superintelligence]] to be pursued only for ethical ends that are broadly
      shared. A principle was kept only if about 90 percent of attendees supported it. Signed by
      more than a thousand AI researchers and thousands of others, the principles were an early and
      influential voluntary framework, echoed in later corporate and governmental AI principles.
    example: >-
      The company's ethics charter borrows several clauses almost word for word from the Asilomar AI
      Principles.
origin: >-
  Drafted through surveys and discussion among more than 100 invited researchers, economists,
  lawyers and philosophers at the 5–8 January 2017 conference. The name deliberately echoes the 1975
  Asilomar Conference on Recombinant DNA, a precedent for scientists setting rules for a powerful
  technology.
year: 2017
