term: liar's dividend
id: liar-s-dividend
pos: n.
also:
  - the liar's dividend
domain: society
domains:
  - gen
  - gov
level: core
plain: >-
  The advantage dishonest people gain once everyone knows fakes are easy to make: they can wave away
  real evidence against them by claiming it was made by AI.
senses:
  - definition: >-
      The benefit that accrues to people who deny authentic evidence, such as a genuine recording of
      misconduct, by exploiting public awareness that realistic [[deepfake|deepfakes]] and other
      [[synthetic-media|synthetic media]] exist. The more the public learns that seeing is no longer
      believing, the more plausible a false claim of fabrication becomes, so the harm of deepfakes
      includes eroding trust in real media, not only spreading fake media. Survey experiments
      suggest that falsely crying fake can help politicians weather scandals, particularly when the
      evidence is text-based, and the defense has been raised in courtrooms and election campaigns.
      Mitigations include provenance systems that authenticate genuine recordings at capture,
      forensic analysis, and verification practices in journalism.
    example: >-
      Within an hour the candidate called the leaked audio a deepfake, a textbook play for the
      liar's dividend.
origin: >-
  Coined by law professors Robert Chesney and Danielle Keats Citron in 'Deep Fakes: A Looming
  Challenge for Privacy, Democracy, and National Security', circulated in 2018 and published in the
  California Law Review in 2019.
year: 2018
see_also:
  - deepfake
  - synthetic media
  - disinformation
  - misinformation
  - deepfake detection
  - AI watermarking
sources:
  - text: >-
      Chesney, R. & Citron, D. K. (2019). Deep Fakes: A Looming Challenge for Privacy, Democracy,
      and National Security. California Law Review 107, 1753–1820.
  - text: >-
      Schiff, K. J., Schiff, D. S. & Bueno, N. S. (2025). The Liar's Dividend: Can Politicians Claim
      Misinformation to Evade Accountability? American Political Science Review.
