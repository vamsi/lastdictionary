plain: >-
  Guidelines written for the European Commission by an expert group in 2019, listing seven
  requirements AI should meet to be trustworthy; they paved the way for the EU AI Act.
senses:
  - definition: >-
      A non-binding document published in April 2019 by the European Commission's High-Level Expert
      Group on Artificial Intelligence (AI HLEG), which defined [[trustworthy-ai|trustworthy AI]] as
      lawful, ethical and robust and set out seven key requirements: human agency and oversight;
      technical robustness and safety; privacy and data governance; transparency; diversity,
      non-discrimination and fairness; societal and environmental well-being; and accountability.
      The requirements rest on four ethical principles derived from fundamental rights — respect for
      human autonomy, prevention of harm, fairness and explicability. The Assessment List for
      Trustworthy AI (ALTAI), released in July 2020, turned them into a self-assessment checklist
      for organizations.
    example: >-
      Our review template still follows the seven requirements of the Ethics Guidelines for
      Trustworthy AI.
origin: >-
  The 52-member AI HLEG was appointed by the Commission in June 2018; a draft was opened for
  consultation in December 2018 and the final guidelines were published on 8 April 2019. Their
  requirements reappear in legal form in the high-risk rules of the [[eu-ai-act|EU AI Act]].
year: 2019
note: >-
  Critics, including the group member and philosopher Thomas Metzinger, accused the process of
  industry dominance and 'ethics washing', noting that proposed red lines were softened into
  'critical concerns'.
