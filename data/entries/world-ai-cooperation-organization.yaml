domain: gov
domains:
  - orgs
labels:
  - emerging
level: specialist
plain: >-
  An international organization for cooperation on AI, based in Shanghai, set up in 2026 by an
  agreement among 29 countries on China's initiative.
senses:
  - definition: >-
      An intergovernmental organization for cooperation on artificial intelligence, proposed by
      China and based in Shanghai, established by an agreement that 29 countries signed in July
      2026. Its stated aims are to make AI technology, infrastructure, training and benefits
      accessible to all countries — especially developing ones — through consultation and shared
      contribution, and to promote global AI governance. Analysts see it as a China-led alternative
      to Western-led frameworks such as the [[eu-ai-act|EU AI Act]] and the
      [[g7-hiroshima-ai-process|G7 Hiroshima AI Process]]; critics warn that it could spread
      state-centric models of digital governance and deepen dependence on Chinese AI infrastructure
      and standards.
    example: >-
      Several African delegations said joining WAICO was mainly about access to compute and training.
origin: >-
  Proposed by Chinese Premier Li Qiang at the World Artificial Intelligence Conference in Shanghai
  in July 2025. Representatives of 29 countries signed the agreement establishing it in Shanghai in
  mid-July 2026, alongside that year's conference; Chinese official media reported the signing on 17
  July.
year: 2026
