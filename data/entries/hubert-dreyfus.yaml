level: core
dates: 1929–2017
plain: >-
  An American philosopher who argued from the 1960s that computers following explicit rules could
  never match human intelligence, which rests on bodily, intuitive know-how.
senses:
  - definition: >-
      American philosopher at MIT and, from 1968, the University of California, Berkeley, and the
      best-known early critic of [[symbolic-ai|symbolic AI]]. His RAND Corporation paper 'Alchemy
      and Artificial Intelligence' (1965) and book 'What Computers Can't Do' (1972; revised as 'What
      Computers Still Can't Do', 1992) argued, drawing on Heidegger, Merleau-Ponty and Wittgenstein,
      that human expertise rests on embodied, situated skills and a background sense of what is
      relevant, which cannot be captured in explicit rules and symbols (see
      [[dreyfus-s-critique-of-ai|Dreyfus's critique of AI]]). With his brother Stuart Dreyfus he
      proposed a five-stage model of skill acquisition in 'Mind over Machine' (1986). Dismissed by
      many AI researchers at the time, his objections were later echoed in work on the
      [[frame-problem|frame problem]], [[embodied-cognition|embodied cognition]] and
      [[connectionism|connectionism]].
