plain: >-
  The American electric-car company led by Elon Musk, whose driver-assistance software, robotaxis
  and humanoid robot make it a major, and controversial, developer of AI.
senses:
  - definition: >-
      An American electric-vehicle and energy company whose AI work centers on driving automation
      and robotics. Its Autopilot driver-assistance system (from 2014) and 'Full Self-Driving'
      software, renamed FSD (Supervised) in 2024, rely on cameras alone rather than lidar and on
      data from millions of customer cars; version 12 (2024) replaced most hand-written driving code
      with an [[end-to-end-learning|end-to-end]] neural network. Its [[robotaxi|robotaxi]] service
      began in Austin, Texas, in June 2025 with company safety monitors on board and began some
      rides without an employee in the car in January 2026. US regulators have investigated many
      crashes involving the systems, which critics say were marketed as more capable than they are.
      Tesla also develops the Optimus [[humanoid-robot|humanoid robot]] and has built AI training
      supercomputers, including its custom-chip Dojo project, which it largely shut down in 2025.
      Andrej Karpathy led its AI and computer-vision team from 2017 to 2022.
origin: >-
  Founded in 2003 in San Carlos, California, by Martin Eberhard and Marc Tarpenning; Elon Musk led
  its early funding in 2004 and has been chief executive since 2008. It began fitting Autopilot
  hardware to its cars in 2014.
year: 2003
