plain: >-
  An American computer scientist who proposed 'model cards' for documenting AI systems, co-led
  Google's Ethical AI team, and is chief ethics scientist at Hugging Face.
senses:
  - definition: >-
      American computer scientist working on AI ethics and natural language generation. After a PhD
      at the University of Aberdeen on generating descriptions of objects, and research at Microsoft
      on systems that describe images, she joined Google in 2016, founded its Ethical AI team and
      co-led it with [[timnit-gebru|Timnit Gebru]]. She was lead author of 'Model Cards for Model
      Reporting' (2019), which proposed [[model-card|model cards]], short standardized documents
      describing a model's intended uses, performance across demographic groups and limitations, a
      practice later extended into [[system-card|system cards]]. She co-wrote the 2021 paper that
      coined '[[stochastic-parrot|stochastic parrots]]', listed under the pseudonym Shmargaret
      Shmitchell after Google objected to the paper. Google fired her in February 2021, saying she
      had violated its code of conduct and security policies; she had been searching her work files
      for evidence about Gebru's treatment. She then joined [[hugging-face|Hugging Face]] as its
      chief ethics scientist.
