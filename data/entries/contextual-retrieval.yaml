level: specialist
plain: >-
  A fix for searching cut-up documents: before storing each piece, an AI writes a short note saying
  where it came from and what it is about, so the piece still makes sense on its own.
senses:
  - definition: >-
      A [[retrieval-augmented-generation|retrieval-augmented generation]] indexing technique,
      described by Anthropic in 2024, for [[chunking|chunks]] that lose their meaning once cut from
      their document. A language model reads the whole document and writes a sentence or two placing
      each chunk — which document, section, entity and period it concerns — and this note is
      attached to the front of the chunk before it is embedded (contextual embeddings) and before it
      enters the keyword index (contextual BM25). A chunk saying only that a deadline was moved back
      two weeks, for instance, gains the name of the project and the date of the change. In its
      introducing report, adding context cut the top-20 retrieval failure rate by 35% with
      embeddings alone, by 49% when combined with contextual [[bm25|BM25]], and by 67% when
      [[reranking|reranking]] was added. The cost is one model call per chunk at indexing time,
      which [[prompt-caching|prompt caching]] of the shared document keeps affordable.
    example: >-
      With contextual retrieval, each chunk now opens with a line naming the company, the filing and
      the quarter.
origin: >-
  Named and described by Anthropic in 'Introducing Contextual Retrieval' (19 September 2024).
  Related ideas, such as adding titles or section headers to chunks before embedding them, had
  circulated earlier; Anthropic's report gave the combined recipe a name and measurements.
year: 2024
