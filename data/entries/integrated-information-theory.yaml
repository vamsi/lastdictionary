# yaml-language-server: $schema=../schema/entry.schema.json

term: integrated information theory
id: integrated-information-theory
pos: n.
also:
  - IIT
  - phi
  - Φ
  - integrated information
domain: mind
domains:
  - math
labels:
  - contested
level: core
plain: >-
  A scientific theory that measures consciousness by how much a system works as a single, unified
  whole rather than as separate parts. It implies that ordinary computers, whatever software they
  run, have little or no consciousness.
senses:
  - definition: >-
      A theory of consciousness that reasons backward from experience to its physical basis: it
      posits features that every experience has — existing for its subject and being structured,
      specific, unified and definite — and requires whatever physically underlies consciousness to
      have causal properties that mirror them. The quantity of consciousness is measured by
      integrated information, Φ (phi): roughly, how far the cause–effect power of a system as a
      whole exceeds that of its parts when it is partitioned; the quality of an experience is
      identified with the structure of those cause–effect relations. Because Φ depends on physical
      causal architecture rather than on the computation performed, IIT implies that a conventional
      digital computer has negligible consciousness whatever software it runs, even a perfect brain
      simulation, while some simple but highly integrated physical systems have a little. Exact Φ is
      intractable to compute for systems of realistic size.
origin: >-
  Proposed by the neuroscientist Giulio Tononi in 'An Information Integration Theory of
  Consciousness' (BMC Neuroscience, 2004), building on earlier work with Gerald Edelman, and
  developed with Christof Koch, Larissa Albantakis and others through IIT 3.0 (2014) and IIT 4.0
  (2023).
year: 2004
note: >-
  In September 2023 an open letter signed by 124 scholars called IIT pseudoscience, prompting
  rebuttals from others; an adversarial collaboration published in Nature in 2025 found some of its
  predictions unsupported. Its denial that digital simulations are conscious puts it at odds with
  [[substrate-independence|substrate independence]].
see_also:
