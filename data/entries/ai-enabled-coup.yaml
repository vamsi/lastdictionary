term: AI-enabled coup
id: ai-enabled-coup
pos: n.
also:
  - AI-enabled coups
domain: asi
domains:
  - gov
  - safety
labels:
  - emerging
level: specialist
plain: >-
  A seizure of power by a small group that uses advanced AI to bypass the soldiers, officials and
  workers whose cooperation power grabs normally need.
senses:
  - definition: >-
      An illegitimate seizure or entrenchment of power by an individual or small group, made
      possible by advanced AI. Coups and autocratic power grabs have historically required the
      cooperation of many people; Tom Davidson and colleagues argued that AI able to replace
      soldiers, officials and workers could remove that check. They singled out three risk factors:
      AI whose loyalty runs to one leader alone; concealed allegiances ('secret loyalties'),
      possibly planted through [[backdoor-attack|backdoors]], that make systems quietly serve one
      actor and could be handed down to successor models; and a monopoly on capabilities that might
      prove decisive, such as cyber offense, persuasion, strategic planning or weapons design.
      Suggested safeguards include [[model-specification|model specifications]] that rule out
      helping with a coup, audits that look for hidden loyalties, information security strict enough
      to bind a company's own leadership, and not concentrating AI development in one centralized
      project.
    example: >-
      The audit checked the new model for secret loyalties, a precaution against an AI-enabled coup.
origin: >-
  Introduced by Tom Davidson, Lukas Finnveden and Rose Hadshar of the research organization
  Forethought in 'AI-Enabled Coups: How a Small Group Could Use AI to Seize Power', published on 15
  April 2025.
year: 2025
