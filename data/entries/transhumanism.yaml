term: transhumanism
id: transhumanism
pos: n.
also:
  - transhumanist
  - H+
domain: asi
domains:
  - society
  - mind
level: specialist
plain: >-
  A movement holding that people should use technology, such as genetic engineering, brain implants
  or AI, to overcome human limits like aging, disease and death, and become more than human.
senses:
  - definition: >-
      A philosophical and cultural movement holding that people may, and should, use technology to
      remake the human condition: to defeat aging, disease and involuntary death and to push minds
      and bodies far beyond today's limits, perhaps until humans become something more, posthumans.
      Technologies of interest include genetic engineering, life extension, cryonics, brain–computer
      interfaces, nanotechnology and [[mind-uploading|mind uploading]]. Transhumanist networks of
      the 1990s and 2000s, including the extropians, incubated many of the ideas and people behind
      [[technological-singularity|technological singularity]] theory, the
      [[rationalist-community|rationalist community]] and early AI-safety research. Transhumanists
      disagree about AI: some welcome superintelligence as the next step in enhancement, while
      others see misaligned AI as the main threat to a posthuman future. Critics object to its
      implications for equality, its links to the history of eugenics and its utopianism.
    example: >-
      Early AI-safety mailing lists grew out of transhumanist forums about life extension and
      uploading.
origin: >-
  The earliest known use of the word is in a 1940 paper by the Canadian philosopher W. D. Lighthall.
  The biologist Julian Huxley, generally regarded as the movement's founder, popularized it in a
  1957 essay, 'Transhumanism', proposing that humanity transcend itself through science. Max More's
  extropian movement (from 1988) and the World Transhumanist Association, founded in 1998 by Nick
  Bostrom and David Pearce and renamed Humanity+ in 2008, organized the modern movement.
year: 1957
