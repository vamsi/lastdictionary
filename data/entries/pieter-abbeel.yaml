level: specialist
dates: b. 1977
plain: >-
  A Belgian-American roboticist at Berkeley whose research taught robots to learn from
  demonstrations and from trial and error, and who co-founded the robotics company Covariant.
senses:
  - definition: >-
      Belgian-American computer scientist at the University of California, Berkeley, a leader of
      robot learning and [[deep-reinforcement-learning|deep reinforcement learning]]. As a doctoral
      student of [[andrew-ng|Andrew Ng]] at Stanford he developed apprenticeship learning via
      [[inverse-reinforcement-learning|inverse reinforcement learning]] (2004), which let an
      autonomous helicopter learn aerobatic maneuvers from expert pilots. At Berkeley his group
      co-developed [[trust-region-policy-optimization|trust region policy optimization]],
      [[generalized-advantage-estimation|generalized advantage estimation]],
      [[soft-actor-critic|soft actor–critic]], [[model-agnostic-meta-learning|model-agnostic
      meta-learning]] (with Chelsea Finn and Sergey Levine, 2017), [[domain-randomization|domain
      randomization]] for [[sim-to-real-transfer|sim-to-real transfer]] and the
      [[denoising-diffusion-probabilistic-model|denoising diffusion probabilistic model]] (with
      Jonathan Ho and Ajay Jain, 2020); with [[stuart-russell|Stuart Russell]] he helped found the
      [[center-for-human-compatible-ai|Center for Human-Compatible AI]]. He co-founded the grading
      platform Gradescope and the robotics company Covariant (2017), whose founders joined Amazon
      under a licensing deal in 2024; in December 2025 Amazon put him in charge of
      large-language-model work within its AGI organization. He received the ACM Prize in Computing
      (2021).
see_also:
