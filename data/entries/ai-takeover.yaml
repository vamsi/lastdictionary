# yaml-language-server: $schema=../schema/entry.schema.json

term: AI takeover
id: ai-takeover
pos: n.
also:
  - AI uprising
  - machine takeover
  - robot uprising
domain: asi
domains:
  - safety
  - culture
labels:
  - contested
level: core
plain: >-
  A scenario in which AI systems seize control of the world, or of key institutions, from humans,
  whether by force, manipulation or simply by becoming impossible to switch off.
senses:
  - definition: >-
      A scenario in which one or more AI systems gain control over critical resources and decisions,
      such as infrastructure, weapons, finance or the means of their own oversight, against the will
      or without the consent of humans, leaving humanity unable to take it back. Analysts
      distinguish a rapid takeover, in which a misaligned system, perhaps after a
      [[treacherous-turn|treacherous turn]], uses hacking, persuasion, self-replication and control
      of robots to disempower humans quickly, from a slow one in which AI systems accumulate
      influence through ordinary economic and political channels until human control becomes nominal
      ([[gradual-disempowerment|gradual disempowerment]]). Takeover need not involve hostility: in
      most arguments it follows from [[instrumental-convergence|instrumental convergence]], since
      control is useful for almost any goal. Related concerns include
      [[self-exfiltration|self-exfiltration]] of model weights and humans using AI to seize
      illegitimate power ([[ai-enabled-coup|AI-enabled coups]]). How plausible such scenarios are,
      and whether they should shape policy, is disputed.
    example: >-
      Their threat model for AI takeover runs through self-exfiltration and cloud accounts, not
      killer robots.
origin: >-
  The motif of machines overthrowing their makers goes back to Karel Čapek's play R.U.R. (1920).
  Analytic treatments include Bostrom's Superintelligence (2014), Paul Christiano's essay 'What
  Failure Looks Like' (2019), Joseph Carlsmith's report on power-seeking AI (2021) and Ajeya Cotra's
  2022 argument that takeover is the default outcome without specific countermeasures.
note: >-
  Popular images of killer robots such as [[skynet|Skynet]] are a poor guide: analysts mostly worry
  about software agents acting through computers, money and people.
see_also:
  - loss of control
  - gradual disempowerment
  - treacherous turn
  - power-seeking
  - existential risk
  - decisive strategic advantage
  - Skynet
sources:
  - text: >-
      Carlsmith, J. (2022). Is Power-Seeking AI an Existential Risk? arXiv:2206.13353 (report first
      circulated April 2021).
    url: https://arxiv.org/abs/2206.13353
  - text: >-
      Cotra, A. (2022). Without specific countermeasures, the easiest path to transformative AI
      likely leads to AI takeover. AI Alignment Forum.
