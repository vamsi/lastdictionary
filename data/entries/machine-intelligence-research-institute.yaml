level: core
plain: >-
  A small nonprofit in Berkeley, California, among the first to warn that smarter-than-human AI
  could destroy humanity, which now campaigns for a worldwide halt to building it.
senses:
  - definition: >-
      A nonprofit research organization in Berkeley, California, and the oldest institution devoted
      to the [[ai-alignment|alignment]] of smarter-than-human AI. Its early writing on
      [[friendly-ai|friendly AI]], [[coherent-extrapolated-volition|coherent extrapolated volition]]
      and the [[intelligence-explosion|intelligence explosion]] shaped the field's vocabulary, and
      its later 'agent foundations' program studied idealized reasoning and self-reference,
      producing papers on [[corrigibility|corrigibility]] (2015), logical induction (2016) and
      [[embedded-agency|embedded agency]] (2018). Concluding that alignment research would not keep
      pace with capabilities, it announced in early 2024 a shift from technical research to
      communication and policy aimed at an internationally enforced halt to frontier AI development;
      Eliezer Yudkowsky and Nate Soares set out the case in If Anyone Builds It, Everyone Dies
      (2025). Critics regard its forecasts of near-certain catastrophe as overconfident.
origin: >-
  Founded in 2000 in Atlanta as the Singularity Institute for Artificial Intelligence by Eliezer
  Yudkowsky with Brian and Sabine Atkins, originally aiming to build beneficial superintelligent AI
  itself. It moved to the San Francisco Bay Area in 2005, ran the Singularity Summit from 2006 to
  2012, and took its present name in January 2013 after transferring the summit to Singularity
  University.
year: 2000
note: >-
  Older literature cites it as the Singularity Institute (SIAI). Its views are a reference point in
  debates over [[p-doom|p(doom)]]; many researchers dispute its pessimism.
