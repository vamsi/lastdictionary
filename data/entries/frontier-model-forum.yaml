term: Frontier Model Forum
id: frontier-model-forum
pos: prop. n.
also:
  - FMF
domain: gov
domains:
  - orgs
  - safety
level: specialist
plain: >-
  An industry group set up in 2023 by leading AI companies to share safety research and best
  practices for the most advanced AI models.
senses:
  - definition: >-
      An industry nonprofit of frontier AI developers that funds and coordinates work on the safety
      and security of the most capable models. It publishes technical reports and issue briefs on
      topics such as [[dangerous-capability-evaluation|dangerous-capability evaluations]],
      biosecurity thresholds, [[safety-case|safety cases]] and frontier safety frameworks;
      facilitates confidential information-sharing among members about threats and vulnerabilities;
      and administers an AI Safety Fund, launched in October 2023 with about $10 million from
      members and philanthropies, for independent research. Its founding members were Anthropic,
      Google, Microsoft and OpenAI; Amazon and Meta joined in 2024. Supporters see it as a channel
      for spreading safety practices across competitors; critics see industry self-regulation that
      may forestall binding rules, and as an association of rivals it must stay within antitrust
      limits.
    example: >-
      The Frontier Model Forum brief proposed common terminology for biosecurity evaluations.
origin: >-
  Announced on July 26, 2023 by Anthropic, Google, Microsoft and OpenAI, shortly after the White
  House voluntary commitments; Chris Meserole became its first executive director in October 2023,
  and Amazon and Meta joined in May 2024.
year: 2023
