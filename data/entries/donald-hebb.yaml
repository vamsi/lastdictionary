plain: >-
  A Canadian psychologist who proposed in 1949 that connections between brain cells strengthen when
  the cells are active together, an idea behind many learning rules for neural networks.
senses:
  - definition: >-
      Canadian psychologist at McGill University whose book 'The Organization of Behavior' (1949)
      proposed the learning rule now called [[hebbian-learning|Hebbian learning]]: when one neuron
      repeatedly takes part in firing another, the connection between them is strengthened. He
      argued that such changes bind neurons into cell assemblies that represent percepts and
      concepts, and that sequences of assemblies underlie thought, bridging psychology and
      neurophysiology when behaviorism dominated the field. The postulate, later supported by the
      discovery of long-term potentiation at synapses in the 1970s, became a foundation of
      [[connectionism|connectionism]]: it underlies associative memories such as the
      [[hopfield-network|Hopfield network]] and many unsupervised learning rules for
      [[neural-network|neural networks]]. Before joining McGill he studied with Karl Lashley at
      Harvard and worked with the neurosurgeon Wilder Penfield in Montreal; he later served as
      McGill's chancellor and as president of the American Psychological Association (1960).
