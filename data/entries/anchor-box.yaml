  - DETR
  - intersection over union
sources:
  - text: >-
      Ren, S., He, K., Girshick, R. & Sun, J. (2015). Faster R-CNN: Towards Real-Time Object
      Detection with Region Proposal Networks. NeurIPS 2015.
  - text: "Liu, W. et al. (2016). SSD: Single Shot MultiBox Detector. ECCV 2016."
