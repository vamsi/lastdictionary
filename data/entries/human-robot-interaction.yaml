plain: >-
  The study of how people and robots communicate, cooperate and share spaces, and of how to design
  robots that people find safe, understandable, trustworthy and pleasant to live or work with.
senses:
  - definition: >-
      The research field concerned with how people and robots communicate, cooperate and share
      space, and with designing and testing robots for those encounters; it combines
      [[robotics|robotics]] with human–computer interaction, psychology, design, AI and ethics. Its
      topics include communication through speech, gaze, gesture and legible motion; shared autonomy
      and supervisory control; physical human–robot interaction and safe contact
      ([[collaborative-robot|collaborative robots]], [[impedance-control|impedance control]],
      exoskeletons); social robots for education, therapy and elder care; proxemics, or how robots
      should respect personal space; trust, overtrust and [[automation-bias|automation bias]];
      [[anthropomorphism|anthropomorphism]] and the [[uncanny-valley|uncanny valley]]; and teaching
      robots by demonstration or feedback. The field relies heavily on user studies, often small
      laboratory samples, and has grappled with replicability. Since 2023
      [[large-language-model|large language models]] have given robots fluent conversation and
      instruction following, reviving questions about how robots should express uncertainty, ask for
      help and refuse unsafe requests, and about deception and emotional dependence on companion
      robots.
    example: >-
      The HRI study found people trusted the robot more when it announced where it would move next.
origin: >-
  Preceded by human-factors research on teleoperation and supervisory control (Thomas Sheridan and
  others, from the 1960s). The IEEE RO-MAN symposium on robot and human communication began in 1992,
  social robots such as Cynthia Breazeal's Kismet (MIT) followed in the late 1990s, and the first
  ACM/IEEE International Conference on Human-Robot Interaction was held in Salt Lake City in 2006.
year: 1992
