level: core
plain: >-
  A summer meeting of scientists at Dartmouth College in 1956, planned in a 1955 funding proposal
  that first used the phrase 'artificial intelligence'. Most histories treat it as the moment AI
  became a research field of its own.
senses:
  - definition: >-
      An informal study period of about six to eight weeks at Dartmouth College in Hanover, New
      Hampshire, in the summer of 1956, formally the Dartmouth Summer Research Project on Artificial
      Intelligence. [[john-mccarthy|John McCarthy]], [[marvin-minsky|Marvin Minsky]], Nathaniel
      Rochester and [[claude-shannon|Claude Shannon]] sought Rockefeller Foundation support for ten
      researchers in a proposal dated 31 August 1955, whose premise was that no part of learning or
      intelligence lay, in principle, beyond exact specification, and therefore beyond simulation by
      a machine. Its topics ranged from [[neural-network|neuron nets]] and machine use of language
      to self-improvement, abstraction, and randomness and creativity. Attendance shifted from week
      to week: [[allen-newell|Allen Newell]] and [[herbert-a-simon|Herbert A. Simon]] brought the
      [[logic-theorist|Logic Theorist]], a reasoning program that already ran, and
      [[arthur-samuel|Arthur Samuel]], [[ray-solomonoff|Ray Solomonoff]], Oliver Selfridge and
      Trenchard More were among the others. It produced no joint findings; its legacy was a name for
      the field, an agenda weighted toward [[symbolic-ai|symbolic methods]], and personal ties among
      the people who went on to found the main AI laboratories, at MIT, Carnegie Mellon and
      Stanford.
    example: Histories of AI usually start the clock at the Dartmouth workshop of 1956.
origin: >-
  The proposal, drafted in 1955 by McCarthy, then a young assistant professor of mathematics at
  Dartmouth, is the earliest known use of the phrase 'artificial intelligence'. McCarthy later said
  he chose the name partly to keep the new field distinct from [[cybernetics|cybernetics]] and
  automata theory. The Rockefeller Foundation granted $7,500, a little over half of the $13,500
  requested.
year: 1956
note: >-
  Often called the Dartmouth Conference, though it was an extended working session rather than a
  conference with papers. The proposal's expectation that a 'significant advance' could come from
  one summer's work is a classic example of early optimism about AI.
