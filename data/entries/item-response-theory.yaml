term: item response theory
id: item-response-theory
pos: n.
also:
  - IRT
  - latent trait theory
  - Rasch model
  - 1PL
  - 2PL
  - 3PL
domain: eval
domains:
  - math
level: specialist
plain: >-
  A set of statistical models from educational testing that work out both how able each test-taker
  is and how hard each question is from who answered what correctly; now also used to evaluate AI
  models.
senses:
  - definition: >-
      A family of statistical models that explain each person's response to each test item by a
      latent ability θ of the respondent and by parameters of the item. In the standard logistic
      models, the probability of a correct answer rises along an S-shaped item characteristic curve
      as θ exceeds the item's difficulty b; the curve's steepness is the item's discrimination a,
      and a floor c allows for lucky guesses (the one-, two- and three-parameter logistic models,
      the first equivalent to the Rasch model). Fitted jointly over many respondents and items, IRT
      places abilities and difficulties on a common scale, exposes uninformative or mislabeled items
      and underlies computerized adaptive testing. In AI evaluation, models play the test-takers:
      IRT is used to find which [[benchmark|benchmark]] items actually separate models, to estimate
      a model's full score from a small, well-chosen subset (as in tinyBenchmarks) and to link
      scores across benchmarks.
    example: >-
      The IRT fit showed that a third of the benchmark's items were too easy to separate any of the
      frontier models.
formula_latex: P(X_{ij} = 1 \mid \theta_i) = c_j + \frac{1 - c_j}{1 + e^{-a_j(\theta_i - b_j)}}
origin: >-
  Grew out of mid-20th-century psychometrics: Frederic Lord's 1952 monograph on test scores, Georg
  Rasch's 1960 model, and Allan Birnbaum's logistic models in Lord and Melvin Novick's 1968
  textbook. The name 'item response theory' gradually displaced 'latent trait theory' and was
  entrenched by Lord's 1980 book. John Lalor, Hao Wu and Hong Yu were among the first to apply IRT
  to NLP evaluation, in 2016.
year: 1952
note: >-
  Pairwise rating systems such as the [[bradley-terry-model|Bradley–Terry model]] behind arena
  leaderboards are close relatives: both posit a latent strength and a logistic link. IRT assumes a
  stable underlying trait; whether AI capability is one-dimensional enough for that is debated, and
  multidimensional IRT variants exist.
