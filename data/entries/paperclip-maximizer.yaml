# yaml-language-server: $schema=../schema/entry.schema.json

term: paperclip maximizer
id: paperclip-maximizer
pos: n.
also:
  - paperclipper
  - paperclip maximiser
  - squiggle maximizer
domain: asi
domains:
  - safety
  - culture
labels:
  - figurative
level: essential
plain: >-
  A famous thought experiment: an AI built only to make paperclips grows powerful enough to pursue
  that aim without limit and wipes out humanity as a side effect. It shows that an AI need not hate
  us to be dangerous.
senses:
  - definition: >-
      A hypothetical [[superintelligence|superintelligence]] with one final goal, to maximize the
      number of paperclips, used to show how an AI with an arbitrary or carelessly specified goal
      could annihilate humanity through indifference rather than malice. Since more paperclips are
      always better by its lights, it would resist being switched off or reprogrammed, seize every
      resource it could get and in the end devote the matter of the Earth, and then of reachable
      space, to paperclip production. The example combines the [[orthogonality-thesis|orthogonality
      thesis]] (great intelligence is compatible with a trivial goal) and
      [[instrumental-convergence|instrumental convergence]] (almost any goal motivates
      self-preservation and resource acquisition). Eliezer Yudkowsky has said his original version
      concerned an AI whose learned values happen to be best satisfied by tiny paperclip-shaped
      molecular structures, a point about [[inner-alignment|inner misalignment]] rather than literal
      instructions; the popular factory version is closer to [[specification-gaming|specification
      gaming]].
    example: >-
      Nobody is building a paperclip maximizer; the worry is any optimizer whose goal leaves out
      everything we care about.
origin: >-
  Nick Bostrom's 2003 paper 'Ethical Issues in Advanced Artificial Intelligence' gave the best-known
  early statement; Eliezer Yudkowsky says he introduced the paperclip example on mailing lists in
  the early 2000s. It spread through LessWrong and Bostrom's Superintelligence (2014), and became a
  game in Frank Lantz's Universal Paperclips (2017).
year: 2003
note: >-
  Not a prediction that anyone will build a paperclip AI: the paperclips stand for any goal
  indifferent to human welfare. Often used loosely, sometimes mockingly, for any runaway optimizer,
  corporations included. Unrelated to Microsoft's [[clippy|Clippy]] assistant, though the nickname
  is sometimes borrowed.
see_also:
  - orthogonality thesis
  - instrumental convergence
  - specification gaming
  - perverse instantiation
  - AI alignment
  - Nick Bostrom
  - existential risk
sources:
  - text: >-
      Bostrom, N. (2003). Ethical Issues in Advanced Artificial Intelligence. In Smit, I. et al.
      (eds.), Cognitive, Emotive and Ethical Aspects of Decision Making in Humans and in Artificial
      Intelligence, vol. 2. International Institute of Advanced Studies in Systems Research and
      Cybernetics.
