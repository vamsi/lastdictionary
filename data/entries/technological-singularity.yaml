term: technological singularity
id: technological-singularity
pos: n.
also:
  - the singularity
  - singularity
  - singularitarian
  - singularitarianism
domain: asi
domains:
  - hist
  - culture
labels:
  - contested
level: essential
plain: >-
  A moment some people expect in the future when technology, usually AI smarter than us, starts
  changing the world so fast and so deeply that we cannot see past it.
senses:
  - definition: >-
      The hypothesized moment when the creation of smarter-than-human intelligence, or another
      runaway acceleration, would make technological change outpace human comprehension, so that the
      world beyond it could not be anticipated from this side. The name borrows from mathematics and
      physics, where a singularity is a point at which a function or model breaks down. Eliezer
      Yudkowsky distinguished three schools that share the word: an event-horizon school
      ([[vernor-vinge|Vernor Vinge]]: once minds smarter than ours exist, our predictions fail), an
      accelerating-change school ([[ray-kurzweil|Ray Kurzweil]]: exponential trends in computing
      culminate around 2045 in a merger of human and machine intelligence) and an
      [[intelligence-explosion|intelligence explosion]] school (I. J. Good: self-improving AI
      produces a runaway). In current AI discourse 'the singularity' usually means the
      intelligence-explosion version. Critics call the idea unfalsifiable or quasi-religious, a
      'rapture of the nerds', a jibe usually traced to the novelist Ken MacLeod; defenders reply
      that it names a real limit on forecasting.
    example: >-
      Whether or not you believe in the singularity, the forecasting problem it points to is real.
origin: >-
  Stanislaw Ulam's 1958 tribute to John von Neumann recalls von Neumann remarking that accelerating
  technological progress seemed to approach an essential singularity in human history. Vernor Vinge
  tied the idea to superhuman intelligence in a 1983 Omni column and his 1993 essay 'The Coming
  Technological Singularity'; Ray Kurzweil's The Singularity Is Near (2005) popularized it.
year: 1958
note: >-
  People who expect or work toward it are called singularitarians. Sam Altman's 2025 essay 'The
  Gentle Singularity' argued that the transition may feel gradual from the inside. Not to be
  confused with a gravitational singularity, the source of the metaphor's 'event horizon'.
