term: Joy Buolamwini
id: joy-buolamwini
sort_as: Buolamwini Joy
pos: prop. n.
pronunciation: BWOH-lahm-WEE-nee
domain: people
domains:
  - society
  - percep
level: core
dates: b. 1990
plain: >-
  A Canadian-American computer scientist and activist whose research showed that face-analysis
  software works far worse on darker-skinned women, and who founded the Algorithmic Justice League.
senses:
  - definition: >-
      Canadian-born American computer scientist and campaigner against bias in AI systems, who
      founded the Algorithmic Justice League in 2016. As a graduate student at the MIT Media Lab she
      found that face-tracking software failed to detect her dark-skinned face until she put on a
      white mask, a bias she called the 'coded gaze'. Her thesis study [[gender-shades|Gender
      Shades]] (2018, with [[timnit-gebru|Timnit Gebru]]) audited commercial gender-classification
      systems from IBM, Microsoft and Face++ and found error rates of up to about 35 percent for
      darker-skinned women against under 1 percent for lighter-skinned men; a 2019 follow-up with
      Inioluwa Deborah Raji extended the audit to Amazon. The audits became reference points in
      debates on [[algorithmic-bias|algorithmic bias]] and [[facial-recognition|facial
      recognition]]: she testified to the US Congress in 2019, and in 2020 IBM, Amazon and Microsoft
      stopped or paused sales of the technology to police. Her work features in the documentary
      'Coded Bias' (2020) and her book 'Unmasking AI' (2023).
see_also:
  - Gender Shades
  - algorithmic bias
  - facial recognition
  - Timnit Gebru
  - AI audit
  - algorithmic fairness
sources:
  - text: >-
      Buolamwini, J. & Gebru, T. (2018). Gender Shades: Intersectional Accuracy Disparities in
      Commercial Gender Classification. Proceedings of Machine Learning Research 81: 77–91.
  - text: >-
      Buolamwini, J. (2023). Unmasking AI: My Mission to Protect What Is Human in a World of
