  - sec
  - eval
level: specialist
plain: >-
  An Indian-American computer scientist at Princeton who studies AI's real-world effects and argues
  that AI is a 'normal technology' whose impact will unfold gradually.
senses:
  - definition: >-
      Indian-American computer scientist at Princeton University, where he directs the Center for
      Information Technology Policy. He first became known for privacy research, notably showing
      with Vitaly Shmatikov (2008) that supposedly anonymous [[netflix-prize|Netflix Prize]] ratings
      could be re-identified, and for measuring online tracking; he co-wrote textbooks on
      cryptocurrencies and, with Solon Barocas and Moritz Hardt, on fairness in machine learning.
      With Sayash Kapoor he documented widespread [[data-leakage|data leakage]] errors in
      machine-learning-based science (2023) and wrote 'AI Snake Oil' (2024), which separates
      generative AI from often-ineffective [[predictive-ai|predictive AI]] used to make decisions
      about people, and the essay [[ai-as-normal-technology|AI as Normal Technology]] (2025), which
      argues that AI's effects will unfold over decades through gradual adoption, like electricity
      or the internet, rather than through sudden superintelligence. He is a prominent critic of
      [[ai-hype|AI hype]].
