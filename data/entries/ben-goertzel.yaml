term: Ben Goertzel
id: ben-goertzel
sort_as: Goertzel Ben
pos: prop. n.
also:
  - Benjamin Goertzel
pronunciation: GERT-zel
domain: people
domains:
  - asi
  - sym
level: specialist
dates: b. 1966
plain: >-
  An American AI researcher who made 'artificial general intelligence' a widely used name and built
  a research community around the goal of human-like, broadly capable AI.
senses:
  - definition: >-
      American AI researcher and entrepreneur who helped make
      [[artificial-general-intelligence|artificial general intelligence]] (AGI) the name of a
      research program. Taking up a phrase suggested by [[shane-legg|Shane Legg]], he and Cassio
      Pennachin titled their edited volume 'Artificial General Intelligence' (published 2007), and
      from 2008 he organized the annual AGI conference series, gathering researchers who sought
      broad, human-level machine intelligence when most of the field pursued [[narrow-ai|narrow
      AI]]. Trained as a mathematician (PhD, Temple University), he developed integrative
      [[cognitive-architecture|cognitive architectures]] — Novamente and the open-source OpenCog
      framework (2008) — that combine probabilistic logic, evolutionary learning and neural
      components. He was chief scientist of Hanson Robotics, maker of the humanoid robot Sophia, and
      in 2017 founded SingularityNET, a blockchain-based marketplace for AI services, which joined
      the Artificial Superintelligence Alliance in 2024. He is a prominent advocate of
      [[transhumanism|transhumanism]].
