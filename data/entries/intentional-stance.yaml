term: intentional stance
id: intentional-stance
pos: n.
also:
  - intentional system
  - design stance
  - physical stance
domain: mind
domains:
  - agents
level: core
plain: >-
  Predicting what something will do by treating it as if it had beliefs and goals — as we do with
  people, and often with chess programs and chatbots — whatever is really going on inside.
senses:
  - definition: >-
      A strategy for predicting and explaining what a system will do by crediting it with
      rationality: one works out which beliefs and desires would make sense for something in its
      position, with its apparent purposes, and expects it to act on them. Daniel Dennett contrasted
      it with the physical stance (predicting from physics and chemistry) and the design stance
      (predicting from what the system was built to do). On his view, any system whose behavior can
      be predicted reliably and in rich detail from the intentional stance is an intentional system
      and really has beliefs and desires in the only sense that matters, a position between realism
      and instrumentalism about minds. The stance is routinely taken toward chess programs and
      [[ai-agent|AI agents]], and researchers debate whether such talk is useful shorthand, a real
      attribution of [[goal-directedness|goal-directedness]], or a source of misleading
      [[anthropomorphism|anthropomorphism]].
    example: >-
      Taking the intentional stance — the agent wants the tests to pass — predicted its shortcut
      better than any inspection of its weights.
origin: >-
  Introduced by Daniel Dennett in 'Intentional Systems' (Journal of Philosophy, 1971) and developed
  in his book The Intentional Stance (1987).
year: 1971
see_also:
  - intentionality
  - anthropomorphism
  - theory of mind
  - goal-directedness
  - problem of other minds
  - simulator theory
contrast:
  - anthropomorphism
sources:
  - text: >-
      Dennett, D. C. (1971). Intentional Systems. The Journal of Philosophy 68(4), 87–106.
  - text: Dennett, D. C. (1987). The Intentional Stance. MIT Press.
