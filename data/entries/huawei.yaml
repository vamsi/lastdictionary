pronunciation: HWAH-way
domain: orgs
domains:
  - hw
  - gov
level: core
plain: >-
  A Chinese technology giant, known for telecom equipment and phones, that designs China's leading
  homegrown AI chips despite US trade restrictions.
senses:
  - definition: >-
      A Chinese technology company, the world's largest maker of telecommunications network
      equipment, that has become China's leading designer of AI accelerators. Its Ascend chips,
      designed by its HiSilicon unit, together with the MindSpore framework and the CANN software
      stack, form the main domestic alternative in China to [[nvidia|Nvidia]] hardware and
      [[cuda|CUDA]]; in 2025 it introduced the CloudMatrix 384, a rack-scale system linking 384
      Ascend processors that offsets weaker individual chips with scale. Placed on the US Entity
      List in 2019, Huawei lost access to [[tsmc|TSMC]]'s manufacturing in 2020 and has since relied
      on Chinese foundries such as SMIC, making it the focal point of
      [[export-controls-on-ai-chips|export controls on AI chips]] and of debates over China's
      technological self-sufficiency. It also develops the Pangu family of AI models.
origin: >-
  Founded in 1987 in Shenzhen by Ren Zhengfei, a former engineer in the People's Liberation Army,
  initially to resell telephone switches; it grew into a global supplier of networks and smartphones
  and announced its Ascend AI chips in 2018.
year: 1987
