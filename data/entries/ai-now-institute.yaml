level: specialist
plain: >-
  A research and advocacy group that examines who is harmed by AI and argues that the deeper problem
  is the power of a few big technology companies, which it wants curbed by law.
senses:
  - definition: >-
      A policy research institute whose analysis of AI centers less on the technology itself than on
      who controls it and who bears its costs. Its early work documented
      [[algorithmic-bias|algorithmic bias]] and the use of automated systems in criminal justice,
      welfare and employment, and it proposed the [[algorithmic-impact-assessment|algorithmic impact
      assessment]] as an accountability tool for public agencies (2018). Its annual reports and
      later policy work argue that AI's harms stem as much from industry structure as from technical
      flaws, emphasizing market [[concentration-of-power|concentration of power]] over data and
      compute, labor, surveillance and the environmental costs of [[ai-data-center|data centers]],
      and call for using competition and privacy law against what it terms tech power. In debates
      framed around [[existential-risk|existential risk]], it argues that present-day harms deserve
      priority.
origin: >-
  Founded in 2017 at New York University by Kate Crawford and Meredith Whittaker, following a 2016
  symposium they organized with the White House Office of Science and Technology Policy. It later
  became independent of NYU, with Amba Kak and Sarah Myers West as co-executive directors.
year: 2017
