level: core
plain: >-
  A voluntary rulebook, published by the EU in 2025, that makers of large AI models can sign to show
  they follow the EU AI Act's rules on transparency, copyright and safety.
senses:
  - definition: >-
      A set of voluntary commitments, provided for by the [[eu-ai-act|EU AI Act]], that providers of
      [[general-purpose-ai-model|general-purpose AI models]] can sign as a way of showing they meet
      their obligations until [[harmonised-standards|harmonised standards]] exist; independent
      chairs wrote it through several drafting rounds with about 1,000 stakeholders, and the
      [[ai-office|AI Office]] ran the process. It has three chapters. Transparency provides a model
      documentation form for information owed to the AI Office and to downstream providers.
      Copyright commits signatories to a copyright policy, to respecting machine-readable opt-outs
      such as robots.txt when crawling the web, and to mitigating infringing outputs. Safety and
      Security, for providers of [[general-purpose-ai-model-with-systemic-risk|models with systemic
      risk]], requires a safety and security framework, systemic-risk identification and analysis —
      including model evaluations and [[red-teaming|red teaming]] — risk-acceptance criteria,
      mitigations, model reports to the AI Office, [[serious-incident|serious incident]] reporting
      and cybersecurity. Providers that do not sign must show compliance by other adequate means and
      can expect closer scrutiny.
    example: >-
      Rather than sign the General-Purpose AI Code of Practice, the provider documented its
      compliance its own way.
origin: >-
  Drafting began in September 2024 under thirteen independent chairs and vice-chairs, among them
  Yoshua Bengio; drafts appeared in November 2024, December 2024 and March 2025, and the final text
  was published on 10 July 2025, two months late. The Commission and the AI Board then assessed it
  as an adequate voluntary tool.
year: 2025
note: >-
  As of October 2026, 22 providers — including Amazon, Anthropic, Google, IBM, Microsoft, Mistral AI
  and OpenAI — had signed the whole code and xAI only its Safety and Security chapter; Meta
  declined. A separate code covers the marking and labelling of AI-generated content under the Act's
  [[transparency-obligations|transparency obligations]].
