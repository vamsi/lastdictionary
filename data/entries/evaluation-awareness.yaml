      Needham, J., Edkins, G., Pimpale, G., Bartsch, H. & Hobbhahn, M. (2025). Large Language Models
      Often Know When They Are Being Evaluated. arXiv:2505.23836.
    url: https://arxiv.org/abs/2505.23836
as_of: 2026-10
