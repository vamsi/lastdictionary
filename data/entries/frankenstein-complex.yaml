term: Frankenstein complex
id: frankenstein-complex
pos: n.
also:
  - Frankenstein syndrome
domain: culture
domains:
  - robot
  - society
level: specialist
plain: >-
  Isaac Asimov's name for the fear that intelligent machines will turn on the people who made them,
  after Mary Shelley's novel about a scientist destroyed by his own creation.
senses:
  - definition: >-
      The fear that artificial beings — robots and, by extension, AI systems — will rebel against,
      supplant or destroy their creators. Isaac Asimov named it to criticize what he saw as a lazy
      plot convention of early science fiction and an irrational public prejudice; his own robot
      stories, governed by the [[three-laws-of-robotics|Three Laws of Robotics]], portray machines
      built with safeguards and treat the complex as a commercial obstacle robot makers must manage.
      In later usage the term describes cultural anxieties about AI in surveys and media studies,
      sometimes contrasted with friendlier depictions of robots in Japanese popular culture, and is
      invoked, often dismissively, against arguments about [[existential-risk|existential risk]];
      risk researchers reply that their concern rests on technical arguments about goals and control
      rather than on a fictional trope.
    example: >-
      Not every worry about autonomous systems is a Frankenstein complex; some are engineering
      problems.
origin: >-
  Coined by Isaac Asimov and used in his robot fiction and essays, though the work in which it first
  appeared is not well documented; the name alludes to Mary Shelley's Frankenstein; or, The Modern
  Prometheus (1818), whose scientist is destroyed by the creature he made. Public suspicion of
  robots drives stories such as 'Little Lost Robot' (1947), and the term recurs in Asimov's later
  robot novels and essays.
see_also:
