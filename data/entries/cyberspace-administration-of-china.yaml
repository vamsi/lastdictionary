term: Cyberspace Administration of China
id: cyberspace-administration-of-china
pos: prop. n.
also:
  - CAC
  - Office of the Central Cyberspace Affairs Commission
  - 国家互联网信息办公室
domain: gov
domains:
  - orgs
level: core
plain: >-
  China's top internet authority, in charge of online censorship as well as regulation, which also
  writes and enforces most of the country's AI rules, such as the registration of chatbots and
  recommendation algorithms.
senses:
  - definition: >-
      China's national internet regulator, which shares staff and leadership with the Chinese
      Communist Party's Central Cyberspace Affairs Commission ('one institution, two names'), and
      the lead authority for the country's AI rules. It oversees online content, cybersecurity, data
      protection and cross-border data transfers, and drafted or co-issued the main AI-specific
      regulations: the algorithm-recommendation provisions (2022), the [[deep-synthesis|deep
      synthesis]] provisions (2023), the
      [[interim-measures-for-the-management-of-generative-ai-services|Interim Measures for the
      Management of Generative AI Services]] (2023), the
      [[ai-generated-content-labeling|AI-generated content labeling]] measures (2025) and 2026
      measures on human-like interactive AI services such as AI companions. It runs the
      [[algorithm-filing|algorithm filing]] system and the security assessments that generative
      models must pass before public launch, which include testing whether models produce
      politically sensitive content. Other bodies, notably the Ministry of Industry and Information
      Technology and the national cybersecurity standards committee TC260, share responsibility for
      AI standards, industrial policy and ethics review.
    example: >-
      The Cyberspace Administration of China summoned the company over its chatbot's answers about
      history.
origin: >-
  Established in 2011 as the State Internet Information Office and reorganized in 2014, under Xi
  Jinping, as the executive office of a new central leading group on cybersecurity and
  informatization, which was upgraded to the Central Cyberspace Affairs Commission in 2018.
year: 2014
note: >-
  Its central role makes Chinese AI regulation fast-moving and agency-driven: rules usually arrive
  as departmental measures within months rather than as legislation, though State Council
  legislative plans have listed a comprehensive AI law since 2023.
