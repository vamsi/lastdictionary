  - hist
level: specialist
dates: b. 1947
plain: >-
  An American neuroscientist who co-invented the Boltzmann machine with Geoffrey Hinton, built an
  early network that learned to read aloud, and helped found the NeurIPS conference community.
senses:
  - definition: >-
      American computational neuroscientist at the Salk Institute and the University of California,
      San Diego, and a founder of modern neural-network research. A physics doctoral student of
      [[john-hopfield|John Hopfield]] at Princeton, he devised the [[boltzmann-machine|Boltzmann
      machine]] with [[geoffrey-hinton|Geoffrey Hinton]] (1983–85), a stochastic network that learns
      a probability distribution over its inputs, and with Charles Rosenberg built NETtalk (1987), a
      network that learned to pronounce English text and became a widely publicized demonstration of
      [[connectionism|connectionism]]. With Tony Bell he developed the infomax algorithm for
      independent component analysis (1995). He founded the journal Neural Computation (1989), has
      long presided over the foundation that runs the [[neurips|NeurIPS]] conference, and wrote 'The
      Deep Learning Revolution' (2018). He is a member of all three US national academies, of
      sciences, engineering and medicine, and shared the 2024 Brain Prize for computational and
      theoretical neuroscience.
