  - UN High-level Advisory Body on AI
  - Governing AI for Humanity
domain: gov
domains:
  - orgs
labels:
  - historical
level: specialist
plain: >-
  A group of experts set up by the UN Secretary-General in 2023 to advise on governing AI worldwide;
  its 2024 report led to the UN's AI science panel and global dialogue.
senses:
  - definition: >-
      A multistakeholder body of 39 experts from government, industry, academia and civil society,
      convened by UN Secretary-General António Guterres from October 2023 to recommend how AI should
      be governed internationally. Its final report, Governing AI for Humanity (September 2024),
      argued that a global governance deficit left most countries out of decisions about AI and
      proposed seven measures: an international scientific panel on AI, a policy dialogue on AI
      governance, an AI standards exchange, a capacity-development network, a global fund for AI, a
      global AI data framework and a small AI office in the UN Secretariat. The first two were taken
      up in the Global Digital Compact and created in 2025 as the
      [[independent-international-scientific-panel-on-ai|Independent International Scientific Panel
      on AI]] and the [[global-dialogue-on-ai-governance|Global Dialogue on AI Governance]].
    example: >-
      The High-level Advisory Body on Artificial Intelligence recommended a scientific panel modeled
      loosely on the IPCC.
origin: >-
  Announced by the Secretary-General on 26 October 2023; it issued an interim report in December
  2023 and its final report in September 2024, shortly before the Summit of the Future.
year: 2023
note: >-
  Its mandate is complete. It stopped short of proposing an international AI agency, leaving
  stronger institutions for later consideration if risks grew.
