  - character-level model
  - Byte Latent Transformer
  - BLT
  - ByT5
domain: llm
domains:
  - dl
level: specialist
plain: >-
  A language model that reads raw bytes — the basic units computers use to store text — instead of
  tokens from a fixed list, avoiding a separate tokenizer but making inputs much longer.
senses:
  - definition: >-
      A [[language-model|language model]] that operates directly on UTF-8 bytes (a vocabulary of 256
      values plus a few control symbols) rather than on subword [[token|tokens]], removing the
      learned [[tokenizer|tokenizer]]. Benefits include uniform treatment of every language and
      script, robustness to misspellings and noise, and direct access to characters, which helps
      spelling, counting and string manipulation. The cost is sequences several times longer than
      subword sequences, multiplying attention cost; designs therefore compress bytes inside the
      network into larger units. ByT5 (2021) showed a byte-level [[t5|T5]] could be competitive;
      MegaByte (2023) used fixed-size patches in a two-level model; Meta's Byte Latent Transformer
      (December 2024) groups bytes into variable-length patches according to the entropy of the next
      byte, and in the first FLOP-controlled scaling study of byte-level models (up to 8 billion
      parameters and 4 trillion training bytes) reported matching tokenizer-based models with better
      inference efficiency and robustness.
    example: >-
      The byte-level model never fails at counting the r's in 'strawberry', but it is slower per
      word.
origin: >-
  Character-level recurrent language models drew attention with work by Ilya Sutskever, James
  Martens and Geoffrey Hinton (2011). ByT5, by Linting Xue and colleagues at Google (2021), revived
  byte-level transformers, and Meta's Byte Latent Transformer (Artidoro Pagnoni and colleagues,
  2024) renewed interest in tokenizer-free scaling.
year: 2021
