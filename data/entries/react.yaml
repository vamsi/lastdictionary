      Yao, S., Zhao, J., Yu, D., Du, N., Shafran, I., Narasimhan, K. & Cao, Y. (2022). ReAct:
      Synergizing Reasoning and Acting in Language Models. arXiv:2210.03629 (ICLR 2023).
    url: https://arxiv.org/abs/2210.03629
