level: specialist
plain: >-
  A US program to give university researchers, students and small companies shared access to the
  costly computers, data and AI models that are otherwise mostly available to big technology firms.
senses:
  - definition: >-
      A planned US resource meant to put the ingredients of AI research — computing time, datasets,
      pretrained models, software and training — within reach of academic researchers, educators and
      others outside well-funded companies. The National AI Initiative Act of 2020 created a task
      force, co-chaired by the National Science Foundation (NSF) and the White House Office of
      Science and Technology Policy, whose January 2023 final report recommended a $2.6 billion,
      six-year build-out. The NSF launched a NAIRR Pilot on January 24, 2024, as directed by
      [[executive-order-14110|Executive Order 14110]], with resources contributed by federal
      agencies and private partners including Nvidia, Microsoft, OpenAI and Anthropic, and has
      allocated compute and model access to hundreds of research projects.
      [[america-s-ai-action-plan|America's AI Action Plan]] (2025) endorsed it; in September 2026
      the NSF launched a NAIRR Operations Center as a step from the pilot toward a lasting resource,
      while the CREATE AI Act, reintroduced in the Senate in June 2026, would establish the NAIRR in
      statute.
    example: Our lab got its fine-tuning compute through a NAIRR Pilot allocation.
origin: >-
  Grew from the 'National Research Cloud' proposed in 2020 by Stanford's Institute for
  Human-Centered Artificial Intelligence (John Etchemendy and [[fei-fei-li|Fei-Fei Li]]), an idea
  written into the National AI Initiative Act, enacted on January 1, 2021 within the annual defense
  authorization law.
year: 2020
