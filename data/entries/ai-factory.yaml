term: AI factory
id: ai-factory
pos: n.
also:
  - AI factories
  - AI gigafactory
  - AI Factory Antenna
domain: hw
domains:
  - gov
  - society
labels:
  - emerging
level: core
plain: >-
  A data center built to turn electricity and data into AI models and AI answers at industrial
  scale; in Europe, also a public supercomputing hub that helps companies and researchers build AI.
senses:
  - context: Industry
    definition: >-
      A data center conceived as a production plant whose inputs are electricity and data and whose
      output is machine intelligence, measured in [[token|tokens]] generated or models trained — the
      framing [[nvidia|Nvidia]] uses for its integrated designs of accelerators, networking,
      software and cooling (see [[ai-data-center|AI data center]]). The metaphor shifts attention
      from storing and serving data, the job of a conventional data center, to throughput and cost
      per token, and supports the argument that AI computing capacity is industrial infrastructure
      comparable to power plants.
    example: Every rack in the new AI factory is judged by tokens per second per megawatt.
  - context: European Union policy
    definition: >-
      One of a network of publicly funded hubs built around AI-optimized supercomputers of the
      European High Performance Computing Joint Undertaking (EuroHPC), offering computing time,
      data, skills training and free support to start-ups, small firms and researchers developing AI
      models. By late 2025 the EU had selected 19 AI Factories and 13 smaller satellite 'AI Factory
      Antennas', and planned much larger 'AI gigafactories', each with on the order of 100,000
      advanced chips, funded through its InvestAI initiative.
origin: >-
  Popularized from about 2023 by Jensen Huang, Nvidia's chief executive, in keynotes describing data
  centers as factories that manufacture intelligence. The EU adopted the term for EuroHPC's program,
  selecting its first seven AI Factories in December 2024; the European Commission announced
  InvestAI, including €20 billion for AI gigafactories, in February 2025.
year: 2023
