plain: >-
  A division Meta created in 2025 to pursue superintelligence, gathering all of the company's AI
  teams under new leaders recruited in an expensive hiring campaign.
senses:
  - definition: >-
      The umbrella organization for Meta Platforms' AI work, created in mid-2025 to build frontier
      models and, in Mark Zuckerberg's phrase, 'personal superintelligence' for Meta's users. An
      August 2025 reorganization divided it into four groups: a small frontier-model unit (TBD Lab),
      the FAIR research lab of [[meta-ai|Meta AI]], a products and applied-research group, and an
      infrastructure group. Its creation followed the disappointing reception of Llama 4 and
      accompanied Meta's purchase of a 49 percent non-voting stake in [[scale-ai|Scale AI]], whose
      founder Alexandr Wang became Meta's chief AI officer, and a recruiting drive that hired dozens
      of researchers from OpenAI, Google DeepMind, Apple and other labs with unusually large pay
      offers. About 600 positions were cut in October 2025. Its first model, Muse Spark, announced
      on 8 April 2026 to power the Meta AI assistant, was released as a proprietary model rather
      than with downloadable weights.
origin: >-
  Announced by Mark Zuckerberg in an internal memo on 30 June 2025, with Alexandr Wang as chief AI
  officer and Nat Friedman, former chief executive of GitHub, leading AI products.
year: 2025
