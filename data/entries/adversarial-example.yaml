      Szegedy, C., Zaremba, W., Sutskever, I., Bruna, J., Erhan, D., Goodfellow, I. & Fergus, R.
      (2014). Intriguing properties of neural networks. ICLR 2014. arXiv:1312.6199.
  - text: >-
      Ilyas, A., Santurkar, S., Tsipras, D., Engstrom, L., Tran, B. & Madry, A. (2019). Adversarial
      Examples Are Not Bugs, They Are Features. NeurIPS 2019.
