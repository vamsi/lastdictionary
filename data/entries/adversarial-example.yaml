# yaml-language-server: $schema=../schema/entry.schema.json

term: adversarial example
id: adversarial-example
pos: n.
also:
  - adversarial input
  - adversarial perturbation
  - adversarial image
domain: sec
domains:
  - dl
  - percep
level: essential
plain: >-
  An input altered on purpose, often too slightly for people to notice, so that an AI model gets it
  badly wrong — like a panda photo that a classifier confidently calls a gibbon.
senses:
  - definition: >-
      An input x′ = x + δ crafted to make a model err, typically by adding a perturbation δ that is
      small under some norm (for example ‖δ‖∞ ≤ ε), so the input looks unchanged to humans while the
      prediction changes. Perturbations are found by maximizing the model's loss with respect to the
      input — using [[gradient|gradients]] in [[white-box-attack|white-box]] settings
      ([[fast-gradient-sign-method|FGSM]], [[projected-gradient-descent-attack|PGD]],
      [[carlini-wagner-attack|Carlini–Wagner]]) or queries and surrogate models in
      [[black-box-attack|black-box]] ones. Adversarial examples exist for images, audio, text,
      malware detectors and [[reinforcement-learning|reinforcement learning]] policies; they often
      transfer between models and can be made physical ([[adversarial-patch|patches]], 3D-printed
      objects). Proposed explanations include locally linear behavior in high dimensions and
      reliance on predictive but non-robust features. Adversarial prompts against
      [[large-language-model|language models]] are the textual analogue (see
      [[jailbreak|jailbreak]]).
    example: >-
      A perturbation of 4/255 per pixel took the undefended classifier from 94% accuracy to under 1%.
formula_latex: x_{\text{adv}} = \arg\max_{\|x' - x\|_p \le \epsilon} \; \mathcal{L}\big(f_\theta(x'), y\big)
origin: >-
  Introduced in its current sense by Christian Szegedy and colleagues in 'Intriguing properties of
  neural networks' (arXiv December 2013; ICLR 2014), which showed imperceptible perturbations
  fooling image classifiers. Battista Biggio and colleagues independently described gradient-based
  evasion of classifiers in 2013. Ian Goodfellow and colleagues' 2014 follow-up, with its
  panda-to-gibbon illustration, made the phenomenon famous.
year: 2013
note: >-
  'Adversarial' means deliberately constructed; the term is unrelated to
  [[generative-adversarial-network|GANs]]. Inputs that fool models without any optimization
  ('natural adversarial examples') and ordinary [[out-of-distribution|out-of-distribution]] failures
  are related but distinct.
see_also:
  - evasion attack
  - adversarial robustness
  - adversarial training
  - fast gradient sign method
  - adversarial patch
  - universal adversarial perturbation
  - adversarial machine learning
contrast:
  - out-of-distribution
sources:
