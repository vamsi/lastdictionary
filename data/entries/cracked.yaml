labels:
  - slang
level: specialist
plain: >-
  Tech slang praising someone as exceptionally, almost unfairly, skilled; a 'cracked engineer' is a
  prodigy who ships remarkable work very fast.
senses:
  - definition: >-
      Exceptionally skilled, productive or talented, especially at engineering or research; applied
      to individuals ('a cracked engineer'), teams and occasionally models. In AI-industry usage the
      word connotes youth, intensity and unconventional credentials — a cracked engineer may lack
      degrees but ship at extraordinary speed — and it pervades recruiting rhetoric, founders'
      descriptions of small elite teams, and talk of the 2025 talent war, when frontier labs offered
      individual researchers pay packages reported in the tens or hundreds of millions of dollars.
      It is also used ironically to mock hustle culture and the mythology of the lone genius.
    example: They only have six people, but every one of them is cracked.
origin: >-
  From gaming slang of the late 2010s, notably among Fortnite players, where a 'cracked' player was
  implausibly skilled; the sense may draw on 'cracked' (hacked) software or 'cracked out', and
  echoes the much older 'crack' meaning first-rate, as in 'crack shot'. It migrated to startup and
  AI social media around 2022–2023 and was ubiquitous in Silicon Valley hiring talk by 2024–2025.
