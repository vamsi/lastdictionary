term: Physical Intelligence
id: physical-intelligence
pos: prop. n.
also:
  - Pi
  - π (company)
domain: orgs
domains:
  - robot
level: specialist
plain: >-
  A San Francisco company, founded in 2024, that builds general-purpose AI 'brains' meant to control
  many different kinds of robots doing many different tasks.
senses:
  - definition: >-
      An American robotics AI company that develops [[robot-foundation-model|robot foundation
      models]]: single [[generalist-robot-policy|generalist policies]] intended to control many
      kinds of robot bodies across many tasks. Its [[pi0|π0]] model (October 2024), a
      [[vision-language-action-model|vision-language-action model]] that pairs a pretrained
      vision-language model with an 'action expert' producing continuous motor commands by
      [[flow-matching|flow matching]], was trained on [[cross-embodiment-learning|data from many
      robot types]] and demonstrated tasks such as clearing tables, folding laundry and assembling
      boxes; its weights were released in February 2025. Successors include π0.5 (2025), which
      generalized to cleaning unfamiliar homes, and π*0.6 (2025), refined by
      [[reinforcement-learning|reinforcement learning]] from the robot's own experience.
origin: >-
  Founded in 2024 in San Francisco by a group of robot-learning researchers and entrepreneurs
  including Karol Hausman, its chief executive, Sergey Levine, Chelsea Finn, Brian Ichter and Lachy
  Groom; several had worked on Google's robotics research.
year: 2024
