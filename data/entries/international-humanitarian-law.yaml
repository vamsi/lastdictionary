term: international humanitarian law
id: international-humanitarian-law
pos: n.
also:
  - IHL
  - law of armed conflict
  - LOAC
  - laws of war
  - jus in bello
domain: gov
domains:
  - society
  - robot
labels:
  - legal
level: core
plain: >-
  The rules of international law that limit how wars may be fought, protecting civilians, the
  wounded and prisoners. They apply to every weapon, including ones that use AI.
senses:
  - definition: >-
      The body of international law, also called the law of armed conflict or jus in bello, that
      applies once a war or other armed conflict is under way, whoever started it. It restricts the
      weapons and tactics that may be used and shields those outside the fighting — civilians, and
      combatants who are wounded, sick or captured. Its main sources are the four Geneva Conventions
      (1949), their Additional Protocols (1977), the Hague Conventions and customary law. Core
      principles require attackers to distinguish combatants from civilians, to refrain from attacks
      expected to cause civilian harm excessive in relation to the anticipated military advantage
      (proportionality), and to take feasible precautions. Article 36 of Additional Protocol I
      obliges states to review whether new weapons can be used lawfully. In AI debates it is the
      yardstick for [[lethal-autonomous-weapons-system|autonomous weapons]] and AI decision-support
      for targeting: whether machines can apply these context-dependent judgments, and who is
      accountable when they fail.
    example: >-
      The weapons review found the targeting aid compatible with IHL only if a human approves every
      strike.
origin: >-
  Modern codification began with the first Geneva Convention (1864), inspired by Henry Dunant, and
  the Hague Conventions of 1899 and 1907. The name 'international humanitarian law', promoted by the
  International Committee of the Red Cross, came into general use in the 1970s, notably at the
  1974–1977 diplomatic conference that produced the Additional Protocols.
note: >-
  Distinct from international human rights law, which applies at all times, and from jus ad bellum,
  the law on when force may be used at all. Many AI-weapons debates turn on whether existing IHL
  suffices or a new treaty is needed.
see_also:
