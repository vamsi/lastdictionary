  - imputation
  - deduplication
  - label noise
  - quality filtering
  - anomaly detection
sources:
  - text: >-
      Rahm, E. & Do, H. H. (2000). Data Cleaning: Problems and Current Approaches. IEEE Data
      Engineering Bulletin 23(4).
