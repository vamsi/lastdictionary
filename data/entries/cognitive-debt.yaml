# yaml-language-server: $schema=../schema/entry.schema.json

term: cognitive debt
id: cognitive-debt
pos: n.
domain: society
domains:
  - mind
labels:
  - emerging
  - contested
level: specialist
plain: >-
  The idea that letting AI do your thinking or writing saves effort now but weakens your own
  thinking, memory and learning over time.
senses:
  - definition: >-
      The hypothesized long-term cost to a person's thinking, memory and learning that builds up
      when they habitually hand cognitive work to AI assistants — by analogy with technical debt,
      effort saved now is repaid later as weaker skills and understanding. The term comes from an
      MIT Media Lab study in which 54 participants wrote essays across several sessions, either
      unaided, with a search engine or with a chatbot, while EEG recorded their brain activity. The
      chatbot group was least able to quote its own essays, felt the least ownership of them and
      showed the weakest neural connectivity, and some differences persisted when its members later
      wrote without help. Critics point to the small sample, the narrow task and the paper's
      preprint status, and warn against reading it as proof of lasting harm.
    example: >-
      The teacher banned chatbots for first drafts, citing cognitive debt rather than cheating.
origin: >-
  Introduced by Nataliya Kosmyna, Pattie Maes and colleagues at the MIT Media Lab in the preprint
  'Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay
  Writing Task' (arXiv, 10 June 2025), which drew wide media attention.
year: 2025
note: >-
  Related to the older psychological idea of cognitive offloading — relying on external aids such as
  notes or devices to reduce mental effort — which is not harmful in itself; see
  [[deskilling|deskilling]].
see_also:
  - deskilling
  - overreliance
  - automation bias
  - AI literacy
  - workslop
  - augmentation
sources:
  - text: >-
      Kosmyna, N., … Maes, P. (2025). Your Brain on ChatGPT: Accumulation of Cognitive Debt when
      Using an AI Assistant for Essay Writing Task. arXiv:2506.08872.
    url: https://arxiv.org/abs/2506.08872
as_of: 2026-10
