level: essential
plain: >-
  OpenAI's AI chatbot, released free to the public in November 2022, which answers questions, writes
  and converses in everyday language. Its sudden popularity began the current AI boom.
senses:
  - definition: >-
      A conversational AI service from [[openai|OpenAI]], launched as a free research preview on 30
      November 2022, through which users interact with a [[large-language-model|large language
      model]] in a chat interface. The original version used a GPT-3.5 model fine-tuned for dialogue
      with supervised demonstrations and [[reinforcement-learning-from-human-feedback|reinforcement
      learning from human feedback]], following the [[instructgpt|InstructGPT]] recipe; later
      versions have run on [[gpt-4|GPT-4]], [[gpt-4o|GPT-4o]], the o-series
      [[reasoning-model|reasoning models]] such as [[openai-o1|OpenAI o1]], and [[gpt-5|GPT-5]] and
      its successors, adding web search, image understanding and generation, voice, file analysis,
      memory and agentic tools. It reached an estimated 100 million monthly users within about two
      months, then the fastest adoption of any consumer application, and by February 2026 it was
      reported to have about 900 million weekly users. Its release set off the competitive race
      among technology companies, and the surge of public and policy attention to AI, that followed.
    example: >-
      Within weeks of ChatGPT's launch, schools were rewriting their homework policies.
origin: >-
  Grew out of OpenAI's InstructGPT work and was announced in the blog post 'Introducing ChatGPT';
  the name joins 'chat' to GPT (generative pre-trained transformer). Greg Brockman reported a
  million users within five days. 'ChatGPT moment' soon became shorthand for a sudden leap in public
  awareness of a technology, as in 'a ChatGPT moment for robotics'.
year: 2022
note: >-
  Often used generically for any AI chatbot, as brand names drift into common nouns. Paid plans,
  beginning with Plus in February 2023 and later including business, enterprise and higher-priced
  Pro tiers, followed the free service.
