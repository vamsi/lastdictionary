term: language of thought hypothesis
id: language-of-thought-hypothesis
pos: n.
also:
  - LOTH
  - language of thought
  - LOT
  - Mentalese
domain: mind
domains:
  - sym
level: specialist
plain: >-
  The theory that we think in an inner, wordless mental language with its own symbols and grammar,
  which the brain manipulates when we reason, much as a computer manipulates code.
senses:
  - definition: >-
      The hypothesis, developed by Jerry Fodor, that we think in an inner symbolic medium structured
      like a language, 'Mentalese': a system of internal symbols with combinatorial syntax and
      compositional semantics, so that complex thoughts are built from simpler constituents by rule,
      as sentences are built from words. Thinking is then computation over these symbol structures,
      as in the classical [[computational-theory-of-mind|computational theory of mind]]. Fodor
      argued that only such a system explains the productivity of thought (its unbounded capacity
      for new thoughts) and its [[systematicity|systematicity]], and that learning concepts
      presupposes an innate representational medium. The hypothesis underlies classical
      [[symbolic-ai|symbolic AI]] and the [[physical-symbol-system-hypothesis|physical symbol system
      hypothesis]]; researchers continue to debate whether neural networks, including
      [[large-language-model|language models]], implement something like a language of thought,
      approximate one, or show that cognition can do without it.
origin: >-
  Set out and defended by Jerry Fodor in The Language of Thought (1975) and revisited in LOT 2: The
  Language of Thought Revisited (2008). The idea of an inner mental language has antecedents in
  medieval philosophy, notably William of Ockham.
year: 1975
see_also:
  - computational theory of mind
  - systematicity
  - physical symbol system hypothesis
  - symbolic AI
  - connectionism
  - intentionality
contrast:
  - connectionism
sources:
  - text: Fodor, J. A. (1975). The Language of Thought. Thomas Y. Crowell.
  - text: >-
      Fodor, J. A. (2008). LOT 2: The Language of Thought Revisited. Oxford University Press.
