term: effective altruism
id: effective-altruism
pos: n.
also:
  - EA
  - effective altruist
domain: culture
domains:
  - society
  - safety
level: core
plain: >-
  A movement that treats charity like a research problem, comparing causes by how much good each
  dollar or working hour achieves; many of its members came to rank risks from advanced AI as a top
  priority.
senses:
  - definition: >-
      A philosophy and social movement that treats doing good as a problem of measurement and
      comparison: estimate how much benefit each cause or intervention buys per dollar or hour, then
      back the best with donations, career choices or new organizations. Early priorities were
      global health (such as malaria prevention) and animal welfare; under the influence of
      [[longtermism|longtermism]], a growing share of attention and money went to reducing
      [[existential-risk|existential risk]], above all from misaligned AI. EA-aligned donors and
      researchers helped build the field of [[ai-safety|AI safety]], so 'EA' is also used — often
      pejoratively, by [[effective-accelerationism|accelerationists]] and some policymakers — as a
      label for safety advocates and their influence on AI governance.
    example: >-
      Half the safety grants in the field trace back to EA money, which is exactly what critics
      object to.
origin: >-
  The name was adopted in 2011 by a group around Giving What We Can and 80,000 Hours in Oxford —
  including William MacAskill and Toby Ord — when they incorporated the Centre for Effective
  Altruism; the ideas draw on Peter Singer's arguments about giving. The collapse in 2022 of FTX,
  whose founder Sam Bankman-Fried was a prominent EA donor, and debate over EA's role in the
  November 2023 OpenAI board crisis brought the movement under intense scrutiny.
year: 2011
note: >-
  Critics on the left object to its quantitative, philanthropic approach and its proximity to tech
  wealth; critics in industry argue that its focus on catastrophic AI risk distorts policy. Grouped
  by some critics with related ideologies under the contested acronym [[tescreal|TESCREAL]].
