plain: >-
  A German computer scientist who explained why early neural networks struggled to learn long
  sequences and, with Jürgen Schmidhuber, invented the LSTM network that solved the problem.
senses:
  - definition: >-
      German computer scientist, head of the Institute for Machine Learning at Johannes Kepler
      University Linz, Austria. His 1991 diploma thesis at the Technical University of Munich,
      supervised by [[jurgen-schmidhuber|Jürgen Schmidhuber]], gave the first formal analysis of the
      [[vanishing-gradient-problem|vanishing gradient problem]], explaining why
      [[recurrent-neural-network|recurrent networks]] trained by
      [[backpropagation-through-time|backpropagation through time]] fail to learn long-range
      dependencies. With Schmidhuber he then introduced [[long-short-term-memory|long short-term
      memory]] (LSTM, 1997), whose gated memory cell preserves error signals over long intervals; it
      became the standard sequence model for nearly two decades. Later work includes flat minima,
      self-normalizing networks (2017), the [[frechet-inception-distance|Fréchet inception
      distance]] for evaluating generative models (2017), modern [[hopfield-network|Hopfield
      networks]] (2020) and xLSTM (2024), an extended LSTM meant to compete with
      [[transformer|transformers]], developed with the Linz startup NXAI. He has also applied deep
      learning to drug discovery and bioinformatics.
