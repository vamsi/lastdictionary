term: Loebner Prize
id: loebner-prize
pos: prop. n.
domain: hist
domains:
  - eval
  - culture
labels:
  - historical
level: specialist
plain: >-
  A yearly contest, held from 1991 to 2019, in which chatbots tried to convince judges they were
  human in short text chats. Its grand prize was never won, and critics called it a publicity stunt.
senses:
  - definition: >-
      A yearly contest, run from 1991 to 2019, in which judges chatted by keyboard with hidden
      humans and [[chatbot|chatbots]] and then ranked the programs by how humanlike they seemed — a
      restricted form of the [[turing-test|Turing test]]. A bronze medal and cash prize went each
      year to the most humanlike program; a silver prize for passing a text-only test and a gold
      prize for a test including audio and video were never awarded. Early contests limited
      conversation to chosen topics. Researchers criticized the contest for rewarding tricks —
      deliberate typos, evasions, scripted personality quirks — rather than intelligence, and most
      AI laboratories ignored it. Steve Worswick's chatbot Mitsuku (later Kuki) won five times, the
      last in 2019.
    example: >-
      Winning the Loebner Prize mostly required a chatbot skilled at changing the subject.
origin: >-
  Founded by the American inventor Hugh Loebner with the Cambridge Center for Behavioral Studies;
  the first contest was held at the Computer Museum in Boston in November 1991. In its final years
  it was organized by the Society for the Study of Artificial Intelligence and Simulation of
  Behaviour (AISB), which continued it after Loebner's death in 2016 until it lapsed after 2019.
year: 1991
note: >-
  Marvin Minsky mockingly offered a prize to anyone who could persuade Loebner to end the contest.
  Stuart Shieber's 1994 article 'Lessons from a Restricted Turing Test' set out the academic
  objections.
see_also:
