term: Hans Moravec
id: hans-moravec
sort_as: Moravec Hans
pos: prop. n.
domain: people
domains:
  - robot
  - asi
level: specialist
dates: b. 1948
plain: >-
  An Austrian-born roboticist who observed that skills humans find effortless, like seeing and
  moving, are the hardest for machines, and who forecast when computers would match the brain.
senses:
  - definition: >-
      Austrian-born roboticist at Carnegie Mellon University's Robotics Institute. His Stanford
      doctoral work on the Stanford Cart (completed 1980) produced one of the first
      [[mobile-robot|mobile robots]] to find its way around obstacles using stereo vision, and at
      Carnegie Mellon he developed occupancy grids with Alberto Elfes (mid-1980s), a probabilistic
      map representation still used in robot mapping. In 'Mind Children' (1988) he set out what
      became known as [[moravec-s-paradox|Moravec's paradox]]: the abilities people find hardest,
      such as formal reasoning, take a computer little computation, while seeing and moving,
      polished by hundreds of millions of years of evolution, take a great deal. He estimated the
      brain's processing power by extrapolating from the retina and projected when affordable
      computers would match it, an early compute-based forecast that anticipated later
      [[biological-anchors|biological anchors]] analyses. 'Robot: Mere Machine to Transcendent Mind'
      (1999) predicted robots overtaking humans. He co-founded Seegrid (2003), which makes
      autonomous warehouse vehicles.
