level: core
plain: >-
  The largest yearly scientific conference on artificial intelligence and machine learning, held
  each December, where many of the field's landmark papers were first presented.
senses:
  - definition: >-
      The Conference on Neural Information Processing Systems, the biggest yearly gathering for
      [[machine-learning|machine learning]] and [[deep-learning|deep learning]] research and one of
      its most selective, which meets every December. Papers are reviewed double-blind on
      [[openreview|OpenReview]] and published as Advances in Neural Information Processing Systems;
      around the main program the week adds tutorials, workshops, competitions and, since 2021, a
      separate Datasets and Benchmarks track. Begun by neuroscientists, physicists and engineers
      interested in neural networks, it became the field's main stage: [[alexnet|AlexNet]] (2012),
      [[generative-adversarial-network|generative adversarial networks]] (2014),
      [[sequence-to-sequence-model|sequence-to-sequence learning]] (2014),
      [[attention-is-all-you-need|Attention Is All You Need]] (2017) and [[gpt-3|GPT-3]] (2020) were
      all NeurIPS papers. Growth to more than 20,000 submissions a year by 2025 has strained peer
      review and, in 2025, led to a second official site in Mexico City alongside the main meeting
      in San Diego.
    example: Half the lab is racing to finish experiments before the NeurIPS deadline.
origin: >-
  The idea of an open annual meeting arose in 1986 among participants in the Snowbird, Utah,
  workshops on neural networks for computing, which Caltech and Bell Laboratories ran by invitation;
  the first conference met in Denver, Colorado, in November 1987. The organizers changed the
  abbreviation from NIPS to NeurIPS in November 2018 after complaints that the old one invited
  sexist jokes and made some attendees feel unwelcome.
year: 1987
