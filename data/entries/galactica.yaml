plain: >-
  A science-focused AI language model released by Meta in November 2022 and pulled after three days
  because it confidently produced fake scientific papers and facts.
senses:
  - definition: >-
      A [[large-language-model|large language model]] released by Meta AI and Papers with Code on 15
      November 2022, trained on a curated corpus of scientific papers, reference works, code and
      knowledge bases, and promoted as able to draft encyclopedia-style articles and scientific
      papers as well as summarize literature and work technical problems. Its public demo was
      withdrawn after three days amid criticism that it generated authoritative-sounding
      fabrications — fake citations, invented studies, confident falsehoods — dressed in the
      formatting of real scholarship. Released two weeks before ChatGPT, Galactica became an early
      cautionary tale about [[hallucination|hallucination]] in high-stakes domains and about
      presenting models as authorities rather than assistants; the contrast with ChatGPT's reception
      is often cited in discussions of framing, timing and public expectations.
    example: >-
      Remember Galactica: a model that writes like a journal article is not therefore a journal
      article.
origin: >-
  Described in 'Galactica: A Large Language Model for Science' by Ross Taylor and colleagues at Meta
  AI (2022). The demo came down on 17 November 2022 after scientists criticized it online; Meta's
  chief AI scientist Yann LeCun defended the model, arguing that critics had deliberately misused
  it.
year: 2022
note: The model weights remained available for research after the demo was removed.
