level: specialist
plain: >-
  A family of methods for drawing random examples from a complicated probability distribution by
  taking a long, carefully designed random walk that eventually visits each region in proportion to
  its probability.
senses:
  - definition: >-
      A family of algorithms that draw samples from a [[probability-distribution|probability
      distribution]] known only up to a normalizing constant by running a random walk — a
      [[markov-chain|Markov chain]] — designed to visit each region in proportion to its
      probability; after a burn-in period, the walk's successive states serve as correlated samples
      for [[monte-carlo-method|Monte Carlo]] estimates. The Metropolis–Hastings algorithm proposes a
      move and accepts it with a probability computed from ratios of target and proposal densities,
      in which the unknown constant cancels; Gibbs sampling updates one variable at a time from its
      conditional distribution; Langevin methods and Hamiltonian Monte Carlo use the
      [[gradient|gradient]] of the log-density to propose better-directed moves, in HMC's case long
      trajectories that are still usually accepted. MCMC made [[bayesian-inference|Bayesian
      inference]] practical for complex models — sampling [[posterior|posteriors]] in tools such as
      BUGS and Stan — and was used to train [[boltzmann-machine|Boltzmann machines]] and other
      [[energy-based-model|energy-based models]]; Langevin dynamics also underlies sampling in
      [[score-based-generative-model|score-based generative models]]. Diagnosing convergence and
      mixing remains hard.
    example: >-
      The MCMC chains for the hierarchical model mixed poorly until we reparameterized the variance
      terms.
formula_latex: \alpha(x \to x') = \min\!\Big(1,\; \frac{\tilde p(x')\,q(x \mid x')}{\tilde
  p(x)\,q(x' \mid x)}\Big)
origin: >-
  Nicholas Metropolis, Arianna and Marshall Rosenbluth, and Augusta and Edward Teller introduced the
  Metropolis algorithm in 1953 for statistical physics; W. Keith Hastings generalized it for
  statisticians in 1970. Stuart and Donald Geman's Gibbs sampler (1984) and Alan Gelfand and Adrian
  Smith's 1990 paper brought MCMC into mainstream Bayesian statistics, where the name took off
  around 1990; Simon Duane and colleagues introduced Hamiltonian ('hybrid') Monte Carlo in 1987.
year: 1953
