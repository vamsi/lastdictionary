term: robotaxi
id: robotaxi
pos: n.
also:
  - robo-taxi
  - robotaxis
  - driverless taxi
  - self-driving taxi
  - autonomous ride-hailing
pronunciation: ROH-boh-tak-see
domain: robot
domains:
  - society
  - gov
level: core
plain: >-
  A taxi with no human driver: you summon it with a phone app, and a self-driving car picks you up
  and drives you to your destination.
senses:
  - definition: >-
      A driverless vehicle offering paid ride-hailing to the public, operated as part of an
      [[autonomous-vehicle|autonomous vehicle]] fleet at SAE Level 4 within a defined
      [[operational-design-domain|operational design domain]], usually a mapped urban service area.
      Riders summon cars through an app; mature services carry no safety driver, but remote
      operators assist vehicles that are stuck or uncertain ([[teleoperation|teleoperation]]), and
      depots handle charging, cleaning and maintenance. As of October 2026 the largest operator
      outside China was Waymo, with fully driverless service in about ten US metropolitan areas,
      roughly 500,000 paid rides per week reported in early 2026, and announced plans for London and
      Tokyo; Baidu's Apollo Go, Pony.ai and WeRide operated in Chinese cities and were expanding
      abroad, while Tesla, Zoox and others ran smaller or partly supervised services. Economics
      depend on vehicle and sensor costs, the ratio of remote assistants to vehicles, utilization
      and insurance. Incidents, including an October 2023 crash in San Francisco that led to the
      suspension and eventual closure of GM's Cruise, keep safety and transparency at the center of
      public debate.
    example: >-
      The robotaxi stopped two blocks early because the hotel driveway is outside its service area.
origin: >-
  A blend of 'robot' and 'taxi'. Driverless taxis appear in science fiction, as in the 'Johnny Cab'
  of Total Recall (1990). The word spread in the mid-2010s as nuTonomy (Singapore, 2016), Uber,
  Waymo and others announced or trialed services; Waymo's Phoenix service became the first fully
  driverless public robotaxi operation in 2020.
note: >-
  Not every service called a robotaxi is driverless: those with a safety driver or onboard monitor
  are better described as supervised or pilot services, and announcements often precede driverless
  operation by years.
