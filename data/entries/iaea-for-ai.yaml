term: IAEA for AI
id: iaea-for-ai
pos: phr.
also:
  - international AI agency
  - International Agency for AI
domain: gov
domains:
  - asi
  - safety
labels:
  - informal
level: specialist
plain: >-
  The idea of an international agency for the most advanced AI, modeled on the UN's nuclear
  watchdog, which inspects countries' nuclear programs to keep them safe and peaceful.
senses:
  - definition: >-
      A proposal for an intergovernmental organization that would oversee the most capable AI
      systems as the International Atomic Energy Agency (IAEA) oversees nuclear technology: setting
      safety standards, inspecting or auditing developers and data centers, verifying compliance
      with agreed limits such as [[compute-threshold|compute thresholds]] or [[ai-red-lines|AI red
      lines]], and perhaps controlling access to the most dangerous capabilities. Versions range
      from a scientific and standard-setting body to an agency with licensing and inspection powers
      backed by [[compute-governance|controls on chips]]. Skeptics point to disanalogies: AI
      capability is diffuse and mostly privately developed, there is no equivalent of fissile
      material to count, and software is hard to verify.
    example: >-
      Calls for an IAEA for AI usually founder on the question of what inspectors would actually
      count.
origin: >-
  Calls for an international AI agency multiplied in 2023: Gary Marcus and Anka Reuel proposed one
  in The Economist in April; OpenAI's leaders wrote in May that superintelligence efforts would
  likely need 'something like an IAEA'; and in June UN Secretary-General António Guterres said he
  would favor an IAEA-like body. The UN's High-level Advisory Body stopped short of recommending one
  in 2024.
year: 2023
note: >-
  Distinct from proposals for a 'CERN for AI', a jointly funded international research institution,
  and from the [[independent-international-scientific-panel-on-ai|Independent International
  Scientific Panel on AI]], which assesses evidence but has no powers.
