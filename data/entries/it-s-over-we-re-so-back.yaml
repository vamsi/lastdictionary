term: it's over, we're so back
id: it-s-over-we-re-so-back
pos: phr.
also:
  - it's so over
  - we're so back
  - it's over / we're back
  - so over, so back
domain: culture
domains:
  - society
labels:
  - slang
level: specialist
plain: >-
  A meme describing the mood swings of the AI world: one day bad news means 'it's over', the next a
  new model or result means 'we're so back'.
senses:
  - definition: >-
      A paired catchphrase expressing rapid oscillation between despair ('it's so over') and
      euphoria ('we're so back') in response to news. On AI social media it narrates the hype cycle:
      a disappointing release, a scaling slowdown or a regulatory threat prompts 'it's over', while
      a surprising benchmark result, an [[open-weight-model|open-weight]] release or a viral demo
      prompts 'we're so back'. Every faction uses it — safety researchers,
      [[effective-accelerationism|accelerationists]], investors, open-source developers — each
      reversing what counts as good news, and it doubles as self-mockery of a community that
      overreacts to every announcement.
    example: >-
      Monday the flagship model stalled on the benchmark: it's over. Wednesday an open model matched
      it: we're so back.
origin: >-
  'It's over' became a common 4chan reaction-image caption from about 2016; its pairing with 'we're
  back' is traced to Twitter posts of 2021, and the format spread widely in 2022. A January 2023
  post captioning AI-generated images 'It's SO over' tied the meme to generative AI, after which it
  became a fixture of AI Twitter; political variants include 'it's Joever / we're Barack'.
year: 2021
