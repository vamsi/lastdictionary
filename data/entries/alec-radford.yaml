plain: >-
  An American AI researcher who led OpenAI's first GPT language models and its CLIP and Whisper
  systems, key steps toward today's chatbots and multimodal AI.
senses:
  - definition: >-
      American machine-learning researcher at [[openai|OpenAI]] from 2016 to 2024 and lead author of
      several of its foundational systems. His DCGAN paper (2015, with Luke Metz and Soumith
      Chintala) showed how to train convolutional [[generative-adversarial-network|GANs]] stably,
      and his 'sentiment neuron' work (2017) found a single unit tracking sentiment in a
      character-level language model trained only to predict text. He led the original [[gpt|GPT]]
      (2018), which showed that generative [[pretraining|pretraining]] of a
      [[transformer|transformer]] followed by [[fine-tuning|fine-tuning]] transfers across language
      tasks, and [[gpt-2|GPT-2]] (2019), whose staged release over misuse concerns drew wide
      attention; he co-authored [[gpt-3|GPT-3]] and [[proximal-policy-optimization|proximal policy
      optimization]]. He also led [[clip|CLIP]] (2021), which learned joint image–text
      representations from 400 million captioned images, and the [[whisper|Whisper]] speech
      recognizer (2022). He left OpenAI at the end of 2024 to pursue independent research.
