level: specialist
plain: >-
  A free website where anyone can browse, search and test the internal concepts that researchers
  have found inside AI models, with examples of the text that switches each one on.
senses:
  - definition: >-
      An open platform for mechanistic interpretability research that hosts
      [[sparse-autoencoder|sparse autoencoder]], [[transcoder|transcoder]] and other dictionary
      features for many open-weight models. For each feature it shows a dashboard of top-activating
      text examples, activation histograms, the output tokens the feature promotes and suppresses,
      and natural-language explanations generated by [[automated-interpretability|automated
      interpretability]]. Users can search features by meaning, run their own text through hosted
      models, [[feature-steering|steer]] outputs with chosen features, and build and share lists.
      Since 2025 it has also hosted interactive [[attribution-graph|attribution graphs]] generated
      with open-source [[circuit-tracing|circuit tracing]] tools. Large public releases such as
      Google DeepMind's [[gemma-scope|Gemma Scope]] have been made explorable through it, and its
      own code has been released as open source.
    example: >-
      Search Neuronpedia for 'deception' and check whether the top feature really fires on lies.
origin: >-
  Created by Johnny Lin, who launched it in July 2023 as a game for crowdsourcing explanations of
  individual neurons in GPT-2; on 25 March 2024 Lin and Joseph Bloom announced its relaunch as a
  platform for sparse-autoencoder research, then hosting over 600,000 feature dashboards. Its code
  was open-sourced in 2025.
year: 2023
