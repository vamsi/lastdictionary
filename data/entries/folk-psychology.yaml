# yaml-language-server: $schema=../schema/entry.schema.json

term: folk psychology
id: folk-psychology
pos: n.
also:
  - commonsense psychology
  - belief–desire psychology
  - eliminative materialism
  - eliminativism
domain: mind
level: specialist
plain: >-
  The everyday way people explain and predict each other's actions in terms of beliefs, desires and
  intentions, as in 'she took an umbrella because she thought it would rain'.
senses:
  - definition: >-
      The everyday framework by which people explain and predict behavior by attributing beliefs,
      desires, intentions, hopes and fears, linked by commonsense generalizations: someone who wants
      something and believes an action will get it tends to perform that action. Philosophers debate
      its status: whether it is a tacit theory, as the theory-theory account of
      [[theory-of-mind|theory of mind]] holds, or a practice of simulation or interpretation;
      whether cognitive science will vindicate beliefs and desires as real internal states, as Jerry
      Fodor argued, or eliminate them as posits of a false theory, as the eliminative materialism of
      Paul and Patricia Churchland predicts; and whether its predictive success shows only that
      systems can be treated from the [[intentional-stance|intentional stance]], as Daniel Dennett
      held. The same questions arise for AI: whether describing [[large-language-model|language
      models]] as believing, wanting or intending is literally true, a useful approximation or
      misleading [[anthropomorphism|anthropomorphism]].
origin: >-
  Wilfrid Sellars's 'myth of Jones' (1956) treated mental concepts as a theory. The phrase 'folk
  psychology', whose earliest use in this sense is not established, became current in philosophy of
  mind around 1980, notably through Paul Churchland's 'Eliminative Materialism and the Propositional
  Attitudes' (1981) and Stephen Stich's From Folk Psychology to Cognitive Science (1983).
note: >-
  Not to be confused with Wilhelm Wundt's Völkerpsychologie, also translated 'folk psychology', a
  study of the mental life of peoples and cultures.
see_also:
  - theory of mind
  - intentional stance
  - intentionality
  - anthropomorphism
  - problem of other minds
  - cognitive science
sources:
  - text: >-
      Churchland, P. M. (1981). Eliminative Materialism and the Propositional Attitudes. The Journal
      of Philosophy 78(2), 67–90.
  - text: >-
      Stich, S. P. (1983). From Folk Psychology to Cognitive Science: The Case Against Belief. MIT
      Press.
