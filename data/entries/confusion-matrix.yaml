  - ROC curve
sources:
  - text: >-
      Miller, G. A. & Nicely, P. E. (1955). An Analysis of Perceptual Confusions Among Some English
      Consonants. Journal of the Acoustical Society of America 27(2).
  - text: >-
      Stehman, S. V. (1997). Selecting and Interpreting Measures of Thematic Classification
      Accuracy. Remote Sensing of Environment 62(1).
