# yaml-language-server: $schema=../schema/entry.schema.json

term: algorithm aversion
id: algorithm-aversion
pos: n.
also:
  - algorithmic aversion
domain: society
domains:
  - core
level: specialist
plain: >-
  Losing faith in a computer's predictions after watching it slip up once or twice, and turning back
  to human judgment even though the machine remains the better forecaster.
senses:
  - definition: >-
      A preference for human judgment, one's own or an expert's, over a demonstrably more accurate
      algorithm, which strengthens once people have watched the algorithm make mistakes. In the
      incentivized forecasting experiments that named it, people who had seen a statistical model at
      work were less willing to rely on it than people who had not, even when it had clearly beaten
      the human alternative: an error cost the model more trust than the same error cost a person.
      Suggested causes include beliefs that humans learn from experience while algorithms cannot,
      intolerance of any error, a sense that algorithms ignore individual circumstances, and unclear
      responsibility for mistakes. Aversion falls when people may adjust the algorithm's output even
      slightly. Later studies also found 'algorithm appreciation' in some tasks, so the direction of
      the bias depends on domain, framing and expertise.
    example: >-
      Managers overrode the demand model after one bad week despite its better record, textbook
      algorithm aversion.
origin: >-
  Named by Berkeley Dietvorst, Joseph Simmons and Cade Massey in 'Algorithm Aversion: People
  Erroneously Avoid Algorithms after Seeing Them Err' (Journal of Experimental Psychology: General,
  2015), extending the clinical-versus-statistical prediction debate opened by Paul Meehl in 1954.
year: 2015
see_also:
  - automation bias
  - overreliance
  - human-in-the-loop
  - trustworthy AI
  - centaur
contrast:
  - automation bias
sources:
  - text: >-
      Dietvorst, B. J., Simmons, J. P. & Massey, C. (2015). Algorithm Aversion: People Erroneously
      Avoid Algorithms after Seeing Them Err. Journal of Experimental Psychology: General 144(1),
      114–126.
  - text: >-
      Logg, J. M., Minson, J. A. & Moore, D. A. (2019). Algorithm appreciation: People prefer
      algorithmic to human judgment. Organizational Behavior and Human Decision Processes 151,
      90–103.
