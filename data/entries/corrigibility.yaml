      Soares, N., Fallenstein, B., Yudkowsky, E. & Armstrong, S. (2015). Corrigibility. AAAI-15
      Workshop on AI and Ethics.
    url: https://intelligence.org/files/Corrigibility.pdf
  - text: Christiano, P. (2017). Corrigibility. AI Alignment blog (ai-alignment.com).
