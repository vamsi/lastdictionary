plain: >-
  Google's family of free-to-download AI language models: smaller relatives of its Gemini systems,
  compact enough to run on a single computer and, in some versions, on a phone.
senses:
  - definition: >-
      A family of [[open-weight-model|open-weight]] [[large-language-model|language models]] that
      Google, chiefly through [[google-deepmind|Google DeepMind]], has released since February 2024
      as smaller siblings of its proprietary [[gemini|Gemini]] models, sharing their research
      lineage but sized to run on a single accelerator, a workstation or a phone. Gemma 1 (February
      2024) offered decoder-only [[transformer|transformers]] of 2 and 7 billion parameters; Gemma 2
      (mid-2024) came in 2B, 9B and 27B sizes, training the two smaller models by
      [[knowledge-distillation|knowledge distillation]] from a larger teacher and alternating local
      and global attention layers; Gemma 3 (March 2025), from 1B to 27B parameters, added image
      input, context windows of up to 128,000 tokens and support for over 140 languages; Gemma 3n
      (mid-2025) targeted phones; and Gemma 4 (April 2026) — two small on-device models (E2B and
      E4B), a 26B mixture-of-experts model and a 31B dense model — moved the family to the
      permissive Apache 2.0 license. Specialized variants include CodeGemma for code, PaliGemma for
      vision and language, ShieldGemma safety classifiers, MedGemma for medicine, EmbeddingGemma for
      [[text-embedding|text embeddings]] and the [[gemma-scope|Gemma Scope]] interpretability tools.
    example: >-
      We fine-tuned the 4B Gemma model on our support tickets and serve it from a single GPU.
origin: >-
  Announced by Google on 21 February 2024 as 'open models' built from the research behind Gemini;
  the name comes from the Latin gemma, 'precious stone'. Google promotes the tens of thousands of
  community fine-tunes and derivatives published on Hugging Face as the 'Gemmaverse'.
year: 2024
note: >-
  Gemma 1 to 3 shipped under custom Gemma Terms of Use with a prohibited-use policy, which critics
  said fell short of [[open-source-ai|open source]]; the switch to Apache 2.0 with Gemma 4 removed
  those use restrictions, though training data remain unpublished. Not to be confused with
  [[gemini|Gemini]], Google's proprietary family.
