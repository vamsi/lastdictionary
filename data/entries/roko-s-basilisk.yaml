# yaml-language-server: $schema=../schema/entry.schema.json

term: Roko's basilisk
id: roko-s-basilisk
pos: n.
domain: culture
domains:
  - asi
  - mind
level: specialist
plain: >-
  A notorious internet thought experiment: a future super-powerful AI might punish everyone who
  foresaw it but did not help bring it about, so merely hearing the argument would put you at risk.
  Almost nobody accepts it.
senses:
  - definition: >-
      A thought experiment about acausal blackmail: a future [[superintelligence|superintelligence]]
      devoted to human welfare might, under certain unconventional decision theories, commit to
      punishing (for instance, by torturing simulated copies) people who had foreseen its possible
      existence without working toward it, since the prospect of that punishment would have spurred
      them to help; anyone who understands the argument is therefore exposed, as if to the deadly
      gaze of the mythical basilisk. The argument rests on contested assumptions about acausal
      bargaining, simulation and personal identity, and is rejected by nearly everyone who has
      examined it closely, including most of the [[rationalist-community|rationalists]] among whom
      it arose. It survives as the best-known example of an [[infohazard|infohazard]], a cautionary
      tale about speculative reasoning, and a byword for the eccentricities of online AI-risk
      culture.
    example: >-
      The basilisk comes up whenever someone asks whether AI-risk arguments are falsifiable.
origin: >-
  Posted to [[lesswrong|LessWrong]] on 23 July 2010 by a user called Roko, extending discussions of
  timeless decision theory. Eliezer Yudkowsky deleted the post and banned discussion of the topic
  for five years, which mainly increased interest in it; in 2015 he expressed regret for
  overreacting. Who first called it Roko's basilisk is not established. David Auerbach's 2014 Slate
  article brought it to a general audience, and the musician Grimes's 'Rococo Basilisk' character
  (2015), referenced by Elon Musk in 2018, revived it.
year: 2010
note: >-
  Yudkowsky has said he removed the post because circulating a claimed infohazard was irresponsible,
  not because he found the argument persuasive.
