plain: >-
  A 2015 open letter, signed by Stephen Hawking, Elon Musk and many leading AI researchers, urging
  that AI research aim not only at making systems more capable but also at making them safe and
  beneficial.
senses:
  - definition: >-
      An open letter published by the [[future-of-life-institute|Future of Life Institute]] in
      January 2015 under the title 'Research Priorities for Robust and Beneficial Artificial
      Intelligence', arguing that work on making AI more capable should be matched by research into
      keeping ever more capable systems reliable and beneficial, systems that 'do what we want them
      to do'. An accompanying agenda by [[stuart-russell|Stuart Russell]], Daniel Dewey and
      [[max-tegmark|Max Tegmark]] covered near-term topics (law and ethics, economic effects,
      verification, validity, security and control) and long-term questions about controlling highly
      capable systems. Signed by thousands, including Stephen Hawking, [[elon-musk|Elon Musk]] and
      many prominent researchers in academia and industry, it was among the first mainstream
      statements placing [[ai-safety|AI safety]] on the research agenda. Days later Musk pledged
      US$10 million to the institute for research grants.
    example: >-
      The 2015 Open Letter on Artificial Intelligence now reads like a founding charter of AI safety
      research.
origin: >-
  Released shortly after the Future of Life Institute's conference 'The Future of AI: Opportunities
  and Challenges', held in San Juan, Puerto Rico, in early January 2015. It was followed by the
  [[asilomar-ai-principles|Asilomar AI Principles]] (2017) and, with a sharper demand, by
  [[pause-giant-ai-experiments|Pause Giant AI Experiments]] (2023).
year: 2015
