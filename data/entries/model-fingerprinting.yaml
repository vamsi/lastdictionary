  - backdoor attack
  - open-weight model
  - weight exfiltration
sources:
  - text: >-
      Uchida, Y., Nagai, Y., Sakazawa, S. & Satoh, S. (2017). Embedding Watermarks into Deep Neural
      Networks. ACM ICMR 2017.
