  - greedy decoding
sources:
  - text: >-
      Viterbi, A. J. (1967). Error Bounds for Convolutional Codes and an Asymptotically Optimum
      Decoding Algorithm. IEEE Transactions on Information Theory 13(2), 260–269.
  - text: >-
      Forney, G. D., Jr. (1973). The Viterbi Algorithm. Proceedings of the IEEE 61(3), 268–278.
