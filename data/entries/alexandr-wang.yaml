plain: >-
  An American entrepreneur who founded Scale AI, a major supplier of human-labeled data for training
  AI, and became Meta's chief AI officer in 2025.
senses:
  - definition: >-
      American entrepreneur, Meta's chief AI officer since June 2025. He left MIT to co-found
      [[scale-ai|Scale AI]] in 2016 with Lucy Guo; the company supplied human-labeled data, first
      for [[autonomous-vehicle|self-driving cars]] and then, through large networks of contract
      annotators, the demonstrations and preference judgments used to [[fine-tuning|fine-tune]] and
      evaluate [[large-language-model|large language models]], becoming a central supplier of
      [[data-labeling|data labeling]] for frontier labs and US defense agencies. Scale co-created
      [[humanity-s-last-exam|Humanity's Last Exam]] (2025) with the [[center-for-ai-safety|Center
      for AI Safety]], and Wang co-wrote 'Superintelligence Strategy' (2025) with
      [[dan-hendrycks|Dan Hendrycks]] and Eric Schmidt, which proposed
      [[mutual-assured-ai-malfunction|Mutual Assured AI Malfunction]]. In June 2025 Meta bought a 49
      percent non-voting stake in Scale for about US$14 billion and hired Wang to lead its new
      [[meta-superintelligence-labs|Meta Superintelligence Labs]], after which several of Scale's
      AI-lab customers reportedly scaled back their work with it.
