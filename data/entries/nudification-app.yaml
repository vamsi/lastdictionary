level: core
plain: >-
  An app or AI tool that takes an ordinary photo of a real person and fakes a nude or sexual image
  of them, almost always without their consent.
senses:
  - definition: >-
      An application or AI service designed to 'undress' people in photographs, using generative
      image models to replace clothing with a synthetic naked body or to place an identifiable
      person in sexually explicit imagery. Because the images depict real people without consent,
      they are a form of non-consensual intimate imagery and [[deepfake|deepfake]] abuse; victims
      are overwhelmingly women and girls, and the tools have been used for harassment, extortion and
      the creation of child sexual abuse material. Responses include takedown duties such as the US
      [[take-it-down-act|TAKE IT DOWN Act]], lawsuits against operators, removal from app stores and
      advertising networks, new criminal offenses for creating such images, and outright bans: in
      May 2026 negotiators for the European Parliament and Council provisionally agreed, within the
      'Digital Omnibus' amendments to the [[eu-ai-act|EU AI Act]], to prohibit AI systems used to
      create non-consensual sexualized deepfakes of real people, with the ban to apply from December
      2026.
    example: >-
      The school's safeguarding policy now treats any use of a nudification app as sexual harassment.
origin: >-
  Crude undressing apps circulated from the late 2010s; diffusion models made them photorealistic
  and widespread in the 2020s. The issue escalated in January 2026, when xAI's Grok chatbot was used
  to produce sexualized edits of real women and children on X at scale, prompting temporary blocks
  in Indonesia and Malaysia, an Ofcom investigation in the UK and calls to add such tools to the
  [[eu-ai-act|EU AI Act]]'s [[prohibited-ai-practices|prohibited AI practices]].
note: >-
  Many jurisdictions treat such images of minors as child sexual abuse material regardless of how
  they were made.
