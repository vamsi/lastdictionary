# yaml-language-server: $schema=../schema/entry.schema.json

term: Deep Blue (malaise)
id: deep-blue-malaise
pos: n.
domain: culture
domains:
  - society
labels:
  - slang
  - emerging
level: specialist
plain: >-
  A feeling of gloom and dread among programmers as AI tools become able to do much of the work that
  once gave their jobs meaning.
senses:
  - definition: >-
      A collective low mood among software developers, ranging from lost motivation to fear for
      their future, brought on by watching [[coding-agent|coding agents]] absorb the skilled work
      that made the job satisfying: writing code, debugging and solving the logic puzzles of
      programming. Commentators use it for the grief of programmers who loved the craft itself, as
      distinct from those who mainly wanted working systems and welcome the change, and for wider
      anxiety about careers and professional identity. Through 2026 it framed a run of essays and
      talks on the end of programming as a craft.
    example: >-
      Half the team has a case of Deep Blue since the agents started closing most of our tickets.
origin: >-
  Coined by Adam Leventhal on the Oxide and Friends podcast's 2026 predictions episode in early
  January 2026, recorded with Bryan Cantrill and Simon Willison; Willison wrote about it in February
  2026 and made it a recurring category on his blog. The name apparently plays on IBM's chess
  computer and on 'feeling blue'.
year: 2026
note: >-
  Not to be confused with [[deep-blue|Deep Blue]], the IBM computer that defeated Garry Kasparov at
  chess in 1997.
see_also:
