dates: 1926–2009
plain: >-
  An American mathematician who worked out an ideal mathematical recipe for predicting what comes
  next from past data, and who attended the 1956 meeting that launched AI.
senses:
  - definition: >-
      American mathematician whose formal theory of induction helped found algorithmic information
      theory. One of the few participants to stay for the whole of the 1956
      [[dartmouth-workshop|Dartmouth workshop]], he wrote an early paper on machine learning, 'An
      Inductive Inference Machine' (1957). In a 1960 report and the two-part 'A Formal Theory of
      Inductive Inference' (1964) he defined algorithmic probability, which weights every program
      that could have produced the observed data according to its length, favoring shorter ones, and
      used it for universal prediction, now called [[solomonoff-induction|Solomonoff induction]].
      The work anticipated the complexity measure introduced independently by Andrey Kolmogorov and
      Gregory Chaitin ([[kolmogorov-complexity|Kolmogorov complexity]]) and gave
      [[occam-s-razor|Occam's razor]] a formal basis. Incomputable but optimal in a precise sense,
      it underlies [[minimum-description-length|minimum description length]] ideas and Marcus
      Hutter's [[aixi|AIXI]]. He worked largely independently through his own firm, Oxbridge
      Research, and received the first Kolmogorov Medal (2003).
