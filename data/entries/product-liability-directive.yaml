term: Product Liability Directive
id: product-liability-directive
pos: prop. n.
also:
  - PLD
  - Directive (EU) 2024/2853
  - revised Product Liability Directive
domain: gov
domains:
  - society
labels:
  - legal
level: specialist
plain: >-
  The EU law that lets people claim compensation, without proving anyone was careless, when a
  defective product injures them — rewritten in 2024 so that software and AI count as products.
senses:
  - definition: >-
      Directive (EU) 2024/2853 on liability for defective products, which replaces the EU's 1985
      directive and makes manufacturers and others in the supply chain liable, without proof of
      fault, when a defective product causes death or personal injury (including medically
      recognized harm to psychological health), damage to property, or the loss or corruption of
      data not used for professional purposes. It expressly treats software, including
      [[ai-system|AI systems]], as a product, while excluding free and open-source software supplied
      outside commercial activity. In judging defectiveness, courts consider a product's ability to
      keep learning or acquire new features after release, and manufacturers remain liable for
      defects caused by software updates or upgrades within their control or by the lack of
      necessary security updates. Courts may order defendants to disclose evidence and may presume
      defectiveness or causation where technical or scientific complexity makes proof excessively
      difficult. It applies to products placed on the market after 9 December 2026.
    example: >-
      Under the new Product Liability Directive, a faulty update to the vehicle's driving software
      can make its maker liable.
origin: >-
  Proposed by the European Commission on 28 September 2022, together with a separate AI Liability
  Directive on fault-based claims; adopted on 23 October 2024. The Commission announced the
  withdrawal of the AI Liability Directive in February 2025, leaving the revised Product Liability
  Directive as the EU's main liability instrument for AI.
year: 2024
note: >-
  Covers harm to individuals, not purely economic loss or discrimination, which fall to national
  tort law and other EU rules. See [[ai-liability|AI liability]] for the wider debate.
