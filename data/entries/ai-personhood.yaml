# yaml-language-server: $schema=../schema/entry.schema.json

term: AI personhood
id: ai-personhood
pos: n.
also:
  - electronic personhood
  - electronic person
  - legal personhood for AI
  - AI rights
  - robot rights
domain: mind
domains:
  - gov
  - society
labels:
  - contested
level: core
plain: >-
  The idea of treating an AI system as a 'person' in law or ethics, with rights or duties of its own
  — for example, to own property, to be sued, or not to be deleted.
senses:
  - context: Law
    definition: >-
      The recognition of an AI system as a legal person: a bearer of rights and duties, able for
      example to own property, enter contracts, sue or be sued, on the model of the legal personhood
      granted to corporations. Proposals have aimed mainly at liability and accountability, as in
      the European Parliament's 2017 call to consider a status of 'electronic persons' for the most
      sophisticated autonomous robots, which drew strong expert opposition and was not adopted. No
      jurisdiction grants legal personhood to AI systems. As of October 2026, at least four US
      states had enacted laws denying it — Idaho (2022), North Dakota (2023), Utah (2024) and
      Tennessee (Public Chapter 781, April 2026) — while similar bills elsewhere, such as Ohio's
      House Bill 469, which would also declare AI systems nonsentient, had not been enacted.
  - context: Ethics
    definition: >-
      The status of being a person in the moral sense — a being whose rationality, self-awareness or
      capacity for a life of its own grounds strong rights — applied to actual or hypothetical AI
      systems. Moral personhood is usually considered stronger than [[moral-patienthood|moral
      patienthood]], and it is independent of legal personhood, which is granted to entities that
      are not moral persons, such as companies and, in some countries, rivers.
origin: >-
  Lawrence Solum's 'Legal Personhood for Artificial Intelligences' (North Carolina Law Review, 1992)
  is a founding text of the legal debate. The European Parliament's resolution of 16 February 2017
  on civil law rules on robotics raised 'electronic personhood', and Saudi Arabia's symbolic grant
  of citizenship to the robot Sophia in October 2017 drew wide criticism.
year: 1992
note: >-
  Critics warn that legal personhood for AI could let manufacturers and operators shift liability
  onto their products; see [[ai-liability|AI liability]]. Recognizing an AI as a moral patient would
  not by itself make it a legal person, nor would legal personhood imply consciousness.
see_also:
  - moral patienthood
  - AI welfare
  - AI liability
  - moral agency
  - digital mind
  - sentience
sources:
  - text: >-
      Solum, L. B. (1992). Legal Personhood for Artificial Intelligences. North Carolina Law Review
      70(4), 1231–1287.
  - text: >-
      European Parliament (2017). Resolution of 16 February 2017 with recommendations to the
      Commission on Civil Law Rules on Robotics (2015/2103(INL)).
  - text: >-
      Rost, T. (2026). Legislating AI Consciousness Without an Exit. The Regulatory Review, 29 June
