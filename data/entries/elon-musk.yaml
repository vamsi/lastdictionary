plain: >-
  A South African-born American entrepreneur who runs Tesla and SpaceX, co-founded OpenAI, founded
  the AI company xAI, and has long warned that AI could endanger humanity.
senses:
  - definition: >-
      South African-born American entrepreneur, chief executive of Tesla and SpaceX. He has warned
      since at least 2014 that advanced AI could pose an [[existential-risk|existential risk]], gave
      US$10 million to the [[future-of-life-institute|Future of Life Institute]] in 2015 for
      AI-safety research, and signed the 2023 '[[pause-giant-ai-experiments|Pause Giant AI
      Experiments]]' letter. He co-founded [[openai|OpenAI]] in 2015 as co-chair and a major donor,
      left its board in 2018, and in 2024 sued it and [[sam-altman|Sam Altman]] for abandoning its
      nonprofit mission; in May 2026 a jury found the claims were filed too late, and he said he
      would appeal. In 2023 he founded [[xai|xAI]], which develops the Grok chatbot and built the
      Colossus supercomputer in Memphis; xAI acquired the social network X in 2025 and was itself
      acquired by SpaceX in February 2026. Tesla develops camera-based self-driving software and the
      humanoid robot Optimus, and he co-founded the brain–computer interface company Neuralink
      (2016).
