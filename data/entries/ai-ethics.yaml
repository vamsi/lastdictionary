# yaml-language-server: $schema=../schema/entry.schema.json

term: AI ethics
id: ai-ethics
pos: n.
also:
  - ethics of artificial intelligence
  - ethics of AI
  - AI ethicist
domain: society
domains:
  - gov
  - mind
level: essential
plain: >-
  The study of what is right and wrong in how AI is built and used: who it may harm, who is
  responsible when it fails, and which values it should respect.
senses:
  - definition: >-
      The branch of applied ethics, and the associated professional practice, concerned with the
      moral questions raised by the design, deployment and governance of AI systems:
      [[algorithmic-bias|bias]] and [[algorithmic-fairness|fairness]], privacy and
      [[ai-surveillance|surveillance]], [[ai-transparency|transparency]] and
      [[explainability|explainability]], accountability and the [[responsibility-gap|responsibility
      gap]], autonomy and manipulation, effects on work, environmental costs and the distribution of
      power. In practice it ranges from academic philosophy to corporate principles, review boards,
      [[ai-audit|audits]] and regulation. Reviewing 84 guideline documents in 2019, Anna Jobin,
      Marcello Ienca and Effy Vayena found five principles recurring in more than half of them
      (transparency; justice and fairness; non-maleficence; responsibility; privacy), with little
      agreement on what each requires in practice.
    example: >-
      The AI ethics review flagged that the triage model had never been tested on children.
  - context: Machine ethics
    definition: >-
      Less commonly, the project of giving AI systems the capacity to reason about and act on moral
      considerations themselves, so that they behave as ethical agents; more usually called
      [[machine-ethics|machine ethics]].
origin: >-
  Concern with the moral effects of thinking machines goes back to Norbert Wiener's The Human Use of
  Human Beings (1950) and Joseph Weizenbaum's Computer Power and Human Reason (1976). Computer
  ethics became a field in the 1980s; 'AI ethics' spread as a label in the mid-2010s, followed by a
  wave of principles documents from companies, governments and civil society in 2016–2019.
note: >-
  Often contrasted with [[ai-safety|AI safety]]: ethics work has tended to focus on present,
  documented harms to people and groups, safety work on failures of increasingly capable systems,
  including catastrophic ones. The communities overlap and the divide is increasingly questioned.
  Critics warn that voluntary principles without enforcement can become [[ethics-washing|ethics
  washing]].
see_also:
  - responsible AI
  - trustworthy AI
