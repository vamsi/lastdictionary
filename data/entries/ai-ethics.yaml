      Jobin, A., Ienca, M. & Vayena, E. (2019). The global landscape of AI ethics guidelines. Nature
      Machine Intelligence 1, 389–399.
  - text: >-
      Floridi, L. & Cowls, J. (2019). A Unified Framework of Five Principles for AI in Society.
      Harvard Data Science Review 1(1).
