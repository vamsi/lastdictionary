term: Safe Superintelligence Inc.
id: safe-superintelligence-inc
pos: prop. n.
also:
  - SSI
  - Safe Superintelligence
domain: orgs
domains:
  - asi
  - safety
level: core
plain: >-
  A company started in 2024 by Ilya Sutskever, a co-founder of OpenAI, with the single goal of
  building a superintelligent AI that is safe. It sells no products.
senses:
  - definition: >-
      An American AI research company that aims to make safe [[superintelligence|superintelligence]]
      its first and only product, skipping the intermediate models and services through which other
      labs earn revenue; its founders argued that going straight for the goal would keep the work
      free of commercial deadlines. It has published almost nothing about its technical approach;
      Ilya Sutskever has indicated only that it is pursuing a different path from scaling as
      practiced at other labs, and in late 2025 he argued that the field was returning from an 'age
      of scaling' to an 'age of research'. Based in Palo Alto, California, and Tel Aviv, Israel, it
      has attracted multi-billion-dollar investment, a computing agreement with Google Cloud (2025)
      and a long-term partnership with Nvidia (2026) while, as of October 2026, having released no
      model or product.
origin: >-
  Announced on 19 June 2024 by Ilya Sutskever, a co-founder and former chief scientist of OpenAI,
  with investor and entrepreneur Daniel Gross and former OpenAI researcher Daniel Levy. Gross left
  for Meta in July 2025, and Sutskever became chief executive.
year: 2024
