term: Computing Machinery and Intelligence
id: computing-machinery-and-intelligence
pos: prop. n.
domain: hist
domains:
  - mind
  - core
labels:
  - historical
level: core
plain: >-
  Alan Turing's 1950 essay asking whether machines can think. It proposed a conversation test in
  place of that question, answered objections to thinking machines and suggested that machines might
  learn like children.
senses:
  - definition: >-
      A paper by [[alan-turing|Alan Turing]] published in the philosophy journal Mind in October
      1950 and widely regarded as the founding philosophical text of artificial intelligence. It
      replaces the question of whether machines can think with the imitation game, later called the
      [[turing-test|Turing test]]; argues that digital computers are universal machines able to
      mimic any discrete-state machine; and rebuts nine objections, among them the theological, the
      mathematical (based on Gödel's incompleteness theorems), the argument from consciousness and
      Lady Lovelace's claim that machines only do what they are told (see
      [[lovelace-objection|Lovelace objection]]). Its final section on learning machines proposes
      building a 'child machine' and educating it with rewards and punishments, anticipating
      [[machine-learning|machine learning]] and [[reinforcement-learning|reinforcement learning]].
      Turing also forecast that by the end of the twentieth century educated opinion would accept
      talk of machines thinking without expecting to be contradicted.
    example: >-
      Most arguments about whether language models understand were already sketched in Computing
      Machinery and Intelligence.
origin: >-
  Written while Turing was at the University of Manchester, home of the Manchester Mark 1 computer,
  and published in Mind volume 59, number 236. It developed ideas from his 1948 National Physical
  Laboratory report 'Intelligent Machinery', which was published only posthumously, in 1968.
year: 1950
note: >-
  The paper's opening line, 'I propose to consider the question, Can machines think?', is among the
  most quoted sentences in the field.
