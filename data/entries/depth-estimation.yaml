level: core
plain: >-
  Working out how far away each point in a scene is from the camera, producing a 'depth map' that
  turns a flat picture into a sense of near and far.
senses:
  - definition: >-
      The task of predicting, for each pixel, the distance from the camera to the visible surface,
      producing a depth map. Stereo methods find the same point in two horizontally offset images
      and convert the shift between them (the disparity d) into depth Z = fB/d, where f is the focal
      length and B the distance between the cameras; multi-view stereo generalizes this to many
      images. Active sensors (structured light, time-of-flight, [[lidar|lidar]]) measure depth
      directly. Monocular depth estimation infers depth from a single image using learned cues such
      as perspective, texture gradients, occlusion and the familiar sizes of objects; because
      absolute scale is ambiguous, models predict either relative (scale- and shift-invariant) depth
      or metric depth in meters, the latter requiring camera information or training on calibrated
      data. Milestones include multi-scale networks trained on indoor Kinect and outdoor lidar data
      (2014), self-supervised training from stereo pairs and video (2016–2017), training on mixtures
      of datasets (MiDaS, 2019) and large models trained on tens of millions of automatically
      labeled images, such as Depth Anything (2024). Uses include robotics, driver assistance,
      augmented reality, portrait-mode photo effects and 3D content creation.
    example: >-
      Monocular depth is good enough for the background blur, but the robot still relies on its
      stereo camera.
formula_latex: Z = \frac{f\,B}{d}
origin: >-
  Computational stereo was formulated in the 1970s, notably in David Marr and Tomaso Poggio's
  cooperative stereo algorithm (1976), drawing on photogrammetry. Deep monocular depth estimation
  began with David Eigen, Christian Puhrsch and Rob Fergus's multi-scale network (NeurIPS 2014).
note: >-
  Relative depth maps look convincing but cannot be used directly for measurement; check whether a
  model outputs relative depth, metric depth or inverse depth (disparity).
