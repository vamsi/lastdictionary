level: core
plain: >-
  A free OpenAI model that writes down what is said in recordings in many languages, and can
  translate it into English; it learned from hundreds of thousands of hours of online audio.
senses:
  - definition: >-
      A family of open-weight [[speech-recognition|speech recognition]] models released by OpenAI.
      Each is a [[transformer|transformer]] [[encoder-decoder-architecture|encoder–decoder]] whose
      encoder hears audio in fixed 30-second windows, resampled to 16 kHz and turned into a
      log-[[mel-spectrogram|mel spectrogram]], and whose decoder writes text [[token|tokens]] one at
      a time. Control tokens opening the output choose the task (transcribing, translating into
      English, identifying the language, timestamping or detecting no speech), so one network covers
      several pipeline stages. Its training data were 680,000 hours of web audio with loosely
      matched transcripts ('weak supervision'), roughly a third of it in languages other than
      English, and it generalizes zero-shot to new datasets far better than models fine-tuned on a
      single benchmark, approaching human robustness to accents and noise in English. Sizes range
      from tiny (39 million parameters) to large (1.55 billion); large-v3 (2023) was trained on
      several million hours, including pseudo-labeled audio, and 'turbo' (2024) shrank the decoder
      for speed. Code and weights are MIT-licensed, which made Whisper a default for open-source
      transcription and spawned many faster reimplementations.
    example: We run Whisper turbo locally so interview recordings never leave the newsroom.
origin: >-
  Released by OpenAI on 21 September 2022 and described in 'Robust Speech Recognition via
  Large-Scale Weak Supervision' by Alec Radford, Jong Wook Kim, Tao Xu, Greg Brockman, Christine
  McLeavey and Ilya Sutskever (arXiv December 2022; ICML 2023).
year: 2022
note: >-
  Whisper can hallucinate fluent text during silence or noise, a documented risk in medical and
  legal transcription; filtering with [[voice-activity-detection|voice activity detection]] and
  human review reduce it. Its text normalization affects measured [[word-error-rate|word error
  rate]].
