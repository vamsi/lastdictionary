# yaml-language-server: $schema=../schema/entry.schema.json

term: workslop
id: workslop
pos: n.
domain: society
domains:
  - culture
labels:
  - emerging
  - informal
level: core
plain: >-
  AI-generated work that looks polished but does not actually get the job done, quietly passing the
  real effort to whoever receives it, who must then puzzle it out or start over.
senses:
  - definition: >-
      Material produced with [[generative-ai|generative AI]] in the workplace (memos, reports, slide
      decks, code, emails) whose professional finish hides a lack of real content, so that the labor
      of making it usable falls on the person who receives it rather than on the one who sent it. In
      the survey that introduced the term, roughly 40% of US desk workers said they had received
      such material recently; recipients spent nearly two hours dealing with each instance and
      reported thinking less of the sender's competence and reliability. The authors estimated the
      hidden cost at about US$186 per employee per month and argued that blanket mandates to use AI
      encourage it.
    example: >-
      The quarterly review was pure workslop: twelve tidy pages and not one number we could use.
origin: >-
  Coined by Kate Niederhoffer, Gabriella Rosen Kellerman, Angela Lee, Alex Liebscher, Kristina
  Rapuano and Jeffrey T. Hancock of BetterUp Labs and the Stanford Social Media Lab in a Harvard
  Business Review article published on 22 September 2025. A blend of 'work' and 'slop', it spread
  quickly through business media.
year: 2025
note: >-
  Unlike [[ai-slop|AI slop]], which is published to attract attention, workslop circulates inside
  organizations and its cost falls on colleagues. The figures come from a self-reported online
  survey.
see_also:
  - AI slop
  - overreliance
  - automation bias
  - augmentation
  - AI hype
  - generative AI
sources:
  - text: >-
      Niederhoffer, K., Rosen Kellerman, G., Lee, A., Liebscher, A., Rapuano, K. & Hancock, J. T.
      (2025). AI-Generated "Workslop" Is Destroying Productivity. Harvard Business Review, 22
      September 2025.
    url: https://hbr.org/2025/09/ai-generated-workslop-is-destroying-productivity
as_of: 2026-10
