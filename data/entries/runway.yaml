domain: orgs
domains:
  - gen
level: specialist
plain: >-
  A New York company that makes AI tools for generating and editing video, used by filmmakers and
  artists; it helped create the image generator Stable Diffusion.
senses:
  - definition: >-
      An American company that develops generative AI tools for video, film and design. Its
      researchers co-authored the [[latent-diffusion-model|latent diffusion model]] work behind
      [[stable-diffusion|Stable Diffusion]] (2022), and its Gen-1 and Gen-2 models (2023) were among
      the first commercially available video-to-video and [[text-to-video-model|text-to-video]]
      generators; later generations such as Gen-4 (2025) improved the consistency of characters and
      scenes across shots. It markets to filmmakers and studios, built a custom model trained on
      Lionsgate's film library (2024), has run an annual AI Film Festival since 2023, and is
      developing [[world-model|world models]] that generate interactive environments. Its work sits
      at the center of disputes over AI in the film industry.
origin: >-
  Founded in 2018 in New York by Cristóbal Valenzuela, its chief executive, Alejandro Matamala and
  Anastasis Germanidis, who met as students at New York University's Interactive Telecommunications
  Program; it began as a platform for using machine learning models in creative software.
year: 2018
