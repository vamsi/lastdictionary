domain: gov
domains:
  - safety
  - hist
level: essential
plain: >-
  A series of international meetings of governments, AI companies and researchers, begun in England
  in 2023, to agree on how to handle the risks and benefits of the most advanced AI.
senses:
  - definition: >-
      A series of international summits on advanced AI. The first, the AI Safety Summit at Bletchley
      Park, United Kingdom, on 1–2 November 2023, produced the [[bletchley-declaration|Bletchley
      Declaration]], agreements by leading developers to give governments access to test models
      before release, the commissioning of the [[international-ai-safety-report|International AI
      Safety Report]], and the launch of the UK and US [[ai-safety-institute|AI safety institutes]].
      The AI Seoul Summit (May 2024, co-hosted by South Korea and the UK) yielded the Seoul
      Declaration, a plan to network the safety institutes and the
      [[frontier-ai-safety-commitments|Frontier AI Safety Commitments]] of 16 companies. France's AI
      Action Summit (Paris, February 2025) widened the agenda to public-interest AI, energy and the
      economy; the United States and the United Kingdom declined to sign its statement on inclusive
      and sustainable AI. India's AI Impact Summit (New Delhi, February 2026), the first hosted in
      the Global South, ended on 21 February with a non-binding New Delhi Declaration signed by more
      than 80 countries, including the United States and China.
    example: >-
      Each AI summit since Bletchley has said less about catastrophic risk and more about adoption.
origin: >-
  Announced by UK Prime Minister Rishi Sunak in June 2023 and held at Bletchley Park, the Second
  World War code-breaking center. 'AI Safety Summit' was the official name of the first meeting
  only, but is widely used for the series. A further summit was announced for Geneva, Switzerland,
  in 2027.
year: 2023
note: >-
  The successive names — safety, action, impact — are widely read as a shift in priorities from
  managing frontier risks toward adoption and competitiveness, a shift mirrored in the UK
  institute's 2025 renaming as the AI Security Institute.
