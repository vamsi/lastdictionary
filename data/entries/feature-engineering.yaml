      Domingos, P. (2012). A Few Useful Things to Know about Machine Learning. Communications of the
      ACM 55(10).
  - text: >-
      Zheng, A. & Casari, A. (2018). Feature Engineering for Machine Learning. Sebastopol: O'Reilly
