level: core
plain: >-
  A company owned by Google's parent, Alphabet, that runs fully driverless robotaxi services in
  several American cities.
senses:
  - definition: >-
      An autonomous-driving company owned by Alphabet and the leading operator of fully driverless
      [[robotaxi|robotaxi]] services. Its vehicles combine [[lidar|lidar]], radar and cameras with
      machine-learned perception, prediction and planning, trained on extensive real and simulated
      driving. It began public rides with no one in the driver's seat in the Phoenix area in 2020
      and as of October 2026 runs commercial service in cities including Phoenix, San Francisco, Los
      Angeles, Austin, Atlanta and Miami, with service announced for further US cities and for
      London, and testing in Tokyo. Its published safety analyses report substantially fewer injury
      crashes per mile than human drivers, while incidents and software recalls — including one in
      2025 over passing stopped school buses — have drawn regulatory scrutiny. It is the most
      extensive demonstration to date of [[autonomous-vehicle|autonomous vehicles]] operating
      commercially without safety drivers.
origin: >-
  Began in January 2009 as Google's self-driving car project, led by Sebastian Thrun and staffed
  largely by veterans of the [[darpa-grand-challenge|DARPA Grand Challenge]]; it was spun out as
  Waymo, a subsidiary of Alphabet, in December 2016. Tekedra Mawakana and Dmitri Dolgov have been
  co-chief executives since 2021.
year: 2009
