plain: >-
  The two 2024 Nobel Prizes, in physics and chemistry, that honored artificial intelligence research
  for the first time, recognizing neural-network pioneers and the protein-structure system
  AlphaFold.
senses:
  - definition: >-
      The pair of 2024 Nobel Prizes that for the first time recognized research in artificial
      intelligence. The physics prize, announced on 8 October 2024, went to [[john-hopfield|John
      Hopfield]] and [[geoffrey-hinton|Geoffrey Hinton]] 'for foundational discoveries and
      inventions that enable machine learning with artificial neural networks', citing the
      [[hopfield-network|Hopfield network]] and the [[boltzmann-machine|Boltzmann machine]] and
      their roots in statistical physics. The chemistry prize, announced the next day, went half to
      David Baker for computational protein design and half to [[demis-hassabis|Demis Hassabis]] and
      John Jumper of [[google-deepmind|Google DeepMind]] for protein structure prediction with
      [[alphafold|AlphaFold]]. The awards were widely read as institutional recognition of AI's
      scientific importance; some physicists questioned whether neural-network research belonged
      under physics, and Hinton used the occasion to warn of AI's risks. The 2025 and 2026 physics
      and chemistry prizes went to work in other fields (the 2026 physics prize to Francis Halzen
      for the IceCube neutrino observatory; chemistry to Henri Kagan and Kenso Soai).
    example: >-
      After the 2024 Nobel Prizes for AI, few still called deep learning a passing fashion.
origin: >-
  Not an official category: the phrase is a journalistic grouping of the 2024 physics and chemistry
  awards made by the Royal Swedish Academy of Sciences. Computing's own highest honor is the
  [[turing-award|Turing Award]].
year: 2024
