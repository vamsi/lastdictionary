plain: >-
  A major lawsuit, filed in 2023, in which The New York Times accuses OpenAI and Microsoft of
  copying millions of its articles to train ChatGPT and of letting the chatbot reproduce its
  journalism.
senses:
  - definition: >-
      A copyright suit filed on December 27, 2023 in the US District Court for the Southern District
      of New York by The New York Times Company against OpenAI and Microsoft, the most prominent of
      the news publishers' cases against AI developers. The Times alleges that millions of its
      articles were copied to train GPT models; that ChatGPT and Microsoft's Copilot can output
      near-verbatim passages, which its complaint illustrated with regurgitated articles; that the
      products summarize and substitute for paywalled reporting; and that models attribute
      fabricated content to the paper, harming its trademarks. OpenAI responds that training is
      [[fair-use-and-ai-training|fair use]], that regurgitation is a rare bug elicited by
      manipulative prompting, and that its products do not substitute for journalism. In 2025 the
      case was consolidated with authors' and other publishers' suits before Judge Sidney Stein, and
      orders requiring OpenAI to preserve and produce samples of ChatGPT user logs drew privacy
      objections. As of October 2026 the parties in the consolidated cases were briefing summary
      judgment.
    example: >-
      Discovery in New York Times v. OpenAI turned partly on a sample of twenty million ChatGPT logs.
origin: >-
  Filed after licensing talks between the Times and OpenAI broke down in 2023; in April 2025 the
  Judicial Panel on Multidistrict Litigation centralized the US copyright cases against OpenAI in
  New York as In re OpenAI, Inc. Copyright Infringement Litigation.
year: 2023
note: >-
  Other publishers chose licensing deals with OpenAI instead, and the Times itself licensed content
  for AI use to Amazon in 2025, illustrating the two paths, litigation and licensing, that the news
  industry has taken.
