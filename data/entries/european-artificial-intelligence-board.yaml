term: European Artificial Intelligence Board
id: european-artificial-intelligence-board
pos: prop. n.
also:
  - AI Board
  - European AI Board
domain: gov
domains:
  - orgs
labels:
  - legal
level: specialist
plain: >-
  A committee of representatives from every EU country that helps apply the EU AI Act consistently
  across Europe and advises the European Commission.
senses:
  - definition: >-
      The body set up by the [[eu-ai-act|EU AI Act]] to keep the Act's application consistent across
      the Union. Each member state sends one representative, and one of them chairs it; the European
      Data Protection Supervisor observes, and the [[ai-office|AI Office]] runs the secretariat and
      attends without voting. Its role is advisory: it helps national authorities coordinate and
      pool know-how, gives the Commission and member states opinions and recommendations on
      implementation, including on codes of practice, guidelines and
      [[harmonised-standards|harmonised standards]], and helps spread AI literacy. A stakeholder
      advisory forum and a scientific panel of independent experts support it.
    example: The AI Board and the Commission both judged the code of practice adequate.
origin: >-
  Proposed in the Commission's 2021 draft, which would have had the Commission chair it; the final
  Act (Article 65) gave the chair to a member state. The Board began meeting in 2024.
year: 2024
note: >-
  Not to be confused with the AI Office, which is part of the Commission. Structurally similar to
  the European Data Protection Board under the GDPR, but with advisory rather than binding powers.
see_also:
  - AI Office
  - EU AI Act
  - General-Purpose AI Code of Practice
  - harmonised standards
standards: >-
  EU AI Act (Reg. (EU) 2024/1689), Arts. 65–66; advisory forum Art. 67; scientific panel Art. 68
