plain: >-
  A London artificial intelligence company, bought by Google in 2014, famous for programs that
  mastered the game of Go and predicted the shapes of proteins. In 2023 it merged into Google
  DeepMind.
senses:
  - definition: >-
      A British AI research laboratory (2010–2023) that set out to build
      [[artificial-general-intelligence|artificial general intelligence]] by combining
      [[deep-learning|deep learning]], [[reinforcement-learning|reinforcement learning]] and ideas
      from neuroscience. Its [[deep-q-network|deep Q-network]] learned dozens of Atari games from
      raw pixels (2013–2015); [[alphago|AlphaGo]] defeated Lee Sedol at Go in 2016 and was followed
      by [[alphazero|AlphaZero]] and [[muzero|MuZero]]; [[wavenet|WaveNet]] (2016) changed speech
      synthesis; and [[alphafold|AlphaFold]] (2018–2021) largely solved the prediction of protein
      structures, bringing Demis Hassabis and John Jumper a share of the 2024 Nobel Prize in
      Chemistry. Other work included [[alphastar|AlphaStar]] for the video game StarCraft II, the
      generalist agent [[gato|Gato]] and the compute-optimal Chinchilla model behind the
      [[chinchilla-scaling-laws|Chinchilla scaling laws]]. Its health unit's access to about 1.6
      million London patient records led the UK Information Commissioner to rule in 2017 that the
      supplying hospital trust had broken data-protection law.
    example: >-
      Before the merger, DeepMind and Google Brain competed for the same compute and the same
      researchers.
origin: >-
  Founded in London in 2010 by Demis Hassabis, Shane Legg and Mustafa Suleyman; Hassabis and Legg
  had met as researchers at University College London's Gatsby Computational Neuroscience Unit.
  Google announced its acquisition in January 2014. In April 2023 it was merged with
  [[google-brain|Google Brain]] to form [[google-deepmind|Google DeepMind]].
year: 2010
note: >-
  Journalists still say 'DeepMind' for the merged unit; strictly, this headword covers the
  independent lab and Google subsidiary of 2010–2023, and [[google-deepmind|Google DeepMind]] its
  successor.
