dates: b. 1954
plain: >-
  An Australian-American roboticist who argued that intelligence grows out of acting in the world
  rather than abstract reasoning, and who co-founded the company behind the Roomba vacuum.
senses:
  - definition: >-
      Australian-born roboticist at MIT, where he directed the AI Laboratory and then its successor,
      the Computer Science and Artificial Intelligence Laboratory (CSAIL), from 1997 to 2007.
      Against the sense–plan–act approach of [[good-old-fashioned-ai|good old-fashioned AI]], he
      proposed the subsumption architecture (1986), in which layers of simple behaviors coupled
      directly to sensors run in parallel and higher layers can override lower ones; papers such as
      'Elephants Don't Play Chess' (1990) and 'Intelligence without Representation' (1991) made the
      case for behavior-based, [[embodied-ai|embodied]] robotics. His lab built the six-legged
      walker Genghis and the humanoid Cog. He co-founded iRobot (1990), maker of the Roomba; Rethink
      Robotics (2008), maker of the [[collaborative-robot|collaborative robot]] Baxter; and
      Robust.AI (2019). He is known for publicly scoring his own dated predictions each year and for
      skepticism about AI hype.
