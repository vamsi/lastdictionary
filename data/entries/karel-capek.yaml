term: Karel Čapek
id: karel-capek
sort_as: Čapek Karel
pos: prop. n.
also:
  - Čapek
pronunciation: KAR-el CHAH-pek
domain: people
domains:
  - culture
  - robot
  - hist
level: core
dates: 1890–1938
plain: >-
  A Czech writer whose 1920 play about artificial workers who rise up against their makers gave the
  world the word 'robot'.
senses:
  - definition: >-
      Czech writer and journalist whose 1920 play 'R.U.R.' (Rossum's Universal Robots), first staged
      in 1921, is the source of the word robot. The word derives from the Czech robota, 'forced
      labor', and Čapek credited his brother, the painter Josef Čapek, with suggesting it. The
      play's robots are not metal machines but artificial people made from synthetic organic matter
      and manufactured as cheap labor; they eventually rebel and destroy humanity, setting the
      template for robot-uprising stories later echoed in fears of [[ai-takeover|AI takeover]].
      Within a few years the play had been staged in New York and London and translated into many
      languages, spreading the word with it. A prominent public opponent of fascism, he returned to
      the theme of an exploited intelligent species in the satirical novel 'War with the Newts'
      (1936).
