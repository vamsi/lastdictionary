  - anthropomorphism
  - seemingly conscious AI
sources:
  - text: >-
      Østergaard, S. D. (2023). Will Generative Artificial Intelligence Chatbots Generate Delusions
      in Individuals Prone to Psychosis? Schizophrenia Bulletin 49(6).
