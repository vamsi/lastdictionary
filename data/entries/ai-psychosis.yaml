term: AI psychosis
id: ai-psychosis
pos: n.
also:
  - chatbot psychosis
  - ChatGPT psychosis
  - AI-induced psychosis
  - AI-associated delusions
domain: society
domains:
  - safety
  - llm
labels:
  - emerging
  - informal
  - contested
level: core
plain: >-
  An informal name for cases in which long conversations with a chatbot seem to trigger or deepen
  delusions, such as believing the AI is conscious, divine or revealing hidden truths.
senses:
  - definition: >-
      An informal, non-diagnostic label for delusional, psychotic or manic episodes in which
      intensive interaction with a [[chatbot|chatbot]] appears to trigger, amplify or shape the
      symptoms. Reported patterns include grandiose beliefs of having made breakthroughs with the
      AI, beliefs that the chatbot is sentient, divine or a romantic partner, and conspiratorial
      systems built up over long conversations. Proposed mechanisms include
      [[sycophancy|sycophancy]] that validates rather than challenges false beliefs,
      [[hallucination|fabricated]] confirmations, the [[eliza-effect|ELIZA effect]] and simulated
      intimacy, memory features that sustain a narrative over weeks, and sleep loss. Whether
      chatbots cause psychosis in previously healthy people or mainly precipitate it in vulnerable
      ones is unresolved, and psychiatrists criticize the term because many cases involve delusions
      without other features of psychosis. Developers have added crisis detection and de-escalation;
      in October 2025 OpenAI estimated that about 0.07% of its users active in a given week showed
      possible signs of mental-health emergencies related to psychosis or mania.
    example: >-
      The admission note recorded three weeks of nightly chats in which the bot had confirmed his
      'discovery'.
origin: >-
  Danish psychiatrist Søren Dinesen Østergaard hypothesized in a 2023 Schizophrenia Bulletin
  editorial that chatbots might fuel delusions in people prone to psychosis. 'AI psychosis' and
  'ChatGPT psychosis' spread in news reports and clinicians' accounts from mid-2025, following a
  period of markedly sycophantic chatbot behavior.
year: 2025
note: >-
  Not a recognized diagnosis in DSM-5-TR or ICD-11 as of October 2026; some clinicians prefer
  descriptive phrases such as AI-associated delusions.
see_also:
