term: circular deal
id: circular-deal
pos: n.
also:
  - circular financing
  - circular deals
  - circular investment
  - AI circularity
domain: society
domains:
  - hw
labels:
  - emerging
level: specialist
plain: >-
  A business arrangement in which an AI chip or cloud supplier invests in, or lends to, a customer
  that then spends the money buying the supplier's own products.
senses:
  - definition: >-
      An arrangement in which money flows in a loop among AI companies: a supplier of chips or
      computing capacity invests in, lends to or grants equity to a customer, which then uses the
      funds or resulting commitments to buy the supplier's products, so that revenue and valuations
      on both sides rest partly on each other. Prominent examples from 2025 include Nvidia's
      announced plan to invest up to US$100 billion in OpenAI alongside OpenAI's commitment to
      deploy about 10 gigawatts of Nvidia systems; OpenAI's agreement to deploy AMD chips in
      exchange for warrants that could make it one of AMD's largest shareholders; and a reported
      US$300 billion computing contract between OpenAI and Oracle. Defenders describe such deals as
      ordinary vendor financing that secures scarce supply; critics compare them to the vendor
      financing of the dot-com era, warning that they inflate apparent demand and concentrate risk.
    example: >-
      Analysts discounted the chipmaker's backlog because so much of it came from circular deals.
origin: >-
  The label 'circular' spread through financial journalism in October 2025, used by outlets
  including NBC News, The Wall Street Journal and The New York Times, after a cluster of such deals
  involving OpenAI in September and October 2025.
year: 2025
note: >-
  Central to debate over an [[ai-bubble|AI bubble]]; a sharp sell-off in AI and chip stocks in late
  June 2026 revived that debate, though analysts disagreed on whether it marked a bubble bursting.
