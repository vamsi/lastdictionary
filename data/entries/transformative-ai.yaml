# yaml-language-server: $schema=../schema/entry.schema.json

term: transformative AI
id: transformative-ai
pos: n.
also:
  - TAI
  - transformative artificial intelligence
domain: asi
domains:
  - society
level: core
plain: >-
  AI that changes the world as deeply as farming or the Industrial Revolution did. It is defined by
  its effects on society and the economy, not by how humanlike or clever it is.
senses:
  - definition: >-
      AI defined by its impact: in Holden Karnofsky's 2016 formulation, AI that 'precipitates a
      transition comparable to (or more significant than) the agricultural or industrial
      revolution'. The definition is deliberately about consequences rather than mechanism: a system
      need not be general, conscious or humanlike to qualify, and a collection of narrower systems
      would count if together they, for instance, automated most scientific and technological
      progress. Researchers operationalize it in several ways: a sustained rise in world economic
      growth to several times its historical rate ([[explosive-growth|explosive growth]]),
      automation of most remote cognitive work, or what Holden Karnofsky called PASTA, a process for
      automating scientific and technological advancement. Because it sidesteps arguments over what
      counts as intelligence, TAI is the usual target variable in quantitative [[ai-timelines|AI
      timelines]] work, including the [[biological-anchors|biological anchors]] report and models by
      [[epoch-ai|Epoch AI]]. Ross Gruetzemacher and Jess Whittlestone use three levels: narrowly
      transformative AI (lasting change within one domain), transformative AI (comparable to
      general-purpose technologies such as electricity) and radically transformative AI (comparable
      to the agricultural or industrial revolution), so their TAI is a lower bar than Karnofsky's.
    example: >-
      The question for our forecast is not when we get AGI but when we get transformative AI.
origin: >-
  Introduced by Holden Karnofsky as 'our term' in a May 2016 post setting out the Open Philanthropy
  Project's views on advanced AI, using the agricultural-or-industrial-revolution benchmark. It
  spread through Ajeya Cotra's 2020 biological anchors report and Karnofsky's 2021 essay series 'The
  Most Important Century'; Ross Gruetzemacher and Jess Whittlestone proposed a three-level scheme
  (preprint 2019, published 2022).
year: 2016
