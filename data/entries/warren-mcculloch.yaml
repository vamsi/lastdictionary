plain: >-
  An American brain scientist who, with Walter Pitts, wrote the 1943 paper that first described
  nerve cells as simple logic units, the seed of today's artificial neural networks.
senses:
  - definition: >-
      American neurophysiologist who, with the young logician [[walter-pitts|Walter Pitts]], wrote
      'A Logical Calculus of the Ideas Immanent in Nervous Activity' (1943). The paper treated each
      neuron as an all-or-none switch that fires when enough excitatory inputs are active and no
      inhibitory input is, and showed that networks of such units can realize any expression of
      propositional logic. This [[mcculloch-pitts-neuron|McCulloch–Pitts neuron]] is the ancestor of
      the [[artificial-neuron|artificial neuron]] and of [[neural-network|neural networks]]
      generally, and influenced John von Neumann's design for stored-program computers. McCulloch
      chaired the Macy conferences (1946–1953) at which [[cybernetics|cybernetics]] took shape,
      moved from the University of Illinois to the Research Laboratory of Electronics at MIT in
      1952, and co-wrote 'What the Frog's Eye Tells the Frog's Brain' (1959), a landmark of visual
      neuroscience.
