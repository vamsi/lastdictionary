term: Vector Institute
id: vector-institute
pos: prop. n.
also:
  - Vector Institute for Artificial Intelligence
domain: orgs
domains:
  - dl
level: specialist
plain: >-
  Toronto's publicly and privately funded AI institute, set up in 2017 with Geoffrey Hinton as an
  adviser, which supports university researchers and helps companies, hospitals and government put
  their work to use.
senses:
  - definition: >-
      A Toronto nonprofit, backed by government and industry money, that pays for and organizes
      [[deep-learning|deep learning]] and wider machine learning research by faculty and students,
      chiefly from the University of Toronto and other Ontario universities, and links that research
      to companies, hospitals and public agencies. One of three national AI institutes under the
      Pan-Canadian Artificial Intelligence Strategy, with [[mila|Mila]] in Montreal and Amii in
      Edmonton, it was created to keep in Canada the talent produced by Toronto's deep-learning
      tradition, which includes [[geoffrey-hinton|Geoffrey Hinton]]'s group and [[alexnet|AlexNet]]
      (2012). Its work emphasizes AI in health care, trustworthy and safe AI, and training programs
      that help Canadian industry adopt machine learning.
origin: >-
  Launched in March 2017 with funding from the Government of Canada, the Province of Ontario and
  private companies; Geoffrey Hinton served as its chief scientific adviser.
year: 2017
