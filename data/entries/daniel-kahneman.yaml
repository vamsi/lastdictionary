term: Daniel Kahneman
id: daniel-kahneman
sort_as: Kahneman Daniel
pos: prop. n.
domain: people
domains:
  - mind
  - society
level: core
dates: 1934–2024
plain: >-
  An Israeli-American psychologist who showed how human judgment systematically errs and popularized
  the idea of fast, intuitive versus slow, deliberate thinking, now used to describe AI reasoning.
senses:
  - definition: >-
      Israeli-American psychologist, at the Hebrew University of Jerusalem and later Princeton
      University, who with his longtime collaborator Amos Tversky mapped the predictable ways human
      reasoning departs from the rational ideal, work that reshaped economics and now lends AI
      researchers a vocabulary for machine reasoning. In 1974 the pair showed that people estimate
      likelihoods through mental shortcuts, such as how easily examples come to mind (availability)
      or how typical a case looks (representativeness), and that these shortcuts produce systematic
      errors; their prospect theory (1979) described how people actually choose under risk,
      including loss aversion. Kahneman received the 2002 Nobel Memorial Prize in Economic Sciences,
      Tversky having died in 1996. 'Thinking, Fast and Slow' (2011) popularized the contrast between
      fast, intuitive [[system-1-and-system-2|System 1]] and slow, deliberate System 2 thinking,
      which AI researchers borrow to contrast a model's immediate answers with the
      [[chain-of-thought|step-by-step reasoning]] of [[reasoning-model|reasoning models]]. Prospect
      theory inspired [[kahneman-tversky-optimization|Kahneman–Tversky optimization]] for aligning
      language models, and 'Noise' (2021, with Olivier Sibony and Cass Sunstein) argued that simple
      rules often beat inconsistent human judgment.
