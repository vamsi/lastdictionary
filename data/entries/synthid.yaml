plain: >-
  Google's system for hiding an invisible watermark in pictures, video, audio and text made by its
  AI tools, so they can later be recognized as AI-generated.
senses:
  - definition: >-
      A family of [[ai-watermarking|AI watermarking]] techniques and detectors developed by Google
      DeepMind for content generated by Google's models. For images and video it embeds an
      imperceptible signal designed to survive common edits such as cropping, filtering and
      compression; for audio it does the same in the waveform; for text it uses 'tournament
      sampling', which nudges token choices according to a secret key without measurably reducing
      quality, though detection weakens on short, factual or heavily rewritten passages. Detection
      reports a likelihood rather than a certainty. As of May 2026 Google said it had watermarked
      over 100 billion images and videos, offered verification of images, video and audio in its
      Gemini app and a detection API to partners, and other firms, including OpenAI and NVIDIA, had
      announced adoption alongside [[content-credentials|Content Credentials]] metadata.
    example: The newsroom ran the viral photo through a SynthID check before publishing it.
origin: >-
  Announced by Google DeepMind in August 2023 for images from its Imagen model, then extended to
  audio and, in 2024, to text and video. Sumanth Dathathri and colleagues described the text method
  in Nature (October 2024), when it was also released as open source; a public SynthID Detector
  portal followed in 2025.
year: 2023
