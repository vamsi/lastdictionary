    url: https://openai.com/index/gpt-4-research/
  - text: >-
      Jahanian, A., Chai, L. & Isola, P. (2020). On the 'steerability' of generative adversarial
      networks. ICLR 2020.
    url: https://arxiv.org/abs/1907.07171
