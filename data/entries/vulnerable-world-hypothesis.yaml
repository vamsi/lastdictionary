term: vulnerable world hypothesis
id: vulnerable-world-hypothesis
pos: n.
also:
  - VWH
  - black ball
  - urn of inventions
domain: asi
domains:
  - gov
  - sec
level: specialist
plain: >-
  The idea that some future invention could make mass destruction so easy that civilization would be
  wrecked by default, unless it had unusually strong ways of preventing misuse.
senses:
  - definition: >-
      The hypothesis, set out by Nick Bostrom, that some level of technological capability would
      almost certainly bring the devastation of civilization unless the world had left what he calls
      the semi-anarchic default condition, in which states cannot reliably stop individuals or small
      groups in advance, there is no effective worldwide governance, and enough people have
      destructive motives. Bostrom pictures invention as drawing balls from an urn: most are white
      (beneficial) or gray (mixed), but a black ball, such as a cheap and easy method of mass
      destruction, would devastate any civilization that drew it. Advanced AI appears in the
      argument as a possible black ball, as an amplifier of others, for instance by lowering
      barriers to [[biosecurity|biological weapons]], and as a possible means of stabilization
      through monitoring or governance. The hypothesis is controversial because the remedies Bostrom
      examines, including pervasive surveillance and strong global governance, carry grave risks of
      their own.
    example: >-
      If AI makes pathogen design trivial, we will have drawn a black ball from the urn.
origin: >-
  Proposed by Nick Bostrom in 'The Vulnerable World Hypothesis', circulated as a working paper in
  2018 and published in Global Policy in 2019.
year: 2018
see_also:
  - existential risk
  - global catastrophic risk
  - CBRN risk
  - differential technological development
  - AI governance
  - biosecurity
sources:
  - text: Bostrom, N. (2019). The Vulnerable World Hypothesis. Global Policy 10(4).
