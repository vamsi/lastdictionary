level: core
dates: 1815–1852
plain: >-
  A 19th-century English mathematician who published the first program written for a planned
  mechanical computer, and who argued that such a machine could only do what it was told.
senses:
  - definition: >-
      English mathematician whose 1843 notes gave the most complete account written in her lifetime
      of the Analytical Engine, Charles Babbage's design for a card-programmed mechanical computer
      that was never built. The notes accompanied her English translation of Luigi Menabrea's
      article on the engine and ran to about three times its length. Note G sets out a step-by-step
      procedure for computing Bernoulli numbers, often called the first published computer program,
      and other notes foresaw that the engine could manipulate symbols other than numbers, such as
      musical notes. Her remark that the engine 'has no pretensions whatever to originate anything'
      was answered by [[alan-turing|Alan Turing]] in [[computing-machinery-and-intelligence|his 1950
      paper]] as Lady Lovelace's objection, the source of the [[lovelace-objection|Lovelace
      objection]] to machine creativity. The programming language Ada and Ada Lovelace Day are named
      after her.
note: >-
  Historians debate how much of the notes' mathematics was hers and how much Babbage's; Babbage had
  drafted earlier, unpublished programs for the engine, so 'first programmer' claims need that
  qualification.
see_also:
  - Lovelace objection
  - Computing Machinery and Intelligence
  - Alan Turing
  - algorithm
sources:
  - text: >-
      Lovelace, A. A. (1843). Sketch of the Analytical Engine invented by Charles Babbage, by L. F.
