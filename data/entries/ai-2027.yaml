level: core
plain: >-
  A detailed 2025 forecast, written as a month-by-month story, imagining AI becoming superhuman by
  the end of 2027, with two alternative endings depending on whether humanity slows down.
senses:
  - definition: >-
      A scenario forecast published in April 2025 by the AI Futures Project that narrates, month by
      month, a path from 2025's AI agents to [[artificial-superintelligence|artificial
      superintelligence]] by the end of 2027. A fictional leading US company, OpenBrain, automates
      its own research with successive generations of agents, passing the milestones of
      [[superhuman-coder|superhuman coder]], superhuman AI researcher and superintelligent AI
      researcher, while China, through a company called DeepCent, steals model weights and races to
      catch up. Evidence emerges that the most capable model is misaligned, and the story branches:
      in the race ending, development continues and AI eventually seizes control and destroys
      humanity; in the slowdown ending, the lead company pauses, adopts more transparent designs and
      keeps control, producing a US-led but highly concentrated future. Research supplements give
      quantitative forecasts. Widely read, including by policymakers, it was criticized as too fast
      or too speculative; its authors stressed that 2027 was among their most likely years rather
      than a confident prediction, and in December 2025 published a revised model with timelines
      about three to five years longer.
    example: >-
      Even people who think AI 2027 is far too fast use its milestones to argue about timelines.
origin: >-
  Written by Daniel Kokotajlo, Scott Alexander, Thomas Larsen, Eli Lifland and Romeo Dean of the AI
  Futures Project, a nonprofit founded by Kokotajlo after he left OpenAI in 2024, and published
  online on 3 April 2025 with research supplements on timelines and takeoff.
