plain: >-
  A Georgetown University think tank in Washington, D.C., whose researchers advise the US government
  on AI and national security, paying special attention to China and to the chip supply chain.
senses:
  - definition: >-
      A Washington think tank, housed in Georgetown University's foreign-service school, that writes
      quantitative, evidence-heavy studies of AI and other new technologies for officials
      responsible for national security. Its work covers AI talent and immigration, the Chinese AI
      ecosystem — including translations of Chinese policy documents and studies of Chinese military
      AI procurement — the semiconductor supply chain, AI safety assessment, and AI in biotechnology
      and cybersecurity. Its analyses of chokepoints in chipmaking equipment informed the design of
      US [[export-controls-on-ai-chips|export controls on AI chips]] (2022), and several of its
      researchers moved into government posts. Its funding from
      [[effective-altruism|effective-altruist]] philanthropy, chiefly [[open-philanthropy|Open
      Philanthropy]], has drawn criticism. Helen Toner, who took charge of it in 2025, was among the
      OpenAI board members who removed Sam Altman as chief executive in November 2023.
origin: >-
  Launched in January 2019 with a founding grant of about $55 million from the Open Philanthropy
  Project, under founding director Jason Matheny, a former director of the US Intelligence Advanced
  Research Projects Activity (IARPA). Dewey Murdick later served as executive director until 2025.
year: 2019
