# yaml-language-server: $schema=../schema/entry.schema.json

term: botshit
id: botshit
pos: n.
also:
  - bot-shit
domain: culture
domains:
  - society
  - llm
labels:
  - informal
level: specialist
plain: >-
  A blunt term for false or made-up chatbot output that people pass on and use as if it were true,
  especially at work.
senses:
  - definition: >-
      False or invented chatbot output at the point where a person relies on it unchecked, repeating
      it to others or acting on it. The term adapts Harry Frankfurt's account of 'bullshit' — speech
      produced with indifference to truth — to [[large-language-model|LLMs]], which generate
      plausible text without tracking truth, and locates the harm in the human step of relaying it.
      Its authors proposed managing this epistemic risk by matching use to stakes: tasks where
      accuracy is crucial and hard to verify call for tighter controls than low-stakes or easily
      checked ones. Related philosophical work argues that LLM errors are better described as
      bullshit than as [[hallucination|hallucination]], since the systems are not trying to perceive
      or to tell the truth in the first place.
    example: >-
      The memo cited a regulation that doesn't exist — pure botshit, pasted straight from the
      chatbot.
origin: >-
  Introduced as an analytic term by Tim Hannigan, Ian McCarthy and André Spicer in 'Beware of
  botshit: How to manage the epistemic risks of generative chatbots' (Business Horizons, 2024),
  drawing on Frankfurt's essay 'On Bullshit' (1986; book 2005). A separate paper, 'ChatGPT is
  bullshit', by Michael Townsen Hicks, James Humphries and Joe Slater (Ethics and Information
  Technology, 2024), made the Frankfurt comparison central.
year: 2024
see_also:
  - hallucination
  - confabulation
  - AI slop
  - workslop
  - automation bias
  - overreliance
sources:
  - text: >-
      Hannigan, T. R., McCarthy, I. P. & Spicer, A. (2024). Beware of botshit: How to manage the
      epistemic risks of generative chatbots. Business Horizons, 67(5).
  - text: >-
      Hicks, M. T., Humphries, J. & Slater, J. (2024). ChatGPT is bullshit. Ethics and Information
      Technology, 26.
