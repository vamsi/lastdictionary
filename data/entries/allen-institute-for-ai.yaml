plain: >-
  Paul Allen, a co-founder of Microsoft, created this nonprofit Seattle AI lab in 2014. It is known
  for releasing models together with everything used to build them, and for the Semantic Scholar
  paper search engine.
senses:
  - definition: >-
      A nonprofit AI laboratory in Seattle with a long record in language understanding and
      scientific search and, more recently, in fully [[open-source-ai|open]] language models. Its
      projects include Semantic Scholar (2015), an AI-assisted search engine for scientific
      literature; the AllenNLP software library; [[elmo|ELMo]] (2018), whose contextual word
      representations preceded [[bert|BERT]]; Aristo, a system that passed eighth-grade science
      exams; and the OLMo [[large-language-model|language models]] (from 2024), released together
      with their training data (Dolma), code, training logs and intermediate checkpoints, alongside
      the Tülu post-training recipes and Molmo multimodal models. These fully documented releases
      make it a reference point for research on training data and reproducibility, in contrast to
      [[open-weight-model|open-weight]] releases that disclose only the trained parameters.
origin: >-
  Founded in 2014 by Microsoft co-founder Paul Allen, with Oren Etzioni as founding chief executive
  until 2022. Ali Farhadi led it from 2023 until he stepped down in 2026, after which Peter Clark
  became interim chief executive.
