term: humanist superintelligence
id: humanist-superintelligence
pos: n.
also:
  - HSI
  - medical superintelligence
domain: asi
domains:
  - society
labels:
  - emerging
level: specialist
plain: >-
  Microsoft AI's name for very advanced AI that is deliberately kept limited, controllable and aimed
  at specific human problems such as medicine and energy, rather than all-powerful general systems.
senses:
  - definition: >-
      A vision of [[superintelligence|superintelligence]] as highly capable AI designed to serve
      people, restricted in autonomy and directed at particular problems — medical diagnosis,
      education, clean energy — rather than an unbounded general system meant to outperform humans
      at everything. Its proponents make containment and [[ai-alignment|alignment]] continuing
      preconditions rather than one-time checks, and reject both the framing of a race to
      [[artificial-general-intelligence|AGI]] and the binary of boom versus doom. As an early
      instance they cite 'medical superintelligence': a diagnostic system reported to solve about
      85% of difficult published clinical case challenges, against roughly 20% for experienced
      physicians tested on the same cases.
    example: >-
      Microsoft frames its diagnostic work as humanist superintelligence: superhuman, but only at
      medicine.
origin: >-
  Set out by Mustafa Suleyman, chief executive of Microsoft AI, in the essay 'Towards Humanist
  Superintelligence' (6 November 2025), which also announced the MAI Superintelligence Team that he
  leads.
year: 2025
note: >-
  One of several laboratories' framings of their goal; compare Meta's
  [[personal-superintelligence|personal superintelligence]] and Suleyman's own warnings about
  [[seemingly-conscious-ai|seemingly conscious AI]].
