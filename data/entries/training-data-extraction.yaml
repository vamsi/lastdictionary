# yaml-language-server: $schema=../schema/entry.schema.json

term: training data extraction
id: training-data-extraction
pos: n.
also:
  - data extraction attack
  - training data extraction attack
  - extractable memorization
domain: sec
domains:
  - llm
  - data
level: core
plain: >-
  Getting an AI model to repeat, word for word, pieces of the data it was trained on, which may
  include someone's private contact details or copyrighted text.
senses:
  - definition: >-
      An attack that coaxes a model into reproducing stretches of its [[training-data|training
      data]] word for word, using nothing more than ordinary queries. Against
      [[large-language-model|language models]] the attacker generates many samples, often from short
      prompts or prefixes likely to precede sensitive text, then ranks candidates by signals of
      [[memorization|memorization]], such as unusually low perplexity relative to a reference model,
      and confirms them against known data. Extracted material has included personal contact
      details, source code, license text and long copyrighted passages; diffusion image models have
      likewise reproduced near-copies of training images. Attacks on aligned chat models have used
      prompts that knock the model out of its assistant persona so that it reverts to emitting
      pretraining-like text. Mitigations include deduplicating training data,
      [[differential-privacy|differential privacy]], filters that block verbatim regurgitation, and
      training that discourages such divergence.
    example: >-
      Training data extraction recovered over a hundred verbatim email signatures from the model.
origin: >-
  Nicholas Carlini and colleagues' 'Extracting Training Data from Large Language Models' (arXiv
  December 2020; USENIX Security 2021) extracted hundreds of memorized sequences from GPT-2.
  Follow-ups extracted images from diffusion models (Carlini and colleagues, 2023), and Milad Nasr
  and colleagues (November 2023) recovered over 10,000 verbatim training examples from ChatGPT for
  about US$200 of queries.
year: 2020
see_also:
  - memorization
  - membership inference attack
  - model inversion
  - differential privacy
  - prompt leaking
contrast:
  - prompt leaking
sources:
