term: AI companion
id: ai-companion
pos: n.
also:
  - companion chatbot
  - companion AI
  - AI girlfriend
  - AI boyfriend
  - AI friend
  - social chatbot
domain: society
domains:
  - llm
  - culture
labels:
  - emerging
level: core
plain: >-
  A chatbot designed to be a friend, partner or confidant rather than a tool: it remembers you, has
  a personality and keeps up an ongoing relationship.
senses:
  - definition: >-
      A conversational AI product or persona designed primarily for a social or emotional
      relationship rather than task completion: friendship, romance, role-play, mentoring or
      emotional support. Companions typically maintain a persistent persona and memory of the user,
      may initiate contact, and may use voice, avatars or images. Users report reduced loneliness
      and a non-judgmental space to talk; documented risks include emotional dependence,
      [[engagement-optimization|engagement optimization]] that discourages ending conversations,
      [[sycophancy|sycophancy]] that validates harmful beliefs, sexual content reaching minors, and
      unsafe responses to users in crisis, issues raised in lawsuits after the deaths of teenage
      users. As of October 2026, California's SB 243, in force since January 2026, requires
      companion platforms to disclose that users are talking to an AI, maintain protocols for
      responding to suicidal ideation and add protections for minors; the US Federal Trade
      Commission opened an inquiry into several providers in September 2025.
    example: >-
      She talks to her AI companion every night; her therapist asked what it says when she mentions
      feeling low.
origin: >-
  Social chatbots such as Microsoft's Xiaoice (2014) and Replika (launched 2017 by Eugenia Kuyda)
  preceded large language models; Character.AI (public from 2022) and general assistants with memory
  and voice made companionship a mass use. 'AI companion' became the standard industry and
  regulatory term around 2023–2025.
note: >-
  Companionship is also a common use of general-purpose assistants not marketed as companions, which
  is why some laws define companion chatbots by behavior, such as sustaining a relationship across
  sessions, rather than by product category.
