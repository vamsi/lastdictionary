level: core
dates: 1916–2001
plain: >-
  An American scientist of decision-making who, with Allen Newell, wrote some of the first AI
  programs and argued that minds and computers both think by manipulating symbols.
senses:
  - definition: >-
      American social scientist and AI pioneer, at Carnegie Mellon University (then the Carnegie
      Institute of Technology) from 1949. In economics and management he argued that
      decision-makers, limited in information, time and mental capacity, do not optimize but settle
      for options that are good enough, the ideas of bounded rationality and 'satisficing' that he
      introduced. With [[allen-newell|Allen Newell]] and the programmer Cliff Shaw he created the
      [[logic-theorist|Logic Theorist]] (1956), which proved theorems from Whitehead and Russell's
      Principia Mathematica, and the [[general-problem-solver|General Problem Solver]] (1957), which
      used means–ends analysis. With Newell he framed intelligence as search guided by
      [[heuristic|heuristics]], stated the [[physical-symbol-system-hypothesis|physical symbol
      system hypothesis]] (1976), and helped found [[cognitive-science|cognitive science]] by
      modeling human thought as information processing. He shared the 1975 [[turing-award|Turing
      Award]] with Newell and received the 1978 Nobel Memorial Prize in Economic Sciences. Some of
      his forecasts, such as a computer chess champion within ten years (made in 1957), proved
      premature.
