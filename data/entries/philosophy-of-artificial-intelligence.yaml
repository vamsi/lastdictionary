term: philosophy of artificial intelligence
id: philosophy-of-artificial-intelligence
pos: n.
also:
  - philosophy of AI
domain: mind
domains:
  - core
  - society
level: core
plain: >-
  The branch of philosophy that asks what AI is and could be: whether machines can think, understand
  or be conscious, what intelligence is, and what we owe to and should expect from intelligent
  machines.
senses:
  - definition: >-
      The part of philosophy concerned with what [[artificial-intelligence|artificial intelligence]]
      is, what it presupposes and what follows from it, drawing on philosophy of mind, epistemology,
      philosophy of science and ethics. Its classic questions are whether machines can think, as
      Alan Turing asked in [[computing-machinery-and-intelligence|Computing Machinery and
      Intelligence]]; whether running a program could suffice for understanding or consciousness
      ([[strong-ai|strong AI]], the [[chinese-room|Chinese room]], [[functionalism|functionalism]]);
      how symbols acquire meaning ([[symbol-grounding-problem|symbol grounding problem]],
      [[intentionality|intentionality]]); and whether there are principled limits to machine
      intelligence ([[lucas-penrose-argument|Lucas–Penrose argument]],
      [[dreyfus-s-critique-of-ai|Dreyfus's critique of AI]]). Since the arrival of
      [[large-language-model|large language models]] it has turned to whether such systems
      understand, reason, hold beliefs or have [[world-model|world models]], whether they could be
      [[machine-consciousness|conscious]] or [[moral-patienthood|moral patients]], and how to
      interpret scientific claims about them, such as reports of [[emergence|emergence]]. Ethical
      and political questions are usually treated under [[ai-ethics|AI ethics]].
origin: >-
  Usually dated from Alan Turing's 'Computing Machinery and Intelligence' (Mind, 1950); J. R. Lucas
  (1961), Hubert Dreyfus (1965) and John Searle (1980) set its classic agenda, and Margaret Boden's
  anthology The Philosophy of Artificial Intelligence (1990) helped fix the name.
year: 1950
see_also:
