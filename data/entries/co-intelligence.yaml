term: co-intelligence
id: co-intelligence
pos: n.
domain: culture
domains:
  - society
level: specialist
plain: >-
  Ethan Mollick's term for working and thinking alongside AI as a partner — treating it like a
  capable but odd colleague whose strengths and blind spots you learn through experience.
senses:
  - definition: >-
      A framing of human–AI collaboration in which AI systems are treated as partners in thinking
      and work — coworker, tutor, coach or creative collaborator — rather than as mere tools or as
      replacements, with the human supplying judgment, context and accountability. Its popularizer
      offered working rules: bring AI into every task to discover where it helps; keep a human in
      the loop; give the AI a defined persona while remembering it is not a person; and assume the
      current model is the worst one you will ever use. The framing draws on evidence of large but
      uneven productivity gains (see [[jagged-frontier|jagged frontier]]) and distinguishes
      collaboration styles such as [[centaur|centaurs]], who divide tasks between human and machine,
      and cyborgs, who weave the two together.
    example: >-
      Treat it as co-intelligence: let it draft, argue with it, and keep the final call yourself.
origin: >-
  Popularized by Ethan Mollick, a professor at the Wharton School of the University of Pennsylvania,
  in his book Co-Intelligence: Living and Working with AI (April 2024), which grew out of his
  newsletter One Useful Thing. The word had earlier, unrelated uses, notably Tom Atlee's
  Co-Intelligence Institute (founded in the 1990s) on collective intelligence.
year: 2024
see_also:
