level: specialist
plain: >-
  An American company that rents out huge numbers of Nvidia graphics processors over the internet to
  AI developers such as Microsoft, OpenAI and Meta.
senses:
  - definition: >-
      An American cloud-computing company that rents [[gpu|GPUs]] for AI training and
      [[inference|inference]], the best-known of the [[neocloud|neoclouds]] — GPU-focused providers
      competing with general-purpose clouds such as Amazon Web Services and Microsoft Azure. It
      builds and leases [[ai-data-center|AI data centers]] filled mainly with Nvidia systems, often
      among the first to deploy each new generation, and its largest customers have included
      Microsoft, OpenAI and Meta. Nvidia is both its main supplier and an investor. Its rapid
      expansion has been financed largely with debt secured on GPUs and customer contracts, which
      critics cite as evidence of financial fragility and circular dealing in the AI build-out. In
      2025 it acquired Weights & Biases, maker of tools for tracking machine learning experiments.
origin: >-
  Founded in 2017 in New Jersey as Atlantic Crypto, an Ethereum-mining operation, by Michael
  Intrator, Brian Venturo, Brannin McBee and Peter Salanki; after the 2018 cryptocurrency crash it
  repurposed its GPUs for cloud computing and was renamed CoreWeave in 2019. It listed on the Nasdaq
  exchange in March 2025.
year: 2017
