plain: >-
  A top machine learning journal, started in 2000 by researchers who wanted an alternative to
  commercial publishing, that costs nothing to read or to publish in.
senses:
  - definition: >-
      The Journal of Machine Learning Research, a community-run [[machine-learning|machine
      learning]] journal that charges neither readers nor authors, an early model of 'diamond' open
      access. It publishes long theoretical and methodological papers as well as a track for
      open-source software; notable articles include latent Dirichlet allocation (2003),
      scikit-learn (2011) and [[dropout|dropout]] (2014). Its sister series, the Proceedings of
      Machine Learning Research (PMLR), publishes the proceedings of [[icml|ICML]], AISTATS, COLT
      and other conferences. A newer journal in the same spirit, Transactions on Machine Learning
      Research (TMLR, 2022), reviews submissions openly on [[openreview|OpenReview]] on a rolling
      basis and judges them on correctness and interest rather than perceived significance.
origin: >-
  Founded in 2000 by Leslie Pack Kaelbling, its first editor-in-chief. In 2001 some forty members of
  the editorial board of the commercial journal Machine Learning resigned, objecting to its access
  restrictions and prices, and declared their support for JMLR.
year: 2000
