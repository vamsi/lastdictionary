term: global catastrophic risk
id: global-catastrophic-risk
pos: n.
also:
  - GCR
domain: asi
domains:
  - gov
  - society
level: specialist
plain: >-
  A risk of disaster big enough to badly damage human civilization worldwide, such as killing a
  large share of humanity, even if humanity eventually recovers.
senses:
  - definition: >-
      The risk of an event severe enough to harm people across the whole world, such as the death of
      a significant fraction of the world's population or the collapse of critical global systems.
      Thresholds vary, from 10 million deaths or 10 trillion dollars in damage, as proposed by Nick
      Bostrom and Milan Ćirković, to the loss of a tenth of the world's population. Global
      catastrophic risks include all [[existential-risk|existential risks]] but are broader: a
      catastrophe from which humanity eventually recovers is global-catastrophic but not
      existential. AI governance has adopted related categories of catastrophic or severe risk with
      much lower thresholds; California's [[sb-53|SB 53]], for instance, ties catastrophic risk to
      incidents causing more than 50 deaths or serious injuries or over a billion dollars in damage,
      through pathways such as [[cbrn-risk|weapons of mass destruction]], cyberattacks and
      [[loss-of-control|loss of control]].
    example: >-
      Engineered pandemics rank high on most global catastrophic risk lists, and AI could make them
      easier to create.
origin: >-
  Popularized by the volume Global Catastrophic Risks (2008), edited by Nick Bostrom and Milan M.
  Ćirković, and by research centers built around the concept, including Oxford's
  [[future-of-humanity-institute|Future of Humanity Institute]] (2005–2024), the Global Catastrophic
  Risk Institute (2011) and Cambridge's Centre for the Study of Existential Risk (2012).
year: 2008
