term: AI-box experiment
id: ai-box-experiment
pos: n.
also:
  - AI-box game
domain: asi
domains:
  - safety
  - culture
level: specialist
plain: >-
  A role-playing test in which one person pretends to be a trapped super-smart AI and tries, by text
  chat alone, to talk a 'gatekeeper' into letting it out.
senses:
  - definition: >-
      A role-play in which one participant acts as a superintelligent AI confined in a box and
      another as a gatekeeper who alone can release it; they communicate only by text for an agreed
      period, typically at least two hours, and the AI wins if the gatekeeper agrees to let it out.
      Eliezer Yudkowsky, playing the AI, reported winning his first two games in 2002 against
      participants who had said no AI could persuade them; later games had mixed results. By
      agreement the transcripts were kept secret, so the arguments used are unknown. The intended
      lesson is that if a human can sometimes talk their way out, a far smarter system could do so
      more reliably, so confinement that depends on human gatekeepers is unsafe. Critics note that
      the games are anecdotal and unrecorded and may turn on arguments about the experiment itself
      rather than about AI.
    example: >-
      The AI-box experiment is cited as evidence that human gatekeepers are the weak point of any
      containment plan.
origin: >-
  Devised and first run by Eliezer Yudkowsky in 2002, with results reported on the SL4 mailing list
  and his website; others have since run similar games.
year: 2002
