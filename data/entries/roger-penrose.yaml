dates: b. 1931
plain: >-
  A British mathematical physicist and Nobel laureate who argues that human understanding is not
  computational, so that no computer, however powerful, could truly think like a mathematician.
senses:
  - definition: >-
      British mathematical physicist, Emeritus Rouse Ball Professor of Mathematics at the University
      of Oxford, and the most prominent scientific critic of the idea that minds are computers.
      Known for Penrose tilings, twistor theory and work with Stephen Hawking on spacetime
      singularities, he shared the 2020 Nobel Prize in Physics for showing that, in Einstein's
      theory, black holes form under very general conditions. In 'The Emperor's New Mind' (1989) and
      'Shadows of the Mind' (1994) he extended an argument of the philosopher J. R. Lucas: since, by
      Gödel's incompleteness theorems, a consistent formal system cannot prove its own Gödel
      sentence, while mathematicians can see that such sentences are true, human mathematical
      understanding cannot be algorithmic (see [[lucas-penrose-argument|Lucas–Penrose argument]]).
      With the anesthesiologist Stuart Hameroff he proposed that consciousness arises from quantum
      processes in neurons' microtubules. Most logicians and AI researchers reject both proposals,
      but they remain reference points in debates over [[strong-ai|strong AI]] and
      [[machine-consciousness|machine consciousness]].
