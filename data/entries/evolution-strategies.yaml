level: specialist
plain: >-
  A family of evolution-inspired methods for tuning a list of numbers: try many random variations of
  the current best settings, keep those that work better, and adjust how big the variations are as
  you go.
senses:
  - definition: >-
      A class of [[evolutionary-computation|evolutionary algorithms]] for optimizing real-valued
      parameter vectors, in which offspring are generated by adding Gaussian noise to parent vectors
      and the best are selected for the next generation. Notation such as (1+1), (μ, λ) and (μ+λ)
      states how many parents and offspring there are and whether parents compete with their
      offspring. A distinctive feature is self-adaptation of the mutation distribution, from Ingo
      Rechenberg's one-fifth success rule to CMA-ES (covariance matrix adaptation), which learns a
      full covariance matrix and is a standard method for hard black-box optimization in tens to
      hundreds of dimensions. Natural evolution strategies interpret the update as gradient ascent
      on expected fitness under the search distribution. In 2017 researchers at OpenAI showed that
      ES, estimating gradients from many random perturbations evaluated in parallel, could train
      neural-network policies competitively with [[reinforcement-learning|reinforcement learning]].
origin: >-
  Developed from 1964 by Ingo Rechenberg, Hans-Paul Schwefel and Peter Bienert at the Technical
  University of Berlin to optimize aerodynamic shapes and nozzles experimentally; Rechenberg's
  Evolutionsstrategie (1973) set out the theory. Nikolaus Hansen and Andreas Ostermeier introduced
  CMA-ES in 1996, and Tim Salimans and colleagues applied ES to deep reinforcement learning in 2017.
year: 1964
