term: Turing Award
id: turing-award
pos: prop. n.
also:
  - ACM A.M. Turing Award
  - A.M. Turing Award
  - Nobel Prize of computing
domain: hist
domains:
  - people
  - society
level: core
plain: >-
  Nicknamed the 'Nobel Prize of computing', the top honor in computer science, awarded each year
  since 1966 by the Association for Computing Machinery. Several AI pioneers have received it.
senses:
  - definition: >-
      Computing's highest honor, presented each year since 1966 by the Association for Computing
      Machinery (ACM) and named after [[alan-turing|Alan Turing]]; ACM's criterion is technical work
      of major and enduring significance to the field, and since 2014 the award has carried US$1
      million. Recipients honored for work in artificial intelligence include [[marvin-minsky|Marvin
      Minsky]] (1969), [[john-mccarthy|John McCarthy]] (1971), [[allen-newell|Allen Newell]] and
      [[herbert-a-simon|Herbert A. Simon]] (1975), [[edward-feigenbaum|Edward Feigenbaum]] and Raj
      Reddy (1994), Leslie Valiant (2010), [[judea-pearl|Judea Pearl]] (2011),
      [[geoffrey-hinton|Geoffrey Hinton]], [[yann-lecun|Yann LeCun]] and [[yoshua-bengio|Yoshua
      Bengio]] (2018, for deep neural networks), and [[andrew-barto|Andrew Barto]] and
      [[richard-sutton|Richard Sutton]] (2024, for [[reinforcement-learning|reinforcement
      learning]]). The award year names the year honored and is announced the following spring, so
      the deep-learning award was announced in March 2019 and the reinforcement-learning award in
      March 2025.
    example: >-
      The 2018 Turing Award confirmed that deep learning had entered computing's mainstream.
origin: >-
  Established by the ACM in 1966; the first recipient was Alan Perlis, for work on programming
  languages and compilers. The nickname 'Nobel Prize of computing' reflects the absence of a Nobel
  category for computer science.
year: 1966
note: >-
  Not to be confused with the [[turing-test|Turing test]]. AI research was also recognized by the
  2024 [[nobel-prizes-for-ai|Nobel Prizes for AI]].
