plain: >-
  A Swedish-American physicist at MIT who co-founded the Future of Life Institute, which organized
  the 2023 open letter calling for a pause in training the most powerful AI systems.
senses:
  - definition: >-
      Swedish-American physicist at MIT, co-founder (2014) and president of the
      [[future-of-life-institute|Future of Life Institute]] (FLI). Known in cosmology for analyses
      of the cosmic microwave background and for the mathematical universe hypothesis, he turned in
      the 2010s to the risks and benefits of AI. FLI convened the 2015 Puerto Rico conference, whose
      open letter called for research on robust and beneficial AI and was followed by grants funded
      by [[elon-musk|Elon Musk]], and the 2017 meeting that produced the
      [[asilomar-ai-principles|Asilomar AI Principles]]; in March 2023 it published the
      '[[pause-giant-ai-experiments|Pause Giant AI Experiments]]' letter, and in October 2025 the
      [[statement-on-superintelligence|Statement on Superintelligence]], which asks that work toward
      [[superintelligence|superintelligence]] be prohibited until scientists broadly agree it can be
      made safe and controllable and the public strongly backs it. His book 'Life 3.0' (2017)
      surveyed possible AI futures. At MIT his group works on
      [[mechanistic-interpretability|mechanistic interpretability]] and co-introduced
      [[kolmogorov-arnold-network|Kolmogorov–Arnold networks]] (2024).
