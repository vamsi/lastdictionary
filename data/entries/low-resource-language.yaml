term: low-resource language
id: low-resource-language
pos: n.
also:
  - under-resourced language
  - less-resourced language
  - resource-poor language
  - LRL
  - low-resource languages
  - low-resource NLP
domain: data
domains:
  - llm
  - society
level: core
plain: >-
  A language with little digital text, recorded speech or language tools available — often one
  spoken by millions — which makes AI systems much weaker in it than in English.
senses:
  - definition: >-
      A language for which little machine-readable data (raw text, transcribed speech, parallel
      translations, labeled datasets) and few tools (spell-checkers, tokenizers, benchmarks) exist,
      relative to its number of speakers or its importance. Most of the world's roughly 7,000
      languages are low-resource, including some with tens of millions of speakers, while a handful
      led by English dominate web text. Consequences for AI include weaker comprehension and
      generation, more [[hallucination|hallucinations]] and safety failures, and higher costs,
      because [[tokenizer|tokenizers]] trained mainly on English split other languages into many
      more tokens. Web-crawled data labeled as belonging to such languages is often mislabeled,
      boilerplate or machine-translated. Remedies include multilingual pretraining with transfer
      from related languages, per-language [[language-identification|language identification]] and
      filtering, community-led data collection and dedicated benchmarks; initiatives such as
      Masakhane, Meta's No Language Left Behind, Cohere's Aya and FineWeb2 target the gap.
    example: >-
      Our model writes fluent Swahili but stumbles in Tigrinya, a low-resource language with little
      web text.
origin: >-
  In use in computational linguistics and speech technology by the 2000s, alongside
  'less-resourced', 'under-resourced' and 'low-density'. Pratik Joshi and colleagues' 2020 taxonomy
  sorted the world's languages into six classes by available labeled and unlabeled data and found
  that most fall in the poorest classes.
note: >-
  'Low-resource' describes data availability, not a language's richness or its number of speakers,
  and some speakers object to the deficit framing. A language can be well resourced in text but not
  speech, or the reverse.
