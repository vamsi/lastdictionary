plain: >-
  An American computer scientist and statistician who did much to bring probability and statistics
  into machine learning, and who trained many of the field's leaders.
senses:
  - definition: >-
      American computer scientist and statistician whose probabilistic methods and many students
      made him a central figure in [[machine-learning|machine learning]]; after MIT he moved in 1998
      to the University of California, Berkeley, and later also became a researcher at Inria Paris.
      Trained in cognitive science under [[david-rumelhart|David Rumelhart]], he proposed an early
      [[recurrent-neural-network|recurrent neural network]] (the Jordan network, 1986) and, with
      Robert Jacobs, Steven Nowlan and [[geoffrey-hinton|Geoffrey Hinton]], the
      [[mixture-of-experts|mixture of experts]] (1991). He then helped move the field toward
      probabilistic modeling: his work on [[probabilistic-graphical-model|graphical models]] and
      [[variational-inference|variational inference]], on [[latent-dirichlet-allocation|latent
      Dirichlet allocation]] (2003, with David Blei and [[andrew-ng|Andrew Ng]]) and on Bayesian
      nonparametric models joined machine learning with statistics. Many leading researchers trained
      with him, including Ng, Blei, Zoubin Ghahramani and [[percy-liang|Percy Liang]]. He has
      criticized loose talk of artificial intelligence, arguing that the field is better seen as a
      new engineering discipline. Honors include the IEEE John von Neumann Medal (2020) and the
      inaugural World Laureates Association Prize in computer science or mathematics (2022).
