term: differential technological development
id: differential-technological-development
pos: n.
also:
  - differential technology development
  - differential progress
  - d/acc
  - defensive accelerationism
domain: asi
domains:
  - gov
  - safety
level: specialist
plain: >-
  A strategy of speeding up technologies that make us safer and slowing down risky ones, so that
  protections arrive before the dangers they guard against.
senses:
  - definition: >-
      A policy of steering which technologies come first, rather than how fast technology advances
      overall: in Nick Bostrom's 2002 formulation, slowing those that would raise
      [[existential-risk|existential risk]] and speeding those that would reduce it, protective
      technologies above all. Applied to AI, it favors advancing alignment, interpretability,
      evaluation, cybersecurity and biodefense ahead of raw capabilities, so that dangerous
      capabilities arrive in a world already prepared for them. Because the overall direction of
      technology is hard to steer, the strategy emphasizes relative timing and the choices of
      individual researchers, funders and governments. In 2023 the Ethereum co-founder Vitalik
      Buterin popularized a related program, d/acc (defensive, decentralized and differential
      acceleration), positioned between [[effective-accelerationism|effective accelerationism]] and
      calls for a pause, which favors technologies that make defense easier than attack.
    example: >-
      Funding interpretability before scaling the next model is differential technological
      development in practice.
origin: >-
  Proposed by Nick Bostrom in 'Existential Risks' (2002) as a principle for reducing existential
  risk and elaborated in his later work; Vitalik Buterin's November 2023 essay 'My techno-optimism'
  introduced d/acc.
year: 2002
