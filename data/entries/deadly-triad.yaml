      Sutton, R. S. & Barto, A. G. (2018). Reinforcement Learning: An Introduction (2nd ed.), §11.3.
      MIT Press.
  - text: >-
      van Hasselt, H. et al. (2018). Deep Reinforcement Learning and the Deadly Triad.
      arXiv:1812.02648.
    url: https://arxiv.org/pdf/1812.02648
  - text: >-
