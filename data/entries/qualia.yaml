# yaml-language-server: $schema=../schema/entry.schema.json

term: qualia
id: qualia
pos: n.
also:
  - quale
pronunciation: KWAH-lee-uh
domain: mind
labels:
  - contested
level: core
plain: >-
  The individual felt qualities of experience — the particular redness of red, the taste of mint,
  the sting of a burn — that seem impossible to capture fully in words.
senses:
  - definition: >-
      The felt qualities of conscious experience as they present themselves to introspection — what
      it is like to see a particular shade, hear a tone or feel an ache — considered as properties
      distinct from the physical and functional processes that cause them. In philosophy of mind
      qualia are the standard challenge to [[functionalism|functionalism]] and physicalism, pressed
      through thought experiments about inverted spectra, absent qualia (the
      [[philosophical-zombie|philosophical zombie]]) and the [[knowledge-argument|knowledge
      argument]]. Some philosophers use the word neutrally for the phenomenal character of
      experience; others reserve it for properties that are intrinsic, ineffable and private, and
      deny that anything has such properties. Questions about AI consciousness are often put as
      whether a system's internal states have qualia rather than merely carrying information about
      color or damage.
origin: >-
  From Latin qualis, 'of what kind'. Charles Sanders Peirce introduced the singular 'quale' into
  philosophy in 1866; C. I. Lewis gave the word its modern philosophical sense in Mind and the World
  Order (1929). Daniel Dennett's 'Quining Qualia' (1988) is the best-known attack on the concept.
year: 1929
note: >-
  A plural noun; the singular is quale. In AI writing it should refer only to felt experience, not
  to a network's internal [[feature|features]] or representations, which can encode color without
  implying any experience of it.
see_also:
  - phenomenal consciousness
  - hard problem of consciousness
  - knowledge argument
  - philosophical zombie
  - illusionism
  - consciousness
sources:
  - text: Lewis, C. I. (1929). Mind and the World Order. Charles Scribner's Sons.
  - text: >-
      Dennett, D. C. (1988). Quining Qualia. In A. Marcel & E. Bisiach (eds.), Consciousness in
      Contemporary Science. Oxford University Press.
