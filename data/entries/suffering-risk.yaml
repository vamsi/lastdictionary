term: suffering risk
id: suffering-risk
pos: n.
also:
  - s-risk
  - risk of astronomical suffering
domain: asi
domains:
  - safety
  - mind
level: specialist
plain: >-
  A risk that the future contains suffering on a vast scale, far beyond anything in history, for
  example if powerful AI created enormous numbers of suffering beings.
senses:
  - definition: >-
      A risk that the future will hold suffering on a scale dwarfing everything in Earth's history,
      or in the phrase of the researchers who defined the category, 'suffering on an astronomical
      scale'. S-risks overlap with [[existential-risk|existential risks]] but are distinct: a future
      could be full of suffering without extinction, and for those who weigh suffering heavily such
      futures are worse than extinction. Scenarios discussed include misaligned or malevolent AI
      that creates or simulates vast numbers of sentient beings in distress (what Nick Bostrom calls
      mind crime), conflict between AI systems involving threats against what the other side values,
      the spread of practices like factory farming into space, and the lock-in of callous values.
      Research directions include cooperative AI, surrogate goals that deflect threats, and
      preventing AI systems from acquiring sadistic or spiteful dispositions; the questions overlap
      with [[ai-welfare|AI welfare]] and the [[moral-patienthood|moral patienthood]] of
      [[digital-mind|digital minds]].
    example: >-
      For an s-risk researcher, a future of trillions of suffering simulations is worse than no
      future at all.
origin: >-
  Emerged in 2016–2017 at the Foundational Research Institute (now the Center on Long-Term Risk):
  David Althaus and Lukas Gloor's 2016 report 'Reducing Risks of Astronomical Suffering: A Neglected
  Priority' built on Brian Tomasik's essays on astronomical suffering, and the short form s-risk
  spread in effective-altruist circles through Max Daniel's 2017 talk 'S-risks: Why they are the
  worst existential risks, and how to prevent them' and Tobias Baumann's writing. Earliest use not
  established.
year: 2016
