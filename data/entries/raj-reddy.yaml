plain: >-
  An Indian-American computer scientist who pioneered computer speech recognition and large AI
  systems at Carnegie Mellon University, and shared the 1994 Turing Award.
senses:
  - definition: >-
      Indian-American computer scientist at Carnegie Mellon University and a pioneer of
      [[speech-recognition|speech recognition]] and large-scale AI systems. After a Stanford PhD
      (1966) on speech recognition supervised by [[john-mccarthy|John McCarthy]], he moved to
      Carnegie Mellon in 1969, where his group built the Hearsay systems, whose
      [[blackboard-system|blackboard architecture]] let independent knowledge sources cooperate on a
      shared hypothesis, and Harpy (1976), whose pruned search introduced [[beam-search|beam
      search]]; his students went on to create the Dragon and Sphinx recognizers. He was founding
      director of the Carnegie Mellon Robotics Institute (1979–1991) and dean of its School of
      Computer Science (1991–1999), and has long promoted computing for people in developing
      countries. He shared the 1994 [[turing-award|Turing Award]] with [[edward-feigenbaum|Edward
      Feigenbaum]], honored for showing that large AI systems could be built and put to practical
      use, and was its first Asian-born recipient.
