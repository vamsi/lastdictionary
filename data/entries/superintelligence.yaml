term: superintelligence
id: superintelligence
pos: n.
also:
  - superintelligent
  - superhuman intelligence
  - Super Intelligence (SI)
domain: asi
domains:
  - safety
  - mind
  - gov
level: essential
plain: >-
  A mind, usually imagined as an AI, that would leave even the cleverest people far behind in nearly
  every kind of thinking, not just in one game or skill. None is known to exist.
senses:
  - definition: >-
      A hypothetical intellect that would outclass the most capable humans not in one specialty, as
      a chess engine does, but in essentially every kind of intellectual work. The standard
      formulation is [[nick-bostrom|Nick Bostrom]]'s (1997): an intellect 'much smarter than the
      best human brains in practically every field', creative and social abilities included. In 2014
      he distinguished speed superintelligence (a humanlike mind running much faster), collective
      superintelligence (many minds organized to outperform any current system) and quality
      superintelligence (a mind that is qualitatively smarter). Proposed routes include
      [[artificial-general-intelligence|AGI]] followed by an [[intelligence-explosion|intelligence
      explosion]], [[whole-brain-emulation|whole brain emulation]], and enhancement of human brains
      or organizations. The concept anchors debates about the [[control-problem|control problem]],
      [[existential-risk|existential risk]] and [[ai-timelines|AI timelines]]: a superintelligence
      pursuing goals at odds with human interests might be impossible to correct once deployed,
      while a well-aligned one might accelerate science, medicine and economic growth dramatically.
      Since 2023 several [[frontier-lab|frontier laboratories]] have made building or aligning
      superintelligence an explicit objective.
    example: >-
      Our safety case covers today's agents, not anything approaching superintelligence.
  - context: US federal usage
    definition: >-
      The official name, written 'Super Intelligence' and abbreviated SI, that the US executive
      branch uses in place of 'artificial intelligence' and 'AI' under
      [[executive-order-14434|Executive Order 14434]], 'Inaugurating the Era of Super Intelligence'
      (signed 29 September 2026). The order tells executive agencies, to the extent permitted by
      law, to adopt the new terms in their own non-statutory material, such as letters, press
      releases, websites and reports, while leaving earlier regulations, contracts, grants and
      similar records unrevised. It defines Super Intelligence by reference to the statutory
      definition of [[artificial-intelligence|artificial intelligence]] in 15 U.S.C. § 9401(3), so
      the label covers the same existing AI technologies rather than systems surpassing human
      intelligence in the sense above, and it gave the President's science adviser 60 days to
      propose legislative language for a federal definition. The directive applies to federal
      agencies, not to private parties.
    labels:
      - legal
      - emerging
origin: >-
  Earliest use of the word not established. I. J. Good wrote of an 'ultraintelligent machine' in
  1965. Nick Bostrom gave 'superintelligence' its standard definition in 'How Long Before
  Superintelligence?' (first version 1997, published 1998) and brought it into wide use with
  Superintelligence: Paths, Dangers, Strategies (2014). AI companies adopted it in names such as
  OpenAI's Superalignment team (2023), Safe Superintelligence Inc. (2024) and Meta Superintelligence
  Labs (2025); the US federal sense dates from Executive Order 14434 (2026).
year: 1997
note: >-
  Usage has loosened: companies sometimes call systems that beat experts on many benchmarks
  'superintelligent', blurring the line with [[artificial-general-intelligence|AGI]]. Skeptics doubt
  that intelligence is a single scale that can be exceeded across the board.
  [[artificial-superintelligence|Artificial superintelligence (ASI)]] specifies the machine case.
  The 2025 [[statement-on-superintelligence|Statement on Superintelligence]] asked for a ban on
  developing it until scientists broadly agree it can be made safe and controllable and the public
  strongly backs it.
