term: AI whistleblower protections
id: ai-whistleblower-protections
pos: n.
also:
  - AI whistleblowing
  - right to warn
domain: gov
domains:
  - safety
  - society
labels:
  - legal
  - emerging
level: core
plain: >-
  Legal and company safeguards that protect employees of AI companies who report safety dangers or
  legal violations — to regulators or inside the company — from being fired, sued or otherwise
  punished.
senses:
  - definition: >-
      Legal rules and corporate policies that shield workers at AI developers from retaliation when
      they disclose information about serious risks or legal violations, and that limit contracts
      used to silence them. Because frontier-AI risks may be visible only inside companies and need
      not involve any existing legal violation, conventional whistleblower laws, which typically
      protect reports of illegality, were seen as inadequate. California's [[sb-53|SB 53]] (2025)
      protects employees responsible for assessing or managing critical risks who tell authorities
      or managers of what the act calls 'a specific and substantial danger to the public health or
      safety' from catastrophic risk, or of a violation of the act; requires large frontier
      developers to offer an anonymous internal reporting channel; and voids contract terms that
      would prevent such reports. In the EU, the Whistleblower Directive (2019/1937) covers reports
      of breaches of the [[eu-ai-act|EU AI Act]]. A bipartisan federal AI Whistleblower Protection
      Act, led in the Senate by Chuck Grassley, was introduced in Congress in May 2025.
    example: >-
      The engineer used the anonymous channel the company set up under SB 53's whistleblower
      protections.
origin: >-
  Pressed in 2024 after reports that departing OpenAI employees faced restrictive non-disparagement
  agreements; on June 4, 2024, current and former OpenAI and Google DeepMind staff published the
  open letter 'A Right to Warn about Advanced Artificial Intelligence'. [[sb-1047|SB 1047]] included
  protections in 2024, and SB 53 enacted them in 2025.
year: 2024
note: >-
  Coverage is uneven: New York's [[raise-act|RAISE Act]] dropped its whistleblower section in 2026,
  and as of October 2026 the federal bill had not been enacted.
see_also:
  - SB 53
  - SB 1047
