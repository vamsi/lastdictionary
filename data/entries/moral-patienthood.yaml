# yaml-language-server: $schema=../schema/entry.schema.json

term: moral patienthood
id: moral-patienthood
pos: n.
also:
  - moral patient
  - moral status
  - moral considerability
domain: mind
domains:
  - society
  - safety
level: core
plain: >-
  Being the kind of being whose interests matter morally for its own sake, so that it can be
  wronged. Babies and animals count, even though they are not responsible for what they do.
senses:
  - definition: >-
      The status of an entity whose interests or well-being matter morally for the entity's own
      sake, so that it can be wronged and others have reason to take it into account. Moral patients
      need not be moral agents: infants and many animals are patients without being responsible for
      their actions, and the status may come in degrees. Leading proposed grounds are
      [[sentience|sentience]] (the capacity for experiences that feel good or bad), consciousness
      more broadly, and robust agency (having one's own goals, preferences and plans); philosophers
      disagree about which are necessary or sufficient. Whether any AI system is or could become a
      moral patient is the central question of [[ai-welfare|AI welfare]]. Because the evidence is so
      uncertain, recent proposals focus on estimating probabilities and taking proportionate
      precautions rather than waiting for proof.
    example: >-
      Even a small probability of moral patienthood, multiplied across millions of model instances,
      may justify cheap precautions.
origin: >-
  The distinction between moral agents and moral patients became standard in moral philosophy
  through animal ethics, notably Tom Regan's The Case for Animal Rights (1983); its earliest use is
  not established. Its application to machines was developed by David Gunkel in The Machine Question
  (2012), among others, and became a mainstream research topic in the 2020s.
note: >-
  Often used interchangeably with 'moral status', though some authors reserve that phrase for the
  degree of consideration owed. Distinct from legal personhood: corporations have legal personhood
  without moral patienthood, and many animals the reverse; see [[ai-personhood|AI personhood]].
see_also:
  - AI welfare
  - sentience
  - moral agency
  - AI personhood
  - consciousness
  - digital mind
contrast:
  - moral agency
sources:
  - text: Regan, T. (1983). The Case for Animal Rights. University of California Press.
  - text: >-
      Gunkel, D. J. (2012). The Machine Question: Critical Perspectives on AI, Robots, and Ethics.
      MIT Press.
