term: surveillance capitalism
id: surveillance-capitalism
pos: n.
also:
  - behavioral surplus
  - surveillance capitalist
domain: society
domains:
  - gov
  - data
labels:
  - contested
level: core
plain: >-
  A business model in which companies collect huge amounts of data about people's behavior and use
  it to predict and influence what they will do, mainly to sell advertising.
senses:
  - definition: >-
      Shoshana Zuboff's name for an economic order that treats people's lives as a free resource to
      be mined: companies record what users do, keep far more of the resulting data than their
      services need (her 'behavioral surplus'), and use machine learning to turn it into predictions
      of behavior that are sold, above all to advertisers. In her account the business then moves
      from forecasting behavior to steering it through nudges and design, undermining autonomy and
      democracy by creating unprecedented asymmetries of knowledge and power. In AI debates the term
      frames the data-hungry business models behind [[recommender-system|recommender systems]], ad
      targeting and personalized assistants, and the concern that ad-funded conversational AI could
      carry the model into intimate domains. Critics question the novelty of the analysis and the
      real effectiveness of behavioral manipulation.
    example: >-
      If the assistant is free and ad-funded, he warned, it will drift toward surveillance
      capitalism.
origin: >-
  Popularized by Harvard Business School professor Shoshana Zuboff in a 2014 essay, the 2015 article
  'Big Other: Surveillance Capitalism and the Prospects of an Information Civilization' and the book
  The Age of Surveillance Capitalism (2019). John Bellamy Foster and Robert McChesney had used the
  phrase in a different, Marxist sense in Monthly Review in 2014.
year: 2014
