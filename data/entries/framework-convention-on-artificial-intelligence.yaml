term: Framework Convention on Artificial Intelligence
id: framework-convention-on-artificial-intelligence
pos: prop. n.
also:
  - Council of Europe Framework Convention on Artificial Intelligence and Human Rights, Democracy
    and the Rule of Law
  - CETS No. 225
  - Council of Europe AI Convention
  - AI Convention
domain: gov
domains:
  - society
labels:
  - legal
level: core
plain: >-
  The first binding international treaty on AI, drawn up by the Council of Europe, in which
  countries promise that AI used by governments and businesses will respect human rights, democracy
  and the rule of law.
senses:
  - definition: >-
      The Council of Europe Framework Convention on Artificial Intelligence and Human Rights,
      Democracy and the Rule of Law (CETS No. 225), the first international AI treaty with binding
      legal force. Each party must see to it that whatever is done with [[ai-system|AI systems]], at
      any stage of their life cycle, respects human rights, democracy and the rule of law; it must
      give effect to principles such as human dignity and individual autonomy, equality and
      non-discrimination, privacy, transparency and oversight, accountability, reliability and safe
      innovation, and provide remedies, procedural safeguards and risk and impact assessment. As a
      framework treaty it sets obligations of result rather than detailed rules. It covers public
      authorities in full; for private actors, each party may apply the treaty's obligations
      directly or address the risks through other appropriate measures. Activities protecting
      national security are excluded, as is research and development until systems are tested or
      used. A Conference of the Parties oversees implementation.
    example: >-
      Ratifying the Framework Convention would oblige the government to offer remedies against its
      own algorithmic decisions.
origin: >-
  Negotiated from 2022 in the Council of Europe's Committee on Artificial Intelligence (CAI), with
  non-member states such as the United States, Canada, Japan and Israel taking part; adopted by the
  Committee of Ministers on 17 May 2024 and opened for signature in Vilnius on 5 September 2024,
  when the United States, the United Kingdom, the EU and others signed. It enters into force after
  five ratifications, at least three by Council of Europe member states.
year: 2024
note: >-
  By September 2025, 16 states and the EU had signed; the EU ratified on 15 May 2026, but trackers
  still listed the treaty as awaiting entry into force in September 2026. Civil-society critics
  argue that the private-sector option and national-security exclusion weaken it.
