plain: >-
  An American computer scientist who, with his student Richard Sutton, laid the foundations of
  reinforcement learning, the study of how machines learn by trial and error from rewards.
senses:
  - definition: >-
      American computer scientist who from the late 1970s led research at the University of
      Massachusetts Amherst, where he is now professor emeritus, on adaptive networks that learn
      from reward. With his doctoral student [[richard-sutton|Richard Sutton]] and Charles Anderson
      he showed in 1983 that neuron-like adaptive elements could learn to balance a pole on a moving
      cart, an early [[actor-critic|actor–critic]] system, and with Sutton he developed
      [[temporal-difference-learning|temporal difference learning]], relating it to theories of
      animal learning and to [[dynamic-programming|dynamic programming]]. Their textbook
      'Reinforcement Learning: An Introduction' (1998; 2nd ed. 2018) became the field's standard
      reference. His Autonomous Learning Laboratory also explored
      [[hierarchical-reinforcement-learning|hierarchical reinforcement learning]] and
      [[intrinsic-motivation|intrinsic motivation]], and he examined links between
      temporal-difference learning and the brain's dopamine system. He and Sutton shared the 2024
      [[turing-award|Turing Award]] for their foundational work on
      [[reinforcement-learning|reinforcement learning]].
