# yaml-language-server: $schema=../schema/entry.schema.json

term: AI washing
id: ai-washing
pos: n.
also:
  - agent washing
  - AI-washed
domain: society
domains:
  - gov
level: core
plain: >-
  Falsely claiming that a product or company uses AI, or exaggerating how much it does, to look more
  advanced and attract customers or investors.
senses:
  - definition: >-
      The practice of making false, misleading or unsubstantiated claims about the use,
      sophistication or benefits of AI in a product, service, investment process or business, by
      analogy with greenwashing. Forms include rebranding conventional software or human labor as
      AI, implying automation that is actually performed by people (see [[ghost-work|ghost work]]),
      overstating accuracy, and relabeling ordinary automation or chatbots as agentic, sometimes
      called agent washing. It is treated as an enforcement matter: the US Securities and Exchange
      Commission brought its first AI-washing cases, against two investment advisers, in March 2024,
      and the Federal Trade Commission's Operation AI Comply (September 2024) targeted deceptive AI
      claims. Consumer-protection, advertising and securities law in many jurisdictions applies to
      such claims.
    example: >-
      The 'AI-powered' fraud screening turned out to be keyword rules, a clear case of AI washing in
      the prospectus.
origin: >-
  Modeled on 'greenwashing', coined by environmentalist Jay Westerveld in 1986. 'AI washing' was in
  use by the late 2010s for companies inflating their AI credentials (an early definition is
  credited to New York University's AI Now Institute in 2019), though its first use has not been
  established; regulators adopted it from late 2023, when SEC chair Gary Gensler warned against it.
  Gartner applied 'agent washing' in 2025 to vendors rebranding existing products as AI agents.
see_also:
  - AI hype
  - ethics washing
  - hype cycle
  - AI bubble
  - ghost work
  - AI-powered
sources:
  - text: >-
      US Securities and Exchange Commission (2024). Press release, 18 March 2024: charges against
      Delphia (USA) Inc. and Global Predictions Inc. for false and misleading statements about their
      use of artificial intelligence.
as_of: 2026-10
