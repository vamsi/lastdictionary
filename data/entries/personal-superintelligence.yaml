# yaml-language-server: $schema=../schema/entry.schema.json

term: personal superintelligence
id: personal-superintelligence
pos: n.
domain: asi
domains:
  - society
labels:
  - emerging
level: specialist
plain: >-
  Mark Zuckerberg's term for a future AI far smarter than people that would serve each person as
  their own helper, rather than one central system doing everyone's work.
senses:
  - definition: >-
      A vision of [[superintelligence|superintelligence]] as something each person owns and directs:
      an assistant with intimate knowledge of its user's life and aims that helps them create,
      learn, stay connected and pursue their own goals, reached mostly through wearable devices such
      as AI glasses that perceive the world from the wearer's point of view. Meta announced it in
      July 2025 as the mission of [[meta-superintelligence-labs|Meta Superintelligence Labs]],
      setting it against a centralized route in which superintelligence takes over all economically
      valuable work and humanity lives off what it produces. The same letter acknowledged that
      superintelligence brings new safety risks and signaled that Meta would be more cautious about
      what it [[open-weight-model|open-sources]]. Critics regard the phrase as a grand label for
      consumer assistants and [[ai-companion|AI companions]].
    example: >-
      Meta pitches personal superintelligence as something you wear on your face, not something that
      replaces your job.
origin: >-
  Introduced by Mark Zuckerberg in a letter titled 'Personal Superintelligence', published on Meta's
  website on 30 July 2025, weeks after the company formed Meta Superintelligence Labs and recruited
  researchers from rival laboratories with exceptionally large pay offers.
year: 2025
note: >-
  One of several competing framings of what frontier laboratories are building; compare Microsoft
  AI's [[humanist-superintelligence|humanist superintelligence]] and the image of a
  [[country-of-geniuses-in-a-datacenter|country of geniuses in a datacenter]].
see_also:
  - superintelligence
  - Meta Superintelligence Labs
  - humanist superintelligence
  - AI companion
  - artificial superintelligence
  - country of geniuses in a datacenter
sources:
  - text: Zuckerberg, M. (2025). Personal Superintelligence. Meta, 30 July 2025.
    url: https://www.meta.com/superintelligence/
as_of: 2026-10
