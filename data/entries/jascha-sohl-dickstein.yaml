plain: >-
  An American scientist who in 2015, with colleagues, introduced diffusion models, the technique
  behind most modern AI image and video generators, by borrowing ideas from physics.
senses:
  - definition: >-
      American machine-learning researcher who introduced [[diffusion-model|diffusion probabilistic
      models]] in 2015. Trained in physics and theoretical neuroscience (PhD, University of
      California, Berkeley), he proposed, with Eric Weiss, Niru Maheswaranathan and Surya Ganguli at
      Stanford, a generative model inspired by nonequilibrium thermodynamics: a fixed process
      gradually adds noise to data until only noise remains, and a neural network learns to reverse
      it step by step. Little used at first, the idea became the basis of modern image, audio and
      video generation after Jonathan Ho and colleagues' DDPM (2020) and the
      [[score-based-generative-model|score-based]] stochastic-differential-equation formulation he
      co-authored with Yang Song and others (2021). As a principal scientist at
      [[google-brain|Google Brain]] and then Google DeepMind he also worked on infinitely wide
      neural networks, learned optimizers and the BIG-bench benchmark, and co-authored the
      [[levels-of-agi|levels of AGI]] framework (2023). He joined [[anthropic|Anthropic]] in 2024.
